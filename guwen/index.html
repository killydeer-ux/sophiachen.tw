<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古文偵探">
</head>
<body>
<title>古文偵探任務</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@500;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* 版面：球場戰術板。頂部記分板，下面是一張張任務卡；作答區像戰術手冊，文言原文用襯線字。 */
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --ink:#13233A; --muted:#5A6B80; --line:#C9D3DE;
  --court:#2C6A9A; --ball:#E0702A; --ballSoft:#FCE9DC; --paper:#FFF9EF;
  --ok:#1E7A46; --okSoft:#E2F3E8; --bad:#B23A3A; --badSoft:#F9E3E3;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-text:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"Chakra Petch","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1724; --panel:#182334; --ink:#E6EDF5; --muted:#9AAABD; --line:#2D3B50;
  --court:#6FA8D6; --ball:#F08A48; --ballSoft:#3A2618; --paper:#1F2A3B;
  --ok:#5CC98A; --okSoft:#163325; --bad:#F07C7C; --badSoft:#3A1C1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1724; --panel:#182334; --ink:#E6EDF5; --muted:#9AAABD; --line:#2D3B50;
  --court:#6FA8D6; --ball:#F08A48; --ballSoft:#3A2618; --paper:#1F2A3B;
  --ok:#5CC98A; --okSoft:#163325; --bad:#F07C7C; --badSoft:#3A1C1F; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.board{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.board h1{font-family:var(--f-display);font-weight:900;font-size:1.35rem;margin:0;letter-spacing:.04em}
.board .who{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.9rem}.board .who > *{white-space:nowrap}
.board .who button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font-size:.85rem}
.score{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 14px;white-space:nowrap;font-weight:700}
.tab[aria-selected="true"]{border-color:var(--court);color:var(--court)}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.goal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.goal .chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-family:var(--f-num);font-weight:700}
.goal .chip[aria-pressed="true"]{border-color:var(--ball);background:var(--ballSoft);color:var(--ball)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mission{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mission:hover{border-color:var(--court)}
.mission .no{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.mission .t{font-weight:700}
.mission .s{font-size:.85rem;color:var(--muted)}
.mission .st{margin-top:6px;font-size:.85rem;font-weight:700}
.mission.done{border-color:var(--ok)} .mission.done .st{color:var(--ok)}
.mission.quiz{border:2px solid var(--ball)}
.st .shiba{width:1.6em;height:1.6em;margin-right:4px}
.stamp{display:inline-block;width:1.3em;height:1.3em;border-radius:50%;background:var(--ball);color:#fff;font-size:.75rem;line-height:1.3em;text-align:center;margin-right:4px}
h2{font-family:var(--f-display);font-size:1.25rem;margin:0 0 6px;text-wrap:balance}
h3{font-size:1.02rem;margin:0 0 6px;color:var(--court)}
.back{align-self:flex-start;background:transparent;border:none;color:var(--court);font-weight:700;padding:0}
details.teach{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.teach summary{font-weight:700;cursor:pointer}
.teach .item{margin:10px 0}
.teach .item b{color:var(--court)}
.teach .ex{color:var(--ball);font-size:.92rem}
.card{border-left:4px solid var(--court);padding:6px 12px;background:var(--panel)}
.passage{display:flex;flex-direction:column;gap:10px}
.text{font-family:var(--f-text);font-size:1.12rem;line-height:1.9;background:var(--paper);border-radius:10px;padding:12px 14px}
.cite{font-size:.8rem;color:var(--muted);text-align:right}
.notes{font-size:.88rem;color:var(--muted)}
.chart{overflow-x:auto}
.chart table{border-collapse:collapse;width:100%;font-size:.92rem}
.chart td,.chart th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:12px;background:var(--court);border-radius:3px;vertical-align:middle}
.q{border-top:1px dashed var(--line);padding-top:10px}
.q .qt{font-weight:700;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--court);background:color-mix(in srgb,var(--court) 12%,var(--panel))}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default}
.why{margin-top:8px;background:var(--badSoft);border-radius:10px;padding:8px 12px;font-size:.92rem}
.why.okc{background:var(--okSoft)}
.why ol{margin:4px 0;padding-left:1.3em}
input.fill{font:inherit;width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel)}
input.fill.right{border-color:var(--ok)} input.fill.wrong{border-color:var(--bad)}
.actions{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:10px 20px;font-weight:900;background:var(--ball);color:#fff;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.btn.alt{background:var(--court)}
.result{border:2px solid var(--ball);background:var(--ballSoft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--f-num);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.memo{background:var(--badSoft);border-radius:12px;padding:10px 14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.players{display:flex;flex-wrap:wrap;gap:8px}
.players button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
.shiba{display:inline-block;vertical-align:middle;line-height:0}.shiba svg{width:100%;height:100%}
.stamps{display:flex;gap:4px;margin-top:6px}.stamps .shiba{width:30px;height:30px}.stamps{width:100%}.stamps .off{opacity:.3;filter:grayscale(1) brightness(1.6)}
.bigstamp{width:120px;height:120px;margin:6px auto 0}
@media (prefers-reduced-motion:no-preference){.bigstamp{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}}
@keyframes stampin{0%{transform:scale(2.2) rotate(-18deg);opacity:0}60%{transform:scale(.92) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.fx{position:fixed;pointer-events:none;z-index:99;left:0;top:0}
.fx-ring{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid rgba(214,69,47,.55);animation:fxring .6s ease-out forwards}
.fx-petal{width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:9px 0 9px 0;background:#f4a7b0;animation:fxpetal .9s ease-out forwards}
@keyframes fxring{to{transform:scale(4);opacity:0}}
@keyframes fxpetal{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
.mute{background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font:inherit;color:inherit;cursor:pointer}
</style>

<div class="wrap" id="app"></div>

<script>
const DATA = [{"week":1,"groups":[{"no":"第 1 組","title":"守株待兔","skill":"先看題幹＋圈人物補主詞","steps":["❶ 先讀題目：這次要找什麼？（字義？人物？原因？）","❷ 讀原文時，每一句旁邊寫上「誰」","❸ 文言常把主詞省掉：往前一句，找最近出現的人或動物"],"demo":{"q":"「折頸而死」是誰折斷脖子？","a":["題目問「誰」→ 要找主詞","這句沒有主詞，往前一句：「兔走觸株」","答：兔子"]},"parts":[{"label":"第一篇","title":"守株待兔","text":["宋人有耕者，田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔。兔不可復得，而身為宋國笑。"],"cite":"《韓非子．五蠹》","notes":"株：樹樁　走：跑　釋：放下　耒：翻土的農具　冀：希望　身：自己","trans":"宋國有個種田的人，田裡有一截樹樁。一隻兔子跑過來撞到樹樁，折斷脖子死了。他就放下農具守在樹樁旁，希望再撿到兔子。兔子當然不可能再得到，他自己反而被宋國人笑話。","qs":[{"q":"「因釋其耒而守株」是誰放下農具？","opts":["兔子","耕田的宋國人","宋國所有的人","作者韓非"],"ans":"B","steps":["題目問「誰」放下農具 → 找主詞","往前找：第一句「宋人有耕者」，整段講的都是這個耕田的人","兔子已經死了，不可能放下農具"],"tests":"補出被省略的主詞","avoid":"每句旁邊先寫「誰」，往前找最近出現的人"},{"q":"「兔不可復得」是什麼意思？","opts":["兔子再也不可能被他得到","兔子不可以再吃","兔子不能再跑","他不想再抓兔子"],"ans":"A","steps":["「復」：前一句「冀復得兔」也出現，意思是「再」","「得」＝得到","連起來：兔子不可能再得到"],"tests":"用上下文推字義","avoid":"同一個字在文中出現兩次，兩處一起看"},{"q":"「而身為宋國笑」，被笑的是誰？為什麼？","opts":["兔子，因為撞到樹","宋國人，因為田種得好","耕田的人，因為放下工作只等兔子","韓非，因為故事太好笑"],"ans":"C","steps":["注釋：「身」＝自己，指耕田的人","被笑的原因往前找：「釋其耒而守株」放下工作守樹樁","選項 C 兩部分都有證據"],"tests":"人物＋作者態度","avoid":"問「為什麼」就回文中找行為，不用自己猜的"},{"q":"這個故事想提醒我們什麼？","opts":["種田要選好地方","兔子跑太快很危險","樹樁要趕快挖掉","不努力、只想等好運再來，不會有收穫"],"ans":"D","steps":["找結局句：「兔不可復得，而身為宋國笑」","他放下農具只等兔子，兔子沒再來，還被嘲笑","A、B、C 文中都沒講到 → D"],"tests":"抓寓言主旨","avoid":"寓言看結局：主角的下場就是作者的提醒"}]},{"label":"第二篇","title":"司馬光擊甕","text":["光生七歲，凜然如成人，聞講《左氏春秋》，愛之，退為家人講，即了其大指。……群兒戲於庭，一兒登甕，足跌沒水中，眾皆棄去，光持石擊甕破之，水迸，兒得活。"],"cite":"《宋史．司馬光傳》（節選）","notes":"凜然：莊重的樣子　左氏春秋：即《左傳》，一部歷史書　了：明白　大指：大意　甕：大陶缸　跌：失足滑倒　迸：噴出","trans":"司馬光七歲時，就莊重得像大人一樣。他聽人講《左氏春秋》，非常喜愛，回家後講給家人聽，就能說出書的大意。……一群小孩在庭院裡玩，一個小孩爬上大缸，失足掉進水裡，其他小孩都丟下他跑了。司馬光拿石頭砸缸，把缸打破，水噴了出來，那個小孩得救了。","qs":[{"q":"「愛之，退為家人講」是誰回家講給家人聽？","opts":["講《左氏春秋》的老師","司馬光","司馬光的家人","一群小孩"],"ans":"B","steps":["這句沒寫主詞 → 往前找最近出現的人","第一句「光生七歲……聞講《左氏春秋》」，聽講的是光","聽完喜愛、回家講給家人聽的，都是司馬光"],"tests":"補省略的主詞","avoid":"一連串動作沒換人，主詞就沿用前面的"},{"q":"「足跌沒水中」是誰掉進水裡？","opts":["司馬光","全部的小孩","爬上甕的那個小孩","在庭院看守的大人"],"ans":"C","steps":["往前一句：「一兒登甕」","爬上缸、腳滑、掉進水裡，都是同一個小孩","文中沒有大人；司馬光後來是去救人的"],"tests":"補省略的主詞","avoid":"找最近出現的人，再檢查動作接不接得上"},{"q":"「眾皆棄去」的「去」是什麼意思？","opts":["前往","去除","過去","離開"],"ans":"D","steps":["代回「大家都丟下他前往」→ 前往哪裡？不通","代回「大家都丟下他離開」→ 通","後面只剩司馬光救人，其他人確實都離開了"],"tests":"古今異義：去＝離開","avoid":"現代意思代回去怪，就換古代意思"},{"q":"這段文字主要表現司馬光的哪兩個特點？","opts":["愛讀書，遇到危險又冷靜機智","力氣很大，喜歡打破東西","愛玩，常常在庭院玩","膽小，看到危險就逃走"],"ans":"A","steps":["前半：聽講就喜愛，還能講給家人聽 → 愛讀書","後半：別人都跑了，「光持石擊甕破之」→ 冷靜機智","B 只看到砸缸的動作；D 是其他小孩"],"tests":"從行為看人物特點","avoid":"人物特點要從他做的事找，前後都要看"}]},{"label":"第三篇","title":"楊氏之子","text":["梁國楊氏子九歲，甚聰惠。孔君平詣其父，父不在，乃呼兒出。為設果，果有楊梅。孔指以示兒曰：「此是君家果。」兒應聲答曰：「未聞孔雀是夫子家禽。」"],"cite":"《世說新語．言語》","notes":"惠：同「慧」　孔君平：人名　詣：拜訪　設：擺出　應聲：隨著聲音，馬上","trans":"梁國有一戶姓楊的人家，家裡的孩子九歲，非常聰明。孔君平來拜訪孩子的父親，父親不在家，於是叫孩子出來。孩子擺出水果招待他，水果中有楊梅。孔君平指著楊梅給孩子看，說：「這是你家的果子。」孩子馬上回答：「沒聽說過孔雀是您家的鳥。」","qs":[{"q":"「父不在」的「父」是誰的父親？","opts":["孔君平的父親","梁國國君","楊家孩子的父親","孔子"],"ans":"C","steps":["往前找：「孔君平詣其父」，「其」指前面的楊氏子","孔君平是來拜訪楊家孩子的父親","所以「父不在」是孩子的父親不在家"],"tests":"代詞與主詞","avoid":"看到「其」，往前找最近出現的人"},{"q":"「此是君家果」的「君」指的是誰？","opts":["孔君平","楊家的孩子","孩子的父親","梁國國君"],"ans":"B","steps":["說這句話的是孔君平：「孔指以示兒曰」","他是對著孩子說的 → 君＝你，指楊家孩子","楊梅姓「楊」，孔君平開玩笑說是「你家的果子」"],"tests":"找說話對象","avoid":"「君」「子」是「你」，看話是對誰說的"},{"q":"「未聞孔雀是夫子家禽」，孩子的意思是？","opts":["我很喜歡孔雀","孔雀是我家養的","夫子家有很多鳥","沒聽說過孔雀是您家的鳥"],"ans":"D","steps":["「未聞」＝沒有聽說","「夫子」指說話的對象孔君平","孩子用孔雀的「孔」回敬孔君平說的「楊」梅 → D"],"tests":"補出「夫子」是誰","avoid":"先確定每個稱呼指誰，句意就清楚"},{"q":"這篇故事主要表現楊家孩子的什麼特點？","opts":["反應快、說話機智又有禮貌","喜歡吃水果","很會煮飯招待客人","不喜歡孔君平"],"ans":"A","steps":["第一句就說「甚聰惠」","「應聲答曰」：馬上回答，反應快","用「未聞」委婉回敬，沒有罵人 → 機智有禮"],"tests":"人物特點","avoid":"文章開頭的評語常常就是答案"}]},{"label":"第四篇","title":"管寧割席","text":["管寧、華歆共園中鋤菜，見地有片金，管揮鋤與瓦石不異，華捉而擲去之。又嘗同席讀書，有乘軒冕過門者，寧讀如故，歆廢書出看。寧割席分坐，曰：「子非吾友也。」"],"cite":"《世說新語．德行》","notes":"鋤：用鋤頭翻土　捉：拿起　軒冕：大官坐的車和戴的帽子，指大官　廢：放下　席：坐墊","trans":"管寧和華歆一起在園子裡鋤地種菜，看到地上有一塊金子，管寧照樣揮著鋤頭，把它看得和瓦片石頭沒有兩樣；華歆卻撿起來，然後才丟掉。他們又曾經坐在同一張蓆子上讀書，有坐著華麗車子、戴著官帽的大官從門口經過，管寧像原來一樣讀書，華歆卻放下書跑出去看。管寧就把蓆子割開，分開坐，說：「你不是我的朋友。」","qs":[{"q":"「捉而擲去之」是誰把金子撿起來又丟掉？","opts":["管寧","乘車經過的人","華歆","種菜的農夫"],"ans":"C","steps":["這句前面寫「華」，指華歆","「管揮鋤與瓦石不異」是管寧，他根本沒撿","撿起來再丟掉的是華歆"],"tests":"辨認動作的主詞","avoid":"人名只寫一個字時，要對回全名"},{"q":"「廢書出看」是誰放下書出去看？","opts":["管寧","坐車的大官","兩個人一起","華歆"],"ans":"D","steps":["前一句「寧讀如故」：管寧照樣讀書","這句前面寫「歆」，就是華歆","所以不是兩個人一起，只有華歆出去看"],"tests":"辨認動作的主詞","avoid":"兩人對比時，每句旁邊標上是誰"},{"q":"「寧讀如故」是什麼意思？","opts":["管寧像原來一樣繼續讀書","管寧寧可讀書","管寧讀以前的書","管寧讀得很慢"],"ans":"A","steps":["「寧」是管寧的名字，不是「寧可」","「如故」＝像原來一樣（成語「依然如故」）","代回：管寧像原來一樣讀書 → 通"],"tests":"主詞＋字義","avoid":"先想這個字是不是人名"},{"q":"管寧為什麼要割席分坐？","opts":["座位太小坐不下","華歆把書弄壞了","他覺得華歆看重錢財、羨慕富貴，和自己志向不同","華歆搶了他的金子"],"ans":"C","steps":["兩件事：華歆撿金子、華歆放下書去看大官","管寧說「子非吾友也」→ 不想當朋友","原因是華歆的心思放在金錢和富貴上 → C；D 錯，金子被丟掉了"],"tests":"找人物行為的原因","avoid":"原因要從前面發生的事找"}]},{"label":"第五篇","title":"執竿入城","text":["魯有執長竿入城門者，初豎執之，不可入，橫執之，亦不可入，計無所出。俄有老父至，曰：「吾非聖人，但見事多矣，何不以鋸中截而入？」遂依而截之。"],"cite":"《笑林》","notes":"竿：長竹竿　計：辦法　俄：一會兒　老父：老人　但：只是","trans":"魯國有個拿著長竹竿要進城門的人，一開始豎著拿，進不去；橫著拿，也進不去，想不出辦法。一會兒有個老人來了，說：「我不是聖人，只是見過的事情多了，為什麼不用鋸子從中間截斷再進去呢？」那人就照著做，把竹竿鋸斷了。","qs":[{"q":"「計無所出」是誰想不出辦法？","opts":["守城門的人","老人","聖人","拿竹竿的魯國人"],"ans":"D","steps":["往前找：「魯有執長竿入城門者」","豎著拿、橫著拿都進不去的，都是他","文中沒有守門的人；老人是後來才出現"],"tests":"補省略的主詞","avoid":"老人還沒出現前，主角只有一個人"},{"q":"「吾非聖人，但見事多矣」是誰說的？","opts":["老人","拿竹竿的人","聖人","魯國國君"],"ans":"A","steps":["前一句「俄有老父至，曰」","「曰」前面的人是老父","所以說話的是老人；他說自己「不是聖人」，C 錯"],"tests":"找說話的人","avoid":"看「曰」前面最近的人"},{"q":"「遂依而截之」是誰把竹竿鋸斷？","opts":["老人","聖人","拿竹竿的魯國人","守城門的人"],"ans":"C","steps":["「依」＝照著做，照著老人的話做","聽建議的是拿竹竿的人","竹竿是他的，鋸斷竹竿的也是他"],"tests":"主詞換人了","avoid":"說話的人換了，動作的人也可能換"},{"q":"老人說「何不以鋸中截而入」，是什麼建議？","opts":["把城門鋸開","用鋸子把竹竿從中間鋸斷再拿進去","把竹竿丟掉","請聖人來幫忙"],"ans":"B","steps":["「以鋸」＝用鋸子；「中截」＝從中間截斷","「而入」＝然後進城","後面「遂依而截之」截的是竹竿 → B"],"tests":"理解句意","avoid":"一個詞一個詞翻，再接起來"}]}]},{"no":"第 2 組","title":"刻舟求劍","skill":"虛詞當路標＋成語反推字義","steps":["❶ 虛詞是路標：「而」＝然後／但是（看前後同方向還是相反）","　　「故」＝所以　「乃」＝才、於是　「之」＝的、他","❷ 不認得的字：想一個有這個字的成語，把成語裡的意思帶回來"],"demo":{"q":"「從其所契者入水求之」的「求」是什麼意思？","a":["想成語：「緣木求魚」＝爬到樹上找魚","求＝尋找，帶回原句：下水尋找劍，讀得通","答：尋找"]},"parts":[{"label":"第一篇","title":"刻舟求劍","text":["楚人有涉江者，其劍自舟中墜於水，遽契其舟，曰：「是吾劍之所從墜。」舟止，從其所契者入水求之。舟已行矣，而劍不行，求劍若此，不亦惑乎？"],"cite":"《呂氏春秋．察今》","notes":"涉：渡過　遽：急忙　契：用刀刻　是：這裡　惑：糊塗","trans":"楚國有個渡江的人，他的劍從船上掉進水裡，他急忙在船邊刻了記號，說：「這裡是我的劍掉下去的地方。」船停了，他從刻記號的地方下水找劍。船已經走了，劍卻沒有跟著走，像這樣找劍，不是很糊塗嗎？","qs":[{"q":"「舟已行矣，而劍不行」的「而」是什麼意思？","opts":["然後","但是","因為","如果"],"ans":"B","steps":["「舟已行」：船走了","「劍不行」：劍沒走","前後意思相反 → 「而」＝但是"],"tests":"虛詞「而」的轉折用法","avoid":"看「而」前後是同方向還是相反"},{"q":"「其劍自舟中墜於水」的「墜」是什麼意思？","opts":["掉落","追趕","漂浮","沉思"],"ans":"A","steps":["注釋沒有「墜」→ 用成語反推","成語「搖搖欲墜」＝快要掉下來","帶回原句：劍從船上掉到水裡，讀得通"],"tests":"用成語反推字義","avoid":"不認得的字，先想一個有它的成語"},{"q":"作者認為這個楚國人錯在哪裡？","opts":["不會游泳","劍太重","情況已經改變，卻還用原來的方法","沒有請別人幫忙"],"ans":"C","steps":["船會動，劍不會動","他還照著船上的記號找劍","作者用「不亦惑乎」說他糊塗 → 情況變了，方法沒變"],"tests":"抓主旨","avoid":"文末「不亦……乎」通常就是作者的看法"},{"q":"「從其所契者入水求之」的「之」指什麼？","opts":["船","江水","刻的記號","掉下去的劍"],"ans":"D","steps":["「之」可以當「它」，指前面說過的東西","「入水求之」：下水去找它","他要找的是掉進水裡的劍 → D"],"tests":"虛詞「之」指代","avoid":"看到「之」，往前找它代替的東西"}]},{"label":"第二篇","title":"掩耳盜鈴","text":["范氏之亡也，百姓有得鐘者，欲負而走，則鐘大不可負；以椎毀之，鐘況然有音。恐人聞之而奪己也，遽揜其耳。惡人聞之，可也；惡己自聞之，悖矣。"],"cite":"《呂氏春秋．自知》（節選）","notes":"范氏：晉國的貴族范家　負：背　椎：槌子　況然：鐘發出的聲音　揜：同「掩」，遮住　悖：荒謬","trans":"范氏滅亡的時候，有個百姓撿到一口鐘，想背著它跑，可是鐘太大背不動；他就用槌子把鐘敲碎，鐘發出「況況」的響聲。他怕別人聽到聲音來搶鐘，急忙摀住自己的耳朵。怕別人聽到，還說得過去；怕自己聽到，就太荒謬了。","qs":[{"q":"「欲負而走」的「走」是什麼意思？","opts":["慢慢走路","走漏消息","跑","走過去看"],"ans":"C","steps":["想成語「奔走相告」：走＝跑","代回：想背著鐘跑 → 通","撿到別人的鐘，當然想快點跑"],"tests":"成語反推字義","avoid":"古文的「走」常常是跑"},{"q":"「恐人聞之而奪己也」的「而」是什麼意思？","opts":["然後、就","但是","如果","所以"],"ans":"A","steps":["前：別人聽到聲音","後：來搶自己的鐘","先聽到、接著搶，前後同方向 → 然後"],"tests":"虛詞「而」的承接","avoid":"「而」前後同方向＝然後"},{"q":"「惡己自聞之」的「惡」是什麼意思？","opts":["壞人","討厭、怕","兇惡","醜陋"],"ans":"B","steps":["想成語「好逸惡勞」：喜歡安逸、討厭勞動，惡＝討厭","代回：怕自己聽到聲音 → 通","「壞人」「兇惡」代回都不通"],"tests":"成語反推字義","avoid":"一個字有好幾個讀音時，用成語幫忙"},{"q":"作者說「悖矣」，認為這個人哪裡荒謬？","opts":["不該把鐘敲碎","鐘太大了","偷東西會被抓","以為摀住自己的耳朵，別人就聽不到"],"ans":"D","steps":["前半：「惡人聞之，可也」怕別人聽到還說得過去","後半：「惡己自聞之，悖矣」摀自己的耳朵才荒謬","成語「掩耳盜鈴」：自己騙自己 → D"],"tests":"抓作者看法","avoid":"文末的評語就是作者的看法"}]},{"label":"第三篇","title":"囊螢夜讀","text":["胤恭勤不倦，博學多通。家貧不常得油，夏月則練囊盛數十螢火以照書，以夜繼日焉。"],"cite":"《晉書．車胤傳》（節選）","notes":"胤：車胤，晉朝人　恭勤：恭敬勤奮　練囊：白色絹布做的袋子　盛：裝","trans":"車胤恭敬勤奮、不知疲倦，學問廣博又通達。家裡窮，常常沒有燈油，夏天就用白絹做的袋子裝幾十隻螢火蟲來照著書本，用晚上接續白天地讀書。","qs":[{"q":"「恭勤不倦」的「倦」是什麼意思？","opts":["疲累","捲起來","倒下","圈起來"],"ans":"A","steps":["想成語「孜孜不倦」：一直努力不覺得累","倦＝疲累","代回：恭敬勤奮不覺得累 → 通"],"tests":"成語反推字義","avoid":"字長得像不代表意思一樣，用成語確認"},{"q":"「夏月則練囊盛數十螢火」的「則」是什麼意思？","opts":["規則","但是","就、便","好像"],"ans":"C","steps":["前：家裡窮，常常沒有燈油","後：夏天就用袋子裝螢火蟲照書","前面是困難，後面是辦法 → 則＝就"],"tests":"虛詞「則」","avoid":"「則」常接在條件後面，翻成「就」"},{"q":"「以夜繼日」是什麼意思？","opts":["晚上睡覺、白天讀書","用晚上接著白天，日夜不停地讀書","只在白天讀書","每天晚上看螢火蟲"],"ans":"B","steps":["想成語「夜以繼日」：晚上接著白天，不停做事","代回：用晚上接續白天，一直讀書","前面「以照書」也證明晚上在讀書 → B"],"tests":"成語反推句意","avoid":"長得像成語的句子，直接借成語的意思"},{"q":"根據本文，車胤用螢火蟲照書的原因是？","opts":["螢火蟲比油燈亮","他喜歡抓螢火蟲","夏天太熱不能點燈","家裡窮，常常沒有燈油"],"ans":"D","steps":["找原因句：「家貧不常得油」","「則」後面才是辦法：用螢火蟲照書","A、B、C 文中都沒寫"],"tests":"找原因","avoid":"「則」前面常是原因或條件"}]},{"label":"第四篇","title":"鑿壁偷光","text":["匡衡字稚圭，勤學而無燭。鄰舍有燭而不逮，衡乃穿壁引其光，以書映光而讀之。邑人大姓文不識，家富多書，衡乃與其傭作而不求償。主人怪問衡，衡曰：「願得主人書遍讀之。」主人感歎，資給以書，遂成大學。"],"cite":"《西京雜記》","notes":"匡衡：漢朝人　逮：到達　邑人：同鄉的人　大姓：大戶人家　文不識：人名　傭作：做工　資給：借給、資助　大學：大學問家","trans":"匡衡，字稚圭，勤奮讀書卻沒有蠟燭。鄰居家有蠟燭，但光照不到他家，匡衡就在牆上鑿個洞，把光引過來，讓書映著光來讀。同鄉有個大戶人家叫文不識，家裡有錢、書很多，匡衡就去他家做工，卻不要工錢。主人覺得奇怪，問他原因，匡衡說：「希望能讀遍主人家的書。」主人很感動，就把書借給他讀，匡衡後來成了大學問家。","qs":[{"q":"「勤學而無燭」的「而」是什麼意思？","opts":["然後","但是","所以","因為"],"ans":"B","steps":["前：很勤勞讀書","後：沒有蠟燭","讀書需要燈，卻沒有，前後相反 → 但是"],"tests":"虛詞「而」的轉折","avoid":"看「而」前後是同方向還是相反"},{"q":"「衡乃穿壁引其光」的「乃」是什麼意思？","opts":["是","你的","於是、就","竟然"],"ans":"C","steps":["前：鄰居的燭光照不到","後：匡衡就在牆上鑿洞引光","前面是困難，後面是想出的辦法 → 於是"],"tests":"虛詞「乃」","avoid":"「乃」後面常是接著做的事"},{"q":"「衡乃與其傭作而不求償」的「償」是什麼意思？","opts":["工錢、報酬","品嘗","道歉","賞賜的官位"],"ans":"A","steps":["想成語「得不償失」：得到的抵不過失去的，償＝抵、回報","代回：幫他做工卻不要工錢 → 通","後面他只要「主人書」，證明不要錢"],"tests":"成語反推字義","avoid":"想成語後，一定要代回原句檢查"},{"q":"匡衡去文不識家做工，真正想要的是什麼？","opts":["賺錢買蠟燭","住進大房子","當主人家的僕人","讀遍主人家的書"],"ans":"D","steps":["找匡衡說的話：「願得主人書遍讀之」","前面說他「不求償」，所以不是要錢","→ D"],"tests":"找人物的目的","avoid":"問人物想要什麼，就找他說的話"}]},{"label":"第五篇","title":"學弈","text":["弈秋，通國之善弈者也。使弈秋誨二人弈，其一人專心致志，惟弈秋之為聽；一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之。雖與之俱學，弗若之矣。為是其智弗若與？曰：非然也。"],"cite":"《孟子．告子上》（節選）","notes":"弈：下棋　通國：全國　鴻鵠：天鵝　援：拉　繳：繫著絲繩的箭　俱：一起","trans":"弈秋是全國最會下棋的人。讓弈秋教兩個人下棋，其中一人專心一志，只聽弈秋講解；另一人雖然也在聽，心裡卻一直以為有天鵝要飛來，想拉弓搭箭去射牠。雖然和前一個人一起學，成績卻比不上他。是因為他的聰明才智比不上前一個人嗎？回答是：不是這樣的。","qs":[{"q":"「使弈秋誨二人弈」的「誨」是什麼意思？","opts":["後悔","教導","下棋","比賽"],"ans":"B","steps":["想成語「誨人不倦」：教導別人不覺得累","代回：讓弈秋教兩個人下棋 → 通","「後悔」是「悔」，字不一樣"],"tests":"成語反推字義","avoid":"部首不同，意思就不同，要看清楚"},{"q":"「一人雖聽之」的「雖」是什麼意思？","opts":["雖然","因為","所以","於是"],"ans":"A","steps":["前：這個人也在聽","後：心裡卻想著射天鵝","前後轉彎 → 雖然……卻"],"tests":"虛詞「雖」","avoid":"「雖」後面常接轉彎的句子"},{"q":"「弗若之矣」是誰比不上誰？","opts":["弈秋比不上兩個學生","專心的人比不上分心的人","兩個人下得一樣好","分心的人比不上專心的人"],"ans":"D","steps":["「弗若」＝不如；「之」指前面另一個人","這句接在想射天鵝的人後面，主詞是他","分心的人比不上專心的人 → D"],"tests":"虛詞「之」指代","avoid":"「之」代替誰，往前找另一個人"},{"q":"作者認為兩人學習結果不同的原因是？","opts":["專心程度不同，不是聰明才智不同","分心的人比較笨","老師偏心","天鵝真的飛來打擾"],"ans":"A","steps":["作者問「為是其智弗若與」：是因為他不夠聰明嗎？","回答「非然也」：不是這樣","前面寫一人專心、一人分心 → 差別在專心 → A"],"tests":"抓主旨","avoid":"自問自答的句子，答的部分就是重點"}]}]},{"no":"第 3 組","title":"畫蛇添足","skill":"選項代回去讀","steps":["❶ 把四個選項的意思，一個一個放回原句","❷ 讀起來通順、和前後文不矛盾的才留下","❸ 剩兩個時，回文章找哪一個有證據"],"demo":{"q":"「蛇固無足」的「固」是什麼意思？（堅固／本來／固執）","a":["代回「蛇堅固沒有腳」→ 不通","代回「蛇本來就沒有腳」→ 通，而且符合常識","答：本來"]},"parts":[{"label":"第一篇","title":"畫蛇添足","text":["楚有祠者，賜其舍人卮酒。舍人相謂曰：「數人飲之不足，一人飲之有餘。請畫地為蛇，先成者飲酒。」一人蛇先成，引酒且飲之，乃左手持卮，右手畫蛇，曰：「吾能為之足。」未成，一人之蛇成，奪其卮曰：「蛇固無足，子安能為之足？」遂飲其酒。為蛇足者，終亡其酒。"],"cite":"《戰國策．齊策》","notes":"祠：祭祀　舍人：門客　卮：古代酒器　引：拿過來　子：你","trans":"楚國有個祭祀的人，賞給門客們一壺酒。門客們商量：「幾個人喝不夠，一個人喝有剩。我們在地上畫蛇，先畫好的人喝酒。」有一個人先畫好了，拿過酒準備喝，就左手拿酒器、右手繼續畫，說：「我還能幫蛇畫腳。」腳還沒畫完，另一個人的蛇畫好了，搶過酒器說：「蛇本來就沒有腳，你怎麼能幫它畫腳？」就把酒喝了。幫蛇畫腳的人，最後失去了他的酒。","qs":[{"q":"「子安能為之足」的「安」是什麼意思？","opts":["安全","怎麼","安靜","放置"],"ans":"B","steps":["代回：「你安全能幫它畫腳」→ 不通","代回：「你怎麼能幫它畫腳」→ 通，而且是在責問","「安靜」「放置」代回也不通"],"tests":"選項代回法判斷字義","avoid":"四個都代回去讀一次，不要看到熟悉的意思就選"},{"q":"「終亡其酒」的「亡」是什麼意思？","opts":["死亡","逃走","失去","滅亡"],"ans":"C","steps":["代回：「最後死了他的酒」「最後逃走他的酒」→ 不通","代回：「最後失去了他的酒」→ 通，酒被別人喝掉了","也可以想成語「亡羊補牢」：亡＝丟失"],"tests":"一字多義：亡不一定是死","avoid":"常見意思代回去不通，就換另一個意思"},{"q":"「遂飲其酒」是誰喝了酒？","opts":["第一個畫完蛇的人","第二個畫完蛇的人","祭祀的主人","所有門客"],"ans":"B","steps":["往前找：「一人之蛇成，奪其卮曰……」","搶酒器、說話、喝酒，中間沒有換人","所以喝酒的是第二個畫完蛇的人"],"tests":"連續動作的主詞","avoid":"一連串動作沒換主詞，主詞就是同一個人"},{"q":"「引酒且飲之」的「且」是什麼意思？","opts":["而且","暫且","並且","將要"],"ans":"D","steps":["代回「拿過酒而且喝」「拿過酒暫且喝」→ 讀起來怪","代回「拿過酒將要喝」→ 通，他還沒喝就去畫腳","後面酒被搶走，證明他「還沒喝」→ 將要"],"tests":"選項代回判斷虛詞","avoid":"四個都代回，再用後文檢查"}]},{"label":"第二篇","title":"智子疑鄰","text":["宋有富人，天雨牆壞。其子曰：「不築，必將有盜。」其鄰人之父亦云。暮而果大亡其財，其家甚智其子，而疑鄰人之父。"],"cite":"《韓非子．說難》（節選）","notes":"雨：下雨　築：修補　云：說","trans":"宋國有個富人，下雨把牆淋壞了。他的兒子說：「不修好，一定會有小偷。」鄰居家的老人也這樣說。晚上果然丟了很多財物，這家人認為兒子很聰明，卻懷疑是鄰居老人偷的。","qs":[{"q":"「暮而果大亡其財」的「亡」是什麼意思？","opts":["丟失","逃亡","死去","忘記"],"ans":"A","steps":["代回「晚上果然大大死去財物」→ 不通","代回「晚上果然丟失很多財物」→ 通","前面說「必將有盜」，被偷就是丟失"],"tests":"選項代回判斷字義","avoid":"四個都代回，配合前文檢查"},{"q":"「其家甚智其子」的「智」是什麼意思？","opts":["智慧","認為……聰明","讓……變聰明","聰明的人"],"ans":"B","steps":["代回「家人讓兒子變聰明」→ 家人做不到，不合理","代回「家人認為兒子很聰明」→ 通，兒子的預言成真","後面「疑鄰人之父」是相反的態度，對照著讀"],"tests":"選項代回判斷字義","avoid":"形容詞當動詞用，常是「認為……」"},{"q":"「暮而果大亡其財」的「果」是什麼意思？","opts":["水果","結果","果然","果斷"],"ans":"C","steps":["代回「晚上水果……」不通","代回「晚上果然被偷」→ 通，前面說過「必將有盜」","預言的事真的發生 → 果然"],"tests":"選項代回判斷字義","avoid":"前文的預言＋後文成真＝果然"},{"q":"富人一家為什麼懷疑鄰居老人？","opts":["老人說的話和兒子不同","有人看到老人晚上來過","老人家裡很窮","同樣的話，只因為是外人說的就被懷疑"],"ans":"D","steps":["「其鄰人之父亦云」：老人說的話和兒子一樣","A 和文意相反；B、C 文中沒有","同樣的話，對兒子稱讚、對老人懷疑 → D"],"tests":"抓主旨","avoid":"「亦」＝也，表示兩人說的一樣"}]},{"label":"第三篇","title":"朝三暮四","text":["狙公賦芧，曰：「朝三而暮四。」眾狙皆怒。曰：「然則朝四而暮三。」眾狙皆悅。名實未虧而喜怒為用，亦因是也。"],"cite":"《莊子．齊物論》（節選）","notes":"狙：獼猴　狙公：養猴子的人　芧：橡實，猴子的食物　因：順著","trans":"養猴子的人分橡實給猴子，說：「早上三顆，晚上四顆。」猴子們都很生氣。他又說：「那麼早上四顆，晚上三顆。」猴子們都很高興。名稱和實際數量都沒有減少，猴子卻因此一會兒生氣、一會兒高興，這也只是順著猴子的心理罷了。","qs":[{"q":"「狙公賦芧」的「賦」是什麼意思？","opts":["寫詩","分給","稅金","天生的"],"ans":"B","steps":["代回「養猴人寫詩橡實」→ 不通","代回「養猴人分給猴子橡實」→ 通","後面說早上幾顆、晚上幾顆，就是在分食物"],"tests":"選項代回判斷字義","avoid":"代回後再看後文有沒有證據"},{"q":"「然則朝四而暮三」的「然則」是什麼意思？","opts":["然而","雖然","那麼","竟然"],"ans":"C","steps":["代回「然而早上四顆」→ 前面沒有相反的意思，不順","代回「那麼早上四顆、晚上三顆」→ 通，是換個說法","猴子生氣後，養猴人提出新辦法 → 那麼"],"tests":"選項代回判斷虛詞","avoid":"虛詞也能代回，看前後怎麼接"},{"q":"「朝三而暮四」的「朝」是什麼意思？","opts":["早上","朝代","面向","朝廷"],"ans":"A","steps":["和後面的「暮」（傍晚）相對","代回：早上三顆、傍晚四顆 → 通","「朝代、朝廷、面向」代回都不通"],"tests":"選項代回判斷字義","avoid":"找和它相對的字，一起看"},{"q":"「名實未虧而喜怒為用」說的是？","opts":["猴子吃到的變多了","養猴人很生氣","猴子變聰明了","總數沒有變少，猴子的喜怒卻跟著改變"],"ans":"D","steps":["三加四、四加三都是七顆","「未虧」＝沒有減少","數量沒變，猴子卻一怒一喜 → D"],"tests":"理解句意","avoid":"自己算一算，用證據排除選項"}]},{"label":"第四篇","title":"對牛彈琴","text":["公明儀為牛彈清角之操，伏食如故。非牛不聞，不合其耳矣。轉為蚊虻之聲，孤犢之鳴，即掉尾奮耳，蹀躞而聽。"],"cite":"《弘明集．牟子理惑論》（節選）","notes":"公明儀：古代音樂家　清角之操：一種高雅的琴曲　蚊虻：蚊子和牛虻　犢：小牛　掉：搖動　蹀躞：小步走動","trans":"公明儀為牛彈奏一首高雅的琴曲，牛照樣趴著吃草。不是牛沒聽見，是這曲子不適合牠的耳朵。他改彈像蚊子、牛虻飛的嗡嗡聲，和小牛找媽媽的叫聲，牛就搖著尾巴、豎起耳朵，小步走來走去地聽。","qs":[{"q":"「伏食如故」的意思是？","opts":["牛趴著，像原來一樣吃草","牛吃得比原來多","牛跑去找老朋友","牛害怕得趴下"],"ans":"A","steps":["「如故」想成語「依然如故」，故＝原來的樣子","代回：牛趴著吃草，和原來一樣 → 通","後面說「不合其耳」，牛沒反應，符合"],"tests":"選項代回判斷句意","avoid":"代回後用下一句檢查"},{"q":"「不合其耳矣」的「合」是什麼意思？","opts":["合起來","適合","合唱","全部"],"ans":"B","steps":["代回「不合起來牠的耳朵」→ 不通","代回「不適合牠的耳朵」→ 通","前一句「非牛不聞」：牛不是沒聽到，是不喜歡"],"tests":"選項代回判斷字義","avoid":"一個字的常見意思不通，就換一個"},{"q":"「轉為蚊虻之聲」的「轉」是什麼意思？","opts":["旋轉","轉交","改成","轉身"],"ans":"C","steps":["代回「旋轉成蚊子的聲音」→ 不通","代回「改成彈蚊子的聲音」→ 通","前面彈高雅曲子沒用，所以換別的"],"tests":"選項代回判斷字義","avoid":"想想前一件事沒用，後面才要「改」"},{"q":"這篇故事告訴我們什麼？","opts":["牛的耳朵聽不見","彈琴一定要彈得很大聲","小牛最喜歡聽音樂","說話做事要看對象，用對方能接受的方式"],"ans":"D","steps":["「非牛不聞」→ A 錯","換成牛熟悉的聲音，牛就專心聽","可見要配合對象 → D；B 有絕對字「一定」"],"tests":"抓主旨","avoid":"比較故事前後的不同，就是道理"}]},{"label":"第五篇","title":"曾子殺彘","text":["曾子之妻之市，其子隨之而泣。其母曰：「女還，顧反為女殺彘。」妻適市來，曾子欲捕彘殺之。妻止之曰：「特與嬰兒戲耳。」曾子曰：「嬰兒非與戲也。……今子欺之，是教子欺也。……」遂烹彘也。"],"cite":"《韓非子．外儲說左上》（節選）","notes":"彘：豬　女：同「汝」，你　顧反：等我回來　特：只是　嬰兒：小孩","trans":"曾子的妻子要去市場，兒子跟在後面哭。母親說：「你回去，等我回來替你殺豬。」妻子從市場回來，曾子就要抓豬來殺。妻子阻止他說：「只是和小孩開玩笑罷了。」曾子說：「小孩是不能和他開玩笑的。……現在你欺騙他，就是教孩子騙人。……」於是殺了豬煮給孩子吃。","qs":[{"q":"「曾子之妻之市」的第二個「之」是什麼意思？","opts":["的","他","前往","這個"],"ans":"C","steps":["代回「曾子的妻子的市場」→ 不通","代回「曾子的妻子前往市場」→ 通","後面「妻適市來」從市場回來，證明她去了市場"],"tests":"選項代回判斷虛詞","avoid":"同一句出現兩個「之」，要分開判斷"},{"q":"「其子隨之而泣」的「之」指誰？","opts":["曾子的妻子","曾子","市場","豬"],"ans":"A","steps":["代回「兒子跟著曾子哭」→ 可是要出門的是妻子","代回「兒子跟著媽媽哭」→ 通","後面「其母曰」也證明孩子跟著的是母親"],"tests":"選項代回找指代","avoid":"代回後，用下一句檢查"},{"q":"「特與嬰兒戲耳」的「戲」是什麼意思？","opts":["演戲","開玩笑、逗著玩","看戲","比賽"],"ans":"B","steps":["代回「只是和小孩演戲」→ 怪","代回「只是和小孩開玩笑罷了」→ 通","她的意思是殺豬只是哄孩子的話，不是真的"],"tests":"選項代回判斷字義","avoid":"注意說話的人想表達什麼"},{"q":"曾子堅持殺豬，理由是？","opts":["家裡本來就要殺豬過節","孩子吵著要吃肉","妻子答應了鄰居","父母騙孩子，等於教孩子騙人"],"ans":"D","steps":["找曾子的話：「今子欺之，是教子欺也」","騙孩子就等於教孩子騙人，所以一定要說到做到 → D","A、B、C 文中都沒有"],"tests":"找人物的理由","avoid":"問人物的理由，就找他說的話"}]}]},{"no":"第 4 組","title":"籃球的三秒規則","skill":"白話找證據四招","steps":["❶ 先讀題、再讀文：知道要找什麼再讀","❷ 轉折、總結詞後面是重點：但是、然而、其實、所以","❸ 絕對字警戒：選項有「都、一定、只、所有」先打問號","❹ 文中有證據才選：指得出第幾段哪一句"],"demo":{"q":"限制區在球場的哪裡？","a":["回第一段找：「籃框前方有一塊……長方形區域」","找得到證據句","答：籃框前方"]},"parts":[{"label":"第一篇","title":"籃球的三秒規則","text":["在籃球場上，籃框前方有一塊顏色不同的長方形區域，叫做「限制區」，也有人叫它「禁區」。規則規定：進攻的一方，球員不能在這塊區域裡連續停留超過三秒，否則就是「三秒違例」，球權要交給對手。","很多人第一次聽到會覺得奇怪：站在籃框旁邊最容易得分，為什麼不能一直站？其實，正是因為那裡最容易得分，才需要限制。如果長得高的球員可以一直守在籃下，比賽就會變成「誰最高誰贏」，其他球員的跑位、傳球都變得不重要。","所以，三秒規則表面上是在限制球員，實際上是逼大家多移動、多傳球，讓比賽更公平，也更好看。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"這篇文章最適合的一句話摘要是？","opts":["限制區是一塊顏色不同的區域","三秒規則限制進攻球員站位，目的是讓比賽更公平好看","長得高的球員一定會贏","傳球比投籃重要"],"ans":"B","steps":["摘要＝說了什麼＋為什麼","第一段講規則內容，第三段講目的，B 兩者都有","A 只是第一段的細節；C 有絕對字「一定」；D 文中沒有比較"],"tests":"統整全文寫摘要","avoid":"摘要要涵蓋頭和尾，只講一段的是細節"},{"q":"根據本文，下列何者正確？","opts":["防守球員也不能在限制區停留超過三秒","三秒違例的話，球權要交給對手","所有長得高的球員都討厭這個規則","三秒規則讓比賽變成誰高誰贏"],"ans":"B","steps":["A：文中只寫「進攻的一方」，沒有講防守 → 沒證據","B：第一段「球權要交給對手」→ 有證據","C：絕對字「所有」，文中也沒說；D：和第二段意思相反"],"tests":"逐項找證據","avoid":"就算自己知道的球賽規則，文中沒寫就不能選"},{"q":"作者的結論寫在哪個詞後面？","opts":["也有人","否則","所以","如果"],"ans":"C","steps":["結論通常在總結詞後面","第三段開頭「所以」，後面說出規則真正的目的","A、B、D 後面接的都是細節或假設"],"tests":"用總結詞找重點","avoid":"看到「所以、可見、總之」就畫線"},{"q":"根據第二段，如果沒有三秒規則，可能會怎樣？","opts":["比賽會更公平","大家會更常傳球","防守球員容易受傷","比賽可能變成誰最高誰贏"],"ans":"D","steps":["第二段：「如果長得高的球員可以一直守在籃下，比賽就會變成『誰最高誰贏』」","A、B 是「有」規則時的好處，和題目相反；C 文中沒寫","→ D"],"tests":"找假設句的證據","avoid":"題目說「如果」，就回文中找「如果」"}]},{"label":"第二篇","title":"先看到閃電，再聽到雷聲","text":["下雷雨時，我們常常先看到天空一亮，過了幾秒，才聽到「轟隆」一聲。很多人以為，閃電和雷聲是先後發生的兩件事。其實，閃電和雷聲是同時產生的。","那為什麼聽起來有先後呢？因為光和聲音跑的速度差很多。光跑得非常快，閃電一發生，光幾乎馬上就到我們眼前；聲音就慢多了，要花一些時間才能傳過來。這就像一場賽跑：光是飛毛腿，聲音是慢慢走的烏龜，兩個同時起跑，光一下子就到終點，聲音卻還在半路上。","此外，看到閃電以後，數一數過了多久才聽到雷聲，還能大概知道閃電離我們多遠：隔的時間越長，閃電越遠；隔的時間越短，閃電越近。所以，下次打雷時不妨數一數，當個小小氣象觀察員。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"作者把光和聲音比喻成什麼？","opts":["閃電和雷雨","飛毛腿和烏龜","氣象員和觀眾","天空和地面"],"ans":"B","steps":["看到「就像」就畫線，回第二段找","第二段：「這就像一場賽跑：光是飛毛腿，聲音是慢慢走的烏龜」","→ B"],"tests":"找比喻","avoid":"看到「像、好比」就畫線"},{"q":"根據本文，下列哪一項「不是」文中說的？","opts":["光跑得非常快","聲音要花一些時間才能傳過來","隔的時間越短，閃電越近","閃電一定比雷聲早發生"],"ans":"D","steps":["A、B：第二段有；C：第三段有","D：有絕對字「一定」，而且第一段說兩者「是同時產生的」","→ D"],"tests":"逐項找證據","avoid":"題目有「不」，先圈起來再作答"},{"q":"第一段作者真正想說的是哪一句？","opts":["下雷雨時，常常先看到天空一亮","很多人以為閃電和雷聲是先後發生的","閃電和雷聲是同時產生的","過了幾秒才聽到轟隆一聲"],"ans":"C","steps":["轉折詞「其實」後面是作者真正想說的","第一段：「其實，閃電和雷聲是同時產生的」","B 是作者要反駁的想法；A、D 是細節 → C"],"tests":"用轉折詞找重點","avoid":"「其實」後面那句先畫線"},{"q":"第三段開頭的「此外」，表示這一段要做什麼？","opts":["補充另一個和閃電、雷聲有關的知識","反對第二段的說法","舉一個失敗的例子","說明光一秒跑多遠"],"ans":"A","steps":["「此外」＝除了前面說的，還有","第三段講用雷聲隔多久，判斷閃電遠近，是另一個新知識","不是反對；D 文中沒有寫數字 → A"],"tests":"連接詞的作用","avoid":"「此外、而且」是補充，不是轉彎"}]},{"label":"第三篇","title":"狗狗在讀報紙","text":["帶狗散步時，你可能發現牠走幾步就停下來，低頭聞電線桿、聞草地，怎麼拉都不肯走。很多人以為狗狗只是貪玩，但其實，牠正在「讀報紙」。","狗的嗅覺比人類靈敏得多。其他狗留下的氣味，就像一則一則的訊息，可能告訴牠：誰來過這裡、大概多久以前經過。狗狗用鼻子收集這些消息，就像我們看新聞一樣。","所以，散步時不妨多給狗狗一點時間聞一聞。對牠來說，這不只是走路，也是在認識附近的世界。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"作者說狗狗在「讀報紙」，指的是什麼？","opts":["狗狗喜歡咬報紙","狗狗用鼻子聞氣味，收集訊息","狗狗看得懂字","狗狗在找食物"],"ans":"B","steps":["第一段：「但其實，牠正在『讀報紙』」","第二段解釋：氣味像訊息，「狗狗用鼻子收集這些消息」","→ B"],"tests":"找引號詞的意思","avoid":"加引號的詞，答案常在下一段"},{"q":"根據本文，下列何者正確？","opts":["狗的嗅覺比人類靈敏得多","狗狗散步停下來，都是因為貪玩","所有的狗都不喜歡散步","狗狗只靠眼睛認識世界"],"ans":"A","steps":["A：第二段第一句有證據","B：有絕對字「都」，而且作者說「其實」不是貪玩","C 文中沒有；D 和全文相反"],"tests":"逐項找證據","avoid":"絕對字的選項先打問號"},{"q":"作者在第三段給讀者什麼建議？","opts":["散步時拉著狗快點走","不要讓狗狗聞電線桿","散步時多給狗狗一點時間聞一聞","每天帶狗去看新聞"],"ans":"C","steps":["總結詞「所以」後面是建議","第三段：「散步時不妨多給狗狗一點時間聞一聞」","→ C"],"tests":"用總結詞找重點","avoid":"看到「所以」就畫線"},{"q":"第一段的「但其實」前後，作者怎麼安排？","opts":["前面講原因，後面講結果","前後說的是同一個意思","前面講狗，後面講人","前面是一般人的誤會，後面是真正的答案"],"ans":"D","steps":["「但其實」前：「很多人以為狗狗只是貪玩」","後：「牠正在讀報紙」","轉折詞前是誤會，後是作者要說的 → D"],"tests":"轉折詞前後關係","avoid":"轉折詞後面才是作者的意思"}]},{"label":"第四篇","title":"籃球是怎麼發明的","text":["籃球是在一八九一年發明的。當時在美國的一所學校裡，正值冬天，天氣太冷，學生不能到戶外運動，待在室內又覺得無聊，學校就請體育老師奈史密斯想一種可以在室內玩的球類遊戲。","奈史密斯想：如果目標放在高處，球員就不能只靠蠻力把球砸進去，而要練習準度。於是他把兩個裝桃子的籃子釘在體育館的欄杆上，當作球框。","不過，早期的籃子是有底的，每次進球，都要有人爬梯子把球拿出來，比賽常常被打斷。後來，人們把籃子的底拿掉，才慢慢變成今天看到的籃框和籃網。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"奈史密斯為什麼要發明籃球？","opts":["冬天太冷，學生需要能在室內玩的球類遊戲","他想當職業球員","學校要參加比賽","他家裡有很多桃子籃"],"ans":"A","steps":["第一段：「天氣太冷，學生不能到戶外運動……想一種可以在室內玩的球類遊戲」","B、C、D 文中都沒有","→ A"],"tests":"找原因的證據","avoid":"問「為什麼」，先找文中的原因句"},{"q":"奈史密斯把目標放在高處，是為了什麼？","opts":["讓高的人比較占便宜","讓球員練習準度，不能只靠蠻力","讓觀眾看得比較清楚","因為地上沒有位置"],"ans":"B","steps":["第二段：「如果目標放在高處，球員就不能只靠蠻力……而要練習準度」","A、C、D 文中都沒有","→ B"],"tests":"找目的的證據","avoid":"指得出證據句才選"},{"q":"第三段「不過」後面主要在說什麼？","opts":["籃子是用桃子做的","比賽從來不會中斷","早期的籃子有底，進球後要爬梯子拿球","籃網是奈史密斯一個人發明的"],"ans":"C","steps":["轉折詞「不過」後面是重點","第三段：「早期的籃子是有底的……爬梯子把球拿出來」","B 和文意相反；D 文中說是「後來人們」改的 → C"],"tests":"用轉折詞找重點","avoid":"「不過」後面那句先畫線"},{"q":"根據本文，下列何者「沒有」證據？","opts":["籃球是在一八九一年發明的","最早的球框是裝桃子的籃子","早期進球後，比賽常被打斷","奈史密斯發明籃球後就成了有錢人"],"ans":"D","steps":["A：第一段；B：第二段；C：第三段","D：文中完全沒提到","→ D"],"tests":"逐項找證據","avoid":"每個選項都要指出第幾段"}]},{"label":"第五篇","title":"彩虹出現的祕密","text":["雨剛停、太陽又出來的時候，天空有時會出現彩虹。彩虹是怎麼來的呢？","陽光看起來是白色的，其實是由許多種顏色的光混在一起。當陽光照進空中的小水滴，光會彎折、反射，不同顏色的光彎折的程度不一樣，就被分開來，排成紅、橙、黃、綠、藍、靛、紫的彩色光帶。","想看到彩虹，有兩個小祕訣：第一，要背對太陽，面向有水滴的天空；第二，太陽不能太高，所以彩虹常出現在早上或傍晚太陽比較低的時候。下次雨後放晴，不妨轉身找找看。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"根據本文，陽光其實是？","opts":["只有白色一種顏色","黃色加上白色","雨水反射的顏色","由許多種顏色的光混在一起"],"ans":"D","steps":["第二段：「陽光看起來是白色的，其實是由許多種顏色的光混在一起」","轉折詞「其實」後面才是真相","A 只是「看起來」的樣子 → D"],"tests":"用轉折詞找證據","avoid":"「看起來」和「其實」要分清楚"},{"q":"陽光進了水滴，為什麼會分成不同顏色？","opts":["不同顏色的光彎折程度不一樣","水滴本身有顏色","雲把顏色染上去","太陽的顏色會變"],"ans":"A","steps":["第二段：「不同顏色的光彎折的程度不一樣，就被分開來」","B、C、D 文中沒有","→ A"],"tests":"找原因的證據","avoid":"原因句常有「就、因此」"},{"q":"想看到彩虹，應該怎麼站？","opts":["面向太陽","背對太陽，面向有水滴的天空","站在屋子裡","躺在地上"],"ans":"B","steps":["第三段第一個祕訣：「要背對太陽，面向有水滴的天空」","A 和文中相反","→ B"],"tests":"找方法的證據","avoid":"「祕訣」後面就是答案"},{"q":"根據第三段，彩虹常在什麼時候出現？","opts":["中午太陽最高的時候","半夜","早上或傍晚太陽比較低的時候","只有夏天"],"ans":"C","steps":["總結詞「所以」後面：「彩虹常出現在早上或傍晚太陽比較低的時候」","A 和文意相反；D 有絕對字「只有」，文中也沒寫季節","→ C"],"tests":"用總結詞找重點","avoid":"「所以」後面的句子要畫線"}]}]},{"no":"第 5 組","title":"一週課外閱讀時間","skill":"圖表題五步驟","steps":["❶ 標題：這張圖在講什麼","❷ 單位：數字是人、小時、還是百分比","❸ 趨勢：哪裡多、哪裡少","❹ 最大值、最小值","❺ 最後才看選項，每個選項都回圖找數字"],"demo":{"q":"這張圖的數字單位是什麼？","a":["看表頭：「人數（人）」","答：人"]},"parts":[{"label":"第一篇","title":"一週課外閱讀時間","text":["老師調查全班 30 位同學，一週在課外讀書的時間，整理成下表。"],"cite":"某班 30 人一週課外閱讀時間（練習用數據，非真實調查）","notes":"","trans":"","chartHead":["每週閱讀時間","人數（人）"],"per":1,"unit":"人","data":[["0 小時",3],["1～2 小時",12],["3～4 小時",9],["5 小時以上",6]],"qs":[{"q":"人數最多的是哪一組？","opts":["0 小時","1～2 小時","3～4 小時","5 小時以上"],"ans":"B","steps":["四組人數：3、12、9、6","最大是 12","對應「1～2 小時」"],"tests":"找最大值","avoid":"先把每組數字寫出來再比較"},{"q":"每週讀 3 小時以上的人，占全班多少？","opts":["不到三分之一","剛好一半","超過一半","全班都是"],"ans":"B","steps":["3 小時以上＝3～4 小時 9 人＋5 小時以上 6 人＝15 人","全班＝3＋12＋9＋6＝30 人","15÷30＝1/2，剛好一半（檢查：15×2＝30）"],"tests":"圖表數字計算","avoid":"「以上」要把後面每一組都加進來"},{"q":"根據圖表，下列哪個說法有證據？","opts":["這班同學都不喜歡讀書","讀 5 小時以上的人，比完全沒讀的人多","讀越久的人國文成績越好","明年大家的閱讀時間會增加"],"ans":"B","steps":["B：5 小時以上 6 人，0 小時 3 人，6 比 3 多 → 有證據","A：絕對字「都」，而且 27 人有讀","C、D：圖裡沒有成績、也沒有明年的資料"],"tests":"圖表推論的範圍","avoid":"圖上沒有的資料，選項再合理也不能選"},{"q":"讀「1～2 小時」的人數，是讀「0 小時」的幾倍？","opts":["2 倍","3 倍","6 倍","4 倍"],"ans":"D","steps":["1～2 小時 12 人，0 小時 3 人","12÷3＝4","檢查：3×4＝12 → 4 倍"],"tests":"圖表數字倍數","avoid":"算倍數用除法，再用乘法檢查"}]},{"label":"第二篇","title":"全班最喜歡的水果","text":["某班 30 位同學，每人選一種自己最喜歡的水果，結果整理成下表。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["水果","人數（人）"],"per":1,"unit":"人","data":[["西瓜",10],["芒果",8],["葡萄",6],["香蕉",4],["其他",2]],"qs":[{"q":"喜歡西瓜的人比喜歡芒果的人多幾人？","opts":["2 人","1 人","3 人","8 人"],"ans":"A","steps":["西瓜 10 人，芒果 8 人","10－8＝2","→ 2 人"],"tests":"圖表數字相減","avoid":"先把兩個數字寫出來再算"},{"q":"喜歡葡萄和香蕉的人加起來，和哪一項一樣多？","opts":["芒果","其他","沒有一樣多的","西瓜"],"ans":"D","steps":["葡萄 6＋香蕉 4＝10","表中 10 人的是西瓜","→ D"],"tests":"圖表數字相加","avoid":"算完回表格找相同的數字"},{"q":"喜歡西瓜的人，占全班多少？","opts":["剛好三分之一","不到四分之一","剛好一半","超過一半"],"ans":"A","steps":["全班 30 人：三分之一是 10 人，一半是 15 人","西瓜剛好 10 人（檢查：10×3＝30）","→ 剛好三分之一"],"tests":"比例判斷","avoid":"先算出三分之一、一半是幾人再比"},{"q":"根據圖表，哪個說法有證據？","opts":["全班都很愛吃水果","喜歡香蕉的人最少","喜歡葡萄的人比喜歡香蕉的人多","喜歡西瓜的同學身體最健康"],"ans":"C","steps":["C：葡萄 6 人，香蕉 4 人，6 比 4 多 → 有證據","A：絕對字「都」，表只問「最喜歡哪一種」；B：最少的是「其他」2 人","D：表中沒有健康的資料"],"tests":"圖表推論的範圍","avoid":"圖上沒有的資料，不能拿來推論"}]},{"label":"第三篇","title":"校園一天的氣溫變化","text":["自然課時，同學在操場用溫度計，記錄某一天五個時間的氣溫。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["時間","氣溫（度）"],"per":5,"unit":"度","data":[["上午 8 點",20],["上午 10 點",24],["中午 12 點",29],["下午 2 點",31],["下午 4 點",26]],"qs":[{"q":"氣溫最高的是哪一個時間？","opts":["上午 8 點","上午 10 點","下午 4 點","下午 2 點"],"ans":"D","steps":["五個時間的氣溫：20、24、29、31、26","最大是 31","→ 下午 2 點"],"tests":"找最大值","avoid":"先把每個數字寫出來再比較"},{"q":"最高溫和最低溫差幾度？","opts":["9 度","10 度","11 度","12 度"],"ans":"C","steps":["最高：下午 2 點 31 度；最低：上午 8 點 20 度","31－20＝11","→ 11 度"],"tests":"最大值減最小值","avoid":"先找最高和最低，再相減"},{"q":"這五個時間的平均氣溫是幾度？","opts":["26 度","25 度","27 度","31 度"],"ans":"A","steps":["總和：20＋24＋29＋31＋26＝130","平均＝130÷5＝26","檢查：26×5＝130"],"tests":"計算平均","avoid":"平均＝總和÷個數，再用乘法檢查"},{"q":"根據圖表，下列哪個說法有證據？","opts":["這一天沒有下雨","有兩個時間的氣溫超過 26 度","氣溫一直越來越高","下午 4 點有同學中暑"],"ans":"B","steps":["超過 26 度的：中午 12 點 29 度、下午 2 點 31 度，共兩個 → 有證據","A、D：表中只有氣溫，沒有天氣和身體的資料","C：下午 4 點 26 度比下午 2 點低，不是一路上升"],"tests":"圖表推論的範圍","avoid":"「超過」不包含剛好等於的那一個"}]},{"label":"第四篇","title":"柴犬一週吃的零食","text":["阿哲記錄家裡的柴犬，從週一到週六每天吃了幾塊零食。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","零食（塊）"],"per":1,"unit":"塊","data":[["週一",3],["週二",2],["週三",4],["週四",2],["週五",3],["週六",6]],"qs":[{"q":"吃最多零食的是哪一天？","opts":["週三","週五","週六","週一"],"ans":"C","steps":["六天：3、2、4、2、3、6","最大是 6","→ 週六"],"tests":"找最大值","avoid":"先把每天的數字寫出來"},{"q":"哪兩天吃的一樣多，而且是最少的？","opts":["週一和週五","週三和週六","週二和週四","週一和週三"],"ans":"C","steps":["最少是 2 塊：週二、週四","週一和週五也一樣（3 塊），但不是最少","→ C"],"tests":"找最小值","avoid":"題目有兩個條件，兩個都要符合"},{"q":"週六吃的零食是週二的幾倍？","opts":["2 倍","4 倍","6 倍","3 倍"],"ans":"D","steps":["週六 6 塊，週二 2 塊","6÷2＝3","檢查：2×3＝6 → 3 倍"],"tests":"圖表數字倍數","avoid":"算倍數用除法，再用乘法檢查"},{"q":"這六天一共吃了幾塊零食？","opts":["20 塊","18 塊","16 塊","24 塊"],"ans":"A","steps":["先算週一到週五：3＋2＋4＋2＋3＝14","再加週六 6：14＋6＝20","→ 20 塊"],"tests":"圖表數字加總","avoid":"數字多時分兩段加，比較不會錯"}]},{"label":"第五篇","title":"資源回收週各類回收數量","text":["學校舉辦資源回收週，環保小組統計全校收到各類回收物的件數。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["回收物","數量（件）"],"per":5,"unit":"件","data":[["寶特瓶",60],["紙類",50],["鐵鋁罐",45],["玻璃瓶",25],["廢電池",20]],"qs":[{"q":"回收數量最少的是哪一類？","opts":["玻璃瓶","鐵鋁罐","廢電池","紙類"],"ans":"C","steps":["五類：60、50、45、25、20","最小是 20","→ 廢電池"],"tests":"找最小值","avoid":"先把每類數字寫出來再比較"},{"q":"寶特瓶的數量是廢電池的幾倍？","opts":["2 倍","3 倍","4 倍","40 倍"],"ans":"B","steps":["寶特瓶 60 件，廢電池 20 件","60÷20＝3","D 的 40 是相減的結果，不是倍數 → B"],"tests":"圖表數字倍數","avoid":"「幾倍」用除法，「多幾件」才用減法"},{"q":"紙類和鐵鋁罐加起來，比寶特瓶多幾件？","opts":["35 件","25 件","45 件","95 件"],"ans":"A","steps":["紙類 50＋鐵鋁罐 45＝95","95－60＝35","D 的 95 只是加起來的數，還沒減 → A"],"tests":"圖表數字計算","avoid":"題目有兩個步驟，兩步都要做完"},{"q":"根據圖表，哪個說法「不能」從圖中得知？","opts":["寶特瓶收到的最多","玻璃瓶比廢電池多 5 件","紙類的數量是廢電池的 2.5 倍","回收最多的班級會得到獎狀"],"ans":"D","steps":["A：寶特瓶 60 最多，有證據；B：25－20＝5，有證據","C：50÷20＝2.5，有證據","D：圖中沒有班級和獎狀的資料 → 不能得知"],"tests":"圖表推論的範圍","avoid":"選項說到圖上沒有的東西，就不能選"}]}]},{"no":"週末關卡","title":"陳太丘與友期","skill":"五步全用（綜合）","steps":["❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標","❹ 成語反推字義　❺ 選項代回去讀","完成後錄一支 60 秒「古文翻譯官」短片（見下一頁）"],"parts":[{"label":"第一篇","title":"陳太丘與友期","text":["陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之。元方入門不顧。"],"cite":"《世說新語．方正》","notes":"期：約定　日中：中午　舍：丟下　乃：才　尊君：您的父親　不：同「否」　委：丟下　家君：我的父親　引：拉　顧：回頭看","trans":"陳太丘和朋友約好一起出門，約在中午。過了中午朋友還沒到，太丘就不等他先走了，太丘走後朋友才到。元方當時七歲，在門外玩。客人問元方：「你父親在嗎？」元方答：「等您很久您都沒來，已經走了。」朋友就生氣地說：「真不是人！和別人約好一起走，卻丟下別人自己走了。」元方說：「您和我父親約在中午，中午沒到，就是不守信用；對著兒子罵他父親，就是沒有禮貌。」朋友覺得慚愧，下車去拉元方。元方走進家門，頭也不回。","qs":[{"q":"「太丘舍去」的「去」是什麼意思？","opts":["前往","離開","過去","去除"],"ans":"B","steps":["代回「太丘丟下朋友前往」→ 前往哪裡？讀不通","代回「太丘丟下朋友離開」→ 通","古今不同：現在「去」是前往，文言常是離開"],"tests":"古今異義","avoid":"現代意思代回去怪怪的，就想文言的意思"},{"q":"「去後乃至」是誰到了？","opts":["陳太丘","元方","陳太丘的朋友","客人的兒子"],"ans":"C","steps":["太丘已經離開了，不會是他","元方在門外玩，本來就在家","後面「客問元方」的客，就是遲到的朋友"],"tests":"補省略的主詞","avoid":"用刪去法：把不可能的人先刪掉"},{"q":"元方認為父親的朋友錯在哪裡？","opts":["遲到又不道歉","不守信用，又當著兒子的面罵父親","沒有下車","年紀比他大"],"ans":"B","steps":["找元方說的話：「日中不至，則是無信」","「對子罵父，則是無禮」","兩點都對應選項 B"],"tests":"找人物的理由","avoid":"問人物的想法，就去找那個人說的話"},{"q":"「待君久不至，已去」是誰等了很久才離開？","opts":["元方","客人","元方的母親","陳太丘"],"ans":"D","steps":["這是元方回答客人的話，「君」指客人","客人問的是「尊君在不」，元方答的是父親的情況","等很久又離開的是元方的父親陳太丘 → D"],"tests":"補省略的主詞","avoid":"對話裡的主詞，看問句問的是誰"}]},{"label":"第二篇","title":"徐孺子賞月","text":["徐孺子年九歲，嘗月下戲，人語之曰：「若令月中無物，當極明邪？」徐曰：「不然。譬如人眼中有瞳子，無此必不明。」"],"cite":"《世說新語．言語》","notes":"徐孺子：東漢人　語：告訴　若令：假如　瞳子：瞳孔","trans":"徐孺子九歲時，曾經在月光下玩，有人對他說：「如果月亮裡沒有東西，會不會更明亮呢？」徐孺子說：「不是這樣。就像人的眼睛裡有瞳孔，沒有它，眼睛一定不明亮。」","qs":[{"q":"「嘗月下戲」的「嘗」是什麼意思？","opts":["品嘗","曾經","嘗試","常常"],"ans":"B","steps":["代回「品嘗在月下玩」→ 不通","代回「曾經在月光下玩」→ 通","「常常」是「常」字，不要被字音騙"],"tests":"選項代回判斷字義","avoid":"字音一樣不代表意思一樣"},{"q":"「人語之曰」的「之」指誰？","opts":["月亮","說話的人","徐孺子","瞳子"],"ans":"C","steps":["前一句的主角是徐孺子","有人對「他」說話 → 之＝他","後面「徐曰」回答，證明對象是徐孺子"],"tests":"代詞指代＋補主詞","avoid":"看後面是誰回答"},{"q":"「不然」是什麼意思？","opts":["不是這樣","不燃燒","不必","不好"],"ans":"A","steps":["代回「不燃燒」→ 不通","代回「不是這樣」→ 通，後面接著提出自己的理由","「然」＝這樣（成語「不以為然」）"],"tests":"成語反推字義","avoid":"「然」常常是「這樣、對的」"},{"q":"徐孺子用什麼來比喻月亮裡的東西？","opts":["月亮","太陽","星星","眼睛裡的瞳孔"],"ans":"D","steps":["「譬如」後面是比喻","「人眼中有瞳子，無此必不明」","月中的東西就像瞳孔 → D"],"tests":"找比喻","avoid":"看到「譬如」，後面就是比喻"}]},{"label":"第三篇","title":"小時了了","text":["孔文舉年十歲，隨父到洛。……元禮及賓客莫不奇之。太中大夫陳韙後至，人以其語語之，韙曰：「小時了了，大未必佳。」文舉曰：「想君小時，必當了了。」韙大踧踖。"],"cite":"《世說新語．言語》（節選）","notes":"孔文舉：孔融　洛：洛陽　中間省略的部分：孔文舉用一番巧妙的話，說自己和名士李元禮是世交　元禮：李元禮，當時的名士　陳韙：人名　了了：聰明　踧踖：侷促不安","trans":"孔文舉十歲時，跟著父親到洛陽。……（他一番巧妙的回答，讓）李元禮和賓客們沒有一個不覺得他很不簡單。太中大夫陳韙後來才到，有人把孔文舉的話告訴他，陳韙說：「小時候聰明，長大了不一定好。」孔文舉說：「想必您小時候，一定很聰明吧。」陳韙聽了非常侷促不安。","qs":[{"q":"「元禮及賓客莫不奇之」是什麼意思？","opts":["元禮和賓客沒有一個不覺得他很特別","元禮和賓客都不喜歡他","元禮和賓客覺得事情很奇怪","元禮和賓客不認識他"],"ans":"A","steps":["「莫不」＝沒有不，就是全都","「奇」＝認為……很特別（成語「嘖嘖稱奇」）","代回：大家都覺得孔文舉很不簡單 → A"],"tests":"虛詞＋成語反推","avoid":"「莫不」是雙重否定，等於「都」"},{"q":"「人以其語語之」，是把誰的話告訴誰？","opts":["把陳韙的話告訴孔文舉","把孔文舉的話告訴陳韙","把元禮的話告訴孔文舉","把孔文舉的話告訴他父親"],"ans":"B","steps":["前面讓大家驚奇的話是孔文舉說的 →「其語」","陳韙「後至」，沒聽到，所以有人轉告「之」＝陳韙","→ B"],"tests":"補主詞與指代","avoid":"「其」「之」都要往前找人"},{"q":"「想君小時，必當了了」的「君」指誰？","opts":["李元禮","孔文舉的父親","賓客","陳韙"],"ans":"D","steps":["說話的是孔文舉，他在回應陳韙","「君」＝您，指對話的人","→ 陳韙"],"tests":"找說話對象","avoid":"「君」是「您」，看話是對誰說的"},{"q":"陳韙聽完為什麼「大踧踖」？","opts":["他忽然生病了","他遲到被主人罵","孔文舉話中暗示：陳韙小時聰明，長大卻不怎樣","他忘了帶禮物"],"ans":"C","steps":["陳韙說：小時聰明，長大未必好","孔文舉回：您小時候一定很聰明","照陳韙自己的道理，等於說他現在不好 → 很難堪 → C"],"tests":"推論人物反應","avoid":"把兩人的話放在一起看"}]},{"label":"第四篇","title":"荀巨伯遠看友人疾","text":["荀巨伯遠看友人疾，值胡賊攻郡。友人語巨伯曰：「吾今死矣，子可去！」巨伯曰：「遠來相視，子令吾去，敗義以求生，豈荀巨伯所行邪？」賊既至，謂巨伯曰：「大軍至，一郡盡空，汝何男子，而敢獨止？」巨伯曰：「友人有疾，不忍委之，寧以我身代友人命。」賊相謂曰：「我輩無義之人，而入有義之國！」遂班軍而還，一郡並獲全。"],"cite":"《世說新語．德行》","notes":"疾：病　值：剛好遇到　胡賊：外族的軍隊　郡：城　敗義：破壞道義　委：丟下　班軍：調回軍隊　獲全：得到保全","trans":"荀巨伯到遠方探望生病的朋友，剛好遇到胡人軍隊攻城。朋友對巨伯說：「我現在快死了，你可以離開！」巨伯說：「我遠道來看你，你卻叫我離開，破壞道義來求活命，難道是我荀巨伯會做的事嗎？」賊兵到了以後，對巨伯說：「大軍一到，整座城的人都跑光了，你是什麼人，竟敢一個人留下來？」巨伯說：「朋友生病，我不忍心丟下他，情願用我的性命換朋友的性命。」賊兵們互相說：「我們這些不講道義的人，卻闖進了講道義的地方！」於是撤軍回去，整座城都保全了。","qs":[{"q":"「子可去」的「子」指誰？","opts":["友人","荀巨伯","胡賊","友人的兒子"],"ans":"B","steps":["說話的是生病的友人","「友人語巨伯曰」→ 對巨伯說","子＝你，指荀巨伯；D 錯在把「子」當成兒子"],"tests":"找說話對象","avoid":"古文的「子」常是「你」，不是兒子"},{"q":"「汝何男子，而敢獨止」是誰問誰？","opts":["胡賊問荀巨伯","荀巨伯問胡賊","友人問荀巨伯","胡賊問友人"],"ans":"A","steps":["前一句「賊既至，謂巨伯曰」","說話的是賊，對象是巨伯","→ A"],"tests":"補主詞","avoid":"看「曰」前面寫誰對誰說"},{"q":"「寧以我身代友人命」的「寧」是什麼意思？","opts":["安寧","難道","寧靜","寧可、情願"],"ans":"D","steps":["代回「安寧用我的身體……」→ 不通","代回「難道用我的命……」也不通，這句不是問句","代回「情願用我的命換朋友的命」→ 通"],"tests":"選項代回判斷字義","avoid":"看句子是不是問句，再決定意思"},{"q":"胡賊最後為什麼退兵？","opts":["城裡沒有東西可搶","被大軍打敗","被荀巨伯的義氣打動，覺得自己慚愧","友人的病好了"],"ans":"C","steps":["賊說：「我輩無義之人，而入有義之國」","因為看到巨伯的義氣，自覺慚愧","接著「遂班軍而還」→ C"],"tests":"找事情的原因","avoid":"「遂」前面就是原因"}]},{"label":"第五篇","title":"華歆王朗俱乘船避難","text":["華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。朗曰：「幸尚寬，何為不可？」後賊追至，王欲舍所攜人。歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄邪？」遂攜拯如初。世以此定華、王之優劣。"],"cite":"《世說新語．德行》","notes":"俱：一起　依附：搭船同行　輒：就　難：感到為難　幸：幸好　尚寬：還寬敞　納：接受　自託：把自己託付給人　拯：救助　舍：同「捨」，丟下　優劣：好壞","trans":"華歆和王朗一起搭船逃難，有一個人想搭船同行，華歆就感到為難。王朗說：「幸好船還寬敞，為什麼不行？」後來賊兵追來了，王朗想丟下那個帶上船的人。華歆說：「我當初之所以猶豫，正是因為這個啊。既然已經接受他的託付，難道可以因為情況危急就丟下他嗎？」於是像當初一樣帶著他、救助他。世人就用這件事判斷華歆和王朗的好壞。","qs":[{"q":"「王欲舍所攜人」是誰想丟下那個人？","opts":["華歆","王朗","追來的賊","被帶上船的人"],"ans":"B","steps":["「王」指王朗","一開始說「何為不可」答應載人的，也是王朗","賊追來時想丟下人的，就是王朗"],"tests":"補主詞","avoid":"人名只寫一個字，要對回全名"},{"q":"「寧可以急相棄邪」的「寧」是什麼意思？","opts":["寧可、情願","安寧","難道","寧靜"],"ans":"C","steps":["這句結尾有「邪」，是問句","代回「難道可以因為情況危急就丟下他嗎？」→ 通","「寧可」代回變成「寧可丟下他」，和華歆的態度相反"],"tests":"一字多義＋選項代回","avoid":"句尾有「邪、乎」，「寧」常是「難道」"},{"q":"「遂攜拯如初」的「如初」是什麼意思？","opts":["像當初一樣","第一次","剛開始時很害怕","如果一開始"],"ans":"A","steps":["想成語「和好如初」：像原來一樣","代回：於是像當初一樣帶著、救助他 → 通","→ A"],"tests":"成語反推字義","avoid":"有成語幫忙，就先想成語"},{"q":"世人從這件事看出誰比較好？為什麼？","opts":["王朗，因為他一開始就答應幫忙","兩人一樣好","華歆，因為他從頭到尾都不想幫人","華歆，因為答應前謹慎，答應後就負責到底"],"ans":"D","steps":["華歆一開始「難之」，因為怕危急時顧不了：「本所以疑，正為此耳」","答應後危急時也不肯丟下：「遂攜拯如初」","王朗先答應後想丟下 → 華歆較好 → D；C 錯在他最後有幫"],"tests":"比較人物＋主旨","avoid":"比較兩人前後的做法變化"}]}],"demo":{"q":"「客問元方」的「客」是誰？","a":["往前找：太丘走了以後，「去後乃至」的是約好的朋友","到了門口、問元方話的，就是這位朋友","答：陳太丘的朋友"]}}],"teach":[{"intro":"這一組學兩件事：看懂題目在問什麼，還有找出句子裡「是誰」在做事。","items":[{"t":"什麼是「題幹」？","d":["題目裡問問題的那一句，就叫題幹。","例：「『因釋其耒而守株』是誰放下農具？」這整句就是題幹，它告訴你：這題要找「誰」。"],"ex":"先看題幹，就像比賽前先知道要守哪一個人，才不會亂跑。"},{"t":"什麼是「主詞」？","d":["一句話裡「做動作的那個人或東西」。","例：「玗樊投籃」——投籃的是玗樊，玗樊就是主詞。「兔子撞樹」——撞樹的是兔子，兔子就是主詞。"]},{"t":"文言文為什麼常常沒有主詞？","d":["古人把字刻在竹片上，很費工夫，所以前面講過的人，後面就省略不寫。"],"ex":"就像你在球場對隊友喊「傳！」不用說「你把球傳給我」，大家都知道是誰。"},{"t":"怎麼把主詞補回來？","d":["往前一句找，最近出現的人或動物，通常就是主詞。","找到後，直接用鉛筆寫在那句旁邊，讀的時候就不會搞混。"]}],"demo":["原文：「兔走觸株，折頸而死」","「折頸而死」沒有寫誰 → 往前一句看到「兔」","在旁邊寫上「兔」→ 兔子折斷脖子死了"]},{"intro":"這一組學兩個讀懂字義的工具：虛詞告訴你句子怎麼接，成語幫你猜出不認識的字。","items":[{"t":"什麼是「虛詞」？","d":["本身不代表人、東西或動作的字，像「而、故、乃、之」。","它們的工作是告訴你：前後兩句怎麼連在一起。"],"ex":"就像教練的戰術手勢：手勢不是球員，但它告訴大家球要往哪裡跑。"},{"t":"「而」怎麼判斷？","d":["把「而」分別換成「然後」和「但是」，各讀一次，哪個通就是哪個。","前後同方向 → 然後：「學而時習之」＝學了，然後常常複習。","前後相反 → 但是：「舟已行，而劍不行」＝船走了，但是劍沒走。"]},{"t":"其他常見虛詞","d":["故＝所以（後面是結果）　乃＝才、於是　之＝的、他、它"]},{"t":"什麼是「成語反推」？","d":["很多成語是古人留下來的話，裡面的字和文言文意思一樣。","看到不認識的字，想一個有這個字的成語，從成語猜出意思，再放回原句讀讀看通不通。","例：「走」→ 成語「奔走相告」＝大家跑來跑去告訴別人 → 走＝跑。"]}],"demo":["原文：「從其所契者入水求之」","「求」不確定 → 想成語「緣木求魚」＝爬到樹上找魚","求＝尋找 → 放回去：下水去找劍，讀得通"]},{"intro":"這一組學做選擇題最好用的方法：把選項放回句子裡試試看。","items":[{"t":"什麼是「選項代回去」？","d":["把選項的解釋，放進原來的句子，取代那個字，從頭讀一遍。"],"ex":"就像買球鞋要每雙都試穿，合腳的才買，不是看起來好看就買。"},{"t":"為什麼要代回去？","d":["一個字常常有好幾個意思，錯的選項通常也是那個字「真的有」的意思。","例：「亡」可以是死亡、逃走、失去，三個都對，但放進「終亡其酒」只有「失去」說得通。","所以只看選項本身會被騙，一定要放回句子。"]},{"t":"怎樣算「讀得通」？","d":["① 句子讀得懂　② 和前後故事不衝突　③ 符合常識（例：蛇本來就沒有腳）"]}],"demo":["題目：「蛇固無足」的「固」？（堅固／本來／固執）","代回：「蛇堅固沒有腳」不通；「蛇固執沒有腳」不通","「蛇本來就沒有腳」通 → 答：本來"]},{"intro":"這一組換成白話文章，學會「每個答案都要從文章裡找到證明」。","items":[{"t":"什麼是「證據句」？","d":["文章裡能證明答案是對的那一句。選答案前，要能用手指指出來：在第幾段、哪一句。"],"ex":"就像裁判要看到犯規才能吹哨，不能用猜的。"},{"t":"什麼是「轉折詞」和「總結詞」？","d":["轉折詞：但是、然而、其實、不過。前面先講一件事，後面要轉彎，作者真正想說的通常在轉彎之後。","總結詞：所以、因此、可見、總之。後面接的是作者的結論。","看到這些詞，就在後面那句畫線。"]},{"t":"什麼是「絕對字」？","d":["說得很滿、沒有例外的字：都、一定、只、所有、完全、從不。","真實世界很少「全部都這樣」，所以選項出現這些字要特別小心，一定要回文章確認。","注意：不是有絕對字就一定錯，文章真的這樣寫就是對的。"]},{"t":"什麼是「摘要」？","d":["用一句話說出整篇在講什麼：講了什麼事＋為什麼。","只講到其中一段的，是「細節」，不是摘要。"]}],"demo":["題目：限制區在球場的哪裡？","回第一段找到：「籃框前方有一塊……長方形區域」","找得到證據句 → 答：籃框前方"]},{"intro":"會考常出圖表題，自然、社會也會考。這一組學看圖表的固定順序。","items":[{"t":"標題和單位","d":["標題：這張圖在講什麼。","單位：數字的身分，是「人」、「小時」還是「%」。單位看錯，整題就錯。"],"ex":"就像記分板：要先知道哪一欄是得分、哪一欄是犯規，才看得懂數字。"},{"t":"趨勢、最大值、最小值","d":["趨勢：哪裡多、哪裡少，是越來越多還是越來越少。","最大值、最小值：最高和最低的那一格，很多題目直接考這個。"]},{"t":"「以上」「以下」包含哪些？","d":["「3 小時以上」＝ 3～4 小時這一組，加上 5 小時以上這一組，兩組都要算進去。"]},{"t":"圖上沒有的，不能推","d":["圖只有「人數」，就不能說「成績比較好」或「明年會增加」，因為圖裡沒有這些資料。"]}],"demo":["題目：這張圖的數字單位是什麼？","看表頭：「人數（人）」","答：人"]},{"intro":"週末關卡把前面學的全部合在一起用，另外再學一個新觀念：古今異義。","items":[{"t":"偵查五步是什麼？","d":["就是第 1～3 組學過的招式，按順序用：","❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標　❹ 成語反推字義　❺ 選項代回去讀"]},{"t":"什麼是「古今異義」？","d":["同一個字，古代和現在的意思不一樣。","「去」：現在是「前往」（去學校），古代常是「離開」。","「走」：現在是「走路」，古代是「跑」。"],"ex":"就像「鬥牛」：現在是三對三打籃球，原本是指牛和牛打架，同一個詞意思變了。"},{"t":"怎麼發現是古今異義？","d":["用現在的意思放回去，讀起來怪怪的 → 就換古代的意思再讀一次。"]}],"demo":["原文：「太丘舍去」","用現在的意思：「太丘丟下朋友前往」→ 前往哪裡？怪怪的","換古代意思「離開」→ 太丘丟下朋友離開了 → 通"]}],"daily":[{"words":[["走","跑","奔走相告"],["冀","希望","冀望"]],"line":"兔不可復得，而身為宋國笑。"},{"words":[["求","尋找","緣木求魚"],["遽","急忙","遽然"]],"line":"舟已行矣，而劍不行。"},{"words":[["固","本來","固有"],["亡","失去","亡羊補牢"]],"line":"蛇固無足，子安能為之足？"},{"words":[["安","怎麼","子安能為之足"],["遂","於是、就","遂飲其酒"]],"line":"為蛇足者，終亡其酒。"},{"words":[["期","約定","不期而遇"],["顧","回頭看","義無反顧"]],"line":"日中不至，則是無信。"},null],"quiz":{"words":[["走","跑","兔走觸株"],["冀","希望","冀復得兔"],["求","尋找","從其所契者入水求之"],["遽","急忙","遽契其舟"],["固","本來","蛇固無足"],["亡","失去","終亡其酒"],["安","怎麼","子安能為之足"],["遂","於是、就","遂飲其酒"],["期","約定","陳太丘與友期行"],["顧","回頭看","元方入門不顧"]],"lines":[["兔不可復得，","而身為宋國笑。"],["舟已行矣，","而劍不行。"],["蛇固無足，","子安能為之足？"],["為蛇足者，","終亡其酒。"],["日中不至，","則是無信。"]],"parts":[{"label":"第一篇","title":"鄭人買履","text":["鄭人有且置履者，先自度其足，而置之其坐。至之市，而忘操之。已得履，乃曰：「吾忘持度。」反歸取之。及反，市罷，遂不得履。人曰：「何不試之以足？」曰：「寧信度，無自信也。」"],"cite":"《韓非子．外儲說左上》","notes":"且：將要　履：鞋子　度：（動詞）量；（名詞）量好的尺碼　坐：同「座」　操、持：拿　反：同「返」　市罷：市場收攤","trans":"鄭國有個想要買鞋的人，先自己量好腳的尺寸，把量好的尺碼放在座位上。到了市場，卻忘了帶尺碼。他已經挑好鞋子，才說：「我忘了帶尺碼。」就回家去拿。等他回到市場，市場已經收攤，結果沒買到鞋。有人問他：「為什麼不用自己的腳試穿呢？」他說：「我寧可相信量好的尺碼，也不相信自己的腳。」","qs":[{"q":"「反歸取之」是誰回家去拿？","opts":["賣鞋的人","想買鞋的鄭國人","市場的人","問他話的人"],"ans":"B","steps":["往前找：「已得履，乃曰……」都是想買鞋的人","中間沒有換人","所以回家的是想買鞋的鄭國人"],"tests":"補省略的主詞","avoid":"一連串動作沒換人，主詞就沿用前面的"},{"q":"「遂不得履」的「遂」是什麼意思？","opts":["於是、結果","順利","跟隨","完成"],"ans":"A","steps":["本週背過：遂＝於是、就","代回：「市場收攤了，結果沒買到鞋」→ 通","「順利沒買到鞋」不通"],"tests":"本週字義：遂","avoid":"背過的字，先用背過的意思代回"},{"q":"這個鄭國人錯在哪裡？","opts":["忘記帶錢","只相信量好的尺碼，不相信自己的腳","走太慢","不喜歡新鞋"],"ans":"B","steps":["找他自己說的話：「寧信度，無自信也」","寧可相信尺碼，也不相信自己","腳就在身上，卻還回家拿尺碼 → B"],"tests":"找人物的理由","avoid":"問人物的想法，就去找那個人說的話"},{"q":"「且置履」和「置之其坐」的兩個「置」，意思分別是？","opts":["都是放置","都是購買","前一個是購買，後一個是放置","前一個是放置，後一個是購買"],"ans":"C","steps":["代回「將要購買鞋子」→ 通，題目說他想買鞋","代回「把它放在座位上」→ 通，「之」是量好的尺碼","兩個「置」意思不同 → C"],"tests":"一字多義","avoid":"同一個字出現兩次，要分開代回"},{"q":"「何不試之以足」的「之」指什麼？","opts":["市場","尺碼","腳","鞋子"],"ans":"D","steps":["問話的人建議他「用腳試一試」","要試的東西是鞋子 → 之＝鞋","C「足」是用來試的工具，不是被試的東西"],"tests":"虛詞「之」指代","avoid":"「之」代替的是被做動作的東西"}]},{"label":"第二篇","title":"不恥下問","text":["子貢問曰：「孔文子何以謂之文也？」子曰：「敏而好學，不恥下問，是以謂之文也。」"],"cite":"《論語．公冶長》","notes":"子貢：孔子的學生　孔文子：衛國的大夫　何以：為什麼　文：一種美好的稱號","trans":"子貢問：「孔文子為什麼被稱為『文』呢？」孔子說：「他聰明又喜歡學習，不覺得向不如自己的人請教是丟臉的事，所以稱他為『文』。」","qs":[{"q":"「子曰」的「子」指誰？","opts":["子貢","孔文子","孔子","孔文子的兒子"],"ans":"C","steps":["《論語》裡單說「子曰」，指的是孔子","子貢是發問的人，不會自問自答","→ 孔子"],"tests":"補出說話的人","avoid":"問答題要分清楚誰問、誰答"},{"q":"「敏而好學」的「敏」是什麼意思？","opts":["敏感","聰明、反應快","過敏","生氣"],"ans":"B","steps":["想詞語「機敏」：聰明、反應快","代回：聰明又喜歡學習 → 通","「敏感、過敏」代回不通"],"tests":"成語反推字義","avoid":"想一個常用詞，再代回原句"},{"q":"「敏而好學」的「而」是什麼意思？","opts":["而且、又","但是","如果","所以"],"ans":"A","steps":["前：聰明","後：喜歡學習","兩個都是優點，同方向 → 而且"],"tests":"虛詞「而」","avoid":"「而」前後同方向，就不是「但是」"},{"q":"「不恥下問」是什麼意思？","opts":["不好意思開口問問題","不要在台下問問題","認為問問題很丟臉","不覺得向不如自己的人請教是丟臉的事"],"ans":"D","steps":["「恥」＝認為……丟臉（詞語「可恥」）","「下問」＝向地位或學問比自己低的人請教","代回 → D；C 和「不恥」意思相反"],"tests":"成語句意","avoid":"把成語拆成兩半，各自翻譯再接起來"},{"q":"孔文子為什麼被稱為「文」？","opts":["他很會寫文章","聰明好學，又不怕向別人請教","他是孔子的老師","子貢很喜歡他"],"ans":"B","steps":["找孔子的回答：「敏而好學，不恥下問，是以謂之文也」","「是以」＝所以，前面就是原因","→ B；A 是今天「文」的意思，文中沒有"],"tests":"找原因","avoid":"「是以、故」前面就是原因"}]}]}},{"week":2,"groups":[{"no":"第 1 組","title":"《論語》學而＋校隊練球","skill":"互文對讀：兩篇比一比","steps":["❶ 先各用一句話說出甲、乙在講什麼","❷ 畫比較表：甲說什麼｜乙說什麼","❸ 先找相同，再找不同","❹ 題目問「兩篇都」→ 看相同；問「只有甲」→ 看不同"],"demo":{"q":"甲文的「有朋自遠方來」，在乙文中對應哪件事？","a":["甲：有朋友一起，很快樂","乙：「和隊友一起加練……比自己練有趣多了」","答：和隊友一起加練"]},"parts":[{"label":"第一篇","title":"《論語》學而＋校隊練球","text":["甲　子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」","乙　我剛進校隊時，教練要我們每天投一百球。一開始覺得好無聊，可是一個月後，比賽最後幾秒我投進關鍵球，那一刻才懂：原來反覆練習會變成真正的本事。現在我最喜歡週末和隊友一起加練，邊練邊互相挑錯，比自己練有趣多了。"],"cite":"甲：《論語．學而》　乙：練習用自編短文","notes":"時習：時常複習　慍：生氣　君子：品德好的人","trans":"甲：孔子說：「學了以後時常複習，不是很高興嗎？有朋友從遠方來，不是很快樂嗎？別人不了解我，我也不生氣，不就是君子嗎？」","qs":[{"q":"「不亦說乎」的「說」是什麼意思？","opts":["說話","高興","解說","勸說"],"ans":"B","steps":["說，同「悅」，是高興的意思","代回：學了常常複習，不是很高興嗎？→ 通","「說話」代回不通"],"tests":"通假字：說＝悅","avoid":"背過的字，先用背過的意思代回"},{"q":"甲、乙兩篇共同的看法是？","opts":["反覆練習會帶來快樂或收穫","一定要和朋友一起練","別人不了解也不要生氣","教練最重要"],"ans":"A","steps":["甲：學了時常複習，很高興","乙：反覆練習變成真本事","兩篇都講練習的好處 → A；C 只有甲講"],"tests":"找兩篇的相同點","avoid":"「共同」要兩篇都找得到證據"},{"q":"甲文有提到、乙文沒有提到的是？","opts":["學習要常常複習","和同伴一起很快樂","別人不了解自己也不生氣","練習一開始很無聊"],"ans":"C","steps":["A：兩篇都有","B：兩篇都有（有朋、隊友）","C：只有甲「人不知而不慍」；D 只有乙"],"tests":"找兩篇的不同點","avoid":"比較表上，沒有連線的那一格就是不同"},{"q":"乙文「和隊友一起加練……比自己練有趣多了」，最接近甲文哪一句？","opts":["學而時習之","人不知而不慍","不亦君子乎","有朋自遠方來，不亦樂乎"],"ans":"D","steps":["乙這句的重點：和同伴一起練，很快樂","甲講「有同伴很快樂」的是「有朋自遠方來，不亦樂乎」","A 講複習，B、C 講不生氣、當君子 → 答 D"],"tests":"找甲乙對應句","avoid":"先抓乙句重點，再去甲找同義句"}]},{"label":"第二篇","title":"吾日三省吾身＋睡前回想","text":["甲　曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」","乙　每天睡前，我會花三分鐘回想今天的練習。幫隊友傳球時，有沒有用心看他的位置？答應學弟放學陪他練罰球，有沒有做到？教練教的新戰術，回家有沒有再練一次？有一次我發現自己答應了學弟卻忘記了，第二天馬上去跟他道歉，還補陪他練了半小時。"],"cite":"甲：《論語．學而》　乙：練習用自編短文","notes":"曾子：孔子的學生　省：反省、檢查　謀：出主意、辦事　忠：盡心盡力　傳：老師傳授的學問","trans":"甲：曾子說：「我每天多次反省自己：替別人辦事有沒有盡心盡力？和朋友來往有沒有守信用？老師傳授的學問有沒有複習？」","qs":[{"q":"「吾日三省吾身」的「日」是什麼意思？","opts":["太陽","白天","每天","日子"],"ans":"C","steps":["代回「我太陽反省自己」→ 不通","代回「我每天反省自己」→ 通","乙文「每天睡前」也對應 → 答 C"],"tests":"字義：日＝每天","avoid":"「日」放在動作前面，常是每天"},{"q":"乙文「答應學弟……有沒有做到？」對應甲文哪一問？","opts":["為人謀而不忠乎","與朋友交而不信乎","傳不習乎","吾日三省吾身"],"ans":"B","steps":["乙：答應的事有沒有做到＝有沒有守信用","甲「與朋友交而不信乎」問的就是守不守信","所以對應 B"],"tests":"找甲乙對應句","avoid":"先說出乙句重點詞，再到甲找同義"},{"q":"甲、乙兩篇共同的做法是？","opts":["每天反省自己做得好不好","只檢查讀書的事","一定要請別人幫忙檢查","做錯了就不再練球"],"ans":"A","steps":["甲「吾日三省吾身」：每天反省","乙「每天睡前……回想」：每天反省","B 兩篇都還檢查待人；C 文中沒說；D 相反 → 答 A"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"},{"q":"乙文比甲文多寫了哪一件事？","opts":["反省有沒有複習","反省答應的事有沒有做到","發現錯誤後，馬上道歉並補救","反省幫別人做事是否用心"],"ans":"C","steps":["A、B、D：甲文三問都有","乙文「第二天馬上去跟他道歉，還補陪他練」","甲只問、沒寫怎麼改正 → 答 C"],"tests":"找乙多出的部分","avoid":"問「只有乙」，就找甲沒有的那格"}]},{"label":"第三篇","title":"見賢思齊＋隊上的控球後衛","text":["甲　子曰：「見賢思齊焉，見不賢而內自省也。」","乙　隊上的阿哲是控球後衛，傳球又快又準。我每天都偷偷觀察他怎麼看隊友的位置，練習時也照著學。另一個隊友常常輸球就摔球、怪別人，大家都不想跟他同一組。看到他，我就提醒自己：輸球的時候，我有沒有也把錯推給別人？"],"cite":"甲：《論語．里仁》　乙：練習用自編短文","notes":"賢：有才德的人　焉：句尾語氣詞　內：在心裡","trans":"甲：孔子說：「看見有才德的人，就想要向他看齊；看見沒有才德的人，就在心裡反省自己有沒有同樣的缺點。」","qs":[{"q":"「見賢思齊焉」的「齊」是什麼意思？","opts":["整齊","齊國","一起","看齊，和他一樣好"],"ans":"D","steps":["代回「看見賢人就想整齊」→ 不通","代回「想要和他一樣好」→ 通","乙文「照著學」也是在看齊 → 答 D"],"tests":"字義：齊＝看齊","avoid":"每個意思都代回去讀讀看"},{"q":"乙文中哪件事對應「見不賢而內自省」？","opts":["觀察阿哲怎麼傳球","練習時照著阿哲學","看到隊友摔球，提醒自己有沒有犯同樣的錯","大家不想跟摔球的隊友同一組"],"ans":"C","steps":["「見不賢」＝看到不好的人；「內自省」＝在心裡反省自己","乙：「看到他，我就提醒自己……」","D 是別人的反應，不是反省 → 答 C"],"tests":"找甲乙對應句","avoid":"對應要兩半都對上，不能只對一半"},{"q":"甲、乙兩篇共同的看法是？","opts":["好的人和不好的人，都能讓自己學到東西","只要跟厲害的人同隊就會變強","不好的人要趕出球隊","控球後衛最重要"],"ans":"A","steps":["甲：見賢→學他；見不賢→反省自己","乙：學阿哲；看到摔球的隊友→反省","B 是腦補，C、D 文中沒說 → 答 A"],"tests":"找兩篇相同點","avoid":"選項要兩篇都有證據"},{"q":"乙文中的阿哲，在甲文裡屬於哪一種人？","opts":["不賢","賢","小人","遠方來的朋友"],"ans":"B","steps":["乙：阿哲「傳球又快又準」，值得學","甲：值得看齊的是「賢」","所以阿哲是「賢」→ 答 B"],"tests":"把乙的人物對到甲","avoid":"先問：這個人值得學，還是要引以為戒"}]},{"label":"第四篇","title":"己所不欲＋下課打全場","text":["甲　子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」","乙　下課打全場時，我最討厭被人故意推倒。有一次搶籃板，我差點也伸手推對方，突然想起自己被推倒時膝蓋流血的痛，就把手收回來，改用正當的卡位。比賽結束後，對方跑來說：「你防得很乾淨。」我這才發現：不希望別人怎麼對我，我就先不要那樣對別人。"],"cite":"甲：《論語．衛靈公》　乙：練習用自編短文","notes":"子貢：孔子的學生　一言：一個字　終身：一輩子　其：大概　恕：替別人著想","trans":"甲：子貢問：「有沒有一個字，可以讓人一輩子照著去做呢？」孔子說：「大概就是『恕』吧！自己不想要的，就不要加在別人身上。」","qs":[{"q":"「己所不欲」的「欲」是什麼意思？","opts":["想要","討厭","已經","做"],"ans":"A","steps":["代回「自己不想要的」→ 通","乙文「不希望別人怎麼對我」也對應","「討厭」代回變成「自己不討厭的」，意思相反 → 答 A"],"tests":"字義：欲＝想要","avoid":"代回後要和上下文意思一致"},{"q":"「勿施於人」的「勿」是什麼意思？","opts":["沒有","不要","東西","一定"],"ans":"B","steps":["代回「不要加在別人身上」→ 通，是勸告","「沒有」代回變成描述，不是勸人","乙文「就先不要那樣對別人」→ 答 B"],"tests":"字義：勿＝不要","avoid":"勸人的句子，勿常是「不要」"},{"q":"乙文中「我」把手收回來，是因為？","opts":["怕被教練罵","想起自己被推倒的痛，不想讓對方也受傷","對方比較高","裁判正在看"],"ans":"B","steps":["乙：「突然想起自己被推倒時膝蓋流血的痛，就把手收回來」","這正是甲文「己所不欲，勿施於人」","A、C、D 文中都沒寫 → 答 B"],"tests":"找原因並對應甲","avoid":"原因要在文中找到句子"},{"q":"甲、乙兩篇都在說明哪一個道理？","opts":["比賽一定要贏","別人對我不好，我也可以對他不好","只有子貢懂這個道理","自己不喜歡的事，不要對別人做"],"ans":"D","steps":["甲：「己所不欲，勿施於人」","乙：「不希望別人怎麼對我，我就先不要那樣對別人」","B 相反；A、C 文中沒說 → 答 D"],"tests":"找兩篇共同主旨","avoid":"主旨要兩篇都講到才算"}]},{"label":"第五篇","title":"知之為知之＋數學課舉手","text":["甲　子曰：「由！誨女知之乎！知之為知之，不知為不知，是知也。」","乙　數學課上，老師講了一題我不懂的題目。我很想假裝懂，因為旁邊的同學都在點頭。最後我還是舉手說：「老師，這一步我看不懂。」沒想到老師說好幾個人都卡在這裡，又講了一次。下課後，剛才點頭的同學偷偷跟我說：「其實我也不懂，謝謝你先問。」"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"由：孔子的學生子路的名字　誨：教導　女：同「汝」，你","trans":"甲：孔子說：「由啊！我教你怎樣才算真正知道吧！知道就說知道，不知道就說不知道，這才是真正的聰明。」","qs":[{"q":"「是知也」的「是」是什麼意思？","opts":["是的","這，這樣","正確","是非"],"ans":"B","steps":["代回「這樣才是真正的聰明」→ 通","文言的「是」常常當「這」用","「是的」放在句首，後面接「知也」不通 → 答 B"],"tests":"字義：是＝這","avoid":"句首的「是」，先試試「這」"},{"q":"乙文中「我」舉手說看不懂，最符合甲文哪一句？","opts":["誨女知之乎","知之為知之","不知為不知","由"],"ans":"C","steps":["乙：「這一步我看不懂」＝承認自己不知道","甲：「不知為不知」＝不知道就說不知道","B 是知道的情況 → 答 C"],"tests":"找甲乙對應句","avoid":"先判斷是「知道」還是「不知道」"},{"q":"根據兩篇，下列推論何者正確？","opts":["誠實說出自己不懂，才能真正學會","點頭的同學都聽懂了","不懂時假裝懂比較不丟臉","孔子的學生都很笨"],"ans":"A","steps":["甲：不知為不知，才是真聰明","乙：舉手→老師再講一次→學會；同學也說謝謝","B 錯（同學其實不懂），C 相反，D 文中沒說 → 答 A"],"tests":"根據兩篇推論","avoid":"推論要兩篇都撐得住"},{"q":"乙文「旁邊的同學都在點頭」，和結尾哪一句形成對比？","opts":["老師說好幾個人都卡在這裡","我很想假裝懂","老師又講了一次","「其實我也不懂，謝謝你先問。」"],"ans":"D","steps":["開頭：同學點頭，看起來像懂","結尾：同學說「其實我也不懂」","看起來懂、其實不懂，形成對比 → 答 D"],"tests":"找前後對比","avoid":"對比就是前後說法相反"}]}]},{"no":"第 2 組","title":"杞人憂天","skill":"一字多義：同一個字換意思","steps":["❶ 先想這個字你學過的意思（可能不只一個）","❷ 一個一個代回去，不通就換下一個","❸ 用前後文確認：它在講東西、動作，還是「沒有」"],"demo":{"q":"「身亡所寄」的「亡」是什麼意思？","a":["代「死亡」→ 身體死了所寄？不通","代「沒有」→ 自己沒有地方可以安身 → 通","答：沒有"]},"parts":[{"label":"第一篇","title":"杞人憂天","text":["杞國有人，憂天地崩墜，身亡所寄，廢寢食者。又有憂彼之所憂者，因往曉之，曰：「天，積氣耳，亡處亡氣。若屈伸呼吸，終日在天中行止，奈何憂崩墜乎？」"],"cite":"《列子．天瑞》（節選）","notes":"崩墜：塌下來　寄：安身　廢：停止　曉：使他明白　積氣：堆積的空氣　耳：罷了　若：你　行止：活動　奈何：為什麼","trans":"杞國有一個人，擔心天會塌、地會陷，自己沒有地方安身，擔心得吃不下、睡不著。又有一個人為他的擔心而擔心，就去開導他，說：「天不過是堆積的空氣罷了，沒有一個地方沒有空氣。你彎腰伸身、呼氣吸氣，整天都在天裡面活動，為什麼要擔心它塌下來呢？」","qs":[{"q":"「亡處亡氣」的「亡」是什麼意思？","opts":["失去","逃走","沒有","死亡"],"ans":"C","steps":["同一篇前面「身亡所寄」的亡＝沒有","代回：沒有一處沒有空氣 → 通","也符合前一句「天，積氣耳」"],"tests":"一字多義：亡＝無","avoid":"同一篇出現兩次的字，意思常常一樣"},{"q":"「因往曉之」的「之」指的是誰？","opts":["天","那個擔心天塌的杞國人","空氣","作者"],"ans":"B","steps":["之＝他（第 1 週高頻字）","去開導的是第二個人","被開導的是擔心天塌的杞國人"],"tests":"代詞「之」指誰","avoid":"「之」是他時，往前找被做動作的人"},{"q":"開導的人用什麼理由讓杞國人放心？","opts":["天很高，不會掉下來","天只是空氣，我們整天都在裡面活動","天塌了可以搬家","擔心也沒有用"],"ans":"B","steps":["找開導的人說的話：「天，積氣耳」","「終日在天中行止」","D 聽起來有道理，但文中沒說"],"tests":"找人物的理由","avoid":"合理不等於有證據"},{"q":"「又有憂彼之所憂者」是什麼意思？","opts":["又有人很憂傷","又有人讓杞人擔心","又有人覺得杞人很可憐","又有人為杞人的擔心而擔心"],"ans":"D","steps":["彼＝那個人，指前面的杞人","「彼之所憂」＝杞人所擔心的事","前一個「憂」＝擔心 → 為杞人的擔心而擔心 → 答 D"],"tests":"同字不同位置","avoid":"一句裡同一個字出現兩次，分開代回"}]},{"label":"第二篇","title":"兩小兒辯日","text":["孔子東遊，見兩小兒辯鬥，問其故。一兒曰：「我以日始出時去人近，而日中時遠也。」一兒以日初出遠，而日中時近也。一兒曰：「日初出大如車蓋，及日中則如盤盂，此不為遠者小而近者大乎？」一兒曰：「日初出滄滄涼涼，及其日中如探湯，此不為近者熱而遠者涼乎？」孔子不能決也。兩小兒笑曰：「孰為汝多知乎？」"],"cite":"《列子．湯問》","notes":"辯鬥：爭論　故：原因　以：認為　車蓋：古代車上圓形的篷子　盤盂：盤子和碗　滄滄涼涼：涼涼的樣子　探湯：把手伸進熱水　決：判斷　孰：誰　汝：你","trans":"孔子到東方遊歷，看見兩個小孩在爭論，就問他們原因。一個小孩說：「我認為太陽剛出來時離人近，中午時離人遠。」另一個小孩認為太陽剛出來時遠，中午時近。一個小孩說：「太陽剛出來時大得像車篷，到了中午就只像盤子、碗那麼大，這不是遠的小、近的大嗎？」另一個小孩說：「太陽剛出來時涼涼的，到了中午熱得像把手伸進熱水，這不是近的熱、遠的涼嗎？」孔子不能判斷誰對。兩個小孩笑著說：「誰說你知道得很多呢？」","qs":[{"q":"「日始出時去人近」的「去」是什麼意思？","opts":["離開","前往","距離","除去"],"ans":"C","steps":["代回「離開人很近」→ 怪","代回「距離人很近」→ 通","後文一直在比遠近 → 答 C"],"tests":"一字多義：去","avoid":"看到「去」，想一想離開、距離"},{"q":"「而日中時遠也」的「日中」是什麼意思？","opts":["中午","太陽的中心","每天","白天裡"],"ans":"A","steps":["和「日始出」（早上）對比","後文「及其日中如探湯」很熱 → 是中午","「日」單用是太陽，「日中」是中午 → 答 A"],"tests":"一字多義：日","avoid":"同一個字加別的字，意思會變"},{"q":"「孰為汝多知乎」的「為」是什麼意思？","opts":["說，認為","做","為了","成為"],"ans":"A","steps":["代回「誰說你知道得很多呢」→ 通","代回「誰做你知道很多」→ 不通","小孩在笑孔子答不出來 → 答 A"],"tests":"一字多義：為","avoid":"為有很多意思，一個一個代回"},{"q":"主張「早上太陽比較近」的小孩，用什麼當證據？","opts":["太陽早上比較涼","中午比較熱","孔子同意他","太陽早上看起來比較大"],"ans":"D","steps":["證據句：「日初出大如車蓋……此不為遠者小而近者大乎」","看起來大＝近 → 支持早上近","A、B 是另一個小孩的證據；C 孔子沒判斷 → 答 D"],"tests":"找人物的證據","avoid":"先確認哪個證據支持哪個主張"}]},{"label":"第三篇","title":"曹沖稱象","text":["時孫權曾致巨象，太祖欲知其斤重，訪之羣下，咸莫能出其理。沖曰：「置象大船之上，而刻其水痕所至，稱物以載之，則校可知矣。」太祖大悅，即施行焉。"],"cite":"《三國志．魏書．鄧哀王沖傳》（節選）","notes":"孫權：吳國的君主　太祖：曹操　沖：曹沖，曹操的兒子　斤重：重量　訪：詢問　羣下：手下的人　咸：都　置：放　水痕：水的痕跡　校：比較","trans":"那時孫權曾經送來一頭大象，曹操想知道牠有多重，問遍手下的人，都沒有人能想出方法。曹沖說：「把大象放到大船上，在水痕到達的地方刻上記號，再秤其他東西裝上船（裝到同樣的記號），比較一下就知道了。」曹操非常高興，馬上照這個方法去做。","qs":[{"q":"「孫權曾致巨象」的「致」是什麼意思？","opts":["導致","細緻","到達","送來"],"ans":"D","steps":["代回「孫權曾經導致大象」→ 不通","代回「孫權曾經送來大象」→ 通","後文曹操想秤這頭象 → 答 D"],"tests":"一字多義：致","avoid":"代回後，句子要說得通"},{"q":"「咸莫能出其理」的「理」是什麼意思？","opts":["方法，道理","整理","理睬","管理"],"ans":"A","steps":["代回「都沒有人能想出方法」→ 通","下文曹沖馬上說出秤象的方法","所以理＝方法 → 答 A"],"tests":"一字多義：理","avoid":"用下一句來確認字義"},{"q":"「刻其水痕所至」的「其」指什麼？","opts":["大象","曹操","孫權","大船"],"ans":"D","steps":["前一句：「置象大船之上」","水痕是留在船身上的","所以「其」＝船 → 答 D"],"tests":"代詞「其」指誰","avoid":"其＝他的，往前找最近的東西"},{"q":"「咸莫能出其理」的「莫」，和下列哪一個「莫」意思相同？","opts":["請莫喧嘩（不要）","莫名其妙（沒有人能說出）","莫要擔心（不要）","天色已莫（同暮，傍晚）"],"ans":"B","steps":["本篇：「咸莫能出其理」＝都沒有人能","莫名其妙＝沒有人能說出其中的奧妙","A、C 是不要，D 是傍晚 → 答 B"],"tests":"一字多義：莫","avoid":"把兩句都翻出來再比較"}]},{"label":"第四篇","title":"魯人徙越","text":["魯人身善織屨，妻善織縞，而欲徙於越。或謂之曰：「子必窮矣。」魯人曰：「何也？」曰：「屨為履之也，而越人跣行；縞為冠之也，而越人被髮。以子之所長，游於不用之國，欲使無窮，其可得乎？」"],"cite":"《韓非子．說林上》（節選）","notes":"屨：用麻或草編的鞋　縞：白色的絹，可做帽子　徙：搬家　窮：生活困窘　履：穿　跣：光著腳　冠：戴帽子　被髮：披散頭髮　游：前往","trans":"魯國有個人自己很會編鞋子，妻子很會織白絹，他們想搬到越國去。有人對他說：「你一定會過得很困窘。」魯國人說：「為什麼？」那人說：「鞋子是用來穿的，可是越國人光著腳走路；白絹是用來做帽子戴的，可是越國人披散著頭髮。憑你們的長處，到用不上它的國家去，想要不困窘，做得到嗎？」","qs":[{"q":"「魯人身善織屨」的「善」是什麼意思？","opts":["善良","擅長","改善","友善"],"ans":"B","steps":["代回「魯人自己很善良地編鞋」→ 怪","代回「魯人擅長編鞋」→ 通","後文「子之所長」也說這是長處 → 答 B"],"tests":"一字多義：善","avoid":"善放在動作前，常是「擅長」"},{"q":"「或謂之曰」的「或」是什麼意思？","opts":["有人","或者","或許","魯人的妻子"],"ans":"A","steps":["句首「或謂」「或曰」＝有人對他說、有人說","代回「有人對他說」→ 通","D 偷換主詞，文中沒說是妻子 → 答 A"],"tests":"文言「或」＝有人","avoid":"句首的或，先試「有人」"},{"q":"「以子之所長」的「長」是什麼意思？","opts":["長大","長度","擅長的本事，長處","首領"],"ans":"C","steps":["代回「憑你的長處」→ 通","長處就是前面說的編鞋、織絹","D 代回「憑你的首領」不通 → 答 C"],"tests":"一字多義：長","avoid":"同一個字，換一篇意思就可能變"},{"q":"說話的人認為魯人會「窮」，理由是？","opts":["越國太遠走不到","魯人的手藝不好","越國人沒有錢","越人光腳又披髮，用不到他們做的鞋和帽子"],"ans":"D","steps":["證據：「而越人跣行」「而越人被髮」","鞋和帽子在越國用不上","B 相反（文中說善）；A、C 文中沒說 → 答 D"],"tests":"找人物的理由","avoid":"理由要直接在文中找句子"}]},{"label":"第五篇","title":"穿井得一人","text":["宋之丁氏，家無井而出溉汲，常一人居外。及其家穿井，告人曰：「吾穿井得一人。」有聞而傳之者，曰：「丁氏穿井得一人。」國人道之，聞之於宋君。宋君令人問之於丁氏。丁氏對曰：「得一人之使，非得一人於井中也。」求聞之若此，不若無聞也。"],"cite":"《呂氏春秋．察傳》","notes":"溉汲：打水澆田　居外：待在外面（打水）　穿井：挖井　國人：住在都城的人　宋君：宋國的國君","trans":"宋國有一戶姓丁的人家，家裡沒有井，要到外面打水澆田，常常需要一個人一直待在外面。等到他家挖了井，他告訴別人說：「我挖井得到一個人。」有人聽到就傳出去說：「丁家挖井挖到一個人。」都城裡的人都在說這件事，一直傳到宋國國君那裡。宋君派人去問丁家，丁家回答：「是多得到一個人可以使喚，不是在井裡挖到一個人。」像這樣去聽傳言，還不如不聽。","qs":[{"q":"「國人道之」的「道」是什麼意思？","opts":["說，談論","道路","道理","方法"],"ans":"A","steps":["代回「都城的人都在說這件事」→ 通","後面「聞之於宋君」：消息一路傳到國君","所以道＝說 → 答 A"],"tests":"一字多義：道","avoid":"道後面接「之」時，常是「說」"},{"q":"丁氏說「吾穿井得一人」，真正的意思是？","opts":["在井裡挖到一個人","有人掉進井裡","家裡省下一個人力，可以做別的事","請到一個挖井工人"],"ans":"C","steps":["前文：「常一人居外」，要一個人在外打水","有了井，就不用派人在外面","丁氏自己說「得一人之使，非得一人於井中也」→ 答 C"],"tests":"句意理解","avoid":"用文中人物自己的解釋來確認"},{"q":"「得一人之使」的「使」是什麼意思？","opts":["使者","假使","讓，叫","可以使喚的人力"],"ans":"D","steps":["前文：本來要一個人在外打水","代回「得到一個可以使喚的人力」→ 通","「使者」是出使的人，不合 → 答 D"],"tests":"一字多義：使","avoid":"代回後看和前文是否接得上"},{"q":"最後一句「求聞之若此，不若無聞也」想說什麼？","opts":["聽到傳言要查證，否則還不如沒聽到","挖井很辛苦","宋君很關心百姓","不要跟鄰居說話"],"ans":"A","steps":["傳言一路變成「井中挖到人」","宋君派人查證才知道真相","作者結論：這樣聽傳言不如不聽 → 答 A"],"tests":"找作者結論","avoid":"最後一句常是作者的看法"}]}]},{"no":"第 3 組","title":"自相矛盾","skill":"推論：從證據推出結論","steps":["❶ 先找文章明確寫出的事實","❷ 把兩個事實放在一起想：會推出什麼？","❸ 選項要「從證據一定推得出來」，不能是自己腦補的"],"demo":{"q":"「於物無不陷也」是什麼意思？","a":["無＝沒有，不＝不能","「沒有東西不能刺穿」","答：什麼東西都刺得穿"]},"parts":[{"label":"第一篇","title":"自相矛盾","text":["楚人有鬻盾與矛者，譽之曰：「吾盾之堅，莫能陷也。」又譽其矛曰：「吾矛之利，於物無不陷也。」或曰：「以子之矛，陷子之盾，何如？」其人弗能應也。"],"cite":"《韓非子．難一》（節選）","notes":"鬻：賣　譽：誇讚　莫：沒有　陷：刺穿　利：鋒利　子：你　弗：不","trans":"楚國有個賣盾和矛的人，誇他的盾說：「我的盾很堅固，沒有東西能刺穿它。」又誇他的矛說：「我的矛很鋒利，什麼東西都刺得穿。」有人問：「用你的矛，刺你的盾，會怎樣呢？」那個人回答不出來。","qs":[{"q":"「或曰」的「或」是什麼意思？","opts":["或者","有人","或許","他自己"],"ans":"B","steps":["代回「或者說」「或許說」→ 不知道誰說，不通","代回「有人說」→ 通","後面「以子之矛」是在問賣東西的人，所以說話的是別人"],"tests":"文言「或」＝有人","avoid":"句首的「或曰」通常是「有人說」"},{"q":"那個人為什麼「弗能應」？","opts":["他聽不懂問題","不管怎麼回答，都會和自己說過的話衝突","他想趕快賣東西","問的人太兇"],"ans":"B","steps":["事實一：盾什麼都擋得住","事實二：矛什麼都刺得穿","兩件事不可能同時成立 → 怎麼答都錯"],"tests":"把兩個事實放一起推論","avoid":"推論題先把相關的句子都找出來"},{"q":"下列哪個推論有證據？","opts":["楚國人都愛說謊","他的盾其實最堅固","他誇獎商品時把話說得太滿","最後他把矛和盾都賣掉了"],"ans":"C","steps":["A：絕對字「都」，文中只講一個人","B、D：文中沒有這些資料","C：「莫能陷」「無不陷」都是把話說滿"],"tests":"推論和腦補的分別","avoid":"推論要有證據，文中沒有的不能選"},{"q":"「其人弗能應也」的「其人」指誰？","opts":["問問題的人","楚王","買盾的人","賣矛和盾的楚國人"],"ans":"D","steps":["「或曰」是有人在問賣東西的人","回答不出來的，是被問的那個人","被問的是賣矛和盾的楚國人 → 答 D"],"tests":"補主詞","avoid":"誰被問，誰就要回答"}]},{"label":"第二篇","title":"晏子使楚","text":["晏子至，楚王賜晏子酒。酒酣，吏二縛一人詣王。王曰：「縛者曷為者也？」對曰：「齊人也，坐盜。」王視晏子曰：「齊人固善盜乎？」晏子避席對曰：「嬰聞之，橘生淮南則為橘，生于淮北則為枳，葉徒相似，其實味不同。所以然者何？水土異也。今民生長於齊不盜，入楚則盜，得無楚之水土使民善盜耶？」王笑曰：「聖人非所與熙也，寡人反取病焉。」"],"cite":"《晏子春秋．內篇雜下》（節選）","notes":"晏子：齊國的大臣晏嬰　酣：喝得正高興　吏：小官　詣：到……那裡　曷為：做什麼　坐：犯了……罪　固：本來　避席：離開座位，表示鄭重　枳：一種果實又酸又苦的樹　徒：只是　得無……耶：該不會是……吧　熙：同「嬉」，開玩笑　寡人：國君自稱","trans":"晏子到了楚國，楚王請晏子喝酒。喝得正高興時，兩個小官綁著一個人來見楚王。楚王問：「綁著的是什麼人？」小官回答：「是齊國人，犯了偷竊罪。」楚王看著晏子說：「齊國人本來就很會偷東西嗎？」晏子離開座位回答：「我聽說，橘樹長在淮河以南就是橘，長在淮河以北就變成枳，只是葉子相像，果實的味道卻不一樣。為什麼會這樣呢？因為水土不同。現在這個人在齊國長大時不偷東西，到了楚國就偷，該不會是楚國的水土讓人變得很會偷吧？」楚王笑著說：「聖人是不能隨便開玩笑的，我反而自討沒趣了。」","qs":[{"q":"「其實味不同」的「實」是什麼意思？","opts":["其實，事實上","果實","實在","誠實"],"ans":"B","steps":["前一句「葉徒相似」在講葉子","後面講「味」，吃的是果實","其實＝它的果實（古今異義）→ 答 B"],"tests":"古今異義：其實","avoid":"看前後在比什麼東西"},{"q":"楚王讓小官綁一個齊國人上來，最可能的目的是？","opts":["讓晏子難堪，暗示齊國人愛偷東西","請晏子幫忙審案","表示歡迎晏子","把犯人交給晏子帶回齊國"],"ans":"A","steps":["證據一：「王視晏子曰：齊人固善盜乎？」","證據二：最後楚王說「寡人反取病焉」","本來想讓晏子難堪，反被反擊 → 答 A"],"tests":"從證據推目的","avoid":"用結尾回頭推人物的動機"},{"q":"晏子用橘和枳來比，想推出什麼結論？","opts":["齊國的橘子比較好吃","淮北的水土比較好","這個人變成小偷，是楚國的環境造成的","齊國人本來就愛偷"],"ans":"C","steps":["橘變枳，因為「水土異也」","「生長於齊不盜，入楚則盜」","推出：是楚國的水土讓人變成小偷；D 是楚王的說法 → 答 C"],"tests":"比喻推論","avoid":"比喻的兩邊要一一對上"},{"q":"「寡人反取病焉」，可以推知楚王當時的心情？","opts":["很生氣，想處罰晏子","覺得晏子在說謊","想羞辱別人反而讓自己難堪，只好笑著認輸","非常感謝晏子"],"ans":"C","steps":["證據：「王笑曰」","「反取病」＝反而讓自己難堪","笑著自嘲，是認輸；A、B、D 沒有證據 → 答 C"],"tests":"推人物心情","avoid":"心情要從動作和說的話推"}]},{"label":"第三篇","title":"不死之藥","text":["有獻不死之藥於荊王者，謁者操之以入。中射之士問曰：「可食乎？」曰：「可。」因奪而食之。王大怒，使人殺中射之士。中射之士使人說王曰：「臣問謁者曰可食，臣故食之，是臣無罪，而罪在謁者也。且客獻不死之藥，臣食之而王殺臣，是死藥也，是客欺王也。夫殺無罪之臣，而明人之欺王也，不如釋臣。」王乃不殺。"],"cite":"《韓非子．說林上》","notes":"荊王：楚王　謁者：負責通報的官員　操：拿著　中射之士：宮中的侍衛官　說：勸說　客：指獻藥的人　明：讓大家知道　釋：放了","trans":"有人向楚王獻上不死之藥，通報的官員拿著藥走進宮。宮中的侍衛官問：「可以吃嗎？」官員說：「可以。」侍衛官就搶過來吃了。楚王大怒，派人要殺侍衛官。侍衛官託人勸楚王說：「我問通報官，他說可以吃，所以我才吃，可見我沒有罪，罪在通報官。而且客人獻的是不死之藥，我吃了，大王卻殺了我，那就是死藥，等於是客人欺騙了大王。殺掉沒有罪的我，又讓大家知道大王被騙了，不如放了我。」楚王就沒有殺他。","qs":[{"q":"「臣故食之」的「故」是什麼意思？","opts":["所以","故意","原因","從前"],"ans":"A","steps":["前一句：「臣問謁者曰可食」","因為問過、說可以吃 → 所以才吃","侍衛要說明自己無罪，不會說「故意」→ 答 A"],"tests":"虛詞：故＝所以","avoid":"前因後果之間的故，常是所以"},{"q":"侍衛說「是死藥也」，他的推論是？","opts":["藥本來就有毒","侍衛自己會被毒死","吃了不死之藥還會被殺，就證明它不是不死之藥","大王本來就不想吃藥"],"ans":"C","steps":["事實一：客人說這是不死之藥","事實二：吃了還會被大王殺死","兩件事放一起：那就是「死藥」→ 答 C"],"tests":"兩個事實推結論","avoid":"把相關的兩句放在一起想"},{"q":"侍衛認為大王殺了他，會造成什麼結果？","opts":["讓大家知道大王被獻藥的人騙了","證明藥真的有效","大王會長生不老","謁者會升官"],"ans":"A","steps":["證據：「夫殺無罪之臣，而明人之欺王也」","明＝讓大家知道","殺他＝公開大王被騙 → 答 A"],"tests":"找證據句","avoid":"推論題先找最直接的那一句"},{"q":"根據全文，可以推知侍衛是個怎樣的人？","opts":["膽小怕事","做事從來不犯錯","從不違反規定","機智，很會講道理"],"ans":"D","steps":["他用兩層道理說服楚王，最後「王乃不殺」","B、C 錯：他搶了大王的藥","A 錯：他敢搶藥又敢辯解 → 答 D"],"tests":"推人物個性","avoid":"個性要用人物做的事來證明"}]},{"label":"第四篇","title":"宋人資章甫","text":["宋人資章甫而適諸越，越人斷髮文身，無所用之。"],"cite":"《莊子．逍遙遊》（節選）","notes":"資：帶著貨物去賣　章甫：古代一種禮帽　諸：之於　斷髮：剪短頭髮　文身：在身上刺花紋","trans":"宋國有人帶著禮帽到越國去賣，可是越國人剪短頭髮、身上刺著花紋，根本用不到禮帽。","qs":[{"q":"「適諸越」的「適」是什麼意思？","opts":["適合","舒適","往，到","恰好"],"ans":"C","steps":["代回「宋人帶著帽子適合越國」→ 不通","代回「宋人帶著帽子到越國」→ 通","後面寫的都是越國的情形 → 答 C"],"tests":"字義：適＝往","avoid":"適後面接地名，常是「往」"},{"q":"「無所用之」的「之」指什麼？","opts":["章甫（禮帽）","越國人","宋國人","頭髮"],"ans":"A","steps":["之＝它，往前找被「用」的東西","宋人帶去的是章甫","越國人用不到的是禮帽 → 答 A"],"tests":"代詞「之」指什麼","avoid":"先問：用不到的是什麼東西"},{"q":"從「越人斷髮文身」可以推出什麼？","opts":["越國人不需要戴禮帽","越國人很兇","越國人很窮","越國人討厭宋國人"],"ans":"A","steps":["事實：越人剪短頭髮，沒有束髮戴帽的習慣","結果：「無所用之」","只能推到不需要禮帽；B、C、D 沒有證據 → 答 A"],"tests":"推論和腦補","avoid":"文中沒有的形容詞不能選"},{"q":"下列哪個情況，和宋人的遭遇最像？","opts":["在雨季賣雨傘","在學校門口賣文具","在球場旁賣運動飲料","到從來不下雨的沙漠村莊賣雨傘"],"ans":"D","steps":["宋人：把東西帶到用不到的地方","D 同樣是對方用不到","A、B、C 都是需要的地方 → 答 D"],"tests":"類比推論","avoid":"找和故事「結構一樣」的情況"}]},{"label":"第五篇","title":"郢書燕說","text":["郢人有遺燕相國書者，夜書，火不明，因謂持燭者曰：「舉燭。」云而過書「舉燭」。舉燭，非書意也。燕相受書而說之，曰：「舉燭者，尚明也；尚明也者，舉賢而任之。」"],"cite":"《韓非子．外儲說左上》（節選）","notes":"郢：楚國的都城　遺：送給，音ㄨㄟˋ　相國：宰相　燭：蠟燭　云：說　過：錯誤地　尚明：崇尚光明　任：任用","trans":"楚國郢都有個人要寫信給燕國的宰相，晚上寫信時燭火不夠亮，就對拿蠟燭的人說：「把蠟燭舉高。」一邊說，一邊不小心把「舉燭」兩個字寫進信裡。「舉燭」並不是信本來要說的意思。燕國宰相收到信後解釋說：「舉燭，就是崇尚光明；崇尚光明，就是要推舉賢能的人並任用他。」","qs":[{"q":"「遺燕相國書」和「夜書」的兩個「書」，意思分別是？","opts":["都是書本","信；寫字","寫字；信","都是寫字"],"ans":"B","steps":["「遺……書」：送給宰相的東西 → 信","「夜書」：晚上做的動作 → 寫","前信後寫 → 答 B"],"tests":"一字多義：書","avoid":"先看它是東西還是動作"},{"q":"燕相收到信後，把「舉燭」解釋成什麼意思？","opts":["把蠟燭舉高一點","晚上寫信要點燈","崇尚光明，推舉賢能的人來任用","拿蠟燭的人最重要"],"ans":"C","steps":["證據句：「舉燭者，尚明也；尚明也者，舉賢而任之」","A 是郢人當時嘴上說的話，不是燕相的解釋；B、D 文中沒說","燕相解釋成崇尚光明、任用賢人 → 答 C"],"tests":"找人物的解讀","avoid":"人物怎麼解釋，回原句找"},{"q":"可以推知「舉燭」兩個字為什麼會出現在信裡？","opts":["郢人邊說邊寫，不小心多寫進去","郢人想勸燕相任用賢人","拿蠟燭的人寫的","燕相自己加上去的"],"ans":"A","steps":["證據：「云而過書『舉燭』」","又說「舉燭，非書意也」","B 是燕相的解讀，不是郢人本意 → 答 A"],"tests":"從證據推原因","avoid":"人物的想法和事實要分開"},{"q":"從本文可以推論出哪個道理？","opts":["寫信一定要在白天","燕相什麼都不懂","蠟燭越亮越好","解讀文字不能只照自己的想法，要看原意"],"ans":"D","steps":["事實：「舉燭」是寫錯的","燕相卻解釋出一大套道理","推出：不能照自己的想法亂解釋；B 有絕對字 → 答 D"],"tests":"推出道理","avoid":"有「一定」「什麼都」要小心"}]}]},{"no":"第 4 組","title":"睡覺也在讀書","skill":"段落重點：每段寫一句話","steps":["❶ 讀完一段，停下來問：這段在說什麼？","❷ 用 15 個字以內寫在段落旁邊","❸ 每段的一句話連起來，就是全文大意","❹ 有「但是」「所以」的段落通常最重要"],"demo":{"q":"第一段的重點是什麼？","a":["找轉折詞「但是」","後面說：睡覺時大腦會整理白天學的東西","答：睡覺時大腦在整理學過的東西"]},"parts":[{"label":"第一篇","title":"睡覺也在讀書","text":["考試前一晚，很多人會熬夜讀書，覺得多讀一小時就多記一點。但是，許多研究發現，睡覺並不是在浪費時間。人睡著的時候，大腦仍在工作，會把白天學到的東西重新整理、存放好，就像把散落一地的球收進球籃。","如果睡得太少，大腦來不及整理，新學的內容就容易像沒收好的球一樣滾走。有些人熬夜之後，第二天上課昏昏沉沉，前一晚背的東西也想不起來，就是這個原因。","所以，想把書讀進腦袋裡，除了認真讀，也要留時間給大腦整理。與其熬夜硬撐，不如早點睡，隔天早上再花十分鐘複習一次。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段主要在說什麼？","opts":["熬夜的人上課會睡著","睡太少，大腦來不及整理，學的東西容易忘","球沒收好會滾走","背東西要大聲唸"],"ans":"B","steps":["第二段第一句：睡太少，大腦來不及整理","後面熬夜的例子是在支持這句話","A 是例子的一部分，C 是比喻，都不是重點"],"tests":"分辨重點和例子","avoid":"例子和比喻是幫你懂的，不是重點本身"},{"q":"作者用「把散落一地的球收進球籃」比喻什麼？","opts":["運動前要整理器材","睡覺時大腦整理白天學的東西","讀書要像打球一樣用力","房間要保持整齊"],"ans":"B","steps":["比喻前面那句：大腦會把白天學到的東西整理、存放好","「就像」後面就是比喻","比喻＝前面那件事"],"tests":"看懂比喻","avoid":"「就像」前面那句，就是比喻在說的事"},{"q":"作者最後的建議是？","opts":["考前一晚多讀一小時","完全不用複習","早點睡，隔天早上再複習十分鐘","只要睡飽就一定考滿分"],"ans":"C","steps":["結論在第三段「所以」後面","「不如早點睡，隔天早上再花十分鐘複習」","D 有絕對字「一定」，文中也沒說"],"tests":"用總結詞找結論","avoid":"建議題直接找「所以」「不如」那一句"},{"q":"把三段的重點連起來，全文大意最接近？","opts":["熬夜讀書最有效","考試前一晚不要讀書","球要好好收進球籃","睡覺時大腦會整理所學，所以讀書也要睡飽"],"ans":"D","steps":["第一段：睡覺時大腦在整理學過的東西","第二段：睡太少容易忘；第三段：早點睡、隔天複習","連起來就是 D；C 是比喻，A 相反"],"tests":"段落重點連成大意","avoid":"每段一句話，連起來就是大意"}]},{"label":"第二篇","title":"打球前為什麼要熱身","text":["很多人一到球場就急著投籃、衝刺，覺得熱身很浪費時間。但是，熱身其實是打球前很重要的準備。慢跑、拉筋、原地小跳這些動作，會讓心跳慢慢加快、身體溫度升高，肌肉和關節也會比較靈活，就像電腦開機後要等一下才跑得順。","如果沒有熱身就突然用力跳躍或急停，肌肉還沒準備好，比較容易拉傷或扭傷腳踝。有些球員一上場就猛衝，第一節還沒打完就受傷下場，整場比賽只能坐在場邊看。","所以，上場前花十分鐘熱身，不是浪費時間，而是讓自己打得更久、更安全。下次到球場，別急著投第一球，先把身體叫醒吧！"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的重點是什麼？","opts":["熱身能讓身體準備好，是打球前重要的準備","很多人一到球場就急著投籃","電腦開機要等一下","慢跑比投籃重要"],"ans":"A","steps":["找轉折詞「但是」","後面：熱身其實是打球前很重要的準備","B 是開頭的現象，C 是比喻 → 答 A"],"tests":"找段落重點","avoid":"「但是」後面通常是重點"},{"q":"第二段「有些球員……只能坐在場邊看」在文中的作用是？","opts":["段落重點","舉例支持「沒熱身容易受傷」","比喻","作者的建議"],"ans":"B","steps":["第二段第一句：沒熱身容易拉傷、扭傷","後面球員受傷下場是真實情況的例子","例子是用來支持重點的 → 答 B"],"tests":"分辨重點和例子","avoid":"例子是幫重點作證的"},{"q":"作者把熱身比喻成什麼？","opts":["吃早餐","收球進球籃","電腦開機後等一下才跑得順","看比賽影片"],"ans":"C","steps":["找「就像」：「就像電腦開機後要等一下才跑得順」","熱身＝讓身體先暖機","所以比喻是電腦開機 → 答 C"],"tests":"看懂比喻","avoid":"看到「就像」，後面就是比喻"},{"q":"第三段的重點是什麼？","opts":["十分鐘太長了","到球場不可以投籃","熱身比比賽還重要","熱身讓人打得更久、更安全，不是浪費時間"],"ans":"D","steps":["找總結詞「所以」","後面：不是浪費時間，而是讓自己打得更久、更安全","C 是誇大，文中沒說 → 答 D"],"tests":"用總結詞找重點","avoid":"「所以」後面常是全文結論"}]},{"label":"第三篇","title":"柴犬每天都要散步","text":["有人以為狗狗只要有吃有住就很快樂，其實大部分的狗每天都需要出門散步。柴犬原本是日本人帶進山裡打獵的犬種，精力旺盛，好奇心也很強。散步時，牠可以活動筋骨，還能用鼻子聞各種氣味，認識外面的世界。","如果整天被關在家裡，精力沒地方用，有些狗會變得焦躁，開始咬拖鞋、抓沙發，或一直亂叫。這不一定是牠「學壞了」，而是牠太無聊了。","所以，養柴犬不只要餵飽牠，也要每天陪牠散步。散步回來的柴犬，常常累得趴在地上呼呼大睡，主人和狗都輕鬆。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段主要在說什麼？","opts":["柴犬來自日本","大部分的狗每天都需要出門散步","狗的鼻子很靈","狗有吃有住就很快樂"],"ans":"B","steps":["找「其實」：其實大部分的狗每天都需要出門散步","柴犬打獵、聞氣味，都是在說明為什麼要散步","D 是作者要反駁的想法 → 答 B"],"tests":"找段落重點","avoid":"「其實」後面常是作者真正的看法"},{"q":"第二段「咬拖鞋、抓沙發」是在說明什麼？","opts":["柴犬天生個性很壞","拖鞋的味道很吸引狗","主人應該換新沙發","狗精力沒地方用、太無聊時可能出現的行為"],"ans":"D","steps":["第二段第一句：整天被關、精力沒地方用","咬拖鞋、抓沙發是例子","A 正好是作者否定的 → 答 D"],"tests":"分辨重點和例子","avoid":"先找例子在幫哪一句作證"},{"q":"根據第二段，作者認為狗亂咬東西的原因可能是？","opts":["太無聊了","學壞了","肚子餓了","生病了"],"ans":"A","steps":["證據：「這不一定是牠學壞了，而是牠太無聊了」","「不是……而是」，後面才是作者的意思","B 被作者否定；C、D 文中沒說 → 答 A"],"tests":"找作者的看法","avoid":"「而是」後面才是作者的答案"},{"q":"全文大意最接近？","opts":["柴犬散步回來會呼呼大睡","柴犬以前很會打獵","養柴犬要餵飽，也要每天陪牠散步","狗絕對不能待在家裡"],"ans":"C","steps":["第三段「所以」：不只要餵飽，也要每天陪牠散步","前兩段在說明散步的好處和不散步的問題","D 有絕對字；A、B 是細節 → 答 C"],"tests":"段落重點連成大意","avoid":"大意要能蓋住每一段"}]},{"label":"第四篇","title":"先偵察，再進攻","text":["玩戰術任務遊戲時，很多新手一開場就衝進敵人的基地，結果常常一下子就被打倒。厲害的玩家不一樣，他們會先派人偵察，看清楚地圖上哪裡有掩護、哪裡是死路，再決定從哪一條路進攻。","偵察看起來很慢，好像浪費了好幾十秒。但是，知道敵人在哪裡，就能避開陷阱，也能找到最好的時機出手。就像打籃球前先看對手的比賽影片，知道誰最會投三分，防守時就知道要盯誰。","讀文章也是一樣。先看題目、圈出關鍵字，再去文章找證據，就像先偵察再進攻。動手之前先想清楚，常常能更快完成任務。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段主要在比較什麼？","opts":["新手和厲害玩家開場的做法不同","地圖有多大","敵人基地有多危險","遊戲有多難"],"ans":"A","steps":["前半：新手一開場就衝","後半：「厲害的玩家不一樣」，先偵察","一段在比兩種做法 → 答 A"],"tests":"找段落重點","avoid":"看到「不一樣」，就是在比較"},{"q":"第二段的重點句是哪一句？","opts":["但是，知道敵人在哪裡，就能避開陷阱、找到好時機","偵察看起來很慢","就像打籃球前先看對手的比賽影片","防守時就知道要盯誰"],"ans":"A","steps":["第一句說偵察「看起來」很慢","「但是」後面說出偵察的好處，是重點","C、D 是類比 → 答 A"],"tests":"找重點句","avoid":"「但是」後面通常是重點"},{"q":"第二段寫「打籃球前先看對手的比賽影片」，作用是？","opts":["作者的結論","遊戲規則","用打籃球來類比，幫助了解偵察的好處","段落重點"],"ans":"C","steps":["找「就像」","用熟悉的籃球，說明先了解對手的好處","類比是幫你懂，不是重點本身 → 答 C"],"tests":"看懂類比","avoid":"「就像」後面是幫你懂的例子"},{"q":"第三段作者把「偵察」連到哪件事？","opts":["寫功課要越快越好","玩遊戲要每天練習","籃球比賽要多看影片","讀文章先看題目、圈關鍵字，再找證據"],"ans":"D","steps":["第三段開頭：「讀文章也是一樣」","「先看題目、圈出關鍵字，再去文章找證據」","就像先偵察再進攻 → 答 D"],"tests":"找段落重點","avoid":"每段第一句常告訴你這段講什麼"}]},{"label":"第五篇","title":"讀書可以分段來","text":["很多人以為讀書要一口氣坐好幾個小時才算認真。可是坐太久，注意力會越來越分散，眼睛盯著課本，腦袋卻已經在想午餐要吃什麼。","有一種方法叫「番茄鐘」：先專心讀二十五分鐘，再休息五分鐘，這樣算一輪。休息時可以起來走一走、喝口水，但不要滑手機。因為時間短，比較容易撐住不分心；又有休息可以期待，讀起來比較不痛苦。","所以，讀書不一定要拚時間長短，而是要讓每一段時間都真的專心。就像練球分成好幾組一樣，把讀書分段，反而能讀得更多。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段在說明什麼問題？","opts":["讀書坐太久，注意力會越來越分散","午餐很重要","讀書一定要坐好幾個小時","課本太難"],"ans":"A","steps":["找轉折詞「可是」","後面：坐太久，注意力會越來越分散","C 是作者要反駁的想法 → 答 A"],"tests":"找段落重點","avoid":"「可是」後面通常是重點"},{"q":"第二段主要介紹什麼？","opts":["休息時可以滑手機","讀書一定很痛苦","讀書時要多喝水","番茄鐘：讀二十五分鐘、休息五分鐘，比較容易專心"],"ans":"D","steps":["第二段第一句介紹「番茄鐘」","後面說明它為什麼容易專心","A 相反（文中說不要滑手機）→ 答 D"],"tests":"找段落重點","avoid":"選項和原文相反的，先刪掉"},{"q":"第三段「就像練球分成好幾組一樣」是？","opts":["段落重點","反駁別人的話","用練球來比喻分段讀書","一個數據"],"ans":"C","steps":["找「就像」","用練球分組，比喻讀書分段","比喻是幫你懂的 → 答 C"],"tests":"看懂比喻","avoid":"看到「就像」，後面就是比喻"},{"q":"作者最主要的主張是什麼？","opts":["讀書時間越長越好","休息比讀書重要","一定要用番茄鐘才讀得好","讀書要讓每段時間都專心，分段讀反而讀得更多"],"ans":"D","steps":["第三段「所以」：不一定拚長短，要每一段都專心","A 相反；B 文中沒說","C 有絕對字「一定」→ 答 D"],"tests":"用總結詞找主張","avoid":"有「一定」的選項要特別小心"}]}]},{"no":"第 5 組","title":"狐假虎威","skill":"寓言三問：故事背後的道理","steps":["❶ 故事表面：發生了什麼事？","❷ 誰像現實中的哪種人？","❸ 作者想告訴我們什麼？（通常就是成語的意思）"],"demo":{"q":"用三問想「守株待兔」","a":["表面：農夫放下工作等兔子","像誰：想不努力就有收穫的人","道理：不能把一次運氣當成每次都會發生"]},"parts":[{"label":"第一篇","title":"狐假虎威","text":["虎求百獸而食之，得狐。狐曰：「子無敢食我也。天帝使我長百獸，今子食我，是逆天帝命也。子以我為不信，吾為子先行，子隨我後，觀百獸之見我而敢不走乎？」虎以為然，故遂與之行。獸見之皆走。虎不知獸畏己而走也，以為畏狐也。"],"cite":"《戰國策．楚策一》（節選）","notes":"求：尋找　子：你　長：當首領　逆：違背　信：誠實　然：對的　畏：怕","trans":"老虎尋找各種野獸來吃，抓到一隻狐狸。狐狸說：「你不敢吃我。天帝派我當百獸的首領，現在你吃我，就是違背天帝的命令。你如果認為我不誠實，我走在你前面，你跟在我後面，看看百獸見到我敢不逃跑嗎？」老虎認為有道理，就和牠一起走。野獸看見牠們都逃跑了。老虎不知道野獸是怕自己才逃跑，以為是怕狐狸。","qs":[{"q":"「獸見之皆走」的「走」是什麼意思？","opts":["走路","逃跑","離開","走漏"],"ans":"B","steps":["第 1 週背過：走＝跑","代回：野獸看見都逃跑 → 通","古今異義：現在的「走」是走路"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"野獸真正害怕的是誰？","opts":["狐狸","老虎","天帝","獵人"],"ans":"B","steps":["找證據：「虎不知獸畏己而走也」","「己」指老虎自己","野獸怕的是老虎，老虎卻以為是怕狐狸"],"tests":"找出真相的證據句","avoid":"故事人物以為的，不一定是真的"},{"q":"「狐假虎威」比喻哪一種人？","opts":["力氣很大的人","借別人的勢力來嚇唬人的人","很會跑步的人","尊敬長輩的人"],"ans":"B","steps":["表面：狐狸跟老虎走，野獸都逃","狐狸自己沒有本事，靠的是老虎","像現實中借別人勢力嚇人的人"],"tests":"寓言的比喻","avoid":"先想故事裡誰靠誰，再對應到人"},{"q":"「得狐」是誰抓到狐狸？","opts":["獵人","天帝","百獸","老虎"],"ans":"D","steps":["前一句：「虎求百獸而食之」，主詞是虎","「得狐」承前省略主詞","抓到狐狸的是老虎 → 答 D"],"tests":"補主詞","avoid":"沒寫主詞，就往前一句找"}]},{"label":"第二篇","title":"驚弓之鳥","text":["有間，雁從東方來，更羸以虛發而下之。魏王曰：「然則射可至此乎？」更羸曰：「此孽也。」王曰：「先生何以知之？」對曰：「其飛徐而鳴悲。飛徐者，故瘡痛也；鳴悲者，久失群也。故瘡未息，而驚心未去也。聞弦音，引而高飛，故瘡隕也。」"],"cite":"《戰國策．楚策四》（節選）","notes":"有間：過了一會兒　更羸：魏國的神射手　虛發：只拉弓弦，不放箭　然則：那麼　孽：受過傷的鳥　徐：慢　故瘡：舊傷口　息：癒合　引：用力往上　故瘡隕：舊傷裂開而掉下來","trans":"過了一會兒，有一隻雁從東方飛來，更羸只拉弓弦不放箭，就讓雁掉了下來。魏王說：「那麼射箭的本領可以到這種地步嗎？」更羸說：「這是一隻受過傷的雁。」魏王問：「先生怎麼知道？」更羸回答：「牠飛得慢，叫聲悲哀。飛得慢，是因為舊傷在痛；叫聲悲哀，是因為離開雁群很久了。舊傷還沒好，驚嚇的心也還沒消除，一聽到弓弦的聲音，就用力往高處飛，結果舊傷裂開，就掉下來了。」","qs":[{"q":"「更羸以虛發而下之」的「下」是什麼意思？","opts":["使……掉下來","下面","下次","走下去"],"ans":"A","steps":["「之」指那隻雁","代回「讓雁掉下來」→ 通","後文也說「故瘡隕也」，雁掉下來 → 答 A"],"tests":"一字多義：下","avoid":"下後面接「之」，常是動作"},{"q":"更羸從哪兩個線索知道雁受過傷？","opts":["飛得慢、叫聲悲哀","顏色和大小","從東方來、飛得很高","魏王告訴他"],"ans":"A","steps":["證據句：「其飛徐而鳴悲」","徐＝慢；鳴悲＝叫聲悲哀","C 的「飛得高」是聽到弦聲之後 → 答 A"],"tests":"找證據句","avoid":"問「怎麼知道」，就找人物說的理由"},{"q":"寓言三問①：雁掉下來真正的原因是？","opts":["被箭射中","更羸的力氣很大","舊傷沒好又受驚，用力高飛使傷口裂開","天氣太冷飛不動"],"ans":"C","steps":["更羸是「虛發」，沒有放箭，A 錯","證據：「聞弦音，引而高飛，故瘡隕也」","是受驚加舊傷 → 答 C"],"tests":"寓言表面","avoid":"先弄清楚故事真正發生什麼事"},{"q":"「驚弓之鳥」比喻哪一種人？","opts":["射箭很準的人","很會觀察的人","喜歡飛的人","受過驚嚇，一有動靜就非常害怕的人"],"ans":"D","steps":["表面：受過傷的雁，一聽弦聲就驚慌","像誰：受過驚嚇、一點動靜就怕的人","成語說的是雁，不是更羸 → 答 D"],"tests":"寓言的比喻","avoid":"成語的主角是誰，就比喻誰"}]},{"label":"第三篇","title":"三人成虎","text":["龐葱與太子質於邯鄲，謂魏王曰：「今一人言市有虎，王信之乎？」王曰：「否。」「二人言市有虎，王信之乎？」王曰：「寡人疑之矣。」「三人言市有虎，王信之乎？」王曰：「寡人信之矣。」龐葱曰：「夫市之無虎明矣，然而三人言而成虎。」"],"cite":"《戰國策．魏策二》（節選）","notes":"龐葱：魏國的大臣　質：到別國當人質　邯鄲：趙國的都城　市：市集　寡人：國君自稱　夫：句首發語詞","trans":"龐葱要陪太子到邯鄲去當人質，他對魏王說：「如果現在有一個人說市集上有老虎，大王相信嗎？」魏王說：「不信。」「如果有兩個人說市集上有老虎，大王相信嗎？」魏王說：「我會有點懷疑了。」「如果有三個人說市集上有老虎，大王相信嗎？」魏王說：「我會相信了。」龐葱說：「市集上沒有老虎，是很清楚的事，可是三個人都這麼說，就好像真的有老虎了。」","qs":[{"q":"「夫市之無虎明矣」的「明」是什麼意思？","opts":["明天","光明","清楚，明白","聰明"],"ans":"C","steps":["代回「市集沒有老虎是很清楚的事」→ 通","後面「然而」轉折：但是三個人說了就像有","所以明＝清楚 → 答 C"],"tests":"一字多義：明","avoid":"每個意思代回，選最通的"},{"q":"魏王的態度怎麼變化？","opts":["不信→懷疑→相信","相信→懷疑→不信","一直都不信","一直都相信"],"ans":"A","steps":["一人說：「否」","二人說：「寡人疑之矣」；三人說：「寡人信之矣」","依序是不信、懷疑、相信 → 答 A"],"tests":"寓言表面","avoid":"按順序把人物的話排出來"},{"q":"「三人言而成虎」說明了什麼道理？","opts":["市集上常常有老虎","謠言說的人多了，就會讓人信以為真","三個人比兩個人聰明","老虎喜歡人多的地方"],"ans":"B","steps":["表面：市集明明沒老虎","三個人都說，魏王就信了","道理：謠言重複多次，就讓人信以為真 → 答 B"],"tests":"寓言的道理","avoid":"道理要用故事的結果來推"},{"q":"下列哪一件事最像「三人成虎」？","opts":["三個隊友一起加練投籃","老師提醒了三次要交作業","我連續投進三顆三分球","三個同學都說明天放假，我就信了，結果根本沒放假"],"ans":"D","steps":["三人成虎：不是真的事，說的人多就信了","D：放假是假消息，聽多了就信","B 是真的消息，不是謠言 → 答 D"],"tests":"寓言對應生活","avoid":"比較結構：假消息＋很多人說"}]},{"label":"第四篇","title":"黔之驢","text":["黔無驢，有好事者船載以入。至則無可用，放之山下。虎見之，龐然大物也，以為神，蔽林間窺之。稍出近之，憖憖然，莫相知。他日，驢一鳴，虎大駭，遠遁，以為且噬己也，甚恐。然往來視之，覺無異能者；益習其聲，又近出前後，終不敢搏。"],"cite":"柳宗元〈三戒．黔之驢〉（節選）","notes":"黔：今貴州一帶　好事者：喜歡多事的人　龐然：高大的樣子　蔽：躲藏　窺：偷看　憖憖然：小心謹慎的樣子　駭：害怕　遁：逃走　且：將要　噬：咬　異能：特別的本領　習：熟悉　搏：撲上去抓","trans":"黔地本來沒有驢子，有個喜歡多事的人用船載了一頭進去。運到以後沒有什麼用處，就把牠放在山下。老虎看見牠，是個高大的東西，以為是神，就躲在樹林裡偷看。慢慢走出來靠近牠，小心謹慎，不知道牠是什麼東西。有一天，驢子叫了一聲，老虎非常害怕，逃得遠遠的，以為驢子要咬自己了，非常恐懼。但是來來回回觀察牠，覺得牠沒有什麼特別的本領；越來越熟悉牠的叫聲，又在牠前後靠近，但始終不敢撲上去。","qs":[{"q":"「然往來視之」的「然」是什麼意思？","opts":["對的","這樣","但是","燃燒"],"ans":"C","steps":["前面：老虎「甚恐」，非常害怕","後面：覺得驢子沒什麼本領，前後相反","前後相反＝但是；「虎以為然」的然才是對的 → 答 C"],"tests":"一字多義：然","avoid":"前後意思相反時，然＝但是"},{"q":"老虎一開始為什麼「以為神」？","opts":["驢子會說話","好事者告訴牠","驢子長得高大，老虎從沒見過","驢子咬過老虎"],"ans":"C","steps":["證據：「黔無驢」，當地沒有驢","又寫「龐然大物也，以為神」","高大又沒見過 → 答 C"],"tests":"找原因的證據","avoid":"原因可能分散在兩句裡"},{"q":"老虎對驢子的態度怎麼變化？","opts":["害怕→觀察→越來越熟悉、敢靠近","熟悉→害怕→逃走","一直很害怕，不敢看","一開始就撲上去"],"ans":"A","steps":["先：「以為神」「甚恐」","再：「往來視之」，觀察","後：「益習其聲，又近出前後」→ 答 A"],"tests":"寓言表面","avoid":"按時間順序排出角色的變化"},{"q":"驢子「龐然大物」卻「無異能」，像現實中哪一種人？","opts":["個子高、很會打球的人","聲音大、很會唱歌的人","喜歡到處旅行的人","外表看起來很厲害，其實沒有真本事的人"],"ans":"D","steps":["證據一：「龐然大物也，以為神」→ 外表嚇人","證據二：「覺無異能者」→ 沒有特別本領","外表厲害、裡面沒本事 → 答 D"],"tests":"寓言的比喻","avoid":"把角色的外表和真本事分開看"}]},{"label":"第五篇","title":"井底之蛙","text":["井鼃不可以語於海者，拘於虛也；夏蟲不可以語於冰者，篤於時也；曲士不可以語於道者，束於教也。"],"cite":"《莊子．秋水》（節選）","notes":"鼃：同「蛙」　拘：限制　虛：同「墟」，住的地方　篤：固守、受限制　曲士：見識淺的人　束：拘束","trans":"井裡的青蛙，沒辦法和牠談論大海，因為牠被住的地方限制了；夏天的蟲，沒辦法和牠談論冰，因為牠受季節時間的限制；見識淺的人，沒辦法和他談論大道理，因為他被所受的教育限制住了。","qs":[{"q":"「不可以語於海」的「語」是什麼意思？","opts":["語言","談論，告訴","成語","自言自語"],"ans":"B","steps":["代回「不能和牠談論大海」→ 通","後面兩句「語於冰」「語於道」也是談論","語在這裡是動作 → 答 B"],"tests":"字義：語＝談論","avoid":"語後面接「於」，通常是動作"},{"q":"為什麼「夏蟲不可以語於冰」？","opts":["夏蟲很笨聽不懂","冰太冷，蟲會凍死","夏蟲只活在夏天，受時間限制，沒見過冰","夏蟲不喜歡冰"],"ans":"C","steps":["證據：「篤於時也」","受季節時間的限制","只活在夏天，看不到冰 → 答 C"],"tests":"找原因的證據","avoid":"每一句後半就是原因"},{"q":"三句話共同說明什麼？","opts":["見識會被環境、時間、所受的教育限制","青蛙住在井裡最安全","冬天比夏天好","讀書沒有用"],"ans":"A","steps":["拘於虛（地方）、篤於時（時間）、束於教（教育）","三句都在說「被限制」","D 是誤解「束於教」→ 答 A"],"tests":"找共同道理","avoid":"句型重複時，找相同的部分"},{"q":"「井底之蛙」比喻哪一種人？","opts":["住在鄉下的人","喜歡游泳的人","很會跳的人","見識狹小，以為自己看到的就是全部的人"],"ans":"D","steps":["表面：青蛙住在井裡，看不到大海","像誰：只看到眼前一小塊的人","道理：不要被眼前的範圍限制 → 答 D"],"tests":"寓言的比喻","avoid":"先想角色缺少什麼，再對應到人"}]}]},{"no":"週末關卡","title":"鷸蚌相爭","skill":"五步全用（綜合）","steps":["❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標","❹ 一字多義：代回去試　❺ 寓言三問找道理","完成後錄一支 60 秒「古文翻譯官」短片"],"parts":[{"label":"第一篇","title":"鷸蚌相爭","text":["蚌方出曝，而鷸啄其肉，蚌合而拑其喙。鷸曰：「今日不雨，明日不雨，即有死蚌。」蚌亦謂鷸曰：「今日不出，明日不出，即有死鷸。」兩者不肯相舍，漁者得而并禽之。"],"cite":"《戰國策．燕策》","notes":"蚌：有兩片硬殼的貝類　方：正在　曝：曬太陽　鷸：長嘴的水鳥　拑：夾住　喙：鳥嘴　即：就　舍：放開　并：一起　禽：同「擒」，抓","trans":"蚌正從水裡出來曬太陽，鷸鳥就去啄牠的肉，蚌把殼合起來夾住鷸鳥的嘴。鷸鳥說：「今天不下雨，明天不下雨，就會有一隻死蚌。」蚌也對鷸鳥說：「今天不放你出去，明天不放你出去，就會有一隻死鷸鳥。」兩個都不肯放開對方，漁夫走過來把牠們一起抓走了。","qs":[{"q":"「蚌合而拑其喙」的「其」指誰？","opts":["蚌","鷸","漁夫","作者"],"ans":"B","steps":["前一句：鷸啄蚌的肉","蚌合起殼，夾住誰的嘴？","喙是鳥嘴 → 其＝鷸"],"tests":"代詞「其」指誰","avoid":"「其」＝他的，往前找最近的人或動物"},{"q":"「而鷸啄其肉」的「而」是什麼意思？","opts":["然後、就","但是","因為","如果"],"ans":"A","steps":["蚌出來曬太陽 → 鷸就去啄","前後是接著發生的事，不是相反","所以「而」＝然後、就"],"tests":"虛詞「而」的順接","avoid":"換成「然後」「但是」各讀一次"},{"q":"「漁者得而并禽之」說明了什麼道理？","opts":["漁夫很努力","雙方爭執不讓，結果讓第三者得利","鳥比蚌聰明","天氣會影響捕魚"],"ans":"B","steps":["表面：鷸和蚌都不放開","結果：漁夫一次抓兩個","道理：兩方相爭，第三方得利（鷸蚌相爭，
