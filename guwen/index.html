慚色。西蜀之去南海，不知幾千里也，僧富者不能至而貧者至焉。人之立志，顧不如蜀鄙之僧哉？"],"cite":"彭端淑〈為學一首示子姪〉（節選）","notes":"蜀：今四川　鄙：邊境　僧：和尚　恃：依靠　缽：和尚盛飯的器具　越明年：到了第二年　慚：慚愧　去：距離　顧：難道、反而","trans":"四川的邊境有兩個和尚，一個窮，一個有錢。窮和尚對有錢的和尚說：「我想到南海去，你覺得怎麼樣？」有錢的和尚說：「你靠什麼去呢？」窮和尚說：「我有一個水瓶、一個飯缽就夠了。」有錢的和尚說：「我好幾年來一直想租船順江而下，都還沒辦到。你靠什麼去呢！」到了第二年，窮和尚從南海回來，把這件事告訴有錢的和尚，有錢的和尚露出慚愧的神色。四川西部距離南海，不知道有幾千里，有錢的和尚去不了，窮和尚卻到了。一個人立定志向，難道還不如四川邊境的那個和尚嗎？","qs":[{"q":"「貧者語於富者曰」的「語」是什麼意思？","opts":["語言","成語","語文課","告訴、對……說"],"ans":"D","steps":["第1招：代回名詞「語言」：窮和尚語言於富和尚 → 不通","第2招看後面：接著是「曰」和說的話，是說話的動作","所以「語」當動詞：告訴"],"tests":"詞性：語當動詞","avoid":"後面接「曰」，前面多半是說話的動作"},{"q":"「欲買舟而下」的「下」是什麼意思？","opts":["下面","下雨","順著江往下游走","下船"],"ans":"C","steps":["第1招：「下」平常是方位詞，代回「想買船而下面」不通","第2招看目的：他要從四川去南海，買船是為了出發，所以不是下船","方位詞「下」當動詞：順流而下"],"tests":"詞類活用：下","avoid":"「而」連接兩邊，常常都是動作"},{"q":"「吾欲之南海」的「之」是什麼意思？","opts":["他","這個","往、到","的"],"ans":"C","steps":["第1招代回：「我想往南海」→ 通；「我想的南海」不通","第2招看對話：富和尚接著問「子何恃而往」，用「往」回應","兩招都指向：之＝往"],"tests":"虛詞當動詞：之","avoid":"「之」後面接地方，多半是「往」"},{"q":"作者用兩個和尚的故事，想說什麼？","opts":["有錢人都很懶惰","立定志向並去做，條件差也能成功","去南海一定要坐船","和尚應該一直待在寺廟"],"ans":"B","steps":["富和尚有錢卻「不能至」，貧和尚只有一瓶一缽卻「至焉」","最後一句：「人之立志，顧不如蜀鄙之僧哉」","所以重點是立志和行動，不是有沒有錢"],"tests":"主旨","avoid":"作者的結論常在最後一句"}]},{"label":"第四篇","title":"王冕好學","text":["王冕者，諸暨人。七八歲時，父命牧牛隴上，竊入學舍，聽諸生誦書；聽已，輒默記。暮歸，忘其牛，或牽牛來責蹊田。父怒，撻之。已而復如初。","母曰：「兒癡如此，曷不聽其所為？」冕因去，依僧寺以居。夜潛出，坐佛膝上，執策映長明燈讀之，琅琅達旦。"],"cite":"宋濂〈王冕傳〉（節選）","notes":"諸暨：地名，在今浙江　隴：田埂　竊：偷偷地　學舍：學堂　諸生：學生們　輒：就　或：有人　撻：用鞭子、棍子打　已而：不久　曷：為什麼　依：投靠　潛：偷偷地　策：書　長明燈：佛像前日夜點著的燈　琅琅：讀書的聲音　旦：天亮","trans":"王冕是諸暨人。七八歲的時候，父親叫他在田埂上放牛，他偷偷跑進學堂，聽學生們讀書；聽完了，就默默記住。傍晚回家，把牛忘了，有人牽著牛來責備牛踩壞了田。父親很生氣，打了他。過不久，他又像原來一樣。母親說：「這孩子這麼著迷，為什麼不由著他去做呢？」王冕因此離開家，住在寺廟裡。夜裡他偷偷出來，坐在佛像的膝上，拿著書，就著長明燈的光讀書，琅琅的讀書聲一直到天亮。","qs":[{"q":"「或牽牛來責蹊田」的「蹊」是什麼意思？","opts":["踩踏","小路","溪水","奇怪"],"ans":"A","steps":["第1招：「蹊」平常是名詞「小路」（蹊徑），代回「責備小路田」讀不通","第2招看情節：王冕忘了牛，牛亂跑，主人牽牛來責備 → 牛把田踩壞了","名詞「小路」當動詞：踩踏"],"tests":"詞類活用：蹊","avoid":"名詞讀不通，想想它變成什麼動作"},{"q":"下列「」中的字，哪一個和「蹊田」的「蹊」一樣，是名詞當動詞用？","opts":["「父命牧牛」的「牛」","「聽諸生誦書」的「書」","「但微頷之」的「頷」","「依僧寺以居」的「寺」"],"ans":"C","steps":["「牛」「書」「寺」都在動詞後面，還是東西","「頷」本來是下巴，「微頷之」是微微點頭的動作","所以「頷」和「蹊」一樣，名詞當動詞"],"tests":"詞類活用：判斷","avoid":"看它前後是不是接著動作"},{"q":"「父怒，撻之。已而復如初」，又「像原來一樣」的是誰？","opts":["母親","父親","牽牛來的人","王冕"],"ans":"D","steps":["往前找：被打的是王冕（撻之的「之」）","「如初」＝像原來一樣，又偷跑去學堂聽書","所以主詞是王冕"],"tests":"補主詞","avoid":"主詞省略時，想想誰會做這件事"},{"q":"王冕是怎樣的孩子？","opts":["很怕黑，不敢出門","最喜歡放牛","不聽話，又很懶惰","非常好學，被打也不改，夜裡還借燈讀書"],"ans":"D","steps":["證據一：放牛時偷偷去學堂，聽完就默記","證據二：被打後「復如初」；住寺廟時夜裡借燈讀到天亮","兩個證據合起來：非常好學"],"tests":"人物：兩個證據","avoid":"把前後兩段的動作放在一起看"}]},{"label":"第五篇","title":"南轅北轍","text":["今者臣來，見人於大行，方北面而持其駕，告臣曰：「我欲之楚。」臣曰：「君之楚，將奚為北面？」曰：「吾馬良。」臣曰：「馬雖良，此非楚之路也。」曰：「吾用多。」臣曰：「用雖多，此非楚之路也。」曰：「吾御者善。」此數者愈善，而離楚愈遠耳。"],"cite":"《戰國策．魏策四》（節選）","notes":"臣：古人對君王說話時自稱　大行：大路（一說太行山）　方：正在　持其駕：駕著他的車　楚：楚國，在南方　奚為：為什麼　良：好　御者：駕車的人　此數者：這幾樣條件　愈：越","trans":"今天我來的時候，在大路上看見一個人，正面向北方駕著他的車，告訴我說：「我要到楚國去。」我說：「你要到楚國，為什麼往北走呢？」他說：「我的馬好。」我說：「馬雖然好，但這不是去楚國的路啊。」他說：「我的路費多。」我說：「路費雖然多，但這不是去楚國的路啊。」他說：「我的車夫技術好。」這幾樣條件越好，離楚國反而越遠。","qs":[{"q":"「方北面而持其駕」的「面」是什麼意思？","opts":["臉","麵條","面向、朝著","表面"],"ans":"C","steps":["第1招：「面」平常是名詞「臉」，代回「北邊的臉」不通","第2招看情節：楚國在南方，他卻往北；所以臣問「奚為北面」","名詞當動詞：面向北方"],"tests":"詞類活用：面","avoid":"名詞代回不通，就換成動作"},{"q":"「吾用多」的「用」是什麼意思？","opts":["路費","用處","用力","使用"],"ans":"A","steps":["第1招代回「我使用多」讀不通","第2招看前後：他列出的條件是馬好、用多、車夫好，都是旅行的本錢","動詞「用」在這裡當名詞：花用的錢，路費"],"tests":"詞性：用當名詞","avoid":"放在「吾」後面，常是一樣東西"},{"q":"那人說自己有哪三個條件？","opts":["車好、路費多、認識路","馬好、路費多、車夫技術好","馬好、路近、天氣好","馬好、朋友多、車夫技術好"],"ans":"B","steps":["依順序找他的三句回答","「吾馬良」「吾用多」「吾御者善」","文中沒說路近、認識路或朋友多"],"tests":"敘事順序：找證據","avoid":"按順序把對話一句一句找出來"},{"q":"這個故事告訴我們什麼？","opts":["馬好最重要","出遠門要帶很多錢","去楚國要走大路","方向錯了，條件越好，離目標越遠"],"ans":"D","steps":["最後一句：「此數者愈善，而離楚愈遠耳」","馬好、錢多、車夫好，卻往反方向走","所以方向比條件更重要"],"tests":"寓言道理","avoid":"最後一句常是作者的結論"}]}]},{"no":"第 4 組","title":"登鸛雀樓","skill":"唐詩：找畫面、找心情","steps":["❶ 先圈景物：山、水、月、鳥、船、聲音","❷ 把景物排成一個畫面：什麼時間？遠還是近？上還是下？","❸ 圈出帶心情的字：愁、孤、獨、寒、輕、愛","❹ 問：詩人看到這個畫面，心情是什麼？用詩裡的字當證據"],"demo":{"q":"「舉頭望明月，低頭思故鄉。」詩人的心情是什麼？","a":["先看材料：李白〈靜夜思〉「舉頭望明月，低頭思故鄉。」","→ 找畫面：夜裡一個人抬頭看月亮，又低下頭","→ 找心情字：「思故鄉」","答：想念家鄉"]},"parts":[{"label":"第一篇","title":"登鸛雀樓","text":["白日依山盡，黃河入海流。","欲窮千里目，更上一層樓。"],"cite":"王之渙〈登鸛雀樓〉","notes":"鸛雀樓：樓名，在今山西，可以遠望黃河　白日：太陽　依：靠著　盡：落下、消失　更：再","trans":"太陽靠著西邊的山慢慢落下，黃河向著大海奔流。想要看盡千里之外的風景，就要再登上一層樓。","qs":[{"q":"前兩句寫了哪些景物？","opts":["月亮、星星、河","樓、人、船","太陽、山、黃河、大海","雲、雨、山"],"ans":"C","steps":["「白日依山盡」：太陽、山","「黃河入海流」：黃河、大海","前兩句沒有寫月亮、船、雨"],"tests":"找景物","avoid":"一句一句圈出名詞"},{"q":"「白日依山盡」寫的是什麼時候？","opts":["傍晚，太陽下山","半夜","清晨，太陽升起","正中午"],"ans":"A","steps":["「依山盡」＝太陽靠著山落下去","太陽落到山後，就是傍晚","日出是太陽從山後升起，方向相反"],"tests":"找畫面：時間","avoid":"看太陽是「上來」還是「下去」"},{"q":"「欲窮千里目」的「窮」是什麼意思？","opts":["困苦","追問到底","貧窮","看盡、到盡頭"],"ans":"D","steps":["第1招組詞「無窮」＝沒有盡頭，代回「想要看盡千里遠」→ 通","第2招看目的：下一句「更上一層樓」，爬高是為了看得更遠","所以窮＝盡"],"tests":"字義：窮","avoid":"看下一句的動作，驗證上一句"},{"q":"後兩句表現詩人什麼想法？","opts":["害怕爬太高的樓","想念遠方的家鄉","想看得更遠，就要再往高處登，積極向上","對黃河感到憂愁"],"ans":"C","steps":["「欲窮千里目」：想看到更遠","「更上一層樓」：就要再往上爬","詩裡沒有愁、怕、思鄉的字"],"tests":"找心情：想法","avoid":"沒有證據的心情不能選"}]},{"label":"第二篇","title":"江雪","text":["千山鳥飛絕，萬徑人蹤滅。","孤舟蓑笠翁，獨釣寒江雪。"],"cite":"柳宗元〈江雪〉","notes":"絕：沒有了　蹤：腳印　滅：消失　蓑笠：蓑衣和斗笠，用草或竹子做的雨具","trans":"所有的山上都看不到飛鳥，所有的小路上都沒有人的腳印。一條孤單的小船上，坐著一個穿蓑衣、戴斗笠的老人，獨自在下著雪的寒冷江面上釣魚。","qs":[{"q":"「萬徑人蹤滅」的「徑」是什麼意思？","opts":["直徑","經過","竟然","小路"],"ans":"D","steps":["第1招組詞「小徑」，代回「所有小路上都沒有人的腳印」→ 通","第4招比對稱句：「千山」對「萬徑」，山和路都是地方","所以徑＝小路"],"tests":"字義：徑","avoid":"對稱的兩句，字的種類常相同"},{"q":"前兩句畫出了怎樣的畫面？","opts":["鳥在山上飛來飛去，很熱鬧","山上開滿了花","山上沒有鳥、路上沒有人，一片寂靜","路上很多人在掃雪"],"ans":"C","steps":["「鳥飛絕」：鳥都不見了","「人蹤滅」：連腳印都沒有","所以畫面是空無一人的寂靜"],"tests":"找畫面","avoid":"「絕、滅」都是「沒有了」的意思"},{"q":"詩中的老人在哪裡、做什麼？","opts":["在熱天的湖邊游泳","在岸邊樹下睡覺","在屋子裡看雪","在下雪的寒冷江上，坐在小船裡釣魚"],"ans":"D","steps":["「孤舟」：一條小船","「獨釣寒江雪」：在冷冷的、下雪的江上釣魚","文中沒寫岸邊或屋子"],"tests":"找畫面：人物","avoid":"人物的位置和動作都要有證據"},{"q":"「孤」「獨」兩個字，讓人感受到什麼？","opts":["孤單、清冷","興奮、期待","生氣、不滿","熱鬧、歡樂"],"ans":"A","steps":["「孤舟」「獨釣」：只有一個人","再加上「寒江雪」，又冷又靜","所以感受是孤單、清冷"],"tests":"找心情字","avoid":"先圈帶心情的字，再判斷"}]},{"label":"第三篇","title":"楓橋夜泊","text":["月落烏啼霜滿天，江楓漁火對愁眠。","姑蘇城外寒山寺，夜半鐘聲到客船。"],"cite":"張繼〈楓橋夜泊〉","notes":"楓橋：橋名，在今江蘇蘇州　泊：船靠岸停下　烏：烏鴉　江楓：江邊的楓樹　漁火：漁船上的燈火　姑蘇：蘇州的別名　寒山寺：寺廟名　客船：旅客坐的船，指詩人的船","trans":"月亮落下，烏鴉啼叫，寒霜好像布滿了天空；對著江邊的楓樹和漁船上的燈火，我帶著憂愁難以入睡。蘇州城外的寒山寺，半夜敲鐘的聲音，傳到了我坐的客船上。","qs":[{"q":"這首詩寫的是什麼時候？","opts":["夜裡","傍晚剛吃完飯","中午","清晨"],"ans":"A","steps":["題目「夜泊」：夜裡停船","詩中「月落」「夜半鐘聲」","幾個證據都指向夜裡"],"tests":"找畫面：時間","avoid":"題目也是找證據的地方"},{"q":"詩人當時的心情是什麼？","opts":["無聊，想睡覺","生氣，想罵人","開心，想唱歌","憂愁，睡不著"],"ans":"D","steps":["心情字：「對愁眠」","帶著愁躺著，又聽到半夜的鐘聲 → 一直沒睡著","所以是憂愁難眠"],"tests":"找心情字","avoid":"詩裡直接寫出的情緒字最可靠"},{"q":"詩中寫到了哪些聲音？","opts":["烏鴉叫聲、寺廟鐘聲","雨聲、風聲","漁夫唱歌聲","狗叫聲、雞叫聲"],"ans":"A","steps":["「烏啼」：烏鴉叫","「鐘聲到客船」：寺廟的鐘聲","詩中沒有寫雨、風、歌聲"],"tests":"找景物：聲音","avoid":"聲音也是畫面的一部分"},{"q":"「夜半鐘聲到客船」有什麼效果？","opts":["表示船要開進寺廟裡","半夜聽得見遠處的鐘聲，更顯得夜晚安靜、旅人孤單","表示天亮了，船要出發","表示寺廟在開熱鬧的活動"],"ans":"B","steps":["寒山寺在「城外」，鐘聲遠遠傳來還聽得見","代表四周非常安靜","再配上前面的「愁眠」，更顯孤單"],"tests":"寫法：以聲襯靜","avoid":"遠處的聲音聽得到，表示很安靜"}]},{"label":"第四篇","title":"早發白帝城","text":["朝辭白帝彩雲間，千里江陵一日還。","兩岸猿聲啼不住，輕舟已過萬重山。"],"cite":"李白〈早發白帝城〉","notes":"發：出發　白帝：白帝城，在長江邊的高山上　江陵：地名，在今湖北　還：回到　啼不住：叫個不停　萬重山：一層又一層的山","trans":"早上告別了高聳在彩雲之間的白帝城，千里遠的江陵，一天就到了。兩岸的猿猴叫聲還沒停，輕快的小船已經駛過了一層又一層的高山。","qs":[{"q":"「朝辭白帝彩雲間」，詩人是什麼時候出發的？","opts":["傍晚","中午","早上","半夜"],"ans":"C","steps":["第1招組詞「朝陽」＝早上的太陽 → 朝＝早上","第2招看題目：「早發」白帝城","兩個證據都是早上"],"tests":"字義：朝","avoid":"題目和組詞一起驗證"},{"q":"「千里江陵一日還」，「千里」和「一日」放在一起，想表現什麼？","opts":["江陵很難到達","船走得非常快","回家花了很長的時間","江陵其實很近"],"ans":"B","steps":["「千里」是很遠，「一日」是很短","很遠的路很短的時間就到了","所以是在說船行很快"],"tests":"找畫面：速度","avoid":"把兩個數字放在一起比"},{"q":"詩中寫了哪些景物或聲音？","opts":["月亮、鐘聲、楓樹","彩雲、兩岸猿聲、一重重的山","黃河、大海、高樓","雪、老人、小船"],"ans":"B","steps":["第一句：彩雲","第三句：兩岸猿聲","第四句：萬重山"],"tests":"找景物","avoid":"一句一句圈出景物"},{"q":"「輕舟已過萬重山」的「輕」，最能看出詩人什麼心情？","opts":["輕鬆愉快","緊張害怕","沉重難過","生氣不滿"],"ans":"A","steps":["船很快地穿過重重高山","用「輕」來形容船，也帶出心情的輕快","全詩沒有「愁、怕」之類的字"],"tests":"找心情","avoid":"形容事物的字，也會透露心情"}]},{"label":"第五篇","title":"山行","text":["遠上寒山石徑斜，白雲生處有人家。","停車坐愛楓林晚，霜葉紅於二月花。"],"cite":"杜牧〈山行〉","notes":"寒山：深秋時的山　石徑：石頭小路　斜：彎彎曲曲　白雲生處：白雲升起的地方　楓林晚：傍晚的楓樹林　霜葉：經過霜打的楓葉","trans":"一條彎彎曲曲的石頭小路，遠遠地通到深秋的山上，在白雲升起的地方，有幾戶人家。我停下車子，是因為喜愛傍晚的楓樹林，經過霜打的楓葉，比二月的春花還要紅。","qs":[{"q":"「停車坐愛楓林晚」的「坐」是什麼意思？","opts":["座位","因為","坐下","乘坐"],"ans":"B","steps":["第1招組詞「坐下」代回：停車坐下愛楓林，和下一句接不起來","第2招看動作目的：詩人停車，是為了欣賞傍晚的楓林 → 說的是停車的原因","所以坐＝因為（古今異義）"],"tests":"古今異義：坐","avoid":"古今異義字，要用動作目的驗證"},{"q":"詩人為什麼停車？","opts":["要去山上找人家","迷路了","喜愛傍晚的楓林","車子壞了"],"ans":"C","steps":["「停車坐愛楓林晚」：因為喜愛楓林晚景","下一句接著稱讚霜葉很紅","文中沒寫車壞或迷路"],"tests":"因果：找原因","avoid":"原因就藏在「坐（因為）」後面"},{"q":"「霜葉紅於二月花」是什麼意思？","opts":["楓葉到了二月才變紅","經過霜打的楓葉，比二月的花還紅","二月的花比楓葉更紅","霜把花凍成了紅色"],"ans":"B","steps":["「紅於」＝比……紅","誰比誰紅？霜葉 比 二月花","所以是楓葉更紅"],"tests":"句意：比較","avoid":"「於」放在形容詞後面，常是「比」"},{"q":"這首詩寫的是什麼季節？","opts":["冬天","夏天","春天","秋天"],"ans":"D","steps":["證據：寒山、霜葉、楓林","楓葉經霜變紅，又還掛在樹上，正是秋天","「二月花」只是拿來比較，不是當時的季節"],"tests":"找畫面：季節","avoid":"拿來比較的東西，不是眼前的景"}]}]},{"no":"第 5 組","title":"籃球為什麼要運球","skill":"說明文結構：總說、分說、總結","steps":["❶ 找總說：第一段先說「這篇要講什麼」","❷ 找分說：數一數有幾個重點，常用「第一、第二、首先、其次、再看」","❸ 找總結：最後一段常有「總之、所以、總而言之」","❹ 檢查：分說的每一點，都在回答總說提出的問題"],"demo":{"q":"下面這段文字，哪一句是「總說」？","a":["先看材料：「跳繩是很好的運動。它可以練腳力，也可以練節奏感。總之，每天跳一跳，身體更靈活。」","→ 第一句「跳繩是很好的運動」，先說全段要講什麼 → 總說","→ 中間「練腳力、練節奏感」是分說；「總之」後面是總結","答：「跳繩是很好的運動」是總說"]},"parts":[{"label":"第一篇","title":"籃球為什麼要運球","text":["剛學籃球的人常會問：為什麼拿到球不能抱著跑？其實，運球是籃球規則的要求，也是很重要的進攻技巧。","第一，運球是規則規定的。拿著球的人想要帶著球移動，就必須一邊移動、一邊把球拍到地上；如果抱著球走了好幾步，裁判就會判「走步」違例，球權交給對方。","第二，運球可以把球帶到前場。從後場往前推進時，控球的球員常常一邊運球，一邊抬頭觀察隊友的位置。","第三，運球可以甩開防守。用換手、轉身、忽快忽慢的運球動作，可以讓防守的人跟不上，製造投籃或傳球的機會。","總之，運球不只是為了遵守規則，更是帶球前進、突破防守的武器。想打好籃球，就要先練好運球。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"哪一段是「總說」？","opts":["第二段","第五段","第一段","第三段"],"ans":"C","steps":["第一段先問「為什麼不能抱著跑」，再說運球是規則也是技巧","這是全篇要回答的問題 → 總說","第五段有「總之」，是總結"],"tests":"結構：找總說","avoid":"總說在開頭，先提出全篇主題"},{"q":"分說一共說了幾個理由？","opts":["三個：規則規定、帶球到前場、甩開防守","兩個：規則規定、甩開防守","一個：遵守規則","四個：規則、前進、防守、投籃"],"ans":"A","steps":["圈出路標：第一、第二、第三","每個路標後面各有一個理由","投籃只是「甩開防守」帶來的機會，不是另一個理由"],"tests":"結構：數分說","avoid":"圈出「第一、第二、第三」來數"},{"q":"第五段的作用是什麼？","opts":["總結前面三點，並提醒要先練好運球","說明走步違例怎麼判","介紹控球球員的工作","提出第四個新理由"],"ans":"A","steps":["第五段開頭是「總之」","「遵守規則、帶球前進、突破防守」就是前面三點","最後加上提醒：先練好運球"],"tests":"結構：找總結","avoid":"看到「總之」，就是總結"},{"q":"根據文章，下列哪個說法正確？","opts":["只有控球的球員需要運球","只要會運球，一定能得分","運球只是為了好看","抱著球走好幾步，會被判走步違例"],"ans":"D","steps":["第二段：「抱著球走了好幾步，裁判就會判走步違例」","「只有」「一定」都是絕對字，文中沒有這麼說","總結說運球是武器，不是為了好看"],"tests":"白話找證據","avoid":"選項的每個字都回文找證據"}]},{"label":"第二篇","title":"地圖上的三個好幫手","text":["打開一張地圖，上面密密麻麻的線條和符號，要怎麼看懂呢？只要認識地圖上的三個好幫手：方向、比例尺和圖例，就能讀懂大部分的地圖。","方向告訴我們哪裡是北方。很多地圖會畫上指北針；如果地圖上沒有畫，通常就是「上北、下南、左西、右東」。","比例尺告訴我們地圖縮小了多少。例如比例尺寫著「一公分代表一公里」，地圖上兩個地點相距三公分，實際距離就大約是三公里。","圖例告訴我們符號代表什麼。例如藍色的線可能是河流，小十字可能是醫院，先看圖例，就不會猜錯。","所以，看地圖之前，先找一找這三個好幫手，地圖就不再是一團亂線了。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"總說段提出了哪三個好幫手？","opts":["方向、比例尺、圖例","方向、線條、符號","比例尺、公分、公里","指北針、河流、醫院"],"ans":"A","steps":["第一段：「三個好幫手：方向、比例尺和圖例」","後面三段就是一個一個介紹","指北針、河流、醫院只是分說裡的例子"],"tests":"結構：找總說","avoid":"總說常把重點一次列出來"},{"q":"如果地圖上沒有畫指北針，通常哪一邊是北方？","opts":["上面","左邊","下面","右邊"],"ans":"A","steps":["第二段：「通常就是上北、下南、左西、右東」","上＝北","所以上面是北方"],"tests":"白話找證據","avoid":"回到分說那一段找答案"},{"q":"比例尺是「一公分代表一公里」，地圖上相距三公分，實際大約多遠？","opts":["三十公里","三公里","三公分","一公里"],"ans":"B","steps":["第三段：一公分代表一公里","三公分就是三個一公里","所以大約三公里"],"tests":"找證據：計算","avoid":"照文中的例子一步一步算"},{"q":"這篇文章的結構是什麼？","opts":["只有分說，沒有總結","總結 → 分說 → 總說","總說 → 分說三點 → 總結","先講一個故事，再說道理"],"ans":"C","steps":["第一段提出三個好幫手 → 總說","第二到四段各講一個 → 分說","第五段「所以」→ 總結"],"tests":"結構：全篇","avoid":"每段寫一個字：總、分、分、分、結"}]},{"label":"第三篇","title":"狗狗用身體說話","text":["狗狗不會說人話，但牠們會用身體「說話」。只要注意尾巴、耳朵和身體姿勢，就能猜出狗狗的心情。","先看尾巴。很多人以為狗狗搖尾巴就是開心，其實不一定。放鬆地、大大地左右搖，通常是開心；如果尾巴夾在兩腿中間，常常表示害怕或緊張。","再看耳朵。耳朵往後貼平，可能是緊張或害怕；耳朵豎起來、朝向前方，代表牠正在專心注意某個東西。","最後看姿勢。狗狗前腳趴低、屁股翹高，常常是在邀請你一起玩。","不過，每隻狗狗的個性不同，最好把幾個訊號放在一起看。讀懂狗狗的身體語言，就能和牠當更好的朋友。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的作用是什麼？","opts":["分說：介紹尾巴的動作","總結：提醒大家要多看幾個訊號","舉例：說明狗狗怎麼邀請人玩","總說：狗狗會用尾巴、耳朵和姿勢表達心情"],"ans":"D","steps":["第一段先說「狗狗會用身體說話」","再列出三個地方：尾巴、耳朵、姿勢","後面三段分別說明 → 第一段是總說"],"tests":"結構：找總說","avoid":"開頭先列重點，就是總說"},{"q":"根據文章，狗狗搖尾巴代表什麼？","opts":["代表肚子餓了","不一定是開心，要看怎麼搖","一定是開心","一定是害怕"],"ans":"B","steps":["第二段：「以為搖尾巴就是開心，其實不一定」","大大地搖通常是開心；夾著尾巴常是害怕","「一定」是絕對字，和文章相反"],"tests":"白話找證據：絕對字","avoid":"看到「一定」，先回文比一比"},{"q":"分說的順序是什麼？","opts":["尾巴 → 姿勢 → 耳朵","姿勢 → 耳朵 → 尾巴","耳朵 → 尾巴 → 姿勢","尾巴 → 耳朵 → 姿勢"],"ans":"D","steps":["路標：「先看」尾巴","「再看」耳朵","「最後看」姿勢"],"tests":"結構：分說順序","avoid":"圈出「先、再、最後」"},{"q":"最後一段為什麼提醒「每隻狗狗的個性不同」？","opts":["說明所有狗狗都一樣","提醒讀者不要只看一個訊號就下結論","叫大家不要養狗","介紹第四個身體訊號"],"ans":"B","steps":["原文：「最好把幾個訊號放在一起看」","意思是只看一個動作可能會猜錯","總結段沒有提出新的訊號"],"tests":"結構：總結的作用","avoid":"總結也可能加上提醒"}]},{"label":"第四篇","title":"種子發芽需要什麼","text":["種下一顆綠豆，過幾天就可能冒出小芽。種子要發芽，需要哪些條件呢？最重要的有三個：水、空氣和適當的溫度。","首先是水。乾乾的種子吸了水，會慢慢膨脹，外皮變軟，裡面的小芽才有辦法開始生長。","其次是空氣。種子發芽時也需要呼吸。如果把種子整個泡在水裡太久，空氣不夠，種子可能會爛掉。","第三是溫度。太冷的時候，很多種子會像「睡著」一樣不發芽；溫度合適，它們才會醒過來。","所以，在家種綠豆時，記得讓棉花保持濕潤、不要淹水，再放在溫暖的地方，就有機會看到小芽冒出來。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"分說用了哪些詞標出順序？","opts":["因為、所以、但是","第一、第二、總之","先看、再看、最後看","首先、其次、第三"],"ans":"D","steps":["第二段開頭「首先」","第三段開頭「其次」，第四段開頭「第三」","「所以」在最後一段，是總結"],"tests":"結構：分說路標","avoid":"每段第一個詞，常是順序路標"},{"q":"為什麼不能把種子整個泡在水裡太久？","opts":["水太冷了","空氣不夠，種子可能會爛掉","種子會長得太快","種子會浮起來"],"ans":"B","steps":["第三段：「整個泡在水裡太久，空氣不夠，種子可能會爛掉」","這一段在說「空氣」這個條件","其他選項文中都沒有提到"],"tests":"白話找證據","avoid":"先想這題屬於哪一個分說"},{"q":"最後一段的作用是什麼？","opts":["介紹綠豆的營養","提出第四個發芽條件","用前面三個條件，總結出在家種綠豆的方法","說明種子為什麼要呼吸"],"ans":"C","steps":["保持濕潤＝水；不要淹水＝空氣；溫暖的地方＝溫度","正好對應前面三點","開頭「所以」，是總結"],"tests":"結構：找總結","avoid":"總結會把前面的重點收回來"},{"q":"根據文章，下列哪個說法有證據？","opts":["種子發芽不需要空氣","給種子的水越多越好","所有種子不管多冷都會發芽","種子吸水後會膨脹，外皮變軟"],"ans":"D","steps":["第二段：「吸了水，會慢慢膨脹，外皮變軟」","第四段說太冷很多種子不發芽；第三段說泡太久會爛","所以其他選項都和文章相反"],"tests":"白話找證據","avoid":"相反的說法，一找就能排除"}]},{"label":"第五篇","title":"回收三步驟","text":["喝完的鋁罐、看完的報紙、用完的寶特瓶，都有機會變成新的東西。不過，要把回收做好，可以記住三個步驟：倒乾淨、壓扁、分類放。","第一步，倒乾淨。飲料瓶裡如果還有剩下的飲料，放久了會發臭、招來螞蟻，也會弄髒其他回收物，所以要先倒掉，再簡單沖一下。","第二步，壓扁。寶特瓶和鋁罐壓扁以後，佔的空間變小，回收袋可以裝得更多，回收車也能載得更多。","第三步，分類放。紙類、塑膠、金屬分開放；如果全部混在一起，回收場的人就要花更多時間重新整理。","總而言之，只要倒乾淨、壓扁、分類放，每個人都能讓回收變得更有效率。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"總說段告訴我們什麼？","opts":["回收要做好，可以記住三個步驟","鋁罐最值錢","寶特瓶要丟垃圾桶","報紙不能回收"],"ans":"A","steps":["第一段：「要把回收做好，可以記住三個步驟」","後面三段就是這三個步驟","其他選項文中都沒有說"],"tests":"結構：找總說","avoid":"總說是全篇要回答的問題"},{"q":"為什麼要把寶特瓶和鋁罐壓扁？","opts":["壓扁才不會發臭","佔的空間變小，可以裝、載得更多","壓扁比較好看","回收場規定一定要壓扁"],"ans":"B","steps":["第二步那一段：「佔的空間變小，回收袋可以裝得更多」","不會發臭是「倒乾淨」的理由，不是壓扁","「一定要」文中沒有說"],"tests":"白話找證據","avoid":"每個理由屬於哪一步，不要混"},{"q":"「總而言之」出現在哪裡？代表什麼？","opts":["第一段，代表總說","第二段，代表舉例","最後一段，代表總結","第三段，代表分說的第二點"],"ans":"C","steps":["「總而言之」在第五段開頭","後面把三個步驟再說一次","所以是總結"],"tests":"結構：總結路標","avoid":"「總之、總而言之」就是總結"},{"q":"如果把第二段整段刪掉，文章會出現什麼問題？","opts":["完全沒有影響","少了總結","少了第一步，和總說的三個步驟對不上","少了總說"],"ans":"C","steps":["總說說有三個步驟","第二段是「第一步，倒乾淨」","刪掉後只剩兩步，總說和分說就對不上"],"tests":"結構：總分對應","avoid":"分說要一點一點回應總說"}]}]},{"no":"週末關卡","title":"孟母不欺子","skill":"綜合：人物形象＋敘事順序＋詞類活用","steps":["❶ 先排順序：起因 → 經過 → 結果","❷ 圈人物的話和動作，找性格證據","❸ 遇到怪怪的字，想想它是不是「名詞、形容詞當動詞」，再用組詞和看動作驗證","❹ 最後問：故事想告訴我們什麼？","完成後，用 60 秒說給家人聽：這週你最欣賞哪個人物？為什麼？"],"demo":{"q":"「君豈有斗升之水而活我哉？」的「活」是什麼意思？","a":["先看材料：鮒魚困在乾掉的車輪痕裡，說：「君豈有斗升之水而活我哉？」","→ 第1招：「活」平常是形容詞，後面接「我」，代回「活的我」讀不通","→ 第2招看目的：鮒魚快乾死了，要水是為了活下去","答：形容詞當動詞，「使我活」、救活我"]},"parts":[{"label":"第一篇","title":"孟母不欺子","text":["孟子少時，東家殺豚。孟子問其母曰：「東家殺豚何為？」母曰：「欲啖汝。」","其母自悔而言曰：「吾懷妊是子，席不正不坐，割不正不食，胎教之也。今適有知而欺之，是教之不信也。」乃買東家豚肉以食之，明不欺也。"],"cite":"《韓詩外傳》（節選）","notes":"孟子：戰國時的思想家孟軻　東家：東邊的鄰居　豚：小豬　何為：做什麼　懷妊：懷孕　是子：這個孩子　割：切好的肉　胎教：懷孕時就開始教育孩子","trans":"孟子小時候，東邊的鄰居在殺小豬。孟子問他的母親說：「東邊的鄰居殺小豬做什麼？」母親說：「要給你吃。」母親說完就後悔了，自言自語說：「我懷這個孩子的時候，席子擺得不正就不坐，肉切得不正就不吃，這是對他的胎教。現在他剛剛懂事，我卻欺騙他，這是在教他不誠實啊。」於是就去買了東邊鄰居的豬肉給孟子吃，表明自己沒有欺騙他。","qs":[{"q":"下列事件順序，哪一個正確？","opts":["母親買肉 → 孟子發問 → 母親隨口回答 → 母親後悔","母親後悔 → 孟子發問 → 母親隨口回答 → 買肉給他吃","孟子發問 → 母親買肉 → 母親隨口回答 → 母親後悔","孟子發問 → 母親隨口回答 → 母親後悔 → 買肉給他吃"],"ans":"D","steps":["第一件事：孟子問「東家殺豚何為」，母親答「欲啖汝」","接著「其母自悔而言曰」，說出後悔的理由","最後「乃買東家豚肉以食之」，乃＝於是，是結果"],"tests":"敘事順序","avoid":"「乃」後面常是結果"},{"q":"「明不欺也」的「明」是什麼意思？","opts":["表明、讓人知道","明天","明亮","聰明"],"ans":"A","steps":["第1招：「明」平常是形容詞；組詞「表明」代回「表明自己沒有欺騙」→ 通","第2招看動作目的：母親特地去買肉，就是要讓孩子知道她說話算話","兩招都指向：形容詞當動詞，表明"],"tests":"詞類活用：明","avoid":"形容詞後面接事情，常要當動作"},{"q":"母親為什麼後悔自己說了「欲啖汝」？","opts":["捨不得花錢買肉","孩子剛懂事就被騙，等於教他不誠實","鄰居的豬肉不好吃","孟子哭著吵要吃肉"],"ans":"B","steps":["證據：「今適有知而欺之，是教之不信也」","孩子剛懂事就被騙，會學到說話不算話","文中沒寫孟子哭鬧；她後來真的去買肉，也不是捨不得錢"],"tests":"因果：找原因","avoid":"人物自己說的理由最可靠"},{"q":"從這件事，可以看出孟母是怎樣的人？","opts":["重視誠信，說錯話就用行動改正","很會做菜，常買肉給孩子吃","脾氣急躁，常罵孩子","很節儉，不肯亂花錢"],"ans":"A","steps":["證據一：隨口說了「欲啖汝」，馬上「自悔」","證據二：真的「買東家豚肉以食之」，說到做到","兩個證據合起來：重視誠信、以身作則"],"tests":"人物：兩個證據","avoid":"話和動作一起看，才是證據"}]},{"label":"第二篇","title":"邯鄲學步","text":["且子獨不聞夫壽陵餘子之學行於邯鄲與？未得國能，又失其故行矣，直匍匐而歸耳。"],"cite":"《莊子．秋水》（節選）","notes":"且：而且　子：你　壽陵：燕國的地名　餘子：少年　邯鄲：趙國的都城　國能：邯鄲人的本領　故：原來的　直：只好　匍匐：在地上爬","trans":"而且你難道沒聽說過燕國壽陵的少年，到邯鄲去學走路的事嗎？他沒有學會趙國人走路的本領，又忘了自己原來走路的方法，只好爬著回家了。","qs":[{"q":"「學行於邯鄲」的「行」是什麼意思？","opts":["行為","走路","可以","銀行"],"ans":"B","steps":["第1招組詞「步行」，代回「到邯鄲學走路」→ 通","第2招看結果：最後他「匍匐而歸」，連路都不會走，只能爬","所以行＝走路"],"tests":"字義：行","avoid":"用結局反推開頭學的是什麼"},{"q":"少年學步的結果是什麼？","opts":["沒學會別人的走法，又忘了自己的，只好爬回家","學會了一半，就坐車回家","沒學會，又留在邯鄲繼續學","學會了趙國人的走法，很高興地回家"],"ans":"A","steps":["「未得國能」：沒學會","「又失其故行」：原來的也忘了","「直匍匐而歸耳」：只好爬回去"],"tests":"起因經過結果","avoid":"結果常在句子最後"},{"q":"這個少年是怎樣的人？","opts":["很聰明，一學就會","很懶惰，根本不想學","一味模仿別人，反而丟掉自己的本事","很有毅力，最後成功了"],"ans":"C","steps":["他特地跑到邯鄲去學 → 不是懶惰","結果沒學會、又忘了原本的 → 不是成功、不是聰明","所以是盲目模仿的人"],"tests":"人物形象","avoid":"用結果檢查選項說的性格"},{"q":"這個故事告訴我們什麼？","opts":["不可以出遠門","少年不可以離開家","走路一定要學趙國人","盲目模仿別人，連自己原有的長處都會失去"],"ans":"D","steps":["少年只想學別人，卻失去自己原來的走法","不是在說走路的方法，也不是說不能出門","道理：學習要有自己的判斷"],"tests":"寓言道理","avoid":"問：主角犯了什麼錯？"}]},{"label":"第三篇","title":"子罕不受玉","text":["宋人或得玉，獻諸子罕，子罕弗受。獻玉者曰：「以示玉人，玉人以為寶也，故敢獻之。」","子罕曰：「我以不貪為寶，爾以玉為寶，若以與我，皆喪寶也，不若人有其寶。」"],"cite":"《左傳．襄公十五年》（節選）","notes":"或：有人　諸：之於，把它……給　子罕：宋國的大臣　弗：不　示：給……看　玉人：雕琢玉的工匠　爾：你　若：如果　與：給　喪：失去","trans":"宋國有人得到一塊玉，把它獻給子罕，子罕不肯接受。獻玉的人說：「我拿給雕玉的工匠看過，工匠認為這是寶物，所以才敢獻給您。」子罕說：「我把不貪心當作寶物，你把玉當作寶物；如果你把玉給了我，我們兩個人都失去了寶物，不如各人保有自己的寶物。」","qs":[{"q":"下列事件順序，哪一個正確？","opts":["子罕說出理由 → 獻玉 → 子罕不收 → 對方說玉人鑑定過","獻玉 → 對方說玉人鑑定過 → 子罕收下 → 子罕說出理由","獻玉 → 子罕不收 → 對方說玉人鑑定過 → 子罕說出理由","對方說玉人鑑定過 → 子罕說出理由 → 獻玉 → 子罕不收"],"ans":"C","steps":["第一件事：「獻諸子罕」，接著「子罕弗受」","獻玉人才解釋「以示玉人」","最後子罕說「我以不貪為寶」；他從頭到尾沒有收下"],"tests":"敘事順序","avoid":"先找第一件和最後一件事"},{"q":"獻玉的人為什麼說「以示玉人，玉人以為寶也」？","opts":["想嚇唬子罕","證明這是真的寶玉，請子罕放心收下","想請玉人一起來送禮","想把玉賣給玉人"],"ans":"B","steps":["子罕不收，他以為子罕懷疑玉不好","所以說工匠看過，確定是寶","後面「故敢獻之」：所以才敢獻給您"],"tests":"人物：說話用意","avoid":"想想他是在回應什麼"},{"q":"從「我以不貪為寶」，可以看出子罕是怎樣的人？","opts":["討厭獻玉的人","嫌這塊玉太小","不懂玉的價值","清廉，把不貪心看得比寶玉更貴重"],"ans":"D","steps":["子罕知道對方把玉當寶，他自己卻把「不貪」當寶","文中沒說他嫌玉小、討厭人","所以是清廉、不貪"],"tests":"人物：從話看性格","avoid":"人物自己說看重什麼，就是性格證據"},{"q":"子罕說「皆喪寶也」，為什麼是兩個人「都」失去寶？","opts":["兩個人的寶都被偷了","子罕收了就失去不貪，對方送了就失去玉","玉被工匠拿走了","玉會被摔破"],"ans":"B","steps":["子罕的寶＝不貪；收下玉就變成貪了","獻玉人的寶＝玉；送出去就沒有了","所以兩人都失去自己的寶"],"tests":"推論：兩邊合推","avoid":"把兩個人的「寶」分開想"}]},{"label":"第四篇","title":"人有亡鈇者","text":["人有亡鈇者，意其鄰之子，視其行步，竊鈇也；顏色，竊鈇也；言語，竊鈇也；動作態度，無為而不竊鈇也。","俄而抇其谷而得其鈇，他日復見其鄰人之子，動作態度無似竊鈇者。"],"cite":"《列子．說符》","notes":"鈇：斧頭　行步：走路的樣子　竊：偷　顏色：臉上的表情　無為而不：沒有一樣不像　俄而：不久　抇：挖　谷：山谷　他日：過幾天","trans":"有個人丟了斧頭，懷疑是鄰居的兒子偷的。看他走路的樣子，像是偷斧頭的；看他的表情，像是偷斧頭的；聽他說話，像是偷斧頭的；他的一舉一動、神情態度，沒有一樣不像偷斧頭的人。不久，這個人在山谷裡挖土時找到了自己的斧頭，過幾天再看到鄰居的兒子，他的一舉一動、神情態度，都不像偷斧頭的人了。","qs":[{"q":"「意其鄰之子」的「意」是什麼意思？","opts":["懷疑、猜想","願意","注意","意思"],"ans":"A","steps":["第1招組詞「意料」＝心裡猜想，代回「懷疑是鄰居的兒子」→ 通","第2招看後面：他看鄰居兒子什麼都像小偷，表示心裡先懷疑了","所以意＝懷疑、猜想"],"tests":"字義：意","avoid":"用後面的動作來驗證"},{"q":"下列事件順序，哪一個正確？","opts":["丟斧頭 → 懷疑鄰居兒子 → 再看就不像了 → 找到斧頭","懷疑鄰居兒子 → 丟斧頭 → 找到斧頭 → 再看就不像了","丟斧頭 → 找到斧頭 → 懷疑鄰居兒子 → 再看就不像了","丟斧頭 → 懷疑鄰居兒子 → 找到斧頭 → 再看就不像了"],"ans":"D","steps":["第一件事：「亡鈇」","接著「意其鄰之子」，處處覺得像","「俄而……得其鈇」之後，「他日」再看才不像"],"tests":"敘事順序","avoid":"「俄而、他日」是時間路標"},{"q":"鄰居的兒子前後有沒有改變？","opts":["有，他後來變乖了","有，他搬家了","沒有，改變的是丟斧頭那個人的想法","有，他把斧頭還回來了"],"ans":"C","steps":["斧頭是他自己在山谷裡挖到的，不是鄰居還的","文中沒寫鄰居的兒子做了什麼不同的事","前後只差在：懷疑時樣樣像，找到後樣樣不像"],"tests":"推論：前後對照","avoid":"把前後兩段放在一起比"},{"q":"這個故事告訴我們什麼？","opts":["丟了東西一定是被偷","心裡先有成見，看人就容易看錯","斧頭要收好","鄰居都不可以相信"],"ans":"B","steps":["他還沒有證據，就「意其鄰之子」","因為先懷疑，看什麼都像小偷","道理：判斷要靠證據，不要帶成見"],"tests":"寓言道理","avoid":"問：主角錯在哪一步？"}]},{"label":"第五篇","title":"涸轍之鮒","text":["莊周家貧，故往貸粟於監河侯。監河侯曰：「諾。我將得邑金，將貸子三百金，可乎？」","莊周忿然作色曰：「周昨來，有中道而呼者。周顧視車轍中，有鮒魚焉。周問之曰：『鮒魚來！子何為者邪？』對曰：『我，東海之波臣也。君豈有斗升之水而活我哉？』周曰：『諾。我且南遊吳越之王，激西江之水而迎子，可乎？』鮒魚忿然作色曰：『吾失我常與，我無所處。吾得斗升之水然活耳，君乃言此，曾不如早索我於枯魚之肆！』」"],"cite":"《莊子．外物》（節選）","notes":"粟：小米，泛指糧食　監河侯：管理河道的官　諾：好　邑金：封地收來的稅金　忿然作色：生氣得變了臉色　中道：半路上　顧視：回頭看　車轍：車輪壓出的痕跡　鮒魚：鯽魚　波臣：水裡的臣子　斗升之水：一點點水　活：救活　且：將要　激：引來　常與：常在一起的東西，指水　然：就　曾：竟然　索：找　肆：店鋪","trans":"莊子家裡很窮，所以去向監河侯借糧食。監河侯說：「好。我將要收到封地的稅金，到時借給你三百金，可以嗎？」莊子氣得變了臉色說：「我昨天來的時候，半路上聽到有聲音在叫我。我回頭一看，車輪壓出的凹痕裡有一條鯽魚。我問牠：『鯽魚啊！你在這裡做什麼呢？』牠回答：『我是東海的水族臣子。您能不能給我一點點水，救活我呢？』我說：『好。我將要往南去遊說吳國和越國的國王，引西江的水來迎接你，可以嗎？』鯽魚氣得變了臉色說：『我失去了平常離不開的水，沒有地方安身。我只要得到一點點水就能活下去，您竟然這樣說，還不如早點到賣乾魚的店裡去找我！』」","qs":[{"q":"「故往貸粟於監河侯」的「貸」是什麼意思？","opts":["送","賣","借","偷"],"ans":"C","steps":["第1招組詞「借貸」，代回「去向監河侯借糧食」→ 通","第2招看前後：莊子「家貧」，監河侯也說「將貸子三百金」，是借錢給他","所以貸＝借"],"tests":"字義：貸","avoid":"前因後果一起驗證"},{"q":"「我且南遊吳越之王」的「南」是什麼意思？","opts":["姓南的人","南方的","往南方","南邊的人"],"ans":"C","steps":["第1招：「南」平常是方位名詞，代回「南方的遊吳越之王」不通","第2招看動作：莊子要去遊說吳、越的國王，吳越在南方","所以是「往南方去」，方位詞說明動作的方向"],"tests":"詞性變化：南","avoid":"方位詞放在動作前，常表示往哪走"},{"q":"莊子為什麼要講鮒魚的故事？","opts":["他想請監河侯幫忙救魚","他昨天真的想去吳越旅行","他想告訴監河侯東海很遠","用鮒魚比自己，諷刺監河侯的承諾遠水救不了近火"],"ans":"D","steps":["監河侯：等收到稅金再借三百金；莊子對鮒魚：等引來西江水再救","兩個承諾一樣：說得很大，卻來不及","鮒魚要的是斗升之水，莊子要的只是一點糧食 → 用故事諷刺"],"tests":"推論：故事對照","avoid":"把故事和真實情況一一對照"},{"q":"鮒魚說「曾不如早索我於枯魚之肆」，意思是什麼？","opts":["等你引來江水，我早就乾死了，不如去乾魚店找我","鮒魚喜歡吃乾魚","鮒魚要莊子去買魚","鮒魚想去乾魚店玩"],"ans":"A","steps":["前一句：「我得斗升之水然活耳」，牠現在就需要水","西江的水要很久才來","到時牠已經變成乾魚，只能去乾魚店找了 → 氣話"],"tests":"句意：人物的氣話","avoid":"先看人物說話時的情緒"}]}]}],"teach":[{"intro":"這週開始升級：讀人物，要像球探看球員一樣，用證據說話。","items":[{"t":"什麼是「人物形象」？","d":["就是這個人是怎樣的人：急躁、機智、重情義、體貼……","古文很少直接說「他很善良」，要從他說的話、做的事去推。"],"ex":"就像球探看球員：不聽他自己說多厲害，要看他場上怎麼打。"},{"t":"證據從哪裡找？","d":["① 動作：〈王藍田性急〉刺不到蛋就「大怒，舉以擲地」。","② 說話：鄧艾被笑口吃，回答「鳳兮鳳兮，故是一鳳」。","③ 別人的評價：匈奴使說「床頭捉刀人，此乃英雄也」。"]},{"t":"一個性格，至少兩個證據","d":["鍾子期聽出高山，又聽出流水，兩次都中，才能說他「懂音樂」。","只有一個證據時，選項說得太滿就要小心。"],"ex":"柴犬一次不吃飯，不代表牠挑食；天天都不吃，才算有證據。"}],"demo":["「雞子於地圓轉未止，仍下地以屐齒蹍之，又不得。瞋甚，復於地取內口中，齧破即吐之。」","動作證據：踩蛋、氣極了、咬破就吐","加上第一句「王藍田性急」","結論：脾氣非常急躁，一點小事就失控"]},{"intro":"第二關：故事像比賽轉播，先後順序不能亂。","items":[{"t":"什麼是「敘事順序」？","d":["就是事情發生的先後。","古文常用時間詞當路標：先、而後、既、及、已而、俄而、旬日、三年之後、乃。"],"ex":"就像戰術：先掩護，再切入，最後上籃，順序錯了就打不成。"},{"t":"起因、經過、結果","d":["起因：為什麼開始？〈薛譚學謳〉＝自以為學完了。","經過：中間發生什麼？＝秦青唱了一首響遏行雲的歌。","結果：最後怎樣？＝謝求反，終身不敢言歸。"]},{"t":"排序題怎麼做？","d":["先找第一件和最後一件事，把它們放好，再排中間。","文中沒寫到的事，不能排進去。"]}],"demo":["「荊人欲襲宋，使人先表澭水。澭水暴益，荊人弗知，循表而夜涉，溺死者千有餘人。」","第一件：「先表」做標記；接著：水「暴益」","然後：照舊標記夜裡渡河；最後：淹死千餘人","起因是水變了卻不知道，結果是大敗"]},{"intro":"第三關：同一個字，換了位置就換了工作，這叫「詞類活用」。","items":[{"t":"什麼是「詞類活用」？","d":["名詞（東西）或形容詞（樣子），在句子裡臨時當成動作用。","「頷」本來是下巴，「但微頷之」＝微微點頭。"],"ex":"就像中鋒臨時去控球：人還是那個人，這一球做的工作不一樣。"},{"t":"怎麼發現它在當動詞？","d":["看位置：後面接「之」或名詞（輕吾射、北面），前面有「而、欲、不」。","代回原來的意思讀不通，就是警訊。"]},{"t":"怎麼確定意思？兩招驗證","d":["第1招組詞代回：「輕」→ 輕視 → 你怎麼敢輕視我的射箭。","第2招看人物動作：康肅「忿然」，因為覺得被看不起 → 對上了。"],"ex":"像教練看重播：先看一個角度，再換一個角度確認。"}],"demo":["「方北面而持其駕，告臣曰：『我欲之楚。』」","「面」平常是臉，代回「北邊的臉」不通","看情節：楚國在南方，他卻朝北走","答：「面」當動詞＝面向，北面＝面向北方"]},{"intro":"第四關：讀唐詩，先當攝影師找畫面，再當偵探找心情。","items":[{"t":"什麼是「找畫面」？","d":["把詩裡的景物圈出來：山、水、月、鳥、船、聲音。","再想時間（早上、傍晚、夜裡）、季節、遠近，拼成一張照片。"],"ex":"就像看比賽前先看球場：在哪裡、幾點、天氣如何。"},{"t":"什麼是「找心情」？","d":["直接寫的心情字：愁、思、愛。","藏在形容詞裡的心情：孤、獨、寒（孤單清冷）；輕（輕快）。"]},{"t":"畫面和心情要配在一起","d":["〈楓橋夜泊〉：半夜、烏啼、鐘聲 → 很靜；加上「愁眠」→ 旅人的孤單。","沒有證據的心情不能選。"],"ex":"柴犬耳朵貼平、尾巴夾著，畫面就告訴你牠在害怕。"}],"demo":["「孤舟蓑笠翁，獨釣寒江雪。」","畫面：下雪的冷江上，一條小船、一個老人在釣魚","心情字：「孤」「獨」「寒」","心情：孤單、清冷"]},{"intro":"第五關：說明文像一套戰術板，先說目標，再分步驟，最後收尾。","items":[{"t":"什麼是「總說、分說、總結」？","d":["總說：開頭告訴你這篇要講什麼。","分說：一點一點說明，常有「第一、第二、首先、其次」。","總結：最後收回來，常有「總之、所以、總而言之」。"],"ex":"就像教練講戰術：今天練防守（總說）→ 站位、腳步、溝通（分說）→ 總之守好就有機會贏（總結）。"},{"t":"怎麼數分說有幾點？","d":["圈出每段第一個詞：第一、第二、第三／先看、再看、最後看。","例子不是新的一點，要分清楚。"]},{"t":"總分要對得上","d":["總說說三個步驟，分說就要有三段。","少一段，結構就對不上。"]}],"demo":["「只要認識地圖上的三個好幫手：方向、比例尺和圖例，就能讀懂大部分的地圖。」","這句在第一段，先列出全篇重點 → 總說","後面三段各講一個好幫手 → 分說","最後「所以，看地圖之前，先找一找這三個好幫手」→ 總結"]},{"intro":"週末關卡：人物、順序、活用三招一起上，像全場比賽一樣。","items":[{"t":"第一步：排順序","d":["起因 → 經過 → 結果。","〈孟母不欺子〉：隨口說「欲啖汝」→ 自己後悔 → 真的買肉給孟子吃。"]},{"t":"第二步：看人物","d":["從話和動作找性格：子罕說「我以不貪為寶」→ 清廉。","主角犯了什麼錯，常常就是寓言的道理。"],"ex":"就像賽後檢討：哪個球員、做了什麼、結果怎樣。"},{"t":"第三步：遇到怪字，想想活用","d":["「活我」：形容詞當動詞，救活我。","「南遊」：方位詞放在動作前，往南方去。","一樣先組詞代回，再看動作驗證。"]}],"demo":["「人有亡鈇者，意其鄰之子……俄而抇其谷而得其鈇。」","順序：丟斧頭 → 懷疑鄰居 → 找到斧頭 → 再看就不像了","人物：還沒證據就先懷疑，是帶著成見的人","道理：先有成見，看人就會看錯"]}],"daily":[{"words":[["輟","停止","輟學"],["嗤","譏笑","嗤之以鼻"]],"line":"伯牙破琴絕弦，終身不復鼓琴，以為世無足復為鼓琴者。"},{"words":[["謝","道歉","謝罪"],["遽","就、立刻","急遽"]],"line":"撫節悲歌，聲振林木，響遏行雲。"},{"words":[["矜","自誇、驕傲","驕矜"],["睨","斜著眼看","睥睨"]],"line":"士別三日，即更刮目相待，大兄何見事之晚乎！"},{"words":[["窮","盡、到盡頭","無窮無盡"],["徑","小路","曲徑通幽"]],"line":"欲窮千里目，更上一層樓。"},{"words":[["適","剛剛、恰好","適逢其會"],["貸","借","借貸"]],"line":"我以不貪為寶，爾以玉為寶，若以與我，皆喪寶也，不若人有其寶。"},null],"quiz":{"words":[["輟","停止","因輟己施焉"],["嗤","譏笑","同坐嗤之"],["謝","道歉","薛譚乃謝求反"],["遽","就、立刻","其子豈遽善游哉"],["矜","自誇、驕傲","公亦以此自矜"],["睨","斜著眼看","睨之，久而不去"],["窮","盡、到盡頭","欲窮千里目"],["徑","小路","萬徑人蹤滅"],["適","剛剛、恰好","今適有知而欺之"],["貸","借","故往貸粟於監河侯"]],"lines":[["伯牙破琴絕弦，終身不復鼓琴，","以為世無足復為鼓琴者。"],["撫節悲歌，聲振林木，","響遏行雲。"],["士別三日，即更刮目相待，","大兄何見事之晚乎！"],["欲窮千里目，","更上一層樓。"],["我以不貪為寶，爾以玉為寶，","若以與我，皆喪寶也，不若人有其寶。"]],"parts":[{"label":"第一篇","title":"運斤成風","text":["莊子送葬，過惠子之墓，顧謂從者曰：「郢人堊慢其鼻端若蠅翼，使匠石斲之。匠石運斤成風，聽而斲之，盡堊而鼻不傷，郢人立不失容。","宋元君聞之，召匠石曰：『嘗試為寡人為之。』匠石曰：『臣則嘗能斲之。雖然，臣之質死久矣。』自夫子之死也，吾無以為質矣，吾無與言之矣。」"],"cite":"《莊子．徐無鬼》（節選）","notes":"惠子：惠施，莊子的好朋友　顧：回頭　從者：跟隨的人　郢：楚國的都城　堊：白色的泥土　慢：同「墁」，塗抹　蠅翼：蒼蠅的翅膀　匠石：名叫石的木匠　斲：砍　聽：任憑　宋元君：宋國的國君　寡人：國君自稱　雖然：雖然這樣　夫子：指惠子","trans":"莊子去送葬，經過惠子的墳墓，回頭對跟隨的人說：「有個郢人把像蒼蠅翅膀那麼薄的白泥塗在鼻尖上，讓匠石把它砍掉。匠石揮動斧頭，呼呼生風，隨手砍下去，白泥全被削掉，鼻子卻一點也沒受傷，郢人站在那裡，臉色一點都沒變。宋元君聽說了，把匠石找來說：『試著替我再做一次。』匠石說：『我從前確實能砍。雖然這樣，我的搭檔已經死很久了。』自從惠子死了以後，我再也沒有可以搭配的對手了，再也沒有可以談論的人了。」","qs":[{"q":"「匠石運斤成風」的「斤」是什麼意思？","opts":["斧頭","一斤肉","重量單位","力氣"],"ans":"A","steps":["第1招組詞「斧斤」，代回「匠石揮動斧頭生風」→ 通","第2招看動作：前面「使匠石斲之」，砍東西要用斧頭","所以斤＝斧頭（古今異義）"],"tests":"古今異義：斤","avoid":"用動作驗證古今不同的字"},{"q":"郢人「立不失容」，表示什麼？","opts":["生氣地轉身離開","嚇得站不穩","站著臉色一點都沒變，非常信任匠石","臉被砍傷了"],"ans":"C","steps":["「失容」＝臉色改變","斧頭呼呼生風砍向鼻子，他卻「不失容」","表示他完全相信匠石不會砍傷他"],"tests":"人物：從動作看心理","avoid":"危險時的表現，最能看出人物"},{"q":"宋元君請匠石再表演，匠石為什麼做不到？","opts":["宋元君不肯給錢","能配合他、信任他的搭檔已經死了","他的斧頭壞了","他老了，沒有力氣"],"ans":"B","steps":["匠石說：「臣則嘗能斲之」：本事還在","「雖然，臣之質死久矣」：搭檔死了","「雖然」後面才是真正的原因"],"tests":"因果：找原因","avoid":"「雖然、然」後面常是重點"},{"q":"莊子講這個故事，是把誰比作郢人？","opts":["匠石","跟隨的人","惠子","宋元君"],"ans":"C","steps":["莊子是在經過「惠子之墓」時說這個故事","最後說「自夫子之死也，吾無以為質矣」","匠石失去郢人，就像莊子失去惠子"],"tests":"推論：故事對照","avoid":"故事裡的角色，對照現實的人"},{"q":"這段話表現莊子什麼心情？","opts":["高興自己終於贏了","害怕自己也會死","生氣惠子不理他","懷念失去惠子這位知己"],"ans":"D","steps":["地點：經過惠子的墓","「吾無與言之矣」：再也沒有可以談話的人","所以是失去知己的懷念和寂寞"],"tests":"人物：心情","avoid":"說話的地點和最後一句是線索"}]},{"label":"第二篇","title":"惠子相梁","text":["惠子相梁，莊子往見之。或謂惠子曰：「莊子來，欲代子相。」於是惠子恐，搜於國中三日三夜。","莊子往見之，曰：「南方有鳥，其名為鵷鶵，子知之乎？夫鵷鶵發於南海而飛於北海，非梧桐不止，非練實不食，非醴泉不飲。於是鴟得腐鼠，鵷鶵過之，仰而視之曰：『嚇！』今子欲以子之梁國而嚇我邪？」"],"cite":"《莊子．秋水》（節選）","notes":"梁：梁國，就是魏國　或：有人　代：取代　國中：都城裡　鵷鶵：傳說中和鳳凰同類的鳥　發：出發　止：停下來棲息　練實：竹子的果實　醴泉：甘甜的泉水　鴟：貓頭鷹一類的鳥　嚇：發怒的叫聲","trans":"惠子在梁國當宰相，莊子去看他。有人對惠子說：「莊子來，是想取代你當宰相。」於是惠子很害怕，在都城裡搜捕莊子三天三夜。莊子去見他，說：「南方有一種鳥，名叫鵷鶵，你知道嗎？鵷鶵從南海出發，飛往北海，不是梧桐樹不停下來，不是竹子的果實不吃，不是甘甜的泉水不喝。這時有隻貓頭鷹找到一隻腐爛的老鼠，鵷鶵剛好從上面飛過，貓頭鷹抬頭看著牠，發出『嚇！』的怒叫。現在你也想用你的梁國來嚇我嗎？」","qs":[{"q":"「惠子相梁」的「相」是什麼意思？","opts":["看","相貌","互相","當宰相"],"ans":"D","steps":["第1招代回「惠子互相梁國」「惠子看梁國」都不通","第2招看後文：「欲代子相」＝想取代你當宰相","名詞「宰相」當動詞：做宰相"],"tests":"詞類活用：相","avoid":"用後文同一個字來驗證"},{"q":"惠子聽說莊子要來，做了什麼？","opts":["很高興，出城迎接莊子","很害怕，在都城裡搜捕莊子三天三夜","馬上讓出宰相的位置","寫信請莊子不要來"],"ans":"B","steps":["證據：「於是惠子恐，搜於國中三日三夜」","恐＝害怕","他怕莊子搶他的位置"],"tests":"敘事：找經過","avoid":"「於是」後面是人物的反應"},{"q":"「非梧桐不止，非練實不食，非醴泉不飲」，表現鵷鶵怎樣？","opts":["志向高潔，看不上低等的東西","很挑食，很難養","身體虛弱，吃得很少","很窮，找不到食物"],"ans":"A","steps":["只停梧桐、只吃竹實、只喝甘泉，都是最好最乾淨的","後面鵷鶵根本不想要腐鼠","所以是在說牠志向高潔"],"tests":"人物：比喻形象","avoid":"想想作者用這隻鳥比誰"},{"q":"故事中的「腐鼠」比喻什麼？","opts":["梁國的百姓","莊子","梁國宰相的位置","惠子"],"ans":"C","steps":["鴟怕鵷鶵搶牠的腐鼠，就像惠子怕莊子搶他的位置","最後一句：「欲以子之梁國而嚇我邪」","所以腐鼠＝惠子看重的宰相之位"],"tests":"推論：比喻對照","avoid":"把故事裡的角色一一對到現實"},{"q":"莊子是怎樣的人？","opts":["不在乎功名，又能用比喻機智回應","很怕惠子","很想當宰相","喜歡抓老鼠"],"ans":"A","steps":["莊子把自己比作鵷鶵，宰相位子像腐鼠，他根本看不上","他不直接罵惠子，而是講一個故事來回應","所以是看輕功名、說話機智的人"],"tests":"人物形象","avoid":"人物把自己比作什麼，就看出他的志向"}]}]},"cap":{"no":"會考實戰","title":"第 5 週會考實戰","skill":"會考解題技法：讀題三步","steps":["❶ 先讀題幹最後一句：問什麼？問正確還是錯誤？問「最可能」還是「一定」？","❷ 圈關鍵詞和限定詞：錯誤、不包含、相去最遠、最、都、只、越……越","❸ 回原文找證據句，每個選項都要對得上原文","❹ 用刪去法：沒證據的、偷換字的、張冠李戴的，先刪掉"],"demo":{"q":"示範題：【113 年會考第 9 題】「由國家出資的遠征計畫，經費較高，卻少有重大發現。官方的主事者常攜帶大批補給裝備，而非輕裝簡從。且受制於政治考量，無法自行選拔合適的成員。反觀私人支持的遠征隊較能達成目標，主事者專心致志，可主導成員的挑選，每個人都有擅長的領域。」根據本文，私人支持的遠征隊較能達成目標的原因⟦不包含⟧下列何者？（一）政治考量較少（二）補給裝備較多（三）主事者權限較大（四）計畫成員較專業","a":["→ 第一步讀最後一句：問「私人遠征隊」的原因，而且是「不包含」，要找原文沒有說的","→ 第二步圈關鍵詞：「私人支持」和「國家出資」是兩隊，不能搞混","→ 第三步回原文：「可主導成員的挑選」對上權限較大，「每個人都有擅長的領域」對上成員較專業，國家隊「受制於政治考量」反過來就是私人隊政治考量較少","→ 「攜帶大批補給裝備」是國家隊的特色，而且是缺點，私人隊不是靠它成功","答：（二）補給裝備較多"]},"teach":{"intro":"會考的陷阱常常不在文章，而在題目；先把題目讀懂，答案就成功一半。","items":[{"t":"什麼是「題幹最後一句」？","d":["題幹就是題目本身，最後一句通常寫著「下列何者最恰當」「何者錯誤」，這句才是真正的任務","例如第 9 題前面講了很多遠征隊的事，但最後一句才說要找「不包含」的原因"],"ex":"就像教練喊戰術：前面說了一堆，最後一句「這球打二三區域聯防」才是你上場要做的事。"},{"t":"什麼是「反向題」？","d":["題目問「錯誤」「不包含」「相去最遠」「不恰當」的，要找的是「和原文不合」的那一個","考卷上這些字常常畫了底線，就是在提醒你；作答前先把它圈起來"],"ex":"像找柴犬照片裡「不是柴犬」的那一張：要找的是不一樣的，不是一樣的。"},{"t":"什麼是「限定詞」？","d":["限定詞是決定一句話範圍和程度的小字，例如：最、都、只、一定、全然、越……越、應該、能","例如第 13 題原文是「越應該把眼光投向光照」，選項改成「越能看見」，只換兩個字就錯了"],"ex":"「我每場都得分」和「我這場有得分」差很多，一個字就能讓話變假。"},{"t":"什麼是「刪去法」？","d":["四個選項一個一個回原文比對，找不到證據、偷換說法、把甲的事說成乙的，就刪掉","剩下最後一個有證據的，就是答案；不確定時，先刪最有把握的錯誤選項"],"ex":"就像防守時先把對方最不可能傳球的路線封死，剩下的路線就好猜了。"}],"demo":["①讀題幹最後一句，確定是正向題還是反向題，在題目上圈出來","②圈出題目和選項裡的關鍵詞、限定詞，特別注意是誰做的事","③回原文找證據句，四個選項逐一比對，用刪去法留下有證據的答案"]},"parts":[{"label":"第一篇","title":"113 年會考 第 7、13 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 7、13 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"「人生，其實像一條從寬闊的平原走進森林的路。在平原上同伴可以結夥而行，歡樂地前推後擠、相濡以沫。一旦進入森林，草叢和荊棘擋路，情形就變了，各人專心走各人的路，尋找各人的方向。」這段文字的觀點與下列何者⟦相去最遠⟧？","opts":["人生總有坎坷，不會永遠是平順坦途","不論結伴或是獨行，皆應樂觀面對人生","天下無不散的筵席，朋友總有分離的時候","人的選擇不同，每個人都得自己去創造未來"],"ans":"B","steps":["讀題三步第一步：最後一句問「相去最遠」，是反向題，要找「原文沒有說」的那一個","回原文找證據：「荊棘擋路」對上坎坷，「各人專心走各人的路」對上分離和自己創造未來，這三個都有證據","「皆應樂觀面對人生」原文完全沒提到樂觀，所以它離原文最遠"],"tests":"反向題：相去最遠","avoid":"先圈「相去最遠」，找沒有證據的選項"},{"q":"「遺忘就像舞臺打燈後的暗處，漆黑越大片，就越能凸顯光照的明亮。遺忘幫我們揀選人生最值得珍惜的過往片段。因此，遺忘是無須哀悼的，忘的越多，就越應該把眼光投向光照的所在，那才是值得留戀的人事代謝。」下列何者最接近本文作者的觀點？","opts":["生命中的人事代謝無須遺忘","遺忘如同舞臺上光照的所在","不被遺忘的事物才最值得珍惜","遺忘越多越能看見人生光明面"],"ans":"C","steps":["圈證據句：「遺忘幫我們揀選人生最值得珍惜的過往片段」，被留下來、沒被忘掉的，才是最值得珍惜的","刪去：原文說遺忘是「暗處」不是「光照」；原文是「越應該把眼光投向」，最後一個選項偷換成「越能看見」，限定詞被改掉了","所以「不被遺忘的事物才最值得珍惜」最接近作者觀點"],"tests":"白話觀點判讀","avoid":"逐字比對限定詞：應該和能不一樣"}]},{"label":"第二篇","title":"113 年會考 第 25～26 題（題組）","text":["最近經常想起愛丁堡。","可能是冬天到了的緣故，我就想起那個寒冷的城市。但想起愛丁堡時，記憶幾乎都局限在從宿舍到圖書館的一段路。其他的地方，有時連路名都想不起來了。我在那個城市住了三年多，但從離開的那天起，有關它的記憶卻迅速風乾縮小，失去細節的厚度。","在愛丁堡的期間，最常走的一段路，是從宿舍到國家圖書館。有時也會為了特定的資料，改去大學總圖或神學院圖書館。我喜歡圖書館，尤其老圖書館厚重的木頭桌椅，沉靜的氣氛和古書味。但每天最盼望的還是我給自己訂下的休息時間——下午三四點時到對街的大象咖啡館喝咖啡，吃杏仁牛角麵包，看報紙。那家咖啡館有一面窗正對著峭壁上的愛丁堡古城。從溫暖嘈雜的咖啡館，遠望冷峻的城堡，好像一種提醒。城堡的歷史以千年計，峭壁以萬年計，眼下我以時日計算的時間，不過是零頭。","二十幾歲的時候，人和城市的關係是有目的性的，有了目的就偏頗。你去到一個地方，心裡清楚它不是終點，只是為了完成些什麼，然後又收拾行李往別處去。例如留學，每個留學生的心裡都有一張時間表，底限是完成學業回家的時間——而那往往和獎學金的年限有關。懷著這張時間表生活，每一天都不是獨立的日子，「現在」不只是現在，是朝向日後而存在，日子長長地投影在未來。","那是一種生活在他方。只是當時不覺得匆忙，往後回想，才看出其中的風塵僕僕。那時我們都還不知道，攜帶著單一的目標去生活是件挂一漏萬的事。二十來歲時銳意求知，要到稍晚才學會，那個尖銳的姿態，同時也是狹窄的。","——張惠菁〈冬城〉"],"cite":"113 年國中教育會考國文科 第 25～26 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"關於文中的「我」，下列敘述何者最恰當？","opts":["在愛丁堡的期間是帶有目的性的停留","認為去大象咖啡館是一種偏頗的決定","因沉浸在老圖書館的氛圍裡而忘卻時間","討厭愛丁堡的寒冷而不願回想留學時光"],"ans":"A","steps":["題幹問「我」，回原文找「我」的經歷：在愛丁堡留學，心裡有「一張時間表」，「人和城市的關係是有目的性的」","刪去：原文說偏頗的是「有目的」的生活，不是咖啡館；我有時間表，沒有忘卻時間；開頭就說「最近經常想起愛丁堡」，不是不願回想","所以「帶有目的性的停留」最恰當"],"tests":"人物敘述判讀","avoid":"每個選項都要在原文找到證據"},{"q":"文末「那個尖銳的姿態，同時也是狹窄的。」這句話的意思，最可能是下列何者？","opts":["粗心大意，挂一漏萬的情況一再出現","年少時個性尖銳，只想處處與人爭鋒","器量狹小，容不下別人一丁點的錯誤","眼前只有單一的目標，視野不夠開闊"],"ans":"D","steps":["看前一句當線索：「攜帶著單一的目標去生活是件挂一漏萬的事」，「尖銳」指一心只朝目標衝的銳意求知","「狹窄」是說只看到目標、漏掉其他風景；第一個選項借用「挂一漏萬」卻說成粗心，是陷阱","所以是「只有單一的目標，視野不夠開闊」"],"tests":"句意推論","avoid":"解釋句子先看前後句，不只看字面"}]},{"label":"第三篇","title":"113 年會考 第 27～28 題（題組）","text":["綏夫特《格理弗遊記》（舊譯《格列佛遊記》或《大小人國遊記》）在中文世界裡幾乎是人盡皆知的兒童奇幻文學，但在英文世界裡它其實是一部用來諷刺人性、英國時政與權貴的作品。原書有四冊，但許多中譯本只有第一、二冊的《小人國》、《大人國》，使人無法窺其全貌。","在原始版本中，小人國國王將三種不同顏色的細絲線：藍、紅、綠，賞賜給表演類似凌波舞舞技最佳的三個人。其實不同顏色的絲線，是分別影射當時三種頒予爵士的勳章：藍色綬帶的嘉德勳章、紅色綬帶的巴斯勳章、綠色綬帶的薊勳章。因為凌波舞高手的筋骨要很柔軟，綏夫特用來影射沒有骨氣的人才能得到寵愛、成為高官。但也因為暗示過於明顯，出版商擔心會得罪當道，所以在出版時將絲線的顏色改為紫、黃、白。顏色一改，寓意就煙消雲散。","此外，早期的中文版有誤譯之處。如原書中應指「醫學」一詞，卻被譯者翻成「格物學」。所學的內容一變，主人翁船醫的身分也就變了，在長途航行中該如何發揮所學令人有些困惑。由此可見，翻譯時被誤解的內容，有時會有極大的影響。","——改寫自中央研究院「研之有物」網站"],"cite":"113 年國中教育會考國文科 第 27～28 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，出版社把原書絲線的顏色改掉，造成的影響最可能是下列何者？","opts":["失去原本的隱喻，使讀者無法感受作者諷刺的用意","混淆勳章的配色，使讀者誤解不同貴族的代表顏色","過度渲染舞蹈的功能，以為是貴族階層流行的風尚","刻意淡化階級的對立，營造出社會繁榮和諧的假象"],"ans":"A","steps":["圈關鍵詞「造成的影響」，回原文找改顏色之後那一句：「顏色一改，寓意就煙消雲散」","寓意消失＝隱喻不見了，讀者看不出作者在諷刺沒骨氣的高官","其他三個選項原文都沒寫，刪掉，答案是第一個選項"],"tests":"因果關係找證據","avoid":"問影響就找「之後發生什麼」的句子"},{"q":"根據本文，關於綏夫特《格理弗遊記》的敘述，下列何者最恰當？","opts":["作者致力於創作兒童奇幻文學作品","作者以虛構的情節反映現實的醜惡","早期中文譯者將原書的四冊內容濃縮為兩冊","早期譯者用「格物學」一詞是為免得罪當道"],"ans":"B","steps":["證據句：「在英文世界裡它其實是一部用來諷刺人性、英國時政與權貴的作品」，小人國是虛構，諷刺的是真實社會","刪去：兒童文學是中文世界的看法；中譯本是「只有」第一、二冊，不是濃縮；「格物學」是誤譯，怕得罪當道的是改顏色的出版商","所以「以虛構的情節反映現實的醜惡」最恰當"],"tests":"全文重點判讀","avoid":"注意誰做的事，不要張冠李戴"}]},{"label":"第四篇","title":"113 年會考 第 36～37 題（題組）","text":["以下小說節錄自鍾肇政《魯冰花》，主角古阿明是來自貧困茶農家庭的小學生。","古阿明昨天在茶園裡畫的作品，郭雲天認為是近一個月以來最好的一幅，也是最使他滿意的一幅。","古阿明畫的是茶蟲。那真是個奇異的幻想世界。在一面圖案化的綠色畫面上，各種各樣的大小茶蟲畫得猙獰可怖。此外還有幾個人物——古阿明曾向郭雲天說那三個人是姊姊，小弟弟和他自己。茶蟲有的在拼命地啃茶葉，有的在吃畫面上的一個人物手裡捧著的飯，有的在吃另一個人物的衣服。古阿明那小小的心靈裡的憤恨與恐懼，靠著他那獨特的，大膽的筆觸，毫無遺漏地表露出來。","郭雲天只有暗嘆的份兒，幾乎沒有提供意見的餘地，因為古阿明一開始作畫，就好像已忘了周遭的一切，連他所尊敬的師長在身旁也都似乎渾然忘卻，手不停揮地畫下去。直到畫好後，郭雲天才得到機會提出他的修改意見。他指示他哪裡的顏色還不夠鮮明，哪一筆線條還要加強。","事實上，郭雲天的意見也不多。他不忍破壞掉那純潔的心靈裡所流露出來的，敏銳得就如電流一般的感覺。甚至他明知畫裡的一條蟲在生卵是錯誤的，也還是讓他保持原來的面目。他認為與其改正過來，倒毋寧這個樣子較合他的年歲。"],"cite":"113 年國中教育會考國文科 第 36～37 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，古阿明想透過畫作表達的意義，最可能是下列何者？","opts":["以茶蟲代表大自然對人類開發的反撲","以茶蟲象徵政府官員對老百姓的監控","茶蟲不僅啃食茶葉，也啃食了古阿明一家日常生活所需","茶蟲為了生存無所不吃，就像古阿明為了學畫多方嘗試"],"ans":"C","steps":["回原文看畫面：茶蟲「啃茶葉」、吃人物「手裡捧著的飯」、吃「衣服」，畫裡的人是姊姊、弟弟和他自己","再連到背景「貧困茶農家庭」：茶葉被吃，家裡的飯和衣服也沒了，所以他「憤恨與恐懼」","原文沒有提到開發、官員或學畫，答案是第三個選項"],"tests":"象徵意義推論","avoid":"推論要扣住原文畫面和人物背景"},{"q":"根據本文，郭雲天對古阿明的畫作意見不多，原因最可能是下列何者？","opts":["希望古阿明能自己發現缺失","想要保留古阿明特有的創意","古阿明作畫時太專注，給意見也聽不進去","古阿明的畫作太完美，無法再提更多建議"],"ans":"B","steps":["圈關鍵詞「意見不多」，找同一段的證據：「他不忍破壞掉那純潔的心靈裡所流露出來的……感覺」","刪去：畫好後他其實有機會提意見，不是聽不進去；他「明知」蟲生卵是錯的，所以畫並不完美；原文也沒說要他自己發現","所以原因是「想要保留特有的創意」"],"tests":"找原因證據","avoid":"原因題找同段的「因為、不忍」"}]},{"label":"第五篇","title":"113 年會考 第 12、14 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 12、14 題（國家教育研究院心測中心）","notes":"","trans":"第 12 題：住在山裡的老農家很窮，耕種三四畝山田。禾苗稀疏、稅又重，自己吃不飽，糧食繳進官府倉庫，放到爛成泥土。年底只剩鋤頭犁具靠在空屋旁，只好叫兒子上山撿橡樹果子充飢。西江的商人船上有上百斛珍珠，連船上養的狗都常常吃肉。　第 14 題：玉一般的人神情悲慘、花一般的人滿臉愁容，走出京城；蓮花樓下柳樹青青。酒杯前唱一曲送別的〈陽關曲〉，送別心愛的人已經走到第五段路程了吧？想要找個好夢，夢卻做不成。有誰知道我此刻的心情？枕頭前的眼淚和臺階前的雨水，隔著一扇窗，一起滴到天亮。","qs":[{"q":"「老農家貧在山住，耕種山田三四畝。苗疏稅多不得食，輸入官倉化為土。歲暮鋤犁傍空室，呼兒登山收橡實。西江賈客珠百斛，船中養犬長食肉。」關於這首詩的說明，下列敘述何者最恰當？","opts":["就形式而言，是一首七言律詩","就類別而言，是一首山居躬耕的閒適詩","就內涵而言，描繪農民於繁重稅賦下艱困的生活","就技巧而言，以農家與商賈對比，凸顯人情的可貴"],"ans":"C","steps":["找證據句：「苗疏稅多不得食，輸入官倉化為土」「呼兒登山收橡實」，稅太重、吃不飽，只能撿果子","刪去：吃不飽怎麼會「閒適」；農家和商人對比凸顯的是貧富不公，不是人情可貴；律詩要押平聲韻、中間兩聯要對仗，這首都沒有，是古體詩","所以「描繪農民於繁重稅賦下艱困的生活」最恰當"],"tests":"詩的內涵判讀","avoid":"每個「就…而言」都要分開檢查"},{"q":"「玉慘花愁出鳳城，蓮花樓下柳青青。尊前一唱〈陽關曲〉，別個人人第五程？　　尋好夢，夢難成。有誰知我此時情？枕前淚共階前雨，隔個窗兒滴到明。」關於這闋詞的分析，下列敘述何者⟦錯誤⟧？","opts":["首句情景交融，「慘」、「愁」二字點出別情","下闋首句點出「我」為了追尋理想而遠離佳人","末尾二句暗示「我」滿懷離情別緒，一夜未眠","上闋描寫分別時的情景，下闋描寫別後的思情"],"ans":"B","steps":["讀題第一步：題幹最後是「錯誤」，要挑和原文不合的那一個","回原文：下闋首句是「尋好夢，夢難成」，追尋的是「好夢」，因為想念睡不著，不是追尋理想","其他三個都有證據（慘、愁；淚滴到明；上闋唱〈陽關曲〉送別），所以錯誤的是第二個選項"],"tests":"反向題：詞的分析","avoid":"看到「錯誤」先圈起來再作答"}]},{"label":"第六篇","title":"113 年會考 第 18、22 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 18、22 題（國家教育研究院心測中心）","notes":"爨：音ㄘㄨㄢˋ，升火煮食","trans":"第 18 題：漢靈帝時，陳留人蔡邕因為多次上書陳述意見，違背了皇帝的心意，宮中受寵的人又討厭他，他擔心免不了災禍，就逃亡到江湖，遠遠躲到吳郡。吳地有人燒桐木來煮飯，蔡邕聽到火燒得劈啪作響的聲音，說：「這是好木材啊。」於是向那人要來，把它削製成琴，果然發出美妙的聲音。可是琴尾被燒焦了，所以取名「焦尾琴」。　第 22 題：有個商人到了直隸地界，忽然下起大冰雹，他趴在禾田裡躲避。聽見空中有聲音說：「這是張不量的田，不要傷害他的莊稼。」天晴後，其他田地的作物都倒伏毀壞，只有張家的田平安無事。原來張家存糧很多，每年春天窮人都來向他借糧。還糧時他不計較多少，全部收下，從不拿量米的刮板刮平、要求補足，所以鄉人叫他「不量」。","qs":[{"q":"漢靈帝時，陳留蔡邕，以數上書陳奏，忤上旨意，又內寵惡之，慮不免，乃亡命江海，遠跡吳郡。吳有燒桐以爨者，邕聞火烈聲，曰：「此良材也。」因請之，削之以琴，果有美音。而其尾焦，因名「焦尾琴」。根據這則故事，下列敘述何者最恰當？","opts":["焦尾琴因蔡邕識材而製成","吳人向來以燒桐製琴聞名","焦尾琴製成後經火烤而音色優美","蔡邕因忤逆上意而遭流放至吳郡"],"ans":"A","steps":["找證據句：「邕聞火烈聲，曰：此良材也。因請之，削之以琴」，蔡邕聽聲音就認出好木材","刪去：吳人燒桐是「爨」煮飯，不是製琴；是先被燒焦才做成琴，順序顛倒；「慮不免，乃亡命」是自己逃走，不是被流放","所以「因蔡邕識材而製成」最恰當"],"tests":"文言故事細節","avoid":"注意事情先後順序和誰主動"},{"q":"賈人某，至直隸界，忽大雨雹，伏禾中。聞空中云：「此張不量田，勿傷其稼。」天霽，他田偃壞，張田獨無恙。蓋張氏積粟甚富，每春間貧民皆就貸焉。償時多寡不較，悉納之，未嘗執概取盈，故鄉人名之「不量」。根據本文，「張田獨無恙」的原因最可能是下列何者？","opts":["張氏行善積德，得到護佑","貧民虔誠祈願，感動上天","張氏田產甚多無法丈量，看不出損失","賈人福澤深厚，連帶使張田倖免於難"],"ans":"A","steps":["題幹問「原因」「最可能」，往原文找兩個線索：空中說「勿傷其稼」，後面用「蓋」說明張氏借糧給窮人、還時不計較","「蓋」就是「原來是因為」，所以原因是張氏做善事；「不量」是不計較，不是田多到無法丈量","原文沒提到貧民祈願或商人有福氣，答案是第一個選項"],"tests":"原因推論","avoid":"看到「蓋」就是在說明原因"}]},{"label":"第七篇","title":"113 年會考 第 21、24 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 21、24 題（國家教育研究院心測中心）","notes":"悁悁：憤怒　蹉跌：失誤　繅：音ㄙㄠ，煮繭抽絲","trans":"第 21 題：鞠武〈報燕太子丹書〉說：「我聽說，只求心裡痛快的人，行為會有虧損；只求心裡舒服的人，會傷害本性。現在太子想洗雪憤怒的恥辱、消除長久的仇恨，這實在是我就算粉身碎骨也不該逃避的事。但我私下認為，聰明的人不期待靠僥倖求取功勞，明理的人不隨便順著心意去做事。事情一定能成功，然後才行動；自身一定安全，然後才去做。所以出手不會有失策的過錯，行動不會有失誤的慚愧。太子看重一般人的匹夫之勇，信任一把劍的刺殺，卻想要成功，我認為太疏忽了。」　第 24 題：蠶繭如果丟著不處理，就會腐爛被蟲蛀而被丟掉。讓女工煮繭抽絲，織成美麗的錦緞，國君穿著它上朝。人的身體就像蠶繭，丟著不加以修治，智慧和品行就會腐壞。讓賢人教導他，成為世上的傑出人才，那麼天下諸侯沒有敢不尊敬他的。","qs":[{"q":"鞠武〈報燕太子丹書〉曰：「臣聞快於意者虧於行，甘於心者傷於性。今太子欲滅悁悁之恥，除久久之恨，此實臣所當糜軀碎首而不避也。私以為智者不冀僥倖以要功，明者不苟從志以順心。事必成，然後舉；身必安，而後行。故發無失舉之尤，動無蹉跌之愧也。太子貴匹夫之勇，信一劍之任，而欲望功，臣以為疏。」關於這段文字的寫作分析，下列敘述何者最恰當？","opts":["分析個中利害關係，鼓勵太子須建功立業","採取先抑後揚筆法，肯定太子能獨當一面","以工整句式加強文氣，勸諫太子應謀定而後動","列舉前人失敗的事例，提醒太子不宜心存僥倖"],"ans":"C","steps":["先看最後一句結論：「太子貴匹夫之勇……臣以為疏」，是在勸太子，不是鼓勵、也不是肯定","找對稱句：「事必成，然後舉；身必安，而後行」「發無失舉之尤，動無蹉跌之愧」，句式工整，意思是想清楚再行動","全文沒有舉前人的例子，所以「以工整句式加強文氣，勸諫太子應謀定而後動」最恰當"],"tests":"文言寫作分析","avoid":"寫作題先抓結論，再看句式手法"},{"q":"「夫繭，捨而不治，則腐蠹而棄。使女工繅之，以為美錦，國君服而朝之。身者，繭也，捨而不治，則智行腐蠹。使賢者教之，以為世士，則天下諸侯莫敢不敬。」關於本文的分析，下列敘述何者最恰當？","opts":["以繭為喻，說明教化對修身的重要","以身著美錦，暗指上位者奢靡誤國","以女工與賢者對照，強調環境的影響","以腐蠹的蠶繭，嘲諷國政的敗壞衰頹"],"ans":"A","steps":["關鍵句「身者，繭也」：直接把人比成繭，這就是比喻","對稱句比一比：繭「使女工繅之」變美錦，人「使賢者教之」變世士，女工和賢者是同一邊的類比，不是對照，重點是「教」","全文沒有說到奢靡或國政，所以是「說明教化對修身的重要」"],"tests":"比喻說理","avoid":"對稱句要上下對照著讀"}]},{"label":"第八篇","title":"113 年會考 第 38～39 題（題組）","text":["【甲】","人讀聖人書二三十年，一旦遇事，便與里巷人無異，或有一聽老成語，便能終身服膺。豈老成之言過於六經哉？只緣讀書不作有用看故也。大抵看史見治則以為治，見亂則以為亂，見一事則止知一事，何取？觀史如身在其中，見事之利害、時之禍患，必掩卷自思，使我遇此等事，當作何處之——如此觀史，學問亦可以進，智識亦可以高，方為有益。","——改寫自呂祖謙《東萊集》","【乙】","讀書時，須細看古人處一事，接一物，是如何思量？如何氣象？及自己處事接物時，又細心將古人比擬。設若古人當此，其措置之法，當是如何？我自己任性為之，又當如何？然後自己過錯始見，古人道理始出。斷不可以古人之書，與自己處事接物為兩事。","——《左宗棠全集》"],"cite":"113 年國中教育會考國文科 第 38～39 題（國家教育研究院心測中心）","notes":"","trans":"甲：有人讀聖人的書二三十年，一旦遇到事情，表現就和街坊一般人沒有兩樣；有人只聽了一次老成長者的話，就能一輩子記在心裡照著做。難道老成長者的話勝過六經嗎？只是因為讀書時沒有把書當成有用的東西來看罷了。一般人讀歷史，看到太平就只當它是太平，看到動亂就只當它是動亂，看到一件事就只知道那一件事，這有什麼收穫？讀歷史要像自己身在其中，看到事情的利害、時局的禍患，一定要闔上書自己想想：假如我遇到這種事，應該怎麼處理——這樣讀歷史，學問可以進步，見識可以提高，這才有益處。　乙：讀書時，必須仔細看古人處理一件事、應對一個人時，是怎麼思考的？有什麼樣的氣度？等到自己處事待人時，又要細心拿古人來比一比。假如是古人碰到這件事，他的處理方法會是怎樣？我自己憑著性子去做，又會怎樣？這樣比較之後，自己的過錯才看得出來，古人的道理才顯現出來。絕對不可以把古人的書和自己處事待人當成兩件不相干的事。","qs":[{"q":"下列關於甲、乙二文文句的說明，何者最恰當？","opts":["「一旦遇事，便與里巷人無異」是因書讀得不夠多","「見一事則止知一事」意謂對事情的理解不夠全面","「如何氣象」其意是思索今人當前所處的環境氛圍","「我自己任性為之」意謂今人比古人更加不受拘束"],"ans":"B","steps":["逐句回原文：甲說讀了「二三十年」，問題是「讀書不作有用看」，不是讀不夠多","「止知一事」：看一件事就只知道那一件，不會想到別的情況，就是理解不夠全面；「如何氣象」是看古人的氣度，「任性為之」是照自己的意思做，都和今人比古人無關","所以第二個選項最恰當"],"tests":"文言句意","avoid":"每個文句都放回原文前後讀"},{"q":"關於甲、乙二文的說明與比較，下列何者最恰當？","opts":["甲文認為耳熟能詳的淺近道理，更勝於聖賢之言","乙文以古人處事的標準，評斷自身舉措是否合宜","二者都認為讀書應活用，不應拘泥於古人的看法","二者都覺得古人讀書講究方法，比今人更有效率"],"ans":"B","steps":["找乙文證據：「設若古人當此，其措置之法，當是如何？我自己任性為之，又當如何？然後自己過錯始見」，拿古人的做法當尺，量出自己哪裡做錯","刪去：甲用「豈……哉」反問，意思是老成之言並沒有勝過六經；兩篇都很看重古人的書，只是要人活用，並沒有說不要照古人的看法，第三個選項說太多了；兩文也都沒比效率","所以「乙文以古人處事的標準，評斷自身舉措是否合宜」最恰當"],"tests":"甲乙文比較","avoid":"「豈…哉」是反問，意思要倒過來"}]},{"label":"第九篇","title":"113 年會考 第 40～42 題（題組）","text":["楚人江乙為郢大夫。有入王宮中盜者，令尹以罪乙，請於王而黜之。其母往言於王曰：「妾夜亡布八匹，令尹盜之。」王謂母曰：「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法。」母曰：「令尹不身盜之也，乃使人盜之。」王曰：「其使人盜奈何？」對曰：「昔孫叔敖之為令尹也，道不拾遺，門不閉關，而盜賊自息。今令尹之治也，耳目不明，盜賊公行，是故使盜得盜妾之布，是與使人盜何以異也？」王曰：「令尹在上，寇盜在下，令尹不知有何罪焉？」","母曰：「昔日妾之子為郢大夫，有盜王宮中之物者，妾子坐而黜，妾子亦豈知之哉？然終坐之。令尹獨何人，而不以是為過也？昔者周武王有言曰：『百姓有過，在予一人。』上不明則下不治，相不賢則國不寧。王其察之。」","——改寫自《列女傳》"],"cite":"113 年國中教育會考國文科 第 40～42 題（國家教育研究院心測中心）","notes":"","trans":"楚國人江乙擔任郢都的大夫。有人闖進王宮偷東西，令尹（宰相）把罪責算在江乙身上，向楚王請求罷免了他。江乙的母親去對楚王說：「我晚上丟了八匹布，是令尹偷的。」楚王對她說：「如果令尹真的偷了，我不會因為他富貴就不執行法律。如果他沒偷而你誣告他，楚國也有固定的法律。」江母說：「令尹不是親自偷，而是讓別人去偷。」楚王說：「他讓人去偷是怎麼回事？」江母回答：「從前孫叔敖當令尹時，路上掉了東西沒人撿，家門不用上鎖，盜賊自然消失。現在令尹治理國家，耳目不靈通，盜賊公然橫行，所以讓小偷能偷走我的布，這和讓人去偷有什麼不同呢？」楚王說：「令尹在上位，盜賊在下面，令尹不知道，有什麼罪呢？」江母說：「以前我兒子當郢大夫，有人偷了王宮裡的東西，我兒子因此獲罪被罷免，我兒子難道知道這件事嗎？但最後還是被判了罪。令尹又是什麼特別的人，竟然不把這當作過錯？從前周武王說過：『百姓有過錯，責任在我一個人。』上位者不英明，下面就治理不好；宰相不賢能，國家就不安寧。希望大王明察。」","qs":[{"q":"根據本文，下列文句「」中的字義，何者說明最恰當？","opts":["妾夜「亡」布八匹：損壞","令尹「信」盜之：隨意","妾子「坐」而黜：受罰","王「其」察之：難道"],"ans":"C","steps":["第一招組詞代回：「亡」組「亡失」，代回「我晚上丟了八匹布」才通，不是損壞；「坐」組「連坐」，代回「我兒子因為宮中失竊被判罪受罰而罷免」，也通","換招驗證另外兩個：「信」看對稱句，「令尹信盜之」和「若不盜而誣之」是一對，一個是真的偷、一個是沒偷，所以「信」是確實，不是隨意；「其」看人物目的，江母最後是請大王明察，是「希望」，不是「難道」","所以「坐：受罰」最恰當"],"tests":"文言字義","avoid":"先組詞代回，讀不通再換招"},{"q":"根據本文，下列關於令尹與楚王的敘述何者最恰當？","opts":["令尹打算偷盜布匹再將罪責嫁禍給他人","令尹主張楚國盜賊橫行是須正視的問題","楚王覺得宮中之物被盜應是令尹的責任","楚王認為不論身分地位都應該遵守法律"],"ans":"D","steps":["圈題幹的人物「令尹與楚王」，回原文找楚王說的話：「令尹信盜之，寡人不為其富貴而不行法焉」","不因為富貴就不執法＝不論身分都要守法；刪去：令尹沒有真的去偷，說盜賊橫行的是江母，楚王還說「令尹不知有何罪焉」，認為令尹沒有責任","所以第四個選項最恰當"],"tests":"人物言行判讀","avoid":"先確認每句話是誰說的"},{"q":"根據本文，江母見楚王的目的最可能是下列何者？","opts":["想要替兒子江乙頂罪","表達江乙被懲處的不公","向楚王告發郢大夫的罪行","建議楚王再用孫叔敖為令尹"],"ans":"B","steps":["題幹問「目的」，找江母最後的重點：「妾子亦豈知之哉？然終坐之。令尹獨何人，而不以是為過也？」","兒子不知情卻被罰，令尹也不知情卻沒事，同樣情況不同對待，就是在說不公平；告布被偷只是她的手段","江乙就是郢大夫，她不會告自己兒子；孫叔敖只是舉的例子；所以目的是「表達江乙被懲處的不公」"],"tests":"推論說話目的","avoid":"目的題看最後的反問句"}]}]}},{"week":6,"groups":[{"no":"第 1 組","title":"濠梁之辯","skill":"四大虛詞：之、其、而、以","steps":["❶ 先圈出「之、其、而、以」","❷ 之：看位置——兩個名詞中間＝的，動作後＝他、它，地方前＝往","❸ 其：往前找人或東西，再加「的」","❹ 而：前後順＝然後，前後反＝卻","❺ 以：先代「用、拿」，不通再代「認為、因此」"],"demo":{"q":"「王乃使玉人理其璞而得寶焉」的「其」和「而」各是什麼意思？","a":["→ 材料：和氏抱著玉璞在楚山下哭，文王「乃使玉人理其璞而得寶焉」","→ 其：往前找，玉璞是和氏的 → 和氏的","→ 而：先雕琢，接著得到寶玉，前後順 → 然後","答：其＝和氏的；而＝然後"]},"parts":[{"label":"第一篇","title":"濠梁之辯","text":["莊子與惠子遊於濠梁之上。莊子曰：「鯈魚出遊從容，是魚之樂也。」惠子曰：「子非魚，安知魚之樂？」莊子曰：「子非我，安知我不知魚之樂？」惠子曰：「我非子，固不知子矣；子固非魚也，子之不知魚之樂，全矣。」"],"cite":"《莊子．秋水》（節選）","notes":"濠梁：濠水上的橋　鯈魚：一種白色的小魚，也寫作「儵魚」　從容：悠閒自在　固：本來　全：完全確定","trans":"莊子和惠子在濠水的橋上散步。莊子說：「鯈魚在水裡游來游去，悠閒自在，這是魚的快樂啊。」惠子說：「你不是魚，怎麼知道魚的快樂？」莊子說：「你不是我，怎麼知道我不知道魚的快樂？」惠子說：「我不是你，本來就不知道你；你本來也不是魚，你不知道魚的快樂，這是完全確定的了。」","qs":[{"q":"「遊於濠梁之上」的「之」是什麼意思？","opts":["往","的","他","這"],"ans":"B","steps":["「之」夾在「濠梁」和「上」兩個名詞中間","代「的」：在濠梁的上面 → 通；代「往」「他」都讀不通"],"tests":"虛詞：之＝的","avoid":"兩個名詞中間的「之」，先代「的」"},{"q":"「安知魚之樂」的「安」是什麼意思？","opts":["安全","安靜","怎麼","安排"],"ans":"C","steps":["句尾是問號，惠子在反問莊子","代「怎麼」：你怎麼知道魚的快樂？→ 通","代「安全」「安靜」都讀不通"],"tests":"字義：安＝怎麼","avoid":"問句裡的「安」，先代「怎麼」"},{"q":"「是魚之樂也」是什麼意思？","opts":["這是魚的快樂啊","魚是快樂的嗎","他是魚的朋友","魚往快樂的地方游"],"ans":"A","steps":["前一句：「鯈魚出遊從容」，魚游得很悠閒","「是」＝這；「之」夾在「魚」和「樂」中間＝的","合起來：這是魚的快樂啊"],"tests":"虛詞：之＝的","avoid":"句首的「是」常常是「這」"},{"q":"惠子最後說「我非子，固不知子矣；子固非魚也，子之不知魚之樂，全矣」，他的推理是什麼？","opts":["他承認莊子真的知道魚很快樂","他認為魚根本不會快樂","他覺得自己比魚更快樂","我不是你，所以不知道你；同樣，你不是魚，所以你一定不知道魚的快樂"],"ans":"D","steps":["前半：「我非子，固不知子矣」→ 我不是你，本來就不知道你","後半：「子固非魚也……全矣」→ 你不是魚，你不知道魚的快樂是確定的","他用同一個道理套到莊子身上；「承認莊子知道」和他的意思相反"],"tests":"推論：找出推理","avoid":"長句子先切兩半，一半一半翻"}]},{"label":"第二篇","title":"莊子釣於濮水","text":["莊子釣於濮水，楚王使大夫二人往先焉，曰：「願以境內累矣！」莊子持竿不顧，曰：「吾聞楚有神龜，死已三千歲矣，王巾笥而藏之廟堂之上。此龜者，寧其死為留骨而貴乎？寧其生而曳尾於塗中乎？」二大夫曰：「寧生而曳尾塗中。」莊子曰：「往矣！吾將曳尾於塗中。」"],"cite":"《莊子．秋水》","notes":"濮水：水名　大夫：官名　往先焉：先去表達楚王的心意　累：麻煩、託付　顧：回頭看　巾笥：用布巾包好、放進竹箱　廟堂：祭祀祖先的地方　寧：寧可　曳：拖　塗：泥巴","trans":"莊子在濮水邊釣魚，楚王派兩位大夫先去向他表達心意，說：「希望把國內的政事託付給您，麻煩您了！」莊子拿著釣竿，頭也不回，說：「我聽說楚國有一隻神龜，已經死了三千年了，楚王用布巾包好、放進竹箱，收藏在廟堂上。這隻龜，是寧可死了留下骨頭被人尊貴地供著呢？還是寧可活著，拖著尾巴在泥巴裡爬呢？」兩位大夫說：「寧可活著，拖著尾巴在泥巴裡爬。」莊子說：「你們走吧！我也要拖著尾巴在泥巴裡爬。」","qs":[{"q":"「願以境內累矣」的「以」是什麼意思？","opts":["以為","因為","拿、用","已經"],"ans":"C","steps":["「以」後面接「境內」（國內的事），是一樣東西","代「拿」：希望拿國內的政事來麻煩您 → 通","代「因為」「已經」都讀不通"],"tests":"虛詞：以＝拿","avoid":"「以」後面接東西，先代「拿、用」"},{"q":"「王巾笥而藏之廟堂之上」，「藏之」的「之」指什麼？","opts":["神龜","楚王","廟堂","大夫"],"ans":"A","steps":["往前找：「吾聞楚有神龜，死已三千歲矣」","被布巾包好、收進廟堂的，是那隻神龜","所以「藏之」的「之」＝牠（神龜）"],"tests":"虛詞：之＝它","avoid":"動作後面的「之」，往前找東西"},{"q":"「寧其生而曳尾於塗中乎」的「其」指誰？","opts":["莊子","大夫","楚王","這隻神龜"],"ans":"D","steps":["前一句開頭：「此龜者」，主角是這隻龜","問的是龜要死還是要活 → 「其」＝牠（神龜）"],"tests":"虛詞：其＝牠","avoid":"「其」往前找這句話的主角"},{"q":"莊子最後說「往矣！吾將曳尾於塗中」，意思是什麼？","opts":["他想去泥巴裡抓烏龜","他寧可自由地過平凡日子，也不去楚國做官","他答應去楚國做大官","他覺得神龜很可憐，要去救牠"],"ans":"B","steps":["大夫自己說：寧可活著在泥巴裡拖尾巴","莊子把自己比成那隻活烏龜；被供在廟堂上＝去做官","所以他是拒絕做官，選擇自由"],"tests":"推論：比喻的意思","avoid":"故事裡的動物，常常是在比人"}]},{"label":"第三篇","title":"和氏璧","text":["武王薨，文王即位，和乃抱其璞而哭於楚山之下，三日三夜，泣盡而繼之以血。王聞之，使人問其故，曰：「天下之刖者多矣，子奚哭之悲也？」和曰：「吾非悲刖也，悲夫寶玉而題之以石，貞士而名之以誑，此吾所以悲也。」王乃使玉人理其璞而得寶焉，遂命曰：「和氏之璧。」"],"cite":"《韓非子．和氏》（節選）","notes":"薨：國君死去　和：和氏，楚國人，之前兩次獻玉都被說是騙子，被砍去雙腳　璞：還沒雕琢的玉石　刖：砍去腳的刑罰　奚：為什麼　題：稱作　貞士：忠誠正直的人　誑：欺騙　理：雕琢","trans":"武王死後，文王即位，和氏就抱著他的玉石在楚山下痛哭，哭了三天三夜，眼淚哭乾了，接著流出血來。文王聽說了，派人去問他原因，說：「天下被砍去腳的人很多，你為什麼哭得這麼傷心呢？」和氏說：「我不是為了被砍去腳而傷心，我傷心的是寶玉卻被稱作石頭，忠誠正直的人卻被說成騙子，這才是我傷心的原因。」文王就派玉匠雕琢他的玉石，果然得到寶玉，於是命名為「和氏之璧」。","qs":[{"q":"「使人問其故」的「其」指誰？","opts":["文王","玉人","武王","和氏"],"ans":"D","steps":["往前找：「和乃抱其璞而哭於楚山之下」","文王派人去問的，是在山下哭的人","所以「其故」＝和氏哭的原因"],"tests":"虛詞：其＝他的","avoid":"「其」＝某人的，先找是誰"},{"q":"「泣盡而繼之以血」是什麼意思？","opts":["哭完就回家了","眼淚哭乾了，接著流出血來","因為流血所以哭","一邊哭一邊幫別人擦血"],"ans":"B","steps":["「泣盡」：眼淚流光了；「而」前後順著發生＝接著","「繼之以血」：用血來接續 → 接著流出血","形容和氏哭得非常傷心"],"tests":"虛詞：而、以","avoid":"「而」先判斷前後是順還是反"},{"q":"「寶玉而題之以石」的「而」是什麼意思？","opts":["然後","因為","卻","和"],"ans":"C","steps":["前面是「寶玉」，後面是「被稱作石頭」，前後意思相反","前後相反時，「而」＝卻 → 是寶玉卻被稱作石頭"],"tests":"虛詞：而＝卻","avoid":"前後意思相反，「而」就是「卻」"},{"q":"和氏哭得那麼傷心，真正的原因是什麼？","opts":["寶玉被當成石頭，忠誠的人被當成騙子","腳被砍斷，非常疼痛","文王不肯見他","玉石被人偷走了"],"ans":"A","steps":["和氏先說：「吾非悲刖也」→ 不是因為腳被砍","再說：「悲夫寶玉而題之以石，貞士而名之以誑」","所以是因為被冤枉、不被相信而傷心"],"tests":"找原因：非……也","avoid":"看到「非……也」，先刪掉，再看後面"}]},{"label":"第四篇","title":"衛人嫁其子","text":["衛人嫁其子而教之曰：「必私積聚。為人婦而出，常也；其成居，幸也。」其子因私積聚，其姑以為多私而出之。其子所以反者，倍其所以嫁。其父不自罪於教子非也，而自知其益富。今人臣之處官者，皆是類也。"],"cite":"《韓非子．說林上》","notes":"子：女兒　私積聚：偷偷存私房錢　出：被休掉、趕回娘家　成居：一直住下去，婚姻長久　姑：婆婆　反：同「返」，回來　倍：加倍　處官：做官","trans":"衛國有個人嫁女兒，教她說：「一定要偷偷存私房錢。做人家媳婦被休回來，是常有的事；能一直住下去，是運氣好。」他的女兒就偷偷存錢，她的婆婆認為她私心太重，把她趕回娘家。女兒帶回來的財物，比出嫁時帶去的多了一倍。她的父親不怪自己教錯了女兒，反而覺得自己更有錢了。現在那些做官的人，都是這一類。","qs":[{"q":"「衛人嫁其子而教之曰」的「之」指誰？","opts":["衛人自己","他的女兒","婆婆","女兒的丈夫"],"ans":"B","steps":["前面：「衛人嫁其子」，要出嫁的是女兒","父親教導的對象，就是要出嫁的女兒 → 「之」＝她"],"tests":"虛詞：之＝她","avoid":"動作後的「之」，往前找人"},{"q":"「其姑以為多私而出之」的「以為」是什麼意思？","opts":["用來做","以後","因為","認為"],"ans":"D","steps":["代「認為」：婆婆認為她私心太重，把她趕走 → 通","代「以後」「用來做」都讀不通"],"tests":"虛詞：以為＝認為","avoid":"「以為」後面接一個想法，就是「認為」"},{"q":"「其父不自罪於教子非也，而自知其益富」的「而」是什麼意思？","opts":["卻、反而","然後","而且","如果"],"ans":"A","steps":["前面：父親不怪自己教錯了，本來應該反省","後面：他反倒覺得自己更有錢，前後意思相反","相反時「而」＝卻、反而"],"tests":"虛詞：而＝卻","avoid":"前後一正一反，「而」是「卻」"},{"q":"作者最後說「今人臣之處官者，皆是類也」，他在批評哪一種官員？","opts":["很會存錢的官員","不教兒女的官員","只想趁做官時替自己撈好處的官員","常常被趕回家的官員"],"ans":"C","steps":["故事裡：女兒只顧偷偷存錢，父親只看到自己變有錢","作者說官員「皆是類也」＝都是這一類","所以是批評只顧自己利益的官員"],"tests":"寓言：找比喻對象","avoid":"最後一句「今……」常是作者真正要說的"}]},{"label":"第五篇","title":"紂為象箸","text":["昔者紂為象箸而箕子怖，以為象箸必不加於土鉶，必將犀玉之杯；象箸玉杯必不羹菽藿，則必旄象豹胎；旄象豹胎必不衣短褐而食於茅屋之下，則錦衣九重，廣室高臺。吾畏其卒，故怖其始。居五年，紂為肉圃，設炮烙，登糟丘，臨酒池，紂遂以亡。故箕子見象箸以知天下之禍。"],"cite":"《韓非子．喻老》（節選）","notes":"紂：商朝最後一個君王　象箸：象牙做的筷子　箕子：紂的叔父　怖：害怕　土鉶：泥土燒的碗　菽藿：豆子和豆葉，指粗菜　旄象豹胎：旄牛、大象、豹胎，指珍貴稀奇的食物　短褐：粗布短衣　肉圃、炮烙、糟丘、酒池：紂王奢侈的享樂和殘酷的刑罰","trans":"從前紂王做了象牙筷子，箕子就感到害怕。他認為：用了象牙筷子，一定不會配泥土燒的碗，一定要用犀牛角和玉做的杯子；用了象牙筷子、玉杯，一定不會拿來吃豆子豆葉這種粗菜，一定要吃旄牛、大象、豹胎這種珍貴的食物；吃這些珍貴食物，一定不會穿粗布短衣、在茅草屋裡吃，一定要穿九層的錦衣，住寬大的房子、高高的樓臺。「我害怕它的結局，所以對它的開始就感到害怕。」過了五年，紂王建造肉林，設置炮烙的酷刑，登上酒糟堆成的山，對著酒池享樂，紂王終於因此滅亡。所以箕子看到象牙筷子，就預知天下將有大禍。","qs":[{"q":"「吾畏其卒，故怖其始」是什麼意思？","opts":["我怕它的結局，所以對它的開頭就害怕","我怕士兵，所以開始逃跑","我怕紂王死了，所以很害怕","我怕他的手下，所以先離開"],"ans":"A","steps":["組詞「卒業」（學業結束）→ 卒＝結束、結局；對稱句「始」＝開始，一頭一尾，驗證","「其」＝它的，指用象牙筷子這件事","合起來：怕這件事的結局，所以從開頭就害怕"],"tests":"虛詞：其＋對稱句","avoid":"對稱的兩句，一起翻最準"},{"q":"「紂遂以亡」的「以」是什麼意思？","opts":["用","因此、因為這樣","把","認為"],"ans":"B","steps":["前面：紂王做肉圃、設炮烙、登糟丘、臨酒池","代「因此」：紂王終於因為這樣而滅亡 → 通","代「用亡」「把亡」都讀不通"],"tests":"虛詞：以＝因此","avoid":"「以」放在結果前面，試試「因此」"},{"q":"箕子為什麼看到象牙筷子就害怕？","opts":["象牙筷子太貴，國家馬上會破產","他自己也想要象牙筷子","象牙筷子很容易斷","有了象牙筷子就要配玉杯、珍貴食物、錦衣高樓，奢侈會越來越大"],"ans":"D","steps":["連鎖：象箸 → 犀玉之杯 → 旄象豹胎 → 錦衣九重、廣室高臺","一件小奢侈會帶出更多奢侈","箕子怕的是一路下去的結局"],"tests":"因果連鎖","avoid":"把「必……則必……」排成一條鏈"},{"q":"最後一句「箕子見象箸以知天下之禍」，告訴我們什麼道理？","opts":["筷子要用便宜的","國君不能吃好東西","從小地方就能看出以後的大禍","箕子會算命"],"ans":"C","steps":["證據：看到「象箸」（小事）→ 知道「天下之禍」（大事）","五年後紂王果然滅亡，證明他看得準","道理：從小地方就能預見大問題"],"tests":"寓言道理","avoid":"「故」開頭的最後一句常是結論"}]}]},{"no":"第 2 組","title":"黃鶴樓送孟浩然之廣陵","skill":"唐詩修辭：譬喻、誇飾、對偶","steps":["❶ 先讀出畫面：詩裡有哪些景物","❷ 找譬喻：有沒有把甲說成像乙（比、如、疑是）","❸ 找誇飾：數字或程度是不是大得不可能（三千尺、萬仞）","❹ 找對偶：兩句字數相同，詞語一對一","❺ 最後問：這樣寫，讓畫面或心情變得怎樣？"],"demo":{"q":"李白「白髮三千丈，緣愁似箇長」的「白髮三千丈」用了哪一種修辭？","a":["→ 材料：李白〈秋浦歌〉「白髮三千丈，緣愁似箇長」","→ 頭髮不可能有三千丈長，是故意說大","→ 後句說原因：因為憂愁像頭髮這麼長，用來表現愁很多","答：誇飾"]},"parts":[{"label":"第一篇","title":"黃鶴樓送孟浩然之廣陵","text":["故人西辭黃鶴樓，煙花三月下揚州。","孤帆遠影碧空盡，唯見長江天際流。"],"cite":"李白〈黃鶴樓送孟浩然之廣陵〉","notes":"故人：老朋友，指孟浩然　辭：告別　黃鶴樓：在今天的湖北武漢　廣陵：揚州　碧空：藍天　天際：天邊","trans":"老朋友孟浩然在西邊的黃鶴樓和我告別，在繁花盛開的三月，坐船順江而下前往揚州。一艘小船的影子越來越遠，消失在藍天的盡頭，只看見長江的水向天邊流去。","qs":[{"q":"題目「送孟浩然之廣陵」的「之」是什麼意思？","opts":["的","他","往","這"],"ans":"C","steps":["「之」後面接地名「廣陵」","地方前面的「之」＝往 → 送孟浩然前往廣陵"],"tests":"虛詞：之＝往","avoid":"「之」後面接地方，就是「往」"},{"q":"「煙花三月下揚州」的「煙花」是什麼？","opts":["過年放的煙火","春天開得像煙霧一樣的繁花","工廠冒出的煙","燒香的煙"],"ans":"B","steps":["「三月」是春天，詩人送朋友去揚州","春天花開得又多又密，遠看像一片煙霧","古代「煙花」不是現在的煙火（古今異義）"],"tests":"古今異義：煙花","avoid":"詩裡的詞，先想季節和畫面"},{"q":"關於「孤帆遠影碧空盡，唯見長江天際流」，哪一個說法正確？","opts":["是對偶，因為兩句都是七個字","用了誇飾，說船有三千尺長","用了譬喻，把帆比成白雲","兩句字數相同，但詞語沒有一對一相對，所以不是對偶"],"ans":"D","steps":["對偶要兩個條件：字數相同、詞語一對一","「孤帆遠影」對「唯見長江」，對不起來","詩中也沒有「像、比」和誇大的數字 → 不是對偶，也沒有譬喻、誇飾"],"tests":"修辭：判斷對偶","avoid":"字數相同還不夠，詞語要一對一"},{"q":"詩人沒有直接寫「我捨不得」，他用什麼方法寫出不捨？","opts":["寫自己一直望著船，望到消失，只剩江水流向天邊","寫自己大哭一場","寫孟浩然回頭揮手","寫揚州的花很漂亮"],"ans":"A","steps":["「孤帆遠影碧空盡」：船越來越遠，消失在藍天邊","「唯見長江天際流」：只看得到江水，表示詩人還站著望","一直望到看不見，就是捨不得"],"tests":"寫法：借景寫情","avoid":"看詩人的眼睛在看什麼，就知道心情"}]},{"label":"第二篇","title":"望廬山瀑布","text":["日照香爐生紫煙，遙看瀑布掛前川。","飛流直下三千尺，疑是銀河落九天。"],"cite":"李白〈望廬山瀑布〉","notes":"香爐：香爐峰，廬山的一座山峰　紫煙：陽光照在水氣上，看起來像紫色的煙霧　遙：遠遠地　川：河流，這裡指山前的水流　九天：天的最高處","trans":"太陽照在香爐峰上，升起紫色的煙霧，遠遠看去，瀑布像一條白布掛在山前。水流從高處直直衝下三千尺，讓人以為是銀河從最高的天上落下來。","qs":[{"q":"「飛流直下三千尺」用了哪一種修辭？","opts":["譬喻","誇飾","對偶","設問"],"ans":"B","steps":["瀑布不可能真的有三千尺","故意把高度說大，讓人感到瀑布又高又壯觀 → 誇飾"],"tests":"修辭：誇飾","avoid":"大得不可能的數字，就是誇飾"},{"q":"「疑是銀河落九天」用了什麼修辭？","opts":["譬喻：把瀑布比成從天上落下來的銀河","誇飾：銀河真的掉下來了","對偶：和上一句一對一相對","譬喻：把銀河比成瀑布"],"ans":"A","steps":["詩人眼前看的是瀑布，「疑是」＝好像是","把瀑布說成像銀河 → 譬喻，被比的是瀑布","「把銀河比成瀑布」把順序弄反了"],"tests":"修辭：譬喻","avoid":"先找眼前的東西，再找它被比成什麼"},{"q":"「遙看瀑布掛前川」的「掛」字，寫出瀑布的什麼樣子？","opts":["瀑布被人用繩子掛起來","瀑布很小，像一條毛巾","瀑布停止不流了","從遠處看，瀑布像一條長長的白布垂掛在山前"],"ans":"D","steps":["「遙看」：從很遠的地方看","遠看時，水流像一條布從高處垂下來，所以用「掛」","「用繩子掛」「停止不流」都把詩句當真，不合畫面"],"tests":"鍊字：掛","avoid":"先看是近看還是遠看"},{"q":"「疑是銀河落九天」的「疑」是什麼意思？","opts":["懷疑別人說謊","問問題","好像、讓人以為","確定"],"ans":"C","steps":["組詞「疑似」，代回「好像是銀河從天上落下」→ 通","「懷疑別人說謊」「確定」都不合畫面"],"tests":"字義：疑","avoid":"詩裡的「疑」，常常是「好像」"}]},{"label":"第三篇","title":"飲湖上初晴後雨","text":["水光瀲灩晴方好，山色空濛雨亦奇。","欲把西湖比西子，淡妝濃抹總相宜。"],"cite":"蘇軾〈飲湖上初晴後雨〉","notes":"瀲灩：水波蕩漾、閃閃發光的樣子　空濛：雲霧迷茫的樣子　西子：西施，春秋時越國的美女　淡妝濃抹：淡淡的妝、濃濃的妝","trans":"晴天時，湖水波光閃閃，正是好看；下雨時，山色迷迷濛濛，也很奇妙。如果把西湖比作美女西施，不管是化淡妝還是濃妝，都一樣好看。","qs":[{"q":"「水光瀲灩晴方好，山色空濛雨亦奇」用了哪一種修辭？","opts":["對偶","誇飾","譬喻","設問"],"ans":"A","steps":["兩句都是七個字","水光↔山色、晴↔雨、方好↔亦奇，一對一相對 → 對偶"],"tests":"修辭：對偶","avoid":"一個詞一個詞配對，看對不對得起來"},{"q":"「欲把西湖比西子」用了哪一種修辭？","opts":["對偶","誇飾","設問","譬喻，把西湖比成美女西施"],"ans":"D","steps":["「比」字就是把甲比成乙","被比的是西湖，比成的是西子（西施）→ 譬喻"],"tests":"修辭：譬喻","avoid":"看到「比、如、像、疑是」，想到譬喻"},{"q":"「淡妝濃抹總相宜」是什麼意思？","opts":["西施只化淡妝才好看","不管化淡妝還是濃妝，都很好看","西湖要化妝才美","化妝太濃不好看"],"ans":"B","steps":["「總相宜」＝總是很合適、都好看","放回前一句：西湖像西施，晴天雨天都美，就像淡妝濃妝都好看"],"tests":"句意","avoid":"「總」＝都，不要只選其中一種"},{"q":"「晴方好」的「方」是什麼意思？","opts":["方形","方向","正、正是","方法"],"ans":"C","steps":["對稱句：「雨亦奇」，「方」和「亦」在同樣的位置","亦＝也，是副詞；代「正」：晴天時正好看 → 通"],"tests":"字義：對稱句","avoid":"找對稱句同位置的字來比"}]},{"label":"第四篇","title":"題西林壁","text":["橫看成嶺側成峰，遠近高低各不同。","不識廬山真面目，只緣身在此山中。"],"cite":"蘇軾〈題西林壁〉","notes":"西林：西林寺，在廬山　嶺：連綿的山脈　峰：高而尖的山頂　識：認識、看清楚　真面目：真正的樣子","trans":"從正面橫著看，廬山是連綿的山嶺；從側面看，又成了高聳的山峰；從遠、近、高、低不同的地方看，樣子都不一樣。看不清廬山真正的樣子，只是因為自己就在這座山裡面。","qs":[{"q":"「只緣身在此山中」的「緣」是什麼意思？","opts":["緣分","邊緣","沿著","因為"],"ans":"D","steps":["組詞「緣故」，代回「只因為人在這座山裡」→ 通","前句「不識廬山真面目」是結果，這句說原因 → 因為"],"tests":"字義：緣＝因為","avoid":"後一句在說原因，「緣」就是「因為」"},{"q":"「橫看成嶺側成峰」用了譬喻或誇飾嗎？","opts":["都沒有，是直接寫從正面、側面看到的山形","誇飾，故意把廬山說得很高","譬喻，把廬山比成一個人","譬喻，把山嶺比成山峰"],"ans":"A","steps":["找譬喻：句中沒有「像、如、比、疑是」，嶺和峰都是真的看到的山形","找誇飾：沒有誇大的數字或程度（不像「三千尺」「萬仞」）","所以兩種都沒有，是直接寫：橫著看是山嶺，側著看是山峰"],"tests":"辨認有沒有修辭","avoid":"先找提示字和誇大數字再判斷"},{"q":"「遠近高低各不同」說明了什麼？","opts":["廬山每天都在變形","詩人走路走得很累","站的位置不同，看到的山也不一樣","廬山上有很多不同的樹"],"ans":"C","steps":["遠、近、高、低是看山的位置","「各不同」：每個位置看到的樣子都不同","所以是說觀看的位置不同，結果就不同"],"tests":"句意","avoid":"先找主角在做什麼（看山）"},{"q":"這首詩想告訴我們什麼道理？","opts":["廬山太大了，永遠看不完","身在其中反而看不清全貌，要跳出來看","爬山要從側面爬才安全","看風景一定要站在山頂"],"ans":"B","steps":["最後兩句：看不清廬山真面目，是因為人在山裡","人在事情裡面，反而看不清楚","道理：要換個角度、跳出來看"],"tests":"詩的道理","avoid":"道理常在最後兩句"}]},{"label":"第五篇","title":"涼州詞","text":["黃河遠上白雲間，一片孤城萬仞山。","羌笛何須怨楊柳，春風不度玉門關。"],"cite":"王之渙〈涼州詞〉","notes":"仞：古代的長度單位，一仞約七、八尺　孤城：孤單的一座城　羌笛：西方羌族的笛子　怨：吹出哀怨的曲調　楊柳：指〈折楊柳〉這首曲子，和離別有關　度：越過　玉門關：古代通往西域的關口","trans":"黃河遠遠地向上流，好像流進了白雲之間；一座孤單的小城，被萬仞高的大山包圍。羌笛何必吹奏哀怨的〈折楊柳〉呢？春風本來就吹不過玉門關。","qs":[{"q":"「一片孤城萬仞山」的「萬仞山」用了哪一種修辭？","opts":["譬喻","對偶","誇飾","設問"],"ans":"C","steps":["一仞約七、八尺，一萬仞高得不可能","故意說大，強調山非常高 → 誇飾"],"tests":"修辭：誇飾","avoid":"「萬」「千」常常是誇飾"},{"q":"「一片孤城萬仞山」把孤城和萬仞山放在一起，寫出什麼畫面？","opts":["城很大、山很小","小小一座孤城被高大的群山包圍，顯得更孤單","城裡非常熱鬧","山上有很多座城"],"ans":"B","steps":["「一片孤城」：小，只有一座","「萬仞山」：極高的大山","一小一大放在一起，城顯得更小、更孤單"],"tests":"寫法：大小對比","avoid":"大小放在一起，看誰被凸顯"},{"q":"「羌笛何須怨楊柳」的「何須」是什麼意思？","opts":["何必","一定要","哪一個","應該要"],"ans":"A","steps":["代回「羌笛何必吹出哀怨的〈折楊柳〉」→ 通","後句：春風吹不過玉門關，再怎麼哀怨也沒用 → 何必"],"tests":"字義：何須","avoid":"「何須」放進句子讀，常是「何必」"},{"q":"「春風不度玉門關」寫出邊塞的什麼樣子？","opts":["玉門關的門關著，所以風進不來","春天時關口禁止通行","玉門關的春天特別美","邊塞偏遠荒涼，連春天的溫暖都到不了"],"ans":"D","steps":["「度」＝越過（注釋）","春風越不過玉門關 → 關外一片荒涼寒冷","也寫出守邊士兵的辛苦和思鄉"],"tests":"畫面與心情","avoid":"詩句不要只照字面想"}]}]},{"no":"第 3 組","title":"吾十有五而志于學","skill":"互文對讀三：找對應句、分正例反例","steps":["❶ 先把甲文《論語》翻成白話","❷ 乙文每個人物做了什麼，各寫一句","❸ 連線：乙文哪一句對應甲文哪一句","❹ 判斷乙是正例（照著做）還是反例（做相反）","❺ 問「共同」，要兩篇都找得到證據"],"demo":{"q":"甲「君子欲訥於言，而敏於行」；乙「阿明沒多說什麼，每天放學默默多練五十球。」阿明是正例還是反例？","a":["→ 材料：甲「君子欲訥於言，而敏於行」；乙「阿明沒多說什麼，每天放學默默多練五十球。」","→ 甲：話要少、做要多","→ 乙：阿明話少，卻每天做到 → 跟甲一樣","答：正例"]},"parts":[{"label":"第一篇","title":"吾十有五而志于學","text":["甲　子曰：「吾十有五而志于學，三十而立，四十而不惑，五十而知天命，六十而耳順，七十而從心所欲，不踰矩。」","乙　阿哲十歲時看了一場籃球比賽，下定決心要進校隊。十二歲，他在隊上站穩了先發位置，不再一下子想學這個、一下子想學那個。十四歲，教練、學長給他各種建議，他知道哪些適合自己，不會被弄得一頭霧水。他說：「每個年紀都有一個新關卡，我一關一關地過。」"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"志：立定志向　立：站穩腳步　惑：迷惑　耳順：聽到別人的話都能明白通達　踰：超過　矩：規矩","trans":"甲：孔子說：「我十五歲立志學習，三十歲在學問和做人上站穩腳步，四十歲不再迷惑，五十歲懂得天命，六十歲聽到別人的話都能明白通達，七十歲隨心所欲，也不會超出規矩。」","qs":[{"q":"「吾十有五」是指幾歲？","opts":["十五歲","五歲","十歲","五十歲"],"ans":"A","steps":["「有」在數字中間，同「又」：十又五","十又五＝十五歲；後面三十、四十也都是年紀"],"tests":"字義：有＝又","avoid":"數字中間的「有」＝又"},{"q":"乙文「下定決心要進校隊」對應甲文哪一句？","opts":["三十而立","四十而不惑","十有五而志于學","七十而從心所欲"],"ans":"C","steps":["下定決心＝立定志向","甲文「志于學」＝立志學習 → 對應"],"tests":"甲乙句子對應","avoid":"把乙的白話換成甲的關鍵字"},{"q":"乙文「知道哪些適合自己，不會被弄得一頭霧水」對應甲文哪一句？","opts":["志于學","三十而立","從心所欲","四十而不惑"],"ans":"D","steps":["一頭霧水＝迷惑","不會一頭霧水＝不惑 → 四十而不惑"],"tests":"甲乙句子對應","avoid":"抓乙文的關鍵詞，翻成文言"},{"q":"甲、乙兩篇共同的意思是什麼？","opts":["十五歲以前不用學習","人的成長是一個階段一個階段往上走的","一定要到七十歲才能做好事情","每個人都要在十歲立志"],"ans":"B","steps":["甲：十五、三十、四十……每個年紀都有新的境界","乙：「每個年紀都有一個新關卡，我一關一關地過」","兩篇都講一步一步成長；其他選項兩篇都沒說"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"}]},{"label":"第二篇","title":"三軍可奪帥也","text":["甲　子曰：「三軍可奪帥也，匹夫不可奪志也。」","乙　球隊的隊長受傷了，教練可以換別人當隊長；比賽的時間、場地，也可能被臨時改掉。可是小宇心裡「一定要把罰球練到十投八中」的決心，誰也拿不走。就算有人笑他投籃動作醜，他還是每天放學後多練五十球。"],"cite":"甲：《論語．子罕》　乙：練習用自編短文","notes":"三軍：一國的軍隊　帥：主帥、統帥　匹夫：普通人","trans":"甲：孔子說：「一國的大軍，可以被奪去主帥；但是一個普通人，他的志向卻不能被奪走。」","qs":[{"q":"「三軍可奪帥也」的「奪」是什麼意思？","opts":["爭取第一名","強行拿走","決定","丟掉"],"ans":"B","steps":["組詞「搶奪」，代回「軍隊的主帥可以被搶走」→ 通","後句「不可奪志」：志向不能被搶走，也通"],"tests":"字義：奪","avoid":"組詞後兩句都代回，都通才對"},{"q":"乙文「教練可以換別人當隊長」對應甲文哪一部分？","opts":["匹夫不可奪志也","學而時習之","四十而不惑","三軍可奪帥也"],"ans":"D","steps":["隊長是團隊的帶頭人，像軍隊的主帥","隊長可以被換掉＝帥可以被奪 → 三軍可奪帥也"],"tests":"甲乙句子對應","avoid":"先找乙文的人物像甲文的誰"},{"q":"乙文哪一件事最能說明「匹夫不可奪志也」？","opts":["被笑動作醜，還是每天多練五十球","隊長受傷了","比賽場地被改掉","教練換了隊長"],"ans":"A","steps":["「不可奪志」：決心不會被別人改變","小宇被笑，還是照樣練 → 決心沒被拿走","隊長受傷、場地改掉、換隊長，都是可以被改變的事，屬於「可奪帥」那一邊"],"tests":"找證據","avoid":"找人物「不改變」的那件事"},{"q":"甲文把「三軍」和「匹夫」放在一起說，想強調什麼？","opts":["軍隊一點用也沒有","普通人比將軍還厲害","外在的東西可以被拿走，但堅定的志向誰也奪不走","不要當主帥，比較安全"],"ans":"C","steps":["三軍很強大，主帥卻可能被奪走","匹夫很普通，志向卻奪不走","一強一弱對比，凸顯志向的力量；「軍隊沒用」「普通人比將軍厲害」都說得太過頭"],"tests":"主旨：對比","avoid":"說得太絕對的選項先小心"}]},{"label":"第三篇","title":"朝聞道夕死可矣","text":["甲　子曰：「朝聞道，夕死可矣。」","乙　阿凱這學期一直想不通，為什麼自己運球老是被抄截。有一天，教練點醒他：「運球時眼睛要看前面的隊友和防守的人，不是看球。」阿凱試了幾次，果然不再被抄。他高興地說：「就算我今天才懂，也比一輩子都不懂好！」他把這句話寫在球鞋盒上，提醒自己：真正重要的道理，什麼時候學會都值得。"],"cite":"甲：《論語．里仁》　乙：練習用自編短文","notes":"道：真理，做人做事的道理　可：可以，這裡指沒有遺憾","trans":"甲：孔子說：「早上明白了真理，就算晚上死去，也沒有遺憾了。」","qs":[{"q":"「朝聞道」的「朝」是什麼意思？","opts":["朝代","朝向","早上","朝見國君"],"ans":"C","steps":["組詞「朝陽」（早上的太陽），代回「早上聽到道理」→ 通","對稱句：「夕死可矣」，「夕」＝晚上，早上對晚上 → 驗證","「朝代」「朝向」代回都讀不通 → 朝＝早上"],"tests":"字義：對稱句","avoid":"找跟它對稱的字，一起看"},{"q":"「朝聞道」的「聞」是什麼意思？","opts":["用鼻子聞","聽到、明白","有名","新聞"],"ans":"B","steps":["組詞「聽聞」，代回「早上聽到、明白了道理」→ 通","道理不能用鼻子聞；古代「聞」多半是聽到（古今異義）"],"tests":"古今異義：聞","avoid":"古文的「聞」，先想「聽到」"},{"q":"乙文哪一句最接近甲文的意思？","opts":["運球時眼睛要看前面的隊友","阿凱試了幾次，果然不再被抄","他把這句話寫在球鞋盒上","就算我今天才懂，也比一輩子都不懂好"],"ans":"D","steps":["甲：早上明白了道理，晚上死去也沒有遺憾 → 明白道理非常珍貴","乙：今天才懂，也比一輩子不懂好 → 同樣說明白道理很值得"],"tests":"甲乙句子對應","avoid":"找「意思」一樣的，不是找字一樣的"},{"q":"甲、乙兩篇共同強調的是什麼？","opts":["明白真正重要的道理，是非常珍貴的事","人很快就會死","早上學習效果最好","運球一定要看隊友"],"ans":"A","steps":["甲：聽到真理就沒有遺憾","乙：懂了重要的道理，什麼時候學會都值得","「運球要看隊友」只有乙有；「人很快會死」「早上學習最好」兩篇都沒說"],"tests":"找兩篇相同點","avoid":"只有一篇有的，不能選「共同」"}]},{"label":"第四篇","title":"君子欲訥於言而敏於行","text":["甲　子曰：「君子欲訥於言，而敏於行。」","乙　班上要辦籃球比賽，小傑在班會上大聲說：「我負責借球、排賽程、找裁判！」結果比賽前一天，什麼都還沒做。阿宏平常話不多，只說了一句：「我來畫場地線。」第二天一早，球場的線已經整整齊齊畫好了。"],"cite":"甲：《論語．里仁》　乙：練習用自編短文","notes":"君子：品德好的人　欲：希望、想要　行：做事","trans":"甲：孔子說：「君子說話要謹慎、不輕易出口，做事卻要勤快敏捷。」","qs":[{"q":"「訥於言」的「訥」是什麼意思？","opts":["說話很大聲","說話很快","很會說話","說話謹慎、不輕易開口"],"ans":"D","steps":["組詞「木訥」：不多話","代回「君子說話要謹慎，做事要勤快」→ 一慢一快，通"],"tests":"字義：訥","avoid":"組詞後代回整句，看前後合不合"},{"q":"乙文中，誰的做法符合甲文？","opts":["阿宏","小傑","兩個都符合","兩個都不符合"],"ans":"A","steps":["阿宏：話少（訥於言），隔天就畫好線（敏於行）","小傑：說很多卻沒做 → 不符合"],"tests":"正例反例","avoid":"人物做的事，一項一項對甲文"},{"q":"小傑的表現，和甲文的關係是什麼？","opts":["只有「訥於言」相反","只有「敏於行」相反","兩半都相反：話說太多、事做太少","完全符合甲文"],"ans":"C","steps":["「訥於言」：話要少 → 小傑大聲說很多，相反","「敏於行」：做事要快 → 小傑什麼都沒做，也相反","所以是反例，兩半都相反"],"tests":"正例反例","avoid":"甲文分兩半，各對一次"},{"q":"「敏於行」的「敏」是什麼意思？","opts":["過敏","勤快、敏捷","敏感、容易生氣","聰明，很會考試"],"ans":"B","steps":["組詞「敏捷」，代回「做事勤快敏捷」→ 通","乙文阿宏隔天一早就畫好線 → 做事快，驗證"],"tests":"字義：敏","avoid":"用乙文的例子幫忙驗證"}]},{"label":"第五篇","title":"知者不惑仁者不憂勇者不懼","text":["甲　子曰：「知者不惑，仁者不憂，勇者不懼。」","乙　決賽最後十秒，我們落後一分。小凡把戰術想得很清楚，知道該把球傳給誰，一點也不慌亂；隊長心裡想著「輸贏都是大家一起扛」，不擔心被誰責怪；阿威接到球，面對比他高一個頭的中鋒，也敢直接切入上籃。"],"cite":"甲：《論語．子罕》　乙：練習用自編短文","notes":"仁者：有仁德、心胸寬厚的人","trans":"甲：孔子說：「有智慧的人不會迷惑，有仁德的人不會憂愁，勇敢的人不會害怕。」","qs":[{"q":"「知者不惑」的「知」是什麼意思？","opts":["知道","通知","同「智」，有智慧","知識"],"ans":"C","steps":["組詞「知道」代回：「知道的人不迷惑」，知道什麼？讀不順","看並排：「知者」和「仁者」「勇者」都是一種人 → 有智慧的人","代回「有智慧的人不會迷惑」→ 通；「知」同「智」"],"tests":"通同字：知＝智","avoid":"並排的三個詞，意思要同一類"},{"q":"「勇者不懼」的「懼」是什麼意思？","opts":["害怕","生氣","懷疑","後悔"],"ans":"A","steps":["組詞「恐懼」，代回「勇敢的人不害怕」→ 通","看部首「忄」，和心情有關，也合"],"tests":"字義：懼","avoid":"組詞後再看部首驗證"},{"q":"乙文哪一個人對應「仁者不憂」？","opts":["小凡","阿威","中鋒","隊長"],"ans":"D","steps":["「不憂」＝不擔心","隊長想「大家一起扛」，不擔心被責怪 → 心胸寬厚、不憂"],"tests":"甲乙句子對應","avoid":"找乙文「不擔心」的那個人"},{"q":"乙文的三個人，依序對應甲文哪三種人？","opts":["小凡—勇者，隊長—知者，阿威—仁者","小凡—知者，隊長—仁者，阿威—勇者","小凡—仁者，隊長—勇者，阿威—知者","三個人都是勇者"],"ans":"B","steps":["小凡想清楚戰術、不慌亂 → 知者不惑","隊長不擔心 → 仁者不憂；阿威敢切入 → 勇者不懼"],"tests":"甲乙全部連線","avoid":"一個人一個人連線，再看選項"}]}]},{"no":"第 4 組","title":"望梅止渴","skill":"一字多義＋古今異義（世說新語）","steps":["❶ 圈出看不懂或怪怪的字","❷ 組詞代回原句讀讀看","❸ 看人物動作、前後情節，再驗證一次","❹ 想想：這個字現在的意思一樣嗎？（古今異義）","❺ 同一個字在別篇見過嗎？比一比（一字多義）"],"demo":{"q":"「看書竟，默然無言」的「竟」是什麼意思？","a":["→ 材料：謝安「看書竟，默然無言，徐向局」","→ 組詞「竟然」代回：看信竟然？讀不通","→ 換組詞「未竟」（沒完成）：竟＝完；代回「看完信，沉默不說話，再轉向棋盤」→ 合情節","答：完畢"]},"parts":[{"label":"第一篇","title":"望梅止渴","text":["魏武行役，失汲道，軍皆渴，乃令曰：「前有大梅林，饒子，甘酸可以解渴。」士卒聞之，口皆出水，乘此得及前源。"],"cite":"《世說新語．假譎》","notes":"魏武：曹操　行役：帶兵行軍　汲道：取水的路　甘：甜　前源：前方的水源","trans":"曹操帶兵行軍，找不到取水的路，全軍都很口渴。曹操就下令說：「前面有一大片梅林，結了很多果子，又甜又酸，可以用來解渴。」士兵聽了，嘴裡都流出口水，靠著這個辦法，撐到了前方的水源。","qs":[{"q":"「饒子」的「子」是什麼意思？","opts":["兒子","你","果實","先生"],"ans":"C","steps":["代回「梅林結了很多果實，又甜又酸」→ 通","代「兒子」「你」，放在梅林後面讀不通（一字多義）"],"tests":"一字多義：子","avoid":"「子」不一定是人，代回去看"},{"q":"「饒子」的「饒」是什麼意思？","opts":["多","饒恕","求饒","圍繞"],"ans":"A","steps":["組詞「富饒」，代回「果實很多」→ 通","後面「甘酸可以解渴」，果子多才能讓全軍解渴，合情節"],"tests":"字義：饒","avoid":"組詞後，用情節再確認一次"},{"q":"「乘此得及前源」的「乘」是什麼意思？","opts":["坐車","乘法","乘客","趁著、靠著"],"ans":"D","steps":["代「坐車」：坐這個到水源？文中根本沒有車，不通","代「靠著」：靠著這個辦法撐到水源 → 合情節（古今異義）"],"tests":"古今異義：乘","avoid":"代回後問：文中真的有這東西嗎？"},{"q":"曹操用什麼方法讓士兵撐到水源？","opts":["他真的找到一片梅林","說前面有梅林，讓士兵想到酸梅流口水，暫時不那麼渴","他把自己的水分給士兵","他命令士兵不准說渴"],"ans":"B","steps":["「口皆出水」：士兵聽了流口水","後來到的是「前源」（水源），文中沒寫真的有梅林","曹操是用一句話讓大家流口水，撐到水源"],"tests":"推論：方法","avoid":"文中沒寫到的事，不能當真"}]},{"label":"第二篇","title":"謝公與人圍棋","text":["謝公與人圍棋，俄而謝玄淮上信至。看書竟，默然無言，徐向局。客問淮上利害，答曰：「小兒輩大破賊。」意色舉止，不異於常。"],"cite":"《世說新語．雅量》","notes":"謝公：謝安，東晉的宰相　謝玄：謝安的姪子，在淮水前線帶兵　俄而：不久　淮上：淮水前線　局：棋盤　利害：勝敗的情況　小兒輩：孩子們，指謝玄等人　意色：神情臉色","trans":"謝安和客人下圍棋，不久，謝玄從淮水前線派來的信使到了。謝安看完信，沉默不說話，慢慢地轉向棋盤繼續下。客人問他前線戰況如何，他回答：「孩子們把敵人打得大敗。」神情臉色和舉動，跟平常沒有兩樣。","qs":[{"q":"「謝玄淮上信至」的「信」是什麼意思？","opts":["相信","信用","寫信","送信的人（使者）"],"ans":"D","steps":["「信至」：到了；下一句才「看書」","古代「信」常指送信的人，「書」才是信（古今異義）","代回「前線的使者到了」→ 通"],"tests":"古今異義：信","avoid":"古文的「信」「書」要分清楚"},{"q":"「看書竟」的「書」是什麼意思？","opts":["書本","信","書法","寫字"],"ans":"B","steps":["前一句：前線的使者剛到","謝安看的是使者帶來的前線消息 → 信","下棋時突然看書本，不合情節"],"tests":"古今異義：書","avoid":"用前一句的情節來驗證"},{"q":"「徐向局」的「徐」是什麼意思？","opts":["慢慢地","姓徐","很快地","徐州"],"ans":"A","steps":["組詞「徐徐」，代回「慢慢地轉向棋盤」→ 通","後文「不異於常」，他很平靜 → 慢慢回到棋局，合"],"tests":"字義：徐","avoid":"人物的心情，可以驗證動作快慢"},{"q":"這段文字寫出謝安什麼性格？","opts":["驕傲自大","一點也不關心戰爭","沉著冷靜，大喜事也不表現在臉上","膽小怕事"],"ans":"C","steps":["證據：「默然無言」「意色舉止，不異於常」","打了大勝仗還像平常一樣 → 沉著冷靜","他有看信、也回答戰況，不是不關心 → 「不關心戰爭」錯"],"tests":"人物形象","avoid":"從人物的表情和動作找證據"}]},{"label":"第三篇","title":"支公好鶴","text":["有人遺其雙鶴，少時翅長欲飛。支意惜之，乃鎩其翮。鶴軒翥不復能飛，乃反顧翅，垂頭視之，如有懊喪意。林曰：「既有凌霄之姿，何肯為人作耳目近玩！」養令翮成，置使飛去。"],"cite":"《世說新語．言語》（節選）","notes":"其：指支道林（支公），東晉的和尚，很喜歡鶴　惜：捨不得　鎩：剪斷、摧殘　翮：翅膀上的大羽毛　軒翥：振翅高飛　懊喪：懊惱沮喪　凌霄：直上雲霄　耳目近玩：放在身邊觀賞的玩物","trans":"有人送給支公一對鶴。不久，鶴的翅膀長好了，想要飛走。支公心裡捨不得，就剪短了牠們的翅羽。鶴想振翅高飛，卻再也飛不起來，就回頭看看自己的翅膀，垂下頭來，好像很懊惱沮喪的樣子。支道林說：「牠們既然有直上雲霄的本領，怎麼肯給人當成身邊觀賞的玩物呢！」於是把鶴養到翅羽重新長好，放牠們飛走了。","qs":[{"q":"「有人遺其雙鶴」的「遺」是什麼意思？","opts":["遺失","送給","遺留","遺忘"],"ans":"B","steps":["代「遺失」：有人弄丟他的鶴？可是後面鶴就在支公身邊，不合","代「送給」：有人送他一對鶴，後面他養鶴 → 合情節（古今異義）"],"tests":"古今異義：遺","avoid":"代回後看後面的情節對不對"},{"q":"「少時翅長欲飛」的「少時」是什麼意思？","opts":["年少的時候","很少的時候","小時候","不久"],"ans":"D","steps":["現代「少時」是年輕的時候；但鶴剛送來，接著翅膀就長好","代「不久」：不久翅膀長好想飛 → 合情節（古今異義）"],"tests":"古今異義：少時","avoid":"時間詞要對照前後的事情"},{"q":"鶴為什麼「垂頭視之，如有懊喪意」？","opts":["鶴生病了","鶴想念原來的主人","翅羽被剪，想飛卻飛不起來","支公罵了牠們"],"ans":"C","steps":["前句：「乃鎩其翮」，翅羽被剪短","接著「軒翥不復能飛」：想飛卻飛不起來","所以回頭看翅膀、垂頭喪氣"],"tests":"因果","avoid":"找「乃」前面的原因"},{"q":"支公最後為什麼把鶴放走？","opts":["他明白鶴天生要飛上天空，不該被留在身邊當玩物","他不喜歡鶴了","鶴太吵了","有人要把鶴買走"],"ans":"A","steps":["支公說：「既有凌霄之姿，何肯為人作耳目近玩！」","意思：鶴有飛上雲霄的本領，怎麼肯當人的玩物","所以他把鶴養好，放牠們自由"],"tests":"人物想法轉變","avoid":"人物說的話，常是改變的原因"}]},{"label":"第四篇","title":"何可一日無此君","text":["王子猷嘗暫寄人空宅住，便令種竹。或問：「暫住何煩爾？」王嘯詠良久，直指竹曰：「何可一日無此君？」"],"cite":"《世說新語．任誕》","notes":"王子猷：王徽之，王羲之的兒子　寄：借住　嘯詠：吹口哨、吟詩　良久：很久","trans":"王子猷曾經暫時借住在別人的空房子裡，一住進去就叫人種竹子。有人問他：「只是暫時住一下，何必這麼麻煩呢？」王子猷吹口哨吟詩了很久，才直接指著竹子說：「怎麼可以一天沒有這位先生呢？」","qs":[{"q":"「或問」的「或」是什麼意思？","opts":["有人","或者","也許","一定"],"ans":"A","steps":["代「有人」：有人問他 → 通","代「或者問」「也許問」讀起來都怪；古代「或」常是「有人」（古今異義）"],"tests":"古今異義：或","avoid":"句首的「或」，先代「有人」"},{"q":"「王子猷嘗暫寄人空宅住」的「嘗」是什麼意思？","opts":["品嘗","嘗試","曾經","常常"],"ans":"C","steps":["代「品嘗」「嘗試」：品嘗借住？嘗試借住？都讀不順","代「曾經」：曾經暫時借住別人家 → 通"],"tests":"字義：嘗","avoid":"「嘗」在動作前，先代「曾經」"},{"q":"「暫住何煩爾」是什麼意思？","opts":["暫時住在哪裡比較煩？","只是暫時住，何必這麼麻煩（種竹子）呢？","住久了會覺得煩","你為什麼一直煩我？"],"ans":"B","steps":["前句：一住進去就叫人種竹","「暫住」對比「種竹」：只住一下卻大費功夫","「何煩爾」＝何必這麼麻煩"],"tests":"句意","avoid":"問話要接前一句的事來翻"},{"q":"王子猷把竹子稱作「此君」，表示什麼？","opts":["他不知道竹子的名字","他想把竹子送人","竹子長得像人","他把竹子當成像好朋友一樣，一天都離不開"],"ans":"D","steps":["「君」是對人的尊稱，卻用在竹子上","「何可一日無此君」：怎麼可以一天沒有它","表示他非常喜愛竹子，像離不開的朋友"],"tests":"寫法：把物當人","avoid":"把東西叫成「君」，表示很尊重喜愛"}]},{"label":"第五篇","title":"謝公夫人教兒","text":["謝公夫人教兒，問太傅：「那得初不見君教兒？」答曰：「我常自教兒。」"],"cite":"《世說新語．德行》","notes":"謝公：謝安　太傅：官名，這裡指謝安　君：您，夫人對謝安的稱呼","trans":"謝安的夫人在教兒子，問謝太傅說：「怎麼從來沒看到您教兒子？」謝安回答：「我一直都在用自己的言行教兒子啊。」","qs":[{"q":"「那得初不見君教兒」的「那得」是什麼意思？","opts":["那邊","那裡得到","得到那個","怎麼"],"ans":"D","steps":["句尾是問號，夫人在問謝安","「那」同「哪」，代「怎麼」：怎麼從來沒看到您教兒子？→ 通"],"tests":"字義：那得","avoid":"問句開頭的「那得」，先代「怎麼」"},{"q":"「初不見君教兒」的「初」是什麼意思？","opts":["從來、一直","第一次","初級","剛開始"],"ans":"A","steps":["代「第一次」：怎麼第一次沒看到您教兒子？不合，夫人是在抱怨一直沒看到","代「從來」：怎麼從來沒看到您教兒子 → 合（一字多義）"],"tests":"一字多義：初","avoid":"代回後，想想說話的人的心情"},{"q":"「我常自教兒」的「自」是什麼意思？","opts":["自從","自然","自己、親身","從某個地方"],"ans":"C","steps":["代「自己」：我常常自己（用言行）教兒子 → 通","「自從教兒」「自然教兒」都讀不通"],"tests":"一字多義：自","avoid":"「自」在動作前，先代「自己」"},{"q":"謝安的回答，說明了哪一種教育方法？","opts":["孩子要讓媽媽教","父母用自己的言行當榜樣，就是在教孩子","教孩子要常常罵","不用教，孩子自己會長大"],"ans":"B","steps":["夫人看不到謝安「教」，謝安卻說「我常自教兒」","表示他平常的言行就是在教 → 以身作則","「孩子自己會長大」弄錯了「自」：是父母自己，不是孩子自己"],"tests":"主旨：身教","avoid":"從回答反推他的意思"}]}]},{"no":"第 5 組","title":"兩個月的投籃命中率","skill":"兩張表比一比：跨表比較","steps":["❶ 看表頭：單位是什麼","❷ 分清楚哪幾列是表一、哪幾列是表二","❸ 同一項目的兩個數字配對，相減看變多還是變少","❹ 總人數不同時，改比「占多少」","❺ 表上沒有的原因、未來，不能當證據"],"demo":{"q":"十月和十一月，兩分球的命中率差多少？","a":["→ 材料：十月・兩分球 50；十一月・兩分球 55（單位：%）","→ 同一項目配對相減：55－50＝5","答：十一月比十月高 5（單位是 %）"]},"parts":[{"label":"第一篇","title":"兩個月的投籃命中率","text":["阿哲每個月測一次投籃，三種投法各投 20 球。表中前三列是十月，後三列是十一月。阿哲說：「十一月我每一種都進步了！」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["月份・投法","命中率（%）"],"per":5,"unit":"%","data":[["十月・罰球",60],["十月・兩分球",50],["十月・三分球",25],["十一月・罰球",75],["十一月・兩分球",55],["十一月・三分球",20]],"qs":[{"q":"和十月比，十一月哪一種投法進步最多？","opts":["兩分球","罰球","三分球","三種一樣多"],"ans":"B","steps":["配對相減：罰球 75－60＝15；兩分球 55－50＝5；三分球 20－25＝－5","15 最大 → 罰球進步最多"],"tests":"跨表相減","avoid":"同一項目先配對，再相減"},{"q":"阿哲說「十一月我每一種都進步了」，對嗎？","opts":["對，三種都進步","對，只是進步很少","表格看不出來","不對，三分球從 25 降到 20，退步了"],"ans":"D","steps":["三分球：十月 25、十一月 20","20 比 25 小 → 退步；「每一種」是絕對字，一項不符就錯"],"tests":"圖文對讀＋絕對字","avoid":"「每一種」要全部檢查"},{"q":"十一月罰球投 20 球，投進了幾球？","opts":["15 球","75 球","12 球","16 球"],"ans":"A","steps":["十一月罰球命中率 75%","20×75÷100＝15","檢查：15÷20＝0.75 → 75%"],"tests":"百分率換算","avoid":"算完倒回去檢查一次"},{"q":"下列哪一個說法有表格證據？","opts":["十二月三分球會更差","十一月阿哲練得比較多","兩個月都是罰球命中率最高","兩分球兩個月一樣"],"ans":"C","steps":["十月：60、50、25 → 罰球最高；十一月：75、55、20 → 罰球最高","「十二月會更差」「練得比較多」表裡沒有資料；兩分球是 50 和 55，不一樣"],"tests":"推論範圍","avoid":"表裡沒有的事，不能當證據"}]},{"label":"第二篇","title":"兩班下課最常玩的遊戲","text":["學校調查六年甲班（30 人）和乙班（20 人）下課最常玩什麼，每人選一項。表中前四列是甲班，後四列是乙班。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["班級・遊戲","人數（人）"],"per":1,"unit":"人","data":[["甲班・籃球",12],["甲班・躲避球",9],["甲班・跳繩",6],["甲班・其他",3],["乙班・籃球",10],["乙班・躲避球",4],["乙班・跳繩",4],["乙班・其他",2]],"qs":[{"q":"甲班選籃球的人，比乙班多幾人？","opts":["2 人","22 人","3 人","10 人"],"ans":"A","steps":["甲班籃球 12 人，乙班籃球 10 人","12－10＝2"],"tests":"跨表相減","avoid":"先找到兩個要比的數字"},{"q":"哪一班選籃球的人，占全班的比例比較高？","opts":["甲班，因為人數比較多","兩班一樣","乙班","表格看不出來"],"ans":"C","steps":["甲班：12÷30＝0.4（五分之二）","乙班：10÷20＝0.5（二分之一）","0.5 比 0.4 大 → 乙班比例比較高"],"tests":"比例比較","avoid":"兩班人數不同，要比「占多少」"},{"q":"兩班合起來，選躲避球的一共有幾人？","opts":["9 人","13 人","5 人","4 人"],"ans":"B","steps":["甲班躲避球 9 人，乙班躲避球 4 人","9＋4＝13"],"tests":"跨表相加","avoid":"兩張表的同一項加起來"},{"q":"小明說：「乙班選跳繩的人比較少，所以乙班比甲班更不喜歡跳繩。」這個說法哪裡有問題？","opts":["沒有問題，4 比 6 少","乙班其實選跳繩的人比較多","表格沒有跳繩的資料","兩班人數不同；換成比例，甲班 6÷30、乙班 4÷20 都是五分之一，一樣多"],"ans":"D","steps":["甲班：6÷30＝0.2；乙班：4÷20＝0.2","比例一樣，不能說乙班更不喜歡"],"tests":"比例陷阱","avoid":"人數不同時，先換成比例再下結論"}]},{"label":"第三篇","title":"兩場比賽的各節得分","text":["校隊兩場比賽的各節得分，表中前四列是第一場，後四列是第二場。教練說：「第一場我們後勁不足，第二場越打越好。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["場次・節次","得分（分）"],"per":2,"unit":"分","data":[["第一場・第一節",10],["第一場・第二節",8],["第一場・第三節",12],["第一場・第四節",6],["第二場・第一節",7],["第二場・第二節",9],["第二場・第三節",10],["第二場・第四節",14]],"qs":[{"q":"哪一場總分比較高？高幾分？","opts":["第一場，高 4 分","兩場一樣","第二場，高 2 分","第二場，高 4 分"],"ans":"D","steps":["第一場：10＋8＋12＋6＝36","第二場：7＋9＋10＋14＝40","40－36＝4 → 第二場高 4 分"],"tests":"跨表加總比較","avoid":"兩場各自加完，再相減"},{"q":"教練說「第一場後勁不足」，哪一個數字最能當證據？","opts":["第一場第四節只得 6 分，是八節裡最低","第一場第一節得 10 分","第二場第四節得 14 分","第一場第三節得 12 分"],"ans":"A","steps":["後勁不足＝比賽最後沒力","第一場最後一節（第四節）只有 6 分，是全部八節最低 → 證據"],"tests":"圖文對讀","avoid":"先把說法翻成要找的數字"},{"q":"兩場比賽中，哪一節的得分差距最大？","opts":["第一節","第二節","第四節","第三節"],"ans":"C","steps":["第一節 10、7 差 3；第二節 8、9 差 1","第三節 12、10 差 2；第四節 6、14 差 8 → 第四節最大"],"tests":"跨表配對比較","avoid":"同一節配對，一節一節算"},{"q":"下列哪一個說法「沒有」表格證據？","opts":["第二場每一節都比前一節得分多","第二場的對手比較弱","第一場第三節是第一場得分最多的一節","兩場的第二節得分只差 1 分"],"ans":"B","steps":["第二場 7、9、10、14 一直變多 → 有證據；第一場第三節 12 最多 → 有；第二節 9－8＝1 → 有","表裡沒有對手的資料 → 「對手比較弱」沒有證據"],"tests":"推論範圍","avoid":"問「沒有證據」，把有證據的一個個刪掉"}]},{"label":"第四篇","title":"小豆兩個月的散步時間","text":["媽媽記錄柴犬小豆十月和十一月每天平均的散步時間，分成早上和傍晚。表中前兩列是十月，後兩列是十一月。媽媽說：「十一月早上太冷了，所以早上散步變短。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["月份・時段","每天平均散步（分鐘）"],"per":5,"unit":"分鐘","data":[["十月・早上",30],["十月・傍晚",40],["十一月・早上",20],["十一月・傍晚",45]],"qs":[{"q":"十月時，小豆每天平均一共散步幾分鐘？","opts":["65 分鐘","40 分鐘","70 分鐘","75 分鐘"],"ans":"C","steps":["十月早上 30、傍晚 40","30＋40＝70"],"tests":"同表加總","avoid":"先確定是哪一個月的兩列"},{"q":"和十月比，十一月哪一個時段的散步時間減少了？少幾分鐘？","opts":["傍晚，少 5 分鐘","早上，少 10 分鐘","早上，少 20 分鐘","兩個時段都減少"],"ans":"B","steps":["早上：30 → 20，少 10","傍晚：40 → 45，多 5，沒有減少"],"tests":"跨表相減","avoid":"變多變少，方向要看清楚"},{"q":"十一月每天平均的總散步時間，和十月比起來怎樣？","opts":["多 5 分鐘","一樣","少 10 分鐘","少 5 分鐘"],"ans":"D","steps":["十月：30＋40＝70；十一月：20＋45＝65","70－65＝5 → 少 5 分鐘"],"tests":"跨表總數比較","avoid":"總數要各自加完再比"},{"q":"媽媽說「十一月早上太冷了，所以早上散步變短」，表格能證明什麼？","opts":["只能證明早上散步變短；「太冷」這個原因表格看不出來","兩件事都能證明","兩件事都不能證明","只能證明天氣變冷"],"ans":"A","steps":["表格：早上 30 → 20，變短 → 能證明","表格只有時間，沒有氣溫 → 原因不能證明"],"tests":"圖文對讀","avoid":"「因為、所以」的原因要另外找證據"}]},{"label":"第五篇","title":"兩次段考成績","text":["阿凱把兩次段考的成績做成表，表中前四列是第一次，後四列是第二次。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["次數・科目","分數（分）"],"per":5,"unit":"分","data":[["第一次・國語",85],["第一次・數學",92],["第一次・英語",80],["第一次・自然",88],["第二次・國語",90],["第二次・數學",88],["第二次・英語",86],["第二次・自然",88]],"qs":[{"q":"哪一科進步最多？","opts":["國語","數學","自然","英語"],"ans":"D","steps":["國語 90－85＝5；英語 86－80＝6","數學退步、自然一樣 → 英語進步最多"],"tests":"跨表相減","avoid":"每一科都算，不要只看大的數字"},{"q":"哪一科退步了？","opts":["國語","英語","數學","自然"],"ans":"C","steps":["數學：92 → 88，少 4 分","國語、英語變多，自然一樣"],"tests":"跨表比較","avoid":"看清楚是變大還是變小"},{"q":"第二次四科總分，比第一次多幾分？","opts":["7 分","5 分","10 分","3 分"],"ans":"A","steps":["第一次：85＋92＋80＋88＝345","第二次：90＋88＋86＋88＝352","352－345＝7"],"tests":"總數比較","avoid":"也可以把各科的差相加檢查"},{"q":"下列哪一個說法正確？","opts":["每一科都進步了","自然兩次的分數一樣","兩次都是數學最高分","第三次英語一定會超過 90 分"],"ans":"B","steps":["自然：88、88 → 一樣，正確","數學退步，「每一科都進步」錯；第二次最高是國語 90，「兩次都是數學最高」錯；表上沒有第三次，不能預測"],"tests":"推論範圍","avoid":"「每一科、一定」要特別檢查"}]}]},{"no":"週末關卡","title":"天時不如地利","skill":"《孟子》綜合（字義五招＋虛詞＋比喻說理）","steps":["❶ 先找孟子的比喻：拿什麼比什麼","❷ 字義五招：組詞代回，再看情節驗證","❸ 虛詞路標：之、其、而、以","❹ 形容詞當動詞：後面接「之、其」要小心","❺ 結論常在「故……」「是……也」"],"demo":{"q":"「天時不如地利」的「不如」是什麼意思？","a":["→ 材料：「天時不如地利，地利不如人和。」","→ 代回「比不上」：好天時比不上好地形 → 通","→ 後文用「環而攻之而不勝」證明 → 天時確實比不上地利","答：比不上"]},"parts":[{"label":"第一篇","title":"天時不如地利","text":["孟子曰：「天時不如地利，地利不如人和。三里之城，七里之郭，環而攻之而不勝。夫環而攻之，必有得天時者矣；然而不勝者，是天時不如地利也。城非不高也，池非不深也，兵革非不堅利也，米粟非不多也；委而去之，是地利不如人和也。」"],"cite":"《孟子．公孫丑下》（節選）","notes":"天時：有利的時機和天氣　地利：有利的地形　人和：人心團結　郭：外城　環：包圍　兵革：兵器和盔甲　米粟：糧食　委：丟棄","trans":"孟子說：「有利的天時比不上有利的地形，有利的地形比不上人心團結。一座方圓三里的內城，七里的外城，包圍起來攻打它，卻打不下來。既然包圍攻打，一定有遇上好天時的時候；可是還是打不下來，這就是天時比不上地利。城牆不是不高，護城河不是不深，兵器盔甲不是不堅固鋒利，糧食不是不多；守城的人卻丟下城離開了，這就是地利比不上人和。」","qs":[{"q":"「池非不深也」的「池」是什麼意思？","opts":["游泳池","護城河","魚池","下水道"],"ans":"B","steps":["組詞「城池」（城牆和護城河），代回「護城河不是不深」→ 通","對稱句「城非不高也」：城和池放在一起，都是守城用的；游泳池、魚池不合守城情節（古今異義）"],"tests":"古今異義：池","avoid":"用對稱句和情節驗證"},{"q":"「委而去之」的「去」是什麼意思？","opts":["前往","去除","過去","離開"],"ans":"D","steps":["組詞「離去」，代回「丟下城離開了」→ 通","看情節：城、糧食都很好，守城的人卻不守了 → 離開（古今異義）；代「前往」：丟下城前往它？不通"],"tests":"古今異義：去","avoid":"看到「去」，先想「離開」"},{"q":"「環而攻之而不勝」的兩個「而」，意思是什麼？","opts":["都是「然後」","都是「卻」","第一個是「然後」，第二個是「卻」","第一個是「卻」，第二個是「然後」"],"ans":"C","steps":["包圍然後攻打 → 前後順，第一個＝然後","攻打了卻打不下來 → 前後相反，第二個＝卻"],"tests":"虛詞：而","avoid":"每個「而」都要各看前後"},{"q":"孟子說城牆高、護城河深、兵器好、糧食多，最後還是「委而去之」，是要證明什麼？","opts":["地利不如人和","天時不如地利","城牆越高越好","糧食最重要"],"ans":"A","steps":["這些證據都在講地形和設備（地利）很好","卻還是丟下城離開 → 人心不團結","句尾就說了：「是地利不如人和也」"],"tests":"論點和證據","avoid":"孟子的結論常在「是……也」"}]},{"label":"第二篇","title":"一暴十寒","text":["孟子曰：「無或乎王之不智也。雖有天下易生之物也，一日暴之，十日寒之，未有能生者也。吾見亦罕矣，吾退而寒之者至矣，吾如有萌焉何哉？」"],"cite":"《孟子．告子上》（節選）","notes":"或：同「惑」，奇怪　王：指齊王　易生：容易生長　萌：萌芽，比喻齊王心中剛冒出的一點好念頭","trans":"孟子說：「不要奇怪齊王不聰明。就算是天下最容易生長的植物，曬它一天，又凍它十天，也沒有能夠長得好的。我見齊王的次數也太少了，我一離開，那些讓他心冷的人就來了，他心裡就算冒出一點好的萌芽，我又能怎麼樣呢？」","qs":[{"q":"「一日暴之」的「暴」是什麼意思？","opts":["曬","兇暴","暴風雨","突然"],"ans":"A","steps":["組詞「暴曬」，代回「曬它一天」→ 通","對稱句「十日寒之」（凍它十天）：曬對凍，合"],"tests":"字義：暴＝曬","avoid":"對稱句可以幫忙確認"},{"q":"「十日寒之」的「寒」怎麼用？","opts":["形容詞：天氣很冷","名詞：寒假","當動詞：讓它受凍","害怕得發抖"],"ans":"C","steps":["「寒」後面接「之」（它）","形容詞後面接「之」，變成動作：讓它冷、讓它受凍"],"tests":"詞類活用：寒","avoid":"形容詞＋之，常當動作讀"},{"q":"「吾見亦罕矣」的「罕」是什麼意思？","opts":["很多","很久","很早","很少"],"ans":"D","steps":["組詞「罕見」，代回「我見齊王的次數也太少了」→ 通","後句「吾退而寒之者至矣」：我一走，別人就來 → 見得少，合"],"tests":"字義：罕","avoid":"組詞後用下一句驗證"},{"q":"孟子用「一日暴之，十日寒之」比喻什麼？","opts":["植物要多曬太陽","齊王的好念頭像植物，孟子陪他太少、別人影響太多，好念頭長不起來","齊王很喜歡種花","孟子很怕冷"],"ans":"B","steps":["植物曬一天凍十天，長不好","孟子說「吾見亦罕」「寒之者至矣」→ 自己見得少，別人影響多","所以齊王心中的萌芽長不大"],"tests":"比喻說理","avoid":"比喻後面一定接著說真正的事"}]},{"label":"第三篇","title":"緣木求魚","text":["曰：「然則王之所大欲可知已：欲辟土地，朝秦楚，莅中國而撫四夷也。以若所為，求若所欲，猶緣木而求魚也。」王曰：「若是其甚與？」曰：「殆有甚焉。緣木求魚，雖不得魚，無後災；以若所為，求若所欲，盡心力而為之，後必有災。」"],"cite":"《孟子．梁惠王上》（節選）","notes":"曰：孟子說　然則：那麼　王：指齊宣王　辟：開闢　莅：治理、統治　中國：中原地區　撫：安撫　四夷：四方的外族　若：你的、這樣　所為：做法，指用武力打仗　甚：嚴重","trans":"孟子說：「那麼大王最大的願望就可以知道了：想要擴張土地，讓秦國、楚國來朝見，統治中原，安撫四方的外族。用您這樣的做法，追求您這樣的願望，就好像爬到樹上去抓魚一樣。」齊宣王說：「真的有這麼嚴重嗎？」孟子說：「恐怕比這更嚴重。爬樹抓魚，雖然抓不到魚，但不會有後來的災禍；用您這樣的做法，追求您這樣的願望，用盡心力去做，後來一定會有災禍。」","qs":[{"q":"「猶緣木而求魚也」的「緣」是什麼意思？","opts":["因為","緣分","邊緣","攀爬"],"ans":"D","steps":["組詞「攀緣」，代回「爬到樹上找魚」→ 方法用錯，合比喻","代「因為」：因為樹而找魚？不通；和〈題西林壁〉「只緣身在此山中」的緣（因為）不同 → 一字多義"],"tests":"一字多義：緣","avoid":"同一個字，每次都要重新代回"},{"q":"「朝秦楚」的「朝」是什麼意思？","opts":["讓秦國、楚國來朝見","早上","朝代","朝向"],"ans":"A","steps":["前後文：齊王想擴張土地、統治中原","代「讓秦楚來朝見（臣服）」→ 合他的願望；「早上秦楚」「朝代秦楚」都讀不通"],"tests":"字義：朝","avoid":"代回後，看合不合人物的願望"},{"q":"「殆有甚焉」的「殆」是什麼意思？","opts":["危險","恐怕、大概","疲倦","全部"],"ans":"B","steps":["代「恐怕」：恐怕比這更嚴重 → 通","第 4 週「思而不學則殆」的殆是危險；這裡代「危險有甚焉」不通 → 一字多義"],"tests":"一字多義：殆","avoid":"學過的字也要重新代回"},{"q":"孟子為什麼說用武力達成願望，比緣木求魚還嚴重？","opts":["爬樹抓魚比打仗還危險","魚比土地更珍貴","爬樹抓魚只是抓不到，打仗不但得不到，還一定會有災禍","齊王不會爬樹"],"ans":"C","steps":["證據：「緣木求魚，雖不得魚，無後災」","對照：「盡心力而為之，後必有災」","一個只是失敗，一個還會惹禍 → 更嚴重"],"tests":"比較推論","avoid":"把兩件事的結果並排比"}]},{"label":"第四篇","title":"舜發於畎畝之中","text":["舜發於畎畝之中，傅說舉於版築之間，膠鬲舉於魚鹽之中，管夷吾舉於士，孫叔敖舉於海，百里奚舉於市。故天將降大任於是人也，必先苦其心志，勞其筋骨，餓其體膚，空乏其身，行拂亂其所為，所以動心忍性，曾益其所不能。"],"cite":"《孟子．告子下》（節選）","notes":"發：被起用　畎畝：田地　傅說、膠鬲、管夷吾、孫叔敖、百里奚：古代的賢臣　版築：築土牆的工作　士：獄官　空乏：窮困缺乏　拂亂：違背、擾亂　動心忍性：使內心警惕、性格堅忍　曾：同「增」","trans":"舜從田地裡被起用，傅說從築牆的工作中被提拔，膠鬲從賣魚賣鹽的人中被提拔，管夷吾從獄官手中被釋放並提拔，孫叔敖從海邊被提拔，百里奚從市場裡被提拔。所以上天將要把重大的責任交給這個人，一定先使他的內心痛苦，使他的筋骨勞累，使他的身體挨餓，使他窮困缺乏，使他做的事總是不順利，用這些來讓他的內心警惕、性格堅忍，增加他原本做不到的能力。","qs":[{"q":"「傅說舉於版築之間」的「舉」是什麼意思？","opts":["舉手","舉重","被推舉、提拔","舉例"],"ans":"C","steps":["組詞「舉薦」，代回「傅說從築牆的工作中被提拔」→ 通","驗證：和第一句「舜發於畎畝之中」句型一樣，都是從低下的地方被起用"],"tests":"字義：對稱句","avoid":"句子結構一樣，字義也相近"},{"q":"「天將降大任於是人也」的「是」是什麼意思？","opts":["是的","這","正確","就是"],"ans":"B","steps":["代「這」：上天要把大任交給這個人 → 通","「是的人」「正確人」都讀不通"],"tests":"字義：是＝這","avoid":"「是」在名詞前，先代「這」"},{"q":"「必先苦其心志」的「苦」怎麼用？","opts":["當動詞：使他的心志受苦","形容詞：味道很苦","名詞：苦瓜","表示很努力"],"ans":"A","steps":["「苦」後面接「其心志」（他的心志）","形容詞後面接東西，變成動作：使……受苦","後面「勞其筋骨」「餓其體膚」也是同樣用法"],"tests":"詞類活用：苦","avoid":"形容詞後面接「其、之」，當動作讀"},{"q":"孟子先列出舜、傅說等六個人，作用是什麼？","opts":["介紹古代的職業","說明賢臣都很窮","證明當官要先種田","舉例證明：成大事的人都先經過困苦磨練"],"ans":"D","steps":["六個人都是從困苦的地方被提拔","後面用「故」接結論：「天將降大任於是人也……」","前面的人物，就是證明結論的例子"],"tests":"舉例說理","avoid":"「故」前面常是例子，後面是結論"}]},{"label":"第五篇","title":"魚我所欲也","text":["魚，我所欲也；熊掌，亦我所欲也；二者不可得兼，舍魚而取熊掌者也。生，亦我所欲也；義，亦我所欲也；二者不可得兼，舍生而取義者也。生亦我所欲，所欲有甚於生者，故不為苟得也；死亦我所惡，所惡有甚於死者，故患有所不辟也。"],"cite":"《孟子．告子上》（節選）","notes":"熊掌：熊的腳掌，古代珍貴的食物　舍：捨棄　義：正義，該做的對的事　苟得：不擇手段地得到，指苟且偷生　患：災禍　辟：同「避」，躲避","trans":"魚是我想要的，熊掌也是我想要的；兩樣不能同時得到，我就捨棄魚而選熊掌。生命是我想要的，義也是我想要的；兩樣不能同時得到，我就捨棄生命而選擇義。生命是我想要的，但我想要的東西有比生命更重要的，所以不做苟且偷生的事；死亡是我討厭的，但我討厭的東西有比死亡更嚴重的，所以有些災禍我不躲避。","qs":[{"q":"「二者不可得兼」的「兼」是什麼意思？","opts":["兼職","一起吃","同時得到","交換"],"ans":"C","steps":["組詞「兼顧」，代回「兩樣不能同時得到」→ 通","後句「舍魚而取熊掌」：只能選一樣，驗證"],"tests":"字義：兼","avoid":"組詞後，看後句有沒有說明"},{"q":"「死亦我所惡」的「惡」是什麼意思？","opts":["壞人","兇惡","噁心想吐","討厭"],"ans":"D","steps":["組詞「厭惡」，代回「死亡也是我討厭的」→ 通","對稱句：「生亦我所欲」，生對死、欲（想要）對惡 → 和想要相反，驗證"],"tests":"一字多義：惡","avoid":"用對稱句找相反的字"},{"q":"孟子先講魚和熊掌，再講生和義，這樣寫有什麼作用？","opts":["用大家熟悉的選擇作比喻，引出「捨生取義」","說明熊掌比魚好吃","教人怎麼做菜","說明魚和生命一樣重要"],"ans":"A","steps":["前段魚和熊掌：兩樣都想要，選更珍貴的","後段生和義：用同樣的句型","先講簡單的例子，再推到真正要說的道理"],"tests":"寫法：比喻說理","avoid":"句型一樣的兩段，前面常是比喻"},{"q":"「所欲有甚於生者」，孟子說比生命更想要的是什麼？","opts":["熊掌","義","魚","長壽"],"ans":"B","steps":["前文：「舍生而取義者也」","生命和義只能選一個時，他選義 → 比生命更想要的是義"],"tests":"找證據","avoid":"答案常在前一句就說過"}]}]}],"teach":[{"intro":"第 2 期第一關：四個最常見的虛詞「之、其、而、以」，看位置就能猜出意思。","items":[{"t":"「之」有三種常見意思","d":["名詞＋之＋名詞＝的；動作＋之＝他、它；之＋地方＝往。","「遊於濠梁之上」＝濠梁的上面；「王巾笥而藏之」＝收藏牠（神龜）。"],"ex":"就像「球」字：投球、球隊、球鞋，放的位置不同，意思就不同。"},{"t":"「其」＝他的、它","d":["「其」通常往前找人或東西，再加上「的」。","「使人問其故」→ 前面在哭的是和氏 → 問和氏哭的原因。"],"ex":"隊友喊「他的球！」你要先看清楚「他」是誰。"},{"t":"「而」看前後是順還是反","d":["前後順著發生＝然後；前後意思相反＝卻。","「泣盡而繼之以血」＝哭乾了，接著流血；「寶玉而題之以石」＝是寶玉，卻被叫石頭。"],"ex":"傳球「然後」上籃是順；想投籃「卻」被蓋火鍋是反。"},{"t":"「以」先代「用、拿」","d":["以＝用、拿、把；「以為」＝認為；放在結果前面，可以是「因此」。","「願以境內累矣」＝希望拿國內的事來麻煩您。"]}],"demo":["材料：「王聞之，使人問其故。」","之：「聞」是動作，動作＋之＝這件事（和氏在哭）","其：往前找在哭的人 → 和氏的；問其故＝問和氏哭的原因"]},{"intro":"第二關：唐詩裡的三種修辭——譬喻、誇飾、對偶。找到它們，就看得到詩裡的畫面。","items":[{"t":"什麼是「譬喻」？","d":["把甲說成像乙，因為兩者有相像的地方。常見提示字：比、如、像、疑是。","「欲把西湖比西子」：把西湖比成美女西施；「疑是銀河落九天」：把瀑布比成銀河。"],"ex":"說「小豆跑起來像一顆咖啡色的球」，就是譬喻。"},{"t":"什麼是「誇飾」？","d":["故意說得比真實更大、更多，讓人印象深刻。","「飛流直下三千尺」：瀑布不會真的有三千尺高。"],"ex":"「我餓到可以吃下一整座山」，就是誇飾。"},{"t":"什麼是「對偶」？","d":["兩句字數相同，詞語一個對一個，意思也相對。","「水光瀲灩晴方好，山色空濛雨亦奇」：水光對山色、晴對雨、方好對亦奇。"],"ex":"像一對一防守：你的控衛對我的控衛，你的中鋒對我的中鋒。"}],"demo":["材料：「水光瀲灩晴方好，山色空濛雨亦奇。」","① 字數：七個字對七個字","② 一對一：水光↔山色，晴↔雨，方好↔亦奇 → 都對得上","答：對偶"]},{"intro":"第三關：互文對讀第三彈。這次多問一個問題：乙文的例子，是照著甲文做，還是剛好相反？","items":[{"t":"先把甲文翻成白話","d":["《論語》句子短，先一個字一個字翻成白話，再去乙文找同樣的意思。","「君子欲訥於言，而敏於行」＝說話要謹慎，做事要勤快。"]},{"t":"乙文是「正例」還是「反例」？","d":["正例：乙文的人照著甲文做；反例：乙文的人剛好做相反的事。","阿宏話少卻把線畫好＝正例；小傑說很多卻沒做＝反例。"],"ex":"像看比賽重播：哪一球是教練要的動作，哪一球是不要的動作。"},{"t":"連線找對應","d":["乙文的人物、事件，一個一個和甲文的句子連線。","「下定決心要進校隊」↔「志于學」；「不會被弄得一頭霧水」↔「不惑」。"]}],"demo":["材料：甲「君子欲訥於言，而敏於行」；乙「小傑在班會上大聲說：『我負責借球、排賽程、找裁判！』結果比賽前一天，什麼都還沒做。」","甲：話要少、做要多","乙：小傑話很多、事沒做 → 跟甲相反","答：小傑是反例"]},{"intro":"第四關：讀《世說新語》，抓出「同一個字換意思」和「古今意思不一樣」的字。","items":[{"t":"一字多義：先組詞，代回去試","d":["同一個字，在不同句子裡意思不同。先組詞，代回原句讀讀看。","「饒子」的「子」＝果實，不是兒子；「初不見君教兒」的「初」＝從來，不是第一次。"]},{"t":"古今異義：用人物動作驗證","d":["有些字現在的意思和古代不一樣，代回去後一定要看人物在做什麼，再確認一次。","「謝玄淮上信至」：信到了，接著謝安「看書」→ 來的是送信的人，「書」才是信。"],"ex":"就像「機車」本來只是摩托車，現在也拿來說人難搞：時代變了，意思也會變。"},{"t":"字義五招的順序","d":["① 組詞代回 → ② 看人物動作目的驗證 → ③ 看部首 → ④ 比對稱句 → ⑤ 想成語（備用）。","至少兩招指向同一個答案，才算確定。"]}],"demo":["材料：「有人遺其雙鶴，少時翅長欲飛。」","① 組詞「遺失」代回：有人弄丟他的鶴？但後面鶴還在支公身邊 → 不合","② 換「送」：有人送他一對鶴，後面支公養鶴、捨不得牠飛走 → 合","答：遺＝送給"]},{"intro":"第五關：兩張表比一比。一次看兩組數字，要比得公平。","items":[{"t":"先分清楚哪一列是哪一張表","d":["表格前半是表一，後半是表二。先把同一個項目的兩個數字配對寫出來。","罰球：十月 60、十一月 75 → 差 15。"],"ex":"像比較兩場比賽：同一個球員的得分放在一起比。"},{"t":"人數不同，要比比例","d":["兩班人數不一樣時，不能只比人數，要算「占全班多少」。","甲班 30 人有 12 人選籃球（五分之二），乙班 20 人有 10 人（二分之一）→ 乙班比例比較高。"]},{"t":"表裡沒有的，不能當證據","d":["原因、以後會怎樣，表格通常看不出來。","「十一月練得比較多」：表裡沒有練習次數 → 不能選。"],"ex":"就像裁判看重播：畫面上看得到的才算數。"}],"demo":["材料：十月罰球 60、兩分球 50、三分球 25；十一月罰球 75、兩分球 55、三分球 20（單位：%）","配對相減：罰球 75－60＝15，兩分球 55－50＝5，三分球 20－25＝－5","答：罰球進步最多，三分球退步"]},{"intro":"週末關卡：讀《孟子》。孟子很會說服人，常常先比喻、再說道理，這週學過的招式全部用上。","items":[{"t":"孟子怎麼說服人？先比喻，再說道理","d":["「緣木求魚」：用爬樹抓魚，比喻方法用錯了，永遠達不到目的。","「一暴十寒」：植物曬一天、凍十天，比喻做事斷斷續續不會成功。"],"ex":"就像教練說：「一週只練一天，另外六天都在玩，球技不會進步。」"},{"t":"古今異義大集合","d":["池＝護城河、去＝離開、所以＝用來。","代回後看情節：「城非不高也，池非不深也」，城和池都是守城的設施 → 池＝護城河。"]},{"t":"形容詞當動詞（複習）","d":["「苦其心志」：苦後面接「其心志」，苦就變成動作＝使他的心志受苦。","「十日寒之」：寒＋之＝讓它受凍。"]}],"demo":["材料：「一日暴之，十日寒之，未有能生者也。」","暴：組詞「暴曬」→ 曬它一天","寒＋之：形容詞當動詞 → 讓它凍十天","道理：做事斷斷續續，再容易生長的植物也長不好"]}],"daily":[{"words":[["顧","回頭看","義無反顧"],["寧","寧可","寧死不屈"]],"line":"子非魚，安知魚之樂？"},{"words":[["疑","好像、讓人以為","半信半疑"],["緣","因為","緣故"]],"line":"不識廬山真面目，只緣身在此山中。"},{"words":[["訥","說話謹慎、不輕易開口","木訥"],["敏","勤快、敏捷","敏捷"]],"line":"三軍可奪帥也，匹夫不可奪志也。"},{"words":[["徐","慢慢地","徐徐前進"],["遺","送給","饋遺"]],"line":"何可一日無此君？"},{"words":[["暴","曬","一暴十寒"],["兼","同時得到","魚與熊掌不可得兼"]],"line":"天時不如地利，地利不如人和。"},null],"quiz":{"words":[["顧","回頭看","莊子持竿不顧"],["寧","寧可","寧其生而曳尾於塗中乎"],["疑","好像、讓人以為","疑是銀河落九天"],["緣","因為","只緣身在此山中"],["訥","說話謹慎、不輕易開口","君子欲訥於言"],["敏","勤快、敏捷","而敏於行"],["徐","慢慢地","默然無言，徐向局"],["遺","送給","有人遺其雙鶴"],["暴","曬","一日暴之，十日寒之"],["兼","同時得到","二者不可得兼"]],"lines":[["子非魚，","安知魚之樂？"],["不識廬山真面目，","只緣身在此山中。"],["三軍可奪帥也，","匹夫不可奪志也。"],["何可一日","無此君？"],["天時不如地利，","地利不如人和。"]],"parts":[{"label":"第一篇","title":"楊震暮夜卻金","text":["當之郡，道經昌邑，故所舉荊州茂才王密為昌邑令，謁見，至夜懷金十斤以遺震。震曰：「故人知君，君不知故人，何也？」密曰：「暮夜無知者。」震曰：
