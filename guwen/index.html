「天知，神知，我知，子知。何謂無知！」密愧而出。"],"cite":"《後漢書．楊震傳》（節選）","notes":"郡：指東萊郡，楊震被派去當太守　昌邑：地名　故所舉：楊震從前推薦過的　茂才：被推薦做官的優秀人才　令：縣令　謁見：拜見","trans":"楊震要前往東萊郡上任，路過昌邑。他從前推薦過的荊州茂才王密，當時正擔任昌邑縣令，前來拜見楊震。到了晚上，王密懷裡揣著十斤金子，要送給楊震。楊震說：「我這個老朋友了解你，你卻不了解我這個老朋友，這是為什麼呢？」王密說：「現在是夜裡，沒有人會知道。」楊震說：「天知道，神知道，我知道，你知道。怎麼能說沒有人知道！」王密很慚愧地離開了。","qs":[{"q":"「當之郡」的「之」是什麼意思？","opts":["的","他","往","這"],"ans":"C","steps":["「之」後面接「郡」，是一個地方","地方前面的「之」＝往 → 楊震要前往東萊郡"],"tests":"虛詞：之＝往","avoid":"「之」後面接地方，就是「往」"},{"q":"「懷金十斤以遺震」的「遺」是什麼意思？","opts":["送給","遺失","遺留","遺忘"],"ans":"A","steps":["代「送給」：懷裡帶著金子要送給楊震 → 通","後面楊震拒絕、王密慚愧，都在說送禮的事"],"tests":"古今異義：遺","avoid":"和〈支公好鶴〉的「遺」比一比"},{"q":"楊震說「故人知君，君不知故人」，「故人」指誰？","opts":["王密","荊州的百姓","皇帝","楊震自己"],"ans":"D","steps":["「故人」＝老朋友；王密是楊震從前推薦的人","楊震說：老朋友（我）了解你，你卻不了解我","所以「故人」是楊震在說自己"],"tests":"對話題：稱呼指誰","avoid":"對話裡的稱呼，看是誰在說"},{"q":"楊震說「天知，神知，我知，子知」，想告訴王密什麼？","opts":["晚上不能出門","做不對的事，就算沒有別人看見，也不可能沒人知道","神明會保佑他們","只要沒人看見就沒關係"],"ans":"B","steps":["王密說：「暮夜無知者」（晚上沒人知道）","楊震反駁：天、神、我、你都知道","意思：不能因為沒人看見就做不對的事"],"tests":"對話推論","avoid":"先看他在反駁哪一句"},{"q":"「密愧而出」，王密為什麼慚愧？","opts":["他想偷偷送金子，被楊震拒絕又點醒","他忘了帶金子","楊震罵他太窮","他被楊震趕出去"],"ans":"A","steps":["王密晚上懷金，想偷偷送給楊震","楊震用「天知，神知……」拒絕，並說出道理","王密明白自己錯了 → 慚愧離開"],"tests":"因果推論","avoid":"把前後的事連成一條線"}]},{"label":"第二篇","title":"趙襄主學御","cite":"《韓非子．喻老》（節選）","text":["趙襄主學御於王子期，俄而與於期逐，三易馬而三後。襄主曰：「子之教我御，術未盡也。」對曰：「術已盡，用之則過也。凡御之所貴，馬體安於車，人心調於馬，而後可以進速致遠。今君後則欲逮臣，先則恐逮於臣。夫誘道爭遠，非先則後也。而先後心皆在於臣，上何以調於馬？此君之所以後也。」"],"notes":"趙襄主：趙襄子，春秋末年晉國的大夫　御：駕馬車　王子期：很會駕車的人，也叫「於期」　俄而：不久　逐：比賽追逐　術：技術、方法　過：毛病、錯誤　調：協調、配合　進速致遠：跑得快、到得遠　誘道爭遠：在路上駕車比遠","trans":"趙襄子向王子期學駕馬車，不久就和王子期比賽追逐，換了三次馬，三次都落後。趙襄子說：「你教我駕車，技術還沒有全部教完。」王子期回答：「技術已經全部教完了，是您用的時候出了毛病。凡是駕車，最重要的是：馬的身體和車子配合得安穩，人的心思和馬協調一致，然後才能跑得快、到得遠。現在您落後時就想追上我，領先時又怕被我追上。在路上駕車比遠，不是領先就是落後；可是您不管領先還是落後，心思都放在我身上，又怎麼能和馬協調呢？這就是您落後的原因。」","qs":[{"q":"「三易馬而三後」的「易」是什麼意思？","opts":["容易","更換","簡單","貿易"],"ans":"B","steps":["組詞「交易」「易手」（換人擁有），代回「換了三次馬，三次都落後」→ 通","看人物動作：襄主一直輸，以為是馬不好，才一直換馬 → 合情節；「容易馬」「簡單馬」都讀不通"],"tests":"字義：易","avoid":"先組詞代回，再看人物在做什麼"},{"q":"襄主說「子之教我御，術未盡也」，他的意思是什麼？","opts":["你教我駕車，還有技術沒教給我","你的馬已經跑不動了","我已經學會全部的技術","你自己駕車的技術不好"],"ans":"A","steps":["「子」＝你；「術未盡」＝技術還沒有教完","前文：他換了三次馬還是三次落後 → 他懷疑老師留了一手","王子期接著回答「術已盡」，正好在反駁這句話"],"tests":"句意理解","avoid":"看下一句的回答，就知道上一句問什麼"},{"q":"「今君後則欲逮臣」的「逮」是什麼意思？","opts":["逮捕","等待","超過","追上"],"ans":"D","steps":["組詞「逮捕」代回：「落後時就想抓我」→ 這是駕車比賽，不合情節","換組詞「力有未逮」（力量趕不上）：逮＝趕上、追上；代回「落後時就想追上我」→ 合","驗證：後半「先則恐逮於臣」＝領先時怕被我追上，前後都通"],"tests":"字義：逮","avoid":"組詞不通時，換一個詞再代回"},{"q":"王子期認為，襄主輸的真正原因是什麼？","opts":["馬不夠好，換了也沒用","技術還沒有學完","心思都放在對手身上，沒有和馬協調","比賽的路太遠了"],"ans":"C","steps":["證據：「先後心皆在於臣，上何以調於馬」","不管領先落後，心都在王子期身上 → 沒辦法和馬協調","「術已盡」排除「技術沒學完」；換了三次馬都輸，表示問題不在馬"],"tests":"推論原因","avoid":"找「所以後也」前面那一句"},{"q":"「此君之所以後也」的「所以」是什麼意思？","opts":["因此","……的原因","所以然","用來"],"ans":"B","steps":["代現代的「因此」：「這就因此您落後」→ 讀不通","代「……的原因」：「這就是您落後的原因」→ 通","驗證：王子期前面一直在解釋為什麼會輸，最後一句是總結原因（古今異義）"],"tests":"古今異義：所以","avoid":"現代意思代回不通，就換古代意思"}]}]},"cap":{"no":"會考實戰","title":"第 6 週會考實戰","skill":"會考解題技法：同字比一比","steps":["❶ 圈出四個句子裡相同的字或詞","❷ 每一句都把那個字代回白話，讀讀看通不通","❸ 看它的位置和詞性：放在動作前、動作後，還是當名詞","❹ 挑出意思不一樣的那一個；只剩兩個時看人物的目的","❺ 字音字形逐字唸、組成詞；成語拆字看本義和對象"],"demo":{"q":"示範題：【112 年會考第 4 題】下列文句，何者語詞使用最恰當？①你到底看見了什麼？豈非這樣驚訝　②並非我與他相識，這件事絕不可能善罷甘休　③你所說的無非是老生常談，他哪裡聽得進去　④若非我故意和你唱反調，實在是你的做法不合理","a":["→ 圈出共同的字：豈非、並非、無非、若非，四句都有「非」","→ 各自代回白話：豈非＝難道不是；並非＝並不是；無非＝只不過是；若非＝如果不是","→ ①「難道不是這樣驚訝」不通；②「並不是我和他認識，事情絕不會善罷甘休」不通，應該用「若非」","→ ④「如果不是我故意唱反調，實在是你不對」不通，應該用「並非」；②和④剛好互換","→ ③「你說的只不過是老生常談」通順","答：③"]},"teach":{"intro":"會考很愛把同一個字放進四個句子，考你分不分得出它們的不同，這招就是把每個字都代回去比一比。","items":[{"t":"什麼是「同字比一比」？","d":["題目四個句子裡有同一個字，要你找出意思不一樣的，或用得對的那個","例：「之」在「視之若子」指仇鸞，在「格之」卻指嚴嵩"],"ex":"像球隊裡兩個人都叫「小明」，要看他站哪個位置、穿幾號球衣，才知道是哪一個"},{"t":"什麼是「詞性」和「位置」？","d":["詞性就是這個字當名詞（東西）、動詞（動作）還是形容詞（樣子）","同一個字放在動作前面、後面，意思常常不一樣，例：「好」放在動作前常是「喜歡」"],"ex":"柴犬聽到「坐」是動作，看到「坐墊」是東西，同一個字，位置不同意思就不同"},{"t":"字音字形怎麼判斷？","d":["長得像的字，聲旁一樣不代表讀音一樣，要一個一個唸出來","同音字要組成詞想意思，例：里程「碑」是石碑，不是獎盃的「盃」"],"ex":"兩隻柴犬長得很像，名字不一定一樣，要叫叫看才知道"},{"t":"成語怎麼判斷？","d":["先拆字看本來的意思，再看句子需要稱讚還是批評","例：「急公好義」是熱心幫大家，不能拿來形容莽撞"],"ex":"籃球的「助攻」是稱讚傳球好，不能拿來說你把球傳給對手"}],"demo":["① 圈：四句都有「非」","② 代：豈非＝難道不是、並非＝並不是、無非＝只不過是、若非＝如果不是","③ 比：只有「無非是老生常談」讀得通，答案就是它"]},"parts":[{"label":"第一篇","title":"112 年會考 第 5、6、11 題","text":[],"cite":"112 年國中教育會考國文科 第 5、6、11 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列選項「」中的字，何組讀音相同？","opts":["「迄」今未成／「屹」立不搖","金鑲玉「嵌」／命運「坎」坷","寂「寥」冷清／「謬」誤百出","千叮萬「囑」／引人「矚」目"],"ans":"D","steps":["同字比一比用在字音：每組兩字長得像，但聲旁一樣不代表讀音一樣，要一個一個唸出來","迄ㄑㄧˋ、屹ㄧˋ；嵌ㄑㄧㄢ、坎ㄎㄢˇ；寥ㄌㄧㄠˊ、謬ㄇㄧㄡˋ，這三組都不同","囑、矚都唸ㄓㄨˇ，只有「千叮萬囑／引人矚目」讀音相同"],"tests":"形近字讀音","avoid":"聲旁相同別直接猜同音，逐字唸出來"},{"q":"「齒」的甲骨文字形是□□字，看起來像張口見齒的樣子。小篆字形在上部增加了「止」字，用「止」表示聲音，至此變成了□□字。這段文字的空格處，依序應填入何種造字原則？","opts":["象形／會意","指事／形聲","象形／形聲","指事／會意"],"ans":"C","steps":["找關鍵句：甲骨文「看起來像張口見齒的樣子」，照著東西的樣子畫 → 象形","小篆加了「止」，而且「用『止』表示聲音」，一半表意思、一半表聲音 → 形聲","依序是象形、形聲，選「象形／形聲」"],"tests":"六書造字原則","avoid":"看到「表示聲音」就想到形聲"},{"q":"下列文句，何者用字完全正確？","opts":["大考將近，更要懂得善用索碎的時間","來到默生的環境不免會令人感到緊張","我忘了帶錢，拜託你先幫我代墊報名費","這項工程是讓我國邁向現代化的里程盃"],"ans":"C","steps":["同音字比一比：把每個詞組回正確的詞，看字的意思合不合","「索碎」應為「瑣碎」（細小的事）；「默生」應為「陌生」（陌是不認識）；「里程盃」應為「里程碑」（立在路邊的石碑）","「代墊」是替人先付錢，用字正確，所以選第三個選項"],"tests":"同音別字","avoid":"想字的意思：碑是石頭，盃是杯子"}]},{"label":"第二篇","title":"112 年會考 第 2、14 題","text":[],"cite":"112 年國中教育會考國文科 第 2、14 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列文句何者有語病？","opts":["他不但才華出眾，而且和藹可親","幸虧你事先做好準備，否則災情慘重","原來他有難言之隱，難怪總是愁眉不展","與其讓你在事後落淚，難道讓你犯錯懊悔"],"ans":"D","steps":["先讀題幹最後：問「有語病」，要找錯的那句","關聯詞要成對：不但……而且、幸虧……否則、原來……難怪都配得好","「與其……」後面要接「不如」，接「難道」就配錯了，所以最後一個選項有語病"],"tests":"關聯詞搭配","avoid":"背熟成對的詞：與其配不如"},{"q":"下列文句「」中的詞語，何者使用最恰當？","opts":["寵物一生病就丟棄的人，真是「若即若離」","他缺乏耐性，總是「急公好義」，莽莽撞撞","經過這次教訓後，他「幡然悔悟」，痛改前非","期末將近，大家都「庸庸碌碌」，忙得不可開交"],"ans":"C","steps":["成語判斷法：拆字看本義，再看句子要的是好話還是壞話","若即若離是不親也不遠，不是無情；急公好義是熱心公益，不是莽撞；庸庸碌碌是平凡沒作為，不是忙碌","幡然悔悟是很快徹底醒悟，配「痛改前非」剛好，選第三個選項"],"tests":"成語意義","avoid":"拆字看本義，別只看字面像不像"}]},{"label":"第三篇","title":"112 年會考 第 12 題","text":[],"cite":"112 年國中教育會考國文科 第 12 題（國家教育研究院心測中心）","notes":"右：職官名，立君主之右，擔任保衛工作　致：禮讓","trans":"少室周擔任趙簡子的車右（站在車子右邊保護主人的人），聽說牛談力氣很大，請求和他比試，結果比輸了，就把車右的職位讓給牛談。趙簡子答應了，派少室周去當家宰，說：「知道別人比自己賢能就讓位，這種做法可以讓大家拿來學習了。」","qs":[{"q":"「少室周為趙簡子之右，聞牛談有力，請與之競，弗勝，致右焉。簡子許之，使少室周為宰，曰：『知賢而讓，可以為訓矣。』」根據文意脈絡，下列何者最適合用來說明「訓」字的意義？","opts":["典範","順從","教誨","解釋"],"ans":"A","steps":["第一招組詞代回：「訓」可以組「教訓」「家訓」，代回「可以為訓」，「可以成為教誨」「可以成為典範」好像都說得通，「順從」「解釋」代回不通","兩個都像對，換招看人物動作目的：少室周比輸就把職位讓給更強的牛談，簡子還升他的官，是要大家學他","讓別人學習的榜樣就是「典範」，選第一個選項"],"tests":"文言字義：訓","avoid":"兩個都像對時，看人物做這件事的目的"}]},{"label":"第四篇","title":"112 年會考 第 13 題","text":[],"cite":"112 年國中教育會考國文科 第 13 題（國家教育研究院心測中心）","notes":"輦：古時用人拉著走的車　梁：橋","trans":"茲鄭拉著車子要上高橋，卻拉不上去。茲鄭就靠在車轅上唱起歌來，前面的行人停下腳步，後面的人快步趕來，大家一起幫忙，車子才拉上橋。如果茲鄭沒有讓別人來幫忙的方法，那麼就算他用盡力氣累死，車子還是拉不上去。現在他自己沒有很勞累，車子卻拉上去了，是因為他有讓別人來幫忙的方法。","qs":[{"q":"「茲鄭引輦上高梁而不能支。茲鄭倚轅而歌，前者止，後者趨，輦乃上。使茲鄭無術以致人，則身雖絕力至死，輦猶不上也。今身不至勞苦而輦以上者，有術以致人之故也。」這段文字的主旨最可能是下列何者？","opts":["團結就是力量","做事要講究方法","堅持到底才能成功","沒有付出就沒有收穫"],"ans":"B","steps":["找重複出現的字：「術」出現兩次，「無術」拉不上去，「有術」就上去了；術＝方法","茲鄭自己沒有用盡力氣（身不至勞苦），而是唱歌讓路人來幫忙，所以重點不是苦撐或付出","車能上橋是因為「有術以致人」，主旨是做事要講究方法"],"tests":"文言主旨","avoid":"主旨常藏在重複出現的那個字"}]},{"label":"第五篇","title":"112 年會考 第 16、23 題","text":[],"cite":"112 年國中教育會考國文科 第 16、23 題（國家教育研究院心測中心）","notes":"逸：奔跑","trans":"第 16 題：天下有反覆改變的小人，也有反覆改變的君子。人們只知道不反覆就不能成為小人，哪裡知道不反覆也不能成為君子。小人的反覆，是跟著風氣和權勢利益往哪裡去而改變；君子的反覆，是因為學問見識一層一層累積進步而改變。他們反覆的樣子相同，反覆的原因卻不同。　第 23 題：從前讀書人大多喜歡用對偶句寫文章，穆脩、張景這些人開始寫不講對偶的平文，當時稱為古文。穆脩、張景曾經一起去上朝，正好看見一匹狂奔的馬踩死一隻狗，兩人各自把這件事記下來。穆脩寫：「馬奔跑，有一隻黃狗碰到馬蹄就死了。」張景寫：「有狗死在奔馬底下。」當時文體剛開始改變，兩人的句子其實都笨拙不流暢，當時的人卻已經說寫得好，一直流傳到今天。","qs":[{"q":"「蓋天下有反覆之小人，亦有反覆之君子。人但知不反覆不足以為小人，庸知不反覆亦不足以為君子。蓋小人之反覆也，因風氣勢利之所歸，以為變動；君子之反覆也，因學識之層累疊進，以為變動。其反覆同，其所以為反覆者不同。」根據這段文字，作者認為「不反覆亦不足以為君子」的原因，最可能是下列何者？","opts":["小人若洗心革面，一反前非即可成為君子","為應對小人反覆，不得不改變既有的策略","順應民心的向背，選擇最適合現況的做法","隨著所知的增長，會修正自己原本的觀點"],"ans":"D","steps":["同詞比一比：小人、君子都「反覆」，但文末說「其所以為反覆者不同」，要比原因","小人是跟著勢利改變；君子是「因學識之層累疊進」，學問一層一層增加才改變","學到更多就修正想法，就是最後一個選項"],"tests":"比較同詞的原因","avoid":"同一個詞出現兩次，比它後面的原因"},{"q":"往歲士人多尚對偶為文，穆脩、張景輩始為平文，當時謂之古文。穆、張嘗同造朝，適見有奔馬踐死一犬，二人各記其事。穆脩曰：「馬逸，有黃犬遇蹄而斃。」張景曰：「有犬死奔馬之下。」時文體新變，二人之語皆拙澀，當時已謂之工，傳之至今。根據這段文字，關於穆脩、張景針對奔馬踐死一犬的記事，下列敘述何者最恰當？","opts":["穆脩記事只著眼於犬","張景記事只著眼於馬","二人用語崇尚句式對偶","二人用語皆為時人稱頌"],"ans":"D","steps":["回原文核對：穆脩寫了「馬逸」也寫了「黃犬」；張景寫了「犬」也寫了「奔馬」，前兩個選項都錯","他們寫的是「平文」，和當時流行的「對偶」相反，第三個選項錯","「當時已謂之工」，工＝寫得好，表示被當時的人稱讚，選最後一個選項"],"tests":"文言細節核對","avoid":"選項說「只」，回原文看是不是真的只有"}]},{"label":"第六篇","title":"112 年會考 第 10、22、24 題","text":[],"cite":"112 年國中教育會考國文科 第 10、22、24 題（國家教育研究院心測中心）","notes":"","trans":"第 10 題：夏天七月，紅紅的太陽停在天上，沒有風也沒有雲。前後院子熱得像大火爐，沒有一隻鳥敢飛來。全身流汗，汗水橫的直的流成小水溝。飯擺在面前，熱得吃不下。叫人拿竹蓆想躺在地上，地面卻濕得像油膏，蒼蠅又飛來爬在脖子上、停在鼻子上，趕也趕不走。正在無可奈何的時候，忽然傳來急雨嘩啦啦的聲音，像幾百萬面鑼鼓一起響。屋簷流下的水比瀑布還大。身上的汗一下子收乾，地面乾得像掃過一樣，蒼蠅全都飛走，飯也吃得下了。這不是很痛快嗎！　第 22 題：又往北走，走在石頭裂縫中，石峰一片片從兩旁夾著聳起，小路在石頭間彎彎曲曲。堵住的地方就鑿開，陡的地方就鑿成臺階，斷掉的地方就架木頭接通，懸空的地方就立梯子接上。往下看，陡峭的山谷陰暗幽深，楓樹和松樹交錯，五種顏色紛紛散開，燦爛得像圖畫和刺繡。於是想到黃山應當是我這一生看過最奇特的風景，卻還有奇特到這種程度的地方，以前竟然沒來探訪過，這次遊覽既暢快又慚愧啊！　第 24 題：錢塘江的石堤被大浪衝擊，每年都被沖壞。杜偉長擔任轉運使時，有人獻上意見，主張從浙江稅場往東，把堤往後退幾里，築成彎月形的堤，來避開兇猛的江水。水工們都認為很好，只有一個老水工認為不行，偷偷告訴他的同伴：「堤一移走，每年就沒有水災了，我們靠什麼吃飯穿衣？」大家喜歡這個好處，就跟著附和他。杜偉長沒看穿他們的計謀，花了巨大的費用，江堤的災害還是年年發生。","qs":[{"q":"「夏七月，赤日停天，亦無風，亦無雲。前後庭赫然如洪爐，無一鳥敢來飛。汗出遍身，縱橫成渠。置飯於前，不可得吃。呼簟欲臥地上，則地濕如膏，蒼蠅又來緣頸附鼻，驅之不去。正莫可如何，忽然疾澍澎湃之聲，如數百萬金鼓。簷溜浩於瀑布。身汗頓收，地燥如掃，蒼蠅盡去，飯便得吃。不亦快哉！」根據這段文字，作者心情轉變的關鍵最可能是下列何者？","opts":["發現美麗的景致","遠離擾人的蟲蠅","聽見悅耳的鼓聲","驟降消暑的大雨"],"ans":"D","steps":["找轉折詞：「正莫可如何，忽然……」，「忽然」後面就是轉變的關鍵","「疾澍澎湃之聲」是大雨，「如數百萬金鼓」只是比喻雨聲，不是真的鼓；蒼蠅離開是下雨之後的結果","所以關鍵是突然下的消暑大雨"],"tests":"找轉折關鍵","avoid":"「如」後面是比喻，不是真的東西"},{"q":"「復北上，行石罅中，石峰片片夾起，路宛轉石間，塞者鑿之，陡者級之，斷者架木通之，懸者植梯接之。下瞰峭壑陰森，楓松相間，五色紛披，燦若圖繡。因念黃山當生平奇覽，而有奇若此，前未一探，茲遊快且愧矣！」根據這段文字，下列敘述何者最恰當？","opts":["作者對自己破壞自然環境感到慚愧","黃山片片石峰色彩繽紛，有如織錦","作者北上舊地重遊，乃因懷念黃山冬季美景","此遊窺得黃山奇景，作者心中因而喜愧交集"],"ans":"D","steps":["圈關鍵詞「快且愧」：快＝暢快高興，愧＝慚愧，兩種心情一起出現","愧的原因是「前未一探」（以前沒來看過），不是破壞環境；五色紛披的是「楓松」，不是石峰","看到奇景又高興又慚愧，選最後一個選項"],"tests":"文言情感與細節","avoid":"選項主詞要核對：是石峰還是楓松"},{"q":"「錢塘江石堤為洪濤所激，歲歲摧決。杜偉長為轉運使，人有獻說，自浙江稅場以東，移退數里為月堤，以避怒水。眾水工皆以為善，獨一老水工以為不然，密諭其黨：『移堤則歲無水患，吾等何所衣食？』眾人樂其利，乃從而和之。偉長不悟其計，費以巨萬，而江堤之害仍歲有之。」根據這段文字，下列敘述何者最恰當？","opts":["月堤耗時過久，使杜偉長浪費公帑","水工們為保生計，阻礙了移堤工程","老水工深知修築月堤無益於防堵水患","杜偉長堅持移堤，導致年年發生水患"],"ans":"B","steps":["找證據句：老水工說「移堤則歲無水患，吾等何所衣食？」他知道移堤有用，只是怕沒工作","「眾人樂其利，乃從而和之」，大家為了自己的好處一起反對，杜偉長沒看穿，堤沒移成","所以是水工為保生計阻礙移堤；杜偉長並沒有堅持移堤"],"tests":"文言因果推論","avoid":"看人物說的話，找出他真正的目的"}]},{"label":"第七篇","title":"112 年會考 第 15、20 題","text":[],"cite":"112 年國中教育會考國文科 第 15、20 題（國家教育研究院心測中心）","notes":"","trans":"第 15 題：甲：花因為天冷懶得開，鳥也懶得叫，我騎著馬隨意慢慢走，走到太陽偏西。哪裡還沒到春天就先有了春天的情思？是魏王堤上柔弱無力的柳條。乙：彎彎的溪邊綠樹濃密交錯，小雨把浮萍沖上淺淺的沙灘。鵝和鴨不知道春天已經結束了，爭著跟隨流水去追逐落下的桃花。　第 20 題：世上的事就像一場大夢，人生能經歷幾次初秋的涼意？夜裡風吹樹葉，在走廊上沙沙作響，看看我的眉頭和兩鬢（已經有白髮）。酒很便宜，卻常常愁沒有客人一起喝；月亮明亮，卻常常被雲遮住。中秋夜有誰和我一起欣賞這孤單的月光？我端著酒杯，悲傷地望向北方。","qs":[{"q":"甲：花寒懶發鳥慵啼，信馬閑行到日西。何處未春先有思？柳條無力魏王堤。——白居易〈魏王堤〉　乙：陰陰溪曲綠交加，小雨翻萍上淺沙。鵝鴨不知春去盡，爭隨流水趁桃花。——晁沖之〈春日〉　關於這兩首詩的分析，下列敘述何者最恰當？","opts":["甲詩描寫清晨春寒料峭的景象","乙詩描寫春末溪邊所見的景致","兩詩首二句皆對仗，表達情思","兩詩皆屬七絕，只有偶句用韻"],"ans":"B","steps":["甲詩「到日西」是傍晚，不是清晨；乙詩「春去盡」是春末，「溪曲」「淺沙」是溪邊，第二個選項對","甲詩首二句「花寒懶發鳥慵啼／信馬閑行到日西」字詞不成對，不是對仗","押韻：甲詩啼、西、堤，乙詩加、沙、花，第一句也押韻，所以「只有偶句用韻」錯"],"tests":"詩的時間與格律","avoid":"找時間詞：日西是傍晚，春去盡是春末"},{"q":"蘇軾〈西江月〉：「世事一場大夢，人生幾度新涼？夜來風葉已鳴廊，看取眉頭鬢上。　　酒賤常愁客少，月明多被雲妨。中秋誰與共孤光，把盞淒然北望。」下列關於詞句的說明，何者⟦最不恰當⟧？","opts":["「看取眉頭鬢上」表達自己年華老去","「酒賤常愁客少」意謂難以維持生計","「月明多被雲妨」比喻美好的事物不可能長久","「中秋誰與共孤光」流露想與親友團聚的心願"],"ans":"B","steps":["題目問「最不恰當」，要找說錯的那個","「酒賤常愁客少」：酒很便宜，卻愁沒有朋友一起喝，是孤單，不是賺不到錢","其他三個都對得上：鬢上白髮是變老、月被雲遮是好景不長、誰與共是想念親人"],"tests":"詞句意涵","avoid":"古詩的「愁」多半是心情，不是錢"}]},{"label":"第八篇","title":"112 年會考 第 39～40 題（題組）","text":["大將軍仇鸞，始為曾銑所劾，欲倚嚴嵩以抗曾銑，故約為父子。已而鸞得帝重，嵩猶視之若子，遂浸相惡。嵩密疏毀鸞，帝不聽，而頗納鸞所陳嵩父子過，少疏之。嵩當入值，不召者數矣。嵩見徐階、李本入西內，即與俱入。至西華門，門者以非詔旨格之。嵩還第，父子對泣。時陸炳掌錦衣，與鸞爭寵，嵩乃結炳共圖鸞。會鸞病死，炳訐鸞陰事，帝追戮之。於是益信任嵩，遣所乘龍舟過海子召嵩，載值西內如故。","—— 改寫自《明史．奸臣》"],"cite":"112 年國中教育會考國文科 第 39～40 題（國家教育研究院心測中心）","notes":"內：宮廷","trans":"大將軍仇鸞，起初被曾銑彈劾，想依靠嚴嵩來對抗曾銑，所以和嚴嵩約定結為父子。後來仇鸞受到皇帝重用，嚴嵩仍然把他當兒子看待，兩人於是漸漸互相厭惡。嚴嵩祕密上奏詆毀仇鸞，皇帝不聽，反而頗採納仇鸞所說的嚴嵩父子的過錯，稍稍疏遠嚴嵩。嚴嵩應當入宮值班，卻好幾次沒有被召見。嚴嵩看見徐階、李本進入西邊的宮廷，就跟著一起進去。到了西華門，守門的人以沒有皇帝的命令為理由擋住他。嚴嵩回到家，和兒子相對哭泣。當時陸炳掌管錦衣衛，和仇鸞爭奪皇帝的寵信，嚴嵩就聯合陸炳一起對付仇鸞。剛好仇鸞病死，陸炳揭發仇鸞暗中做的壞事，皇帝追加懲處，戮他的屍體。從此皇帝更加信任嚴嵩，派自己乘坐的龍舟渡過海子去召嚴嵩，載他到西邊宮廷值班，像從前一樣。","qs":[{"q":"根據本文，下列何者最可能是仇鸞與嚴嵩一開始交惡的原因？","opts":["嚴嵩私下上奏，詆毀仇鸞","嚴嵩與曾銑結盟，疏遠仇鸞","仇鸞向皇帝稟告嚴嵩父子的罪行","仇鸞權位日重，不願嚴嵩仍以子視之"],"ans":"D","steps":["題幹限定詞「一開始」：找第一次變壞的地方，就是「遂浸相惡」那一句","前面寫原因：「已而鸞得帝重，嵩猶視之若子」，仇鸞變得受重用，嚴嵩卻還把他當兒子","私下上奏、告狀都在「相惡」之後，是結果不是起因，所以選最後一個選項"],"tests":"找事件起因","avoid":"圈「一開始」，只看最早那一句"},{"q":"下列文句的解說，何者最恰當？","opts":["門者以非詔旨格之：守門者將徐階、李本擋下","嵩還第，父子對泣：嚴嵩與仇鸞兩人盡釋前嫌","炳訐鸞陰事，帝追戮之：皇帝認為陸炳毀謗死者，憤而殺之","遣所乘龍舟過海子召嵩：皇帝以高規格召回嚴嵩，以示禮遇"],"ans":"D","steps":["同字比一比：「之」在不同句子指不同人。「格之」被擋的是跟著進去的嚴嵩；「追戮之」被殺的是仇鸞，不是陸炳","「父子」也要比：前面「約為父子」是仇鸞和嚴嵩，這裡「還第，父子對泣」是回家和兒子哭，不是和仇鸞和好","皇帝派自己坐的龍舟去接，是很高的禮遇，選最後一個選項"],"tests":"代詞之指誰","avoid":"每個「之」都往前找最近的人"}]},{"label":"第九篇","title":"112 年會考 第 41～42 題（題組）","text":["楊朱見梁王，言治天下如運諸掌。梁王曰：「先生有三畝之園而不能耘，而言治天下如運諸掌，何也？」對曰：「君不見牧羊者乎？百羊而群，使五尺童子荷杖隨之，欲東而東，欲西而西。使堯牽一羊，舜荷杖隨之，則不能前矣。且臣聞之：吞舟之魚，不游支流；鴻鵠高飛，不集汙池。何則？其志遠也。黃鐘大呂不可從繁奏之舞。何則？其音疏也。將治大者不治細，成大功者不成小，此之謂矣。」","—— 改寫自《列子．楊朱》"],"cite":"112 年國中教育會考國文科 第 41～42 題（國家教育研究院心測中心）","notes":"","trans":"楊朱去見梁王，說治理天下就像在手掌上轉東西一樣容易。梁王說：「先生家裡有三畝的園子都除不好草，卻說治理天下像在手掌上轉東西一樣容易，這是為什麼？」楊朱回答：「您沒看過放羊的人嗎？一百隻羊成群，讓一個五尺高的小孩拿著竹竿跟在後面，要羊往東就往東，要往西就往西。如果讓堯牽一隻羊，舜拿著竹竿跟在後面，羊反而走不動了。而且我聽說：能吞下船的大魚，不在小支流裡游；天鵝高飛，不停在髒水池上。為什麼？因為牠們的志向遠大。黃鐘大呂這種莊重的音樂，不能拿來配節奏繁密的舞蹈。為什麼？因為它的音節舒緩。要治理大事的人不管細小的事，要成就大功業的人不做小事，說的就是這個道理。」","qs":[{"q":"根據本文，關於梁王與楊朱的敘述，下列何者最恰當？","opts":["梁王認為治理天下應重視禮樂之道","梁王質疑楊朱是否具有治理天下的能力","楊朱貶抑堯、舜，能治天下卻不能牧羊","楊朱以牧羊為例，說明治天下須從小事做起"],"ans":"B","steps":["找梁王說的話：「先生有三畝之園而不能耘，而言治天下如運諸掌，何也？」連小園子都管不好，怎麼說治天下容易","這是在懷疑楊朱的能力，第二個選項對","楊朱的結論是「治大者不治細」，和「從小事做起」相反；說堯舜不會牧羊是比喻，不是貶低"],"tests":"人物說話的用意","avoid":"看「何也」前面，就知道對方在懷疑什麼"},{"q":"下列文句，何者最能呼應文中「吞舟之魚，不游支流；鴻鵠高飛，不集汙池」的涵義？","opts":["狡兔死，良狗烹；高鳥盡，良弓藏","高飛之鳥，死於美食；深泉之魚，死於芳餌","騏驥千里，一日而達；駑馬十駕，旬亦至之","剖三寸之蚌，難得明月之珠；探枳棘之巢，難求鳳凰之雛"],"ans":"D","steps":["先翻原句：大魚不在小河、天鵝不停髒水池，意思是大的人物不會出現在小地方","對稱句比一比：小小的蚌找不到大明珠，小樹叢的巢找不到鳳凰，同樣是大東西不在小地方","其他選項在講功成被拋棄、貪吃上當、努力不懈，意思不同，選最後一個選項"],"tests":"句意呼應","avoid":"先把原句翻成白話，再找同樣的道理"}]}]}},{"week":7,"groups":[{"no":"第 1 組","title":"記承天寺夜遊","skill":"寫景抒情：找景物、找心情","steps":["❶ 先圈「景物」：月、水、竹、花、山……作者寫了哪些東西","❷ 再看景物「怎麼寫」：顏色、比喻、動或靜","❸ 圈「心情字」：欣然、樂、淒、寒、愛……","❹ 景＋情合起來：作者藉景物說出什麼心情或想法"],"demo":{"q":"「庭下如積水空明，水中藻荇交橫，蓋竹柏影也。」作者把庭院地上的月光比成什麼？","a":["→ 材料：「庭下如積水空明」，「如」＝好像，後面就是比喻的東西","→ 地上其實沒有水，是月光照得像一池清水；「藻荇」原來是竹柏的影子（蓋竹柏影也）","答：把月光比成清澈透明的積水"]},"parts":[{"label":"第一篇","title":"記承天寺夜遊","text":["元豐六年十月十二日夜，解衣欲睡，月色入戶，欣然起行。念無與為樂者，遂至承天寺尋張懷民。懷民亦未寢，相與步於中庭。庭下如積水空明，水中藻荇交橫，蓋竹柏影也。何夜無月？何處無竹柏？但少閒人如吾兩人者耳。"],"cite":"蘇軾〈記承天寺夜遊〉","notes":"元豐：宋神宗的年號　戶：門　張懷民：蘇軾的朋友　相與：一起　中庭：庭院中間　空明：清澈透明　藻荇：水草　交橫：交錯","trans":"元豐六年十月十二日夜裡，我脫了衣服正要睡覺，月光照進門裡，我高興地起身出門。想到沒有可以一起同樂的人，於是到承天寺找張懷民。懷民也還沒睡，我們一起在庭院中散步。庭院地面像一池積水，清澈透明，水中好像有水草交錯，原來是竹子和柏樹的影子。哪一個夜晚沒有月亮？哪個地方沒有竹子和柏樹？只是少了像我們兩人這樣清閒的人罷了。","qs":[{"q":"「月色入戶，欣然起行」，作者這時的心情是什麼？","opts":["睡不著覺很煩躁","看到月色很高興","一個人在家很害怕","想念遠方的家人"],"ans":"B","steps":["找心情字：「欣然」，組詞「欣喜」＝高興","前面「月色入戶」：是月光讓他起身出門","所以是看到月色很高興"],"tests":"找心情字","avoid":"先圈心情字，再找是什麼景引起的"},{"q":"作者為什麼要到承天寺找張懷民？","opts":["張懷民生病了要去探望","要到寺裡拜拜祈福","張懷民先約他晚上見面","想到沒有人可以一起欣賞月色"],"ans":"D","steps":["證據：「念無與為樂者，遂至承天寺尋張懷民」","「念」＝想到，「無與為樂者」＝沒有一起同樂的人","文中沒提生病、拜拜或事先約好"],"tests":"起因：找原因","avoid":"「遂」前面那句常常就是原因"},{"q":"「庭下如積水空明，水中藻荇交橫，蓋竹柏影也」寫的是什麼景象？","opts":["月光照在庭院，竹柏的影子像水裡的水草","庭院下雨積了水，長滿水草","寺裡有一個種滿水草的池塘","作者看著河水裡的水草"],"ans":"A","steps":["「如」積水：好像，不是真的有水","「蓋竹柏影也」：原來是竹子柏樹的影子","所以是月光和樹影造成的景象"],"tests":"寫景：比喻","avoid":"看到「如」，後面是比喻不是真的"},{"q":"最後「何夜無月？何處無竹柏？但少閒人如吾兩人者耳」，表現作者什麼想法？","opts":["黃州的月亮比別的地方更美","作者抱怨身邊的朋友太少","承天寺的竹柏比別處多","月色到處都有，只有像他們這樣的閒人才懂得欣賞"],"ans":"D","steps":["前兩句是反問：每晚都有月，到處都有竹柏","「但少閒人」：只是少了清閒的人","所以美景常有，懂得欣賞的人少"],"tests":"抒情：作者想法","avoid":"反問句要翻成肯定的意思再讀"}]},{"label":"第二篇","title":"陋室銘","text":["山不在高，有仙則名。水不在深，有龍則靈。斯是陋室，惟吾德馨。苔痕上階綠，草色入簾青。談笑有鴻儒，往來無白丁。可以調素琴，閱金經。無絲竹之亂耳，無案牘之勞形。南陽諸葛廬，西蜀子雲亭。孔子云：「何陋之有？」"],"cite":"劉禹錫〈陋室銘〉","notes":"銘：刻在器物上警惕自己的文字　名：有名　靈：神奇　斯：這　陋室：簡陋的屋子　鴻儒：大學問家　白丁：沒有學問的人　調：彈奏　素琴：沒有裝飾的琴　金經：佛經　絲竹：音樂　案牘：公文　勞形：使身體勞累　諸葛廬：諸葛亮的草屋　子雲亭：揚雄的屋子","trans":"山不在於高，有仙人住就有名；水不在於深，有龍住就神奇。這是一間簡陋的屋子，只因為我的品德美好（就不覺得簡陋）。青苔長到臺階上，一片碧綠；草色映入竹簾，一片青翠。來談笑的是大學問家，往來的沒有不學無術的人。在這裡可以彈奏樸素的琴，閱讀佛經。沒有嘈雜的音樂擾亂耳朵，沒有公文使身體勞累。它就像南陽諸葛亮的草屋、西蜀揚雄的亭子。孔子說：「有什麼簡陋的呢？」","qs":[{"q":"「惟吾德馨」的「馨」是什麼意思？","opts":["溫暖的家","安靜無聲","明亮的光","香氣，比喻品德美好"],"ans":"D","steps":["組詞「馨香」＝香氣，代回「只因我的品德芬芳」→ 通","驗證：前面「有仙則名」「有龍則靈」，都說有好東西就變好","所以屋子簡陋，但主人品德好"],"tests":"字義：馨","avoid":"組詞代回後，再看前後句驗證"},{"q":"「苔痕上階綠，草色入簾青」寫出陋室什麼樣子？","opts":["屋子髒亂，沒有人打掃","主人很窮，買不起地毯","門口種滿了紅色的花","環境清幽，到處是綠意"],"ans":"D","steps":["找景物：青苔、草色；找顏色：綠、青","作者用這兩句寫屋子環境清靜幽雅","文中說品德馨香，不是在嫌屋子髒"],"tests":"找景物：寫景","avoid":"先找顏色字，想想畫面感覺"},{"q":"開頭「山不在高，有仙則名。水不在深，有龍則靈」，和陋室有什麼關係？","opts":["用山水作比：屋子雖簡陋，有品德好的人住就不簡陋","說明作者住在高山深水旁","說明作者想去找神仙","說明山越矮、水越淺越好"],"ans":"A","steps":["山水靠仙、龍出名；陋室靠「吾德馨」","前兩句是比方，引出「斯是陋室，惟吾德馨」","所以重點是：住的人品德好最重要"],"tests":"寫法：借物說理","avoid":"開頭的比方，要找它引出哪一句"},{"q":"結尾「何陋之有？」是什麼意思？","opts":["哪裡有簡陋的屋子？","為什麼這麼簡陋？","簡陋的地方在哪裡？","有什麼簡陋的呢？（一點也不簡陋）"],"ans":"D","steps":["這是反問句，答案在相反的一面","全文說談笑有鴻儒、可以調素琴，屋子很好","所以意思是：並不簡陋"],"tests":"反問句","avoid":"反問句＝用問句說出肯定的意思"}]},{"label":"第三篇","title":"愛蓮說","text":["水陸草木之花，可愛者甚蕃。晉陶淵明獨愛菊；自李唐來，世人甚愛牡丹。予獨愛蓮之出淤泥而不染，濯清漣而不妖，中通外直，不蔓不枝，香遠益清，亭亭淨植，可遠觀而不可褻玩焉。","予謂菊，花之隱逸者也；牡丹，花之富貴者也；蓮，花之君子者也。噫！菊之愛，陶後鮮有聞；蓮之愛，同予者何人？牡丹之愛，宜乎眾矣！"],"cite":"周敦頤〈愛蓮說〉","notes":"蕃：多　李唐：唐朝（皇帝姓李）　淤泥：爛泥　濯：洗　清漣：清水的波紋　妖：過分豔麗　蔓：長藤蔓　枝：長枝節　益：更加　淨植：潔淨地挺立　褻玩：靠近玩弄　噫：唉　鮮：少　宜乎：當然","trans":"水上陸上草木的花，可愛的非常多。晉朝的陶淵明只愛菊花；從唐朝以來，世上的人很喜愛牡丹。我只喜愛蓮花：從爛泥中長出來卻不被汙染，在清水中洗過卻不顯得妖豔，莖中間通透、外面挺直，不生藤蔓、不長枝節，香氣越遠越清香，筆直潔淨地挺立著，只能遠遠觀賞而不能靠近玩弄。我認為，菊花是花中的隱士；牡丹是花中富貴的；蓮花是花中的君子。唉！喜愛菊花的，陶淵明以後很少聽說；喜愛蓮花的，和我一樣的還有誰呢？喜愛牡丹的，當然很多了！","qs":[{"q":"作者寫蓮的哪一句，表示「在不好的環境裡，也不被汙染」？","opts":["香遠益清","中通外直","出淤泥而不染","可遠觀而不可褻玩焉"],"ans":"C","steps":["「淤泥」＝爛泥，就是不好的環境","「不染」＝沒有被弄髒","其他三句寫香氣、樣子、不能靠近"],"tests":"找景物特點","avoid":"題目的關鍵詞，回原文找同義句"},{"q":"第二段中，菊、牡丹、蓮分別比喻哪一種人？","opts":["隱居的人、富貴的人、君子","君子、隱居的人、富貴的人","富貴的人、君子、隱居的人","隱居的人、君子、富貴的人"],"ans":"A","steps":["原文：「菊，花之隱逸者也」，又說陶淵明愛菊","「牡丹，花之富貴者也」「蓮，花之君子者也」","照順序對：隱士、富貴、君子"],"tests":"托物比喻","avoid":"一句一句對，不要憑印象"},{"q":"「牡丹之愛，宜乎眾矣」，作者是什麼態度？","opts":["稱讚愛牡丹的人很有眼光","感嘆世上追求富貴的人很多","表示自己也最愛牡丹","高興牡丹賣得很好"],"ans":"B","steps":["牡丹＝「花之富貴者」，愛牡丹＝愛富貴","作者說自己「獨愛蓮」，和眾人不同","所以「宜乎眾矣」是感嘆，不是稱讚"],"tests":"找作者心情","avoid":"先弄懂花代表什麼，再看作者態度"},{"q":"作者藉蓮花想表達什麼？","opts":["自己想做一個像蓮花一樣品格高潔的君子","自己想種一池蓮花","所有的花裡只有蓮花可愛","陶淵明愛菊花是錯的"],"ans":"A","steps":["第一段寫蓮的樣子：不染、不妖、直","第二段點出：蓮是「花之君子」，作者「獨愛蓮」","借物說志：作者要學蓮的品格"],"tests":"托物言志","avoid":"寫物的文章，最後要問作者自己"}]},{"label":"第四篇","title":"與宋元思書","text":["風煙俱淨，天山共色。從流飄蕩，任意東西。自富陽至桐廬一百許里，奇山異水，天下獨絕。","水皆縹碧，千丈見底。游魚細石，直視無礙。急湍甚箭，猛浪若奔。"],"cite":"吳均〈與宋元思書〉（節選）","notes":"風煙：風和煙霧　俱：都　淨：散盡　共色：同一種顏色　從流：順著江流　富陽、桐廬：地名，在今浙江　許：左右　縹碧：青白色　湍：急流　奔：飛奔的馬","trans":"風停了，煙霧也散盡，天空和山是同一種顏色。（我的船）順著江流飄蕩，任憑它向東或向西。從富陽到桐廬一百里左右，山水奇特，是天下獨一無二的。江水都是青白色，深到千丈也看得見底。游動的魚和細小的石頭，一眼看下去沒有阻礙。急流比箭還快，猛烈的浪像飛奔的馬。","qs":[{"q":"「水皆縹碧，千丈見底」寫出江水什麼特點？","opts":["又深又混濁","非常清澈","非常寒冷","流得很慢"],"ans":"B","steps":["找景物：水；看寫法：千丈深也看得見底","後一句「游魚細石，直視無礙」也能證明","所以是清澈"],"tests":"寫景特點","avoid":"兩句一起看，互相證明"},{"q":"「急湍甚箭」的「甚」是什麼意思？","opts":["勝過、超過","非常","什麼","甚至"],"ans":"A","steps":["組詞「過甚」＝超過，代回「急流超過箭」→ 通","驗證：下一句「猛浪若奔」也拿快的東西比","所以是急流比箭還快"],"tests":"字義：甚","avoid":"後面接比較的東西，常是「超過」"},{"q":"第二段寫了哪兩種水的樣子？","opts":["結冰的水，和融化的水","清澈平靜的水，和又急又猛的浪","下雨的水，和井裡的水","海水，和湖水"],"ans":"B","steps":["前兩句：縹碧、見底、魚石清楚 → 靜","後兩句：急湍、猛浪 → 動","一靜一動，寫出江水兩種樣子"],"tests":"寫景：動與靜","avoid":"把句子分組，看是靜還是動"},{"q":"「奇山異水，天下獨絕」表現作者什麼心情？","opts":["害怕水流太急","想念家鄉","讚嘆山水之美","對旅程很失望"],"ans":"C","steps":["「獨絕」＝獨一無二","作者先下這句總評，後面再細寫山水","總評是稱讚，所以是讚嘆"],"tests":"找心情","avoid":"總評的話就是作者的心情"}]},{"label":"第五篇","title":"小石潭記","text":["潭中魚可百許頭，皆若空游無所依。日光下澈，影布石上，佁然不動；俶爾遠逝，往來翕忽，似與遊者相樂。","坐潭上，四面竹樹環合，寂寥無人，淒神寒骨，悄愴幽邃。以其境過清，不可久居，乃記之而去。"],"cite":"柳宗元〈小石潭記〉（節選）","notes":"可：大約　許：左右　空游：像在空中游　依：依靠　澈：照到底　佁然：呆呆不動的樣子　俶爾：忽然　翕忽：輕快的樣子　環合：圍繞　寂寥：寂靜冷清　幽邃：幽深","trans":"潭中的魚大約有一百條，都好像在空中游，沒有什麼依靠。陽光直照到水底，魚的影子映在石頭上，呆呆地一動也不動；忽然又游向遠處，來來往往輕快敏捷，好像在和遊玩的人一起取樂。坐在潭邊，四面被竹子和樹圍繞著，寂靜冷清，沒有別人，讓人心神淒涼、寒氣透骨，感到憂傷又幽深。因為這裡環境太過清冷，不能久留，於是記下這些就離開了。","qs":[{"q":"「皆若空游無所依」寫出潭水什麼特點？","opts":["潭水很淺，魚游不動","潭裡沒有水","水非常清澈，魚好像游在空中","魚會飛到空中"],"ans":"C","steps":["「若」＝好像，不是真的在空中","下句「影布石上」：魚影清楚映在石頭上","看不到水，可見水非常清澈"],"tests":"寫景：側面描寫","avoid":"寫魚其實在寫水，要想一想"},{"q":"「似與遊者相樂」時，作者的心情是什麼？","opts":["害怕","生氣","快樂","無聊"],"ans":"C","steps":["找心情字：「相樂」","魚來來往往，好像在和作者一起玩","所以作者心情快樂"],"tests":"找心情字","avoid":"心情字常在寫景句的最後"},{"q":"第二段「淒神寒骨，悄愴幽邃」，作者的心情變成什麼？","opts":["興奮、得意","生氣、不耐煩","淒涼、憂傷","輕鬆、愉快"],"ans":"C","steps":["找心情字：淒、寒；「悄愴」組詞「悽愴」＝悲傷","景物：竹樹環合、寂寥無人，很冷清","從第一段的樂，變成淒涼"],"tests":"心情變化","avoid":"前後段的心情字放一起比"},{"q":"作者最後為什麼「乃記之而去」？","opts":["天黑了要回家吃飯","環境太清冷，不能久留","潭裡的魚都游走了","有人來趕他離開"],"ans":"B","steps":["證據：「以其境過清，不可久居」","「以」＝因為，後面就是原因","所以是因為太清冷才離開"],"tests":"因果：找原因","avoid":"看到「以」在句首，常是「因為」"}]}]},{"no":"第 2 組","title":"兒時記趣","skill":"記敘：起因經過結果＋人物描寫","steps":["❶ 找「起因」：事情為什麼開始？誰、在哪裡、發生什麼","❷ 找「經過」：中間做了哪些動作、有什麼變化","❸ 找「結果」：最後怎麼了","❹ 人物描寫：從外貌、動作、說話、心情，找出他是怎樣的人"],"demo":{"q":"「一日，見二蟲鬥草間，觀之正濃，忽有龐然大物拔山倒樹而來，蓋一癩蝦蟆也。舌一吐而二蟲盡為所吞。」這段的起因、經過是什麼？","a":["→ 起因：「見二蟲鬥草間，觀之正濃」＝作者正看兩隻蟲打架看得入迷","→ 經過：「龐然大物……蓋一癩蝦蟆也」，蝦蟆一吐舌，兩隻蟲都被吞掉","答：起因是看蟲打架，經過是蝦蟆突然出現把蟲吞了"]},"parts":[{"label":"第一篇","title":"兒時記趣","text":["余憶童稚時，能張目對日，明察秋毫。見藐小微物，必細察其紋理，故時有物外之趣。","一日，見二蟲鬥草間，觀之正濃，忽有龐然大物拔山倒樹而來，蓋一癩蝦蟆也。舌一吐而二蟲盡為所吞。余年幼，方出神，不覺呀然驚恐。神定，捉蝦蟆，鞭數十，驅之別院。"],"cite":"沈復《浮生六記．閒情記趣》（節選）","notes":"童稚：小時候　秋毫：鳥獸秋天新長的細毛，比喻極小的東西　藐小：很小　紋理：花紋　物外之趣：超出事物本身的樂趣　濃：入迷　龐然大物：巨大的東西　蓋：原來是　方：正　出神：看得入迷　呀然：驚叫的樣子　神定：心神安定下來","trans":"我回想小時候，能睜大眼睛直視太陽，能看清極細小的東西。看見細小的東西，一定仔細觀察它的花紋，所以常常有超出事物本身的樂趣。有一天，看見兩隻蟲在草叢間打鬥，我看得正入迷，忽然有一個巨大的東西像拔起山、推倒樹一樣衝過來，原來是一隻癩蝦蟆。牠舌頭一吐，兩隻蟲全被吞下去。我年紀小，正看得出神，不禁驚叫起來，很害怕。等到心神安定，就捉住蝦蟆，鞭打了幾十下，把牠趕到別的院子去。","qs":[{"q":"第二段事件的「起因」是什麼？","opts":["作者想抓癩蝦蟆來玩","作者看兩隻蟲在草間打鬥，看得入迷","蝦蟆跑進院子吃東西","作者在院子裡拔草"],"ans":"B","steps":["事件開頭：「一日，見二蟲鬥草間，觀之正濃」","後面蝦蟆出現，是在他看得入迷的時候","所以起因是看蟲打架"],"tests":"記敘：起因","avoid":"起因通常在「一日」後面那句"},{"q":"「忽有龐然大物拔山倒樹而來」，這個大東西其實是什麼？","opts":["一隻癩蝦蟆，作者看得太入神才覺得牠很巨大","一隻大象","颱風吹倒了樹","大人走過來"],"ans":"A","steps":["下一句：「蓋一癩蝦蟆也」，蓋＝原來是","作者正「方出神」盯著小蟲看，從小蟲的眼光看，蝦蟆就像拔山倒樹的巨獸","不是真的有巨獸或颱風"],"tests":"細節：看下一句","avoid":"誇張的描寫，下一句常有答案"},{"q":"這件事的「結果」是什麼？","opts":["蝦蟆把作者也嚇跑了","兩隻蟲打贏了蝦蟆","作者捉住蝦蟆，鞭打幾十下，趕到別的院子","作者把蝦蟆養在家裡"],"ans":"C","steps":["最後一句：「神定，捉蝦蟆，鞭數十，驅之別院」","驅＝趕走，別院＝別的院子","所以結果是把蝦蟆打了一頓再趕走"],"tests":"記敘：結果","avoid":"結果常在最後一句"},{"q":"從第一段看，作者小時候是一個怎樣的孩子？","opts":["膽子很大，什麼都不怕","不喜歡小動物","觀察仔細，很有想像力","眼睛不好，看不清楚"],"ans":"C","steps":["證據：「見藐小微物，必細察其紋理」→ 觀察仔細","「故時有物外之趣」→ 會想像出樂趣","第二段「呀然驚恐」，可見不是什麼都不怕"],"tests":"人物描寫","avoid":"性格要用原文句子當證據"}]},{"label":"第二篇","title":"五柳先生傳","text":["先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，因以為號焉。","好讀書，不求甚解；每有會意，便欣然忘食。性嗜酒，家貧不能常得。親舊知其如此，或置酒而招之；造飲輒盡，期在必醉；既醉而退，曾不吝情去留。環堵蕭然，不蔽風日；短褐穿結，簞瓢屢空，晏如也。"],"cite":"陶淵明〈五柳先生傳〉（節選）","notes":"何許：哪裡　詳：清楚知道　姓字：姓和字　號：別號　會意：領會書中的意思　嗜：愛好　親舊：親戚朋友　或：有時　置：準備　造：到　輒：就　期：希望　吝情：捨不得　環堵：四面的牆　蕭然：空蕩蕩的樣子　短褐：粗布短衣　穿結：破了又補　簞瓢：盛飯的竹器和舀水的瓢","trans":"五柳先生不知道是哪裡人，也不清楚他的姓和字。屋子旁邊有五棵柳樹，就用「五柳」當作別號。他喜歡讀書，不在字句上鑽牛角尖；每當領會了書中的意思，就高興得忘了吃飯。他天性愛喝酒，可是家裡窮，不能常常喝到。親戚朋友知道他這樣，有時準備了酒請他去；他去喝就一定喝光，希望一定喝醉；喝醉了就回家，從不捨不得離開。家裡四面牆空蕩蕩的，擋不住風和太陽；穿的粗布短衣破了又補，飯籃和水瓢常常是空的，他卻很安然自在。","qs":[{"q":"「每有會意，便欣然忘食」表現五柳先生什麼？","opts":["吃飯的時候也在讀書","讀書讀到懂的地方，快樂得忘了吃飯","家裡太窮沒有飯吃","讀書讀到忘記回家"],"ans":"B","steps":["會意＝領會書中的意思","「欣然忘食」：高興得忘記吃飯","所以表現他讀書的快樂"],"tests":"人物描寫：動作","avoid":"把「因為什麼」和「結果怎樣」連起來"},{"q":"「既醉而退，曾不吝情去留」表現五柳先生什麼性格？","opts":["很小氣，捨不得請客","愛喝酒，賴著不肯走","怕得罪人，不敢拒絕","率真直爽，喝醉就走，不講客套"],"ans":"D","steps":["證據：喝醉了「退」＝回家","「曾不吝情去留」＝從不在意去或留","可見他做事坦率，不做作"],"tests":"人物描寫：性格","avoid":"找動作，再想動作背後的性格"},{"q":"「環堵蕭然……簞瓢屢空，晏如也」，最後的「晏如」是什麼意思？","opts":["很晚才回家","安然自在","非常傷心","請客吃飯"],"ans":"B","steps":["組詞「晏然自若」＝安閒，代回「他卻很安閒的樣子」→ 通","驗證：前面寫家裡空蕩、衣破、常沒飯吃，他仍快樂讀書、喝酒","所以「晏如」＝安然自在，不是傷心"],"tests":"字義：看情境","avoid":"組詞不通，就看人物前後的表現"},{"q":"這篇節選主要用什麼方法寫五柳先生？","opts":["寫他讀書、喝酒、生活的言行，表現他安貧樂道","寫他的外貌長相","寫他的家世和官位","寫他和別人吵架的經過"],"ans":"A","steps":["文中寫：好讀書、性嗜酒、環堵蕭然","連姓名都「不詳」，更沒寫外貌或官位","所以是從生活言行寫出性格"],"tests":"人物描寫方法","avoid":"先列出文章寫了哪幾件事"}]},{"label":"第三篇","title":"送東陽馬生序","text":["余幼時即嗜學。家貧，無從致書以觀，每假借於藏書之家，手自筆錄，計日以還。天大寒，硯冰堅，手指不可屈伸，弗之怠。錄畢，走送之，不敢稍逾約。以是人多以書假余，余因得遍觀群書。"],"cite":"宋濂〈送東陽馬生序〉（節選）","notes":"嗜學：愛好讀書　無從：沒有辦法　致：得到　筆錄：抄寫　計日：約定日子　硯：磨墨的硯臺　逾約：超過約定的日期　以是：因此　遍：全部","trans":"我小時候就愛讀書。家裡窮，沒有辦法得到書來讀，常常向藏書的人家借，親手抄寫，約定日子歸還。天氣非常冷，硯臺裡的墨水結成硬冰，手指凍得不能彎曲伸直，我也不敢偷懶。抄完了，就跑著把書送回去，不敢超過約定的日期一點點。因此很多人願意把書借給我，我也因此能讀遍許多書。","qs":[{"q":"作者為什麼要「手自筆錄」，自己抄書？（起因）","opts":["家裡窮，買不到書，只能向人借來抄","老師規定要抄書","他想練習寫毛筆字","借來的書不能看，只能抄"],"ans":"A","steps":["證據：「家貧，無從致書以觀，每假借於藏書之家」","因為窮所以只能借，借了要還，只好抄下來","文中沒提老師規定或練字"],"tests":"記敘：起因","avoid":"找「家貧」這類說明原因的詞"},{"q":"「錄畢，走送之」的「走」是什麼意思？","opts":["走路","離開","跑","走漏"],"ans":"C","steps":["組詞「走路」代回「走路送去」，好像也通","第二招看目的：後面「不敢稍逾約」，他急著準時還書","古代「走」＝跑（兔走觸株），所以是跑著送去"],"tests":"古今異義：走","avoid":"古文的「走」，先代「跑」試試"},{"q":"「天大寒，硯冰堅，手指不可屈伸，弗之怠」表現作者什麼？","opts":["怕冷，所以不抄了","不怕辛苦，認真抄書","手受傷了，不能寫字","抄書很快，一下就抄完"],"ans":"B","steps":["經過：天冷、墨結冰、手指凍僵","「弗之怠」＝不敢對它偷懶","在這麼苦的情況下還在抄 → 勤學不怕苦"],"tests":"人物描寫：動作","avoid":"困難越大，越能看出人物性格"},{"q":"這段的「結果」是什麼？","opts":["他後來買了很多書","藏書的人家不再借他書","大家願意借書給他，他因此讀遍很多書","他把借來的書都送給別人"],"ans":"C","steps":["證據：「以是人多以書假余，余因得遍觀群書」","以是＝因此，前面守約是原因","結果：別人信任他，他讀到很多書"],"tests":"記敘：結果","avoid":"看到「以是、因」，後面就是結果"}]},{"label":"第四篇","title":"項羽學萬人敵","text":["項籍少時，學書不成，去學劍，又不成。項梁怒之。籍曰：「書足以記名姓而已。劍一人敵，不足學，學萬人敵。」於是項梁乃教籍兵法，籍大喜，略知其意，又不肯竟學。"],"cite":"《史記．項羽本紀》（節選）","notes":"項籍：項羽，名籍　書：讀書寫字　項梁：項羽的叔叔　怒之：對他生氣　而已：罷了　敵：對抗　兵法：打仗的方法　意：大意","trans":"項羽小時候，學讀書寫字沒有學成，放棄了去學劍，又沒學成。叔叔項梁對他很生氣。項羽說：「讀書寫字只夠用來記姓名罷了。劍只能對抗一個人，不值得學，我要學能對抗上萬人的本領。」於是項梁就教項羽兵法，項羽非常高興，大概懂得了其中的意思，卻又不肯學到底。","qs":[{"q":"項梁為什麼生氣？（起因）","opts":["項籍學讀書寫字、學劍，都沒學成","項籍和別人打架","項籍不肯學兵法","項籍把劍弄丟了"],"ans":"A","steps":["證據：「學書不成，去學劍，又不成。項梁怒之」","兩件事都沒學成，叔叔才生氣","不肯學兵法是後來的事"],"tests":"記敘：起因","avoid":"「怒之」前面那句就是原因"},{"q":"項籍說要「學萬人敵」，他想學的是什麼？","opts":["一次打敗一萬個人的劍術","能記住一萬個名字的方法","認識一萬個字","能對抗上萬人的本領，也就是兵法"],"ans":"D","steps":["他說「劍一人敵，不足學」，不想只對抗一人","後文：「於是項梁乃教籍兵法，籍大喜」","所以萬人敵＝帶兵打仗的兵法"],"tests":"推論：找證據","avoid":"看後文別人怎麼回應他"},{"q":"「略知其意，又不肯竟學」的「竟」是什麼意思？","opts":["竟然","競爭","完成、到底","邊境"],"ans":"C","steps":["組詞「竟然」代回「又不肯竟然學」→ 不通","組詞「未竟之業」＝沒完成的事，竟＝完成，代回「不肯學到完」→ 通","驗證：前面「略知其意」只懂大概，所以是沒學完"],"tests":"字義：竟","avoid":"組詞要多試幾個，找讀得通的"},{"q":"從這段看，項籍是怎樣的人？","opts":["非常謙虛，聽叔叔的話","學什麼都很認真","不喜歡打仗，只愛讀書","志向很大，但學東西缺乏耐心"],"ans":"D","steps":["志向大：要學「萬人敵」","沒耐心：學書、學劍都不成，兵法也「不肯竟學」","所以兩個特點都要有"],"tests":"人物描寫：言行","avoid":"人物的話＋做的事，一起看"}]},{"label":"第五篇","title":"口技","text":["京中有善口技者。會賓客大宴，於廳事之東北角，施八尺屏障，口技人坐屏障中，一桌、一椅、一扇、一撫尺而已。眾賓團坐。少頃，但聞屏障中撫尺一下，滿堂寂然，無敢譁者。","忽然撫尺一下，群響畢絕。撤屏視之，一人、一桌、一椅、一扇、一撫尺而已。"],"cite":"林嗣環〈口技〉（節選開頭與結尾）","notes":"善：擅長　口技：用嘴模仿各種聲音的技藝　會：正好遇到　廳事：大廳　施：設置　屏障：屏風　撫尺：表演者拍桌用的木塊　團坐：圍著坐　少頃：一會兒　但：只　群響：各種聲音　畢絕：全部停止","trans":"京城裡有一個擅長口技的人。正好遇上有人大宴賓客，就在大廳的東北角，擺了八尺高的屏風，表演口技的人坐在屏風裡，只有一張桌子、一把椅子、一把扇子、一塊撫尺罷了。賓客們圍坐著。一會兒，只聽到屏風裡撫尺拍了一下，全場安靜下來，沒有人敢大聲說話。（中間表演略）忽然撫尺又拍了一下，所有的聲音全都停止。撤掉屏風一看，只有一個人、一張桌子、一把椅子、一把扇子、一塊撫尺罷了。","qs":[{"q":"「撫尺一下」在文中出現兩次，各代表什麼？","opts":["兩次都表示表演開始","第一次表示表演開始，第二次表示表演結束","第一次表示結束，第二次表示開始","兩次都是觀眾在拍手"],"ans":"B","steps":["第一次：之後「滿堂寂然」，大家安靜等表演","第二次：之後「群響畢絕」，聲音全部停止","所以一個開始、一個結束"],"tests":"記敘：順序","avoid":"同樣的動作，看它後面發生什麼"},{"q":"「滿堂寂然，無敢譁者」是什麼意思？","opts":["全場大聲喝采","大廳裡沒有人","大家都睡著了","全場安靜，沒有人敢大聲說話"],"ans":"D","steps":["「寂然」＝安靜，「譁」＝喧鬧","「無敢譁者」＝沒有敢喧鬧的人","表示觀眾專心等表演"],"tests":"句意","avoid":"一個字一個字代回去讀"},{"q":"作者在開頭寫口技人只有「一桌、一椅、一扇、一撫尺而已」，有什麼作用？","opts":["說明口技人很窮","說明宴會準備得很隨便","說明觀眾不重視表演","道具很簡單，更顯出口技人本領高超"],"ans":"D","steps":["「而已」＝罷了，強調東西很少","這麼少的道具卻能做出精彩表演","所以是襯托口技人技藝高明"],"tests":"寫法：襯托","avoid":"強調「很少」，常是要襯托「很厲害」"},{"q":"結尾「撤屏視之，一人、一桌、一椅、一扇、一撫尺而已」和開頭有什麼關係？","opts":["前後呼應，再次強調只有一個人和簡單道具","和開頭相反，道具變多了","表示口技人已經離開","說明觀眾發現被騙了"],"ans":"A","steps":["開頭：「一桌、一椅、一扇、一撫尺而已」","結尾幾乎一模一樣，只多了「一人」","首尾呼應，讓讀者更佩服他的本領"],"tests":"寫法：首尾呼應","avoid":"開頭結尾句子很像，就是呼應"}]}]},{"no":"第 3 組","title":"傷仲永","skill":"議論：找論點、找論據","steps":["❶ 找「論點」：作者最想說的那句話，常在開頭或結尾，常跟著「故、是故、則」","❷ 找「論據」：作者拿什麼來證明？故事、例子、比喻、名人的話","❸ 檢查：論據和論點接得起來嗎？","❹ 一句話說出：作者用＿＿＿，證明＿＿＿"],"demo":{"q":"「故不積跬步，無以至千里；不積小流，無以成江海。」這句的論點和論據是什麼？","a":["→ 看到「故」＝所以，後面是作者的結論","→ 論據：走路要一步一步走才到千里，河海要小溪匯集才形成（比喻）","答：用走路、河流作比喻，證明學習要一點一滴累積"]},"parts":[{"label":"第一篇","title":"傷仲永","text":["金溪民方仲永，世隸耕。仲永生五年，未嘗識書具，忽啼求之。父異焉，借旁近與之，即書詩四句，並自為其名。","邑人奇之，稍稍賓客其父，或以錢幣乞之。父利其然也，日扳仲永環謁於邑人，不使學。","明道中，從先人還家，於舅家見之，十二三矣。令作詩，不能稱前時之聞。又七年，還自揚州，復到舅家問焉，曰：「泯然眾人矣。」","王子曰：「仲永之通悟，受之天也。其受之天也，賢於材人遠矣。卒之為眾人，則其受於人者不至也。」"],"cite":"王安石〈傷仲永〉（節選）","notes":"金溪：地名，在今江西　隸：屬於　書具：寫字的工具　異：覺得奇怪　旁近：附近的人家　邑人：同鄉的人　奇之：認為他很特別　賓客其父：把他父親當賓客招待　乞：求取　扳：拉著　環謁：到處拜訪　明道：宋仁宗的年號　先人：去世的父親　稱：相當　泯然：完全消失的樣子　王子：王安石自稱　通悟：聰明　材人：有才能的人　卒：最後","trans":"金溪縣有個百姓叫方仲永，世世代代種田。仲永五歲時，從來沒見過寫字的工具，忽然哭著要。父親覺得奇怪，向鄰居借來給他，他立刻寫了四句詩，還自己題上名字。同鄉的人覺得他很特別，漸漸把他父親當賓客招待，有人還用錢求仲永作詩。父親認為這樣有利可圖，每天拉著仲永到處拜訪同鄉的人，不讓他學習。明道年間，我跟著父親回家鄉，在舅舅家見到他，已經十二三歲了。叫他作詩，已經比不上從前的名聲。又過了七年，我從揚州回來，再到舅舅家問起他，舅舅說：「他已經和普通人一樣了。」王安石說：「仲永的聰明，是天生的。他天生的資質，比一般有才能的人好得多。最後卻成了普通人，是因為他沒有受到後天的教育啊。」","qs":[{"q":"「父利其然也」的「利」是什麼意思？","opts":["鋒利","順利","認為有好處可得","利息"],"ans":"C","steps":["組詞「利益」，代回「父親認為這樣有利益」→ 通","驗證：前一句「或以錢幣乞之」，有人拿錢來求詩","後文他天天帶仲永到處拜訪，可見是貪圖好處"],"tests":"字義：名詞當動詞","avoid":"名詞後面接「其、之」，常當動作讀"},{"q":"作者認為仲永為什麼會「泯然眾人」？","opts":["天生的資質不夠好","沒有受到後天的教育和學習","家裡太窮，買不起紙筆","他自己不喜歡作詩"],"ans":"B","steps":["證據：「卒之為眾人，則其受於人者不至也」，受於人＝從別人（老師）那裡學到的，不至＝不夠","又說他「受之天也，賢於材人遠矣」，天資很好","再對照前文「不使學」→ 是沒學習害的"],"tests":"找論點","avoid":"作者的看法，多在「某某曰」之後"},{"q":"這篇文章最主要的論點是什麼？","opts":["天才一定會成功","種田的人家不該讀書","小孩子不應該作詩","天資再好，不繼續學習，也會變成普通人"],"ans":"D","steps":["最後一段：天資好，卻因「受於人者不至」而成為眾人","前面的故事，正是在證明這個道理","「一定會成功」與故事結局相反"],"tests":"議論：論點","avoid":"論點要能包住整個故事"},{"q":"作者用什麼當「論據」，來證明自己的看法？","opts":["古代聖人說過的名言","許多數字統計","方仲永從神童變成普通人的真實經過","動物和植物的比喻"],"ans":"C","steps":["前三段：五歲能寫詩 → 十二三歲不如從前 → 再七年泯然眾人","這是作者親自見聞的事實","文中沒有引名言、數字或比喻"],"tests":"議論：論據","avoid":"論據是故事，就說是事實論據"}]},{"label":"第二篇","title":"不積跬步","text":["積土成山，風雨興焉；積水成淵，蛟龍生焉；積善成德，而神明自得，聖心備焉。故不積跬步，無以至千里；不積小流，無以成江海。騏驥一躍，不能十步；駑馬十駕，功在不舍。鍥而舍之，朽木不折；鍥而不舍，金石可鏤。"],"cite":"《荀子．勸學》（節選）","notes":"淵：深水潭　蛟龍：傳說中的龍　積善：累積好的行為　神明：智慧　備：具備　跬步：半步，舉一次腳　無以：沒有辦法　騏驥：駿馬　駑馬：跑不快的馬　十駕：拉車走十天　功：成績　舍：放棄　朽木：爛木頭　鏤：雕刻","trans":"堆積泥土成為高山，風雨就從那裡興起；匯集流水成為深潭，蛟龍就在那裡生長；累積善行成為美德，就能得到智慧，具備聖人的思想。所以不累積半步一步，就沒有辦法走到千里遠；不匯集細小的水流，就沒有辦法形成江海。駿馬一跳，不能超過十步；劣馬拉車走十天，也能走得很遠，成功在於不停止。刻一下就放棄，連爛木頭都刻不斷；不停地刻下去，金屬和石頭也能雕刻成功。","qs":[{"q":"這段文字的論點是什麼？","opts":["要先買一匹好馬","爬山比游泳重要","學習要不斷累積、持續不放棄","爛木頭不值得雕刻"],"ans":"C","steps":["「故」後面：不積跬步，無以至千里","後面又說「功在不舍」「鍥而不舍」","全段都在說累積和堅持"],"tests":"議論：論點","avoid":"看「故」後面那句"},{"q":"「積土成山」「積水成淵」屬於哪一種論據？","opts":["歷史人物的故事","比喻：用看得到的事物來說道理","名人說過的話","數字統計"],"ans":"B","steps":["土堆成山、水匯成潭，是生活中看得到的現象","作者用它們比喻「積善成德」","文中沒有人物、名言或數字"],"tests":"論據：比喻","avoid":"論據拿東西來比，就是比喻"},{"q":"「騏驥一躍，不能十步；駑馬十駕，功在不舍」用什麼方法說明道理？","opts":["用好馬和劣馬對比，說明堅持比天分更重要","說明好馬一定跑得比劣馬慢","說明養馬要選劣馬","說明馬一天只能走十步"],"ans":"A","steps":["騏驥＝駿馬，一跳卻不到十步","駑馬＝劣馬，十天不停也能走遠","兩者對比，重點在「功在不舍」"],"tests":"論證：對比","avoid":"兩樣東西一起寫，就是在對比"},{"q":"「鍥而舍之，朽木不折」是什麼意思？","opts":["把爛木頭折斷丟掉","刻一下就放棄，連爛木頭也刻不斷","不停地刻，木頭就會斷","爛木頭本來就刻不斷"],"ans":"B","steps":["組詞「鍥而不舍」：鍥＝刻，舍＝放棄","代回：刻了就放棄，連爛木頭都不能折斷","和下一句「鍥而不舍，金石可鏤」相對"],"tests":"句意：對稱句","avoid":"對稱的兩句意思相反，可以互相對照"}]},{"label":"第三篇","title":"教學相長","text":["雖有嘉肴，弗食，不知其旨也；雖有至道，弗學，不知其善也。是故學然後知不足，教然後知困。知不足，然後能自反也；知困，然後能自強也。故曰：教學相長也。"],"cite":"《禮記．學記》（節選）","notes":"嘉肴：美味的菜　弗：不　至道：最好的道理　自反：反省自己　自強：努力向上　相長：互相增長","trans":"雖然有美味的菜，不吃，就不知道它的美味；雖然有最好的道理，不學，就不知道它的好處。所以學了以後才知道自己的不足，教了以後才知道自己的困惑。知道不足，然後能反省自己；知道困惑，然後能努力向上。所以說：教和學是互相增長的。","qs":[{"q":"「不知其旨也」的「旨」是什麼意思？","opts":["宗旨、目的","美味","聖旨","手指"],"ans":"B","steps":["組詞「宗旨」，代回「不知道菜的宗旨」→ 不通","第四招比對稱句：「不知其旨」對「不知其善」，善＝好","菜的「好」就是好吃，所以旨＝美味"],"tests":"字義：比對稱句","avoid":"兩句結構一樣，同位置的字意思相近"},{"q":"這段文字的論點是什麼？","opts":["美味的菜一定要吃","老師比學生厲害","只要教別人，自己不用學","教和學可以互相促進"],"ans":"D","steps":["最後：「故曰：教學相長也」","前面說學能知不足、教能知困，兩者都讓人進步","所以論點是教學相長"],"tests":"議論：論點","avoid":"「故曰」後面常是論點"},{"q":"開頭「雖有嘉肴，弗食，不知其旨也」在文中有什麼作用？","opts":["教大家怎麼做菜","用吃菜作比喻，引出「不學就不知道道理的好」","說明作者很喜歡美食","說明好吃的菜很少"],"ans":"B","steps":["下一句結構相同：「雖有至道，弗學，不知其善也」","先講生活中的吃菜，再講學道理","所以是比喻，引出後面的論點"],"tests":"論據：比喻","avoid":"先講生活小事，後面常接大道理"},{"q":"「教然後知困」的意思最接近哪一個？","opts":["教別人很累，讓人困倦","教完就知道別人很笨","教書的人生活很困苦","教別人以後，才發現自己還有不懂的地方"],"ans":"D","steps":["困＝困惑、不通的地方","後文「知困，然後能自強也」：知道不懂才會努力","所以是發現自己還有不懂的"],"tests":"句意：上下文","avoid":"看後一句怎麼接，就知道前一句意思"}]},{"label":"第四篇","title":"幼而學者","text":["然人有坎壈，失於盛年，猶當晚學，不可自棄。","幼而學者，如日出之光；老而學者，如秉燭夜行，猶賢乎瞑目而無見者也。"],"cite":"顏之推《顏氏家訓．勉學》（節選）","notes":"坎壈：不順利、遭遇困難　盛年：年輕力壯的時候　猶：仍然　秉燭：拿著蠟燭　瞑目：閉上眼睛","trans":"然而人如果遇到困難不順利，錯過了年輕的時候，仍然應該晚一點開始學習，不可以放棄自己。小時候學習的人，像太陽剛出來的光芒；年老才學習的人，像拿著蠟燭在夜裡走路，但還是勝過閉著眼睛什麼都看不見的人。","qs":[{"q":"這段文字的論點是什麼？","opts":["只有小時候學習才有用","老人不應該再讀書","錯過年輕時，也應該晚點學習，不可放棄自己","晚上走路一定要帶蠟燭"],"ans":"C","steps":["第一句：「猶當晚學，不可自棄」","第二句用比喻說明：晚學還是勝過不學","「只有小時候有用」和「猶當晚學」相反"],"tests":"議論：論點","avoid":"「當、不可」後面常是作者的主張"},{"q":"作者用「日出之光」比喻什麼？","opts":["小時候就學習，前途明亮長遠","老了才學，只看得到一點點","早上讀書效果最好","太陽對眼睛有害"],"ans":"A","steps":["原文：「幼而學者，如日出之光」","太陽剛出來，光亮又能照一整天","比喻年少學習，前途寬廣"],"tests":"論據：比喻","avoid":"「如」前面是人，後面是比喻"},{"q":"「猶賢乎瞑目而無見者也」的「賢」是什麼意思？","opts":["有品德的人","賢慧","很閒","勝過、比較好"],"ans":"D","steps":["組詞「賢能」，代回「還賢能於閉眼的人」→ 勉強","第二招看比較：秉燭夜行 對 瞑目無見，是在比哪個好","〈傷仲永〉「賢於材人遠矣」也是勝過，所以＝勝過"],"tests":"字義：賢","avoid":"「賢乎、賢於」接比較對象＝勝過"},{"q":"作者把「老而學者」和「瞑目而無見者」放在一起比，想說明什麼？","opts":["老人的眼睛都不好","晚學和早學完全一樣好","晚學雖然不如早學，但一定比不學好","閉上眼睛比較能專心"],"ans":"C","steps":["秉燭夜行：只看得見一點，不如日出之光","但「猶賢乎」瞑目無見：仍比什麼都看不見好","所以是：晚學勝過不學"],"tests":"論證：對比","avoid":"比較句要看清楚誰勝過誰"}]},{"label":"第五篇","title":"師說","text":["古之學者必有師。師者，所以傳道、受業、解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也，終不解矣。","生乎吾前，其聞道也固先乎吾，吾從而師之；生乎吾後，其聞道也亦先乎吾，吾從而師之。吾師道也，夫庸知其年之先後生於吾乎？是故無貴無賤，無長無少，道之所存，師之所存也。"],"cite":"韓愈〈師說〉（節選開頭）","notes":"學者：求學的人　道：道理　業：學業　惑：疑惑　孰：誰　固：本來　師之：拜他為師　師道：學習道理　庸：何必　無：不論","trans":"古代求學的人一定有老師。老師，是用來傳授道理、教授學業、解答疑惑的人。人不是生下來就什麼都懂，誰能沒有疑惑呢？有疑惑卻不向老師請教，那些疑惑就始終解決不了。比我早出生的人，他懂得道理本來就比我早，我跟從他、拜他為師；比我晚出生的人，如果他懂得道理也比我早，我也跟從他、拜他為師。我學的是道理，何必管他年紀比我大還是小呢？所以不論地位高低，不論年紀大小，道理在哪裡，老師就在哪裡。","qs":[{"q":"「師者，所以傳道、受業、解惑也」的「所以」是什麼意思？","opts":["用來……的","因此","所以說","為什麼"],"ans":"A","steps":["代回「因此」：「老師，因此傳道」→ 前面沒有原因，不通","第二招看句型：「師者……也」是在說明老師是什麼","所以是「老師是用來傳道、授業、解惑的人」"],"tests":"古今異義：所以","avoid":"「所以」在說明句裡，先代「用來」"},{"q":"第一段的論點是什麼？","opts":["求學的人一定要有老師","人生下來就什麼都懂","老師一定比學生年紀大","有疑惑最好自己想"],"ans":"A","steps":["第一句：「古之學者必有師」","後面說人都有惑，不從師就「終不解矣」","這是在證明第一句"],"tests":"議論：論點","avoid":"第一句是主張，後面常是證明"},{"q":"「人非生而知之者，孰能無惑？」是什麼意思？","opts":["人不是生來就懂，誰能沒有疑惑呢？（人人都有疑惑）","有人生來就什麼都懂","只有聰明人才有疑惑","誰能回答我的疑惑？"],"ans":"A","steps":["前半：人不是生下來就知道的","後半是反問：誰能沒有疑惑？＝人人都有","這是作者證明「必有師」的道理"],"tests":"反問句","avoid":"反問句翻成肯定句再讀"},{"q":"第二段中，作者拜誰為師？","opts":["只拜年紀比自己大的人","只拜地位比自己高的人","只拜比自己晚出生的人","不管年紀、地位，只要懂的道理比自己多"],"ans":"D","steps":["生乎吾前、生乎吾後，只要「聞道先乎吾」都拜師","結論：「無貴無賤，無長無少，道之所存，師之所存也」","所以看的是道理，不是年紀或地位"],"tests":"論點：結論句","avoid":"「是故」後面是結論"}]}]},{"no":"第 4 組","title":"九月九日憶山東兄弟","skill":"唐詩：送別與思鄉（情感＋寫法）","steps":["❶ 先讀題目：誰、在哪裡、什麼時候、為了什麼寫","❷ 圈景物和動作：柳、酒、月、關、線、雨……","❸ 圈心情字：思、憶、喜、恐、勸……","❹ 找寫法：從對方寫回來、借景寫情、用小事寫大愛、擬人"],"demo":{"q":"「遙知兄弟登高處，遍插茱萸少一人。」詩人用什麼寫法表現想家？","a":["→ 材料：「遙知」＝在遠方想像，「兄弟登高」「少一人」都是家鄉的畫面","→ 詩人不說自己多想家，反而寫兄弟發現少了自己","答：從對方寫回來，讓想家的心情更深"]},"parts":[{"label":"第一篇","title":"九月九日憶山東兄弟","text":["獨在異鄉為異客，每逢佳節倍思親。遙知兄弟登高處，遍插茱萸少一人。"],"cite":"王維〈九月九日憶山東兄弟〉","notes":"九月九日：重陽節　山東：華山以東，王維的家鄉　異客：在外地作客的人　佳節：美好的節日　遙：遠遠地　登高：重陽節的習俗，爬到高處　茱萸：一種有香氣的植物，重陽節插在身上","trans":"我獨自在外地作客，每到美好的節日就更加想念親人。我在遠方想像兄弟們登上高處，大家都插著茱萸，卻少了我一個人。","qs":[{"q":"「每逢佳節倍思親」的「倍」是什麼意思？","opts":["背對","更加","兩倍的數目","陪伴"],"ans":"B","steps":["組詞「加倍」，代回「每到節日加倍想念」→ 通","驗證：平常就想家，節日大家團圓，想得更厲害","思念不能用數字算，所以是「更加」"],"tests":"字義：倍","avoid":"代回後想想合不合情境"},{"q":"「遍插茱萸少一人」，少的是誰？","opts":["詩人的父親","一位生病的兄弟","詩人的朋友","詩人自己"],"ans":"D","steps":["題目：「憶山東兄弟」，詩人在外地","首句「獨在異鄉為異客」：詩人不在家","兄弟們登高，缺的就是詩人"],"tests":"推論：補人物","avoid":"題目和第一句，常藏著答案"},{"q":"後兩句用了什麼寫法？","opts":["直接寫詩人自己登高","用誇飾寫茱萸很多","不直接寫自己想家，而是想像兄弟想念自己","用擬人寫茱萸會說話"],"ans":"C","steps":["「遙知」＝在遠方想像","畫面在家鄉：兄弟登高、插茱萸、少一人","從對方寫回來，更顯得思念深"],"tests":"寫法：從對方寫","avoid":"畫面不在詩人身邊，就是從對方寫"},{"q":"這首詩主要表達什麼情感？","opts":["在外地過節，思念家鄉的兄弟","重陽節登山很開心","對兄弟不約他很生氣","喜歡在外地生活"],"ans":"A","steps":["心情字：「思親」「憶」","時間：佳節（重陽）；地點：異鄉","所以是節日思鄉"],"tests":"情感：思鄉","avoid":"先圈題目和詩裡的心情字"}]},{"label":"第二篇","title":"送元二使安西","text":["渭城朝雨浥輕塵，客舍青青柳色新。勸君更盡一杯酒，西出陽關無故人。"],"cite":"王維〈送元二使安西〉","notes":"元二：姓元，排行第二的朋友　使：出使　安西：唐朝在西北邊疆設的官府　渭城：地名，在長安附近　朝雨：早晨的雨　浥：沾溼　客舍：旅店　陽關：西北的關口　故人：老朋友","trans":"渭城早晨的雨沾溼了輕輕的塵土，旅店旁邊的柳樹青青，顏色格外新鮮。請你再喝完這一杯酒吧，往西走出陽關，就再也沒有老朋友了。","qs":[{"q":"前兩句寫了什麼景象？","opts":["晚上颳大風，塵土飛揚","冬天下雪，柳樹枯黃","早晨下過雨，塵土溼潤，旅店旁柳樹青翠","沙漠裡沒有一棵樹"],"ans":"C","steps":["「朝雨」＝早晨的雨，「浥輕塵」＝沾溼塵土","「青青柳色新」：柳樹顏色清新","其他選項和詩中的時間、顏色都不合"],"tests":"找景物","avoid":"圈時間、天氣、顏色三種字"},{"q":"「勸君更盡一杯酒」的「更」是什麼意思？","opts":["更加","再","更換","打更"],"ans":"B","steps":["組詞「更加」，代回「更加喝完一杯」→ 不太通","組詞「更上一層樓」＝再，代回「再喝完一杯」→ 通","驗證：「更盡」表示前面已經喝過，詩人再勸一杯"],"tests":"字義：更","avoid":"組詞不通，換一個組詞再試"},{"q":"詩人為什麼勸朋友再喝一杯？","opts":["出了陽關就沒有老朋友，捨不得他走","酒很貴，不喝浪費","朋友酒量很好","喝醉了就不用出發"],"ans":"A","steps":["證據：第四句「西出陽關無故人」","前一句是勸酒，後一句是原因","所以是不捨朋友遠去"],"tests":"情感：送別","avoid":"勸的話後面，常接原因"},{"q":"這首詩表達了什麼情感？","opts":["出遊的快樂","對朋友的責備","對下雨的抱怨","依依不捨的送別之情"],"ans":"D","steps":["題目「送」：這是送別詩","勸酒＋「無故人」：不捨與關心","前兩句清新景色，襯托離別時刻"],"tests":"情感：送別","avoid":"題目有「送」，先想不捨"}]},{"label":"第三篇","title":"春夜喜雨","text":["好雨知時節，當春乃發生。隨風潛入夜，潤物細無聲。野徑雲俱黑，江船火獨明。曉看紅溼處，花重錦官城。"],"cite":"杜甫〈春夜喜雨〉","notes":"知：懂得　乃：就　發生：萌發生長，指讓萬物生長　潤：滋潤　野徑：田野的小路　俱：都　曉：天亮　紅溼處：被雨打溼的紅花　花重：花沾了雨顯得沉重　錦官城：成都的別稱","trans":"好雨懂得時節，正當春天就降下，讓萬物生長。它隨著風悄悄地在夜裡落下，細細地滋潤萬物，沒有一點聲音。田野的小路和天上的雲都是黑漆漆的，只有江上船裡的燈火特別明亮。天亮後看那被雨打溼的紅花，成都城裡處處花朵飽滿沉重。","qs":[{"q":"「好雨知時節」用了什麼寫法？","opts":["誇飾：把雨寫得很大","對偶：上下兩句字數相同","擬人：把雨寫得像人一樣懂得時節","譬喻：把雨比成別的東西"],"ans":"C","steps":["「知」＝懂得，是人才會的事","雨被寫成像人一樣懂事","所以是擬人"],"tests":"寫法：擬人","avoid":"東西做了人才會做的事＝擬人"},{"q":"「隨風潛入夜，潤物細無聲」寫出春雨什麼特點？","opts":["在夜裡悄悄地、細細地滋潤萬物","雨很大，打得很響","雨下在白天","雨把花打壞了"],"ans":"A","steps":["「潛」組詞「潛水、潛行」＝偷偷不被發現，「入夜」＝在夜裡","「細無聲」：雨細細的，沒有聲音","所以是安靜又細柔的春雨"],"tests":"找景物特點","avoid":"一個字一個字代回去讀"},{"q":"這首詩表現詩人什麼心情？","opts":["喜悅","思鄉","害怕","生氣"],"ans":"A","steps":["題目就有心情字：「喜雨」","詩中稱它「好雨」，又想像花開滿城","所以是喜悅"],"tests":"找心情","avoid":"題目裡的心情字最可靠"},{"q":"最後「曉看紅溼處，花重錦官城」寫的是什麼？","opts":["夜裡看到江上的燈火","天亮後，城裡的紅花沾著雨水，顯得飽滿沉重","雨把城裡的花全打落","詩人天亮要離開成都"],"ans":"B","steps":["「曉」＝天亮，「紅溼處」＝被雨打溼的紅花","「花重」：沾了雨的花顯得沉甸甸的","江上燈火是前一聯夜裡的景，不是這兩句"],"tests":"寫法：想像","avoid":"時間對不上，常常是想像"}]},{"label":"第四篇","title":"出塞","text":["秦時明月漢時關，萬里長征人未還。但使龍城飛將在，不教胡馬度陰山。"],"cite":"王昌齡〈出塞〉","notes":"關：邊關　長征：遠行出征　但使：只要　龍城飛將：泛指漢代名將，常說是李廣　胡馬：外族的兵馬　度：越過　陰山：北方的大山","trans":"依舊是秦漢時候的明月和邊關，到萬里之外出征的人還沒有回來。只要有像漢代飛將軍那樣的名將在，就不會讓敵人的兵馬越過陰山。","qs":[{"q":"「秦時明月漢時關」想表達什麼？","opts":["秦朝的月亮比漢朝的亮","從秦漢到現在，明月和邊關都在，邊疆戰事從古到今沒停過","詩人住在秦漢的關口","秦朝和漢朝是同一個朝代"],"ans":"B","steps":["秦、漢是很久以前的朝代，詩人是唐朝人","明月、邊關從古代就在，守邊的事也一直存在","下一句「萬里長征人未還」接著說戰爭"],"tests":"找景物：時間","avoid":"古詩提到朝代，常是說時間很長"},{"q":"「萬里長征人未還」中，「人」指的是誰？","opts":["出外做生意的商人","去旅行的詩人","外族的兵馬","到遠方邊疆打仗的士兵"],"ans":"D","steps":["「長征」＝遠行出征，題目是「出塞」","出征的是守邊士兵","胡馬是敵人，不是「未還」的人"],"tests":"推論：補人物","avoid":"看題目和動詞，判斷是誰"},{"q":"後兩句詩人希望什麼？","opts":["自己去當飛將軍","到陰山去騎馬","有優秀的將領守邊，敵人就不能入侵","趕快讓胡馬回家"],"ans":"C","steps":["「但使」＝只要，後面是條件","「不教胡馬度陰山」＝不讓敵人越過陰山","所以是盼望名將保衛邊疆"],"tests":"情感：盼望","avoid":"「但使……不教……」＝只要……就……"},{"q":"這首詩表達了什麼情感？","opts":["高興打了勝仗","想去邊疆旅行","討厭月亮","同情征人回不了家，盼望有良將平定邊患"],"ans":"D","steps":["第二句：人未還 → 同情","後兩句：但使飛將在 → 盼望","兩種情感都要有"],"tests":"情感＋寫法","avoid":"前兩句、後兩句分開找心情"}]},{"label":"第五篇","title":"遊子吟","text":["慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉。"],"cite":"孟郊〈遊子吟〉","notes":"遊子：離家遠行的人　臨行：出發前　意恐：心裡擔心　寸草心：小草的心，比喻子女的心意　三春：春天的三個月","trans":"慈愛的母親手中拿著針線，為要出遠門的孩子縫製身上的衣服。臨出發前一針一針縫得又細又密，心裡擔心孩子很久才能回家。誰說像小草一樣微小的孝心，能報答得了春天陽光般的母愛呢？","qs":[{"q":"「臨行密密縫，意恐遲遲歸」，母親為什麼縫得那麼密？","opts":["母親縫衣服的技術不好","衣服要拿去賣錢","孩子明天就回來了","擔心孩子很久才回來，衣服要耐穿"],"ans":"D","steps":["證據：「意恐遲遲歸」＝心裡擔心很晚才回家","縫得密，衣服就不容易破","這是用小動作寫出母親的擔心"],"tests":"情感：小事寫愛","avoid":"動作後面常接原因"},{"q":"「報得三春暉」的「暉」是什麼意思？","opts":["陽光","揮手","光輝的名聲","溫暖的衣服"],"ans":"A","steps":["組詞「春暉、餘暉」＝陽光，代回「報答春天的陽光」→ 通","驗證：前面「寸草」是小草，小草靠陽光長大","陽光比喻母愛"],"tests":"字義：暉","avoid":"看部首「日」，和光有關"},{"q":"最後兩句用了什麼寫法？","opts":["用誇飾寫小草很高","直接說「我很愛媽媽」","用小草和陽光作比喻，並用反問，說母愛報答不完","寫春天的花草景色"],"ans":"C","steps":["寸草心＝子女的心，三春暉＝母親的愛","「誰言……報得」是反問：誰說報答得了？","意思是：母愛報答不完"],"tests":"寫法：比喻＋反問","avoid":"反問句要翻成肯定的意思"},{"q":"這首詩主要表達什麼情感？","opts":["想念遠方的朋友","歌頌偉大的母愛，感念母親的恩情","擔心自己的衣服不夠穿","抱怨母親管太多"],"ans":"B","steps":["前四句：母親縫衣、擔心孩子","後兩句：孩子覺得報答不了母愛","所以是歌頌、感念母愛"],"tests":"情感：母愛","avoid":"從頭到尾看，每段寫誰的心"}]}]},{"no":"第 5 組","title":"第一次上場比賽","skill":"記敘文：心情變化與轉折","steps":["❶ 圈心情字：緊張、興奮、害怕、失望、開心……","❷ 找轉折詞：可是、沒想到、突然、這時、後來","❸ 畫心情曲線：開始 → 轉折 → 結尾","❹ 問：是哪件事讓心情改變？"],"demo":{"q":"下面這段，心情怎麼變？是什麼讓它改變？","a":["先看材料：「場邊傳來一聲嘆氣，我的臉一下子熱了起來……沒想到，隊長跑過來拍拍我的肩膀說：『別急，先把防守做好。』」","→ 心情：臉熱、想回板凳＝丟臉難過；轉折詞「沒想到」後面出現隊長的鼓勵","答：從丟臉難過，因為隊長的鼓勵而重新振作"]},"parts":[{"label":"第一篇","title":"第一次上場比賽","text":["比賽前一晚，我翻來覆去睡不著。這是我加入校隊後第一次可能上場，我一直想像自己投進關鍵球的樣子，心裡又興奮又緊張。","第三節，教練終於喊了我的名字。我一站起來，腳就像灌了鉛一樣重。第一次接到球，我急著出手，球連籃框都沒碰到。場邊傳來一聲嘆氣，我的臉一下子熱了起來，好想馬上回到板凳上。","沒想到，隊長跑過來拍拍我的肩膀說：「別急，先把防守做好。」我深呼吸，盯緊對方的球員，終於抄到一球，傳給隊長上籃得分。全隊對我比出大拇指，我的心又跳得好快，不過這次是因為開心。","那場比賽我一分也沒得，但回家的路上，我一直在笑。我知道，下一次我會更勇敢。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"比賽前一晚，「我」的心情是什麼？","opts":["非常失望","很平靜，一下就睡著","只有害怕，不想上場","又興奮又緊張"],"ans":"D","steps":["第一段：「心裡又興奮又緊張」","「翻來覆去睡不著」也是證據","文中說他想像投進關鍵球，不是不想上場"],"tests":"找心情字","avoid":"心情字常直接寫在句子裡"},{"q":"「腳就像灌了鉛一樣重」表現出什麼？","opts":["非常緊張，身體不聽使喚","腳受傷了","鞋子太重","跑得非常快"],"ans":"A","steps":["這是比喻：鉛很重，腳好像抬不起來","前面剛被叫上場，接著又急著出手","所以是太緊張"],"tests":"比喻寫心情","avoid":"比喻的句子，要想它在說什麼感覺"},{"q":"「我」的心情從低落轉為振作，轉折點是什麼？","opts":["隊長拍拍他的肩膀，提醒他先做好防守","教練喊了他的名字","他投進一顆三分球","場邊有人嘆氣"],"ans":"A","steps":["轉折詞「沒想到」後面：隊長拍肩說「別急，先把防守做好」","之後他深呼吸、抄到球，心情變好","場邊嘆氣是讓他更難過的事"],"tests":"找轉折點","avoid":"轉折詞後面，就是改變心情的事"},{"q":"「我」一分也沒得，為什麼回家路上一直在笑？","opts":["他其實得了很多分","教練說他是全隊最好的球員","他用防守幫助球隊，也找回了信心","比賽結束可以吃大餐"],"ans":"C","steps":["證據：抄到一球、傳給隊長得分、全隊比大拇指","最後「下一次我會更勇敢」：有了信心","文中說一分也沒得，也沒提教練稱讚或吃大餐"],"tests":"推論：結尾心情","avoid":"結尾的心情，要回前面找原因"}]},{"label":"第二篇","title":"豆豆不見了","text":["放學回家，門口的柴犬「豆豆」不見了。院子的門開著一條縫，我的心一下子沉到谷底。我和媽媽沿著巷子一路喊牠的名字，喊到喉嚨都啞了，還是沒有回應。我越走越害怕，腦中不停想著：牠會不會迷路？會不會再也回不來？","天快黑時，媽媽的手機響了。是巷口麵店的阿姨，她說有一隻柴犬一直坐在店門口，好像在等人。我們衝過去一看，豆豆正搖著捲捲的尾巴，嘴角還沾著一點麵渣。","我一把抱住牠，眼淚忍不住掉下來。媽媽笑著說：「你看，牠還記得我們常來這家店。」那天晚上，我檢查了三次院子的門。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"發現豆豆不見時，「我」的心情是什麼？","opts":["生氣","擔心害怕","開心","無聊"],"ans":"B","steps":["證據：「我的心一下子沉到谷底」","後面「越走越害怕」，還一直想牠會不會回不來","所以是擔心害怕"],"tests":"找心情字","avoid":"比喻＋心情字，一起當證據"},{"q":"事情的轉折點是什麼？","opts":["院子的門開著一條縫","我和媽媽一路喊牠的名字","麵店阿姨打電話說看到一隻柴犬","那天晚上檢查了三次門"],"ans":"C","steps":["第二段：「媽媽的手機響了」，阿姨說柴犬坐在店門口","從找不到 → 找到，心情開始改變","其他選項是起因、經過或結尾"],"tests":"找轉折點","avoid":"從壞變好的那一刻就是轉折"},{"q":"「我」抱住豆豆時「眼淚忍不住掉下來」，是因為什麼？","opts":["找到豆豆，放下心又很感動","豆豆咬了「我」一口","被媽媽罵了一頓","豆豆受傷了"],"ans":"A","steps":["前面一直很害怕牠回不來","現在豆豆搖著尾巴，平安沒事","所以是放心又感動的眼淚"],"tests":"推論：心情原因","avoid":"哭不一定是難過，要看前後情節"},{"q":"最後「我檢查了三次院子的門」，表示什麼？","opts":["院子的門壞掉了","他想再帶豆豆去麵店","他很怕豆豆再走失，以後會更小心","媽媽規定他要檢查三次"],"ans":"C","steps":["起因是「院子的門開著一條縫」","檢查三次：怕同樣的事再發生","文中沒說門壞了或媽媽規定"],"tests":"推論：結尾動作","avoid":"結尾的動作，常和起因有關"}]},{"label":"第三篇","title":"六十二分的考卷","text":["數學小考發下來，我看到考卷上的紅字「六十二」，整個人愣住了。我明明有寫完，怎麼會這樣？下課時，我把考卷塞進書包最底層，一句話也不想說。","回家後，爸爸看我悶悶不樂，問我怎麼了。我小聲地拿出考卷，以為他會生氣。沒想到，他坐下來陪我一題一題看。原來我錯的大多是同一種題目：單位換算。我把公尺和公分弄混了。","爸爸畫了一把尺給我看，一公尺有一百公分，我突然懂了。那天晚上，我把錯的題目重新做一遍，全部都對。雖然分數不會改，但我覺得心裡那塊大石頭不見了。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"看到「六十二」時，「我」的心情是什麼？","opts":["驕傲又開心","震驚又難過","完全不在意","生氣老師改錯"],"ans":"B","steps":["「整個人愣住了」→ 震驚","「塞進書包最底層，一句話也不想說」→ 難過","文中沒說老師改錯"],"tests":"找心情","avoid":"動作也能看出心情"},{"q":"「以為他會生氣。沒想到……」這裡在寫什麼？","opts":["爸爸非常生氣","「我」不敢給爸爸看考卷","爸爸不懂數學","事情和「我」想的不一樣，是心情的轉折"],"ans":"D","steps":["「以為」：本來擔心的事","「沒想到」後面：爸爸陪他一題一題看","預想和結果相反 → 轉折"],"tests":"找轉折詞","avoid":"「以為……沒想到」就是轉折"},{"q":"「我」錯的主要原因是什麼？","opts":["把公尺和公分弄混了","沒有寫完考卷","題目太多看不完","考試時肚子痛"],"ans":"A","steps":["證據：「原來我錯的大多是同一種題目：單位換算」","接著說：「我把公尺和公分弄混了」","文中說「我明明有寫完」"],"tests":"白話找證據","avoid":"「原來」後面常是答案"},{"q":"結尾「心裡那塊大石頭不見了」是什麼意思？","opts":["分數被改成一百分","書包裡的石頭被拿走","爸爸答應不再看考卷","弄懂了錯在哪裡，心情放鬆了"],"ans":"D","steps":["前一句：「雖然分數不會改」，分數沒變","他重新做一遍全部都對 → 真的懂了","「大石頭」是比喻心裡的壓力"],"tests":"比喻寫心情","avoid":"「雖然……但」後面才是重點"}]},{"label":"第四篇","title":"和柴犬一起練演講","text":["老師宣布我要代表班上參加演講比賽時，我差點從椅子上跳起來——不是因為高興，而是因為害怕。我只要站在大家面前，聲音就會發抖。","接下來兩個星期，我每天對著家裡的柴犬練習。牠總是歪著頭聽我說，好像聽得很認真。我慢慢發現，只要把內容記熟，就沒有那麼可怕了。","比賽那天，我走上台，看到台下黑壓壓的人，腦袋突然一片空白。我想起練習時柴犬歪頭的樣子，忍不住笑了一下，緊張的感覺竟然少了一半。我一句一句說完，台下響起掌聲。雖然只得了佳作，但我第一次覺得，站在台上也可以很自在。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"「我差點從椅子上跳起來」，原因是什麼？","opts":["高興得想跳起來","害怕上台說話","椅子壞掉了","被老師嚇到"],"ans":"B","steps":["原文緊接著說：「不是因為高興，而是因為害怕」","後面：「站在大家面前，聲音就會發抖」","「高興」被作者自己否定了"],"tests":"找心情原因","avoid":"「不是……而是……」要看後半句"},{"q":"比賽時，是什麼讓「我」不再那麼緊張？","opts":["台下觀眾大聲加油","老師上台陪他","想起練習時柴犬歪頭的樣子","他拿著稿子照著念"],"ans":"C","steps":["證據：「我想起練習時柴犬歪頭的樣子，忍不住笑了一下」","接著：「緊張的感覺竟然少了一半」","文中沒提加油、老師或稿子"],"tests":"找轉折點","avoid":"心情變了，往前找是什麼事"},{"q":"全文「我」的心情變化，哪一個順序正確？","opts":["高興 → 害怕 → 生氣 → 難過","害怕 → 腦袋空白 → 慢慢有信心 → 很失望","害怕 → 慢慢有信心 → 一度腦袋空白 → 放鬆自在","自在 → 害怕 → 放鬆 → 驕傲"],"ans":"C","steps":["第一段害怕；第二段「沒有那麼可怕了」","第三段先「一片空白」，後來笑了、說完","結尾「也可以很自在」"],"tests":"畫心情曲線","avoid":"每段找一個心情字，依順序排"},{"q":"根據文章，下列哪一個說法正確？","opts":["他得到演講比賽第一名","他把內容記熟後，覺得沒那麼可怕","他從來不怕上台","他每天對著同學練習"],"ans":"B","steps":["第二段：「只要把內容記熟，就沒有那麼可怕了」","文中說「只得了佳作」，也說他會害怕","練習對象是柴犬，不是同學"],"tests":"白話找證據","avoid":"每個選項都回文章對一次"}]},{"label":"第五篇","title":"第一次自己搭捷運","text":["暑假的時候，媽媽讓我第一次自己搭捷運去外婆家。出門前，她把每一站的站名寫在紙條上，叮嚀我在第三站下車。我拍拍胸口說：「沒問題！」心裡卻有點發毛。","車廂裡人好多，我緊緊抓著扶手，每到一站就數一次手指。到了第二站，廣播聲被吵雜的人聲蓋住，我忽然聽不清楚，心跳得好快：剛剛到底是第幾站？我差點就要哭出來。","這時，我想起那張紙條，趕快拿出來，抬頭對照車門上方的站名，才發現下一站就是我要下車的地方。","走出車站，外婆已經在出口對我揮手。我抬起頭，大聲地說：「我自己來的！」那一刻，我覺得自己長大了。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"「我拍拍胸口說：『沒問題！』心裡卻有點發毛」表示什麼？","opts":["表面上裝作不怕，其實心裡緊張","他真的一點也不緊張","他胸口不舒服","他不想去外婆家"],"ans":"A","steps":["「卻」是轉折：前後意思相反","說「沒問題」是表面；「發毛」＝心裡害怕","所以是嘴上不怕、心裡怕"],"tests":"轉折詞：卻","avoid":"看到「卻」，前後的心情常相反"},{"q":"「我」什麼時候最緊張？","opts":["出門前媽媽叮嚀的時候","聽不清楚廣播，不知道到了第幾站","看到外婆揮手的時候","走出車站的時候"],"ans":"B","steps":["證據：「心跳得好快」「差點就要哭出來」","這是在聽不清楚廣播的時候","看到外婆時已經是開心的結尾"],"tests":"找心情高峰","avoid":"找最強烈的心情字"},{"q":"是什麼讓「我」冷靜下來？","opts":["請旁邊的人幫忙","打電話給媽媽","在下一站先下車","拿出紙條，對照車門上方的站名"],"ans":"D","steps":["轉折詞「這時」後面：「我想起那張紙條」","對照站名，才知道下一站就要下車","文中沒提問人或打電話"],"tests":"找轉折點","avoid":"「這時」後面就是轉折"},{"q":"結尾「那一刻，我覺得自己長大了」，表現什麼心情？","opts":["害怕，不想再自己搭車","難過，因為外婆沒來接","生氣，因為媽媽沒有陪","驕傲，對自己有了信心"],"ans":"D","steps":["他「大聲地說：『我自己來的！』」","外婆在出口揮手，是有來接","所以是完成挑戰的驕傲"],"tests":"結尾心情","avoid":"結尾的話，看語氣和動作"}]}]},{"no":"週末關卡","title":"馬說","skill":"國一課文綜合（寫景＋記敘＋議論＋字義）","steps":["❶ 先判斷文章類型：寫景？記敘？議論？","❷ 寫景找景與情；記敘找起因經過結果；議論找論點論據","❸ 字義用五招：先組詞代回，再看上下文驗證","❹ 主旨題：用一句話說出作者想說什麼","完成後錄一支 60 秒「古文翻譯官」短片"],"demo":{"q":"「世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。」這是哪一種文章？作者想說什麼？","a":["→ 沒有在講景色，也不是在說一件事的經過，而是在說道理 → 議論","→ 「而」是轉折：千里馬「常有」，伯樂卻「不常有」","答：議論文；作者想說好馬常有，懂得賞識好馬的人很少"]},"parts":[{"label":"第一篇","title":"馬說","text":["世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，祇辱於奴隸人之手，駢死於槽櫪之間，不以千里稱也。","馬之千里者，一食或盡粟一石。食馬者不知其能千里而食也。是馬也，雖有千里之能，食不飽，力不足，才美不外見，且欲與常馬等不可得，安求其能千里也？","策之不以其道，食之不能盡其材，鳴之而不能通其意，執策而臨之，曰：「天下無馬。」嗚呼！其真無馬邪？其真不知馬也！"],"cite":"韓愈〈馬說〉","notes":"伯樂：善於看出好馬的人　辱：受委屈　奴隸人：僕役，指養馬的人　駢死：一起死去　槽櫪：餵馬的槽和馬棚　或：有時　粟：小米　石：古代容量單位　見：同「現」，顯現　等：一樣　安：怎麼　材：同「才」，才能　臨：面對　邪：同「耶」，嗎","trans":"世上有了伯樂，然後才有千里馬。千里馬常常有，可是伯樂不常有。所以即使有名貴的馬，也只能在僕役手中受委屈，和普通的馬一起死在馬棚裡，不能憑日行千里而出名。能日行千里的馬，一頓有時要吃完一石小米。餵馬的人不知道牠能日行千里而照一般方式餵牠。這樣的馬，雖然有日行千里的能力，卻吃不飽，力氣不足，才能和優點表現不出來，想要和普通的馬一樣都做不到，怎麼能要求牠日行千里呢？鞭打牠不用正確的方法，餵牠不能讓牠發揮才能，牠叫了卻不懂牠的意思，拿著鞭子面對牠說：「天下沒有好馬。」唉！難道真的沒有好馬嗎？是他們真的不認識好馬啊！","qs":[{"q":"「食馬者不知其能千里而食也」，前一個「食」是什麼意思？","opts":["食物","吃掉","餵","糧食"],"ans":"C","steps":["組詞「食物」，代回「食物馬的人」→ 不通","第二招看情境：前句馬「一食或盡粟一石」，是人給馬吃","所以「食馬者」＝餵馬的人"],"tests":"一字多義：食","avoid":"同一個字，要看是誰對誰做"},{"q":"作者用千里馬比喻什麼？","opts":["有才能的人","跑得快的運動員","很會養馬的人","皇帝"],"ans":"A","steps":["千里馬：有能力卻被埋沒，在奴隸人手中受委屈","伯樂：懂得賞識的人","所以千里馬比喻有才能卻沒被發現的人"],"tests":"議論：比喻論證","avoid":"寫物的議論文，要問物代表誰"},{"q":"「千里馬常有，而伯樂不常有」，這句是全文的什麼？","opts":["起因：馬吃不飽","結果：天下真的沒有好馬","寫景：描寫馬棚","論點：人才常有，懂得賞識人才的人很少"],"ans":"D","steps":["這句在說道理，不是在寫景或說事情經過","全文後面都在證明：馬被埋沒，是因為沒人認識牠","最後「其真不知馬也」呼應這句"],"tests":"議論：論點","avoid":"全文都在證明的那句，就是論點"},{"q":"最後「其真無馬邪？其真不知馬也！」是什麼意思？","opts":["天下真的沒有好馬了","好馬都跑到別的地方","不是真的沒有好馬，是他們真的不認識好馬","作者自己也不認識好馬"],"ans":"C","steps":["前一句是反問：真的沒有好馬嗎？＝不是沒有","後一句是感嘆：真的是不認識馬啊","答案和「天下無馬」正好相反"],"tests":"反問＋主旨","avoid":"反問句後面常接作者的真正答案"}]},{"label":"第二篇","title":"桃花源記","text":["晉太元中，武陵人捕魚為業。緣溪行，忘路之遠近。忽逢桃花林，夾岸數百步，中無雜樹，芳草鮮美，落英繽紛，漁人甚異之。","復前行，欲窮其林。林盡水源，便得一山，山有小口，彷彿若有光。便捨船，從口入。"],"cite":"陶淵明〈桃花源記〉（節選開頭）","notes":"太元：晉孝武帝的年號　武陵：地名　為業：當作職業　逢：遇到　夾岸：兩岸　鮮美：鮮豔美麗　落英：落花　繽紛：繁多交雜的樣子　林盡水源：桃林在溪水的源頭結束　彷彿：好像","trans":"晉朝太元年間，有一個武陵人以捕魚為職業。他沿著溪水划船，忘了走了多遠。忽然遇到一片桃花林，夾著溪岸長了幾百步，中間沒有別的樹，芳草鮮豔美麗，落花繁多。漁人覺得非常奇怪。他又往前走，想走到這片林子的盡頭。桃林在溪水的源頭結束，接著就看到一座山，山上有個小洞口，好像有光。他就離開船，從洞口進去。","qs":[{"q":"「緣溪行」的「緣」是什麼意思？","opts":["緣分","沿著","原因","邊緣地帶"],"ans":"B","steps":["組詞「緣分」，代回「緣分溪水走」→ 不通","組詞「邊緣」想到「沿著邊」，代回「沿著溪水走」→ 通","驗證：他是捕魚人，划船就是順著溪走"],"tests":"字義：緣","avoid":"第一個組詞不通，換一個再試"},{"q":"「欲窮其林」的「窮」是什麼意思？","opts":["貧窮","窮困","走到盡頭","追趕"],"ans":"C","steps":["組詞「貧窮」代回「想要貧窮這片林」→ 不通","組詞「無窮」＝沒有盡頭，代回「想走到林子的盡頭」→ 通","驗證：下一句「林盡水源」，林子真的走完了"],"tests":"字義：窮","avoid":"下一句常常是上一句的結果"},{"q":"漁人為什麼「甚異之」？","opts":["桃花林很美，又沒有別的雜樹，覺得很特別","他第一次看到溪水","林子裡有野獸","他迷路找不到家"],"ans":"A","steps":["「甚異之」前面：中無雜樹，芳草鮮美，落英繽紛","一大片只有桃花，景色奇特","所以他覺得奇怪"],"tests":"寫景：找原因","avoid":"心情字前面的景物，就是原因"},{"q":"這段記敘的經過，哪一個順序正確？","opts":["遇到桃花林 → 沿溪捕魚 → 從山洞進去 → 走到林子盡頭","從山洞進去 → 遇到桃花林 → 沿溪捕魚 → 走到林子盡頭","沿溪捕魚 → 從山洞進去 → 走到林子盡頭 → 遇到桃花林","沿溪捕魚 → 遇到桃花林 → 走到林子盡頭 → 從山洞進去"],"ans":"D","steps":["第一段：緣溪行 → 忽逢桃花林","第二段：欲窮其林 → 林盡水源，便得一山","最後：便捨船，從口入"],"tests":"記敘：順序","avoid":"圈出「忽、復、便」，照順序排"}]},{"label":"第三篇","title":"醉翁亭記","text":["峰回路轉，有亭翼然臨於泉上者，醉翁亭也。作亭者誰？山之僧智仙也。名之者誰？太守自謂也。太守與客來飲於此，飲少輒醉，而年又最高，故自號曰醉翁也。醉翁之意不在酒，在乎山水之間也。山水之樂，得之心而寓之酒也。"],"cite":"歐陽修〈醉翁亭記〉（節選）","notes":"峰回路轉：山勢迴環，路跟著轉彎　翼然：像鳥張開翅膀的樣子　臨：靠近　僧：和尚　太守：地方長官，這裡是歐陽修自己　謂：稱呼　輒：就　號：別號","trans":"山勢迴環，道路跟著轉彎，有一座亭子像鳥張開翅膀一樣，高踞在泉水上方，這就是醉翁亭。建亭子的是誰？是山裡的和尚智仙。替它取名的是誰？是太守用自己的別號稱呼它。太守和客人來這裡喝酒，喝一點就醉了，而且年紀又最大，所以自己取別號叫「醉翁」。醉翁的心意不在喝酒，而在欣賞山水美景。欣賞山水的樂趣，領會在心裡，寄託在喝酒上。","qs":[{"q":"「名之者誰？」的「名」是什麼意思？","opts":["名字","取名字","有名","名人"],"ans":"B","steps":["組詞「名字」，代回「名字它的人是誰？」→ 不通","後面接「之」，名詞當動作：取名字","驗證：答句「太守自謂也」，是太守用自己的號稱呼它"],"tests":"詞類活用：名","avoid":"名詞後面接「之」，常當動作讀"},{"q":"太守為什麼自號「醉翁」？","opts":["每天都喝很多酒","他很喜歡釀酒","喝一點就醉，年紀又最大","客人都叫他醉翁"],"ans":"C","steps":["證據：「飲少輒醉，而年又最高，故自號曰醉翁也」","「故」前面就是原因：飲少輒醉＋年最高","文中說「自號」，不是客人取的"],"tests":"因果：找原因","avoid":"看到「故」，往前找原因"},{"q":"「醉翁之意不在酒」，醉翁真正喜歡的是什麼？","opts":["喝酒","和尚智仙","山水美景","當太守"],"ans":"C","steps":["下一句：「在乎山水之間也」","又說「山水之樂，得之心而寓之酒也」","酒只是寄託，真正樂的是山水"],"tests":"寫景抒情","avoid":"「不在……在乎……」要看後半"},{"q":"「山水之樂，得之心而寓之酒也」的意思最接近哪一個？","opts":["山水和酒一樣好喝","喝了酒才看得到山水","心裡不快樂才去喝酒","欣賞山水的快樂在心裡，藉著喝酒表現出來"],"ans":"D","steps":["「得之心」：領會在心裡","「寓之酒」：寓組詞「寓言、寄寓」＝寄託，寄託在酒上","合起來：樂在心中，用喝酒表達"],"tests":"句意","avoid":"把句子拆成兩半，一半一半翻"}]},{"label":"第四篇","title":"三峽","text":["自三峽七百里中，兩岸連山，略無闕處。重巖疊嶂，隱天蔽日，自非亭午夜分，不見曦月。","至於夏水襄陵，沿溯阻絕。或王命急宣，有時朝發白帝，暮到江陵，其間千二百里，雖乘奔御風，不以疾也。"],"cite":"酈道元《水經注．江水》（節選）","notes":"略無：完全沒有　闕：同「缺」，空缺　重巖疊嶂：一層層的山峰　隱：遮住　自非：如果不是　亭午：正午　夜分：半夜　曦：太陽　襄：漫上　陵：山丘　或：有時　宣：傳達　白帝：白帝城　江陵：地名　奔：飛奔的馬　御風：駕著風","trans":"在三峽七百里之間，兩岸都是相連的山，完全沒有中斷的地方。重重疊疊的山峰，遮住了天空和太陽，如果不是正午和半夜，就看不見太陽和月亮。到了夏天江水漫上山丘，順流和逆流的船都被阻斷。有時皇帝的命令要緊急傳達，早上從白帝城出發，傍晚就到江陵，這中間有一千二百里，即使騎著飛奔的馬、駕著風，也沒有這麼快。","qs":[{"q":"「自非亭午夜分，不見曦月」說明三峽的什麼特點？","opts":["三峽常常下雨","三峽晚上沒有月亮","三峽的太陽特別大","山又高又密，只有正午和半夜才看得到太陽或月亮"],"ans":"D","steps":["前句：「重巖疊嶂，隱天蔽日」，山把天都遮住","只有太陽、月亮在正上方時，才照得進來","所以是寫山高、山密"],"tests":"寫景：找特點","avoid":"寫看不到天，其實在寫山"},{"q":"「夏水襄陵，沿溯阻絕」是什麼意思？","opts":["夏天江水漲到淹上山丘，上下行的船都被阻斷","夏天江水乾了，船走不動","夏天大家都去山上避暑","夏天的水很平靜，適合划船"],"ans":"A","steps":["襄＝漫上，陵＝山丘：水淹上山丘","沿組詞「沿著」＝順流，溯組詞「溯溪」＝逆流，阻絕＝都被擋住","所以水大又急，船不能走"],"tests":"句意","avoid":"注釋的字一個一個代回去"},{"q":"「雖乘奔御風，不以疾也」的「疾」是什麼意思？","opts":["疾病","痛恨","嫉妒","快"],"ans":"D","steps":["組詞「疾病」，代回「也沒有這樣生病」→ 不通","組詞「疾駛」＝快，代回「也沒有這麼快」→ 通","驗證：前句早上出發、傍晚就走了千二百里，在比速度"],"tests":"字義：疾","avoid":"前後在比什麼，答案就跟什麼有關"},{"q":"「朝發白帝，暮到江陵」和李白「千里江陵一日還」，都在強調什麼？","opts":["白帝城和江陵很近","江水流得非常快","坐船很危險","江陵的風景很美"],"ans":"B","steps":["本文：一天走千二百里，比快馬、風還快","李白詩也是一天就從白帝到江陵","兩者都在寫三峽水流湍急"],"tests":"互文對讀","avoid":"兩篇寫同一件事，找相同點"}]},{"label":"第五篇","title":"幽夢影選","text":["少年讀書，如隙中窺月；中年讀書，如庭中望月；老年讀書，如臺上玩月。皆以閱歷之淺深，為所得之淺深耳。","律己宜帶秋氣，處世宜帶春氣。"],"cite":"張潮《幽夢影》（節選）","notes":"隙：縫隙　窺：偷看　庭：庭院　玩：欣賞　閱歷：人生的經歷　所得：得到的收穫　律己：要求自己　處世：和別人相處","trans":"少年時讀書，像從縫隙裡偷看月亮；中年時讀書，像在庭院裡望月亮；老年時讀書，像在高臺上賞月亮。都是因為經歷的深淺，決定了收穫的深淺。要求自己應該帶著秋天般的嚴肅，和別人相處應該帶著春天般的溫和。","qs":[{"q":"「隙中窺月」「庭中望月」「臺上玩月」，看到的月亮會怎麼變？","opts":["越來越小、模糊","越來越寬廣、完整","都一樣大","越來越暗"],"ans":"B","steps":["縫隙裡只看到一點點；庭院看到較多","高臺上視野最開闊，看得最完整","所以是越來越寬廣"],"tests":"比喻：找變化","avoid":"把三個比喻排在一起比較"},{"q":"第一則的論點是什麼？","opts":["少年人不必讀書","讀書的收穫深淺，取決於人生經歷的深淺","晚上讀書最好","月亮越看越漂亮"],"ans":"B","steps":["最後一句：「皆以閱歷之淺深，為所得之淺深耳」","前面三個看月的比喻，都在證明這句","文中沒說少年不必讀書"],"tests":"議論：論點","avoid":"比喻後面的總結句就是論點"},{"q":"「律己宜帶秋氣」是什麼意思？","opts":["要求自己要像秋天一樣嚴肅","秋天要多穿衣服","要求別人要很嚴格","做人要像秋天一樣悲傷"],"ans":"A","steps":["律己＝要求自己","秋氣：秋天天氣清冷、肅殺，比喻嚴格","對象是「己」，不是別人"],"tests":"句意：比喻","avoid":"先看對象是誰，再看比喻"},{"q":"「處世宜帶春氣」想告訴我們什麼？","opts":["對待別人要像春天一樣溫和","春天要多出去玩","做事要很急躁","對別人也要很嚴格"],"ans":"A","steps":["處世＝和別人相處","春氣：春天溫暖，比喻和氣、溫和","和前句對比：對己嚴，對人寬"],"tests":"對稱句","avoid":"兩句對著看，意思常相反"}]}]}],"teach":[{"intro":"國一課文試讀第一關：寫景的文章，景物背後一定藏著心情。","items":[{"t":"什麼是「寫景抒情」？","d":["作者先寫看到的景物，再借景物說出自己的心情或想法。","〈記承天寺夜遊〉：先寫月光像積水，最後說「但少閒人如吾兩人者耳」。"],"ex":"就像你拍一張夕陽下的籃球場照片，配上一句「今天練得好累但好開心」。"},{"t":"景物怎麼寫？","d":["看顏色（綠、青、縹碧）、比喻（如積水、甚箭）、動靜（佁然不動、俶爾遠逝）。","寫魚游在空中，其實是在寫水很清。"]},{"t":"心情字在哪裡？","d":["常在寫景句的最後：欣然、相樂、淒神寒骨。","同一篇心情可能會變：〈小石潭記〉從「相樂」變成「淒神寒骨」。"],"ex":"就像柴犬：看到牽繩搖尾巴，被留在家就趴著不動，心情跟著場景變。"}],"demo":["材料：「潭中魚可百許頭，皆若空游無所依……似與遊者相樂。」","找景物：魚、日光、影子；寫法：魚好像游在空中 → 水很清","找心情：「相樂」→ 作者很快樂"]},{"intro":"國一課文試讀第二關：讀記敘文，先抓事情的來龍去脈，再看人物。","items":[{"t":"起因、經過、結果","d":["起因：事情怎麼開始；經過：中間發生什麼；結果：最後怎樣。","〈兒時記趣〉：看蟲打架 → 蝦蟆吞蟲 → 鞭打蝦蟆、趕走。"],"ex":"就像一場比賽：開賽跳球、中間你來我往、最後的比分。"},{"t":"人物描寫看哪裡？","d":["看外貌、動作、說話、心情，再問「他是怎樣的人」。","宋濂「手指不可屈伸，弗之怠」→ 動作寫出他勤學不怕苦。"]},{"t":"性格要有證據","d":["說一個人「有耐心」或「沒耐心」，都要找到原文句子。","項羽「學書不成，去學劍，又不成」「又不肯竟學」→ 缺乏耐心。"],"ex":"就像教練說你「很拚」，一定是看到你撲地救球。"}],"demo":["材料：「錄畢，走送之，不敢稍逾約。以是人多以書假余。」","經過：抄完就跑著還書，不敢超過約定日期","結果：「以是」後面 → 大家願意借書給他"]},{"intro":"國一課文試讀第三關：議論文是在「說服你」，找出作者的主張和證據。","items":[{"t":"什麼是「論點」？","d":["作者最想說服你的那句話，常在開頭或結尾。","〈學記〉最後：「故曰：教學相長也。」"],"ex":"就像教練說：「防守贏得冠軍。」這就是他的論點。"},{"t":"什麼是「論據」？","d":["用來證明論點的材料：真實的事、比喻、名人的話。","〈傷仲永〉用仲永的真實經過；〈勸學〉用積土成山、駑馬十駕的比喻。"],"ex":"教練拿出上一季失分最少的球隊拿冠軍，這就是論據。"},{"t":"怎麼檢查？","d":["用一句話說：作者用＿＿＿，證明＿＿＿。","〈顏氏家訓〉：用日出之光、秉燭夜行，證明晚學也勝過不學。"]}],"demo":["材料：「雖有嘉肴，弗食，不知其旨也……故曰：教學相長也。」","論點：「故曰」後面 → 教學相長","論據：用吃菜作比喻，再說學和教都能讓人進步"]},{"intro":"國一課文試讀第四關：讀唐詩，找出詩人的心情，再看他用什麼方法寫。","items":[{"t":"送別詩、思鄉詩怎麼讀？","d":["先看題目：「送」是送別，「憶」是思念。","再找景物：柳、酒、關、月、茱萸，常和離別、想家有關。"],"ex":"就像畢業典禮上的照片：同一張球場，看起來特別捨不得。"},{"t":"常見寫法","d":["從對方寫：「遙知兄弟登高處」，寫家人想自己。","小事寫大愛：「臨行密密縫」；擬人：「好雨知時節」。"]},{"t":"反問句","d":["「誰言寸草心，報得三春暉」＝誰說報答得了？其實報答不完。","反問句要翻成肯定的意思再讀。"],"ex":"就像隊友說：「這球誰投得進？」意思是「沒人投得進」。"}],"demo":["材料：「勸君更盡一杯酒，西出陽關無故人。」","動作：勸酒；原因：出了陽關就沒有老朋友","心情：依依不捨"]},{"intro":"國一課文試讀第五關：讀白話記敘文，畫出主角的心情曲線。","items":[{"t":"心情字和動作","d":["心情字：緊張、害怕、開心；動作也能看出心情：把考卷塞到書包最底層。","比喻也在寫心情：「腳就像灌了鉛一樣重」。"],"ex":"就像柴犬耳朵往後貼，你就知道牠在害怕。"},{"t":"轉折詞","d":["可是、卻、沒想到、突然、這時、後來。","轉折詞後面，常是讓心情改變的那件事。"]},{"t":"心情曲線","d":["開始 → 轉折 → 結尾，每段找一個心情字。","〈第一次上場比賽〉：興奮緊張 → 丟臉 → 振作 → 開心。"],"ex":"就像一場比賽的比分圖：落後、追分、反超。"}],"demo":["材料：「我小聲地拿出考卷，以為他會生氣。沒想到，他坐下來陪我一題一題看。」","轉折詞：「以為……沒想到」","心情：從害怕被罵，轉為安心"]},{"intro":"國一課文綜合關卡：先判斷文章類型，再用對的招式。","items":[{"t":"三種文章，三種讀法","d":["寫景：找景物、找心情（〈醉翁亭記〉〈三峽〉）。","記敘：起因經過結果（〈桃花源記〉）；議論：論點論據（〈馬說〉〈幽夢影〉）。"],"ex":"就像看對手陣型，先判斷是區域還是人盯人，再決定怎麼進攻。"},{"t":"字義五招再複習","d":["① 組詞代回 → ② 看人物動作目的驗證 → ③ 部首 → ④ 對稱句 → ⑤ 成語。","「名之者誰」：組詞「名字」不通 → 名詞當動作＝取名。"]},{"t":"主旨一句話","d":["最後問：作者到底想說什麼？","〈馬說〉：千里馬常有，伯樂不常有 → 人才需要被賞識。"]}],"demo":["材料：「醉翁之意不在酒，在乎山水之間也。」","類型：寫景抒情","「不在……在乎……」→ 真正喜歡的是山水美景"]}],"daily":[{"words":[["寢","睡覺","廢寢忘食"],["遂","於是、就","遂至承天寺"]],"line":"山不在高，有仙則名。水不在深，有龍則靈。"},{"words":[["假","借","狐假虎威"],["怠","懈怠、偷懶","怠惰"]],"line":"好讀書，不求甚解；每有會意，便欣然忘食。"},{"words":[["鍥","刻","鍥而不舍"],["旨","美味","不知其旨也"]],"line":"不積跬步，無以至千里；不積小流，無以成江海。"},{"words":[["倍","更加","每逢佳節倍思親"],["暉","陽光","春暉"]],"line":"獨在異鄉為異客，每逢佳節倍思親。"},{"words":[["祇","只","祇辱於奴隸人之手"],["疾","快","疾風知勁草"]],"line":"千里馬常有，而伯樂不常有。"},null],"quiz":{"words":[["寢","睡覺","懷民亦未寢"],["遂","於是、就","遂至承天寺尋張懷民"],["假","借","每假借於藏書之家"],["怠","懈怠、偷懶","手指不可屈伸，弗之怠"],["鍥","刻","鍥而不舍，金石可鏤"],["旨","美味","雖有嘉肴，弗食，不知其旨也"],["倍","更加","每逢佳節倍思親"],["暉","陽光","誰言寸草心，報得三春暉"],["祇","只","祇辱於奴隸人之手"],["疾","快","雖乘奔御風，不以疾也"]],"lines":[["山不在高，有仙則名。","水不在深，有龍則靈。"],["好讀書，不求甚解；","每有會意，便欣然忘食。"],["不積跬步，無以至千里；","不積小流，無以成江海。"],["獨在異鄉為異客，","每逢佳節倍思親。"],["千里馬常有，","而伯樂不常有。"]],"parts":[{"label":"第一篇","title":"鐵杵磨針","text":["磨針溪，在象耳山下。世傳李太白讀書山中，未成，棄去。過是溪，逢老媼方磨鐵杵，問之，曰：「欲作針。」太白感其意，還卒業。"],"cite":"祝穆《方輿勝覽》（節選）","notes":"象耳山：山名，在今四川　世傳：世代流傳　李太白：李白，字太白　逢：遇到　老媼：老婆婆　杵：粗棒子","trans":"磨針溪在象耳山下。世代流傳，李白在山中讀書，還沒完成學業，就放棄離開了。經過這條溪，遇到一位老婆婆正在磨一根鐵棒，李白問她做什麼，她說：「想把它磨成針。」李白被她的心意感動，就回去完成了學業。","qs":[{"q":"「未成，棄去」，是誰沒有完成、放棄離開？","opts":["老婆婆","象耳山的和尚","磨針的工人","李白"],"ans":"D","steps":["往前找最近的人：「世傳李太白讀書山中」","讀書沒讀完就離開的，是李白","老婆婆是後面才出現的"],"tests":"補主詞","avoid":"主詞省略，往前找最近的人"},{"q":"「過是溪」的「是」是什麼意思？","opts":["是非的是","正確","這","於是"],"ans":"C","steps":["組詞「是非」，代回「經過是非溪」→ 不通","代「這」：「經過這條溪」→ 通","驗證：開頭就在說「磨針溪」，這條溪＝磨針溪"],"tests":"字義：是","avoid":"「是」在名詞前，常常是「這」"},{"q":"「逢老媼方磨鐵杵」的「方」是什麼意思？","opts":["正在","方向","方形","藥方"],"ans":"A","steps":["組詞「方向」代回「方向磨鐵棒」→ 不通","代「正在」：「遇到老婆婆正在磨鐵棒」→ 通","〈兒時記趣〉「方出神」也是「正」"],"tests":"字義：方","avoid":"「方」在動作前，先代「正在」"},{"q":"「太白感其意，還卒業」是什麼意思？","opts":["李白覺得老婆婆很可憐，送她一根針","李白感冒了，回家休息","李白被老婆婆的心意感動，回去完成學業","李白還給老婆婆鐵棒，然後畢業了"],"ans":"C","steps":["感＝被感動，其意＝老婆婆想把鐵杵磨成針的心意","組詞「卒業」：卒＝完成，回去完成學業","和前面「未成，棄去」正好相反"],"tests":"句意","avoid":"結尾常和開頭的問題相反"},{"q":"這個故事告訴我們什麼道理？","opts":["只要有恆心，再難的事也能完成","鐵棒不能磨成針","讀書不如去溪邊玩","老人做事都很慢"],"ans":"A","steps":["鐵杵磨成針，是很難、很久的事","李白看了被感動，回去把書讀完","道理：有恆心就能成功"],"tests":"寓言道理","avoid":"主角改變的原因，就是道理"}]},{"label":"第二篇","title":"樂羊子拾金","text":["羊子嘗行路，得遺金一餅，還以與妻。妻曰：「妾聞志士不飲盜泉之水，廉者不受嗟來之食，況拾遺求利，以汙其行乎！」羊子大慚，乃捐金於野，而遠尋師學。"],"cite":"《後漢書．列女傳》（節選）","notes":"遺金：別人掉的金子　餅：塊　妾：古代婦女的謙稱　志士：有志氣的人　盜泉：泉水名，因名字不好，有志氣的人不喝　廉者：品行清白的人　嗟來之食：帶著侮辱的施捨　況：何況　汙：弄髒　行：品行","trans":"樂羊子曾經在路上走，撿到別人掉的一塊金子，回家拿給妻子。妻子說：「我聽說有志氣的人不喝盜泉的水，品行清白的人不接受帶著侮辱的施捨，何況是撿別人掉的東西來謀取利益，弄髒自己的品行呢！」羊子非常慚愧，就把金子丟到野外，然後到遠方拜師求學。","qs":[{"q":"「羊子嘗行路」的「嘗」是什麼意思？","opts":["嘗試","品嘗","曾經","常常"],"ans":"C","steps":["組詞「嘗試」，代回「嘗試在路上走」→ 不通","代「曾經」：「曾經在路上走」→ 通","驗證：只撿到一次金子，是過去的一件事，不是「常常」"],"tests":"字義：嘗","avoid":"「嘗」在動作前，先代「曾經」"},{"q":"「還以與妻」是什麼意思？","opts":["妻子把金子還給失主","羊子回家把金子拿給妻子","羊子把金子還給失主","妻子和羊子一起回家"],"ans":"B","steps":["補主詞：撿到金子的是羊子，接著做事的也是他","還＝回家，以＝拿，與＝給","後面「妻曰」：妻子看到金子才說話"],"tests":"補主詞＋句意","avoid":"主詞沒換，就是同一個人"},{"q":"妻子說「志士不飲盜泉之水，廉者不受嗟來之食」，用意是什麼？","opts":["提醒羊子不要喝路邊的水","說家裡沒有東西吃","稱讚羊子撿到金子很幸運","有志氣的人連不好的東西都不碰，更不該撿別人的錢謀利"],"ans":"D","steps":["後面接「況拾遺求利」：何況是撿別人的東西","先舉兩個例子，再說撿金子更不應該","所以是勸羊子不要貪這筆錢"],"tests":"推論：說話目的","avoid":"看到「況」，後面才是重點"},{"q":"「乃捐金於野」的「捐」是什麼意思？","opts":["捐款給別人","丟棄","撿起來","藏起來"],"ans":"B","steps":["組詞「捐款」，代回「把金子捐給野外」→ 不通","第二招看人物目的：羊子「大慚」，不要這筆不義之財","所以是把金子丟到野外，古今意思不同"],"tests":"古今異義：捐","avoid":"古今不同的字，要看人物想做什麼"},{"q":"樂羊子聽了妻子的話以後，有什麼改變？","opts":["感到慚愧，丟掉金子，到遠方拜師求學","把金子藏起來留著用","和妻子吵了一架","拿金子去買書"],"ans":"A","steps":["證據：「羊子大慚，乃捐金於野，而遠尋師學」","大慚＝很慚愧；遠尋師學＝到遠方拜師","文中沒有吵架或用金子買東西"],"tests":"因果：結果","avoid":"「乃」後面就是結果"}]}]},"cap":{"no":"會考實戰","title":"第 7 週會考實戰","skill":"會考解題技法：找線索接句子","steps":["❶ 先看空格前後緊貼的連接詞：所以、但是、因此、此外、故","❷ 圈出指稱的詞（這、此、其、之、後者），往前後找它指誰","❸ 找重複出現或成對的詞，前句說什麼，後句就要對得上","❹ 甲乙文比較：先各寫一句重點，再列出相同和不同","❺ 選好以後整句代回去讀一遍，通順才算數"],"demo":{"q":"示範題：【110 年會考第 19 題】「________。所以，我們寧願放掉功課而選擇看漫畫、滑手機，因後者帶來的快樂往往是立即的。此外，開心時大腦會分泌多巴胺，讓人容易重複相同的行為，難怪我們會不斷看漫畫、滑手機，直到考試時間逼近，才開始熬夜抱佛腳。」根據文意脈絡，畫線處填入下列何者最恰當？　①距離考試越近，讀書的效果越好　②時間越晚，大腦分泌的多巴胺越多　③人類等待報酬的時間越短，動力越強　④重複相同行為的次數越多，人們越快樂","a":["→ 空格後面緊接「所以」：空格是原因，後面是結果","→ 結果的理由是「因後者帶來的快樂往往是立即的」：快樂來得越快，越想去做","→ 「此外」帶出的多巴胺是第二個理由，不是空格要放的，刪掉第二、第四個選項；第一個選項和立即的快樂無關","答：③人類等待報酬的時間越短，動力越強"]},"teach":{"intro":"接句子就像傳球：每一句都會留下線索，告訴你下一句該傳到哪裡。","items":[{"t":"什麼是「連接詞」？","d":["連接詞是句子之間的路標，告訴你前後是什麼關係","因果：因為／所以、故；轉折：但是、然而、卻；條件：只要／就、只有／才；讓步：即使／也；選擇：與其／不如"],"ex":"像教練喊戰術：喊「快攻」就往前衝，喊「回防」就往後跑。路標一出現，下一句的方向就決定了。"},{"t":"什麼是「指稱詞」？","d":["這、那、此、其、之、前者、後者，都是代替前面講過的東西","看到它們，往前（有時往後）找最近、最說得通的那個東西"],"ex":"你對柴犬說「去把它撿回來」，牠會看你剛剛丟的是哪顆球，而不是隨便叼一顆。"},{"t":"什麼是「重複詞」和「對稱句」？","d":["文章前面出現的詞，後面常常再出現，或換成相反的詞","古文最愛成對：前句「學者如取水」，後句就是「教者如分火」，填空也要一對一接上"],"ex":"像上籃的三步：左腳踏完一定接右腳。前面出現「學者」，後面就等著「教者」。"},{"t":"什麼是「甲乙文比較」？","d":["兩篇文章講同一件事，說法可能一樣，也可能不一樣","先各用一句話寫出重點，再分兩欄：相同的地方、不同的地方；題目說「兩文皆」，兩篇都要找到證據"],"ex":"像比兩場比賽的數據：先看各自得幾分，再比誰籃板多、誰失誤少。"}],"demo":["①空格後面有「所以」→ 空格放的是原因","②後面說快樂是「立即的」→ 原因和「等得越短」有關","③把第三個選項代回去讀：等待報酬的時間越短，動力越強，所以選擇看漫畫、滑手機 → 通順"]},"parts":[{"label":"第一篇","title":"110 年會考 第 1 題","text":[],"cite":"110 年國中教育會考國文科 第 1 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列文句中的連詞，何者使用最恰當？","opts":["即使生活變得富裕，也不應該浪費","除非是很小的錯誤，也可能釀成大害","只有從根本解決，就能為人民改善生活","與其老師怎樣費心勸說，他還是我行我素"],"ans":"A","steps":["用第一招看連接詞：「即使……也」是讓步，就算生活富裕了，也不該浪費，前後搭得起來","其他三個都配錯：第二句要說「就算是小錯也可能釀成大害」，該用「即使……也」，不是「除非」；第三句「只有」要配「才」（或改成「只要……就」）；第四句意思是「不管老師怎麼勸」，該用「無論」，「與其」要配「不如」","所以答案是「即使生活變得富裕，也不應該浪費」"],"tests":"連接詞的搭配","avoid":"連接詞要成對記：只有／才、與其／不如"}]},{"label":"第二篇","title":"111 年會考 第 22 題","text":[],"cite":"111 年國中教育會考國文科 第 22 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"「學者如取水，終日取而不能踰其量，故操瓢者止於瓢，操盎者止於盎；教者如分火，終日分而未嘗虧其體，故散為十燈而明自若，散為千燈而明自若。故善學者________，善教者________。」根據文意脈絡，畫線處依序填入下列何者最恰當？","opts":["不自隘其器／不自吝其光","如逆水行舟／似雪中取火","宜自知其量／宜自晦其光","無一時之患／有終身之憂"],"ans":"A","steps":["找重複詞與對稱句：前面「學者如取水」對「教者如分火」，空格前「善學者」對「善教者」，一格接一個比喻","取水會被容器限制（拿瓢的只取得到一瓢），所以會學的人不把自己的「器」弄小；分火不會讓火變暗，所以會教的人不吝嗇自己的「光」","兩格都扣住「器」和「光」的只有「不自隘其器／不自吝其光」"],"tests":"文言對稱句填空","avoid":"空格前找比喻，填空要接回同一個比喻"}]},{"label":"第三篇","title":"110 年會考 第 39～41 題（題組）","text":["颱風來了。","颱風來自遙遠的海面，總是選擇花蓮為登陸地點。在夏天漫長而炎熱的一長串又一長串日子裡，有時我們會感覺天地間突然好像有一點反常的運作，日頭黯淡，到處吹著不緩不急的風。起先就是這樣的，那風也不是夏日海邊習習的涼風，帶著一層鬱燠的氣息，甚至是溫熱的，但又沒有一點溼意。樹葉飄飄自相拍打，螞蟻在牆角匆忙地奔走，隔壁院子裡的公雞奇怪地和帶著小雛的母雞一起擠在雨廊下，很不安地東張西望，電線桿上的麻雀都不知道飛到哪裡去了。若是抬頭看後面的大山，你會發覺那山比平時更清朗更明亮，樹木歷歷可數，蒼翠裡彷彿鍍著一層銀光。","起先是陣陣急雨被強風颳來，擊打鐵皮屋頂和木板牆。坐在榻榻米上，我什麼都看不見，只聽到風雨的聲音一陣比一陣大。那時我可以想像，來了來了，從遙遠的海面正有一團黑黑的氣體向花蓮這個方向滾來，以一定的速度，挾萬頃雨水，撕裂廣大的天幕，正向這個方面滾來，空中的雲煙激越若沸水，海水翻騰搖擺，憤怒地向陸地投射。我坐在昏黃的電燈下專心聽颱風猛烈地拍著，搖著，呼吼著。我傾耳再聽，可以感覺到海岸上狂濤攻擊防波堤的號角和鼙鼓，一陣急似一陣，而天就這樣黑下來了。","是的，颱風從海上來，迅速撲向這低伏在山下的小城。在風球一一升起之後，我們知道風將帶著巨量的雨水□□過小城的上空，把一些大樹連根拔起，把籬笆一一掀倒，把電線桿推翻，甚至把誰家將就的屋頂吹跑，把橋梁和鐵路移動一個位置，讓山石和泥濘□入公路，堵住來往的交通。在我幼小的心靈裡，颱風帶來一個狂暴的奇異的夜，電燈不亮了，小桌上點一根蠟燭，火光在轟然的黑暗裡搖晃，有時突然□出一朵花來。我瞪著那燭光看，聽風雨呼嘯通過，似乎不會有停止的時候，然後眼睛就累了。醒來時發現自己還是安全地躺在蚊帳裡，風雨早已停了，明亮的光線透過窗上那木板的隙縫照在我臉上，很安靜，只有帳外一隻蚊子飛行的嚶嗡，和平常一樣在清晨的微涼中飄忽來去。颱風已經遠遠走了。","――改寫自楊牧〈戰火在天外燃燒〉"],"cite":"110 年國中教育會考國文科 第 39～41 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文最後一段的文意脈絡，空格處依序應填入下列何者最恰當？","opts":["狂奔／傾／爆","散步／堆／綻","輕掠／鋪／澆","灌溉／搖／開"],"ans":"A","steps":["第一格看後面：風雨把大樹連根拔起、把籬笆掀倒，是又快又猛的動作，「散步」「輕掠」「灌溉」都太溫和，只剩「狂奔」","第二格：山石和泥濘一下子倒進公路，用「傾入」；第三格：燭火突然冒出火花，用「爆出」","三格都代回去讀得通的是「狂奔／傾／爆」"],"tests":"依前後文填動詞","avoid":"每一格都要代回，一格不通就刪"},{"q":"根據本文，下列敘述何者最恰當？","opts":["颱風來臨前，山川草木變得模糊不清","颱風之夜雷電交加，讓動物驚慌亂竄","藉由聽到的聲音可以想像颱風的威力","岸邊的風球升起就表示颱風已經遠離"],"ans":"C","steps":["回原文找證據：第二段「我什麼都看不見，只聽到風雨的聲音」，接著「那時我可以想像」颱風從海上滾來","看不見、只聽得到，卻能想像颱風多猛烈，就是靠聲音想像颱風的威力","其他三個都和原文相反或沒寫：山變得「更清朗更明亮」、文中沒有雷電、風球升起後颱風才要來。所以選第三個選項"],"tests":"回原文找證據","avoid":"選項裡每個關鍵詞都要回原文對"},{"q":"關於本文的寫作手法，下列敘述何者最恰當？","opts":["用颱風的狂暴象徵作者內心的憤怒","以細筆表現颱風將至到離去的種種景象","模仿孩童的語氣來描寫心中對颱風的恐懼","藉由誇飾的筆法描述颱風肆虐後造成的災害"],"ans":"B","steps":["先畫出時間順序：第一段是颱風要來的徵兆，第二、三段是颱風來襲，最後一句「颱風已經遠遠走了」","作者寫螞蟻、公雞、麻雀、燭光、蚊子這些小細節，就是「細筆」","文中沒有寫內心憤怒，也不是孩童語氣，災害是想像的不是肆虐後的描寫，所以選「以細筆表現颱風將至到離去的種種景象」"],"tests":"寫作手法","avoid":"先畫出文章的時間順序再看選項"}]},{"label":"第四篇","title":"111 年會考 第 30～31 題（題組）","text":["證道會過後不久，天氣開始熱了。眼看六月底就要到來。證道會那個星期天下了場遲來的雨，次日，夏天的氣燄便忽地在天空與屋舍上方爆發開來。首先是一陣焚熱強風吹拂一整天，把牆壁都吹乾了。接著太陽定住不動，城裡鎮日洶湧著一波接一波的熱浪光影。除了拱廊街與公寓樓房之外，城裡好像沒有一處見不到刺眼欲盲的反光。【甲】⟦陽光大街小巷地追著市民跑，一等他們停下來便立刻出擊。⟧由於暑熱乍到，死亡人數也剛好急遽上升，每星期約有七百人，奧蘭城於是籠罩在一種沮喪的氣氛中。郊區裡，平坦街道與平頂房舍之間不再生氣勃勃，而且這一區的居民平常總是坐在門口，如今卻是所有的門戶窗扉緊閉，也不知道是想躲瘟疫還是太陽。不過有幾戶人家家裡傳出呻吟聲。以前要是發生這種事，經常可以看見好奇民眾站在路上留神傾聽。【乙】⟦但經過這長久下來的警戒之後，好像每個人的心腸都變硬了，無論是走路時或生活中聽到痛苦呻吟聲都能置若罔聞，彷彿那是人類的自然語言。⟧","在各城門的打鬥迫使警察不得不使用武器，也同時引發一種暗地裡的騷動。【丙】⟦打鬥中當然會有人受傷，但在城裡由於受到燠熱與恐懼的影響，所有事情都被誇大了，因此便有傳聞說死了人。⟧總之民眾不滿的情緒確實不斷擴大，政府也確實擔心發生最壞情況，而認真考慮了萬一這群被困在疫病當中的民眾發生暴動，應該採取哪些措施。報上公布了一些法令，再次重申出城的禁令，違者可能得坐牢。城裡派出巡邏隊巡視。在那些空蕩蕩又熱得發燙的街頭上，經常會先聽到馬蹄聲，接著便會看見騎馬的衛兵從兩排緊閉的窗戶之間經過。【丁】⟦巡邏隊的身影消失後，受威脅的城區便再次陷入一片沉重且充滿猜疑的寂靜之中。⟧每隔一段時間都會有槍聲響起，那是幾支武裝的特殊小隊最近奉命撲殺貓狗，因為牠們也可能傳播跳蚤。這些冷硬的槍聲更增添城裡的肅殺氣氛。","―― 節錄自卡繆《鼠疫》"],"cite":"111 年國中教育會考國文科 第 30～31 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"關於小說中畫線處文句的說明，下列何者最恰當？","opts":["甲：政府對人民的監控就像陽光一樣無孔不入","乙：長時間的緊繃，讓人變得冷酷麻木","丙：政府假稱瘟疫以掩蓋屠殺人民的真相","丁：巡邏隊刻意威嚇居民，製造恐懼與猜疑"],"ans":"B","steps":["乙句前後有路標：「以前……經常可以看見好奇民眾……傾聽」，接著「但經過這長久下來的警戒之後」，用「但」把以前和現在對照","以前會好奇聽，現在「心腸都變硬了」「置若罔聞」 → 長時間緊繃讓人冷酷麻木","甲句寫的是陽光很毒，丙句是傳聞被誇大，丁句是巡邏隊走後城裡的寂靜，都和選項說的不一樣，所以選乙"],"tests":"畫線句的含意","avoid":"抓句子裡的轉折詞，對照前後的變化"},{"q":"對小說中的政府而言，「最壞情況」所指的最可能是下列何者？","opts":["人心彼此猜疑，不再相互信任","氣溫持續上升，民眾難以忍受","疫情不斷惡化，人們失去求生欲","群眾發生暴動，突破城門封鎖線"],"ans":"D","steps":["「最壞情況」是指稱詞，要找它指什麼：後面緊接著「而認真考慮了萬一這群被困在疫病當中的民眾發生暴動」","再看政府的措施：重申出城的禁令、派巡邏隊巡視 → 政府怕的是有人衝出城","所以最壞情況是「群眾發生暴動，突破城門封鎖線」"],"tests":"指稱詞指什麼","avoid":"看到指稱的詞，先往前後找它的內容"}]},{"label":"第五篇","title":"111 年會考 第 28～29 題（題組）","text":["摺紙必須精準，切忌反覆翻弄，將紙摺磨得失去挺度。若紙起皺，邊線就會失去俐落的線條，摺出來的物件都會像失了精神般的軟癱。","小學時認識了一位大哥哥，手極巧，曾摺了一隻立體獨角仙給我。它有著厚實而層疊的腹部，擎起的獨角末端還如鹿角分岔。我珍藏多年，直至年長搬家方不知去向。","我從未能重現這隻獨角仙，人生也不若它的摺線一般乾淨俐落。【甲】⟦我反覆把自己摺成不同的生物，試圖符合人生為我準備的每一個坑洞。⟧","【乙】⟦一群圓滑形狀的人們聚在一起談天，我小心翼翼斂起方正的直角，⟧化為類似的圓體，悄悄滾近。另外也會遇上有稜有角的人們，我則對摺自己，讓角度更加突出。然而時間一長便洩了底，他們看穿，他們草草應付，藉機散去，剩下我獨自揣摩下次該變成哪種樣子。【丙】⟦幾次把紙弄得殘破不堪後，勉強找到約略符合自己形狀的角落，適應下來了。⟧","但當我決定把自己送往另一個城市，困惑又悄悄蔓延。以往公司宣告「我們要的是稀有動物」，因此我們的生活宗旨是特立獨行、轟轟烈烈。但向新單位報到的第一天，主管卻說：「這是一個叢林！那些需要特殊照顧與環境才能生存的稀有動物，比如說大象、孔雀，在這裡是無法生存的！【丁】⟦我們需要的是蟑螂、是老鼠！⟧」雖然明白他的誇飾，但還是受到了極大的震撼。","我又慌張了，這次，我應該把自己摺成什麼呢？","―― 改寫自謝子凡〈摺疊人生〉"],"cite":"111 年國中教育會考國文科 第 28～29 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，關於畫線處所象徵的意義，下列說明何者⟦最不恰當⟧？","opts":["甲句中「每一個坑洞」：人生不同的挑戰","乙句中「方正的直角」：作者獨特的個性","丙句中「紙」：作者自己的本質","丁句中「蟑螂」：卑鄙惡劣的個人特質"],"ans":"D","steps":["讀題：問「最不恰當」，要找說錯的那一個","丁句前面的線索：「需要特殊照顧與環境才能生存的稀有動物……在這裡是無法生存的」，和「蟑螂、老鼠」成對比 → 蟑螂是指在叢林裡什麼環境都能活下去、適應力強的人","作者也說這是「誇飾」，不是在罵人卑鄙，所以第四個選項最不恰當"],"tests":"象徵的意義","avoid":"象徵要看前後的對比，不看字面印象"},{"q":"作者透過本文所抒發的感慨，與下列何者最接近？","opts":["要到失去之後，才知道曾經擁有的美好","為了他人而改變自己，最後卻迷失自我","年輕時未確定方向，等到一事無成才後悔莫及","曾經轟轟烈烈的絢爛，誰知到頭來都是一場空"],"ans":"B","steps":["找重複出現的線索：「把自己摺成不同的生物」「對摺自己」「把紙弄得殘破不堪」「下次該變成哪種樣子」","一直為了配合別人改變形狀，到最後還在問「我應該把自己摺成什麼呢？」 → 找不到自己原本的樣子","所以感慨是「為了他人而改變自己，最後卻迷失自我」"],"tests":"全文的感慨","avoid":"找全文重複最多次的動作"}]},{"label":"第六篇","title":"111 年會考 第 41～42 題（題組）","text":["王起主文柄，欲以白敏中為狀元，病其與賀拔惎為友。惎有文而落拓。乃密令門人申意，俾敏中與惎絕。門人復約敏中，具以告之。敏中曰：「皆如所教。」既而惎果造門，左右欺以敏中他適，惎遲留不言而去。俄頃，敏中躍出，連呼左右召惎，悉以實告，曰：「一第何患不致，奈輕負至交！」相與歡醉。門人睹之，大怒而去。懇告於起，且云不可必矣。起曰：「我原只得白敏中，今當更取賀拔惎矣。」","―― 改寫自《唐摭言》"],"cite":"111 年國中教育會考國文科 第 41～42 題（國家教育研究院心測中心）","notes":"主文柄：主持科舉考試","trans":"王起主持科舉考試，想讓白敏中當狀元，卻擔心他和賀拔惎是朋友。賀拔惎有文才，但不得志、不拘小節。王起就暗中叫門人去傳話，要白敏中和賀拔惎斷絕來往。門人又去約白敏中，把這些話全部告訴他。白敏中說：「都照您的指示做。」不久，賀拔惎果然登門拜訪，白敏中身邊的人騙他說白敏中到別的地方去了，賀拔惎停留了一會兒，什麼也沒說就走了。過了一下子，白敏中跳出來，連聲叫身邊的人把賀拔惎找回來，把實情全部告訴他，說：「一個科舉名次何必擔心得不到，怎麼可以輕易辜負最好的朋友！」兩人一起開心地喝醉了。門人看到這一幕，非常生氣地離開，去向王起詳細報告，還說狀元不一定要給白敏中了。王起說：「我原本只打算錄取白敏中，現在應該再加上賀拔惎了。」","qs":[{"q":"根據本文，下列文句省略的主語，何者是白敏中？","opts":["病其與賀拔惎為友","乃密令門人申意","悉以實告","大怒而去"],"ans":"C","steps":["每一句往前找最近做事的人：「病其與賀拔惎為友」「乃密令門人申意」都接在「王起主文柄」後面，是王起在擔心、在下命令","「悉以實告」前面是「敏中躍出，連呼左右召惎」，把實情告訴賀拔惎的是白敏中","「大怒而去」前面是「門人睹之」，生氣的是門人。所以選「悉以實告」"],"tests":"補回省略的主語","avoid":"主詞省略時，往前找最近做動作的人"},{"q":"根據本文，王起說：「我原只得白敏中，今當更取賀拔惎矣。」這句話的原因，最可能是下列何者？","opts":["白敏中向王起推薦賀拔惎取代自己","賀拔惎已知此次科考內幕，只好破格錄取封口","比起白敏中的前倨後恭，賀拔惎的真誠顯得更為可貴","白敏中把賀拔惎看得比狀元還重，可知賀拔惎有過人之處"],"ans":"D","steps":["找因果線索：王起改變主意，是在門人報告「白敏中寧可不當狀元也要找回朋友」之後","白敏中說「一第何患不致，奈輕負至交」，把朋友看得比狀元重；能讓他這麼看重的人，一定有過人之處","白敏中沒有推薦對方取代自己，文中也沒有封口或前倨後恭的情節，所以選第四個選項"],"tests":"推論人物的想法","avoid":"先找「改變之前發生了什麼事」"}]},{"label":"第七篇","title":"110 年會考 第 44～45 題（題組）","text":["陸羽《茶經》論水云：「山水上，石泉又上，江水次而井水下。」又「江水取去人遠者，井取汲多者。」其說止於此，未嘗品第天下之水味。張又新《煎茶水記》云劉伯芻謂水有七等，以揚子江為第一，惠山石泉為第二，虎丘井第三，淮水居末。又載羽為李季卿論水次第有二十種，江水居山水上，井水居江水上。二說皆與《茶經》不合。","水味有美惡而已，欲求天下之水一一而次第之者，謬說也。羽之論水，惡渟浸而喜泉源，故井取多汲者。江雖長，然眾水雜聚，故次山水。惟此說近物理云。","――改寫自歐陽脩〈大明水記〉"],"cite":"110 年國中教育會考國文科 第 44～45 題（國家教育研究院心測中心）","notes":"渟浸：水停止不動","trans":"陸羽在《茶經》裡談論水說：「山裡的水最好，從石縫流出的泉水又更好，江水次一等，井水最差。」又說：「江水要取離人群遠的地方，井水要取常常有人打水的。」他的說法就到這裡，不曾替天下的水排出名次。張又新的《煎茶水記》說，劉伯芻認為水分成七等，揚子江第一，惠山石泉第二，虎丘井第三，淮水最後。書裡又記載陸羽替李季卿評水，排出二十種等第，江水排在山水前面，井水排在江水前面。這兩種說法都和《茶經》不合。水的味道只有好和壞罷了，想把天下的水一個一個排出名次，是錯誤的說法。陸羽評論水，討厭停著不流動的水，喜歡有源頭的泉水，所以井水要取常常有人打的。江水雖然很長，但是許多水混雜在一起，所以排在山水後面。只有這種說法接近事物的道理。","qs":[{"q":"根據本文，下列敘述何者最恰當？","opts":["張又新將天下的水按水質分成二十種","歐陽脩按水源的遠近和高低評定水質","在《煎茶水記》中，張又新反駁劉伯芻看法","依《茶經》論水的標準，揚子江優於虎丘井"],"ans":"D","steps":["先把「誰說的」分清楚：《茶經》是陸羽、七等是劉伯芻、二十種是張又新記載的陸羽說法、末段是歐陽脩","《茶經》的排序是山水＞江水＞井水；揚子江是江水，虎丘井是井水 → 揚子江優於虎丘井","二十種不是張又新自己分的，他也沒有反駁劉伯芻，歐陽脩反對替水排名次，所以選第四個選項"],"tests":"分清各家說法","avoid":"先標好「誰說的」，再比對選項"},{"q":"關於本文的寫作手法，下列敘述何者最恰當？","opts":["首段提出各家之說，末段表明作者的觀點","首段評比水質高下，末段以各家之說佐證","首段引述《茶經》的說法，末段舉各家之說駁斥","首段分論不同水源的特性，末段以取水標準總結"],"ans":"A","steps":["看首段在誰說話：「《茶經》論水云」「劉伯芻謂」「又載羽為李季卿論水」→ 列出好幾家的說法","看末段：「水味有美惡而已……謬說也」「惟此說近物理云」→ 是作者自己的判斷","所以是「首段提出各家之說，末段表明作者的觀點」"],"tests":"文章的結構","avoid":"每一段先找是誰在說話"}]},{"label":"第八篇","title":"111 年會考 第 39～40 題（題組）","text":["【甲】","文帝時，莢錢益多，輕，乃更鑄四銖錢，上鑄「半兩」字樣，民亦得自鑄錢。故吳王就山鑄錢，富等天子，其後以此叛逆。又有大夫鄧通者，亦以鑄錢富甲天下。故吳、鄧氏錢布天下，而後乃生鑄錢之禁。","―― 改寫自《史記．平準書》","【乙】","漢文帝時，鄧通得賜蜀銅山，聽得鑄錢，形制文字重量，皆與天子四銖錢同。時吳王亦有銅山鑄錢，故有吳錢，微重，形制文字，與天子錢不異。","―― 改寫自《西京雜記》"],"cite":"111 年國中教育會考國文科 第 39～40 題（國家教育研究院心測中心）","notes":"莢錢：西漢初年所鑄銅錢，形如榆莢，故名","trans":"【甲】漢文帝時，莢錢越來越多，而且很輕，於是改鑄四銖錢，錢上鑄著「半兩」兩個字，百姓也可以自己鑄錢。所以吳王靠著山上的銅礦鑄錢，財富和天子一樣多，後來憑著這些財富叛變。又有一位大夫叫鄧通，也因為鑄錢而成為天下最有錢的人。所以吳王和鄧通的錢流通全國，後來才有禁止私人鑄錢的命令。【乙】漢文帝時，鄧通得到皇帝賞賜的蜀地銅山，允許他鑄錢，錢的形狀、文字、重量，都和天子的四銖錢相同。當時吳王也有銅山鑄錢，所以有吳錢，稍微重一點，形狀和文字和天子的錢沒有不同。","qs":[{"q":"根據甲、乙兩文推論，漢文帝時各種錢幣的重量依序最可能是下列何者？","opts":["四銖錢 ＞ 吳錢 ＞ 鄧通錢","四銖錢 ＝ 鄧通錢 ＞ 吳錢","吳錢 ＞ 四銖錢 ＞ 鄧通錢","吳錢 ＞ 鄧通錢 ＝ 四銖錢"],"ans":"D","steps":["甲乙比較：問重量，先找哪一篇有寫重量 → 線索都在乙文","鄧通錢「形制文字重量，皆與天子四銖錢同」→ 鄧通錢＝四銖錢；吳錢「微重」→ 比天子的錢重一點","所以順序是吳錢＞鄧通錢＝四銖錢"],"tests":"兩文整合比較","avoid":"把「同、微重」這類比較詞圈起來"},{"q":"根據甲、乙兩文，下列敘述何者最恰當？","opts":["鄧通與吳王同時自鑄莢錢，導致莢錢過多","鄧通與吳王所鑄銅錢上應有「半兩」字樣","鄧通叛逆謀反，文帝遂下令禁止私鑄銅錢","鄧通所鑄錢布天下，故文帝賜其銅山一座"],"ans":"B","steps":["先各找重點：甲文說四銖錢「上鑄『半兩』字樣」；乙文說鄧通、吳王的錢「形制文字」都和天子的錢一樣","甲文一句接乙文一句：文字一樣 → 他們的錢上也應該有「半兩」","他們鑄的是四銖錢不是莢錢；叛逆的是吳王不是鄧通；兩文都沒說賜銅山是因為錢布天下。所以選第二個選項"],"tests":"甲乙文合併推論","avoid":"甲文一句加乙文一句，才推得出答案"}]},{"label":"第九篇","title":"110 年會考 第 46～48 題（題組）","text":["【甲】","柳開少好任氣，大言凌物。應舉時，以文章投於主考簾前，凡千軸，載以獨輪車。引試日，自擁車入，欲以此駭眾取名。其時張景能文有名，唯袖一書簾前獻之。主考大稱賞，擢景優等。時人為之語曰：「柳開千軸，不如張景一書。」","――改寫自沈括《夢溪筆談》","【乙】","張景，字晦之，江陵 公安人。幼能長言，嗜學尤力。貧不治產，往從柳開。開以文自名，而薦寵士類，一見歡甚，悉出家書予之，由是屬辭益有法度。開每曰：「今朝中之士，誰踰晦之者！」即厚饋，使如京師。後中進士。","――改寫自宋祁〈故大理評事張公墓誌銘〉","【丙】相關人物簡表"],"table":[["姓名","西元生卒年","中舉年分"],["柳開","948～1001","973"],["張景","970～1018","1000"],["宋祁","998～1061","1024"],["沈括","1031～1095","1063"]],"cite":"110 年國中教育會考國文科 第 46～48 題（國家教育研究院心測中心）","notes":"凌物：傲視他人　引試：面試　張公：指張景　墓誌銘：記錄死者生平事蹟的石刻文字","trans":"【甲】柳開年輕時愛意氣用事，說大話又看不起別人。參加科舉時，他把文章送到主考官的簾子前，總共有一千卷，用獨輪車載著。面試那天，他親自推著車進去，想用這個方法嚇倒大家、博取名聲。當時張景擅長寫文章而有名，只在袖子裡放了一篇文章，到簾子前獻上。主考官大大稱讚，把張景列為優等。當時的人就說：「柳開的一千卷，比不上張景的一篇。」【乙】張景，字晦之，是江陵府公安縣人。從小就能寫長篇文章，求學特別努力。家裡窮，不經營產業，就去投靠柳開。柳開以文章出名，又喜歡推薦、照顧讀書人，一見到張景就非常高興，把家裡的藏書全部拿出來給他，從此張景寫文章更有章法。柳開常說：「現在朝廷裡的讀書人，誰能超過晦之！」就送他豐厚的財物，讓他前往京城。後來張景考中進士。","qs":[{"q":"下列文句「」中字的意義說明，何者最恰當？","opts":["駭眾取「名」――姓名","嗜學「尤」力――尚且","「悉」出家書予之――明白","使「如」京師――前往"],"ans":"D","steps":["第一招組詞代回：「使如京師」的「如」，組成「如同」代回去，讓他如同京城，不通；換成「前往」，讓他前往京城，通","檢查其他：「駭眾取名」是博取名聲不是姓名；「嗜學尤力」的尤是特別；「悉出家書」是全部拿出來，不是明白","所以選「使「如」京師――前往」"],"tests":"文言字義","avoid":"組詞以後一定要代回整句讀"},{"q":"關於甲、乙兩文的內容，下列說明何者⟦最不恰當⟧？","opts":["甲文比較柳開、張景才華的高下","乙文敘述張景投靠柳開後的際遇","兩文皆凸顯柳開自大的形象","兩文皆肯定張景不凡的文才"],"ans":"C","steps":["甲乙比較：先各寫一句重點。甲：柳開用千卷文章炫耀，輸給張景一篇；乙：柳開欣賞張景，送書又送錢","找不同：甲文的柳開「大言凌物」很自大；乙文的柳開「薦寵士類」，是照顧後輩的前輩","說「兩文皆」就要兩篇都有證據，乙文看不出柳開自大，所以第三個選項最不恰當"],"tests":"甲乙文的相同與不同","avoid":"看到「兩文皆」，兩篇都要找到證據"},{"q":"根據丙表所列舉的年分，對照甲、乙兩文內容，下列推論何者最合理？","opts":["柳開中舉前已受張景愛戴","宋祁跟柳開兩人頗有交情","甲文的寫作時間早於乙文","乙文所述內容較甲文可信"],"ans":"D","steps":["用表格的數字當線索：甲文說柳開和張景同一場考試，可是柳開 973 年中舉時，張景才 3 歲，張景要到 1000 年才中舉，甲文的故事時間對不上","乙文是宋祁替張景寫的墓誌銘，宋祁和張景年代相近，內容比較可信","柳開中舉時張景還是小孩，不可能愛戴他；柳開過世時宋祁才 3 歲；沈括出生時宋祁已經 33 歲，甲文比乙文晚寫。所以選「乙文所述內容較甲文可信」"],"tests":"表格對照推論","avoid":"有年代表就先算年紀，再對文章"}]}]}},{"week":8,"groups":[{"no":"第 1 組","title":"王戎觀虎","skill":"補主詞＋人物形象","steps":["❶ 看到動作先問「誰做的？」，往前找最近的人","❷ 有「曰」「對曰」時，看說話的是誰、對誰說","❸ 圈出人物的言行：他說了什麼、做了什麼","❹ 從言行推性格，一定要能指著原文說出證據"],"demo":{"q":"「看道邊李樹多子折枝，諸兒競走取之，唯戎不動」可以看出王戎是怎樣的人？","a":["先看材料：「王戎七歲，嘗與諸小兒遊。看道邊李樹多子折枝，諸兒競走取之，唯戎不動。人問之，答曰：『樹在道邊而多子，此必苦李。』」","→ 補主詞：誰「答曰」？被問的是不動的王戎","→ 言行證據：別的小孩搶著去摘，只有他不動，還說出「樹在道邊而多子，此必苦李」的理由","答：冷靜、會觀察推理"]},"parts":[{"label":"第一篇","title":"王戎觀虎","text":["魏明帝於宣武場上斷虎爪牙，縱百姓觀之。王戎七歲，亦往看。虎承間攀欄而吼，其聲震地，觀者無不辟易顛仆。戎湛然不動，了無恐色。"],"cite":"《世說新語．雅量》","notes":"魏明帝：三國時魏國的皇帝　宣武場：練兵的場地　縱：讓、任由　承間：趁機會　欄：柵欄　辟易：嚇得後退　顛仆：跌倒　湛然：安安靜靜的樣子　了無：完全沒有","trans":"魏明帝在宣武場上把老虎的爪子和牙齒弄斷，讓百姓來看。王戎七歲，也去看。老虎趁機會攀著柵欄大吼，吼聲震動地面，看的人沒有一個不嚇得後退跌倒。王戎卻安安靜靜站著不動，完全沒有害怕的樣子。","qs":[{"q":"「斷虎爪牙，縱百姓觀之」是誰做的？","opts":["王戎","魏明帝","老虎","百姓"],"ans":"B","steps":["第一句的主詞：「魏明帝於宣武場上斷虎爪牙」","後面「縱百姓觀之」主詞沒換","所以是魏明帝"],"tests":"補主詞","avoid":"主詞沒換時，一路沿用前面的人"},{"q":"「其聲震地」的「其」指的是什麼？","opts":["王戎","百姓","老虎","魏明帝"],"ans":"C","steps":["前一句：「虎承間攀欄而吼」","吼叫的是老虎，「其聲」就是老虎的吼聲","所以「其」＝老虎"],"tests":"代詞「其」指誰","avoid":"「其」往前找剛剛做動作的"},{"q":"「觀者無不辟易顛仆」是什麼意思？","opts":["看的人沒有一個不嚇得後退跌倒","看的人都沒有後退","看的人只有一個跌倒","看的人不想後退"],"ans":"A","steps":["「無不」＝沒有一個不，等於「全部都」","注釋：辟易＝嚇得後退，顛仆＝跌倒","所以看的人全都嚇得後退跌倒"],"tests":"雙重否定","avoid":"「無不」兩個否定，等於「全都」"},{"q":"作者先寫「觀者無不辟易顛仆」，再寫王戎「湛然不動」，用意是什麼？","opts":["說明百姓都很膽小","說明老虎沒有危險","用大家的驚慌，襯托王戎的鎮定","說明王戎年紀太小聽不懂"],"ans":"C","steps":["前：大家全都嚇得後退跌倒","後：只有王戎不動、沒有害怕","前後對比，是為了突顯王戎的鎮定"],"tests":"人物形象：對比","avoid":"寫別人，常是為了襯托主角"}]},{"label":"第二篇","title":"王恭身無長物","text":["王恭從會稽還，王大看之。見其坐六尺簟，因語恭：「卿東來，故應有此物，可以一領及我。」恭無言。大去後，即舉所坐者送之。既無餘席，便坐薦上。後大聞之甚驚，曰：「吾本謂卿多，故求耳。」對曰：「丈人不悉恭，恭作人無長物。」"],"cite":"《世說新語．德行》","notes":"王恭：東晉人　會稽：地名　王大：王忱，王恭的長輩　簟：竹蓆　卿：你　東來：從東邊回來，指從會稽回來　故應：一定　一領：一張　及：給　舉：拿起　薦：草墊　謂：以為　丈人：對長輩的尊稱　悉：了解","trans":"王恭從會稽回來，王忱去看他。王忱看見王恭坐著一張六尺長的竹蓆，就對王恭說：「你從東邊回來，一定有很多這種東西，可以送我一張。」王恭沒有說話。王忱走了以後，王恭就把自己坐的那張竹蓆拿起來送給他。自己沒有多的蓆子了，就坐在草墊上。後來王忱聽說這件事，非常驚訝，說：「我本來以為你有很多，所以才向你要啊。」王恭回答：「您不了解我，我做人沒有多餘的東西。」","qs":[{"q":"「大去後，即舉所坐者送之」，是誰把竹蓆送給誰？","opts":["王大送給王恭","王恭送給王大","王恭送給會稽的朋友","王大送給丈人"],"ans":"B","steps":["前面：「大去後」，王大已經走了，拿蓆子的不會是他","「恭無言」之後的動作主詞沒換，是王恭；「之」指開口要蓆子的王大","所以是王恭把蓆子送給王大"],"tests":"補主詞","avoid":"主詞省略，往前找最近的人"},{"q":"「恭作人無長物」的「長」是什麼意思？","opts":["多餘的","很長的","年紀大的","擅長的"],"ans":"A","steps":["組詞「長度、擅長」代回：做人沒有很長的、擅長的東西 → 讀不通","換招看情節：他只有一張蓆子，送掉後「既無餘席」，連多的一張都沒有","所以「長物」＝多餘的東西，「長」＝多餘的"],"tests":"古今異義：長","avoid":"組詞不通，就回情節找證據"},{"q":"王大聽說後「甚驚」，他驚訝的原因是什麼？","opts":["王恭把蓆子弄壞了","王恭不肯給他蓆子","他本來以為王恭有很多，沒想到王恭把唯一的一張送給他","他發現竹蓆不是從會稽帶回來的"],"ans":"C","steps":["證據一：王大說「吾本謂卿多，故求耳」，本來以為王恭有很多","證據二：王恭送蓆後「既無餘席，便坐薦上」","合起來：王恭把唯一的蓆子送人，自己坐草墊，所以王大很驚訝"],"tests":"因果：找原因","avoid":"人物說的話，就是原因"},{"q":"從這件事可以看出王恭是怎樣的人？","opts":["很小氣，不想把東西給人","生活簡樸、待人大方，寧可自己坐草墊也把蓆子送人","很討厭王大，故意不說話","喜歡炫耀自己的東西"],"ans":"B","steps":["證據一：別人一開口，他就把自己坐的蓆子送出去，自己坐草墊","證據二：他說「恭作人無長物」，做人沒有多餘的東西","合起來：生活簡樸，對人又大方"],"tests":"人物形象","avoid":"性格要指著言行說證據"}]},{"label":"第三篇","title":"魏文侯期獵","text":["文侯與虞人期獵。是日，飲酒樂，天雨。文侯將出，左右曰：「今日飲酒樂，天又雨，公將焉之？」文侯曰：「吾與虞人期獵，雖樂，豈可不一會期哉！」乃往，身自罷之。魏於是乎始強。"],"cite":"《戰國策．魏策一》","notes":"文侯：魏文侯，戰國時魏國的國君　虞人：管理山林的官　是日：這一天　左右：身邊的人　焉之：到哪裡去　會期：赴約　罷：取消","trans":"魏文侯和管理山林的官約好去打獵。這一天，文侯喝酒喝得很快樂，天又下起雨。文侯準備出門，身邊的人說：「今天喝酒正快樂，天又下雨，您要到哪裡去呢？」文侯說：「我和管山林的官約好打獵，雖然現在很快樂，怎麼可以不去赴約呢！」於是前往，親自去告訴對方取消打獵。魏國從此開始強大。","qs":[{"q":"「文侯與虞人期獵」的「期」是什麼意思？","opts":["一段時間","希望","一整年","約定"],"ans":"D","steps":["組詞「約期」，代回：文侯和虞人「約定」打獵 → 通","驗證：後面文侯說「豈可不一會期哉」，會期＝赴約","所以「期」＝約定"],"tests":"字義：期","avoid":"組詞代回，再用後文驗證"},{"q":"「公將焉之？」是誰在問誰？","opts":["魏文侯問虞人","虞人問魏文侯","魏文侯問身邊的人","身邊的人問魏文侯"],"ans":"D","steps":["前面：「左右曰」，說話的是身邊的人","「公」是對國君的尊稱，問的是正要出門的文侯","所以是左右問文侯"],"tests":"說話者是誰","avoid":"看「曰」前面是誰，再看在對誰說"},{"q":"「乃往，身自罷之」，親自去取消打獵的是誰？","opts":["魏文侯","虞人","身邊的人","魏國百姓"],"ans":"A","steps":["前一句說話的是文侯：「吾與虞人期獵……」","說完就「乃往」，主詞沒有換","所以親自去的是魏文侯"],"tests":"補主詞","avoid":"說完話接著行動的，多半是同一人"},{"q":"從這件事可以看出魏文侯是怎樣的人？","opts":["喜歡喝酒，不管國事","很怕下雨","很愛打獵，下雨也要去打","守信用，再快樂、天氣再差也不失約"],"ans":"D","steps":["證據一：喝酒正快樂、天又下雨，他還是出門","證據二：去的目的是「罷之」，不是去打獵，而是去赴約說明","合起來：他重視約定、守信用"],"tests":"人物形象","avoid":"看人物在為難時做了什麼選擇"}]},{"label":"第四篇","title":"祁黃羊薦仇","text":["晉平公問於祁黃羊曰：「南陽無令，其誰可而為之？」祁黃羊對曰：「解狐可。」平公曰：「解狐非子之讎邪？」對曰：「君問可，非問臣之讎也。」平公曰：「善。」遂用之。國人稱善焉。"],"cite":"《呂氏春秋．去私》（節選）","notes":"晉平公：春秋時晉國的國君　祁黃羊：晉國的大臣　南陽：地名　令：地方長官　解狐：人名　子：您，指祁黃羊　邪：嗎　國人：都城裡的人","trans":"晉平公問祁黃羊說：「南陽缺一位長官，誰可以去擔任？」祁黃羊回答：「解狐可以。」平公說：「解狐不是您的仇人嗎？」祁黃羊回答：「您問的是誰可以勝任，不是問誰是我的仇人。」平公說：「好。」就任用了解狐。都城裡的人都稱讚這件事做得好。","qs":[{"q":"「解狐非子之讎邪？」的「讎」是什麼意思？","opts":["朋友","仇人","學生","親戚"],"ans":"B","steps":["組詞「仇讎、復讎」，代回：解狐不是您的「仇人」嗎 → 通","驗證：祁黃羊回答「非問臣之讎也」，他沒有否認","所以「讎」＝仇人"],"tests":"字義：讎","avoid":"組詞代回，再看對方怎麼回答"},{"q":"「遂用之」，是誰任用了誰？","opts":["晉平公任用解狐","祁黃羊任用解狐","解狐任用祁黃羊","晉平公任用祁黃羊"],"ans":"A","steps":["前一句：「平公曰：『善。』」說話的是平公","能任用官員的是國君；被推薦的是解狐","所以是平公任用解狐"],"tests":"補主詞","avoid":"先找誰有權力做這件事"},{"q":"「君問可，非問臣之讎也」是什麼意思？","opts":["您問的是誰能勝任，不是問誰是我的仇人","您問我能不能，我說不能","我不想回答仇人的事","您應該先問我的仇人"],"ans":"A","steps":["「可」接前面的問題：「其誰可而為之」＝誰可以擔任","「非問臣之讎」＝不是問我的仇人","合起來：只看能力，不看私人恩怨"],"tests":"句意理解","avoid":"回答句要接回前面的問題"},{"q":"從祁黃羊的回答，可以看出他是怎樣的人？","opts":["很怕國君生氣","想趁機跟解狐和好","公正無私，只看能力，不管私人恩怨","不知道解狐是自己的仇人"],"ans":"C","steps":["證據一：他推薦的解狐是自己的仇人","證據二：被問時他說「君問可，非問臣之讎也」","合起來：他推薦人只看能力，公正無私"],"tests":"人物形象","avoid":"性格要從他說的話找證據"}]},{"label":"第五篇","title":"庾公不賣的盧","text":["庾公乘馬有的盧，或語令賣去。庾云：「賣之必有買者，即當害其主，寧可不安己而移於他人哉？昔孫叔敖殺兩頭蛇以為後人，古之美談。效之，不亦達乎！」"],"cite":"《世說新語．德行》","notes":"庾公：庾亮，東晉的大臣　的盧：額頭有白斑的馬，傳說會害主人　即當：就會　移：轉移　孫叔敖：春秋時楚國人，小時候殺了兩頭蛇，怕別人看見會遭殃　美談：大家稱讚的事　達：通達事理","trans":"庾亮騎的馬中有一匹的盧馬，有人告訴他，叫他把馬賣掉。庾亮說：「賣牠一定會有人買，這匹馬就會害牠的新主人，怎麼可以因為牠對自己不利，就把禍害轉給別人呢？從前孫叔敖殺了兩頭蛇，是為了後面的人，這是古代大家稱讚的事。我學他的做法，不也是通達事理嗎！」","qs":[{"q":"「或語令賣去」的「或」是什麼意思？","opts":["或者","也許","常常","有人"],"ans":"D","steps":["組詞「或者」代回：或者告訴他賣掉 → 讀不通，少了說話的人","換招驗證：後面庾亮回答，表示有人來勸他","所以「或」＝有人"],"tests":"一字多義：或","avoid":"組詞不通，就看前後誰在做事"},{"q":"「或語令賣去」，有人叫誰把馬賣掉？","opts":["孫叔敖","庾亮","買馬的人","馬的新主人"],"ans":"B","steps":["第一句：「庾公乘馬有的盧」，馬是庾亮的","接著庾亮回答「賣之必有買者」","所以被勸賣馬的是庾亮"],"tests":"補主詞","avoid":"看誰回答，就知道對誰說"},{"q":"「寧可不安己而移於他人哉」的「寧可」，意思是什麼？","opts":["寧願","一定要","怎麼可以","比較好"],"ans":"C","steps":["代回今天的「寧願」：寧願自己不安全，把禍害轉給別人？和他不賣馬的做法相反","代回「怎麼可以」：怎麼可以因為對自己不利，就轉給別人 → 和他的決定相合","所以「寧可」＝怎麼可以（古今異義）"],"tests":"古今異義：寧可","avoid":"古今異義一定要看人物的決定驗證"},{"q":"庾亮不肯賣的盧馬，可以看出他是怎樣的人？","opts":["很喜歡這匹馬，捨不得賣","不相信的盧會害人","想學孫叔敖去殺蛇","寧可自己承擔，也不把禍害推給別人"],"ans":"D","steps":["證據：「賣之必有買者，即當害其主」","他擔心的是買馬的人會受害","所以他替別人著想，不把禍害轉給別人"],"tests":"人物形象","avoid":"找人物「為什麼」這樣做"}]}]},{"no":"第 2 組","title":"何晏畫地","skill":"字義五招總複習（一字多義、古今異義、詞類活用）","steps":["❶ 組詞法：把字組成詞，代回原句讀讀看","❷ 組詞都像對時，看人物的動作和目的，換一招驗證","❸ 古今異義（例如走、寧可）：一定用第 ❷ 招再確認","❹ 詞類活用：名詞、形容詞後面接著東西，常常當動作讀","❺ 一字多義：同一個字換了句子，要重新代回"],"demo":{"q":"「魏武奇愛之」的「奇」是什麼意思？","a":["先看材料：「何晏七歲，明惠若神，魏武奇愛之。」","→ 第 ❶ 招組詞「驚奇」，代回：曹操覺得他很驚奇、很喜愛他 → 通","→ 第 ❷ 招驗證：前面說何晏「明惠若神」，聰明得像神，難怪曹操覺得他特別","答：覺得他很奇特（形容詞當動詞用）"]},"parts":[{"label":"第一篇","title":"何晏畫地","text":["何晏七歲，明惠若神，魏武奇愛之。因晏在宮內，欲以為子。晏乃畫地令方，自處其中。人問其故，答曰：「何氏之廬也。」魏武知之，即遣還。"],"cite":"《世說新語．夙惠》","notes":"何晏：三國時魏國人　明惠：聰明　若神：像神一樣　魏武：魏武帝曹操　處：待著　廬：房屋","trans":"何晏七歲時，聰明得像神一樣，魏武帝曹操覺得他很奇特，很喜愛他。因為何晏住在宮裡，曹操就想收他當兒子。何晏就在地上畫了一個方框，自己待在裡面。有人問他原因，他回答：「這是何家的房子。」曹操知道他的意思後，馬上把他送回去。","qs":[{"q":"「晏乃畫地令方」的「方」是什麼意思？","opts":["方形","方法","方向","正在"],"ans":"A","steps":["組詞「方形」，代回：在地上畫，讓它成為方形 → 通","驗證：後面「自處其中」他站進去，表示畫的是一個框","所以「方」＝方形"],"tests":"字義：方","avoid":"組詞後，用後面的動作驗證"},{"q":"「人問其故」的「故」是什麼意思？","opts":["舊的","所以","故意","原因"],"ans":"D","steps":["組詞「緣故」，代回：有人問他原因 → 通","驗證：後面他「答曰」說出理由，問的就是原因","「故」也可以當舊的、所以，一定要代回"],"tests":"一字多義：故","avoid":"同一個字，每次都重新代回"},{"q":"何晏畫一個方框、自己站在裡面，是想表達什麼？","opts":["他想要一間自己的房子","自己是何家的人，不想當曹操的兒子","他在玩畫畫遊戲","他想住在宮裡"],"ans":"B","steps":["證據一：曹操「欲以為子」，想收他當兒子","證據二：他說方框是「何氏之廬」，何家的房子","合起來：他用畫框表示自己屬於何家，委婉拒絕"],"tests":"推論：人物用意","avoid":"人物的動作，要放回事件裡看"},{"q":"「即遣還」的「遣」是什麼意思？","opts":["送走、打發回去","派兵","遺失","原諒"],"ans":"A","steps":["組詞「遣送」，代回：馬上把他送回去 → 通","驗證：曹操「知之」，懂了何晏不想當兒子，就讓他回何家","所以「遣」＝送走"],"tests":"字義：遣","avoid":"組詞代回，再看人物的目的"}]},{"label":"第二篇","title":"鄒忌窺鏡","text":["鄒忌修八尺有餘，而形貌昳麗。朝服衣冠，窺鏡，謂其妻曰：「我孰與城北徐公美？」其妻曰：「君美甚，徐公何能及君也！」城北徐公，齊國之美麗者也。忌不自信，而復問其妾曰：「吾孰與徐公美？」妾曰：「徐公何能及君也！」"],"cite":"《戰國策．齊策一》（節選）","notes":"鄒忌：戰國時齊國的大臣　形貌：外表　昳麗：容光煥發、美麗　朝：早晨　窺鏡：照鏡子　徐公：姓徐的男子　何能及君：哪裡比得上您　妾：古代男子的小妻","trans":"鄒忌身高八尺多，而且外表容光煥發、很美。早上他穿戴好衣服帽子，照著鏡子，對他的妻子說：「我和城北的徐公比，誰比較美？」他的妻子說：「您美多了，徐公哪裡比得上您呢！」城北的徐公，是齊國有名的美男子。鄒忌不相信自己比較美，又問他的妾說：「我和徐公比，誰比較美？」妾說：「徐公哪裡比得上您呢！」","qs":[{"q":"「鄒忌修八尺有餘」的「修」是什麼意思？","opts":["身高、長","修理","學習","打扮"],"ans":"A","steps":["組詞「修長」，代回：鄒忌身高八尺多 → 通","驗證：後面「八尺有餘」是長度，接著「形貌昳麗」才講外表","今天的「修」常是修理，這裡是古義"],"tests":"古今異義：修","avoid":"後面接數字長度，「修」是長"},{"q":"「朝服衣冠」的「服」是什麼意思？","opts":["衣服","穿戴","佩服","服從"],"ans":"B","steps":["組詞「衣服」代回：早上衣服衣冠 → 讀不通","「服」後面接著「衣冠」，名詞當動作讀 → 穿戴","代回：早上穿戴好衣帽 → 通，接著才照鏡子"],"tests":"詞類活用：服","avoid":"名詞後面接東西，當動作讀"},{"q":"「我孰與城北徐公美？」是什麼意思？","opts":["我和徐公一起去城北好嗎？","城北的徐公美不美？","我要和徐公比賽誰比較快","我和城北的徐公比，誰比較美？"],"ans":"D","steps":["「孰」＝誰；「孰與」＝和……比，誰比較……","代回：我和城北徐公比，誰比較美 → 通","驗證：妻子回答「徐公何能及君」，正是在比較兩人"],"tests":"句意：孰與","avoid":"看回答，就知道問的是什麼"},{"q":"「忌不自信，而復問其妾」可以看出鄒忌怎樣？","opts":["很喜歡問問題","不信任自己的妻子","對自己的外表很有信心","不輕易相信別人的稱讚，會再三求證"],"ans":"D","steps":["證據一：妻子說他比徐公美","證據二：他「不自信」，又去問妾","合起來：他不輕易相信稱讚，會再找人確認"],"tests":"人物形象","avoid":"看人物聽到話後做了什麼"}]},{"label":"第三篇","title":"卜妻為袴","text":["鄭縣人卜子使其妻為袴，其妻問曰：「今袴何如？」夫曰：「象吾故袴。」妻子因毀新，令如故袴。"],"cite":"《韓非子．外儲說左上》","notes":"鄭縣：地名　卜子：姓卜的人　袴：褲子　何如：做成什麼樣子　妻子：這裡指卜子的太太　毀：弄壞　令：讓","trans":"鄭縣人卜子叫他的太太做一條褲子，太太問：「這次的褲子要做成什麼樣子？」丈夫說：「像我的舊褲子。」太太於是把新褲子弄壞，讓它像舊褲子一樣。","qs":[{"q":"「象吾故袴」的「故」是什麼意思？","opts":["原因","所以","舊的","故意"],"ans":"C","steps":["組詞「故鄉、故人」，代回：像我的舊褲子 → 通","驗證：後面「毀新，令如故袴」，新和故相對","上一篇「人問其故」是原因，這裡是舊的"],"tests":"一字多義：故","avoid":"找相對的字：新對故"},{"q":"「象吾故袴」的「象」是什麼意思？","opts":["大象","像","象牙","形象"],"ans":"B","steps":["代回「大象我的舊褲子」→ 讀不通","代回「像我的舊褲子」→ 通","驗證：後面「令如故袴」，如＝像，意思相同"],"tests":"字義：象","avoid":"找意思相同的字互相驗證"},{"q":"「妻子因毀新」的「因」是什麼意思？","opts":["因為","原因","於是、就","依靠"],"ans":"C","steps":["組詞「因
