":"C","steps":["楊朱說「子亦猶是也」：你也會一樣","狗出去是白的、回來變黑的，你也會覺得奇怪","道理：先換個角度想，不要隨便怪別人"],"tests":"故事的道理","avoid":"道理在最後勸人的那段話"}]},{"title":"炳燭之明","text":["晉平公問於師曠曰：「吾年七十欲學，恐已暮矣。」師曠曰：「何不炳燭乎？」平公曰：「安有為人臣而戲其君乎？」師曠曰：「盲臣安敢戲其君乎？臣聞之，少而好學，如日出之陽；壯而好學，如日中之光；老而好學，如炳燭之明。炳燭之明，孰與昧行乎？」平公曰：「善哉！」"],"cite":"《說苑．建本》","notes":"晉平公：晉國國君　師曠：晉國的樂師，眼睛看不見　暮：晚　炳燭：點燃蠟燭　安：哪裡、怎麼　戲：開玩笑　壯：壯年　孰與：和……比起來哪一個好　昧行：在黑暗中走路","trans":"晉平公問師曠說：「我今年七十歲了，想要學習，恐怕已經太晚了。」師曠說：「為什麼不點起蠟燭呢？」平公說：「哪有做臣子的拿國君開玩笑的呢？」師曠說：「我這個瞎眼的臣子怎麼敢拿國君開玩笑呢？我聽說，年少時愛好學習，就像早上的太陽；壯年時愛好學習，就像中午的陽光；年老時愛好學習，就像點燃蠟燭的光亮。點著蠟燭的光亮，和在黑暗中走路比起來，哪一個好呢？」平公說：「說得好啊！」","qs":[{"q":"「安有為人臣而戲其君乎」是誰說的？","opts":["晉平公","師曠","作者","其他大臣"],"ans":"A","steps":["找「曰」前面：「平公曰」","他以為師曠說點蠟燭是在開玩笑","所以是晉平公說的"],"tests":"對話題：找說話者","avoid":"「曰」前面就是說話的人"},{"q":"「盲臣安敢戲其君乎」的「盲臣」指誰？","opts":["晉平公","師曠","其他看不見的人","一位老人"],"ans":"B","steps":["這句在「師曠曰」後面","臣＝說話的人在國君面前謙稱自己","師曠眼睛看不見（注釋），盲臣＝師曠自己"],"tests":"稱謂換算","avoid":"「臣」是對國君說的「我」"},{"q":"「少而好學」的「少」是什麼意思？","opts":["很少","缺少","少數人","年少的時候"],"ans":"D","steps":["後面接著「壯而好學」「老而好學」","少、壯、老是三個年紀","少＝年少"],"tests":"古今異義：少","avoid":"和「壯」「老」排在一起就是年紀"},{"q":"師曠用「炳燭之明」比喻什麼？","opts":["年老時學習","年少時學習","壯年時學習","國君的光芒"],"ans":"A","steps":["找對應：「老而好學，如炳燭之明」","日出 → 少，日中 → 壯，炳燭 → 老","所以炳燭＝年老時學習"],"tests":"看懂比喻","avoid":"比喻一組一組對好"},{"q":"師曠想說服平公的道理是什麼？","opts":["老了才學雖然比不上年輕時，總比不學好","老人學習沒有用","晚上讀書要點蠟燭","年輕人不必急著學習"],"ans":"A","steps":["關鍵句：「炳燭之明，孰與昧行乎？」","點蠟燭雖然不如太陽亮，總比在黑暗中走路好","道理：老了學習仍然有用"],"tests":"人物的主張","avoid":"最後一個問句常是重點"}]}]},"cap":{"no":"會考實戰","title":"第 3 週會考實戰","skill":"會考解題技法：文言單題：補主詞＋代回","steps":["❶ 先看題目最後一句：問誰？問「正確」還是「錯誤、最不恰當」？","❷ 圈出每一個動作，往前找最近出現的人，把「誰」補回去","❸ 看到「曰」「或」「其」「子」「之」，停下來問：這裡換人了嗎？","❹ 把選項的人物、原因放回原句讀一遍，人和事都對得上才留下","❺ 字義題用五招：先組詞代回，不通再看人物動作目的"],"demo":{"q":"示範題：【110 年會考第 28 題】「淳于恭，字孟孫，北海人。人有盜刈恭禾者，恭見之，念其愧，因伏草中，至去乃起。」根據這則故事，下列敘述何者最恰當？（甲）當時五穀歉收，盜賊四處搶糧（乙）淳于恭個性溫厚寬容，能體恤他人（丙）北海地區盜賊兇悍，人民不敢與之對抗（丁）淳于恭伏於草中，乃因心中有愧，不欲見人（註：刈，音ㄧˋ，割取）","a":["→ 先看題目：問「最恰當」，是人物、原因的細節題","→ 補主詞：「人有盜刈恭禾者」＝有人偷割淳于恭的稻子；「恭見之」＝淳于恭看見小偷","→ 補主詞：「念其愧」的「其」是誰？會覺得慚愧的是偷東西的人，所以是淳于恭想到小偷會不好意思","→ 補主詞：「因伏草中」是淳于恭躲起來；「至去乃起」＝等小偷走了，淳于恭才站起來","→ 代回選項：慚愧的是小偷不是淳于恭；原文沒提歉收、沒提盜賊兇悍；他怕小偷難堪而躲起來，就是體貼別人","答：淳于恭個性溫厚寬容，能體恤他人"]},"teach":{"intro":"文言文很愛省略「誰」，會考最常就在這裡設陷阱；只要把主詞補回去、把選項代回原句，大部分文言單題就解開了。","items":[{"t":"什麼是「省略主詞」？","d":["文言文前面講過的人，後面就不再寫名字，直接寫動作。","例如「恭見之，念其愧，因伏草中」，「因伏草中」前面沒寫誰，其實還是淳于恭。"],"ex":"像籃球轉播：「抄球、運球、上籃！」沒說是誰，但你看前一個鏡頭就知道是同一個球員。"},{"t":"什麼是「補主詞」？","d":["補主詞三步：圈出動作 → 往前找最近出現的人 → 想想這個動作是不是他做得到、做得合理。","要特別注意換人的訊號：「曰」前面換人說話、「或」＝有人、「其」「之」「子」是代名詞，要換成真正的人。"],"ex":"像柴犬和你一起散步：「看到松鼠，衝過去，被拉回來」——衝過去的是柴犬，拉回來的是你，一句話裡主詞換人了。"},{"t":"什麼是「代回」？","d":["把選項的說法放回原句，讀讀看意思通不通、人物對不對。","字義題也一樣：先把字組成詞，再放回句子讀，通順的就是答案。"],"ex":"像換球員上場：把替補放進陣容跑一次戰術，跑得順才代表放對位置。"},{"t":"第 1 期教過的「五招」怎麼搭配？","d":["第一招組詞代回最先用；選項都像對時，第二招看人物、動作、目的換招驗證。","還不行再用部首、對稱句，成語只當備用。"],"ex":"像比賽打法：先打最拿手的戰術，被守住了再換第二套，最後才用壓箱寶。"}],"demo":["①先看題目最後一句：問「最恰當」，要找原文有證據的敘述","②補主詞：偷稻子的是別人，「念其愧」的「其」是小偷，躲起來、等人走才起來的是淳于恭","③代回選項：心中有愧的是小偷不是淳于恭，歉收和盜賊兇悍原文沒寫，所以答淳于恭溫厚寬容、能體恤他人"]},"parts":[{"label":"第一篇","title":"110 年會考 第 8、30、32 題（單題）","text":[],"cite":"110 年國中教育會考國文科 第 8、30、32 題（國家教育研究院心測中心）","notes":"麇：音ㄐㄩㄣ，形體似鹿之獸","trans":"第 8 題：從前有個人沒見過麒麟，問見過的人：「麒麟長什麼樣子？」見過的人說：「麒麟長得像麒麟。」問的人說：「如果我見過麒麟，就不會問你了。你說麒麟像麒麟，怎麼能讓人懂呢？」見過的人說：「麒麟，有麇的身體、牛的尾巴、鹿的蹄、馬的背。」問的人一下子就明白了。　第 30 題：胡旦晚年眼睛生病，關起門來在家閒住。有一天，史館的官員一起討論要替一位顯貴的侯爺寫傳記，這個人年輕時出身低賤，曾經殺豬。史官認為不寫就不是真實的紀錄，寫了又很難下筆。於是一起去見胡旦，胡旦說：「為什麼不寫『某人年少時曾經拿刀切割』，表示他有主宰天下的志向。」大家沒有不讚嘆佩服的。　第 32 題：一定準備兩副湯匙筷子，吃飯前菜色很多。挑出想吃的，用另一雙筷子夾起來，放在一個容器裡，吃的時候一定吃光。吃飯前用另一支湯匙把飯分出來另外放，才開始用餐。吳皇后曾經問他原因，他說：「我不想把吃剩的食物給宮裡的人吃。」","qs":[{"q":"「昔人未見麟，問嘗見者：『麟何類乎？』見者曰：『麟如麟也。』問者曰：『若吾嘗見麟，則不問子矣。而云麟如麟，寧可解哉？』見者曰：『麟者，麇身牛尾，鹿蹄馬背。』問者豁然而解。」根據這則故事，下列敘述何者最恰當？","opts":["問者蓄意為難，明知故問","見者實未曾見麟，信口開河","問者終不得其解，寧可自尋答案","見者最後以具體事物為喻，輔助說明"],"ans":"D","steps":["補主詞：這則故事只有兩個人，「問者」沒見過麒麟，「見者」見過；每個「曰」前面都寫清楚是誰在說。","問者說「若吾嘗見麟，則不問子矣」＝我要是見過就不會問你，所以不是明知故問；「嘗見者」＝曾經見過的人，不是信口開河；最後「豁然而解」＝一下子懂了，不是沒得到答案。","見者最後用麇、牛、鹿、馬這些大家看過的動物來比，答「以具體事物為喻」。"],"tests":"人物對話補主詞","avoid":"每句「曰」先標上是誰說的"},{"q":"胡旦晚年病目，閉門閒居。一日，史館共議作一貴侯傳，其人少賤，嘗屠豕豬。史官以為諱之即非實錄，書之即難為辭。相與見旦，旦曰：「何不曰『某少嘗操刀以割』，示有宰天下之志。」莫不嘆服。\n根據這則故事，下列關於胡旦的敘述何者最恰當？","opts":["年少時曾操刀殺豬","史官共議為其立傳","史官因不知如何記實而登門求教","眾人因其有宰割天下之志而嘆服"],"ans":"C","steps":["補主詞：「其人少賤，嘗屠豕豬」的「其人」是那位貴侯，殺豬的是貴侯，不是胡旦；史官要立傳的對象也是貴侯。","「史官以為諱之即非實錄，書之即難為辭」＝不寫不真實、寫了又難聽；「相與見旦」主詞是史官們，他們是為了這個難題去找胡旦。","「有宰天下之志」是胡旦替貴侯想的漂亮說法，大家佩服的是胡旦的妙筆，答「史官因不知如何記實而登門求教」。"],"tests":"補主詞分清人物","avoid":"「其人」先找出指的是誰"},{"q":"「必備匙箸兩副，食前多品。擇取欲食者，以別箸取之，置一器中，食之必盡。飯前以別匙分而另置，始膳。吳后嘗問其故，曰：『不欲以殘食與宮人食也。』」這段文字記載宋高宗的用膳習慣，據此可看出他具備什麼樣的特質？","opts":["用餐講究排場","飲食注重養生","對妻言聽計從","待下體貼細心"],"ans":"D","steps":["補主詞：題目說這段寫宋高宗，所以「擇取」「取之」「食之必盡」都是宋高宗做的；「吳后嘗問其故」是皇后問，後面的「曰」換回宋高宗回答。","代回他的回答：「不欲以殘食與宮人食也」＝不想把吃剩的東西給宮人吃，所以先用另一雙筷子把要吃的分出來。","原文沒說排場、養生，皇后只是問原因，不是他聽皇后的話；答「待下體貼細心」。"],"tests":"從行為推人物特質","avoid":"問答句先分清誰問誰答"}]},{"label":"第二篇","title":"107 年會考 第 24、32、33 題（單題）","text":[],"cite":"107 年國中教育會考國文科 第 24、32、33 題（國家教育研究院心測中心）","notes":"邊候：邊吏　屬文：連綴字句而成文，指寫文章","trans":"第 24 題：秦王和中期爭論，秦王辯輸了。秦王非常生氣，中期卻慢慢地走開。有人替中期向秦王說：「中期真是個強悍的人啊！他剛好遇到英明的君主才能這樣。要是從前遇到夏桀、商紂，一定會殺了他。」秦王因此不怪罪中期。　第 32 題：伍子胥出逃，被邊境的官吏抓到。子胥說：「君王要抓我，是因為我有一顆美珠。現在我已經弄丟了，我會說是你拿走吞下去了。」邊吏因此放了他。　第 33 題：隋煬帝擅長寫文章，卻不希望別人寫得比他好，司隸薛道衡因此得罪了他。後來找了別的事殺了薛道衡，還說：「你還能寫出『空梁落燕泥』這樣的句子嗎？」","qs":[{"q":"「秦王與中期爭論，不勝。秦王大怒，中期徐行而去。或為中期說秦王曰：『悍人也，中期！適遇明君故也。向者遇桀、紂，必殺之矣。』秦王因不罪。」根據這段文字，下列敘述何者正確？","opts":["中期說服秦王不加罪於他","秦王因中期與人爭論不勝而大怒","中期徐行而去，表現其謙和的應對態度","秦王不怪罪中期的原因是不願被比做桀、紂"],"ans":"D","steps":["補主詞：「不勝」接在「秦王與中期爭論」後面，下一句「秦王大怒」，所以輸的是秦王；「或為中期說秦王」的「或」＝有人，替中期說話的不是中期自己。","代回那個人的話：遇到明君才敢這樣，要是遇到桀、紂早就被殺了。秦王如果怪罪中期，就等於承認自己像桀、紂。","中期被稱為「悍人」，不是謙和；所以答「不願被比做桀、紂」。"],"tests":"補主詞找原因","avoid":"「或」是有人，不是前面那個人"},{"q":"子胥出逃，邊候得之。子胥曰：「上索我者，以我有美珠也。今我已亡之矣，我將謂子取而吞之。」候因釋之。\n根據這段文字，下列敘述何者正確？","opts":["子胥用言語威脅邊候以求自保","子胥以美珠賄賂邊候換取自由","邊候侵吞子胥的美珠又誣陷他","邊候相信子胥的清白而釋放他"],"ans":"A","steps":["補主詞：「邊候得之」＝邊吏抓到子胥；子胥說話裡的「子」＝你，就是邊吏；「候因釋之」＝邊吏因此放了子胥。","代回：「亡之」＝把珠子弄丟了，所以沒有拿珠子賄賂；「我將謂子取而吞之」＝我會說是你拿去吞了，這是嚇唬邊吏的話。","邊吏怕被誣賴才放人，不是相信他清白，也沒有真的吞珠子；答「用言語威脅邊候以求自保」。"],"tests":"代名詞補回人物","avoid":"「子」「之」先換成真正的人"},{"q":"隋煬帝善屬文，而不欲人出其右，司隸薛道衡由是得罪。後因事誅之，曰：「更能作『空梁落燕泥』否？」\n根據這段文字，可以推知下列何者？","opts":["煬帝命薛道衡作詩，薛因抗命而被殺","薛道衡死後，煬帝感嘆再也無人能出其右","薛道衡因事被誅，臨刑以「空梁」一詩明志","煬帝嫉妒薛道衡能有「空梁落燕泥」這等佳句"],"ans":"D","steps":["補主詞：「後因事誅之」是煬帝殺了薛道衡，後面的「曰」也是煬帝在說話，不是薛道衡臨死前說的。","代回：「不欲人出其右」＝不想別人比他強；「更能作『空梁落燕泥』否」＝你還寫得出這句嗎？這是煬帝在嘲笑他。","原文沒有命令作詩、也不是感嘆；煬帝因為薛道衡寫得比自己好而記恨，答「嫉妒…佳句」。"],"tests":"補回說話的人","avoid":"人死後還有「曰」，先確認是誰說"}]},{"label":"第三篇","title":"110 年會考 第 17、26、27 題（單題）","text":[],"cite":"110 年國中教育會考國文科 第 17、26、27 題（國家教育研究院心測中心）","notes":"藉：鋪墊","trans":"第 17 題：洛陽的風俗，大多喜愛牡丹。春天時城裡不分貴賤都插花，就連挑擔子的人也一樣。花開的時候，讀書人和百姓爭相出遊，直到花謝了才停止。洛陽到東京有六個驛站，以前不進貢花，從今年起派一名軍官，騎著驛站的馬，一天一夜送到京城。進貢的不過是姚黃、魏紫三幾朵。用菜葉塞滿竹籠子，墊著、蓋著，讓花在馬上不搖晃，用蠟封住花蒂，就能好幾天不凋落。　第 27 題：王國維評論姜白石的詞說：「古今詞人格調的高雅，沒有人比得上白石。可惜他不在意境上用心，所以讓人覺得沒有言語之外的韻味、琴弦之外的餘音。終究不能列入第一流的作者。」","qs":[{"q":"「洛陽之俗，大抵好牡丹，春時城中無分貴賤皆插花，雖負擔者亦然。花開時，士庶競為遊遨，至花落乃罷。洛陽至東京六驛，舊不進花，自今歲遣衙校一員，乘驛馬，一日一夕至京師。所進不過姚黃魏紫三數朵。以菜葉實竹籠子，藉覆之使馬上不動搖，以蠟封蒂，乃數日不落。」根據這段文字，下列關於牡丹的敘述何者最恰當？","opts":["姚黃魏紫指的皆是牡丹","洛陽權貴才有資格買牡丹","牡丹運送前須以蠟整株封存","牡丹運送時以菜葉提供其養分"],"ans":"A","steps":["補主詞：「舊不進花」「所進」進貢的是什麼花？前面整段都在講牡丹，所以「所進不過姚黃魏紫三數朵」＝送去的牡丹只有姚黃、魏紫幾朵，這兩個是牡丹的品種。","代回其他選項：「無分貴賤皆插花，雖負擔者亦然」＝挑擔子的人也插，不是只有權貴；「以蠟封蒂」只封花蒂，不是整株。","菜葉是「藉覆之使馬上不動搖」＝墊著蓋著不讓花搖晃，不是養分；答「姚黃魏紫指的皆是牡丹」。"],"tests":"省略受詞補回","avoid":"選項的目的要和原句的目的對上"},{"q":"彭玉麟任江南巡按時，有人告訴他武昌知府靠逢迎拍馬才能升官。彭公聽了大怒，召知府來斥責，武昌知府恭謹地說：「卑職奉承的對象，都是喜歡被奉承的人，像大人您這樣公正嚴明，卑職再會奉承也沒有用啊！」彭公聽了得意地笑說：「我就知道你拍不了我的馬屁。」\n根據這則故事，關於彭公和武昌知府的敘述何者⟦最不恰當⟧？","opts":["彭公自認不喜歡被人奉承","彭公被拍了馬屁還不自知","武昌知府不會對公正之人逢迎","武昌知府逢迎拍馬的能力極佳"],"ans":"C","steps":["先看題目：問「最不恰當」，要找錯的。再分清每句話是誰說的：知府說「像大人您這樣公正嚴明，卑職再會奉承也沒有用」，這句話本身就是在誇彭公。","彭公「得意地笑」還說「你拍不了我的馬屁」，表示他自認不愛被奉承，卻被拍了還不知道；知府一句話就讓生氣的長官笑了，拍馬屁功力很強。","知府嘴上說不會對公正的人奉承，其實當場就在奉承彭公，所以這句不恰當，答「武昌知府不會對公正之人逢迎」。"],"tests":"看穿人物言行","avoid":"說的話和做的事要分開比對"},{"q":"王國維評姜白石詞：「古今詞人格調之高，無如白石。惜不於意境上用力，故覺無言外之味、弦外之響。終不能與於第一流之作者也。」下列何者最符合這段文字的觀點？","opts":["白石非第一流之作者","白石之詞善於經營意境","有弦外之響者必是第一流詞作","詞有言外之意方顯作者格調之高"],"ans":"A","steps":["補主詞：「惜不於意境上用力」「終不能與於第一流之作者也」主詞都是白石，補回去就是：白石可惜不在意境上用心，白石終究不能列入第一流作者。","代回選項：白石「不於意境上用力」，所以不是善於經營意境；原文只說沒有弦外之響就不是第一流，沒說有了就「必是」第一流。","白石格調最高卻沒有言外之味，可見格調和言外之意是兩回事；答「白石非第一流之作者」。"],"tests":"補主詞讀評論","avoid":"小心選項把條件說成「必」"}]},{"label":"第四篇","title":"107 年會考 第 17、25 題（單題）","text":[],"cite":"107 年國中教育會考國文科 第 17、25 題（國家教育研究院心測中心）","notes":"","trans":"第 17 題：題幹「家國身猶負，星霜鬢已侵」＝國家和家庭的責任還背在身上，歲月流逝，霜一樣的白已經爬上兩鬢。四個選項：不知道明亮的鏡子裡，從哪裡來了這片秋霜／漫長的夜裡有一位美人，絲綢衣服沾上了秋天的霜／心跟著明亮的太陽升高，志向和秋霜一樣潔白／五月就想穿貂皮大衣，說是秋霜已經降下來了。　第 25 題：舜從田野中被起用／表現在臉色上、發出在聲音裡，然後別人才明白；奇特的山水，天下獨一無二／明媚秀麗的山水，讓人稱讚個不停；心裡朝向哪裡，就看到成千上百隻，果然像鶴一樣／大軍一到，所朝向的地方敵人都潰散；爹娘聽說女兒回來，走出城外互相攙扶／想把這份心意和你說，又說秦關還遠在千里之外。","qs":[{"q":"「家國身猶負，星霜鬢已侵。」句中以「霜」來形容鬢髮變白。下列詩句中的「霜」字，何者也是指鬢髮變白？","opts":["不知明鏡裡，何處得秋霜","遙夜一美人，羅衣霑秋霜","心隨朗日高，志與秋霜潔","五月思貂裘，謂言秋霜落"],"ans":"A","steps":["用「代回」：把「白頭髮」放進每一句的「霜」試試看，通的才留下。","「明鏡裡」照鏡子看到秋霜，鏡子裡只照得到自己，所以是頭髮白了；「羅衣霑秋霜」是衣服沾到霜露；「志與秋霜潔」是說志向像霜一樣潔白；「謂言秋霜落」是以為秋天降霜、天氣變冷。","只有照鏡子那一句代回「白髮」說得通，答「不知明鏡裡，何處得秋霜」。"],"tests":"詩句字義代回","avoid":"把題目給的意思放進去讀讀看"},{"q":"下列文句「」中的字，何者意義前後相同？","opts":["舜「發」於畎畝之中／徵於色，「發」於聲，而後喻","奇山異水，天下獨「絕」／明山秀水，令人讚不「絕」口","心之所「向」，則或千或百，果然鶴也／大軍之至，所「向」披靡","爺孃聞女來，出郭相扶「將」／欲「將」此意與君論，復道秦關尚千里"],"ans":"C","steps":["用五招第一招「組詞代回」：每個字組一個詞放回句子。","「舜發於畎畝」＝被起用，「發於聲」＝表現出來；「天下獨絕」＝極好、獨一無二，「讚不絕口」＝停止；「相扶將」＝攙扶，「欲將此意」＝把。","「心之所向」＝心朝著的方向，「所向披靡」＝軍隊朝著的地方敵人都倒下，兩個都是「朝向」，答第三個。"],"tests":"同字代回比較","avoid":"每個字都組詞放回去再比"}]},{"label":"第五篇","title":"107 年會考 第 22、29、30 題（單題）","text":[],"cite":"107 年國中教育會考國文科 第 22、29、30 題（國家教育研究院心測中心）","notes":"警策：作品中精彩扼要足以驚動讀者的部分　隱：詳細考量　任：擔當、承受","trans":"第 22 題：現在讀書人的風氣，沒有不喜歡寫詩的，才剛進小學，就一心一意地追求。於是平庸的聲調、雜亂的體裁，每個人各寫各的樣子。甚至讓富貴人家的子弟，以文章比不上別人為恥，整天修飾字句，半夜還在苦吟。自己看認為是精彩的佳句，大家看了終究只是平淡普通。　第 29 題：有客人對張子野說：「大家都稱您『張三中』，就是『心中事、眼中淚、意中人』。」張先生說：「為什麼不叫我『張三影』？」客人不明白，張先生說：「『雲破月來花弄影』、『嬌柔懶起，簾壓捲花影』、『柳徑無人，墜輕絮無影』：這些是我一生最得意的句子。」　第 30 題：「一個人生病而有十個醫生，全部都用嗎？」答：「只用其中特別好的一個罷了。」「怎麼知道誰特別好而用他？」答：「大家所說特別好的人，再用我的心仔細考量，就可以了。才能不相當的人，不能一起商量，又會互相嫉妒。人群中愚笨無能的常常比較多，聰明能幹的常常比較少，十個醫生裡，怎麼知道愚笨無能的不是九個呢？全部都用，病人一天就病重而死，誰來承擔這個過錯呢？」","qs":[{"q":"「今之士俗，無不好詩，甫就小學，必甘心而馳騖焉。於是庸音雜體，人各為容。至使膏腴子弟，恥文不逮，終朝點綴，分夜呻吟。獨觀謂為警策，眾睹終淪平鈍。」作者寫作這段文字的用意，最可能是下列何者？","opts":["歌頌詩風鼎盛，雅俗共賞","憂心以詩取士，難得真才","慨嘆詩風雖盛，但少有佳作","讚嘆各類詩體兼備，蔚為大觀"],"ans":"C","steps":["補主詞：「恥文不逮，終朝點綴，分夜呻吟」都是「膏腴子弟」在做；「獨觀謂為警策」＝他們自己看覺得很棒，「眾睹終淪平鈍」＝大家看卻很普通。","代回整段：人人愛寫詩（詩風盛），但寫出來是「庸音雜體」（平庸雜亂），作者是在嘆氣，不是歌頌或讚嘆。","原文沒提用詩考試選人才；答「慨嘆詩風雖盛，但少有佳作」。"],"tests":"抓作者用意","avoid":"注意「庸」「平鈍」這種貶義字"},{"q":"「有客謂子野曰：『人皆謂公張三中，即心中事、眼中淚、意中人也。』公曰：『何不目之為張三影？』客不曉，公曰：『雲破月來花弄影；嬌柔懶起，簾壓捲花影；柳徑無人，墜輕絮無影：此余平生所得意也』。」根據這段文字，下列敘述何者⟦錯誤⟧？","opts":["子野詞作風格以婉約、柔美為主","寫作用字，子野有其特殊的喜好","子野自認平生佳作無多，僅此三則","世人稱許之處，子野未必全盤同意"],"ans":"C","steps":["先看題目問「錯誤」。補主詞：「公」＝子野；「公曰」是子野說話；「客不曉」是客人不懂；最後「此余平生所得意也」的「余」＝子野自己。","代回：「此余平生所得意也」＝這些是我一生最得意的句子，只說最得意，沒說只有這三則好作品。","三句都用「影」字，可見他偏愛這個字；大家叫他「三中」，他想改叫「三影」，表示不完全同意。所以錯的是「佳作無多，僅此三則」。"],"tests":"補主詞找錯誤","avoid":"「最得意」不等於「只有這些」"},{"q":"「一人疾焉而醫者十，並使之歟？」曰：「使其尤良者一人焉爾。」「烏知其尤良而使之？」曰：「眾人之所謂尤良者，而隱之以吾心，其可也。夫材不相逮，不相為謀，又相忌也。人之愚不能者常多，而智能者常少，醫者十，愚不能者烏知其不九邪？並使之，一日而病且亡，誰者任其咎邪？」\n作者在這段文字中雖論使醫治病，但用意卻在談用人治國之理。據此，作者主張在上位者應該如何？","opts":["眾口交譽之人，直接任用","善於汰劣擢優，委賢重任","務求廣納眾議，興利除弊","使愚智不相忌，同心為國"],"ans":"B","steps":["補主詞：這是一問一答，沒有「曰」的是發問的人，有「曰」的是作者回答；作者的主張都在「曰」後面。","代回作者的話：「使其尤良者一人」＝只用最好的那一個；選法是先聽大家說誰好，再「隱之以吾心」自己仔細考量，所以不是直接任用。","作者反對「並使之」（全部都用），因為能力不同會互相嫉妒、笨的人比較多；所以要挑出好的、交給他重任，答「善於汰劣擢優，委賢重任」。"],"tests":"問答體找主張","avoid":"先分出哪句是問、哪句是答"}]},{"label":"第六篇","title":"107 年會考 第 31 題","text":[],"cite":"107 年國中教育會考國文科 第 31 題（國家教育研究院心測中心）","notes":"若個：哪個","trans":"甲：春雪滿天飄下來，落到哪裡都像花開一樣。不知道園子裡的樹，哪一棵才是真正的梅花？　乙：牆角有幾枝梅花，冒著寒冷獨自開放。遠遠就知道那不是雪，因為有淡淡的香氣飄過來。","qs":[{"q":"【甲】春雪滿空來，觸處似花開。不知園裡樹，若個是真梅？\n【乙】牆角數枝梅，凌寒獨自開。遙知不是雪，為有暗香來。\n根據甲、乙兩詩的內涵，下列敘述何者最恰當？","opts":["甲詩以梅喻雪，乙詩以雪喻梅","甲詩主題是詠雪，乙詩主題是詠梅","兩詩所描繪的都是暮春夜晚的景致","兩詩作者都無法分辨眼前所見是雪還是梅"],"ans":"B","steps":["補主詞：甲詩第一句主角是「春雪」，雪落在樹上像花開，讓人分不出真梅；乙詩第一句主角是「梅」，梅在寒冷中開。","代回：甲詩寫雪，乙詩寫梅，主題各不同。乙詩「遙知不是雪」是說「我知道這不是雪」，是靠香氣分辨，不是拿雪來比喻梅；作者也分得出來，所以「都無法分辨」錯。","一首寫春雪、一首寫寒冬，都沒寫夜晚；答「甲詩主題是詠雪，乙詩主題是詠梅」。"],"tests":"甲乙詩比主角","avoid":"先找每首詩第一句的主角"}]},{"label":"第七篇","title":"110 年會考 第 9 題","text":[],"cite":"110 年國中教育會考國文科 第 9 題（國家教育研究院心測中心）","notes":"","trans":"放下船帆停留在淮水邊的小鎮，把船停靠在孤零零的驛站旁。廣闊的水面上風吹起波浪，昏暗中太陽在傍晚沉落。行人回到山城裡，四周暗了下來，大雁飛落在長滿蘆葦的沙洲上，一片白茫茫。獨自在夜裡想念遙遠的秦地關中，聽著鐘聲，我是個睡不著的旅人。","qs":[{"q":"「落帆逗淮鎮，停舫臨孤驛。浩浩風起波，冥冥日沉夕。人歸山郭暗，雁下蘆洲白。獨夜憶秦關，聽鐘未眠客。」關於這首詩的分析，下列敘述何者最恰當？","opts":["首兩句寫出與友餞別的地點與時間","以「風起」、「日沉」自喻懷才不遇","以「雁下蘆洲白」表示太陽將升起","末兩句點出客因心有所思而不成眠"],"ans":"D","steps":["補主詞：詩裡沒寫「我」，但「落帆」「停舫」「憶秦關」「聽鐘」都是同一個人，就是最後一句的「未眠客」＝睡不著的旅人。","代回：首兩句是停船靠岸過夜，沒有送朋友；「日沉夕」「人歸山郭暗」是傍晚天黑，不是太陽要升起；風起日沉是寫景，原詩沒提懷才不遇。","旅人「獨夜憶秦關」＝夜裡想著遠方，所以「聽鐘未眠」，答「末兩句點出客因心有所思而不成眠」。"],"tests":"詩中補回主角","avoid":"詩沒寫「我」時，從末句找主角"}]},{"label":"第八篇","title":"110 年會考 第 42～43 題（題組）","text":["洪七公竹棒一擺，就要上前動手。黃藥師搖頭道：「你適才跟老毒物打了這麼久，雖然說不上筋疲力盡，卻也是大累了一場，黃某豈能撿這個便宜？咱們還是等到正午再比，你好好養力罷。」洪七公雖知他說得有理，但不耐煩再等，堅要立時比武。黃藥師坐在石上，不去睬他。","黃蓉見兩人爭執難決，說道：「爹爹，師父，我倒有個法兒在此。你倆既可立時比武，爹爹又不占便宜。」兩人齊道：「好啊，什麼法兒？」黃蓉道：「你們兩位是多年好友，不論誰勝誰敗，總是傷了和氣。可是今日華山論劍，卻又勢須分出勝敗，比出誰為天下第一，是不是？」","洪、黃二人本就想到此事，這時聽她言語，似乎倒有一個妙法竟可三全其美，既能立時動手，又可不讓黃藥師占便宜，而且還能使兩家不傷和氣，齊問：「你有什麼好主意？」黃蓉道：「是這樣：爹爹先跟郭靖過招，瞧在第幾招上打敗了他，然後師父再與郭靖過招。若是爹爹用九十九招取勝，而師父用了一百招，那就是爹爹勝了。倘若師父只用九十八招，那就是師父勝了。」","洪七公笑道：「妙極，妙極！」黃蓉道：「郭靖先和爹爹比，兩人都是精力充沛，待與師父再比，兩人都是打過了一場，豈不是公平得緊麼？」黃藥師點點頭道：「這法兒不錯。」","——改寫自金庸《射鵰英雄傳》"],"cite":"110 年國中教育會考國文科 第 42～43 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，黃蓉提議的優點⟦不包含⟧下列何者？","opts":["減少比賽的場次","顧及比賽的公平性","毋須等待，可立刻開戰","不必直接對戰，不傷和氣"],"ans":"A","steps":["先看題目問「不包含」。補主詞：「兩人齊道」「齊問」的兩人是洪七公和黃藥師；「爹爹」是黃藥師，「師父」是洪七公。","原文直接列出三個好處：「既能立時動手，又可不讓黃藥師占便宜，而且還能使兩家不傷和氣」，對上立刻開戰、公平、不傷和氣。","原本只要洪、黃打一場，改成兩人各跟郭靖打一場，場次反而變多，答「減少比賽的場次」。"],"tests":"找不包含的優點","avoid":"原文列出的好處一條一條勾掉"},{"q":"根據黃蓉所提的賽制，假設比武結果最後是黃藥師天下第一，下列哪件事一定會發生？","opts":["郭靖打贏洪七公","黃藥師打贏郭靖","洪七公打贏黃藥師","黃藥師打贏洪七公"],"ans":"B","steps":["代回規則：兩人都跟郭靖打，看誰「在第幾招上打敗了他」，用的招數少的人贏。","黃藥師要當天下第一，前提是他一定要打敗郭靖，而且用的招數比洪七公少；洪七公和黃藥師根本沒有直接對打，所以後兩個選項不會發生。","洪七公也可能打敗郭靖，只是用的招數比較多，所以郭靖不一定贏他；一定會發生的是「黃藥師打贏郭靖」。"],"tests":"依規則推論","avoid":"「一定」要找每種情況都成立的"}]}]}},{"week":4,"groups":[{"no":"第 1 組","title":"濫竽充數","skill":"補主詞＋虛詞＋推論","steps":["❶ 看到動作先問：「誰做的？」往前找最近的人","❷ 圈出虛詞「而、故、乃、之」，當作路標","❸ 把兩、三句證據放在一起，推出文章沒直說的事","❹ 選項要有證據，不能是自己腦補"],"demo":{"q":"「南郭處士請為王吹竽」的「為」是什麼意思？","a":["→ 代「成為」：請求成為王吹竽？讀不通","→ 代「替」：請求替大王吹竽 → 通","答：替"]},"parts":[{"label":"第一篇","title":"濫竽充數","text":["齊宣王使人吹竽，必三百人。南郭處士請為王吹竽，宣王說之，廩食以數百人。宣王死，湣王立，好一一聽之，處士逃。"],"cite":"《韓非子．內儲說上》","notes":"竽：一種吹奏樂器　處士：沒有做官的讀書人　廩食：用官府的糧食供養　湣王：宣王的兒子　立：即位","trans":"齊宣王派人吹竽，一定要三百人一起吹。南郭處士請求替宣王吹竽，宣王很高興，用供養幾百人的糧食來供養他們。宣王死後，湣王即位，喜歡一個一個地聽人吹奏，南郭處士就逃走了。","qs":[{"q":"「宣王說之」的「之」指的是誰？","opts":["南郭處士","吹竽的三百人","湣王","齊國百姓"],"ans":"A","steps":["前一句：「南郭處士請為王吹竽」","宣王高興的，是提出請求的那個人","所以「之」＝南郭處士"],"tests":"代詞「之」指誰","avoid":"「之」是他，往前找最近的人"},{"q":"「好一一聽之」，喜歡一個一個聽的人是誰？","opts":["宣王","南郭處士","湣王","三百個樂手"],"ans":"C","steps":["往前找：「宣王死，湣王立」","宣王已經死了，接著做事的是新國君","所以喜歡一一聽的是湣王"],"tests":"補主詞","avoid":"主詞省略時，往前找最近的人"},{"q":"「齊宣王使人吹竽」的「使」是什麼意思？","opts":["使用","派、讓","使者","假使"],"ans":"B","steps":["代回「齊宣王派人吹竽」→ 通","「使用人吹竽」「假使人吹竽」都讀不通","所以「使」＝派、讓"],"tests":"字義：使","avoid":"把每個意思代回去讀一次"},{"q":"南郭處士為什麼在湣王即位後逃走？","opts":["湣王不喜歡聽竽","他想到別的國家做官","宣王死了他太傷心","他其實不會吹竽，一個一個吹就會被發現"],"ans":"D","steps":["證據一：宣王時三百人一起吹，他混在裡面","證據二：湣王改成一一聽，他馬上逃","兩個證據合起來：單獨吹會露餡，所以他其實不會吹"],"tests":"推論：兩證據合推","avoid":"把前後兩個情況放一起比"}]},{"label":"第二篇","title":"齊人有好獵者","text":["齊人有好獵者，曠日持久而不得獸，入則媿其家室，出則媿其知友州里。惟其所以不得之故，則狗惡也。欲得良狗，則家貧無以。於是還疾耕，疾耕則家富，家富則有以求良狗，狗良則數得獸矣，田獵之獲常過人矣。"],"cite":"《呂氏春秋．貴當》（節選）","notes":"曠日持久：花很長的時間　媿：同「愧」，慚愧　家室：家人　知友州里：朋友鄉親　惟：思考　惡：不好　無以：沒有辦法　疾：努力　數：屢次","trans":"齊國有個喜歡打獵的人，花了很長時間卻打不到野獸，在家對家人感到慚愧，出門對朋友鄉親感到慚愧。他想了想打不到的原因，是狗不好。想要得到好狗，家裡卻窮得沒辦法。於是他回去努力耕田，努力耕田家裡就富有，家裡富有就有能力求得好狗，狗好了就常常打到野獸，打獵的收穫常常超過別人。","qs":[{"q":"「齊人有好獵者」的「好」是什麼意思？","opts":["好的","很","容易","喜歡"],"ans":"D","steps":["代回「齊國有個喜歡打獵的人」→ 通","和本週「好一一聽之」的好一樣","所以「好」＝喜歡"],"tests":"字義：好","avoid":"「好」放在動作前面，常是喜歡"},{"q":"「曠日持久而不得獸」的「而」是什麼意思？","opts":["然後","卻","而且","因為"],"ans":"B","steps":["前面：花了很長時間打獵","後面：打不到野獸，和期待相反","前後相反 →「而」＝卻"],"tests":"虛詞「而」轉折","avoid":"前後相反時，「而」讀成「卻」"},{"q":"他想了想，認為自己打不到獵物的原因是什麼？","opts":["狗不好","自己不夠努力","天氣不好","家人不支持"],"ans":"A","steps":["找證據：「惟其所以不得之故，則狗惡也」","注釋：惡＝不好","所以他認為是狗不好"],"tests":"找原因的證據句","avoid":"「所以……之故」後面就是原因"},{"q":"他最後能常常打到獵物，關鍵是什麼？","opts":["換了打獵的地方","朋友送他一隻好狗","先努力耕田變富，才有能力求得好狗","他每天練習射箭"],"ans":"C","steps":["一連串證據：疾耕 → 家富 → 有以求良狗 → 數得獸","文中沒有提到換地方、朋友送狗、練射箭","所以關鍵是先耕田變富"],"tests":"推論：因果連鎖","avoid":"順著「則」一個接一個找下去"}]},{"label":"第三篇","title":"扁鵲見蔡桓公","text":["扁鵲見蔡桓公，立有間，扁鵲曰：「君有疾在腠理，不治將恐深。」桓侯曰：「寡人無疾。」扁鵲出，桓侯曰：「醫之好治不病以為功。」"],"cite":"《韓非子．喻老》（節選）","notes":"扁鵲：古代名醫　立有間：站了一會兒　腠理：皮膚表面　寡人：國君自稱","trans":"扁鵲進見蔡桓公，站了一會兒，扁鵲說：「您的皮膚表面有病，不治療恐怕會加深。」桓侯說：「我沒有病。」扁鵲離開後，桓侯說：「醫生就喜歡醫治沒有病的人，來當作自己的功勞。」","qs":[{"q":"「君有疾在腠理」的「君」指的是誰？","opts":["扁鵲自己","旁邊的大臣","蔡桓公","其他醫生"],"ans":"C","steps":["這句是扁鵲對著蔡桓公說的話","下一句回答「寡人無疾」的是桓侯","所以「君」＝蔡桓公"],"tests":"人稱：君指誰","avoid":"看說話的人在對誰說"},{"q":"「醫之好治不病以為功」的「好」是什麼意思？","opts":["喜歡","很好","完成","方便"],"ans":"A","steps":["代回「醫生喜歡醫治沒病的人」→ 通","「很好醫治」「完成醫治」都讀不通","所以「好」＝喜歡"],"tests":"字義：好","avoid":"「好」在動作前，先代「喜歡」"},{"q":"桓侯說「醫之好治不病以為功」，表示他心裡怎麼想？","opts":["感謝扁鵲提醒","害怕自己病得很重","想請扁鵲留下來","認為扁鵲想搶功勞，不相信自己有病"],"ans":"D","steps":["證據一：他先說「寡人無疾」","證據二：扁鵲一走，他就說醫生愛治沒病的人來當功勞","合起來：他不信自己有病，還懷疑扁鵲"],"tests":"推論人物心理","avoid":"看人物前後兩句話怎麼說"},{"q":"扁鵲說「不治將恐深」，意思是什麼？","opts":["病已經治不好了","現在不治，病恐怕會變嚴重","病在骨頭裡很深","只要休息就會好"],"ans":"B","steps":["前一句：病在皮膚表面（腠理）","「將」＝將要，「深」＝加深","所以是：現在不治，以後會變嚴重"],"tests":"句意理解","avoid":"注意「將」是還沒發生的事"}]},{"label":"第四篇","title":"楚王好細腰","text":["昔者楚靈王好士細要，故靈王之臣皆以一飯為節，脅息然後帶，扶牆然後起。比期年，朝有黧黑之色。"],"cite":"《墨子．兼愛中》（節選）","notes":"士：臣子　要：同「腰」　節：限度　脅息：屏住呼吸　帶：繫上腰帶　比：等到　期年：一整年　朝：朝廷　黧黑：臉色又黑又黃","trans":"從前楚靈王喜歡臣子腰細，所以靈王的臣子都只吃一餐飯來限制自己，屏住呼吸後才繫上腰帶，扶著牆壁才站得起來。過了一年，朝廷上的大臣都臉色黑黃。","qs":[{"q":"「故靈王之臣皆以一飯為節」的「故」是什麼意思？","opts":["舊的","所以","故意","朋友"],"ans":"B","steps":["前面：楚靈王喜歡腰細的臣子（原因）","後面：臣子只吃一餐（結果）","原因接結果 →「故」＝所以"],"tests":"虛詞「故」","avoid":"「故」前是原因，後是結果"},{"q":"「扶牆然後起」，是誰要扶著牆才站得起來？","opts":["楚靈王","宮女","百姓","靈王的臣子"],"ans":"D","steps":["往前找：「靈王之臣皆以一飯為節，脅息然後帶」","後面一連串動作的主詞都沒換","所以扶牆的是靈王的臣子"],"tests":"補主詞","avoid":"主詞沒換時，一路沿用前面的人"},{"q":"臣子們為什麼一天只吃一餐？","opts":["國家缺糧食","生病吃不下","想讓腰變細，討好楚靈王","靈王下令不准吃"],"ans":"C","steps":["證據：「楚靈王好士細要，故……以一飯為節」","文中只說靈王「喜歡」，沒說「下令」","所以是為了腰細討好靈王"],"tests":"找原因的證據","avoid":"「好」是喜歡，不是命令"},{"q":"這段文字想說明什麼？","opts":["上位者的喜好，會讓下面的人跟著做，甚至傷害自己","少吃飯對身體好","楚國人天生都很瘦","楚靈王很關心臣子健康"],"ans":"A","steps":["證據一：靈王喜歡細腰，臣子就節食","證據二：一年後臣子臉色黑黃、站不穩","推出：上面的喜好影響下面，還傷了身體"],"tests":"推論主旨","avoid":"看開頭的原因和最後的結果"}]},{"label":"第五篇","title":"老馬識途","text":["管仲、隰朋從於桓公而伐孤竹，春往冬反，迷惑失道。管仲曰：「老馬之智可用也。」乃放老馬而隨之，遂得道。行山中無水，隰朋曰：「蟻冬居山之陽，夏居山之陰，蟻壤一寸而仞有水。」乃掘地，遂得水。"],"cite":"《韓非子．說林上》（節選）","notes":"管仲、隰朋：齊國大臣　桓公：齊桓公　孤竹：古國名　反：同「返」　遂：終於　陽：山的南面　陰：山的北面　蟻壤：螞蟻窩堆起的土　仞：古代長度單位","trans":"管仲、隰朋跟隨齊桓公去攻打孤竹國，春天出發，冬天回來，迷了路。管仲說：「老馬的智慧可以利用。」於是放開老馬，跟在牠後面走，終於找到了路。走到山裡沒有水，隰朋說：「螞蟻冬天住在山的南面，夏天住在山的北面，螞蟻窩的土堆高一寸，往下挖一仞深就有水。」於是挖地，終於找到了水。","qs":[{"q":"「乃放老馬而隨之」的「之」指的是什麼？","opts":["老馬","管仲","桓公","道路"],"ans":"A","steps":["同一句前面：「放老馬」","放開老馬，再跟在誰後面？","所以「之」＝老馬"],"tests":"代詞「之」指誰","avoid":"「之」常指同一句前面的東西"},{"q":"「乃放老馬而隨之」的「乃」是什麼意思？","opts":["你","卻","於是、就","竟然"],"ans":"C","steps":["前面：管仲說老馬的智慧可以用","後面：接著就放老馬，是順著做下去","所以「乃」＝於是、就"],"tests":"虛詞「乃」","avoid":"前後順著發生，「乃」讀成「於是」"},{"q":"「蟻冬居山之陽……」這段話是誰說的？","opts":["管仲","隰朋","桓公","孤竹國人"],"ans":"B","steps":["找說話的標記：「隰朋曰」","管仲說的是老馬那一句","所以是隰朋"],"tests":"找說話的人","avoid":"先找「某某曰」"},{"q":"這個故事最想稱讚什麼？","opts":["馬比人聰明","打仗一定會迷路","螞蟻會幫人挖井","遇到困難時，懂得向有經驗的事物學習"],"ans":"D","steps":["證據一：迷路時，靠老馬認路","證據二：沒水時，靠螞蟻的習性找水","兩件事合起來：善用身邊事物的經驗"],"tests":"推論主旨","avoid":"把兩件事的共同點找出來"}]}]},{"no":"第 2 組","title":"買櫝還珠","skill":"一字多義＋古今異義＋選項代回","steps":["❶ 先想這個字你學過哪幾個意思","❷ 現代意思代回去怪怪的 → 想古代意思（古今異義）","❸ 每個選項都代回原句讀一次，通的才選","❹ 用前後文再確認一次"],"demo":{"q":"「薰以桂椒」是什麼意思？","a":["→ 以＝用","→ 倒過來讀：用桂、椒來薰（匣子）","答：用桂、椒的香氣熏匣子"]},"parts":[{"label":"第一篇","title":"買櫝還珠","text":["楚人有賣其珠於鄭者，為木蘭之櫝，薰以桂椒，綴以珠玉，飾以玫瑰，輯以翡翠。鄭人買其櫝而還其珠。此可謂善賣櫝矣，未可謂善鬻珠也。"],"cite":"《韓非子．外儲說左上》","notes":"鄭：國名　木蘭：一種香木　薰：用香料熏　桂椒：兩種香料　綴：點綴　輯：連綴　翡翠：翠鳥的羽毛　櫝：木匣子","trans":"有個楚國人到鄭國賣珍珠，用木蘭做了一個匣子，用桂、椒的香氣熏它，用珠玉點綴它，用美玉裝飾它，用翠鳥的羽毛連綴它。鄭國人買下他的匣子，卻把珍珠還給他。這可以說是很會賣匣子，卻不能說是很會賣珍珠啊。","qs":[{"q":"「飾以玫瑰」的「玫瑰」是什麼？","opts":["一種花","紅色的布","香料","美玉"],"ans":"D","steps":["前後都是貴重材料：珠玉、翡翠","古代「玫瑰」指美玉，和現在的花不同","所以「玫瑰」＝美玉"],"tests":"古今異義：玫瑰","avoid":"現代意思怪怪的，就想古代意思"},{"q":"「鄭人買其櫝而還其珠」的「而」是什麼意思？","opts":["因為","卻","而且","如果"],"ans":"B","steps":["買珍珠本來該留下珍珠","鄭人買了匣子，卻把珍珠還回去，和常理相反","前後相反 →「而」＝卻"],"tests":"虛詞「而」轉折","avoid":"前後相反時，「而」讀成「卻」"},{"q":"「未可謂善鬻珠也」的「善」是什麼意思？","opts":["擅長、很會","善良","喜歡","好的東西"],"ans":"A","steps":["代回「不能說他擅長賣珍珠」→ 通","「不能說他善良賣珍珠」讀不通","所以「善」＝擅長"],"tests":"一字多義：善","avoid":"「善」放在動作前，常是很會"},{"q":"作者對這個楚國人的評語，最接近哪一個？","opts":["他是賣珍珠的高手","鄭國人不懂得欣賞匣子","包裝做得太花俏，反而讓人只看見匣子","珍珠根本不值錢"],"ans":"C","steps":["證據：「此可謂善賣櫝矣，未可謂善鬻珠也」","代回：他很會賣匣子，不算很會賣珍珠","原因是匣子裝飾太多，搶走珍珠的風采"],"tests":"選項代回找評語","avoid":"每個選項都回原句比對"}]},{"label":"第二篇","title":"畫鬼最易","text":["客有為齊王畫者，齊王問曰：「畫孰最難者？」曰：「犬馬最難。」「孰易者？」曰：「鬼魅最易。夫犬馬，人所知也，旦暮罄於前，不可類之，故難。鬼魅，無形者，不罄於前，故易之也。」"],"cite":"《韓非子．外儲說左上》","notes":"客：門客　孰：什麼　鬼魅：鬼怪　夫：發語詞　旦暮：早晚　罄於前：出現在眼前　無形：沒有形體","trans":"有個替齊王畫畫的門客，齊王問他：「畫什麼最難？」他說：「狗和馬最難。」「畫什麼最容易？」他說：「鬼怪最容易。狗和馬是大家都知道的，早晚都出現在眼前，不容易畫得像，所以難。鬼怪沒有形體，不會出現在眼前，所以容易畫。」","qs":[{"q":"「客有為齊王畫者」的「為」是什麼意思？","opts":["成為","因為","替、幫","是"],"ans":"C","steps":["代回「有個替齊王畫畫的門客」→ 通","「成為齊王畫」「因為齊王畫」都讀不通","所以「為」＝替"],"tests":"一字多義：為","avoid":"「為＋人＋動作」，常是替某人做"},{"q":"「不可類之」的「類」是什麼意思？","opts":["像、畫得像","種類","分類","人類"],"ans":"A","steps":["前面：狗和馬大家天天看到","代回「不容易畫得像」→ 通","現代「類」多是種類，這裡是「像」"],"tests":"古今異義：類","avoid":"名詞意思不通，就試試動詞"},{"q":"「故難」「故易之也」的「故」是什麼意思？","opts":["舊的","故意","朋友","所以"],"ans":"D","steps":["前面說原因：大家都看過／沒人看過","後面說結果：難／容易","原因接結果 →「故」＝所以"],"tests":"一字多義：故","avoid":"「故」前是原因，後是結果"},{"q":"畫家認為鬼怪最容易畫，原因是什麼？","opts":["大家都怕鬼，不敢細看","鬼怪沒有形體、沒人見過，畫成什麼樣都無法比對","鬼怪的顏色比較少","齊王比較喜歡鬼怪畫"],"ans":"B","steps":["證據：「鬼魅，無形者，不罄於前」","代回：沒有形體、不出現在眼前","沒人見過，就沒人能說畫得不像"],"tests":"選項代回找原因","avoid":"原因要從「故」前面找"}]},{"label":"第三篇","title":"愚公移山","text":["太形、王屋二山，方七百里，高萬仞，本在冀州之南，河陽之北。北山愚公者，年且九十，面山而居。懲山北之塞，出入之迂也，聚室而謀曰：「吾與汝畢力平險，指通豫南，達於漢陰，可乎？」雜然相許。"],"cite":"《列子．湯問》（節選開頭）","notes":"太形、王屋：兩座山名，太形就是太行山　仞：古代長度單位　冀州：古地名　河陽：黃河北岸　懲：苦於　塞：阻塞　迂：繞遠路　畢力：用盡全力　豫南：豫州南部　漢陰：漢水南岸　雜然：紛紛　許：贊同","trans":"太行、王屋兩座山，方圓七百里，高一萬仞，本來在冀州的南邊、黃河北岸的北邊。北山有個叫愚公的人，年紀將近九十歲，面對著山居住。他苦於山北面的阻塞，進出都要繞遠路，就召集全家人來商量說：「我和你們用盡全力剷平險峻的大山，讓道路直通豫州南部，到達漢水南岸，好嗎？」大家紛紛表示贊同。","qs":[{"q":"「年且九十」的「且」是什麼意思？","opts":["而且","將近","暫且","並且"],"ans":"B","steps":["「且」放在數字前面","代回「年紀將近九十歲」→ 通","「而且九十」「暫且九十」都讀不通"],"tests":"一字多義：且","avoid":"「且」在數字前，常是將近"},{"q":"「面山而居」的「面」是什麼意思？","opts":["臉孔","表面","見面","面對、朝著"],"ans":"D","steps":["代回「面對著山居住」→ 通","「臉孔山而居」讀不通","這裡「面」當動作用"],"tests":"詞性：名詞當動詞","avoid":"後面接東西時，試試當動作讀"},{"q":"「聚室而謀」的「室」是什麼意思？","opts":["房間","教室","全家人","屋頂"],"ans":"C","steps":["後面愚公說「吾與汝」，是在對人說話","代回「召集全家人來商量」→ 通","古代「室」常指家人，和現在的房間不同"],"tests":"古今異義：室","avoid":"能「商量」的一定是人"},{"q":"「方七百里」的「方」，最適合代入哪個意思？","opts":["方圓、面積","方法","正在","地方"],"ans":"A","steps":["後面接「七百里」，是在講大小","代回「方圓七百里」→ 通","「方法七百里」「正在七百里」都不通"],"tests":"選項代回：方","avoid":"後面接數量，就是在講大小"}]},{"label":"第四篇","title":"精衛填海","text":["又北二百里，曰發鳩之山，其上多柘木。有鳥焉，其狀如烏，文首，白喙，赤足，名曰精衛，其鳴自詨。是炎帝之少女，名曰女娃。女娃游於東海，溺而不返，故為精衛，常銜西山之木石，以堙於東海。"],"cite":"《山海經．北山經》（節選）","notes":"柘木：一種樹　狀：樣子　烏：烏鴉　喙：鳥嘴　其鳴自詨：叫聲像在喊自己的名字　炎帝：傳說中的古代帝王　溺：淹沒　銜：用嘴叼著","trans":"再往北二百里，有座山叫發鳩山，山上有很多柘樹。山裡有一種鳥，樣子像烏鴉，頭上有花紋，白色的嘴，紅色的腳，名叫精衛，牠的叫聲像在呼喊自己的名字。牠是炎帝的小女兒，名叫女娃。女娃到東海游玩，淹沒在海裡沒有回來，所以變成了精衛鳥，常常叼著西山的樹枝和石頭，用來填塞東海。","qs":[{"q":"「文首」的「文」是什麼意思？","opts":["花紋","文章","文字","文雅"],"ans":"A","steps":["前後在描寫鳥的樣子：白喙、赤足","代回「頭上有花紋」→ 通","「文」古代常同「紋」"],"tests":"一字多義：文","avoid":"描寫外表時，「文」多是花紋"},{"q":"「是炎帝之少女」的「少女」是什麼意思？","opts":["年輕的女孩","宮女","小女兒","少數的女兒"],"ans":"C","steps":["前面「炎帝之」，說的是和炎帝的關係","代回「炎帝的小女兒」→ 通","古代「少女」指排行最小的女兒，和現在不同"],"tests":"古今異義：少女","avoid":"看到「某人之」，想到親屬關係"},{"q":"「故為精衛」的「故」是什麼意思？","opts":["舊的","所以","故意","朋友"],"ans":"B","steps":["前面：女娃淹沒在東海沒回來（原因）","後面：變成精衛（結果）","原因接結果 →「故」＝所以"],"tests":"一字多義：故","avoid":"「故」前是原因，後是結果"},{"q":"「常銜西山之木石，以堙於東海」，代回後哪個說法正確？","opts":["精衛住在西山，偶爾去東海","精衛想把西山搬走","精衛叼石頭來蓋鳥巢","精衛常叼西山的樹枝石頭，用來填東海"],"ans":"D","steps":["篇名是「精衛填海」，可知「堙」＝填；「以」＝用來","代回：叼西山的木石，用來填塞東海","其他選項文中都沒有證據"],"tests":"選項代回句意","avoid":"每個字的意思都要對得上"}]},{"label":"第五篇","title":"夸父逐日","text":["夸父與日逐走，入日。渴，欲得飲，飲於河、渭；河、渭不足，北飲大澤。未至，道渴而死。棄其杖，化為鄧林。"],"cite":"《山海經．海外北經》","notes":"夸父：神話中的巨人　入日：追到太陽落下的地方　渭：渭水　大澤：大湖　杖：手杖　鄧林：桃林","trans":"夸父和太陽賽跑，追到了太陽落下的地方。他口渴，想要喝水，就到黃河、渭水喝水；黃河、渭水的水不夠，又往北去喝大湖的水。還沒走到，就在半路上渴死了。他丟下的手杖，變成了一片桃林。","qs":[{"q":"「夸父與日逐走」的「走」是什麼意思？","opts":["走路","離開","走漏","跑"],"ans":"D","steps":["和太陽「逐」＝追趕、比賽","追太陽一定是用跑的","古代「走」＝跑（兔走觸株）"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"「飲於河、渭」的「河」指的是什麼？","opts":["所有的河流","黃河","小溪","護城河"],"ans":"B","steps":["「河」和「渭」並列，渭是一條特定的河","古代單說「河」，專指黃河","所以「河」＝黃河"],"tests":"古今異義：河","avoid":"古文單一個「河」，多半是黃河"},{"q":"「道渴而死」的「道」是什麼意思？","opts":["在路上、半路","道理","說","方法"],"ans":"A","steps":["前一句「未至」：還沒走到大澤","代回「在半路上渴死」→ 通","「道理渴死」「說渴死」都讀不通"],"tests":"一字多義：道","avoid":"前面說還沒到，「道」就是路上"},{"q":"夸父為什麼要「北飲大澤」？","opts":["大澤的水比較甜","他想到北方追太陽","黃河、渭水的水不夠他喝","有人勸他去"],"ans":"C","steps":["找前一句：「河、渭不足」","不夠喝，才往北找大湖","其他選項文中都沒有"],"tests":"找原因的證據","avoid":"原因常常就在前一句"}]}]},{"no":"第 3 組","title":"柴犬好養嗎","skill":"白話找證據＋段落重點＋絕對字","steps":["❶ 每段讀完，用一句話寫下重點","❷ 選項的每個字都回文章找證據","❸ 圈出絕對字：都、一定、永遠、從來、完全、所有","❹ 文章沒說那麼滿，有絕對字的選項就排除"],"demo":{"q":"下面這段的重點是什麼？","a":["先看材料：「柴犬還有一個讓主人忙碌的地方：換毛……主人幾乎要天天梳毛、打掃。再加上柴犬精力旺盛，每天都需要帶出門散步。」","第一句先點出「讓主人忙碌」，後面用「再加上」補充散步","答：換毛和散步，讓養柴犬的人很忙"]},"parts":[{"label":"第一篇","title":"柴犬好養嗎","text":["柴犬是來自日本的犬種，有一身蓬鬆的毛、捲在背上的尾巴，還有一張看起來像在微笑的臉，因此在網路上非常受歡迎。很多人看到柴犬的照片，就想馬上養一隻。","不過，柴犬可愛的外表下，藏著很有主見的個性。牠們很聰明，卻不一定願意乖乖聽話；如果主人一直大聲罵牠，牠可能會變得更不配合。比較好的方法是用零食和稱讚當獎勵，每次只練一個小動作，有耐心地慢慢教。","柴犬還有一個讓主人忙碌的地方：換毛。柴犬的毛有兩層，每年會大量換毛一到兩次，換毛的那段時間，家裡到處都是毛，主人幾乎要天天梳毛、打掃。再加上柴犬精力旺盛，每天都需要帶出門散步。所以，想養柴犬之前，先問問自己：有沒有時間陪牠、教牠、幫牠打掃？"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段的重點是什麼？","opts":["柴犬很聰明","罵柴犬完全沒有用","柴犬很有主見，要用獎勵耐心地教","柴犬很愛吃零食"],"ans":"C","steps":["第二段第一句：柴犬「很有主見的個性」","後面接著說方法：用零食和稱讚，慢慢教","「很聰明」只是其中一個小地方"],"tests":"段落重點","avoid":"重點要包含整段，不是只有一句"},{"q":"根據文章，下列哪個說法有證據？","opts":["柴犬每年會大量換毛一到兩次","柴犬一年到頭天天大量掉毛","柴犬不需要每天散步","所有柴犬都不聽話"],"ans":"A","steps":["第三段：「每年會大量換毛一到兩次」","文中說每天都要散步，和「不需要」相反","「所有」「天天大量」都是文章沒說的"],"tests":"白話找證據","avoid":"選項要能在文中找到同一句"},{"q":"下列哪個說法最符合文章？","opts":["只要給零食，柴犬一定學會所有動作","柴犬從來不聽主人的話","每個人看到柴犬照片都想養","主人一直大聲罵，柴犬可能變得更不配合"],"ans":"D","steps":["第二段：「一直大聲罵牠，牠可能會變得更不配合」","其他選項有「一定」「從來」「每個人」等絕對字","文中只說「不一定」「很多人」，沒說那麼滿"],"tests":"排除絕對字","avoid":"看到「一定、從來、每個」先畫圈"},{"q":"把三段的重點連起來，全文想說什麼？","opts":["柴犬是全世界最好養的狗","柴犬很可愛，但要花時間教、陪、打掃，養前要想清楚","柴犬不適合任何家庭","柴犬在網路上很受歡迎"],"ans":"B","steps":["第一段：外表可愛；第二段：要耐心教；第三段：換毛、散步很花時間","最後「所以」：養之前先問自己有沒有時間","「最好養」「不適合任何家庭」都是絕對字"],"tests":"全文主旨","avoid":"每段一句話，連起來就是主旨"}]},{"label":"第二篇","title":"章魚的三顆心臟","text":["章魚是海洋裡的聰明動物，牠的身體構造也很特別：一隻章魚有三顆心臟。兩顆比較小的心臟，負責把血液送到鰓，讓血液吸收氧氣；另一顆比較大的心臟，再把帶著氧氣的血液送到全身。","章魚的血液也和人不一樣。人的血液是紅色的，章魚的血液卻是藍色的，因為牠用來運送氧氣的物質裡含有銅，而人的血液裡運送氧氣的物質含有鐵。","章魚還很會躲藏。牠可以在很短的時間內改變皮膚的顏色，讓自己和身邊的岩石、海草看起來差不多，躲過敵人的眼睛。科學家認為，章魚是非常聰明的無脊椎動物。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的重點是什麼？","opts":["章魚住在海洋裡","章魚有三顆心臟，而且各有分工","章魚很聰明","鰓會吸收氧氣"],"ans":"B","steps":["第一段冒號後面：「一隻章魚有三顆心臟」","接著說兩小一大，各自負責送血","其他選項只是段落裡的小細節"],"tests":"段落重點","avoid":"冒號後面常常就是重點"},{"q":"章魚的血液為什麼是藍色的？","opts":["牠住在藍色的海裡","牠吃藍色的食物","牠有三顆心臟","運送氧氣的物質含有銅"],"ans":"D","steps":["找「因為」：「因為牠用來運送氧氣的物質裡含有銅」","三顆心臟是第一段，和血的顏色無關","海和食物文中都沒提到"],"tests":"找原因的證據","avoid":"看到「為什麼」就找「因為」"},{"q":"下列哪個說法最符合文章？","opts":["章魚的三顆心臟一樣大","所有動物的血都是紅色的","章魚能改變皮膚顏色來躲敵人","章魚永遠不會被敵人發現"],"ans":"C","steps":["第三段：「改變皮膚的顏色……躲過敵人的眼睛」","第一段說兩小一大，不是一樣大","「所有」「永遠」是絕對字，文章沒說"],"tests":"排除絕對字","avoid":"絕對字的選項，要找到一樣滿的證據"},{"q":"第三段主要在說什麼？","opts":["章魚很會躲藏，能快速改變膚色","章魚很會游泳","章魚的血是藍色的","岩石和海草的顏色"],"ans":"A","steps":["第三段第一句：「章魚還很會躲藏」","後面說怎麼躲：改變皮膚顏色","藍色血是第二段的內容"],"tests":"段落重點","avoid":"不要把別段的內容當成這段重點"}]},{"label":"第三篇","title":"蜜蜂的舞蹈","text":["蜜蜂找到花蜜之後，回到蜂巢，主要是用「跳舞」來告訴同伴花在哪裡。","如果花離蜂巢很近，蜜蜂會跳「圓圈舞」，在原地繞著小圈子轉，意思是：花就在附近，出去找找看。如果花離得比較遠，牠會跳「搖擺舞」，一邊走直線一邊搖動身體，再繞回來重複。直線的方向，可以告訴同伴花在哪個方向；搖擺的時間越長，通常表示花越遠。","蜜蜂的舞蹈，是奧地利科學家弗里希研究發現的，他後來也因為研究動物行為，得到了諾貝爾獎。小小的蜜蜂，原來有一套自己的「語言」。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段主要在說什麼？","opts":["蜜蜂用不同的舞，告訴同伴花的遠近和方向","蜜蜂喜歡轉圈圈","花通常離蜂巢很近","搖擺舞比圓圈舞好看"],"ans":"A","steps":["第二段用「如果近……如果遠……」介紹兩種舞","兩種舞都在傳達花的位置","好不好看、喜不喜歡，文中都沒說"],"tests":"段落重點","avoid":"有「如果……如果……」就把兩邊合起來"},{"q":"蜜蜂跳「圓圈舞」，是在告訴同伴什麼？","opts":["花在很遠的地方","附近有敵人","花就在附近","快要下雨了"],"ans":"C","steps":["第二段：「花離蜂巢很近，蜜蜂會跳圓圈舞」","「意思是：花就在附近」","敵人、下雨文中沒提到"],"tests":"白話找證據","avoid":"找「意思是」後面那句"},{"q":"根據文章，下列哪個說法有證據？","opts":["搖擺舞一定比圓圈舞難學","搖擺的時間越長，通常表示花越遠","所有昆蟲都會跳舞","弗里希每年都得諾貝爾獎"],"ans":"B","steps":["第二段最後：「搖擺的時間越長，通常表示花越遠」","「一定」「所有」「每年」都是絕對字","文章沒有這些證據"],"tests":"排除絕對字","avoid":"原文有「通常」，選項卻說「一定」就錯"},{"q":"下列哪個說法「超過」文章的證據？","opts":["蜜蜂主要用跳舞傳遞花蜜的消息","弗里希研究動物行為，得過諾貝爾獎","直線的方向可以告訴同伴花在哪個方向","蜜蜂每次都能百分之百找到花"],"ans":"D","steps":["前三個選項在第一、二、三段都找得到","「每次」「百分之百」是絕對字","文中沒說蜜蜂一定找得到"],"tests":"找出絕對字","avoid":"問「超過證據」，就找最滿的那句"}]},{"label":"第四篇","title":"月亮的圓缺","text":["抬頭看月亮，有時是圓圓的滿月，有時只剩細細的一彎。其實，月亮本身並不會發光，我們看到的月光，是它反射的太陽光。","月亮繞著地球轉，大約一個月繞一圈。月亮總是有一半被太陽照亮，但它走到不同位置時，我們從地球上看到被照亮的部分有多有少，於是看起來就有圓有缺。","所以，月亮並不是真的變大變小，只是我們看它的角度改變了。農曆每個月十五前後，常常可以看到又圓又亮的滿月。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的重點是什麼？","opts":["月亮有時很細","太陽比月亮大","晚上要常常看天空","月亮不會自己發光，月光是反射的太陽光"],"ans":"D","steps":["第一段的「其實」後面：月亮本身不會發光","接著說月光是反射的太陽光","太陽比月亮大，文中沒說"],"tests":"段落重點","avoid":"「其實」「但是」後面常是重點"},{"q":"月亮看起來有圓有缺，原因是什麼？","opts":["月亮真的會變大變小","我們從地球看到被照亮的部分有多有少","雲把月亮遮住了","太陽有時候不照月亮"],"ans":"B","steps":["第二段：「看到被照亮的部分有多有少，於是看起來就有圓有缺」","第三段：月亮並不是真的變大變小","雲文中沒提到"],"tests":"找原因的證據","avoid":"「於是」前面就是原因"},{"q":"根據文章，下列哪個說法正確？","opts":["農曆十五前後常常看到滿月","月亮每天都是滿月","月亮一年才繞地球一圈","月亮有時會自己發光"],"ans":"A","steps":["第三段：「農曆每個月十五前後，常常可以看到……滿月」","第二段：大約一個月繞一圈，不是一年","第一段：月亮本身不會發光"],"tests":"白話找證據","avoid":"數字和時間要回文章對一對"},{"q":"下列哪個說法最符合文章？","opts":["月亮在每個位置看起來都一樣","只有滿月時，太陽才照到月亮","月亮總是有一半被太陽照亮","月光完全是月亮自己發出的"],"ans":"C","steps":["第二段：「月亮總是有一半被太陽照亮」","「每個位置都一樣」和「有圓有缺」相反","「只有」「完全」是絕對字，也和第一、二段相反"],"tests":"排除絕對字","avoid":"絕對字選項，常和文章相反"}]},{"label":"第五篇","title":"獨一無二的指紋","text":["每個人的手指上，都有一圈一圈的細紋，叫做指紋。指紋在寶寶還在媽媽肚子裡時就已經形成，長大以後，手指雖然變大了，紋路的樣子卻大致不會改變。","更神奇的是，世界上幾乎找不到兩個指紋一模一樣的人，就連長得非常像的同卵雙胞胎，指紋也不相同。","因為指紋很難相同，又不太會改變，所以常被用來辨認一個人。警察會在現場採集指紋，找出破案的線索；很多手機也能用指紋解鎖，只有事先設定好的手指才能打開。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段主要在說什麼？","opts":["雙胞胎長得很像","指紋是一圈一圈的","指紋幾乎人人不同，連同卵雙胞胎也不一樣","手指長大會變大"],"ans":"C","steps":["第二段：「幾乎找不到兩個指紋一模一樣的人」","「就連……同卵雙胞胎，指紋也不相同」是加強","雙胞胎長得像只是用來比較"],"tests":"段落重點","avoid":"「就連」後面是加強重點的例子"},{"q":"指紋為什麼能用來辨認一個人？","opts":["指紋很難相同，又不太會改變","指紋很容易拍照","每支手機都需要指紋","指紋長大後會改變"],"ans":"A","steps":["第三段：「因為指紋很難相同，又不太會改變，所以常被用來辨認一個人」","原因就在「因為」和「所以」中間","「長大後會改變」和第一段相反"],"tests":"找原因的證據","avoid":"「因為……所以……」一起找"},{"q":"下列哪個說法最符合文章？","opts":["指紋是出生後才慢慢長出來的","長大後指紋的樣子會完全改變","全世界每個人的指紋都已經比對過","指紋在出生前就已經形成"],"ans":"D","steps":["第一段：「在媽媽肚子裡時就已經形成」","第一段：紋路「大致不會改變」，不是完全改變","文中沒說全世界都比對過"],"tests":"白話找證據","avoid":"「完全」「每個人」要特別小心"},{"q":"第三段主要在說什麼？","opts":["手機很方便","指紋的用途：用來辨認一個人","警察怎麼破案","指紋怎麼形成"],"ans":"B","steps":["第三段第一句：指紋「常被用來辨認一個人」","警察、手機都是用途的例子","指紋怎麼形成是第一段"],"tests":"段落重點","avoid":"例子是支持重點的，不是重點本身"}]}]},{"no":"第 4 組","title":"學而不思則罔＋練投籃","skill":"互文對讀：兩篇比一比","steps":["❶ 甲、乙各用一句話說出在講什麼","❷ 畫比較表：甲說什麼｜乙說什麼","❸ 先找相同，再找不同","❹ 問「兩篇都」看相同，問「只有甲」看不同"],"demo":{"q":"用一句話說出乙文在講什麼。","a":["先看材料：乙「只一直投，不去想為什麼沒進……只坐在場邊看影片，卻從來不下場練，也永遠投不準。最好的方法是：投完一輪，想一想哪裡要調整，再上場投。」","找結論：「最好的方法是：……」","答：練習和思考要輪流做"]},"parts":[{"label":"第一篇","title":"學而不思則罔","text":["甲　子曰：「學而不思則罔，思而不學則殆。」","乙　練投籃時，如果只是一直投，不去想為什麼沒進，投一千球也只是重複錯誤的動作。可是如果只坐在場邊看影片、研究姿勢，卻從來不下場練，也永遠投不準。最好的方法是：投完一輪，想一想哪裡要調整，再上場投。"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"則：就","trans":"甲：孔子說：「只學習卻不思考，就會迷惘而沒有收穫；只思考卻不學習，就會疑惑而危險。」","qs":[{"q":"「學而不思則罔」的「罔」是什麼意思？","opts":["網子","迷惘、沒有收穫","忘記","高興"],"ans":"B","steps":["代回「只學不想，就會迷惘」→ 通","「就會網子」「就會高興」都不通","所以「罔」＝迷惘、沒有收穫"],"tests":"字義：罔","avoid":"把每個意思代回去讀"},{"q":"乙文「只是一直投，不去想為什麼沒進」，對應甲文哪一句？","opts":["思而不學則殆","溫故而知新","不亦說乎","學而不思則罔"],"ans":"D","steps":["一直投＝一直學（練）","不去想＝不思","所以對應「學而不思」"],"tests":"甲乙句子對應","avoid":"把乙的句子翻成「學」「思」"},{"q":"乙文「只坐在場邊看影片、研究姿勢，卻從來不下場練」，像甲文說的哪種情況？","opts":["學而不思","學而時習之","思而不學","溫故知新"],"ans":"C","steps":["研究姿勢＝思考","從來不下場練＝不學（不練）","所以是「思而不學」"],"tests":"甲乙句子對應","avoid":"先分清楚哪個是想、哪個是練"},{"q":"甲、乙兩篇共同的看法是什麼？","opts":["學（練）和思考要互相配合，缺一不可","投球越多越好","思考比練習重要","看影片完全沒有用"],"ans":"A","steps":["甲：只學不想不行，只想不學也不行","乙：投完想一想，再上場投","兩篇都講要配合；「完全沒用」乙沒說"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"}]},{"label":"第二篇","title":"溫故而知新","text":["甲　子曰：「溫故而知新，可以為師矣。」","乙　每場比賽後，教練都會帶我們重看上一場的錄影。有一次重看時，我突然發現：對手每次換防都慢半拍，那正是我們切入的好機會。同一段影片看過好幾次，每一次卻都能看出新的東西。後來學弟問我怎麼找到對手的弱點，我就把這個方法教給他。"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"溫：複習","trans":"甲：孔子說：「複習學過的東西，能從中得到新的體會，就可以當老師了。」","qs":[{"q":"「溫故而知新」的「故」是什麼意思？","opts":["舊的、學過的","所以","故意","事故"],"ans":"A","steps":["「故」和後面的「新」相對","代回「複習舊的，知道新的」→ 通","所以「故」＝舊的、學過的"],"tests":"一字多義：故","avoid":"找和它相對的字來幫忙"},{"q":"乙文中哪件事最符合「溫故而知新」？","opts":["每場比賽都要贏","學弟來問問題","重看舊錄影，發現對手換防慢半拍","教練很嚴格"],"ans":"C","steps":["溫故＝重看上一場的錄影","知新＝發現對手換防慢半拍","兩個部分都對得上"],"tests":"甲乙句子對應","avoid":"甲的每個部分都要在乙找到"},{"q":"乙文「我就把這個方法教給他」，對應甲文哪一句？","opts":["溫故","可以為師矣","知新","學而不思"],"ans":"B","steps":["教學弟＝當別人的老師","甲：「可以為師矣」","所以對應「可以為師」"],"tests":"甲乙句子對應","avoid":"找乙文的動作，對甲文的關鍵詞"},{"q":"關於甲、乙兩篇，下列敘述何者正確？","opts":["甲、乙都說要多看比賽錄影","乙認為舊影片看一次就夠了","甲說只要複習就能當老師，不用有新收穫","甲講道理，乙用看比賽錄影的經驗說明同一個道理"],"ans":"D","steps":["甲沒有提到錄影，只講道理","乙說同一段影片看好幾次都有新發現","甲是「溫故而知新」，兩者都要"],"tests":"找兩篇異同","avoid":"「都」要兩篇都有才算"}]},{"label":"第三篇","title":"默而識之","text":["甲　子曰：「默而識之，學而不厭，誨人不倦，何有於我哉？」","乙　我們隊上的阿哲學長是控球後衛。他練球時話不多，教練講過的戰術，他都默默記在筆記本上，練了三年從不喊累。學弟們有不懂的跑位，他一遍又一遍地講，講到大家都會為止，從來沒有不耐煩。"],"cite":"甲：《論語．述而》　乙：練習用自編短文","notes":"默：不出聲　厭：滿足　何有於我哉：這些我做到了哪一樣呢","trans":"甲：孔子說：「默默地把學到的記在心裡，努力學習而不滿足，教導別人而不疲倦，這些我做到了哪一樣呢？」","qs":[{"q":"「默而識之」的「識」是什麼意思？","opts":["認識","知識","見識","記住"],"ans":"D","steps":["前面「默」＝不出聲","代回「默默地記住它」→ 通","「默默地知識它」讀不通"],"tests":"一字多義：識","avoid":"名詞讀不通，就當動作讀"},{"q":"「誨人不倦」的「誨」是什麼意思？","opts":["後悔","教導","責罵","幫助"],"ans":"B","steps":["成語「誨人不倦」：教導別人不疲倦","代回「教導別人不覺得累」→ 通","「後悔別人」讀不通"],"tests":"字義：誨","avoid":"用學過的成語反推字義"},{"q":"乙文「學弟們有不懂的跑位，他一遍又一遍地講」，對應甲文哪一句？","opts":["誨人不倦","默而識之","學而不厭","何有於我哉"],"ans":"A","steps":["一遍又一遍地講＝教導別人","從來沒有不耐煩＝不倦","所以對應「誨人不倦」"],"tests":"甲乙句子對應","avoid":"找「教別人」的那一句"},{"q":"乙文「教練講過的戰術，他都默默記在筆記本上」，對應甲文哪一句？","opts":["誨人不倦","學而時習之","默而識之","有朋自遠方來"],"ans":"C","steps":["默默＝默","記在筆記本上＝識（記住）","所以對應「默而識之」"],"tests":"甲乙句子對應","avoid":"抓住相同的關鍵字「默」"}]},{"label":"第四篇","title":"逝者如斯夫","text":["甲　子在川上曰：「逝者如斯夫！不舍晝夜。」","乙　暑假剛開始時，我覺得兩個月好長，每天睡到中午、打電動。沒想到一眨眼就開學了，計畫要練的運球、要讀的三本書，一樣都沒完成。看著月曆，我才發現時間就像投出去的球，出手了就收不回來。"],"cite":"甲：《論語．子罕》　乙：練習用自編短文","notes":"川：河流　逝者：消逝的時光　夫：句尾語氣詞，表示感嘆","trans":"甲：孔子站在河邊說：「消逝的時光就像這河水一樣啊！日夜不停地流去。」","qs":[{"q":"「逝者如斯夫」的「斯」是什麼意思？","opts":["斯文","他","這、這河水","死亡"],"ans":"C","steps":["孔子站在河邊（川上）說話","代回「消逝的時光就像這河水」→ 通","所以「斯」＝這"],"tests":"字義：斯","avoid":"看說話的地方，找「這」指什麼"},{"q":"「不舍晝夜」的「舍」是什麼意思？","opts":["停止","房舍","宿舍","捨得"],"ans":"A","steps":["代回「日夜不停止」→ 通","「不房舍晝夜」讀不通","第 1 週「太丘舍去」的舍是丟下，這裡是停止"],"tests":"一字多義：舍","avoid":"同一個字，換句子就要重新代回"},{"q":"甲、乙兩篇共同的看法是什麼？","opts":["暑假太長了","河水流得很急","打電動不好","時間不停流逝，一去不回，要珍惜"],"ans":"D","steps":["甲：時光像河水，日夜不停流走","乙：時間像投出去的球，收不回來","兩篇都在說時間一去不回"],"tests":"找兩篇相同點","avoid":"先各寫一句話，再比相同"},{"q":"甲、乙兩篇分別用什麼來比喻時間？","opts":["乙：月曆；甲：河岸","乙：投出去的球；甲：流動的河水","乙：運球；甲：晝夜","乙：暑假；甲：川上"],"ans":"B","steps":["甲：「逝者如斯」，斯＝這河水","乙：「時間就像投出去的球」","「就像」後面就是比喻"],"tests":"找兩篇的比喻","avoid":"比喻找「如」「像」後面"}]},{"label":"第五篇","title":"君子坦蕩蕩","text":["甲　子曰：「君子坦蕩蕩，小人長戚戚。」","乙　上週比賽，阿凱不小心踩線，裁判判他出界。他大方地舉手承認，下一球繼續拚。另一隊有個球員偷偷拉人衣服，雖然沒被裁判看見，整場卻一直東張西望，怕被抓到，表現也越打越差。"],"cite":"甲：《論語．述而》　乙：練習用自編短文","notes":"坦蕩蕩：心胸寬廣、坦然　戚戚：憂愁不安","trans":"甲：孔子說：「品德好的人心胸寬廣、坦然自在；品德不好的人常常憂愁不安。」","qs":[{"q":"「小人長戚戚」的「小人」是什麼意思？","opts":["小孩子","品德不好的人","身材矮小的人","年紀小的弟弟"],"ans":"B","steps":["「小人」和前面的「君子」相對","君子是品德好的人","所以小人＝品德不好的人，不是小孩"],"tests":"古今異義：小人","avoid":"找相對的詞來推意思"},{"q":"「小人長戚戚」的「長」是什麼意思？","opts":["長大","很長","首領","常常、總是"],"ans":"D","steps":["代回「小人常常憂愁不安」→ 通","「小人長大憂愁」意思不對","所以「長」＝常常"],"tests":"一字多義：長","avoid":"多種意思時，一個一個代回"},{"q":"乙文中，哪一個人最像甲文說的「小人」？","opts":["阿凱","裁判","偷拉衣服、一直怕被抓到的球員","教練"],"ans":"C","steps":["甲：小人常常憂愁不安（戚戚）","乙：偷拉衣服的球員「一直東張西望，怕被抓到」","阿凱大方承認，比較像君子"],"tests":"甲乙人物對應","avoid":"看誰的心情是「不安」"},{"q":"甲、乙兩篇共同想說明什麼？","opts":["光明正大就坦然，做虧心事就常常不安","比賽一定要贏","裁判常常看不見犯規","承認錯誤就會輸球"],"ans":"A","steps":["甲：君子坦蕩、小人戚戚","乙：阿凱坦然繼續拚，犯規的人一直怕被抓","兩篇都在比較坦然和不安"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"}]}]},{"no":"第 5 組","title":"一週每日課外閱讀時間","skill":"圖表五步驟＋圖文對讀","chart":true,"steps":["❶ 標題：這張圖在講什麼","❷ 單位：人、分、分鐘、本、下","❸ 趨勢：哪裡多、哪裡少","❹ 最大值、最小值，需要時算總和","❺ 文字說法逐句回圖找數字，找不到就是「沒有證據」"],"demo":{"q":"週一讀 15 分鐘，圖上要畫幾格■？","a":["先看材料：圖的說明「每格■代表 5 分鐘」，週一 15 分鐘","15÷5＝3","答：3 格"]},"parts":[{"label":"第一篇","title":"某同學一週每日課外閱讀時間","text":["小凱在日記裡寫：「這週我每天都有讀課外書，週四讀最久，因為那天沒有籃球練習。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","閱讀時間（分鐘）"],"per":5,"unit":"分鐘","data":[["週一",15],["週二",20],["週三",10],["週四",25],["週五",20]],"qs":[{"q":"哪一天的閱讀時間最多？","opts":["週四","週二","週五","週一"],"ans":"A","steps":["五天：15、20、10、25、20","最大是 25","對應週四"],"tests":"找最大值","avoid":"先把每天的數字寫出來再比"},{"q":"五天總共讀了多少分鐘？","opts":["80 分鐘","85 分鐘","90 分鐘","100 分鐘"],"ans":"C","steps":["15＋20＋10＋25＋20","＝90","檢查：35＋35＋20＝90"],"tests":"圖表加總","avoid":"加完再用另一種順序檢查"},{"q":"根據圖表，哪個說法有證據？","opts":["小凱每天都讀超過 15 分鐘","週末讀得最久","週二和週五讀的時間一樣","讀越久成績越好"],"ans":"C","steps":["週二 20、週五 20，一樣 → 有證據","週三只有 10 分鐘，不是每天超過 15","圖裡沒有週末和成績的資料"],"tests":"圖表推論範圍","avoid":"圖上沒有的資料，再合理也不能選"},{"q":"日記說「週四讀最久，因為那天沒有籃球練習」，圖表能證明什麼？","opts":["兩件事都能從圖表證明","週四最久可以證明；「沒有練球」這個原因看不出來","兩件事都不能證明","只有原因能證明"],"ans":"B","steps":["圖表：週四 25 分鐘最多 → 能證明","圖表只有時間，沒有練球的資料","所以原因無法從圖表證明"],"tests":"圖文對讀","avoid":"文字裡的「因為」要另外找證據"}]},{"label":"第二篇","title":"校隊五場比賽全隊得分","text":["校刊報導：「校隊這學期越打越好，五場比賽的得分一場比一場高。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["場次","全隊得分（分）"],"per":5,"unit":"分","data":[["第一場",40],["第二場",35],["第三場",50],["第四場",45],["第五場",55]],"qs":[{"q":"得分最少的是哪一場？","opts":["第一場","第三場","第四場","第二場"],"ans":"D","steps":["五場：40、35、50、45、55","最小是 35","對應第二場"],"tests":"找最小值","avoid":"先把每場的數字寫出來再比"},{"q":"第五場比第一場多得幾分？","opts":["5 分","10 分","15 分","20 分"],"ans":"C","steps":["第五場 55 分，第一場 40 分","55－40＝15","檢查：40＋15＝55"],"tests":"圖表相減","avoid":"相減後用加法檢查一次"},{"q":"報導說「一場比一場高」，和圖表相符嗎？","opts":["相符，每一場都比前一場高","不相符，第五場是最低的","圖表沒有得分資料，無法判斷","不相符，第二場、第四場都比前一場低"],"ans":"D","steps":["第二場 35 比第一場 40 低","第四場 45 比第三場 50 低","所以不是一場比一場高；第五場 55 反而最高"],"tests":"圖文對讀","avoid":"「一場比一場」要每一場都檢查"},{"q":"五場比賽平均每場得幾分？","opts":["40 分","45 分","50 分","55 分"],"ans":"B","steps":["總分：40＋35＋50＋45＋55＝225","225÷5＝45","檢查：45×5＝225"],"tests":"圖表平均","avoid":"平均＝總和÷場數"}]},{"label":"第三篇","title":"全班最喜歡的狗狗投票","text":["班長在聯絡簿寫：「全班 28 人都投了票，柴犬的票數超過全班的一半。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["狗狗品種","票數（人）"],"per":1,"unit":"人","data":[["柴犬",9],["黃金獵犬",7],["柯基",5],["貴賓犬",4],["哈士奇",3]],"qs":[{"q":"票數最少的是哪一種狗？","opts":["柯基","哈士奇","貴賓犬","黃金獵犬"],"ans":"B","steps":["五種：9、7、5、4、3","最小是 3","對應哈士奇"],"tests":"找最小值","avoid":"先把每一種的數字寫出來"},{"q":"柴犬比黃金獵犬多幾票？","opts":["1 票","2 票","3 票","4 票"],"ans":"B","steps":["柴犬 9 票，黃金獵犬 7 票","9－7＝2","檢查：7＋2＝9"],"tests":"圖表相減","avoid":"相減後用加法檢查一次"},{"q":"班長說「柴犬的票數超過全班的一半」，對嗎？","opts":["不對：全班一半是 14 票，柴犬只有 9 票","對，因為柴犬票數最多","不對，柴犬票數最少","圖表看不出柴犬的票數"],"ans":"A","steps":["全班：9＋7＋5＋4＋3＝28，一半是 14","柴犬 9 票，比 14 少","「最多」不等於「超過一半」"],"tests":"圖文對讀","avoid":"「超過一半」要先算出一半是多少"},{"q":"根據圖表，哪個說法有證據？","opts":["全班都喜歡柴犬","柴犬是最好養的狗","投柯基和貴賓犬的人加起來，和柴犬一樣多","喜歡哈士奇的人明年會變多"],"ans":"C","steps":["柯基 5＋貴賓犬 4＝9","柴犬也是 9 → 有證據","「全班都」是絕對字；好不好養、明年都不在圖裡"],"tests":"圖表推論範圍","avoid":"每個選項都要回圖算一算"}]},{"label":"第四篇","title":"小安一週每日一分鐘跳繩次數","text":["小安說：「我的跳繩次數每天都在進步。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","一分鐘跳繩（下）"],"per":10,"unit":"下","data":[["週一",60],["週二",80],["週三",80],["週四",100],["週五",120]],"qs":[{"q":"小安哪一天跳得最多？","opts":["週二","週三","週五","週四"],"ans":"C","steps":["五天：60、80、80、100、120","最大是 120","對應週五"],"tests":"找最大值","avoid":"先把每天的數字寫出來"},{"q":"週五比週一多跳幾下？","opts":["40 下","60 下","80 下","120 下"],"ans":"B","steps":["週五 120 下，週一 60 下","120－60＝60","檢查：60＋60＝120"],"tests":"圖表相減","avoid":"相減後用加法檢查一次"},{"q":"小安說「每天都在進步」，圖表支持嗎？","opts":["不完全支持：週三和週二一樣都是 80 下","支持，每天都比前一天多","不支持，次數越來越少","圖表沒有次數，看不出來"],"ans":"A","steps":["週二 80、週三 80，沒有變多","其他天都比前一天多","所以「每天」進步不成立"],"tests":"圖文對讀","avoid":"看到「每天」，要一天一天檢查"},{"q":"這五天的整體趨勢是什麼？","opts":["越來越少","每天都一樣","先多後少","大致越來越多"],"ans":"D","steps":["從 60 開始，最後到 120","中間只有一天持平，沒有變少","整體是越來越多"],"tests":"看趨勢","avoid":"看頭尾，再看中間有沒有下降"}]},{"label":"第五篇","title":"班級圖書角一個月借閱本數","text":["圖書股長的報告：「這個月共借出 50 本書，科普書是借出第二多的種類。借出最少的是歷史書，下個月我們要多買一些歷史書。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["書的種類","借閱數量（本）"],"per":2,"unit":"本","data":[["漫畫",16],["科普",12],["小說",10],["運動",8],["歷史",4]],"qs":[{"q":"這張表的數字單位是什麼？","opts":["人","本","次","元"],"ans":"B","steps":["看表頭：「借閱數量（本）」","單位寫在括號裡","所以是本"],"tests":"看單位","avoid":"單位常藏在表頭的括號裡"},{"q":"漫畫的借閱本數是歷史的幾倍？","opts":["2 倍","4 倍","3 倍","12 倍"],"ans":"B","steps":["漫畫 16 本，歷史 4 本","16÷4＝4","檢查：4×4＝16"],"tests":"圖表倍數","avoid":"倍數用除法，再用乘法檢查"},{"q":"報告中哪一句「無法」從圖表證明？","opts":["這個月共借出 50 本書","科普書是借出第二多的種類","借出最少的是歷史書","下個月要多買一些歷史書"],"ans":"D","steps":["16＋12＋10＋8＋4＝50，能證明","科普 12 第二多、歷史 4 最少，能證明","下個月要買書是計畫，圖表沒有這個資料"],"tests":"圖文對讀","avoid":"計畫和想法，圖表證明不了"},{"q":"漫畫和科普加起來，比其他三種加起來多幾本？","opts":["2 本","4 本","6 本","8 本"],"ans":"C","steps":["漫畫＋科普：16＋12＝28","其他三種：10＋8＋4＝22","28－22＝6"],"tests":"圖表計算","avoid":"分兩堆加，再相減"}]}]},{"no":"週末關卡","title":"齊人攫金","skill":"小六上總複習（全部招式）","steps":["❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標","❹ 一字多義、古今異義：代回去試　❺ 推論和寓言三問找道理","完成後錄一支 60 秒「古文翻譯官」短片"],"demo":{"q":"「人皆在焉」的「焉」是什麼意思？","a":["→ 「焉」在句尾，常常等於「在那裡」","→ 代回：人都在那裡 → 通","答：在那裡"]},"parts":[{"label":"第一篇","title":"齊人攫金","text":["昔齊人有欲金者，清旦衣冠而之市，適鬻金者之所，因攫其金而去。吏捕得之，問曰：「人皆在焉，子攫人之金何？」對曰：「取金之時，不見人，徒見金。」"],"cite":"《列子．說符》","notes":"清旦：清晨　適：到　所：地方　因：於是、趁機　攫：搶　吏：官員　子：你","trans":"從前齊國有個想要金子的人，清晨穿好衣服、戴好帽子，到市場去，走到賣金子的人那裡，就搶了他的金子離開。官吏抓到他，問他說：「人都在那裡，你為什麼搶別人的金子？」他回答說：「拿金子的時候，我沒看見人，只看見金子。」","qs":[{"q":"「衣冠而之市」的「之」是什麼意思？","opts":["的","他","往、到","這"],"ans":"C","steps":["「之」後面接地方「市」","代回「到市場去」→ 通","「之」在地方前面，常是往"],"tests":"一字多義：之","avoid":"「之＋地方」就讀成「往」"},{"q":"「衣冠而之市」的「衣冠」在這裡是什麼意思？","opts":["穿好衣服、戴好帽子","衣服和帽子","賣衣服的店","有禮貌的人"],"ans":"A","steps":["「衣冠『而』之市」，而連接兩個動作","後面「之市」是動作，前面也要是動作","所以衣冠＝穿衣戴帽（名詞當動詞）"],"tests":"詞性：名詞當動詞","avoid":"「而」兩邊常常都是動作"},{"q":"「因攫其金而去」的「去」是什麼意思？","opts":["離開","前往","除去","過去"],"ans":"A","steps":["搶了金子之後的動作","代回「搶了金子就離開」→ 通","和「太丘舍去」的去一樣＝離開"],"tests":"古今異義：去","avoid":"文言的「去」先想「離開」"},{"q":"這個故事想告訴我們什麼？","opts":["齊國的市場很熱鬧","官吏辦案很快","太貪心的人，眼裡只看見想要的東西，看不見其他","金子很容易被偷"],"ans":"C","steps":["表面：大白天在市場搶金子","他說：「不見人，徒見金」","道理：被貪心蒙住眼睛，看不見後果"],"tests":"寓言主旨","avoid":"抓住人物最後說的那句話"}]},{"label":"第二篇","title":"庖丁解牛","text":["庖丁為文惠君解牛，手之所觸，肩之所倚，足之所履，膝之所踦，砉然嚮然，奏刀騞然，莫不中音。合於桑林之舞，乃中經首之會。"],"cite":"《莊子．養生主》（節選開頭）","notes":"庖丁：名叫丁的廚師　文惠君：梁惠王　倚：靠　履：踩　踦：抵住　砉然、嚮然：皮骨分離的聲音　奏刀：進刀　騞然：進刀的聲音　桑林：古代樂舞名　經首：古代樂曲名　會：節奏","trans":"名叫丁的廚師替文惠君宰牛，手接觸的地方、肩膀靠著的地方、腳踩著的地方、膝蓋抵住的地方，都發出皮骨分離的聲音，進刀時嘩嘩作響，沒有一個聲音不合乎音律。既合於〈桑林〉舞樂的節拍，又合於〈經首〉樂曲的節奏。","qs":[{"q":"「庖丁為文惠君解牛」的「為」是什麼意思？","opts":["成為","替","因為","是"],"ans":"B","steps":["代回「替文惠君宰牛」→ 通","「成為文惠君解牛」讀不通","「為＋人＋動作」＝替某人做"],"tests":"一字多義：為","avoid":"「為＋人＋動作」先代「替」"},{"q":"「莫不中音」是什麼意思？","opts":["完全沒有聲音","聲音都很大","聲音都不合音律","沒有一個聲音不合乎音律"],"ans":"D","steps":["莫＝沒有，不＝不","雙重否定＝肯定","沒有不合音律＝全部都合音律"],"tests":"雙重否定","avoid":"兩個否定相遇，意思變肯定"},{"q":"「莫不中音」的「中」是什麼意思？","opts":["中間","中國","中午","符合、合乎"],"ans":"D","steps":["後面接「音」：音律","代回「符合音律」→ 通","下一句「乃中經首之會」的中也是符合"],"tests":"一字多義：中","avoid":"同一段出現兩次，意思常一樣"},{"q":"這段文字表現出庖丁怎樣的本領？","opts":["力氣非常大","解牛技術純熟，動作和聲音像樂舞一樣有節奏","一邊工作一邊唱歌","很怕文惠君"],"ans":"B","steps":["證據一：手肩足膝配合，進刀「莫不中音」","證據二：「合於桑林之舞」","推出：技術熟練到像在跳舞奏樂"],"tests":"推論人物","avoid":"把描寫的句子合起來想"}]},{"label":"第三篇","title":"莊周夢蝶","text":["昔者莊周夢為胡蝶，栩栩然胡蝶也，自喻適志與！不知周也。俄然覺，則蘧蘧然周也。不知周之夢為胡蝶與，胡蝶之夢為周與？周與胡蝶，則必有分矣。此之謂物化。"],"cite":"《莊子．齊物論》","notes":"莊周：莊子　胡蝶：蝴蝶　栩栩然：輕快飛舞的樣子　喻：同「愉」，快樂　適志：心情舒暢　與：語氣詞　蘧蘧然：清醒的樣子　分：分別　物化：萬物互相轉化","trans":"從前莊周夢見自己變成蝴蝶，輕快地飛舞，真是一隻蝴蝶，自己覺得快樂舒暢啊！不知道自己是莊周了。不久醒過來，發現自己清清楚楚就是莊周。不知道是莊周夢見自己變成蝴蝶呢，還是蝴蝶夢見自己變成莊周呢？莊周和蝴蝶，一定是有分別的。這就叫做「物化」。","qs":[{"q":"「俄然覺」的「覺」是什麼意思？","opts":["睡醒","感覺","覺得","覺悟"],"ans":"A","steps":["前面在說做夢","代回「不久就睡醒了」→ 通","古代「覺」常是睡醒，和現在的覺得不同"],"tests":"古今異義：覺","avoid":"前面在做夢，「覺」就是醒來"},{"q":"「俄然覺」的「俄然」是什麼意思？","opts":["俄國","很慢地","不久、一會兒","生氣地"],"ans":"C","steps":["夢裡飛舞了一陣子，接著醒來","代回「不久就醒了」→ 通","詞語「俄頃」也是一會兒"],"tests":"字義：俄然","avoid":"用表示時間的意思代回"},{"q":"「不知周也」是在說什麼？","opts":["莊周不認識朋友","醒來後忘記做過夢","夢中變成蝴蝶時，忘了自己是莊周","蝴蝶害怕莊周"],"ans":"C","steps":["前面：夢為胡蝶，很快樂","補主詞：誰不知道？夢中的蝴蝶（莊周）","所以是忘了自己是莊周"],"tests":"補主詞","avoid":"先問「誰不知道」，往前找"},{"q":"莊周醒來後，產生了什麼疑問？","opts":["是莊周夢見變成蝴蝶，還是蝴蝶夢見變成莊周","蝴蝶為什麼會飛","人為什麼會做夢","明天還會不會夢到"],"ans":"A","steps":["找問句：「不知周之夢為胡蝶與，胡蝶之夢為周與？」","兩個「夢為」，一個是莊周，一個是蝴蝶","其他選項文中都沒問"],"tests":"找證據句","avoid":"問句的答案就在「與？」那一句"}]},{"label":"第四篇","title":"北人食菱","text":["北人生而不識菱者，仕於南方。席上食菱，並殼入口。或曰：「食菱須去殼。」其人自護其短，曰：「我非不知，並殼者，欲以清熱也。」問者曰：「北土亦有此物否？」答曰：「前山後山，何地不有！」夫菱角生於水中而曰土產，此坐強不知以為知也。"],"cite":"江盈科《雪濤小說》","notes":"菱：菱角，長在水中的植物果實　仕：做官　並：連同　護其短：掩飾自己的缺點　清熱：消除體內的熱氣　北土：北方","trans":"有個北方人，生來不認識菱角，在南方做官，在酒席上吃菱角，連殼一起放進嘴裡。有人說：「吃菱角要去掉殼。」那個人想掩飾自己的缺點，說：「我不是不知道，連殼一起吃，是想要清熱。」問的人說：「北方也有這種東西嗎？」他回答：「前山後山，哪裡沒有！」菱角長在水中，他卻說是長在土裡，這是因為他硬把不知道的當作知道啊。","qs":[{"q":"「或曰」的「或」是什麼意思？","opts":["或者","或許","他自己","有人"],"ans":"D","steps":["代回「有人說：吃菱角要去殼」→ 通","後面「其人」才是北方人自己","句首「或曰」＝有人說"],"tests":"字義：或","avoid":"句首的「或曰」通常是「有人說」"},{"q":"「食菱須去殼」的「去」，和「因攫其金而去」的「去」意思一樣嗎？","opts":["一樣，都是離開","不一樣：這裡是除去，齊人那篇是離開","一樣，都是前往","不一樣：這裡是前往，齊人那篇是除去"],"ans":"B","steps":["「去殼」：後面接東西 → 除去殼","「攫其金而去」：搶完就走 → 離開","同一個字，意思不同"],"tests":"一字多義：去","avoid":"看「去」後面有沒有接東西"},{"q":"「前山後山，何地不有？」是什麼意思？","opts":["哪裡都沒有","哪裡沒有呢？到處都有","只有前山後山才有","他不知道哪裡有"],"ans":"B","steps":["「何地不有」＝哪個地方沒有呢？","反問句＝肯定：到處都有","他想假裝很懂"],"tests":"反問句","avoid":"反問句要倒過來讀成肯定"},{"q":"這個故事諷刺哪一種人？","opts":["喜歡吃菱角的人","到南方做官的人","愛問問題的人","不懂裝懂、硬要掩飾缺點的人"],"ans":"D","steps":["證據一：「自護其短」","證據二：最後一句「強不知以為知」","所以諷刺不懂裝懂的人"],"tests":"寓言主旨","avoid":"作者的評語常在最後一句"}]},{"label":"第五篇","title":"折箭","text":["阿豺有子二十人，緯代，長子也。阿豺又謂曰：「汝等各奉吾一支箭，折之地下。」俄而命母弟慕利延曰：「汝取一支箭折之。」慕利延折之。又曰：「汝取十九支箭折之。」延不能折。阿豺曰：「汝曹知否？單者易折，眾則難摧，戮力一心，然後社稷可固。」"],"cite":"《魏書．吐谷渾傳》（節選）","notes":"阿豺：吐谷渾國的國王　緯代：阿豺的長子　奉：拿　母弟：同一個母親生的弟弟　慕利延：阿豺的弟弟　汝曹：你們　戮力：合力　社稷：國家","trans":"阿豺有二十個兒子，緯代是長子。阿豺又對兒子們說：「你們每人拿我一支箭，折斷後丟在地上。」過了一會兒，又命令同母的弟弟慕利延說：「你拿一支箭把它折斷。」慕利延折斷了。阿豺又說：「你拿十九支箭把它們折斷。」慕利延折不斷。阿豺說：「你們明白嗎？單獨一支容易折斷，很多支合在一起就難以折斷。大家同心合力，國家才能穩固。」","qs":[{"q":"「延不能折」，折不斷箭的是誰？","opts":["阿豺","緯代","慕利延","阿豺的二十個兒子"],"ans":"C","steps":["往前找：「又曰：『汝取十九支箭折之。』」是對慕利延說的","「延」就是慕利延名字的簡稱","所以折不斷十九支箭的是慕利延"],"tests":"補主詞","avoid":"名字被縮短時，往前找全名"},{"q":"「俄而命母弟慕利延曰」的「俄而」是什麼意思？","opts":["不久、一會兒","俄國人","很生氣地","從前"],"ans":"A","steps":["前面：兒子們剛折完箭，接著又叫弟弟來","代回「過了一會兒，又命令弟弟」→ 通","和〈莊周夢蝶〉「俄然覺」的俄一樣＝不久"],"tests":"字義：俄而","avoid":"「俄」開頭，先想「一會兒」"},{"q":"「單者易折，眾則難摧」的「摧」是什麼意思？","opts":["催促","推開","眾多","折斷"],"ans":"D","steps":["前後兩句相對：單者對眾，易對難","「易折」對「難摧」，摧和折意思相近","代回「很多支就難折斷」→ 通，所以「摧」＝折斷"],"tests":"字義：對句推字","avoid":"兩句相對，對應的字意思常相近"},{"q":"阿豺用折箭想告訴大家什麼？","opts":["箭要一支一支地用","大家同心合力，國家才能穩固","弟弟的力氣比兒子小","長子最重要，要聽長子的話"],"ans":"B","steps":["證據一：一支箭一折就斷，十九支合起來折不斷","證據二：阿豺的結論「戮力一心，然後社稷可固」","推出：團結力量大，國家才能穩固"],"tests":"主旨","avoid":"人物最後說的話，常是主旨"}]}]}],"teach":[{"intro":"複習週第一關：補主詞、虛詞、推論，三招一起用。","items":[{"t":"補主詞怎麼補？","d":["文言常把主詞省掉，看到動作就問「誰做的？」，往前找最近的人。","「好一一聽之」→ 前一句「湣王立」→ 是湣王喜歡一個一個聽。"],"ex":"就像播報員只說「切入、上籃」，你要知道是哪個球員。"},{"t":"虛詞「而、故、乃、之」","d":["而：然後／卻　故：所以　乃：於是、才　之：他、它，放在地方前面是「往」。","「宣王說之」的「之」＝南郭處士。"]},{"t":"推論：證據＋證據＝結論","d":["宣王時三百人一起吹，湣王改成一個一個聽，處士就逃。","兩件事合起來推出：他其實不會吹竽。"],"ex":"就像柴犬看到你拿牽繩就轉圈，你推得出牠想出門。"}],"demo":["「好一一聽之，處士逃。」","補主詞：誰好一一聽之？前句「湣王立」→ 湣王","推論：一個一個吹會露餡 → 處士其實不會吹"]},{"intro":"複習週第二關：一個字有很多意思，古今意思也不同，用「代回去」來判斷。","items":[{"t":"一字多義","d":["同一個字，換了句子意思就不同。","「而」：順著是「然後」，相反是「卻」。「鄭人買其櫝而還其珠」→ 買了匣子卻還珍珠 → 卻。"],"ex":"就像「傳」：傳球、傳話，看後面接什麼。"},{"t":"古今異義","d":["古代和現在寫法一樣，意思卻不同。","「飾以玫瑰」的玫瑰＝美玉，不是花；「炎帝之少女」＝小女兒。"]},{"t":"選項代回","d":["把每個選項放回原句讀一次，讀得通、又和前後文對得上的才選。"]}],"demo":["「飾以玫瑰」的「玫瑰」","代「花」→ 前後是珠玉、翡翠，花放不進去","代「美玉」→ 都是貴重材料 → 通"]},{"intro":"複習週第三關：讀白話長文，靠證據、段落重點和絕對字三招。","items":[{"t":"白話找證據","d":["選項的每一個說法，都要在文章找到同一句。","「柴犬每年大量換毛一到兩次」→ 第三段找得到 → 有證據。"]},{"t":"段落重點","d":["每段讀完寫一句話；重點常在第一句，或「但是」「所以」後面。","〈柴犬好養嗎〉第二段：「不過」後面＝很有主見，要用獎勵慢慢教。"],"ex":"就像看比賽精華，每一節挑一球最關鍵的。"},{"t":"絕對字","d":["都、一定、永遠、從來、完全、所有、每個。","文章說「可能」「不一定」，選項卻說「一定」→ 排除。"]}],"demo":["材料：文章說柴犬「很聰明，卻不一定願意乖乖聽話」","選項：「柴犬從來不聽主人的話」","圈絕對字：「從來」","文章只說「不一定」聽話，沒有那麼滿 → 排除這個選項"]},{"intro":"複習週第四關：互文對讀，一篇《論語》配一篇白話，比一比。","items":[{"t":"比較表四格","d":["甲說什麼｜乙說什麼｜相同｜不同。","甲「學而不思則罔」＝只練不想；乙「只是一直投，不去想」＝同一件事 → 連線。"],"ex":"就像比賽前比兩隊數據，一項一項對。"},{"t":"題目怎麼對應？","d":["問「兩篇都」「共同」→ 看相同。","問「只有甲」「甲有乙沒有」→ 看不同。"]}],"demo":["材料：甲「學而不思則罔，思而不學則殆」；乙「只坐在場邊看影片、研究姿勢，卻從來不下場練，也永遠投不準」","乙：看影片研究＝思；不下場練＝不學","對應甲：「思而不學則殆」（只想不練，會出問題）"]},{"intro":"複習週第五關：圖表五步驟，再加上文字和圖表互相核對。","items":[{"t":"圖表五步驟","d":["標題→單位→趨勢→最大最小→回圖找數字。","閱讀時間表：單位是分鐘，最多是週四 25 分鐘。"]},{"t":"圖文對讀","d":["把文字說法一句一句拿去對圖表。","日記說「週四讀最久」→ 圖表能證明；「因為沒有練球」→ 圖表沒有這個資料，不能證明。"],"ex":"就像裁判看重播：看得到的才算數。"}],"demo":["材料：表格「週一 15、週二 20、週三 10、週四 25、週五 20」，單位是分鐘","題目：五天總共讀幾分鐘？","15＋20＋10＋25＋20＝90","換順序檢查：（15＋20）＋（25＋10）＋20＝35＋35＋20＝90 → 90 分鐘"]},{"intro":"小六上關卡：前四週學過的招式全部一起用。","items":[{"t":"這學期學了哪些招？","d":["補主詞、虛詞、成語反推、選項代回、白話找證據、圖表五步驟、互文對讀、一字多義、推論、段落重點、寓言三問、古今異義、對話題、因果連鎖、圖文對讀。"]},{"t":"同一個字，不同意思","d":["「之」：「衣冠而之市」＝往；「吏捕得之」＝他。","「去」：「攫其金而去」＝離開；「食菱須去殼」＝除去。"],"ex":"就像「傳」：傳球、傳話，同一個字，用法不同。"},{"t":"名詞當動詞","d":["「衣冠而之市」的衣冠，是穿衣戴帽的動作。","看到「而」連接，兩邊常常都是動作。"]}],"demo":["「取金之時，不見人，徒見金。」","徒＝只（家徒四壁）","寓言三問：被貪心蒙住眼睛，只看見想要的東西"]}],"daily":[{"words":[["使","讓、派","使人吹竽"],["好","喜歡","好一一聽之"]],"line":"好一一聽之，處士逃。"},{"words":[["鬻","賣","未可謂善鬻珠也"],["飾","裝飾","飾以玫瑰"]],"line":"鄭人買其櫝而還其珠。"},{"words":[["欲","想要","欲罷不能"],["徒","只","家徒四壁"]],"line":"取金之時，不見人，徒見金。"},{"words":[["罔","迷惘","學而不思則罔"],["殆","危險、疑惑","思而不學則殆"]],"line":"學而不思則罔，思而不學則殆。"},{"words":[["攫","搶","攫取"],["吏","官員","官吏"]],"line":"溫故而知新，可以為師矣。"},null],"quiz":{"words":[["使","讓、派","齊宣王使人吹竽"],["好","喜歡","好一一聽之"],["鬻","賣","未可謂善鬻珠也"],["飾","裝飾","飾以玫瑰"],["欲","想要","昔齊人有欲金者"],["徒","只","不見人，徒見金"],["罔","迷惘","學而不思則罔"],["殆","危險、疑惑","思而不學則殆"],["攫","搶","因攫其金而去"],["吏","官員","吏捕得之"]],"lines":[["好一一聽之，","處士逃。"],["鄭人買其櫝","而還其珠。"],["取金之時，不見人，","徒見金。"],["學而不思則罔，","思而不學則殆。"],["溫故而知新，","可以為師矣。"]],"parts":[{"label":"第一篇","title":"東施效顰","text":["西施病心而顰其里，其里之醜人見而美之，歸亦捧心而顰其里。其里之富人見之，堅閉門而不出；貧人見之，挈妻子而去之走。彼知顰美，而不知顰之所以美。"],"cite":"《莊子．天運》（節選）","notes":"西施：春秋時越國的美女　顰：皺眉頭　里：鄉里　捧心：用手按著胸口　堅：緊緊地　挈：帶領　彼：她，指那個醜女人","trans":"西施心口疼痛，在鄉里中皺著眉頭。鄉里中一個醜女人看見了，覺得她很美，回家後也按著胸口，在鄉里中皺眉頭。鄉里的有錢人看見她，緊緊關上大門不出來；窮人看見她，帶著妻子和兒女離開她，逃得遠遠的。那個醜女人只知道皺眉的樣子美，卻不知道皺眉為什麼美。","qs":[{"q":"「西施病心」的「病心」是什麼意思？","opts":["擔心","心口疼痛","心地不好","傷心"],"ans":"B","steps":["後面「捧心」：用手按著胸口","按胸口是因為心口痛","所以「病心」＝心口疼痛"],"tests":"字義：病","avoid":"用後文的動作反推前文"},{"q":"「其里之醜人見而美之」的「美之」是什麼意思？","opts":["讓她變美","美麗的地方","讚美自己","覺得她很美"],"ans":"D","steps":["醜女人看見西施皺眉","後面她回家模仿，表示她覺得西施皺眉很美","所以「美之」＝認為她美"],"tests":"詞性：美當動詞","avoid":"形容詞後面接「之」，常當動作讀"},{"q":"「挈妻子而去之走」的「妻子」是什麼意思？","opts":["太太","女兒","鄰居","妻子和兒女"],"ans":"D","steps":["窮人看到醜女人，要帶著全家逃走","古代「妻子」是兩個詞：妻＋子（兒女）","現代的「妻子」只指太太，古今不同"],"tests":"古今異義：妻子","avoid":"古文兩個字常常是兩個詞"},{"q":"「去之走」的「走」是什麼意思？","opts":["走路","跑、逃","散步","走漏"],"ans":"B","steps":["窮人被嚇到，要遠遠離開","古代「走」＝跑（兔走觸株）","代回「離開她逃跑」→ 通"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"這個故事告訴我們什麼？","opts":["只模仿外表，不明白美的原因，反而弄巧成拙","西施很美","窮人很膽小","生病要趕快看醫生"],"ans":"A","steps":["最後一句：「彼知顰美，而不知顰之所以美」","醜女人只學皺眉，大家都被嚇跑","道理：盲目模仿反而更糟"],"tests":"寓言主旨","avoid":"作者的評語常在最後一句"}]},{"label":"第二篇","title":"五十步笑百步","text":["孟子對曰：「王好戰，請以戰喻。填然鼓之，兵刃既接，棄甲曳兵而走。或百步而後止，或五十步而後止。以五十步笑百步，則何如？」曰：「不可，直不百步耳，是亦走也。」"],"cite":"《孟子．梁惠王上》（節選）","notes":"王：梁惠王　喻：比喻　填然：咚咚的鼓聲　鼓：擊鼓進軍　兵刃：兵器　接：交鋒　甲：鎧甲　曳：拖著　兵：兵器　耳：罷了","trans":"孟子回答說：「大王喜歡打仗，請讓我用打仗來比喻。咚咚地擊鼓進軍，雙方兵器已經交鋒，有士兵就丟下鎧甲、拖著兵器逃跑。有的人跑了一百步才停下，有的人跑了五十步才停下。跑五十步的人嘲笑跑一百步的人，那怎麼樣呢？」梁惠王說：「不可以，只不過沒有跑到一百步罷了，這也是逃跑啊。」","qs":[{"q":"「王好戰」的「好」是什麼意思？","opts":["好的","很","喜歡","完成"],"ans":"C","steps":["代回「大王喜歡打仗」→ 通","後面「請以戰喻」：所以用打仗來比喻","和「好一一聽之」的好一樣＝喜歡"],"tests":"字義：好","avoid":"「好」在動作前，先代「喜歡」"},{"q":"「棄甲曳兵而走」的「走」是什麼意思？","opts":["走路","散步","逃跑","走運"],"ans":"C","steps":["丟下鎧甲、拖著兵器，是打敗了","代回「丟盔棄甲逃跑」→ 通","古代「走」＝跑"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"「或百步而後止」的「或」是什麼意思？","opts":["有的人","迷惑","或許","一定"],"ans":"A","steps":["前面說的是很多逃跑的士兵","「或……或……」＝有的人……有的人……","代回「有的人跑了百步才停」→ 通"],"tests":"字義：或","avoid":"「或」在句首，常是「有人」"},{"q":"「直不百步耳」的「直」是什麼意思？","opts":["筆直","直接","正直","只是、只不過"],"ans":"D","steps":["後面有「耳」＝罷了","代回「只不過沒跑到一百步罷了」→ 通","「直……耳」＝只是……罷了"],"tests":"虛詞「直」","avoid":"「直」和「耳」常一起出現"},{"q":"「以五十步笑百步」比喻什麼？","opts":["跑得快的人比較厲害","自己也有同樣的缺點，只是輕一點，卻去嘲笑別人","打仗一定要勇敢","五十步比一百步好"],"ans":"B","steps":["梁惠王自己的結論：「是亦走也」","跑五十步也是逃跑，和跑百步本質一樣","所以比喻：同樣有錯，卻笑別人"],"tests":"推論比喻","avoid":"看人物最後的結論"}]}]},"cap":{"no":"會考實戰","title":"第 4 週會考實戰","skill":"會考解題技法：生活文章與圖表：逐字核對","steps":["❶ 先看題目最後一句：問「最恰當」還是「無法推論、最不可能」？","❷ 把選項拆成小格：人、事、時間、數字、條件","❸ 回原文或表格找到同一格，一個字一個字對","❹ 圈出限制詞與例外：「限、每、只、休、另、否則」","❺ 要計算的動手算，有證據才選，沒寫到的就刪"],"demo":{"q":"示範題：【110 年會考第 5 題】「山田汽車成立於西元1916年。高橋汽車在山田汽車成立100週年時發表一段賀詞：『感謝100年來的競爭，沒有你的那30年有點孤獨。』」根據這段文字，高橋汽車最可能成立於西元哪一年？（甲）1816（乙）1846（丙）1886（丁）1946","a":["→ 先看題目：問高橋汽車哪一年成立，答案藏在數字裡","→ 逐字核對：山田1916年成立，100週年＝2016年；「100年來的競爭」＝山田出現後兩家一起競爭了100年","→ 「沒有你的那30年」＝山田還沒出現時，高橋已經自己孤單了30年，所以高橋比山田早30年成立：1916－30＝1886","答：1886"]},"teach":{"intro":"會考很愛考生活裡的文字：廣告、海報、問卷、表格、年表。答案通常就寫在上面，只要一格一格對，就不會被騙。","items":[{"t":"什麼是「實用文本」？","d":["生活裡用來告訴你事情的文字，例如海報、公告、說明書、問卷、賽程表。","它不是要你感動，是要你「照著做」，所以每個數字、時間、條件都很重要。"],"ex":"像球隊的練球通知：「週一、三、五下午四點，體育館，帶水壺」，看錯一個字就會白跑一趟。"},{"t":"什麼是「逐字核對」？","d":["選項常把原文換個說法，或偷偷改掉一個數字、一個條件。","做法：把選項拆成小格（誰、什麼、幾點、多少錢），每一格都要在原文找到同一句才算對。"],"ex":"像對比賽記分表：誰得幾分、第幾節，一格一格對，錯一格整場就算錯。"},{"t":"什麼是「限制詞」和「例外」？","d":["「限、每、只、皆、否則、另」這些字會把範圍框起來，最常被拿來出陷阱。","例如「限以下10種」，不在名單裡的就不行；「週三休診」，那天去就撲空。"],"ex":"像柴犬公園寫「限中小型犬入內」，大狗就不能進，再可愛也一樣。"},{"t":"什麼是「推得出來」和「推不出來」？","d":["推得出來：表格或文章有寫，或用加減算得出來。","推不出來：文章沒寫、表格沒列，就算聽起來很合理也不能選。"],"ex":"記分板寫我們贏8分，可以推「我們贏了」；但推不出「是誰投進最多球」，因為上面沒寫。"}],"demo":["①先看題目問什麼：高橋汽車哪一年成立","②逐字核對數字：1916年＋100年＝2016年，「沒有你的那30年」是山田還沒出現的時候","③動手算：1916－30＝1886，選1886"]},"parts":[{"label":"第一篇","title":"113 年會考 第 1、4 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 1、4 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"【阿宏水產　10月8日】\n圖片上的字：新售價50／條　雖然沒有學歷、沒有背景！秋刀魚還是加薪了\n貼文：秋刀魚一直用離職威脅老闆加薪\n老闆雖然不開心，但是好多人支持它\n為了把它留下來\n只好幫它加薪了，一條50元喔\n我也這樣威脅老闆說要走\n結果老闆跟我說再見\n我還是乖乖回來發文了\n這則粉絲專頁貼文的用意，最可能是下列何者？","opts":["徵求粉絲專頁新小編","預告直播促銷的期程","暗示秋刀魚產季將近","宣布調漲秋刀魚價格"],"ans":"D","steps":["逐字核對：貼文用好笑的「加薪」來包裝，但圖片上寫的是「新售價50／條」，貼文也說「一條50元喔」。","秋刀魚「加薪」＝秋刀魚變貴了，所以貼文真正要說的是漲價。","貼文沒有說要找小編、沒有說直播日期，也沒提產季，這三個都沒有證據，答宣布調漲秋刀魚價格。"],"tests":"看懂廣告的真正用意","avoid":"笑話包裝下，找數字與價格那一句"},{"q":"某些問卷使用了否定詞，受訪者有時不易理解內容，感到混淆。根據下列問卷題目，阿寶的立場與其選擇相符的是哪一個？","opts":["問卷題目：您是否同意廢除最低工資的設立？／阿寶的立場：最低工資要受到保障／阿寶的選擇：同意","問卷題目：您是否同意禁止種植基因改造植物？／阿寶的立場：反對基因改造／阿寶的選擇：同意","問卷題目：您是否同意政府不應全面禁止動物實驗？／阿寶的立場：人類福祉應優先於其他動物／阿寶的選擇：不同意","問卷題目：您是否同意政府不可為了國家建設而提高稅率？／阿寶的立場：不想多繳稅／阿寶的選擇：不同意"],"ans":"B","steps":["逐字核對否定詞：把題目裡的「廢除、禁止、不應、不可」圈起來，先想「贊成這句話的人想要什麼」。","反對基因改造的人，當然「同意禁止種植」，立場和選擇對得上。","其他三個都反了：要保障最低工資就該「不同意廢除」；認為人類優先就該「同意不應全面禁止」實驗；不想多繳稅就該「同意不可提高稅率」。答第二個。"],"tests":"問卷否定詞","avoid":"看到「不、禁止、廢除」先翻成白話"}]},{"label":"第二篇","title":"111 年會考 第 25 題","text":[],"table":[["順位","死因","順位","死因"],["1","癌症","7","慢性下呼吸道疾病"],["2","心臟疾病","8","高血壓性疾病"],["3","肺炎","9","腎臟疾病"],["4","腦血管疾病","10","慢性肝病"],["5","糖尿病","11","蓄意自我傷害"],["6","事故傷害","",""]],"cite":"111 年國中教育會考國文科 第 25 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"【甲】衛福部公布107年國人十大死因：與十年前相較，癌症與心臟疾病依舊高居死因前兩位，糖尿病、事故傷害、慢性下呼吸道疾病順位不變，肺炎、高血壓性疾病、腎臟疾病順位上升，腦血管疾病、慢性肝病與蓄意自我傷害順位下降。\n【乙】107年國人死因順位（資料來源：衛福部）\n根據甲、乙兩項資料，關於民國97年國人主要死亡原因，⟦無法⟧明確推論出下列何者？","opts":["慢性肝病為當時國人十大死因之一","腦血管疾病為當時國人第三大死因","蓄意自我傷害為當時國人十大死因之一","肺炎、高血壓性疾病、腎臟疾病皆為當時國人十大死因"],"ans":"D","steps":["先圈「無法」：要找推不出來的那一個。97年就是107年的「十年前」。","「順位下降」＝十年前排得更前面：慢性肝病現在第10、蓄意自我傷害現在第11，十年前一定更前面，都在十大裡；腦血管疾病現在第4，十年前一定比第4前面，而第1、2名固定是癌症和心臟疾病，所以十年前它就是第3名。","「順位上升」＝十年前排得更後面：肺炎、高血壓、腎臟疾病十年前可能排在第11名以後，表格看不出來，答最後一個。"],"tests":"表格配文字推論","avoid":"上升、下降要想成「十年前在哪」"}]},{"label":"第三篇","title":"112 年會考 第 21 題","text":[],"table":[["年分","出口總額","年分","出口總額"],["1866","120","1886","240"],["1869","150","1889","187"],["1872","170","1892","162"],["1879","198","1897","153"],["1882","201","1900","120"]],"cite":"112 年國中教育會考國文科 第 21 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"1866至1900年甲國茶葉出口歐洲略表　單位：萬擔\n說明：\n1866至1886年間，甲國茶葉出口逐年大幅增長。歐洲國家茶葉生產技術發展起來後，甲國茶葉出口總額急轉直下。從1886至1900的十五年間，甲國茶葉出口銳減，在歐洲茶葉市場的占有率也從原本幾乎100%，急遽下降至10%左右。\n根據這份表格及說明，可以推論出下列何者？","opts":["甲國的茶葉生產技術在1886年後越來越差","1900年歐洲茶葉市場總交易量較1886年少","1900年甲國茶葉出口歐洲總額衰退至1886年的50%","1866至1900年間，甲國從茶葉出口國變成茶葉進口國"],"ans":"C","steps":["找那一格：1886年是240萬擔，1900年是120萬擔，120是240的一半，就是50%。","說明裡變好的是「歐洲國家」的生產技術，沒說甲國技術變差；甲國也一直在出口，沒變成進口國。","市場總量：甲國賣的少了一半，占有率卻從將近100%掉到10%，表示歐洲市場其實變大了，不是變少。答第三個。"],"tests":"表格數字計算","avoid":"算比例前先找對年分那一格"}]},{"label":"第四篇","title":"114 年會考 第 21 題","text":[],"table":[["位置","16強賽","8強賽","4強賽"],["左半區上方","荷蘭－美國、阿根廷－澳大利亞","這兩場的勝者對戰","左半區上方勝者對左半區下方勝者"],["左半區下方","日本－克羅埃西亞、巴西－南韓","這兩場的勝者對戰",""],["右半區上方","英格蘭－塞內加爾、法國－波蘭","這兩場的勝者對戰","右半區上方勝者對右半區下方勝者"],["右半區下方","摩洛哥－西班牙、葡萄牙－瑞士","這兩場的勝者對戰",""],["冠軍賽、季軍賽","左、右兩場4強賽：勝者進入冠軍賽，負者進入季軍賽","",""]],"cite":"114 年國中教育會考國文科 第 21 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"世界盃足球賽在16強賽到4強賽之間採單淘汰制（輸一場即遭淘汰），根據這張賽程表推判，下列結果何者最可能出現？","opts":["冠軍：阿根廷／亞軍：巴西／季軍：英格蘭","冠軍：荷蘭／亞軍：波蘭／季軍：澳大利亞","冠軍：法國／亞軍：西班牙／季軍：葡萄牙","冠軍：克羅埃西亞／亞軍：摩洛哥／季軍：塞內加爾"],"ans":"D","steps":["逐格核對規則：冠軍賽是左、右半區各一隊，所以冠軍和亞軍一定一左一右；阿根廷、巴西都在左邊，法國、西班牙都在右邊，這兩個刪掉。","季軍來自4強賽輸的隊伍：荷蘭當冠軍，表示左半區上方是荷蘭贏，輸掉4強賽的一定在左半區下方，澳大利亞和荷蘭同一邊，不可能。","最後一個：克羅埃西亞（左）對摩洛哥（右）爭冠軍；摩洛哥在右半區下方，4強賽輸給它的是右半區上方，塞內加爾正好在那裡，答最後一個。"],"tests":"看賽程表推結果","avoid":"先找每隊在哪一區，再對規則"}]},{"label":"第五篇","title":"111 年會考 第 26～27 題（題組）","text":["家電診所維修說明","為加強資源回收再利用，延長產品壽命，家電診所係以「簡易維修」為主，幫助市民排除小家電故障問題，使家電獲得重生，以達到資源永續、建構低碳城市的目標。","【維修流程】洽詢診所服務臺 → 填寫家電維修單 → 檢視及確認家電外觀 → 酌收50元工本費　開立收據 → 拆解檢修【特殊材料費另報價】 → 完修電話通知領回 → 攜帶取貨聯單領回【繳交特殊材料費用】","【維修項目】限以下10種家庭用小家電（備註：每件酌收50元工本費）：❶電風扇　❷吹風機　❸烤箱　❹電鍋（含電子鍋）　❺飲水機　❻果汁機　❼熱水瓶　❽檯燈　❾烘碗機　❿快煮壺","【家電維修哪裡找？】綠能家電診所　電話：（00）1234-××××　地址：環保市環保路999號","【收領件時間】08:00～12:00　13:00～16:30【週三、日及國定假日休診】"],"cite":"111 年國中教育會考國文科 第 26～27 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據這張海報，下列關於綠能家電診所維修內容的敘述，何者最恰當？","opts":["可電話預約時間，專人到府收件","維修費用依家電的大小而有不同","只要維修合於規定的家電，都需繳交工本費","領件時若未攜帶取貨聯單，可以維修單代替"],"ans":"C","steps":["逐字核對：維修項目寫「每件酌收50元工本費」，只要是那10種家電，每一件都要交，對上第三個。","海報只有「洽詢診所服務臺」，沒有到府收件；工本費是每件一樣的50元，不是看大小。","領件要「攜帶取貨聯單」，海報沒說可以用維修單代替。答第三個。"],"tests":"海報規定核對","avoid":"「每件」「限」這種字要圈起來"},{"q":"下列四人聲稱曾到綠能家電診所送修電器，何人所述與這張海報的內容最相符？","opts":["小強：週一 14：00 送修咖啡機，週四 09：00 就拿到了","小顏：週三 10：00 送修飲水機，週五 13：00 就領件了","小燕：週六 16：00 送修電子鍋，接到通知後憑取貨聯單領回","小龍：週二 08：00 送修熱水瓶，先繳交50元特殊材料費才能檢修"],"ans":"C","steps":["每個人拆成三格核對：什麼家電、哪天幾點、怎麼付錢領回。","咖啡機不在10種裡；週三休診，不能送修；50元是「工本費」，特殊材料費是「另報價」、領回時才繳。","小燕：電子鍋算在電鍋裡，週六16:00在13:00～16:30之間，接到電話通知、帶取貨聯單領回，三格全對。答第三個。"],"tests":"海報條件核對","avoid":"人、時、物、錢各對一次"}]},{"label":"第六篇","title":"110 年會考 第 33～34 題（題組）","text":["喝茶加檸檬是美式作法，英國人則不然。早期開始流行茶葉時，英國人模仿中國人使用瓷具泡茶，但若直接倒入熱茶可能導致瓷杯過熱破裂，故先加入牛奶來降溫。當時的上流社會也因此會比較彼此的瓷器等級，若茶具能接受牛奶後加，表示此家族擁有的茶具等級更高。","中上階級的喝茶習慣，是先用茶壺浸泡茶葉，形成淡茶後再倒入單耳瓷杯裡。通常伯爵茶、烏龍茶是上流社會裡常見的茶品，茶色呈淡褐色，加入牛奶飲用，因為多會搭配甜品，通常不會加糖。而勞動階級的飲茶方式，則是以茶包沖泡於馬克杯中形成濃茶後再加入糖，牛奶則可融合濃茶的苦澀味，既濃又甜的阿薩姆故而成為受歡迎的茶，是需要消耗大量熱量的勞工階級喜愛的口味。","在階級制度逐漸模糊的今天，茶葉如何沖泡或牛奶先加後加，已不大有明顯界線。方便快速的茶包市面上隨處可見，再講究一些的，也能在茶葉專賣店找到喜歡的茶葉。至於是否要加牛奶，英國人會告訴你：「什麼都不加的紅茶，只比白開水好喝一點而已。」","——改寫自謝昀瑾〈喝茶加不加糖，原來和階級有關〉"],"table":[["茶具","濃淡","茶種","是否加糖"],["瓷器","淡","阿薩姆","是"],["瓷器","濃","伯爵茶","是"],["馬克杯","淡","阿薩姆","否"],["馬克杯","濃","阿薩姆","是"]],"cite":"110 年國中教育會考國文科 第 33～34 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，下列何者最可能是以前英國勞動階級的喝茶方式？","opts":["瓷器／淡／阿薩姆／是","瓷器／濃／伯爵茶／是","馬克杯／淡／阿薩姆／否","馬克杯／濃／阿薩姆／是"],"ans":"D","steps":["先找到講「勞動階級」的那一句：「以茶包沖泡於馬克杯中形成濃茶後再加入糖」，後面又說「既濃又甜的阿薩姆」受歡迎。","表格四格逐一對：茶具＝馬克杯、濃淡＝濃、茶種＝阿薩姆、加糖＝是。","瓷器、淡茶、伯爵茶、不加糖都是中上階級的喝法，四格全對的只有最後一列。"],"tests":"表格四格對原文","avoid":"先分清楚是哪個階級的句子"},{"q":"根據本文，可以推知下列何者？","opts":["美國人喝茶習慣不加糖","美國人使用的茶具較為高級","英國人喝紅茶大多會加牛奶","英國的高級茶具不能直接注入熱茶"],"ans":"C","steps":["找證據：最後一段英國人說「什麼都不加的紅茶，只比白開水好喝一點而已」，表示他們大多會加牛奶。","文章只說美國人加檸檬，沒提加不加糖，也沒比較美國茶具；高級茶具是「能接受牛奶後加」，也就是可以直接倒熱茶，最後一個說反了。","有證據的只有第三個。"],"tests":"推論要有證據","avoid":"說反的、沒提的都刪掉"}]},{"label":"第七篇","title":"112 年會考 第 27～29 題（題組）","text":["挑戰勇氣的跳水，是世上最吸睛的運動比賽之一。跳水選手必須體態優美且靈活。他們會從數公尺高的跳臺躍入水中，同時做出大膽的動作。首先，選手必須站上跳臺，以直立或倒立的姿勢起跳。而有些比賽採用跳板起跳，可以輔助跳水者跳得更高、騰空的時間更久。跳水選手會在身體開始下降時，表演一系列抱膝、旋轉、騰翻、轉體與其他大膽精巧的動作，最後盡可能順暢入水。歷史上有紀錄的第一場跳水比賽是在1871年舉行，當時的選手要從倫敦橋跳下泰晤士河。現今的跳水有個人比賽，也有雙人比賽。","起跳：選手由跳臺躍入水中，起跳動作可以是向前、向後或者倒立。","騰空：起跳後到入水前，選手處於騰空的狀態，此時會開始表演旋轉與轉體一系列的動作。","評分：評審團針對選手每一次的跳水評分。評審的數量會因比賽的規模而有所差異，以奧運比賽為例，個人賽配置7名評審，雙人跳水則配置11名評審。","入水：當選手入水的時候，濺起水花能緩和衝擊，但評審想看到的是簡潔流暢的入水，激起太大的水花會遭到扣分。","跳水比賽規則：","●每位評審各自針對選手的每一次跳水評分，分數的範圍為0分（失敗）到10分（極好）。","●滿分為10分，針對起跳、騰空、入水動作，各部分最高可以給3分，剩下的1分則評定整體動作執行的完善程度。","●比賽前，選手必須先繳交跳水動作表，設定每一跳的動作難度。比賽時只能依照動作表完成跳水，否則以0分計算。","●奧運個人賽計分時，2個最高分與2個最低分不予採計，僅採計中間3名評審的分數後，再乘以動作的難度係數，最後算出該次跳水的得分。","●每一跳的得分皆須採計。","——改寫自亞當．斯金納《運動大百科》"],"table":[["評審一","評審二","評審三","評審四","評審五","評審六","評審七"],["7分","8分","8分","7分","9分","7分","9分"]],"cite":"112 年國中教育會考國文科 第 27～29 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據圖文，下列關於跳水比賽的敘述，何者最恰當？","opts":["入水時水花的大小會影響分數高低","史上第一場跳水比賽是在室內舉行","奧運比賽的雙人賽必須配置7名評審","使用跳板起跳就可以獲得比較高的分數"],"ans":"A","steps":["每個選項找對應的那一格：「入水」那格寫「激起太大的水花會遭到扣分」，水花大小會影響分數，第一個對。","第一場比賽是從倫敦橋跳下泰晤士河，在戶外；「評分」那格寫雙人跳水配置11名評審，7名是個人賽。","跳板只是讓人「跳得更高、騰空的時間更久」，沒說分數比較高。答第一個。"],"tests":"圖文細節核對","avoid":"數字要看清楚是個人還是雙人"},{"q":"根據圖文，下列關於跳水比賽規則的敘述，何者最恰當？","opts":["毋須採計每一跳的得分，可擇優計算最後成績","選手完成一次跳水，每名評審最高只能給10分","若完成的動作比預定的難度更高，分數也會越高","選手每一跳須完成的難度係數，由現場抽籤決定"],"ans":"B","steps":["規則第一條：分數範圍是0分到10分，所以每名評審最高給10分，第二個對。","最後一條寫「每一跳的得分皆須採計」，不能擇優；動作要照比賽前繳交的動作表做，做別的動作是0分，難度也是選手自己先設定，不是抽籤。","答第二個。"],"tests":"規則條文核對","avoid":"「否則」「皆須」後面就是陷阱"},{"q":"亞當是奧運跳水個人賽選手，他在比賽時某次的動作難度係數是3.0，當他完成後，評審團給的分數表如下：\n根據圖文，亞當此次跳水得分的計算方式應是下列何者？","opts":["( 7 + 7 + 7 ) × 3.0","( 7 + 7 + 8 ) × 3.0","( 7 + 8 + 8 ) × 3.0","( 8 + 7 + 9 ) × 3.0"],"ans":"C","steps":["找規則：奧運個人賽「2個最高分與2個最低分不予採計，僅採計中間3名」，再乘難度係數。","把七個分數排好：7、7、7、8、8、9、9。去掉最高的9、9，去掉最低的7、7，剩下7、8、8。","所以是（7＋8＋8）×3.0，答第三個。"],"tests":"照規則計算分數","avoid":"先排大小，再去頭去尾"}]},{"label":"第八篇","title":"107 年會考 第 36～37 題（題組）","text":["德國由分裂到統一大事紀"],"table":[["年分","大事"],["1945","蘇聯紅軍攻陷柏林，柏林被分割為蘇聯控制的東柏林和美、英、法控制的西柏林"],["1948","紅軍封鎖西柏林，西方盟國空運物資給市民"],["1949","東西德各自建國，西柏林孤懸於東德境內"],["1952","東西德間的邊界關閉"],["1961","東西柏林間邊界和布蘭登堡門關閉，柏林圍牆開始興建"],["1963","美國總統甘迺迪訪問西柏林，發表〈我是柏林人〉演說"],["1971","美、英、法、蘇達成協議，放寬西柏林人造訪東德"],["1987","美國總統雷根訪問西柏林，要求蘇聯領袖戈巴契夫拆掉柏林圍牆"],["1989","眾多東德人11月4日在東柏林示威要求民主改革；柏林圍牆於11月9日開放，大批東德人進入西柏林，人們開始拆除外牆"],["1990","德國統一"]],"cite":"107 年國中教育會考國文科 第 36～37 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據這張圖表，下列敘述何者正確？","opts":["東、西德統一後，開始拆除柏林圍牆","東、西德從各自建國到統一超過四十年","蘇聯紅軍占領柏林後就開始興建柏林圍牆","柏林圍牆拆除後，西柏林人始能造訪東柏林"],"ans":"B","steps":["找年分那一格：1949年東西德各自建國，1990年德國統一，1990－1949＝41年，超過四十年，第二個對。","拆圍牆在1989年，比1990年統一還早；蘇聯紅軍1945年攻陷柏林，圍牆1961年才開始蓋，不是「就開始」。","1971年就已經「放寬西柏林人造訪東德」，不是等圍牆拆了才能去。答第二個。"],"tests":"年表時間核對","avoid":"相差幾年要動手算"},{"q":"根據圖表推論，右列事件發生的先後順序最可能是何者？\n甲、甘迺迪訪問西柏林\n乙、布蘭登堡門關閉\n丙、雷根當選美國總統\n丁、戈巴契夫下臺","opts":["甲→乙→丙→丁","甲→丁→乙→丙","乙→甲→丙→丁","乙→丙→甲→丁"],"ans":"C","steps":["能直接查到的先排：布蘭登堡門關閉是1961年（乙），甘迺迪訪問是1963年（甲），所以乙在甲前面。","表上沒寫年分的要推：1963年的總統是甘迺迪，1987年雷根已經是總統，所以雷根當選在1963到1987之間；1987年戈巴契夫還是蘇聯領袖，下臺一定更晚。","排起來是乙→甲→丙→丁，答第三個。"],"tests":"年表推排序","avoid":"沒寫年分的，用前後事件夾出來"}]},{"label":"第九篇","title":"112 年會考 第 32～33 題（題組）","text":["【甲】","1968年霍普創辦月球大使館公司，推出購買月球土地的服務，只要19.99美元就能買下月球上的一英畝土地。這間位於內華達州的公司宣稱握有好幾個星體的土地產權。","霍普創立公司時正值失業、離婚，一切都糟透了。當時他想，如果他有土地，狀況或許會好一點。霍普回憶：「接著我看到了月亮，我想著，那裡有好多土地啊。」","於是霍普調查《外太空條約》，發現條約僅明文禁止地球的國家主張其他星球的土地所有權，卻未規範私營公司。在當時，沒人想到會有公司這麼做。於是霍普飛奔去跑流程，而且從未有任何地球政府挑戰他販賣外太空地產的權限。","——改寫自樂羽嘉〈你真的能買下月球的土地嗎？〉","【乙】","1969年美國太空人阿姆斯壯在月球上踏出人類的第一步，在此之前的兩年，聯合國大會才通過《外太空條約》並開放各國簽署，至今已有超過100個國家簽署。條約規定必須和平進行太空探索，並造福所有國家。此條約也提到，所有的締約國都不可以主張天體的所有權，並要求締約國不可破壞他國的探測器或基地，例如不能降落在這些物體之上或附近。但這也產生了漏洞，讓國家或私人企業能以先占先贏的手段獨占有利的地點。","2016年，美國天文物理學家艾維斯在《太空政策》期刊上提到：國家或私人企業都不能主張月球土地的所有權，否則將會引發「瓜分月球」效應，在某些方面就像1880年代許多國家開始「瓜分非洲」，在剛果爭相主張礦物資源的所有權一樣。","——改寫自曼恩〈月球土地先占先贏〉"],"cite":"112 年國中教育會考國文科 第 32～33 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據甲、乙兩文，下列敘述何者最恰當？","opts":["1880年代剛果曾提出瓜分非洲礦產的主張","月球大使館公司成立時，人類尚未踏上月球","沒人能挑戰霍普販賣月球地產是因《太空政策》期刊的論文","國家需實際登陸月球後，方可成為《外太空條約》的締約國"],"ans":"B","steps":["逐字核對年分：月球大使館公司是1968年成立，人類第一次踏上月球是1969年，成立時還沒登月，第二個對。","1880年代是「許多國家」在剛果搶礦產，不是剛果提出瓜分；《太空政策》那篇是2016年，比霍普開公司晚了快五十年，不可能是原因。","條約是「開放各國簽署」，沒說要先登月才能簽。答第二個。"],"tests":"兩文年分比對","avoid":"把年分排成一條線再比"},{"q":"小貞讀過甲、乙兩文後，發現甲文中的霍普與乙文中的艾維斯對某項議題有歧見，這項議題最可能是下列何者？","opts":["太空探索是否應以和平進行為原則","國家是否可以獨占有利的登月地點","私人是否可以主張月球土地的所有權","非締約國是否可以破壞他國的探測器"],"ans":"C","steps":["先各自找重點：霍普認為條約只禁止國家、沒管私營公司，所以公司可以賣月球土地；艾維斯說「國家或私人企業都不能主張月球土地的所有權」。","兩人意見相反的那一格，就是「私人」能不能擁有月球土地。","和平探索、獨占登月地點、破壞探測器，霍普都沒有談，談不上歧見。答第三個。"],"tests":"甲乙觀點比較","avoid":"歧見要兩人都講到同一件事"}]}]}},{"week":5,"groups":[{"no":"第 1 組","title":"王藍田性急","skill":"人物形象：從言行找性格證據","steps":["❶ 圈出人物「說的話」和「做的動作」","❷ 每個動作都問：這表示他是怎樣的人？","❸ 至少找兩個證據，支持同一個性格","❹ 選項說的性格，要能在文中找到證據；別人怎麼評他，也是證據"],"demo":{"q":"「豈有終日執之，而不知其味者乎？」說這句話的顧榮是怎樣的人？","a":["先看材料：顧榮看到端烤肉的僕人很想吃，「因輟己施焉」，同桌的人笑他，他說：「豈有終日執之，而不知其味者乎？」","→ 動作證據：停下自己不吃，把烤肉給僕人","→ 說話證據：哪有整天端著烤肉，卻不知道味道的人？他替僕人著想","答：體貼下人、會替別人著想"]},"parts":[{"label":"第一篇","title":"王藍田性急","text":["王藍田性急。嘗食雞子，以箸刺之，不得，便大怒，舉以擲地。雞子於地圓轉未止，仍下地以屐齒蹍之，又不得。瞋甚，復於地取內口中，齧破即吐之。","王右軍聞而大笑曰：「使安期有此性，猶當無一豪可論，況藍田邪？」"],"cite":"《世說新語．忿狷》","notes":"王藍田：東晉人王述，封藍田侯　雞子：雞蛋　箸：筷子　擲：丟　屐齒：木頭鞋底下的齒　蹍：踩　內：同「納」，放進　齧：咬　王右軍：王羲之　安期：王藍田的父親王承　豪：同「毫」，一點點　論：稱道","trans":"王藍田脾氣很急。有一次吃雞蛋，用筷子去刺，刺不到，就大發脾氣，拿起雞蛋丟到地上。雞蛋在地上轉個不停，他又下座用木鞋底的齒去踩，又踩不到。他氣極了，又從地上撿起雞蛋放進嘴裡，咬破了就吐掉。王羲之聽說後大笑說：「就算是他父親王安期有這種脾氣，也一點都沒有值得稱道的地方，何況是王藍田呢？」","qs":[{"q":"「瞋甚」的「瞋」是什麼意思？","opts":["驚訝","高興","害怕","生氣"],"ans":"D","steps":["第1招組詞「瞋怒」，代回「氣得很厲害」→ 通","第2招看動作：前面「大怒」，後面咬破就吐，都是生氣的動作","兩種方法都指向：瞋＝生氣"],"tests":"字義：瞋","avoid":"組詞後，用前後動作再驗一次"},{"q":"王藍田是怎樣的人？哪一組證據最能支持？","opts":["很節儉：掉在地上的蛋也不浪費","很有耐心：試了好幾種方法吃蛋","脾氣急躁：刺不到就丟，踩不到就咬破吐掉","很愛吃蛋：掉到地上還要撿起來吃"],"ans":"C","steps":["第一句就說「性急」，後面刺、丟、踩、咬，每一步都帶著怒氣","他咬破蛋「即吐之」，不是想吃，也不是節儉","所以是脾氣急躁"],"tests":"人物：性格證據","avoid":"看動作背後的情緒，不只看動作"},{"q":"作者寫雞蛋「於地圓轉未止」，有什麼作用？","opts":["說明王藍田很會丟東西","雞蛋滾個不停，讓他更火大，更顯出他的急","說明地板不平","說明雞蛋很新鮮"],"ans":"B","steps":["雞蛋一直轉，他就「下地以屐齒蹍之」","踩不到又「瞋甚」，越來越氣","雞蛋轉不停，是用來襯托他越來越急"],"tests":"寫法：襯托人物","avoid":"問：這句讓人物做出什麼反應？"},{"q":"王羲之說「況藍田邪」，他怎麼看王藍田的脾氣？","opts":["這種脾氣很有趣，值得學","王藍田比他父親更了不起","這種脾氣一點都不值得稱道","王藍田吃蛋的方法很聰明"],"ans":"C","steps":["「使安期有此性，猶當無一豪可論」：就算是父親有這脾氣，也一點都不值得稱道","「況藍田邪」：何況是王藍田","所以王羲之在笑他、批評他"],"tests":"人物：旁人評價","avoid":"別人的評語，也是看人物的證據"}]},{"label":"第二篇","title":"鄧艾口吃","text":["鄧艾口吃，語稱艾艾。晉文王戲之曰：「卿云艾艾，定是幾艾？」對曰：「鳳兮鳳兮，故是一鳳。」"],"cite":"《世說新語．言語》","notes":"鄧艾：三國時魏國的將領　口吃：說話結巴　晉文王：司馬昭　卿：你　云：說　定：到底　鳳兮鳳兮：古書裡的歌詞，「鳳啊，鳳啊」","trans":"鄧艾說話結巴，說到自己時總是說「艾……艾」。晉文王跟他開玩笑說：「你說艾艾，到底是幾個艾？」鄧艾回答：「古歌唱『鳳兮鳳兮』，本來就只是一隻鳳。」","qs":[{"q":"「語稱艾艾」是什麼意思？","opts":["叫別人的名字叫兩次","說到自己時，結巴說成「艾……艾」","很喜歡講艾草","說話的聲音很大"],"ans":"B","steps":["前一句「鄧艾口吃」＝說話結巴","古人常用自己的名字稱呼自己，一結巴就變成「艾艾」","所以是說到自己時結巴"],"tests":"句意：因果","avoid":"前一句常是後一句的原因"},{"q":"晉文王問「定是幾艾」，他的用意是什麼？","opts":["生氣，要處罰鄧艾","考鄧艾的算數","真的想知道有幾個艾","開鄧艾的玩笑"],"ans":"D","steps":["文中說「晉文王戲之」","戲＝開玩笑（組詞：戲弄）","所以是在逗鄧艾"],"tests":"人物：說話用意","avoid":"說話前的動詞，透露說話的態度"},{"q":"「故是一鳳」的「故」是什麼意思？","opts":["本來","所以","故意","過世"],"ans":"A","steps":["第1招代回：「本來就是一隻鳳」→ 通","「所以是一隻鳳」前面沒有原因；「故意、過世」都不通","第2招看目的：鄧艾要說「艾艾」本來也只是一個艾"],"tests":"字義：故","avoid":"每個意思都代回去讀一次"},{"q":"從鄧艾的回答，可以看出他是怎樣的人？","opts":["很生氣，頂撞晉文王","很害羞，不敢回答","說話其實一點也不結巴","反應快、很機智"],"ans":"D","steps":["被笑結巴，他馬上用「鳳兮鳳兮」回答","古歌重複兩次，也只是一隻鳳；還順便把自己比成鳳","既回答了問題又不丟臉 → 機智"],"tests":"人物：從對話看性格","avoid":"看人物怎麼化解難題"}]},{"label":"第三篇","title":"伯牙絕弦","text":["伯牙鼓琴，鍾子期聽之。方鼓琴而志在太山，鍾子期曰：「善哉乎鼓琴，巍巍乎若太山。」少選之間，而志在流水，鍾子期又曰：「善哉乎鼓琴，湯湯乎若流水。」","鍾子期死，伯牙破琴絕弦，終身不復鼓琴，以為世無足復為鼓琴者。"],"cite":"《呂氏春秋．本味》（節選）","notes":"伯牙：春秋時善於彈琴的人　鼓：彈奏　方：正當　太山：泰山　巍巍：高大的樣子　少選：一會兒　湯湯：水勢浩大的樣子　足：值得","trans":"伯牙彈琴，鍾子期聽。伯牙正彈著琴，心裡想著泰山，鍾子期說：「彈得真好啊，高大得像泰山一樣。」過了一會兒，伯牙心裡想著流水，鍾子期又說：「彈得真好啊，浩浩蕩蕩像流水一樣。」鍾子期死後，伯牙摔破琴、扯斷琴弦，一輩子不再彈琴，認為世上再也沒有值得他彈琴給他聽的人了。","qs":[{"q":"鍾子期說「巍巍乎若太山」，他聽出了什麼？","opts":["伯牙彈琴時，心裡正想著高山","伯牙正在爬泰山","琴聲很小很細","鍾子期想去泰山玩"],"ans":"A","steps":["前一句：「方鼓琴而志在太山」","伯牙心裡想著泰山，鍾子期就說琴聲像泰山","所以他聽出了伯牙心裡想的"],"tests":"句意：對應前文","avoid":"回答前面找「志在」什麼"},{"q":"鍾子期是怎樣的人？","opts":["比伯牙更會彈琴","不管聽什麼都說好，只會稱讚","很懂音樂，聽得出伯牙心裡想的","只喜歡聽流水的曲子"],"ans":"C","steps":["伯牙想高山，他說太山；伯牙想流水，他說流水","兩次都說中，不是隨便稱讚","文中沒寫他會彈琴，也不是只喜歡流水"],"tests":"人物：兩個證據","avoid":"兩次都說中，才是真的懂"},{"q":"伯牙為什麼「破琴絕弦」？","opts":["琴壞了不能彈","他認為世上再也沒有值得彈琴給他聽的知音","鍾子期死前叫他不要再彈","他忘了怎麼彈琴"],"ans":"B","steps":["最後一句：「以為世無足復為鼓琴者」","「以為」後面就是他的想法","沒有知音了，所以不再彈"],"tests":"因果：找原因","avoid":"「以為」後面常是人物的理由"},{"q":"從「終身不復鼓琴」，可以看出伯牙是怎樣的人？","opts":["非常珍惜知音、重情義","本來就不喜歡音樂","脾氣急躁，愛摔東西","做事很容易放棄"],"ans":"A","steps":["伯牙本來很愛彈琴，鍾子期一死就一輩子不彈","他摔琴是因為失去知音，不是生氣","所以他把知音看得比彈琴還重要"],"tests":"人物：從行動看性格","avoid":"問：他為什麼願意放棄最愛的事？"}]},{"label":"第四篇","title":"床頭捉刀人","text":["魏武將見匈奴使，自以形陋，不足雄遠國，使崔季珪代，帝自捉刀立床頭。既畢，令間諜問曰：「魏王何如？」匈奴使答曰：「魏王雅望非常，然床頭捉刀人，此乃英雄也。」魏武聞之，追殺此使。"],"cite":"《世說新語．容止》","notes":"魏武：魏武帝曹操　匈奴使：匈奴派來的使者　形陋：外貌醜陋　雄遠國：讓遠方國家敬畏　崔季珪：崔琰，長得威武　捉刀：拿著刀　既畢：會面結束後　間諜：暗中探問的人　雅望：高雅的儀表","trans":"曹操要接見匈奴的使者，自己覺得相貌醜陋，不夠讓遠方的國家敬畏，就叫崔季珪代替自己，曹操自己拿著刀站在座位旁邊。會見結束後，曹操派人暗中去問使者：「魏王怎麼樣？」匈奴使者回答：「魏王的儀表高雅，非比尋常；但是座位旁邊拿刀的那個人，才是真正的英雄。」曹操聽到後，派人追去殺了這個使者。","qs":[{"q":"曹操為什麼要崔季珪代替自己見匈奴使？","opts":["他覺得自己長得不好看，不夠威風","他害怕匈奴使","他生病了","崔季珪會說匈奴話"],"ans":"A","steps":["證據：「自以形陋，不足雄遠國」","形陋＝長相醜；不足雄遠國＝不夠讓遠方國家敬畏","所以找長得威武的崔季珪代替"],"tests":"因果：找原因","avoid":"原因常在「自以為」後面"},{"q":"「帝自捉刀立床頭」的「床」，最可能是什麼？","opts":["睡覺的床","窗戶","坐的座位","書桌"],"ans":"C","steps":["第1招組詞「床鋪」代回：接見使者時站在睡床旁 → 不合場面","第2招看情節：這是正式接見外國使者，「崔季珪」坐在位子上，曹操站在旁邊","古代「床」也指坐具 → 座位（古今異義）"],"tests":"古今異義：床","avoid":"古今異義要用情節驗證"},{"q":"匈奴使說「床頭捉刀人，此乃英雄也」，表示曹操是怎樣的人？","opts":["就算站在旁邊，也藏不住英雄氣概","和匈奴使是老朋友","很怕被別人看見","長得非常英俊"],"ans":"A","steps":["曹操覺得自己「形陋」，所以不是英俊","他只是站在旁邊拿刀，使者卻看出他才是英雄","所以他的氣概藏不住"],"tests":"人物：旁人評價","avoid":"別人眼中的他，也是證據"},{"q":"曹操聽了使者的話，就「追殺此使」，最能看出曹操什麼性格？","opts":["膽小，怕匈奴打過來","心狠手辣，連看穿他的人都要除掉","小氣，捨不得送禮物","粗心，認錯了人"],"ans":"B","steps":["使者沒有做錯事，只是看出曹操才是英雄","曹操一聽到就派人追殺","代表他不願被人看穿，而且手段很狠"],"tests":"人物：從行動看性格","avoid":"動作越極端，越能看出性格"}]},{"label":"第五篇","title":"顧榮施炙","text":["顧榮在洛陽，嘗應人請，覺行炙人有欲炙之色，因輟己施焉。同坐嗤之。榮曰：「豈有終日執之，而不知其味者乎？」","後遭亂渡江，每經危急，常有一人左右己，問其所以，乃受炙人也。"],"cite":"《世說新語．德行》","notes":"顧榮：晉朝人　應人請：接受別人的邀請　行炙人：端送烤肉的僕人　炙：烤肉　施：給　同坐：同桌的人　執：拿著　遭亂：遇到戰亂　左右：在身邊幫助、保護　所以：原因","trans":"顧榮在洛陽時，有一次接受別人的宴請，發現端烤肉的僕人露出想吃烤肉的神情，就停下自己不吃，把烤肉給了他。同桌的人都笑他。顧榮說：「哪有整天端著烤肉，卻不知道烤肉是什麼味道的人呢？」後來遇到戰亂，顧榮渡江南下，每次遇到危急，總有一個人在身邊保護他。顧榮問他為什麼，原來就是當年接受烤肉的那個人。","qs":[{"q":"「因輟己施焉」的「輟」是什麼意思？","opts":["切開","加熱","吃完","停止"],"ans":"D","steps":["第1招組詞「輟學」＝停止上學，代回「停下自己不吃」→ 通","第2招看動作：他把自己的烤肉給了僕人，所以自己沒有繼續吃","兩種方法都指向：輟＝停止"],"tests":"字義：輟","avoid":"組詞代回，再用動作驗證"},{"q":"顧榮說「豈有終日執之，而不知其味者乎」，表現他什麼性格？","opts":["很愛吃，怕烤肉被搶","喜歡跟人吵架","很節儉，不浪費食物","體貼下人，會站在別人的立場想"],"ans":"D","steps":["僕人整天端烤肉，卻吃不到","顧榮覺得這樣不合理，就把自己的給他","他是替僕人著想，不是自己愛吃"],"tests":"人物：從話看性格","avoid":"人物說話時替誰著想？"},{"q":"顧榮把烤肉給僕人時，同桌的人有什麼反應？","opts":["稱讚他","生氣地離開","笑他","也跟著分肉"],"ans":"C","steps":["證據：「同坐嗤之」","嗤＝譏笑（嗤之以鼻）","顧榮接著說明理由，表示他被笑了"],"tests":"找證據","avoid":"反應就寫在動作後面那一句"},{"q":"後來為什麼常有一個人在危急時保護顧榮？","opts":["那人是顧榮花錢請的保鑣","那人就是當年得到烤肉的僕人，記得他的恩情","同桌的人後悔了來幫他","那人是顧榮的兒子"],"ans":"B","steps":["最後一句：「問其所以，乃受炙人也」","受炙人＝接受烤肉的人","前面的善行，換來後面的報答（因果）"],"tests":"因果：前因後果","avoid":"結局常常呼應開頭的事"}]}]},{"no":"第 2 組","title":"紀昌學射","skill":"敘事順序：先後、起因經過結果","steps":["❶ 圈時間詞：先、而後、既、後、旬日、三年之後、乃","❷ 把事件按先後排成一條線","❸ 分出起因（為什麼開始）、經過（發生什麼）、結果（最後怎樣）","❹ 排序題：先找「第一件事」和「最後一件事」，再排中間"],"demo":{"q":"〈薛譚學謳〉的起因、經過、結果各是什麼？","a":["先看材料：「薛譚學謳於秦青，未窮青之技，自謂盡之，遂辭歸。秦青弗止，餞於郊衢，撫節悲歌，聲振林木，響遏行雲。薛譚乃謝求反，終身不敢言歸。」","→ 起因：還沒學完，就自以為學完，要回家","→ 經過：秦青送行時唱了一首歌，聲音震動樹林、擋住行雲","答：結果在「乃」後面——薛譚道歉要求回來，一輩子不敢再說要走"]},"parts":[{"label":"第一篇","title":"紀昌學射","text":["紀昌者，又學射於飛衛。飛衛曰：「爾先學不瞬，而後可言射矣。」紀昌歸，偃臥其妻之機下，以目承牽挺。二年之後，雖錐末倒眥，而不瞬也。以告飛衛。","飛衛曰：「未也，必學視而後可。視小如大，視微如著，而後告我。」昌以氂懸虱於牖，南面而望之。旬日之間，浸大也；三年之後，如車輪焉。以睹餘物，皆丘山也。乃以燕角之弧、朔蓬之簳射之，貫虱之心，而懸不絕。以告飛衛。飛衛高蹈拊膺曰：「汝得之矣！」"],"cite":"《列子．湯問》（節選）","notes":"飛衛：古代善於射箭的人　瞬：眨眼　偃臥：仰躺　機：織布機　牽挺：織布機上下移動的踏板　錐末倒眥：錐子尖端碰到眼眶　著：明顯　氂：牛尾的長毛　虱：蝨子　牖：窗戶　燕角之弧：用燕地牛角做的弓　朔蓬之簳：用北方蓬草做的箭桿　懸：吊蝨子的毛　高蹈拊膺：高興得跳起來、拍著胸口","trans":"紀昌又向飛衛學射箭。飛衛說：「你先學會不眨眼，然後才可以談射箭。」紀昌回家，仰躺在妻子的織布機下面，用眼睛盯著上下移動的踏板。兩年以後，就算錐子尖端碰到眼眶，他也不眨眼。他把這件事告訴飛衛。飛衛說：「還不行，一定要學會看東西才可以。要把小的看成大的，把細微的看成明顯的，再來告訴我。」紀昌用牛尾毛把一隻蝨子吊在窗戶上，面向南方盯著看。十天之內，蝨子漸漸變大；三年以後，看起來像車輪一樣大。再看別的東西，都像山丘一樣大。於是他用燕地牛角做的弓、北方蓬草做的箭去射，射穿了蝨子的心，吊蝨子的毛卻沒斷。他把這件事告訴飛衛。飛衛高興得跳起來、拍著胸口說：「你學成了！」","qs":[{"q":"紀昌學射的順序，哪一個正確？","opts":["一開始就射蝨子，射中後才練眼力","先練不眨眼，再練把小東西看大，最後射蝨子","先射蝨子，再練不眨眼","先練把小東西看大，再練不眨眼，最後射蝨子"],"ans":"B","steps":["時間詞：飛衛說「先學不瞬，而後可言射」","練好不眨眼後，飛衛說「未也，必學視」","最後才「乃……射之」（乃＝於是）"],"tests":"敘事順序","avoid":"先圈「先、而後、乃」三個路標"},{"q":"練「視小如大」，紀昌看蝨子像車輪，花了多久？","opts":["三年","兩年","一年","十天"],"ans":"A","steps":["「旬日之間，浸大也」：十天只是漸漸變大","「三年之後，如車輪焉」","兩年是練不眨眼的時間，不要混在一起"],"tests":"時間詞找證據","avoid":"每個時間詞後面接的是哪件事？"},{"q":"「旬日之間，浸大也」的「浸」是什麼意思？","opts":["突然","已經","泡在水裡","漸漸"],"ans":"D","steps":["第1招組詞「浸潤」＝慢慢滲進去，代回「十天之內，漸漸變大」→ 通","第2招看前後：十天「浸大」，三年才「如車輪」，是慢慢變大","所以不是突然，也不是泡水"],"tests":"字義：浸","avoid":"前後時間比一比，看是快還是慢"},{"q":"故事的結果是什麼？","opts":["紀昌射斷了吊蝨子的毛，蝨子掉下來","紀昌覺得太累，就不學了","飛衛不滿意，要他再練三年","紀昌射穿蝨子的心，毛卻沒斷，飛衛說他學成了"],"ans":"D","steps":["最後：「貫虱之心，而懸不絕」","飛衛「高蹈拊膺曰：汝得之矣」","得之＝學成了"],"tests":"起因經過結果","avoid":"結果通常在最後一兩句"}]},{"label":"第二篇","title":"薛譚學謳","text":["薛譚學謳於秦青，未窮青之技，自謂盡之，遂辭歸。秦青弗止，餞於郊衢，撫節悲歌，聲振林木，響遏行雲。薛譚乃謝求反，終身不敢言歸。"],"cite":"《列子．湯問》（節選）","notes":"謳：唱歌　秦青：古代很會唱歌的人　自謂：自以為　辭：告別　弗：不　餞：擺酒送行　郊衢：城外的大路　撫節：打著拍子　振：震動　遏：擋住　反：同「返」，回來","trans":"薛譚向秦青學唱歌，還沒學完秦青的本領，就自以為全學會了，於是向秦青告別要回家。秦青沒有挽留他，在城外的大路上擺酒為他送行，打著拍子唱起悲傷的歌，歌聲震動了樹林，響聲擋住了天上飄動的雲。薛譚於是向秦青道歉，請求回來繼續學，一輩子都不敢再說要回家。","qs":[{"q":"薛譚為什麼要「辭歸」？","opts":["還沒學完，就以為自己全學會了","秦青把他趕走","他太想家了","他真的已經學完了"],"ans":"A","steps":["證據：「未窮青之技，自謂盡之，遂辭歸」","「遂」＝於是，前面就是原因","「未窮」＝還沒學完，所以不是真的學完"],"tests":"起因","avoid":"「遂、乃」前面常是原因"},{"q":"下列事件順序，哪一個正確？","opts":["秦青唱歌 → 自以為學完 → 告別 → 道歉求回","自以為學完 → 秦青唱歌 → 告別 → 道歉求回","自以為學完 → 告別 → 秦青送行唱歌 → 道歉求回","告別 → 自以為學完 → 道歉求回 → 秦青唱歌"],"ans":"C","steps":["第一件事：「自謂盡之」，最後一件事：「謝求反」","中間：先「辭歸」，秦青才「餞於郊衢」唱歌","把第一和最後先放好，中間就不會排錯"],"tests":"敘事順序","avoid":"先找第一件和最後一件事"},{"q":"「薛譚乃謝求反」的「謝」是什麼意思？","opts":["道歉","感謝","凋謝","拒絕"],"ans":"A","steps":["第1招組詞「謝罪」，代回「道歉，請求回來」→ 通","第2招看動作：他發現自己還差得遠，後來「終身不敢言歸」，是認錯","所以是道歉，不是感謝"],"tests":"字義：謝","avoid":"看人物前後態度，判斷是謝還是歉"},{"q":"秦青為什麼不挽留，而是送行時唱一首歌？","opts":["秦青巴不得薛譚快走","秦青自己也想回家","用真正的歌聲，讓薛譚自己發現差距","秦青太忙，沒空挽留"],"ans":"C","steps":["歌聲「聲振林木，響遏行雲」，非常厲害","薛譚聽完，馬上「謝求反」","結果證明：秦青用歌聲讓他明白自己還沒學完"],"tests":"推論：用結果推目的","avoid":"看結果，回推人物的用意"}]},{"label":"第三篇","title":"循表夜涉","text":["荊人欲襲宋，使人先表澭水。澭水暴益，荊人弗知，循表而夜涉，溺死者千有餘人，軍驚而壞都舍。","嚮其先表之時可導也，今水已變而益多矣，荊人尚猶循表而導之，此其所以敗也。"],"cite":"《呂氏春秋．察今》（節選）","notes":"荊：楚國　襲：偷襲　澭水：河名　暴益：突然上漲　涉：渡水　溺：淹　壞都舍：（驚叫聲）像大房子倒塌一樣　嚮：從前　導：引導過河　尚猶：還","trans":"楚國人想偷襲宋國，派人先在澭水中做好標記。後來澭水突然上漲，楚國人不知道，還照著標記在夜裡渡河，淹死了一千多人，軍隊驚慌的叫聲像大房子倒塌一樣。從前他們做標記的時候，是可以照著過河的；現在水已經變了、漲高了，楚國人還照著原來的標記過河，這就是他們失敗的原因。","qs":[{"q":"「使人先表澭水」的「表」是什麼意思？","opts":["表演","做標記","手錶","表面"],"ans":"B","steps":["第1招：「表」平常是名詞（標記），放在「使人先＿澭水」的動作位置，代回「派人先在澭水做標記」→ 通","第2招看動作：後面「循表而夜涉」＝照著記號渡河","所以「表」在這裡當動作：做標記"],"tests":"詞類活用：表","avoid":"名詞放在動作的位置，要當動作讀"},{"q":"下列事件順序，哪一個正確？","opts":["河水暴漲 → 先做標記 → 照標記夜渡 → 淹死千餘人","先做標記 → 照標記夜渡 → 河水暴漲 → 淹死千餘人","照標記夜渡 → 先做標記 → 河水暴漲 → 淹死千餘人","先做標記 → 河水暴漲 → 照舊標記夜渡 → 淹死千餘人"],"ans":"D","steps":["時間詞「先表」：做標記是第一件事","「澭水暴益，荊人弗知」：水漲在渡河之前","所以他們渡河時，標記已經不準了"],"tests":"敘事順序","avoid":"「先」字就是第一件事的路標"},{"q":"作者認為楚軍失敗的原因是什麼？","opts":["宋軍太強大","做標記的人故意做錯","晚上太黑看不見","水已經變了，還照原來的標記過河"],"ans":"D","steps":["最後一句：「今水已變而益多矣，荊人尚猶循表而導之，此其所以敗也」","「此其所以敗也」前面就是原因","做標記時本來是對的（嚮其先表之時可導也），不是故意做錯"],"tests":"因果：失敗原因","avoid":"「所以敗」前面就是答案"},{"q":"這個故事告訴我們什麼？","opts":["情況改變了，做法也要跟著改變","晚上絕對不可以過河","打仗一定要偷襲","做標記一點用都沒有"],"ans":"A","steps":["標記在水還沒漲時是有用的","水變了，楚人卻不改","道理：要看現在的情況調整做法"],"tests":"寓言道理","avoid":"道理常在作者最後的評語裡"}]},{"label":"第四篇","title":"引嬰投江","text":["有過於江上者，見人方引嬰兒而欲投之江中，嬰兒啼。人問其故，曰：「此其父善游。」","其父雖善游，其子豈遽善游哉？以此任物，亦必悖矣。"],"cite":"《呂氏春秋．察今》（節選）","notes":"過：經過　方：正在　引：拉、牽　投：丟　啼：哭　善游：很會游泳　任物：處理事情　悖：荒謬、錯誤","trans":"有個從江邊經過的人，看見一個人正拉著一個小孩，想把他丟進江裡，小孩大哭。經過的人問他原因，那人說：「這孩子的父親很會游泳。」父親雖然很會游泳，他的孩子難道就立刻會游泳嗎？用這種方法處理事情，一定是荒謬的。","qs":[{"q":"那人說「此其父善游」，是在回答什麼問題？","opts":["他為什麼經過江邊","為什麼要把小孩丟進江裡","小孩為什麼哭","他自己是誰"],"ans":"B","steps":["前一句：「人問其故」，問的是原因","什麼事的原因？前面寫他「欲投之江中」","所以他是在解釋為什麼要丟小孩"],"tests":"起因：對話對應","avoid":"答話前先看「問」的是哪件事"},{"q":"「其子豈遽善游哉」的「遽」是什麼意思？","opts":["害怕","急忙地跑","就、立刻","也是"],"ans":"C","steps":["第1招組詞「急遽」＝很快，代回「他的孩子難道就立刻會游泳嗎」→ 通","第2招看作者的意思：父親會，不代表孩子馬上會","所以遽＝就、立刻"],"tests":"字義：遽","avoid":"組詞後代回整句"},{"q":"這篇文章的寫作順序是什麼？","opts":["先寫作者評論，再寫看到的事","先寫看到的事，再寫問答，最後是作者的評論","只有作者的評論，沒有故事","先寫問答，再寫看到的事"],"ans":"B","steps":["第一段：看見有人要丟小孩 → 問原因 → 回答","第二段：「其父雖善游……亦必悖矣」是作者自己的話","所以是故事在前，評論在後"],"tests":"文章順序","avoid":"分出「故事」和「作者的話」"},{"q":"作者想說的道理是什麼？","opts":["小孩不可以靠近江邊","每個人都要學游泳","不能用不相干的理由來判斷事情","父親會游泳，孩子一定也會"],"ans":"C","steps":["父親善游和孩子會不會游，沒有必然關係","作者說「以此任物，亦必悖矣」","所以道理是：理由不相干，判斷就會錯"],"tests":"寓言道理","avoid":"問：他的理由真的說得通嗎？"}]},{"label":"第五篇","title":"澄子亡緇衣","text":["宋有澄子者，亡緇衣，求之塗。見婦人衣緇衣，援而弗舍，欲取其衣，曰：「今者我亡緇衣。」","婦人曰：「公雖亡緇衣，此實吾所自為也。」澄子曰：「子不如速與我衣。昔吾所亡者，紡緇也；今子之衣，禪緇也。以禪緇當紡緇，子豈不得哉？」"],"cite":"《呂氏春秋．淫辭》（節選）","notes":"澄子：人名　緇衣：黑色的衣服　塗：同「途」，路上　援：拉住　舍：同「捨」，放開　公：您　子：您　紡緇：有裡子的黑衣　禪緇：單層的黑衣　當：抵　得：得到好處","trans":"宋國有個叫澄子的人，丟了一件黑衣服，到路上去找。看見一個婦人穿著黑衣服，就拉住她不放，想拿走她的衣服，說：「剛才我丟了一件黑衣服。」婦人說：「您雖然丟了黑衣服，但這件確實是我自己做的。」澄子說：「你不如趕快把衣服給我。我以前丟的，是有裡子的黑衣；現在你穿的，是單層的黑衣。拿單層的黑衣抵有裡子的黑衣，你難道不是占了便宜嗎？」","qs":[{"q":"「亡緇衣」的「亡」是什麼意思？","opts":["逃走","沒有","遺失","死亡"],"ans":"C","steps":["第1招組詞「亡失」，代回「丟了黑衣服」→ 通","第2招看動作：後面「求之塗」，到路上去找，表示是弄丟了","所以亡＝遺失"],"tests":"一字多義：亡","avoid":"看後面的動作，選最合的意思"},{"q":"下列事件順序，哪一個正確？","opts":["上街找 → 丟了黑衣 → 說她占便宜 → 拉住婦人","丟了黑衣 → 上街找 → 拉住穿黑衣的婦人 → 說她占了便宜","拉住婦人 → 丟了黑衣 → 上街找 → 說她占便宜","丟了黑衣 → 說她占便宜 → 上街找 → 拉住婦人"],"ans":"B","steps":["第一件事：「亡緇衣」","接著「求之塗」，看見婦人就「援而弗舍」","最後才說「子豈不得哉」"],"tests":"敘事順序","avoid":"先找第一件和最後一件事"},{"q":"婦人說「此實吾所自為也」，意思是什麼？","opts":["這件衣服是我買的","這件衣服是我撿到的","這件衣服是我替你做的","這件衣服其實是我自己做的"],"ans":"D","steps":["「自為」＝自己做","「實」＝確實、其實","婦人在說明衣服是她的，不是澄子丟的"],"tests":"句意","avoid":"把句子拆成小詞逐一翻"},{"q":"澄子是怎樣的人？","opts":["蠻橫不講理，搶別人的東西還說對方占便宜","很大方，願意用好衣服換","很誠實，只想找回自己的衣服","很小心，先查清楚才行動"],"ans":"A","steps":["證據一：只因為顏色一樣，就「援而弗舍」","證據二：明知不是他的，還說「子豈不得哉」","兩個證據合起來：蠻橫又強詞奪理"],"tests":"人物：兩個證據","avoid":"說得好聽，也要看他做了什麼"}]}]},{"no":"第 3 組","title":"孫權勸學","skill":"詞類活用：名詞、形容詞當動詞","steps":["❶ 先認出這個字平常是「東西」（名詞）還是「樣子」（形容詞）","❷ 看位置：後面接「之」或名詞、前面有「而、不、欲」，常要當動作讀","❸ 第1招組詞代回；不通，就用第2招：看人物在做什麼、想達成什麼","❹ 兩種方法指向同一個答案，才算確定"],"demo":{"q":"「其里之醜人見而美之」的「美」怎麼讀？","a":["先看材料：「其里之醜人見而美之，歸亦捧心而顰其里。」","→ 第1招：「美」平常是形容詞；後面接「之」，代回「美麗她」讀不通","→ 第2招：醜女人回家也學皺眉，表示她「覺得」西施皺眉很美","答：形容詞當動詞，「認為她美」"]},"parts":[{"label":"第一篇","title":"孫權勸學","text":["初，權謂呂蒙曰：「卿今當塗掌事，不可不學！」蒙辭以軍中多務。權曰：「孤豈欲卿治經為博士邪！但當涉獵，見往事耳。卿言多務，孰若孤？孤常讀書，自以為大有所益。」蒙乃始就學。","及魯肅過尋陽，與蒙論議，大驚曰：「卿今者才略，非復吳下阿蒙！」蒙曰：「士別三日，即更刮目相待，大兄何見事之晚乎！」肅遂拜蒙母，結友而別。"],"cite":"《資治通鑑．漢紀》（節選）","notes":"權：孫權　呂蒙：孫權手下的大將　卿：你　當塗：當權　辭：推辭　務：事務　孤：古代君王自稱　治經：研究經書　涉獵：大略地閱讀　孰若：哪裡比得上　就學：開始讀書　及：等到　魯肅：孫權手下的大臣　尋陽：地名　才略：才能和謀略　更：重新　大兄：對朋友的尊稱","trans":"當初，孫權對呂蒙說：「你現在當權掌管大事，不可以不學習！」呂蒙用軍中事務太多來推辭。孫權說：「我難道是要你研究經書，當個教經書的博士嗎？只是要你大略地讀書，了解過去的歷史罷了。你說事務多，哪裡比得上我？我常常讀書，自己覺得很有收穫。」呂蒙於是開始讀書。等到魯肅經過尋陽，和呂蒙討論事情，非常驚訝地說：「你現在的才能和謀略，已經不再是從前吳地那個呂蒙了！」呂蒙說：「讀書人分別三天，就要重新另眼看待，大哥怎麼這麼晚才看出來呢！」魯肅於是拜見呂蒙的母親，和呂蒙結為朋友後才告別。","qs":[{"q":"「卿今當塗掌事」的「掌」是什麼意思？","opts":["鼓掌","手掌","用巴掌打","掌管"],"ans":"D","steps":["第1招組詞「掌管」，代回「你現在當權掌管大事」→ 通","第2招看位置和目的：「掌」後面接「事」，是動作；孫權要他讀書，正因為他管大事","兩種方法都指向：掌＝掌管"],"tests":"字義：掌","avoid":"組詞代回，再看前後驗證"},{"q":"下列「」中的字，哪一個是名詞當動詞用？","opts":["「孤常讀書」的「讀」","「方北面而持其駕」的「面」","「蒙乃始就學」的「學」","「結友而別」的「友」"],"ans":"B","steps":["「讀」「學」本來就是動作，不算活用；「結友」的「友」還是朋友，是名詞","「面」平常是名詞「臉」，「北面」代回「北邊的臉」不通","看情節：他往北走去楚國，「面」當動詞＝面向"],"tests":"詞類活用：判斷","avoid":"先問：這個字平常是不是動詞？"},{"q":"「孤豈欲卿治經為博士邪」的「博士」，是什麼意思？","opts":["古代教授經書的官","很博學的醫生","讀完大學最高學位的人","很會打仗的將軍"],"ans":"A","steps":["第1招代回現代意思「最高學位」→ 古代沒有這種學位，不合","第2招看孫權的目的：他說「但當涉獵，見往事耳」，不要呂蒙專門研究經書","所以博士＝專門研究、教授經書的官（古今異義）"],"tests":"古今異義：博士","avoid":"古今異義字，一定用情節驗證"},{"q":"魯肅說「非復吳下阿蒙」，意思是什麼？","opts":["你不再是孫權的部下了","你的才能已經不是從前那個呂蒙了","你已經不住在吳地了","你的名字改了"],"ans":"B","steps":["前一句：「卿今者才略」，說的是才能","「非復」＝不再是；「吳下阿蒙」＝從前在吳地的呂蒙","合起來：你的才能進步，不是以前的你了"],"tests":"句意：前後對應","avoid":"看前面在說什麼，再翻後面"}]},{"label":"第二篇","title":"賣油翁","text":["陳康肅公善射，當世無雙，公亦以此自矜。嘗射於家圃，有賣油翁釋擔而立，睨之，久而不去。見其發矢十中八九，但微頷之。","康肅問曰：「汝亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾。」康肅忿然曰：「爾安敢輕吾射！」翁曰：「以我酌油知之。」乃取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝之，自錢孔入，而錢不溼。因曰：「我亦無他，惟手熟爾。」康肅笑而遣之。"],"cite":"歐陽修〈賣油翁〉（節選）","notes":"陳康肅公：北宋的陳堯咨　當世無雙：當時沒有人比得上　圃：園子　釋：放下　睨：斜著眼看　去：離開　矢：箭　但：只　手熟爾：手法熟練罷了　忿然：生氣的樣子　安：怎麼　酌：倒　覆：蓋住　徐：慢慢地　杓：杓子　瀝：滴下　遣：讓他走","trans":"陳康肅公擅長射箭，當時沒有人比得上，他也因此自誇。有一次他在自家園子裡射箭，有個賣油的老人放下擔子站著，斜著眼看他，很久都不離開。老人看他射出的箭十支中了八九支，只是微微點點頭。康肅問：「你也懂射箭嗎？我射箭的技術不是很高明嗎？」老人說：「沒什麼，只不過是手法熟練罷了。」康肅生氣地說：「你怎麼敢看不起我的射箭本領！」老人說：「憑我倒油的經驗就知道這個道理。」於是拿出一個葫蘆放在地上，用一枚銅錢蓋住葫蘆口，慢慢地用杓子舀油倒下去，油從錢孔流進去，銅錢卻沒有沾溼。老人接著說：「我也沒什麼，只是手法熟練罷了。」康肅笑著讓他走了。","qs":[{"q":"「但微頷之」的「頷」是什麼意思？","opts":["點頭","搖頭","下巴","含在嘴裡"],"ans":"A","steps":["第1招：「頷」平常是名詞「下巴」，代回「只是微微下巴他」讀不通","第2招看動作：老人看他十中八九，只「微微」表示一點認可","下巴往下動＝點頭，名詞當動詞"],"tests":"詞類活用：頷","avoid":"名詞代回不通，就想它的動作"},{"q":"「爾安敢輕吾射」的「輕」是什麼意思？","opts":["看不起","很輕鬆","輕輕地","重量很輕"],"ans":"A","steps":["第1招組詞「輕視」，代回「你怎麼敢輕視我的射箭」→ 通","第2招看情緒：康肅「忿然」，因為老人說他只是手熟，覺得被看低","形容詞「輕」當動詞：看輕、看不起"],"tests":"詞類活用：輕","avoid":"形容詞後面接東西，常要當動作"},{"q":"「公亦以此自矜」的「矜」是什麼意思？","opts":["謹慎","可憐","自誇、驕傲","害羞"],"ans":"C","steps":["第1招組詞「驕矜」，代回「他也因此自己驕傲」→ 通","第2招看動作：他後來問「吾射不亦精乎」，想聽人稱讚","所以矜＝自誇"],"tests":"字義：矜","avoid":"用人物後面的話來驗證"},{"q":"這篇文章想說的道理是什麼？","opts":["有本事的人都很驕傲","再厲害的本事，也是靠反覆練習而熟練","賣油翁比陳康肅更會射箭","射箭比倒油難多了"],"ans":"B","steps":["賣油翁兩次說「無他，但手熟爾」「惟手熟爾」","倒油和射箭，都是練熟了就能做到","文中沒說賣油翁會射箭，也沒說誰比較難"],"tests":"主旨","avoid":"重複出現的話，常常就是主旨"}]},{"label":"第三篇","title":"蜀之鄙有二僧","text":["蜀之鄙有二僧，其一貧，其一富。貧者語於富者曰：「吾欲之南海，何如？」富者曰：「子何恃而往？」曰：「吾一瓶一缽足矣。」富者曰：「吾數年來欲買舟而下，猶未能也。子何恃而往！」","越明年，貧者自南海還，以告富者，富者有
