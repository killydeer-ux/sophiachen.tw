,"ans":"B","steps":["代回「替文惠君宰牛」→ 通","「成為文惠君解牛」讀不通","「為＋人＋動作」＝替某人做"],"tests":"一字多義：為","avoid":"「為＋人＋動作」先代「替」"},{"q":"「莫不中音」是什麼意思？","opts":["完全沒有聲音","聲音都很大","聲音都不合音律","沒有一個聲音不合乎音律"],"ans":"D","steps":["莫＝沒有，不＝不","雙重否定＝肯定","沒有不合音律＝全部都合音律"],"tests":"雙重否定","avoid":"兩個否定相遇，意思變肯定"},{"q":"「莫不中音」的「中」是什麼意思？","opts":["中間","中國","中午","符合、合乎"],"ans":"D","steps":["後面接「音」：音律","代回「符合音律」→ 通","下一句「乃中經首之會」的中也是符合"],"tests":"一字多義：中","avoid":"同一段出現兩次，意思常一樣"},{"q":"這段文字表現出庖丁怎樣的本領？","opts":["力氣非常大","解牛技術純熟，動作和聲音像樂舞一樣有節奏","一邊工作一邊唱歌","很怕文惠君"],"ans":"B","steps":["證據一：手肩足膝配合，進刀「莫不中音」","證據二：「合於桑林之舞」","推出：技術熟練到像在跳舞奏樂"],"tests":"推論人物","avoid":"把描寫的句子合起來想"}]},{"label":"第三篇","title":"莊周夢蝶","text":["昔者莊周夢為胡蝶，栩栩然胡蝶也，自喻適志與！不知周也。俄然覺，則蘧蘧然周也。不知周之夢為胡蝶與，胡蝶之夢為周與？周與胡蝶，則必有分矣。此之謂物化。"],"cite":"《莊子．齊物論》","notes":"莊周：莊子　胡蝶：蝴蝶　栩栩然：輕快飛舞的樣子　喻：同「愉」，快樂　適志：心情舒暢　與：語氣詞　蘧蘧然：清醒的樣子　分：分別　物化：萬物互相轉化","trans":"從前莊周夢見自己變成蝴蝶，輕快地飛舞，真是一隻蝴蝶，自己覺得快樂舒暢啊！不知道自己是莊周了。不久醒過來，發現自己清清楚楚就是莊周。不知道是莊周夢見自己變成蝴蝶呢，還是蝴蝶夢見自己變成莊周呢？莊周和蝴蝶，一定是有分別的。這就叫做「物化」。","qs":[{"q":"「俄然覺」的「覺」是什麼意思？","opts":["睡醒","感覺","覺得","覺悟"],"ans":"A","steps":["前面在說做夢","代回「不久就睡醒了」→ 通","古代「覺」常是睡醒，和現在的覺得不同"],"tests":"古今異義：覺","avoid":"前面在做夢，「覺」就是醒來"},{"q":"「俄然覺」的「俄然」是什麼意思？","opts":["俄國","很慢地","不久、一會兒","生氣地"],"ans":"C","steps":["夢裡飛舞了一陣子，接著醒來","代回「不久就醒了」→ 通","詞語「俄頃」也是一會兒"],"tests":"字義：俄然","avoid":"用表示時間的意思代回"},{"q":"「不知周也」是在說什麼？","opts":["莊周不認識朋友","醒來後忘記做過夢","夢中變成蝴蝶時，忘了自己是莊周","蝴蝶害怕莊周"],"ans":"C","steps":["前面：夢為胡蝶，很快樂","補主詞：誰不知道？夢中的蝴蝶（莊周）","所以是忘了自己是莊周"],"tests":"補主詞","avoid":"先問「誰不知道」，往前找"},{"q":"莊周醒來後，產生了什麼疑問？","opts":["是莊周夢見變成蝴蝶，還是蝴蝶夢見變成莊周","蝴蝶為什麼會飛","人為什麼會做夢","明天還會不會夢到"],"ans":"A","steps":["找問句：「不知周之夢為胡蝶與，胡蝶之夢為周與？」","兩個「夢為」，一個是莊周，一個是蝴蝶","其他選項文中都沒問"],"tests":"找證據句","avoid":"問句的答案就在「與？」那一句"}]},{"label":"第四篇","title":"北人食菱","text":["北人生而不識菱者，仕於南方。席上食菱，並殼入口。或曰：「食菱須去殼。」其人自護其短，曰：「我非不知，並殼者，欲以清熱也。」問者曰：「北土亦有此物否？」答曰：「前山後山，何地不有！」夫菱角生於水中而曰土產，此坐強不知以為知也。"],"cite":"江盈科《雪濤小說》","notes":"菱：菱角，長在水中的植物果實　仕：做官　並：連同　護其短：掩飾自己的缺點　清熱：消除體內的熱氣　北土：北方","trans":"有個北方人，生來不認識菱角，在南方做官，在酒席上吃菱角，連殼一起放進嘴裡。有人說：「吃菱角要去掉殼。」那個人想掩飾自己的缺點，說：「我不是不知道，連殼一起吃，是想要清熱。」問的人說：「北方也有這種東西嗎？」他回答：「前山後山，哪裡沒有！」菱角長在水中，他卻說是長在土裡，這是因為他硬把不知道的當作知道啊。","qs":[{"q":"「或曰」的「或」是什麼意思？","opts":["或者","或許","他自己","有人"],"ans":"D","steps":["代回「有人說：吃菱角要去殼」→ 通","後面「其人」才是北方人自己","句首「或曰」＝有人說"],"tests":"字義：或","avoid":"句首的「或曰」通常是「有人說」"},{"q":"「食菱須去殼」的「去」，和「因攫其金而去」的「去」意思一樣嗎？","opts":["一樣，都是離開","不一樣：這裡是除去，齊人那篇是離開","一樣，都是前往","不一樣：這裡是前往，齊人那篇是除去"],"ans":"B","steps":["「去殼」：後面接東西 → 除去殼","「攫其金而去」：搶完就走 → 離開","同一個字，意思不同"],"tests":"一字多義：去","avoid":"看「去」後面有沒有接東西"},{"q":"「前山後山，何地不有？」是什麼意思？","opts":["哪裡都沒有","哪裡沒有呢？到處都有","只有前山後山才有","他不知道哪裡有"],"ans":"B","steps":["「何地不有」＝哪個地方沒有呢？","反問句＝肯定：到處都有","他想假裝很懂"],"tests":"反問句","avoid":"反問句要倒過來讀成肯定"},{"q":"這個故事諷刺哪一種人？","opts":["喜歡吃菱角的人","到南方做官的人","愛問問題的人","不懂裝懂、硬要掩飾缺點的人"],"ans":"D","steps":["證據一：「自護其短」","證據二：最後一句「強不知以為知」","所以諷刺不懂裝懂的人"],"tests":"寓言主旨","avoid":"作者的評語常在最後一句"}]},{"label":"第五篇","title":"折箭","text":["阿豺有子二十人，緯代，長子也。阿豺又謂曰：「汝等各奉吾一支箭，折之地下。」俄而命母弟慕利延曰：「汝取一支箭折之。」慕利延折之。又曰：「汝取十九支箭折之。」延不能折。阿豺曰：「汝曹知否？單者易折，眾則難摧，戮力一心，然後社稷可固。」"],"cite":"《魏書．吐谷渾傳》（節選）","notes":"阿豺：吐谷渾國的國王　緯代：阿豺的長子　奉：拿　母弟：同一個母親生的弟弟　慕利延：阿豺的弟弟　汝曹：你們　戮力：合力　社稷：國家","trans":"阿豺有二十個兒子，緯代是長子。阿豺又對兒子們說：「你們每人拿我一支箭，折斷後丟在地上。」過了一會兒，又命令同母的弟弟慕利延說：「你拿一支箭把它折斷。」慕利延折斷了。阿豺又說：「你拿十九支箭把它們折斷。」慕利延折不斷。阿豺說：「你們明白嗎？單獨一支容易折斷，很多支合在一起就難以折斷。大家同心合力，國家才能穩固。」","qs":[{"q":"「延不能折」，折不斷箭的是誰？","opts":["阿豺","緯代","慕利延","阿豺的二十個兒子"],"ans":"C","steps":["往前找：「又曰：『汝取十九支箭折之。』」是對慕利延說的","「延」就是慕利延名字的簡稱","所以折不斷十九支箭的是慕利延"],"tests":"補主詞","avoid":"名字被縮短時，往前找全名"},{"q":"「俄而命母弟慕利延曰」的「俄而」是什麼意思？","opts":["不久、一會兒","俄國人","很生氣地","從前"],"ans":"A","steps":["前面：兒子們剛折完箭，接著又叫弟弟來","代回「過了一會兒，又命令弟弟」→ 通","和〈莊周夢蝶〉「俄然覺」的俄一樣＝不久"],"tests":"字義：俄而","avoid":"「俄」開頭，先想「一會兒」"},{"q":"「單者易折，眾則難摧」的「摧」是什麼意思？","opts":["催促","推開","眾多","折斷"],"ans":"D","steps":["前後兩句相對：單者對眾，易對難","「易折」對「難摧」，摧和折意思相近","代回「很多支就難折斷」→ 通，所以「摧」＝折斷"],"tests":"字義：對句推字","avoid":"兩句相對，對應的字意思常相近"},{"q":"阿豺用折箭想告訴大家什麼？","opts":["箭要一支一支地用","大家同心合力，國家才能穩固","弟弟的力氣比兒子小","長子最重要，要聽長子的話"],"ans":"B","steps":["證據一：一支箭一折就斷，十九支合起來折不斷","證據二：阿豺的結論「戮力一心，然後社稷可固」","推出：團結力量大，國家才能穩固"],"tests":"主旨","avoid":"人物最後說的話，常是主旨"}]}]}],"teach":[{"intro":"複習週第一關：補主詞、虛詞、推論，三招一起用。","items":[{"t":"補主詞怎麼補？","d":["文言常把主詞省掉，看到動作就問「誰做的？」，往前找最近的人。","「好一一聽之」→ 前一句「湣王立」→ 是湣王喜歡一個一個聽。"],"ex":"就像播報員只說「切入、上籃」，你要知道是哪個球員。"},{"t":"虛詞「而、故、乃、之」","d":["而：然後／卻　故：所以　乃：於是、才　之：他、它，放在地方前面是「往」。","「宣王說之」的「之」＝南郭處士。"]},{"t":"推論：證據＋證據＝結論","d":["宣王時三百人一起吹，湣王改成一個一個聽，處士就逃。","兩件事合起來推出：他其實不會吹竽。"],"ex":"就像柴犬看到你拿牽繩就轉圈，你推得出牠想出門。"}],"demo":["「好一一聽之，處士逃。」","補主詞：誰好一一聽之？前句「湣王立」→ 湣王","推論：一個一個吹會露餡 → 處士其實不會吹"]},{"intro":"複習週第二關：一個字有很多意思，古今意思也不同，用「代回去」來判斷。","items":[{"t":"一字多義","d":["同一個字，換了句子意思就不同。","「而」：順著是「然後」，相反是「卻」。「鄭人買其櫝而還其珠」→ 買了匣子卻還珍珠 → 卻。"],"ex":"就像「傳」：傳球、傳話，看後面接什麼。"},{"t":"古今異義","d":["古代和現在寫法一樣，意思卻不同。","「飾以玫瑰」的玫瑰＝美玉，不是花；「炎帝之少女」＝小女兒。"]},{"t":"選項代回","d":["把每個選項放回原句讀一次，讀得通、又和前後文對得上的才選。"]}],"demo":["「飾以玫瑰」的「玫瑰」","代「花」→ 前後是珠玉、翡翠，花放不進去","代「美玉」→ 都是貴重材料 → 通"]},{"intro":"複習週第三關：讀白話長文，靠證據、段落重點和絕對字三招。","items":[{"t":"白話找證據","d":["選項的每一個說法，都要在文章找到同一句。","「柴犬每年大量換毛一到兩次」→ 第三段找得到 → 有證據。"]},{"t":"段落重點","d":["每段讀完寫一句話；重點常在第一句，或「但是」「所以」後面。","〈柴犬好養嗎〉第二段：「不過」後面＝很有主見，要用獎勵慢慢教。"],"ex":"就像看比賽精華，每一節挑一球最關鍵的。"},{"t":"絕對字","d":["都、一定、永遠、從來、完全、所有、每個。","文章說「可能」「不一定」，選項卻說「一定」→ 排除。"]}],"demo":["選項：「柴犬從來不聽主人的話」","圈絕對字：「從來」","文章說「不一定願意乖乖聽話」→ 沒那麼滿 → 排除"]},{"intro":"複習週第四關：互文對讀，一篇《論語》配一篇白話，比一比。","items":[{"t":"比較表四格","d":["甲說什麼｜乙說什麼｜相同｜不同。","甲「學而不思則罔」＝只練不想；乙「只是一直投，不去想」＝同一件事 → 連線。"],"ex":"就像比賽前比兩隊數據，一項一項對。"},{"t":"題目怎麼對應？","d":["問「兩篇都」「共同」→ 看相同。","問「只有甲」「甲有乙沒有」→ 看不同。"]}],"demo":["乙：「只坐在場邊看影片、研究姿勢，卻從來不下場練」","看影片研究＝思；不下場＝不學","對應甲：「思而不學則殆」"]},{"intro":"複習週第五關：圖表五步驟，再加上文字和圖表互相核對。","items":[{"t":"圖表五步驟","d":["標題→單位→趨勢→最大最小→回圖找數字。","閱讀時間表：單位是分鐘，最多是週四 25 分鐘。"]},{"t":"圖文對讀","d":["把文字說法一句一句拿去對圖表。","日記說「週四讀最久」→ 圖表能證明；「因為沒有練球」→ 圖表沒有這個資料，不能證明。"],"ex":"就像裁判看重播：看得到的才算數。"}],"demo":["題目：五天總共讀幾分鐘？","15＋20＋10＋25＋20＝90","換順序檢查：35＋35＋20＝90 → 90 分鐘"]},{"intro":"小六上關卡：前四週學過的招式全部一起用。","items":[{"t":"這學期學了哪些招？","d":["補主詞、虛詞、成語反推、選項代回、白話找證據、圖表五步驟、互文對讀、一字多義、推論、段落重點、寓言三問、古今異義、對話題、因果連鎖、圖文對讀。"]},{"t":"同一個字，不同意思","d":["「之」：「衣冠而之市」＝往；「吏捕得之」＝他。","「去」：「攫其金而去」＝離開；「食菱須去殼」＝除去。"],"ex":"就像「傳」：傳球、傳話，同一個字，用法不同。"},{"t":"名詞當動詞","d":["「衣冠而之市」的衣冠，是穿衣戴帽的動作。","看到「而」連接，兩邊常常都是動作。"]}],"demo":["「取金之時，不見人，徒見金。」","徒＝只（家徒四壁）","寓言三問：被貪心蒙住眼睛，只看見想要的東西"]}],"daily":[{"words":[["使","讓、派","使人吹竽"],["好","喜歡","好一一聽之"]],"line":"好一一聽之，處士逃。"},{"words":[["鬻","賣","未可謂善鬻珠也"],["飾","裝飾","飾以玫瑰"]],"line":"鄭人買其櫝而還其珠。"},{"words":[["欲","想要","欲罷不能"],["徒","只","家徒四壁"]],"line":"取金之時，不見人，徒見金。"},{"words":[["罔","迷惘","學而不思則罔"],["殆","危險、疑惑","思而不學則殆"]],"line":"學而不思則罔，思而不學則殆。"},{"words":[["攫","搶","攫取"],["吏","官員","官吏"]],"line":"溫故而知新，可以為師矣。"},null],"quiz":{"words":[["使","讓、派","齊宣王使人吹竽"],["好","喜歡","好一一聽之"],["鬻","賣","未可謂善鬻珠也"],["飾","裝飾","飾以玫瑰"],["欲","想要","昔齊人有欲金者"],["徒","只","不見人，徒見金"],["罔","迷惘","學而不思則罔"],["殆","危險、疑惑","思而不學則殆"],["攫","搶","因攫其金而去"],["吏","官員","吏捕得之"]],"lines":[["好一一聽之，","處士逃。"],["鄭人買其櫝","而還其珠。"],["取金之時，不見人，","徒見金。"],["學而不思則罔，","思而不學則殆。"],["溫故而知新，","可以為師矣。"]],"parts":[{"label":"第一篇","title":"東施效顰","text":["西施病心而顰其里，其里之醜人見而美之，歸亦捧心而顰其里。其里之富人見之，堅閉門而不出；貧人見之，挈妻子而去之走。彼知顰美，而不知顰之所以美。"],"cite":"《莊子．天運》（節選）","notes":"西施：春秋時越國的美女　顰：皺眉頭　里：鄉里　捧心：用手按著胸口　堅：緊緊地　挈：帶領　彼：她，指那個醜女人","trans":"西施心口疼痛，在鄉里中皺著眉頭。鄉里中一個醜女人看見了，覺得她很美，回家後也按著胸口，在鄉里中皺眉頭。鄉里的有錢人看見她，緊緊關上大門不出來；窮人看見她，帶著妻子和兒女離開她，逃得遠遠的。那個醜女人只知道皺眉的樣子美，卻不知道皺眉為什麼美。","qs":[{"q":"「西施病心」的「病心」是什麼意思？","opts":["擔心","心口疼痛","心地不好","傷心"],"ans":"B","steps":["後面「捧心」：用手按著胸口","按胸口是因為心口痛","所以「病心」＝心口疼痛"],"tests":"字義：病","avoid":"用後文的動作反推前文"},{"q":"「其里之醜人見而美之」的「美之」是什麼意思？","opts":["讓她變美","美麗的地方","讚美自己","覺得她很美"],"ans":"D","steps":["醜女人看見西施皺眉","後面她回家模仿，表示她覺得西施皺眉很美","所以「美之」＝認為她美"],"tests":"詞性：美當動詞","avoid":"形容詞後面接「之」，常當動作讀"},{"q":"「挈妻子而去之走」的「妻子」是什麼意思？","opts":["太太","女兒","鄰居","妻子和兒女"],"ans":"D","steps":["窮人看到醜女人，要帶著全家逃走","古代「妻子」是兩個詞：妻＋子（兒女）","現代的「妻子」只指太太，古今不同"],"tests":"古今異義：妻子","avoid":"古文兩個字常常是兩個詞"},{"q":"「去之走」的「走」是什麼意思？","opts":["走路","跑、逃","散步","走漏"],"ans":"B","steps":["窮人被嚇到，要遠遠離開","古代「走」＝跑（兔走觸株）","代回「離開她逃跑」→ 通"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"這個故事告訴我們什麼？","opts":["只模仿外表，不明白美的原因，反而弄巧成拙","西施很美","窮人很膽小","生病要趕快看醫生"],"ans":"A","steps":["最後一句：「彼知顰美，而不知顰之所以美」","醜女人只學皺眉，大家都被嚇跑","道理：盲目模仿反而更糟"],"tests":"寓言主旨","avoid":"作者的評語常在最後一句"}]},{"label":"第二篇","title":"五十步笑百步","text":["孟子對曰：「王好戰，請以戰喻。填然鼓之，兵刃既接，棄甲曳兵而走。或百步而後止，或五十步而後止。以五十步笑百步，則何如？」曰：「不可，直不百步耳，是亦走也。」"],"cite":"《孟子．梁惠王上》（節選）","notes":"王：梁惠王　喻：比喻　填然：咚咚的鼓聲　鼓：擊鼓進軍　兵刃：兵器　接：交鋒　甲：鎧甲　曳：拖著　兵：兵器　耳：罷了","trans":"孟子回答說：「大王喜歡打仗，請讓我用打仗來比喻。咚咚地擊鼓進軍，雙方兵器已經交鋒，有士兵就丟下鎧甲、拖著兵器逃跑。有的人跑了一百步才停下，有的人跑了五十步才停下。跑五十步的人嘲笑跑一百步的人，那怎麼樣呢？」梁惠王說：「不可以，只不過沒有跑到一百步罷了，這也是逃跑啊。」","qs":[{"q":"「王好戰」的「好」是什麼意思？","opts":["好的","很","喜歡","完成"],"ans":"C","steps":["代回「大王喜歡打仗」→ 通","後面「請以戰喻」：所以用打仗來比喻","和「好一一聽之」的好一樣＝喜歡"],"tests":"字義：好","avoid":"「好」在動作前，先代「喜歡」"},{"q":"「棄甲曳兵而走」的「走」是什麼意思？","opts":["走路","散步","逃跑","走運"],"ans":"C","steps":["丟下鎧甲、拖著兵器，是打敗了","代回「丟盔棄甲逃跑」→ 通","古代「走」＝跑"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"「或百步而後止」的「或」是什麼意思？","opts":["有的人","迷惑","或許","一定"],"ans":"A","steps":["前面說的是很多逃跑的士兵","「或……或……」＝有的人……有的人……","代回「有的人跑了百步才停」→ 通"],"tests":"字義：或","avoid":"「或」在句首，常是「有人」"},{"q":"「直不百步耳」的「直」是什麼意思？","opts":["筆直","直接","正直","只是、只不過"],"ans":"D","steps":["後面有「耳」＝罷了","代回「只不過沒跑到一百步罷了」→ 通","「直……耳」＝只是……罷了"],"tests":"虛詞「直」","avoid":"「直」和「耳」常一起出現"},{"q":"「以五十步笑百步」比喻什麼？","opts":["跑得快的人比較厲害","自己也有同樣的缺點，只是輕一點，卻去嘲笑別人","打仗一定要勇敢","五十步比一百步好"],"ans":"B","steps":["梁惠王自己的結論：「是亦走也」","跑五十步也是逃跑，和跑百步本質一樣","所以比喻：同樣有錯，卻笑別人"],"tests":"推論比喻","avoid":"看人物最後的結論"}]}]}}];
const DATES = {1:["11/16","11/22"],2:["11/23","11/29"],3:["11/30","12/6"],4:["12/7","12/13"]};

const API = "https://script.google.com/macros/s/AKfycbzL5oYEDrC8Y9OK6NrbMcNqeVs5_ZjrdKlWBa93n-R4cQ6YAHs70e_mj0LbaajFl5It/exec";
let CLOUD = { pw:{}, role:{}, status:"" };
let syncTimer = null;
function summary(n){
  const keep = S.current; S.current = n; const p = me();
  const sm = { stamps:0, money:0, paid:0 };
  DATA.forEach((d) => { const st = wk(d.week); sm["w"+d.week] = st.quiz ? st.quiz.first : "";
    sm.stamps += Object.values(st.groups).filter((g) => g.done).length;
    if (rewarded()) { const m = weekMoney(d.week); sm.money += m; if (p.paid && p.paid[d.week]) sm.paid += m; } });
  S.current = keep; return sm;
}
async function api(body){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
function setStatus(t){ CLOUD.status = t; const el = document.getElementById("cloud"); if (el) el.textContent = t; }
function cloudSave(){
  const n = S.current; if (!API.startsWith("https") || !n || !CLOUD.pw[n]) return;
  clearTimeout(syncTimer); setStatus("雲端存檔中…");

function beep(kind){
  if (MUTE) return;

    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();

}

  api({ action:"board", name:S.current, pw:CLOUD.pw[S.current] }).then((r) => {
    if (!r.ok) return el.querySelector("#lb-msg").textContent = "讀不到排行榜。";
    const rows = r.board.map((b) => ({ name:b.name, s:(b.weeks[w] || {}).stamps || 0, q:(b.weeks[w] || {}).quiz, t:b.total || 0 }))
      .sort((a, b) => b.s - a.s || ((b.q ?? -1) - (a.q ?? -1)) || b.t - a.t);
    if (!rows.length) return el.querySelector("#lb-msg").textContent = "還沒有人開始，搶第一個蓋章吧！";
    const tb = el.querySelector("tbody");
    rows.forEach((x, i) => { const mine = x.name === S.current;
      tb.append($(`<tr style="${mine ? "font-weight:700;color:var(--ball)" : ""}"><td>${i + 1}</td><td>${esc(x.name)}${mine ? "（你）" : ""}</td><td>${x.s}／6</td><td>${x.q == null ? "未考" : x.q + " 分"}</td><td>${x.t}</td></tr>`)); });
    el.querySelector("#lb").hidden = false;
    const me_ = rows.findIndex((x) => x.name === S.current);
    let msg = "大家一起加油！";
    if (me_ === 0) msg = "你是本週第一名，守住它！";
    else if (me_ > 0) { const gap = rows[me_ - 1].s - rows[me_].s; msg = gap > 0 ? `再蓋 ${gap} 枚章就追上 ${rows[me_ - 1].name}！` : `跟 ${rows[me_ - 1].name} 同樣 ${rows[me_].s} 枚，週考分數決勝負！`; }
    el.querySelector("#lb-msg").textContent = msg;
  }).catch(() => { el.querySelector("#lb-msg").textContent = "連不上雲端，等一下再看。"; });
  return el;
}

function weekMoney(w){
  const st = wk(w), q = st.quiz; let m = 0;
  if (q) m = q.reward || 0;
  const all = DATA[w-1].groups.every((g, i) => st.groups[i] && st.groups[i].done);
  return m + (all ? 50 : 0);
}

function teachEl(t, open){
  const el = $(`<details class="teach" ${open ? "open" : ""}><summary>技巧教學（先讀懂，再去練）</summary><p>${esc(t.intro)}</p></details>`);
  t.items.forEach((it) => el.append($(`<div class="item"><b>${esc(it.t)}</b>${it.d.map((d) => `<div>${esc(d)}</div>`).join("")}${it.ex ? `<div class="ex">打個比方：${esc(it.ex)}</div>` : ""}</div>`)));
  if (t.demo) el.append($(`<div class="card"><b>看我做一次</b>${t.demo.map((d) => `<div>${esc(d)}</div>`).join("")}</div>`));
  return el;
}

function passageEl(p, n){
  const el = $(`<div class="passage"><h3>第 ${n} 篇　${esc(p.title)}</h3></div>`);
  if (p.data) {
    const per = p.per || 1, head = p.chartHead || ["項目","數值"], mx = Math.max(...p.data.map((d) => d[1]));
    el.append($(`<div class="chart"><table><thead><tr><th>${esc(head[0])}</th><th>${esc(head[1])}</th><th></th></tr></thead><tbody>${p.data.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v}</td><td><span class="bar" style="width:${Math.round(v/mx*100)}%"></span></td></tr>`).join("")}</tbody></table></div>`));
    (p.text || []).filter(Boolean).forEach((t) => el.append($(`<div class="text" style="font-family:var(--f-body);font-size:1rem">${esc(t)}</div>`)));
  } else {
    el.append($(`<div class="text">${p.text.map(esc).join("<br>")}</div>`));
  }
  el.append($(`<div class="cite">${esc(p.cite)}</div>`));
  if (p.notes) el.append($(`<div class="notes">小注釋：${esc(p.notes)}</div>`));
  return el;
}

// 選擇題：items = [{q, key}]；state.ans[key] = 選的字母
function mcqEl(q, k, state, no){
  const el = $(`<div class="q"><div class="qt">${no}. ${esc(q.q)}</div><div class="opts"></div></div>`);
  const graded = state.graded, chosen = state.ans[k], locked = !!state.locked[k];
  q.opts.forEach((o, i) => {
    const b = $(`<button class="opt" aria-pressed="${chosen === L[i]}">(${L[i]}) ${esc(o)}</button>`);
    if (locked) { b.disabled = true; if (L[i] === q.ans) b.classList.add("right"); else if (chosen === L[i]) b.classList.add("wrong"); }
    b.onclick = () => { if (locked) return; beep("tap"); state.ans[k] = L[i]; el.querySelectorAll(".opt").forEach((x, j) => x.setAttribute("aria-pressed", j === i)); };
    el.querySelector(".opts").append(b);
  });
  if (graded && state.locked[k] && state.ans[k] !== q.ans) {
    el.append($(`<div class="why"><b>正確答案 (${q.ans})</b><ol>${(q.steps||[]).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>${q.avoid ? `<div>下次：${esc(q.avoid)}</div>` : ""}</div>`));
  }
  return el;
}

let G = null; // 目前作答狀態
function renderGroup(app){
  const {week:w, gi} = view, B = DATA[w-1], g = B.groups[gi], st = wk(w);
  if (!G || G.id !== `${w}-${gi}`) G = {id:`${w}-${gi}`, ans:{}, locked:{}, graded:false, round:0};
  const back = $(`<button class="back">← 回任務板</button>`); back.onclick = () => { G = null; view = {name:"home", week:w}; render(); };
  app.append(back);
  app.append($(`<div><h2>${esc(g.no)}｜${esc(g.skill)}</h2><div class="muted small">5 篇 20 題。全部按完再交卷；錯的會告訴你為什麼，改到全對就能蓋章。</div></div>`));
  app.append(teachEl(B.teach[gi], !(st.groups[gi] && st.groups[gi].first != null)));
  app.append($(`<div class="card"><b>技巧卡</b>${g.steps.map((s) => `<div>${esc(s)}</div>`).join("")}${g.demo ? `<div style="margin-top:6px"><b>示範：</b>${esc(g.demo.q)}</div>${g.demo.a.map((a) => `<div class="small">${esc(a)}</div>`).join("")}` : ""}</div>`));
  const items = [];
  let n = 1;
  g.parts.forEach((p, pi) => { const sec = $(`<div class="panel passage"></div>`); sec.append(passageEl(p, pi+1));
    p.qs.forEach((q, qi) => { const k = `${pi}-${qi}`; items.push([q,k]); sec.append(mcqEl(q, k, G, n++)); }); app.append(sec); });
  const done = items.filter(([q,k]) => G.locked[k]).length;
  if (G.graded) {
    const right = items.filter(([q,k]) => G.ans[k] === q.ans).length;
    const r = $(`<div class="result pop"><div>這一輪</div><div class="big">${right}／20</div><div>${right === 20 ? "全對！蓋一枚柴犬章。" : "看完解析，按「錯的再做一次」，改到全對。"}</div>${right === 20 ? `<div class="bigstamp">${SHIBA}</div>` : ""}</div>`);
    app.append(r);
    if (right === 20 && B.daily[gi]) { const m = B.daily[gi]; app.append($(`<div class="memo"><b>今日背誦目標（明天早上抽背）</b>${m.words.map((x) => `<div>□ ${esc(x[0])}＝${esc(x[1])}（${esc(x[2])}）</div>`).join("")}<div>□ 名句：${esc(m.line)}</div></div>`)); }
  }
  const act = $(`<div class="actions"></div>`);
  if (!G.graded) {
    const sub = $(`<button class="btn">交卷</button>`);
    sub.onclick = () => {
      const left = items.filter(([q,k]) => !G.ans[k]).length;
      if (left && !sub.dataset.warn) { sub.dataset.warn = 1; sub.textContent = `還有 ${left} 題沒選，再按一次交卷`; return; }
      items.forEach(([q,k]) => { G.locked[k] = true; });
      G.graded = true;
      const right = items.filter(([q,k]) => G.ans[k] === q.ans).length;
      const rec = st.groups[gi] = st.groups[gi] || {};
      if (rec.first == null) rec.first = right;
      if (right === 20) { rec.done = true; beep("stamp"); } else beep(right >= 15 ? "ok" : "no");
      save(); render();
    };
    act.append(sub);
  } else {
    const right = items.filter(([q,k]) => G.ans[k] === q.ans).length;
    if (right < 20) { const again = $(`<button class="btn alt">錯的再做一次</button>`);
      again.onclick = () => { items.forEach(([q,k]) => { if (G.ans[k] !== q.ans) { delete G.ans[k]; G.locked[k] = false; } }); G.graded = false; render(); }; act.append(again); }
    else { const home = $(`<button class="btn alt">回任務板</button>`); home.onclick = () => { G = null; view = {name:"home", week:w}; render(); }; act.append(home); }
  }
  app.append(act);
}

const norm = (s) => String(s||"").replace(/[\s，。？！、；：「」『』,.?!;:]/g, "");
let Q = null;
function quizSet(w){
  const B = DATA[w-1], pool = [...new Set(DATA.flatMap((d) => d.quiz.words.map((x) => x[1])))];
  return B.quiz.words.map((x, i) => {
    const others = pool.filter((m) => m !== x[1]);
    const pick = []; for (let j = 0; pick.length < 3; j++) { const m = others[(i*7 + j*5 + w*3) % others.length]; if (!pick.includes(m)) pick.push(m); }
    const pos = (i + w) % 4, opts = [...pick]; opts.splice(pos, 0, x[1]);
    return {q:`「${x[0]}」在「${x[2]}」裡是什麼意思？`, opts, ans:L[pos], steps:[`「${x[0]}」＝${x[1]}`, `例句：${x[2]}`], avoid:"把它加進明天早上的抽背"};
  });
}
function renderQuiz(app){
  const w = view.week, B = DATA[w-1], st = wk(w);
  if (!Q || Q.id !== w) Q = {id:w, ans:{}, locked:{}, fill:{}, graded:false, started:false};
  const back = $(`<button class="back">← 回任務板</button>`); back.onclick = () => { Q = null; view = {name:"home", week:w}; render(); };
  app.append(back);
  app.append($(`<div><h2>第 ${w} 週週考${w === 4 ? "（小六上關卡考）" : ""}</h2><div class="muted small">字義每題 3 分、名句每題 4 分、技巧題每題 5 分，共 100 分。第一次交卷的分數就是本週成績。</div></div>`));
  if (!Q.started && !st.quiz) {
    const s = $(`<div class="panel"><h3>開考前</h3><p>誠實作答，才找得到真正的弱點。不要翻講義、不要問別人。<br>${rewarded() ? `本週目標：<b>${st.goal ? st.goal + " 元" : "還沒設定"}</b>` : ""}</p><div class="actions" style="position:static"><button class="btn">開始考試</button></div></div>`);
    s.querySelector("button").onclick = () => { Q.started = true; render(); };
    app.append(s); return;
  }
  const W1 = quizSet(w), items = [];
  const s1 = $(`<div class="panel"><h3>一、字義（每題 3 分）</h3></div>`);
  W1.forEach((q, i) => { const k = `w${i}`; items.push([q,k,3]); s1.append(mcqEl(q, k, Q, i+1)); }); app.append(s1);
  const s2 = $(`<div class="panel"><h3>二、名句接寫（每題 4 分）：打出後半句</h3></div>`);
  B.quiz.lines.forEach(([a,b], i) => { const k = `l${i}`;
    const row = $(`<div class="q"><div class="qt">${i+1}. ${esc(a)}＿＿＿＿</div><input class="fill" id="fill-${w}-${i}" autocomplete="off" value="${esc(Q.fill[k] || "")}"></div>`);
    const inp = row.querySelector("input");
    if (Q.locked[k]) { const ok = norm(Q.fill[k]) === norm(b); inp.classList.add(ok ? "right" : "wrong"); inp.disabled = true; if (!ok) row.append($(`<div class="why">正確：${esc(a + b)}</div>`)); }
    inp.oninput = () => { Q.fill[k] = inp.value; };
    s2.append(row); });
  app.append(s2);
  let n = 1; const s3h = $(`<div><h3>三、新篇章技巧題（每題 5 分）</h3></div>`); app.append(s3h);
  B.quiz.parts.forEach((p, pi) => { const sec = $(`<div class="panel passage"></div>`); sec.append(passageEl(p, pi+1));
    p.qs.forEach((q, qi) => { const k = `p${pi}-${qi}`; items.push([q,k,5]); sec.append(mcqEl(q, k, Q, n++)); }); app.append(sec); });
  const score = () => items.reduce((s,[q,k,pt]) => s + (Q.ans[k] === q.ans ? pt : 0), 0) + B.quiz.lines.reduce((s,[a,b],i) => s + (norm(Q.fill[`l${i}`]) === norm(b) ? 4 : 0), 0);
  const act = $(`<div class="actions"></div>`);
  if (Q.graded) {
    const now = score(), q = st.quiz;
    const all = B.groups.every((g, i) => st.groups[i] && st.groups[i].done);
    const total = weekMoney(w);
    app.append($(`<div class="result pop"><div>${esc(S.current)}｜第 ${w} 週週考</div><div class="big">${q.first} 分</div>
      <div>這一輪：${now} 分${q.retake ? "（重考過 80 分）" : ""}</div>
      ${rewarded() ? `<div>週考獎金 ${q.reward} 元＋全勤 ${all ? 50 : 0} 元＝<b>本週 ${total} 元</b></div>
      <div>本週目標 ${st.goal ? st.goal + " 元" : "未設定"}：${st.goal ? (total >= st.goal ? "達成！" : "還差 " + (st.goal - total) + " 元") : ""}</div>` : `<div>本週柴犬章 ${B.groups.filter((g, i) => st.groups[i] && st.groups[i].done).length}／6</div>`}
      <div class="small muted">截圖這張卡給媽媽看。</div></div>`));
    if (now < 100) { const again = $(`<button class="btn alt">錯的再考一次</button>`);
      again.onclick = () => { items.forEach(([qq,k]) => { if (Q.ans[k] !== qq.ans) { delete Q.ans[k]; Q.locked[k] = false; } });
        B.quiz.lines.forEach(([a,b],i) => { const k = `l${i}`; if (norm(Q.fill[k]) !== norm(b)) { Q.fill[k] = ""; Q.locked[k] = false; } }); Q.graded = false; render(); }; act.append(again); }
  } else {
    const sub = $(`<button class="btn">交卷</button>`);
    sub.onclick = () => {
      items.forEach(([q,k]) => { Q.locked[k] = true; }); B.quiz.lines.forEach((x,i) => { Q.locked[`l${i}`] = true; });
      Q.graded = true; const sc = score();
      if (!st.quiz) st.quiz = {first:sc, reward:reward(sc), retake:false};
      else if (st.quiz.first < 80 && sc >= 80 && !st.quiz.retake) { st.quiz.retake = true; st.quiz.reward = 50; }
      beep(sc === 100 ? "win" : sc >= 80 ? "ok" : "no"); save(); render();
    };
    act.append(sub);
  }
  app.append(act);
}
render();
</script>

</body>
</html>
