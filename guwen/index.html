過得很困窘。」魯國人說：「為什麼？」那人說：「鞋子是用來穿的，可是越國人光著腳走路；白絹是用來做帽子戴的，可是越國人披散著頭髮。憑你們的長處，到用不上它的國家去，想要不困窘，做得到嗎？」","qs":[{"q":"「魯人身善織屨」的「善」是什麼意思？","opts":["善良","擅長","改善","友善"],"ans":"B","steps":["代回「魯人自己很善良地編鞋」→ 怪","代回「魯人擅長編鞋」→ 通","後文「子之所長」也說這是長處 → 答 B"],"tests":"一字多義：善","avoid":"善放在動作前，常是「擅長」"},{"q":"「或謂之曰」的「或」是什麼意思？","opts":["有人","或者","或許","魯人的妻子"],"ans":"A","steps":["句首「或謂」「或曰」＝有人對他說、有人說","代回「有人對他說」→ 通","D 偷換主詞，文中沒說是妻子 → 答 A"],"tests":"文言「或」＝有人","avoid":"句首的或，先試「有人」"},{"q":"「以子之所長」的「長」是什麼意思？","opts":["長大","長度","擅長的本事，長處","首領"],"ans":"C","steps":["代回「憑你的長處」→ 通","長處就是前面說的編鞋、織絹","D 代回「憑你的首領」不通 → 答 C"],"tests":"一字多義：長","avoid":"同一個字，換一篇意思就可能變"},{"q":"說話的人認為魯人會「窮」，理由是？","opts":["越國太遠走不到","魯人的手藝不好","越國人沒有錢","越人光腳又披髮，用不到他們做的鞋和帽子"],"ans":"D","steps":["證據：「而越人跣行」「而越人被髮」","鞋和帽子在越國用不上","B 相反（文中說善）；A、C 文中沒說 → 答 D"],"tests":"找人物的理由","avoid":"理由要直接在文中找句子"}]},{"label":"第五篇","title":"穿井得一人","text":["宋之丁氏，家無井而出溉汲，常一人居外。及其家穿井，告人曰：「吾穿井得一人。」有聞而傳之者，曰：「丁氏穿井得一人。」國人道之，聞之於宋君。宋君令人問之於丁氏。丁氏對曰：「得一人之使，非得一人於井中也。」求聞之若此，不若無聞也。"],"cite":"《呂氏春秋．察傳》","notes":"溉汲：打水澆田　居外：待在外面（打水）　穿井：挖井　國人：住在都城的人　宋君：宋國的國君","trans":"宋國有一戶姓丁的人家，家裡沒有井，要到外面打水澆田，常常需要一個人一直待在外面。等到他家挖了井，他告訴別人說：「我挖井得到一個人。」有人聽到就傳出去說：「丁家挖井挖到一個人。」都城裡的人都在說這件事，一直傳到宋國國君那裡。宋君派人去問丁家，丁家回答：「是多得到一個人可以使喚，不是在井裡挖到一個人。」像這樣去聽傳言，還不如不聽。","qs":[{"q":"「國人道之」的「道」是什麼意思？","opts":["說，談論","道路","道理","方法"],"ans":"A","steps":["代回「都城的人都在說這件事」→ 通","後面「聞之於宋君」：消息一路傳到國君","所以道＝說 → 答 A"],"tests":"一字多義：道","avoid":"道後面接「之」時，常是「說」"},{"q":"丁氏說「吾穿井得一人」，真正的意思是？","opts":["在井裡挖到一個人","有人掉進井裡","家裡省下一個人力，可以做別的事","請到一個挖井工人"],"ans":"C","steps":["前文：「常一人居外」，要一個人在外打水","有了井，就不用派人在外面","丁氏自己說「得一人之使，非得一人於井中也」→ 答 C"],"tests":"句意理解","avoid":"用文中人物自己的解釋來確認"},{"q":"「得一人之使」的「使」是什麼意思？","opts":["使者","假使","讓，叫","可以使喚的人力"],"ans":"D","steps":["前文：本來要一個人在外打水","代回「得到一個可以使喚的人力」→ 通","「使者」是出使的人，不合 → 答 D"],"tests":"一字多義：使","avoid":"代回後看和前文是否接得上"},{"q":"最後一句「求聞之若此，不若無聞也」想說什麼？","opts":["聽到傳言要查證，否則還不如沒聽到","挖井很辛苦","宋君很關心百姓","不要跟鄰居說話"],"ans":"A","steps":["傳言一路變成「井中挖到人」","宋君派人查證才知道真相","作者結論：這樣聽傳言不如不聽 → 答 A"],"tests":"找作者結論","avoid":"最後一句常是作者的看法"}]}]},{"no":"第 3 組","title":"自相矛盾","skill":"推論：從證據推出結論","steps":["❶ 先找文章明確寫出的事實","❷ 把兩個事實放在一起想：會推出什麼？","❸ 選項要「從證據一定推得出來」，不能是自己腦補的"],"demo":{"q":"「於物無不陷也」是什麼意思？","a":["無＝沒有，不＝不能","「沒有東西不能刺穿」","答：什麼東西都刺得穿"]},"parts":[{"label":"第一篇","title":"自相矛盾","text":["楚人有鬻盾與矛者，譽之曰：「吾盾之堅，莫能陷也。」又譽其矛曰：「吾矛之利，於物無不陷也。」或曰：「以子之矛，陷子之盾，何如？」其人弗能應也。"],"cite":"《韓非子．難一》（節選）","notes":"鬻：賣　譽：誇讚　莫：沒有　陷：刺穿　利：鋒利　子：你　弗：不","trans":"楚國有個賣盾和矛的人，誇他的盾說：「我的盾很堅固，沒有東西能刺穿它。」又誇他的矛說：「我的矛很鋒利，什麼東西都刺得穿。」有人問：「用你的矛，刺你的盾，會怎樣呢？」那個人回答不出來。","qs":[{"q":"「或曰」的「或」是什麼意思？","opts":["或者","有人","或許","他自己"],"ans":"B","steps":["代回「或者說」「或許說」→ 不知道誰說，不通","代回「有人說」→ 通","後面「以子之矛」是在問賣東西的人，所以說話的是別人"],"tests":"文言「或」＝有人","avoid":"句首的「或曰」通常是「有人說」"},{"q":"那個人為什麼「弗能應」？","opts":["他聽不懂問題","不管怎麼回答，都會和自己說過的話衝突","他想趕快賣東西","問的人太兇"],"ans":"B","steps":["事實一：盾什麼都擋得住","事實二：矛什麼都刺得穿","兩件事不可能同時成立 → 怎麼答都錯"],"tests":"把兩個事實放一起推論","avoid":"推論題先把相關的句子都找出來"},{"q":"下列哪個推論有證據？","opts":["楚國人都愛說謊","他的盾其實最堅固","他誇獎商品時把話說得太滿","最後他把矛和盾都賣掉了"],"ans":"C","steps":["A：絕對字「都」，文中只講一個人","B、D：文中沒有這些資料","C：「莫能陷」「無不陷」都是把話說滿"],"tests":"推論和腦補的分別","avoid":"推論要有證據，文中沒有的不能選"},{"q":"「其人弗能應也」的「其人」指誰？","opts":["問問題的人","楚王","買盾的人","賣矛和盾的楚國人"],"ans":"D","steps":["「或曰」是有人在問賣東西的人","回答不出來的，是被問的那個人","被問的是賣矛和盾的楚國人 → 答 D"],"tests":"補主詞","avoid":"誰被問，誰就要回答"}]},{"label":"第二篇","title":"晏子使楚","text":["晏子至，楚王賜晏子酒。酒酣，吏二縛一人詣王。王曰：「縛者曷為者也？」對曰：「齊人也，坐盜。」王視晏子曰：「齊人固善盜乎？」晏子避席對曰：「嬰聞之，橘生淮南則為橘，生于淮北則為枳，葉徒相似，其實味不同。所以然者何？水土異也。今民生長於齊不盜，入楚則盜，得無楚之水土使民善盜耶？」王笑曰：「聖人非所與熙也，寡人反取病焉。」"],"cite":"《晏子春秋．內篇雜下》（節選）","notes":"晏子：齊國的大臣晏嬰　酣：喝得正高興　吏：小官　詣：到……那裡　曷為：做什麼　坐：犯了……罪　固：本來　避席：離開座位，表示鄭重　枳：一種果實又酸又苦的樹　徒：只是　得無……耶：該不會是……吧　熙：同「嬉」，開玩笑　寡人：國君自稱","trans":"晏子到了楚國，楚王請晏子喝酒。喝得正高興時，兩個小官綁著一個人來見楚王。楚王問：「綁著的是什麼人？」小官回答：「是齊國人，犯了偷竊罪。」楚王看著晏子說：「齊國人本來就很會偷東西嗎？」晏子離開座位回答：「我聽說，橘樹長在淮河以南就是橘，長在淮河以北就變成枳，只是葉子相像，果實的味道卻不一樣。為什麼會這樣呢？因為水土不同。現在這個人在齊國長大時不偷東西，到了楚國就偷，該不會是楚國的水土讓人變得很會偷吧？」楚王笑著說：「聖人是不能隨便開玩笑的，我反而自討沒趣了。」","qs":[{"q":"「其實味不同」的「實」是什麼意思？","opts":["其實，事實上","果實","實在","誠實"],"ans":"B","steps":["前一句「葉徒相似」在講葉子","後面講「味」，吃的是果實","其實＝它的果實（古今異義）→ 答 B"],"tests":"古今異義：其實","avoid":"看前後在比什麼東西"},{"q":"楚王讓小官綁一個齊國人上來，最可能的目的是？","opts":["讓晏子難堪，暗示齊國人愛偷東西","請晏子幫忙審案","表示歡迎晏子","把犯人交給晏子帶回齊國"],"ans":"A","steps":["證據一：「王視晏子曰：齊人固善盜乎？」","證據二：最後楚王說「寡人反取病焉」","本來想讓晏子難堪，反被反擊 → 答 A"],"tests":"從證據推目的","avoid":"用結尾回頭推人物的動機"},{"q":"晏子用橘和枳來比，想推出什麼結論？","opts":["齊國的橘子比較好吃","淮北的水土比較好","這個人變成小偷，是楚國的環境造成的","齊國人本來就愛偷"],"ans":"C","steps":["橘變枳，因為「水土異也」","「生長於齊不盜，入楚則盜」","推出：是楚國的水土讓人變成小偷；D 是楚王的說法 → 答 C"],"tests":"比喻推論","avoid":"比喻的兩邊要一一對上"},{"q":"「寡人反取病焉」，可以推知楚王當時的心情？","opts":["很生氣，想處罰晏子","覺得晏子在說謊","想羞辱別人反而讓自己難堪，只好笑著認輸","非常感謝晏子"],"ans":"C","steps":["證據：「王笑曰」","「反取病」＝反而讓自己難堪","笑著自嘲，是認輸；A、B、D 沒有證據 → 答 C"],"tests":"推人物心情","avoid":"心情要從動作和說的話推"}]},{"label":"第三篇","title":"不死之藥","text":["有獻不死之藥於荊王者，謁者操之以入。中射之士問曰：「可食乎？」曰：「可。」因奪而食之。王大怒，使人殺中射之士。中射之士使人說王曰：「臣問謁者曰可食，臣故食之，是臣無罪，而罪在謁者也。且客獻不死之藥，臣食之而王殺臣，是死藥也，是客欺王也。夫殺無罪之臣，而明人之欺王也，不如釋臣。」王乃不殺。"],"cite":"《韓非子．說林上》","notes":"荊王：楚王　謁者：負責通報的官員　操：拿著　中射之士：宮中的侍衛官　說：勸說　客：指獻藥的人　明：讓大家知道　釋：放了","trans":"有人向楚王獻上不死之藥，通報的官員拿著藥走進宮。宮中的侍衛官問：「可以吃嗎？」官員說：「可以。」侍衛官就搶過來吃了。楚王大怒，派人要殺侍衛官。侍衛官託人勸楚王說：「我問通報官，他說可以吃，所以我才吃，可見我沒有罪，罪在通報官。而且客人獻的是不死之藥，我吃了，大王卻殺了我，那就是死藥，等於是客人欺騙了大王。殺掉沒有罪的我，又讓大家知道大王被騙了，不如放了我。」楚王就沒有殺他。","qs":[{"q":"「臣故食之」的「故」是什麼意思？","opts":["所以","故意","原因","從前"],"ans":"A","steps":["前一句：「臣問謁者曰可食」","因為問過、說可以吃 → 所以才吃","侍衛要說明自己無罪，不會說「故意」→ 答 A"],"tests":"虛詞：故＝所以","avoid":"前因後果之間的故，常是所以"},{"q":"侍衛說「是死藥也」，他的推論是？","opts":["藥本來就有毒","侍衛自己會被毒死","吃了不死之藥還會被殺，就證明它不是不死之藥","大王本來就不想吃藥"],"ans":"C","steps":["事實一：客人說這是不死之藥","事實二：吃了還會被大王殺死","兩件事放一起：那就是「死藥」→ 答 C"],"tests":"兩個事實推結論","avoid":"把相關的兩句放在一起想"},{"q":"侍衛認為大王殺了他，會造成什麼結果？","opts":["讓大家知道大王被獻藥的人騙了","證明藥真的有效","大王會長生不老","謁者會升官"],"ans":"A","steps":["證據：「夫殺無罪之臣，而明人之欺王也」","明＝讓大家知道","殺他＝公開大王被騙 → 答 A"],"tests":"找證據句","avoid":"推論題先找最直接的那一句"},{"q":"根據全文，可以推知侍衛是個怎樣的人？","opts":["膽小怕事","做事從來不犯錯","從不違反規定","機智，很會講道理"],"ans":"D","steps":["他用兩層道理說服楚王，最後「王乃不殺」","B、C 錯：他搶了大王的藥","A 錯：他敢搶藥又敢辯解 → 答 D"],"tests":"推人物個性","avoid":"個性要用人物做的事來證明"}]},{"label":"第四篇","title":"宋人資章甫","text":["宋人資章甫而適諸越，越人斷髮文身，無所用之。"],"cite":"《莊子．逍遙遊》（節選）","notes":"資：帶著貨物去賣　章甫：古代一種禮帽　諸：之於　斷髮：剪短頭髮　文身：在身上刺花紋","trans":"宋國有人帶著禮帽到越國去賣，可是越國人剪短頭髮、身上刺著花紋，根本用不到禮帽。","qs":[{"q":"「適諸越」的「適」是什麼意思？","opts":["適合","舒適","往，到","恰好"],"ans":"C","steps":["代回「宋人帶著帽子適合越國」→ 不通","代回「宋人帶著帽子到越國」→ 通","後面寫的都是越國的情形 → 答 C"],"tests":"字義：適＝往","avoid":"適後面接地名，常是「往」"},{"q":"「無所用之」的「之」指什麼？","opts":["章甫（禮帽）","越國人","宋國人","頭髮"],"ans":"A","steps":["之＝它，往前找被「用」的東西","宋人帶去的是章甫","越國人用不到的是禮帽 → 答 A"],"tests":"代詞「之」指什麼","avoid":"先問：用不到的是什麼東西"},{"q":"從「越人斷髮文身」可以推出什麼？","opts":["越國人不需要戴禮帽","越國人很兇","越國人很窮","越國人討厭宋國人"],"ans":"A","steps":["事實：越人剪短頭髮，沒有束髮戴帽的習慣","結果：「無所用之」","只能推到不需要禮帽；B、C、D 沒有證據 → 答 A"],"tests":"推論和腦補","avoid":"文中沒有的形容詞不能選"},{"q":"下列哪個情況，和宋人的遭遇最像？","opts":["在雨季賣雨傘","在學校門口賣文具","在球場旁賣運動飲料","到從來不下雨的沙漠村莊賣雨傘"],"ans":"D","steps":["宋人：把東西帶到用不到的地方","D 同樣是對方用不到","A、B、C 都是需要的地方 → 答 D"],"tests":"類比推論","avoid":"找和故事「結構一樣」的情況"}]},{"label":"第五篇","title":"郢書燕說","text":["郢人有遺燕相國書者，夜書，火不明，因謂持燭者曰：「舉燭。」云而過書「舉燭」。舉燭，非書意也。燕相受書而說之，曰：「舉燭者，尚明也；尚明也者，舉賢而任之。」"],"cite":"《韓非子．外儲說左上》（節選）","notes":"郢：楚國的都城　遺：送給，音ㄨㄟˋ　相國：宰相　燭：蠟燭　云：說　過：錯誤地　尚明：崇尚光明　任：任用","trans":"楚國郢都有個人要寫信給燕國的宰相，晚上寫信時燭火不夠亮，就對拿蠟燭的人說：「把蠟燭舉高。」一邊說，一邊不小心把「舉燭」兩個字寫進信裡。「舉燭」並不是信本來要說的意思。燕國宰相收到信後解釋說：「舉燭，就是崇尚光明；崇尚光明，就是要推舉賢能的人並任用他。」","qs":[{"q":"「遺燕相國書」和「夜書」的兩個「書」，意思分別是？","opts":["都是書本","信；寫字","寫字；信","都是寫字"],"ans":"B","steps":["「遺……書」：送給宰相的東西 → 信","「夜書」：晚上做的動作 → 寫","前信後寫 → 答 B"],"tests":"一字多義：書","avoid":"先看它是東西還是動作"},{"q":"燕相收到信後，把「舉燭」解釋成什麼意思？","opts":["把蠟燭舉高一點","晚上寫信要點燈","崇尚光明，推舉賢能的人來任用","拿蠟燭的人最重要"],"ans":"C","steps":["證據句：「舉燭者，尚明也；尚明也者，舉賢而任之」","A 是郢人當時嘴上說的話，不是燕相的解釋；B、D 文中沒說","燕相解釋成崇尚光明、任用賢人 → 答 C"],"tests":"找人物的解讀","avoid":"人物怎麼解釋，回原句找"},{"q":"可以推知「舉燭」兩個字為什麼會出現在信裡？","opts":["郢人邊說邊寫，不小心多寫進去","郢人想勸燕相任用賢人","拿蠟燭的人寫的","燕相自己加上去的"],"ans":"A","steps":["證據：「云而過書『舉燭』」","又說「舉燭，非書意也」","B 是燕相的解讀，不是郢人本意 → 答 A"],"tests":"從證據推原因","avoid":"人物的想法和事實要分開"},{"q":"從本文可以推論出哪個道理？","opts":["寫信一定要在白天","燕相什麼都不懂","蠟燭越亮越好","解讀文字不能只照自己的想法，要看原意"],"ans":"D","steps":["事實：「舉燭」是寫錯的","燕相卻解釋出一大套道理","推出：不能照自己的想法亂解釋；B 有絕對字 → 答 D"],"tests":"推出道理","avoid":"有「一定」「什麼都」要小心"}]}]},{"no":"第 4 組","title":"睡覺也在讀書","skill":"段落重點：每段寫一句話","steps":["❶ 讀完一段，停下來問：這段在說什麼？","❷ 用 15 個字以內寫在段落旁邊","❸ 每段的一句話連起來，就是全文大意","❹ 有「但是」「所以」的段落通常最重要"],"demo":{"q":"下面這段的重點是什麼？","a":["先看材料：「考試前一晚，很多人會熬夜讀書……但是，許多研究發現，睡覺並不是在浪費時間。人睡著的時候，大腦仍在工作，會把白天學到的東西重新整理、存放好。」","找轉折詞「但是」→ 作者真正想說的在後面","答：睡覺時大腦在整理學過的東西"]},"parts":[{"label":"第一篇","title":"睡覺也在讀書","text":["考試前一晚，很多人會熬夜讀書，覺得多讀一小時就多記一點。但是，許多研究發現，睡覺並不是在浪費時間。人睡著的時候，大腦仍在工作，會把白天學到的東西重新整理、存放好，就像把散落一地的球收進球籃。","如果睡得太少，大腦來不及整理，新學的內容就容易像沒收好的球一樣滾走。有些人熬夜之後，第二天上課昏昏沉沉，前一晚背的東西也想不起來，就是這個原因。","所以，想把書讀進腦袋裡，除了認真讀，也要留時間給大腦整理。與其熬夜硬撐，不如早點睡，隔天早上再花十分鐘複習一次。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段主要在說什麼？","opts":["熬夜的人上課會睡著","睡太少，大腦來不及整理，學的東西容易忘","球沒收好會滾走","背東西要大聲唸"],"ans":"B","steps":["第二段第一句：睡太少，大腦來不及整理","後面熬夜的例子是在支持這句話","A 是例子的一部分，C 是比喻，都不是重點"],"tests":"分辨重點和例子","avoid":"例子和比喻是幫你懂的，不是重點本身"},{"q":"作者用「把散落一地的球收進球籃」比喻什麼？","opts":["運動前要整理器材","睡覺時大腦整理白天學的東西","讀書要像打球一樣用力","房間要保持整齊"],"ans":"B","steps":["比喻前面那句：大腦會把白天學到的東西整理、存放好","「就像」後面就是比喻","比喻＝前面那件事"],"tests":"看懂比喻","avoid":"「就像」前面那句，就是比喻在說的事"},{"q":"作者最後的建議是？","opts":["考前一晚多讀一小時","完全不用複習","早點睡，隔天早上再複習十分鐘","只要睡飽就一定考滿分"],"ans":"C","steps":["結論在第三段「所以」後面","「不如早點睡，隔天早上再花十分鐘複習」","D 有絕對字「一定」，文中也沒說"],"tests":"用總結詞找結論","avoid":"建議題直接找「所以」「不如」那一句"},{"q":"把三段的重點連起來，全文大意最接近？","opts":["熬夜讀書最有效","考試前一晚不要讀書","球要好好收進球籃","睡覺時大腦會整理所學，所以讀書也要睡飽"],"ans":"D","steps":["第一段：睡覺時大腦在整理學過的東西","第二段：睡太少容易忘；第三段：早點睡、隔天複習","連起來就是 D；C 是比喻，A 相反"],"tests":"段落重點連成大意","avoid":"每段一句話，連起來就是大意"}]},{"label":"第二篇","title":"打球前為什麼要熱身","text":["很多人一到球場就急著投籃、衝刺，覺得熱身很浪費時間。但是，熱身其實是打球前很重要的準備。慢跑、拉筋、原地小跳這些動作，會讓心跳慢慢加快、身體溫度升高，肌肉和關節也會比較靈活，就像電腦開機後要等一下才跑得順。","如果沒有熱身就突然用力跳躍或急停，肌肉還沒準備好，比較容易拉傷或扭傷腳踝。有些球員一上場就猛衝，第一節還沒打完就受傷下場，整場比賽只能坐在場邊看。","所以，上場前花十分鐘熱身，不是浪費時間，而是讓自己打得更久、更安全。下次到球場，別急著投第一球，先把身體叫醒吧！"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的重點是什麼？","opts":["熱身能讓身體準備好，是打球前重要的準備","很多人一到球場就急著投籃","電腦開機要等一下","慢跑比投籃重要"],"ans":"A","steps":["找轉折詞「但是」","後面：熱身其實是打球前很重要的準備","B 是開頭的現象，C 是比喻 → 答 A"],"tests":"找段落重點","avoid":"「但是」後面通常是重點"},{"q":"第二段「有些球員……只能坐在場邊看」在文中的作用是？","opts":["段落重點","舉例支持「沒熱身容易受傷」","比喻","作者的建議"],"ans":"B","steps":["第二段第一句：沒熱身容易拉傷、扭傷","後面球員受傷下場是真實情況的例子","例子是用來支持重點的 → 答 B"],"tests":"分辨重點和例子","avoid":"例子是幫重點作證的"},{"q":"作者把熱身比喻成什麼？","opts":["吃早餐","收球進球籃","電腦開機後等一下才跑得順","看比賽影片"],"ans":"C","steps":["找「就像」：「就像電腦開機後要等一下才跑得順」","熱身＝讓身體先暖機","所以比喻是電腦開機 → 答 C"],"tests":"看懂比喻","avoid":"看到「就像」，後面就是比喻"},{"q":"第三段的重點是什麼？","opts":["十分鐘太長了","到球場不可以投籃","熱身比比賽還重要","熱身讓人打得更久、更安全，不是浪費時間"],"ans":"D","steps":["找總結詞「所以」","後面：不是浪費時間，而是讓自己打得更久、更安全","C 是誇大，文中沒說 → 答 D"],"tests":"用總結詞找重點","avoid":"「所以」後面常是全文結論"}]},{"label":"第三篇","title":"柴犬每天都要散步","text":["有人以為狗狗只要有吃有住就很快樂，其實大部分的狗每天都需要出門散步。柴犬原本是日本人帶進山裡打獵的犬種，精力旺盛，好奇心也很強。散步時，牠可以活動筋骨，還能用鼻子聞各種氣味，認識外面的世界。","如果整天被關在家裡，精力沒地方用，有些狗會變得焦躁，開始咬拖鞋、抓沙發，或一直亂叫。這不一定是牠「學壞了」，而是牠太無聊了。","所以，養柴犬不只要餵飽牠，也要每天陪牠散步。散步回來的柴犬，常常累得趴在地上呼呼大睡，主人和狗都輕鬆。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段主要在說什麼？","opts":["柴犬來自日本","大部分的狗每天都需要出門散步","狗的鼻子很靈","狗有吃有住就很快樂"],"ans":"B","steps":["找「其實」：其實大部分的狗每天都需要出門散步","柴犬打獵、聞氣味，都是在說明為什麼要散步","D 是作者要反駁的想法 → 答 B"],"tests":"找段落重點","avoid":"「其實」後面常是作者真正的看法"},{"q":"第二段「咬拖鞋、抓沙發」是在說明什麼？","opts":["柴犬天生個性很壞","拖鞋的味道很吸引狗","主人應該換新沙發","狗精力沒地方用、太無聊時可能出現的行為"],"ans":"D","steps":["第二段第一句：整天被關、精力沒地方用","咬拖鞋、抓沙發是例子","A 正好是作者否定的 → 答 D"],"tests":"分辨重點和例子","avoid":"先找例子在幫哪一句作證"},{"q":"根據第二段，作者認為狗亂咬東西的原因可能是？","opts":["太無聊了","學壞了","肚子餓了","生病了"],"ans":"A","steps":["證據：「這不一定是牠學壞了，而是牠太無聊了」","「不是……而是」，後面才是作者的意思","B 被作者否定；C、D 文中沒說 → 答 A"],"tests":"找作者的看法","avoid":"「而是」後面才是作者的答案"},{"q":"全文大意最接近？","opts":["柴犬散步回來會呼呼大睡","柴犬以前很會打獵","養柴犬要餵飽，也要每天陪牠散步","狗絕對不能待在家裡"],"ans":"C","steps":["第三段「所以」：不只要餵飽，也要每天陪牠散步","前兩段在說明散步的好處和不散步的問題","D 有絕對字；A、B 是細節 → 答 C"],"tests":"段落重點連成大意","avoid":"大意要能蓋住每一段"}]},{"label":"第四篇","title":"先偵察，再進攻","text":["玩戰術任務遊戲時，很多新手一開場就衝進敵人的基地，結果常常一下子就被打倒。厲害的玩家不一樣，他們會先派人偵察，看清楚地圖上哪裡有掩護、哪裡是死路，再決定從哪一條路進攻。","偵察看起來很慢，好像浪費了好幾十秒。但是，知道敵人在哪裡，就能避開陷阱，也能找到最好的時機出手。就像打籃球前先看對手的比賽影片，知道誰最會投三分，防守時就知道要盯誰。","讀文章也是一樣。先看題目、圈出關鍵字，再去文章找證據，就像先偵察再進攻。動手之前先想清楚，常常能更快完成任務。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段主要在比較什麼？","opts":["新手和厲害玩家開場的做法不同","地圖有多大","敵人基地有多危險","遊戲有多難"],"ans":"A","steps":["前半：新手一開場就衝","後半：「厲害的玩家不一樣」，先偵察","一段在比兩種做法 → 答 A"],"tests":"找段落重點","avoid":"看到「不一樣」，就是在比較"},{"q":"第二段的重點句是哪一句？","opts":["但是，知道敵人在哪裡，就能避開陷阱、找到好時機","偵察看起來很慢","就像打籃球前先看對手的比賽影片","防守時就知道要盯誰"],"ans":"A","steps":["第一句說偵察「看起來」很慢","「但是」後面說出偵察的好處，是重點","C、D 是類比 → 答 A"],"tests":"找重點句","avoid":"「但是」後面通常是重點"},{"q":"第二段寫「打籃球前先看對手的比賽影片」，作用是？","opts":["作者的結論","遊戲規則","用打籃球來類比，幫助了解偵察的好處","段落重點"],"ans":"C","steps":["找「就像」","用熟悉的籃球，說明先了解對手的好處","類比是幫你懂，不是重點本身 → 答 C"],"tests":"看懂類比","avoid":"「就像」後面是幫你懂的例子"},{"q":"第三段作者把「偵察」連到哪件事？","opts":["寫功課要越快越好","玩遊戲要每天練習","籃球比賽要多看影片","讀文章先看題目、圈關鍵字，再找證據"],"ans":"D","steps":["第三段開頭：「讀文章也是一樣」","「先看題目、圈出關鍵字，再去文章找證據」","就像先偵察再進攻 → 答 D"],"tests":"找段落重點","avoid":"每段第一句常告訴你這段講什麼"}]},{"label":"第五篇","title":"讀書可以分段來","text":["很多人以為讀書要一口氣坐好幾個小時才算認真。可是坐太久，注意力會越來越分散，眼睛盯著課本，腦袋卻已經在想午餐要吃什麼。","有一種方法叫「番茄鐘」：先專心讀二十五分鐘，再休息五分鐘，這樣算一輪。休息時可以起來走一走、喝口水，但不要滑手機。因為時間短，比較容易撐住不分心；又有休息可以期待，讀起來比較不痛苦。","所以，讀書不一定要拚時間長短，而是要讓每一段時間都真的專心。就像練球分成好幾組一樣，把讀書分段，反而能讀得更多。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段在說明什麼問題？","opts":["讀書坐太久，注意力會越來越分散","午餐很重要","讀書一定要坐好幾個小時","課本太難"],"ans":"A","steps":["找轉折詞「可是」","後面：坐太久，注意力會越來越分散","C 是作者要反駁的想法 → 答 A"],"tests":"找段落重點","avoid":"「可是」後面通常是重點"},{"q":"第二段主要介紹什麼？","opts":["休息時可以滑手機","讀書一定很痛苦","讀書時要多喝水","番茄鐘：讀二十五分鐘、休息五分鐘，比較容易專心"],"ans":"D","steps":["第二段第一句介紹「番茄鐘」","後面說明它為什麼容易專心","A 相反（文中說不要滑手機）→ 答 D"],"tests":"找段落重點","avoid":"選項和原文相反的，先刪掉"},{"q":"第三段「就像練球分成好幾組一樣」是？","opts":["段落重點","反駁別人的話","用練球來比喻分段讀書","一個數據"],"ans":"C","steps":["找「就像」","用練球分組，比喻讀書分段","比喻是幫你懂的 → 答 C"],"tests":"看懂比喻","avoid":"看到「就像」，後面就是比喻"},{"q":"作者最主要的主張是什麼？","opts":["讀書時間越長越好","休息比讀書重要","一定要用番茄鐘才讀得好","讀書要讓每段時間都專心，分段讀反而讀得更多"],"ans":"D","steps":["第三段「所以」：不一定拚長短，要每一段都專心","A 相反；B 文中沒說","C 有絕對字「一定」→ 答 D"],"tests":"用總結詞找主張","avoid":"有「一定」的選項要特別小心"}]}]},{"no":"第 5 組","title":"狐假虎威","skill":"寓言三問：故事背後的道理","steps":["❶ 故事表面：發生了什麼事？","❷ 誰像現實中的哪種人？","❸ 作者想告訴我們什麼？（通常就是成語的意思）"],"demo":{"q":"用三問想「守株待兔」","a":["表面：農夫放下工作等兔子","像誰：想不努力就有收穫的人","道理：不能把一次運氣當成每次都會發生"]},"parts":[{"label":"第一篇","title":"狐假虎威","text":["虎求百獸而食之，得狐。狐曰：「子無敢食我也。天帝使我長百獸，今子食我，是逆天帝命也。子以我為不信，吾為子先行，子隨我後，觀百獸之見我而敢不走乎？」虎以為然，故遂與之行。獸見之皆走。虎不知獸畏己而走也，以為畏狐也。"],"cite":"《戰國策．楚策一》（節選）","notes":"求：尋找　子：你　長：當首領　逆：違背　信：誠實　然：對的　畏：怕","trans":"老虎尋找各種野獸來吃，抓到一隻狐狸。狐狸說：「你不敢吃我。天帝派我當百獸的首領，現在你吃我，就是違背天帝的命令。你如果認為我不誠實，我走在你前面，你跟在我後面，看看百獸見到我敢不逃跑嗎？」老虎認為有道理，就和牠一起走。野獸看見牠們都逃跑了。老虎不知道野獸是怕自己才逃跑，以為是怕狐狸。","qs":[{"q":"「獸見之皆走」的「走」是什麼意思？","opts":["走路","逃跑","離開","走漏"],"ans":"B","steps":["第 1 週背過：走＝跑","代回：野獸看見都逃跑 → 通","古今異義：現在的「走」是走路"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"野獸真正害怕的是誰？","opts":["狐狸","老虎","天帝","獵人"],"ans":"B","steps":["找證據：「虎不知獸畏己而走也」","「己」指老虎自己","野獸怕的是老虎，老虎卻以為是怕狐狸"],"tests":"找出真相的證據句","avoid":"故事人物以為的，不一定是真的"},{"q":"「狐假虎威」比喻哪一種人？","opts":["力氣很大的人","借別人的勢力來嚇唬人的人","很會跑步的人","尊敬長輩的人"],"ans":"B","steps":["表面：狐狸跟老虎走，野獸都逃","狐狸自己沒有本事，靠的是老虎","像現實中借別人勢力嚇人的人"],"tests":"寓言的比喻","avoid":"先想故事裡誰靠誰，再對應到人"},{"q":"「得狐」是誰抓到狐狸？","opts":["獵人","天帝","百獸","老虎"],"ans":"D","steps":["前一句：「虎求百獸而食之」，主詞是虎","「得狐」承前省略主詞","抓到狐狸的是老虎 → 答 D"],"tests":"補主詞","avoid":"沒寫主詞，就往前一句找"}]},{"label":"第二篇","title":"驚弓之鳥","text":["有間，雁從東方來，更羸以虛發而下之。魏王曰：「然則射可至此乎？」更羸曰：「此孽也。」王曰：「先生何以知之？」對曰：「其飛徐而鳴悲。飛徐者，故瘡痛也；鳴悲者，久失群也。故瘡未息，而驚心未去也。聞弦音，引而高飛，故瘡隕也。」"],"cite":"《戰國策．楚策四》（節選）","notes":"有間：過了一會兒　更羸：魏國的神射手　虛發：只拉弓弦，不放箭　然則：那麼　孽：受過傷的鳥　徐：慢　故瘡：舊傷口　息：癒合　引：用力往上　故瘡隕：舊傷裂開而掉下來","trans":"過了一會兒，有一隻雁從東方飛來，更羸只拉弓弦不放箭，就讓雁掉了下來。魏王說：「那麼射箭的本領可以到這種地步嗎？」更羸說：「這是一隻受過傷的雁。」魏王問：「先生怎麼知道？」更羸回答：「牠飛得慢，叫聲悲哀。飛得慢，是因為舊傷在痛；叫聲悲哀，是因為離開雁群很久了。舊傷還沒好，驚嚇的心也還沒消除，一聽到弓弦的聲音，就用力往高處飛，結果舊傷裂開，就掉下來了。」","qs":[{"q":"「更羸以虛發而下之」的「下」是什麼意思？","opts":["使……掉下來","下面","下次","走下去"],"ans":"A","steps":["「之」指那隻雁","代回「讓雁掉下來」→ 通","後文也說「故瘡隕也」，雁掉下來 → 答 A"],"tests":"一字多義：下","avoid":"下後面接「之」，常是動作"},{"q":"更羸從哪兩個線索知道雁受過傷？","opts":["飛得慢、叫聲悲哀","顏色和大小","從東方來、飛得很高","魏王告訴他"],"ans":"A","steps":["證據句：「其飛徐而鳴悲」","徐＝慢；鳴悲＝叫聲悲哀","C 的「飛得高」是聽到弦聲之後 → 答 A"],"tests":"找證據句","avoid":"問「怎麼知道」，就找人物說的理由"},{"q":"寓言三問①：雁掉下來真正的原因是？","opts":["被箭射中","更羸的力氣很大","舊傷沒好又受驚，用力高飛使傷口裂開","天氣太冷飛不動"],"ans":"C","steps":["更羸是「虛發」，沒有放箭，A 錯","證據：「聞弦音，引而高飛，故瘡隕也」","是受驚加舊傷 → 答 C"],"tests":"寓言表面","avoid":"先弄清楚故事真正發生什麼事"},{"q":"「驚弓之鳥」比喻哪一種人？","opts":["射箭很準的人","很會觀察的人","喜歡飛的人","受過驚嚇，一有動靜就非常害怕的人"],"ans":"D","steps":["表面：受過傷的雁，一聽弦聲就驚慌","像誰：受過驚嚇、一點動靜就怕的人","成語說的是雁，不是更羸 → 答 D"],"tests":"寓言的比喻","avoid":"成語的主角是誰，就比喻誰"}]},{"label":"第三篇","title":"三人成虎","text":["龐葱與太子質於邯鄲，謂魏王曰：「今一人言市有虎，王信之乎？」王曰：「否。」「二人言市有虎，王信之乎？」王曰：「寡人疑之矣。」「三人言市有虎，王信之乎？」王曰：「寡人信之矣。」龐葱曰：「夫市之無虎明矣，然而三人言而成虎。」"],"cite":"《戰國策．魏策二》（節選）","notes":"龐葱：魏國的大臣　質：到別國當人質　邯鄲：趙國的都城　市：市集　寡人：國君自稱　夫：句首發語詞","trans":"龐葱要陪太子到邯鄲去當人質，他對魏王說：「如果現在有一個人說市集上有老虎，大王相信嗎？」魏王說：「不信。」「如果有兩個人說市集上有老虎，大王相信嗎？」魏王說：「我會有點懷疑了。」「如果有三個人說市集上有老虎，大王相信嗎？」魏王說：「我會相信了。」龐葱說：「市集上沒有老虎，是很清楚的事，可是三個人都這麼說，就好像真的有老虎了。」","qs":[{"q":"「夫市之無虎明矣」的「明」是什麼意思？","opts":["明天","光明","清楚，明白","聰明"],"ans":"C","steps":["代回「市集沒有老虎是很清楚的事」→ 通","後面「然而」轉折：但是三個人說了就像有","所以明＝清楚 → 答 C"],"tests":"一字多義：明","avoid":"每個意思代回，選最通的"},{"q":"魏王的態度怎麼變化？","opts":["不信→懷疑→相信","相信→懷疑→不信","一直都不信","一直都相信"],"ans":"A","steps":["一人說：「否」","二人說：「寡人疑之矣」；三人說：「寡人信之矣」","依序是不信、懷疑、相信 → 答 A"],"tests":"寓言表面","avoid":"按順序把人物的話排出來"},{"q":"「三人言而成虎」說明了什麼道理？","opts":["市集上常常有老虎","謠言說的人多了，就會讓人信以為真","三個人比兩個人聰明","老虎喜歡人多的地方"],"ans":"B","steps":["表面：市集明明沒老虎","三個人都說，魏王就信了","道理：謠言重複多次，就讓人信以為真 → 答 B"],"tests":"寓言的道理","avoid":"道理要用故事的結果來推"},{"q":"下列哪一件事最像「三人成虎」？","opts":["三個隊友一起加練投籃","老師提醒了三次要交作業","我連續投進三顆三分球","三個同學都說明天放假，我就信了，結果根本沒放假"],"ans":"D","steps":["三人成虎：不是真的事，說的人多就信了","D：放假是假消息，聽多了就信","B 是真的消息，不是謠言 → 答 D"],"tests":"寓言對應生活","avoid":"比較結構：假消息＋很多人說"}]},{"label":"第四篇","title":"黔之驢","text":["黔無驢，有好事者船載以入。至則無可用，放之山下。虎見之，龐然大物也，以為神，蔽林間窺之。稍出近之，憖憖然，莫相知。他日，驢一鳴，虎大駭，遠遁，以為且噬己也，甚恐。然往來視之，覺無異能者；益習其聲，又近出前後，終不敢搏。"],"cite":"柳宗元〈三戒．黔之驢〉（節選）","notes":"黔：今貴州一帶　好事者：喜歡多事的人　龐然：高大的樣子　蔽：躲藏　窺：偷看　憖憖然：小心謹慎的樣子　駭：害怕　遁：逃走　且：將要　噬：咬　異能：特別的本領　習：熟悉　搏：撲上去抓","trans":"黔地本來沒有驢子，有個喜歡多事的人用船載了一頭進去。運到以後沒有什麼用處，就把牠放在山下。老虎看見牠，是個高大的東西，以為是神，就躲在樹林裡偷看。慢慢走出來靠近牠，小心謹慎，不知道牠是什麼東西。有一天，驢子叫了一聲，老虎非常害怕，逃得遠遠的，以為驢子要咬自己了，非常恐懼。但是來來回回觀察牠，覺得牠沒有什麼特別的本領；越來越熟悉牠的叫聲，又在牠前後靠近，但始終不敢撲上去。","qs":[{"q":"「然往來視之」的「然」是什麼意思？","opts":["對的","這樣","但是","燃燒"],"ans":"C","steps":["前面：老虎「甚恐」，非常害怕","後面：覺得驢子沒什麼本領，前後相反","前後相反＝但是；「虎以為然」的然才是對的 → 答 C"],"tests":"一字多義：然","avoid":"前後意思相反時，然＝但是"},{"q":"老虎一開始為什麼「以為神」？","opts":["驢子會說話","好事者告訴牠","驢子長得高大，老虎從沒見過","驢子咬過老虎"],"ans":"C","steps":["證據：「黔無驢」，當地沒有驢","又寫「龐然大物也，以為神」","高大又沒見過 → 答 C"],"tests":"找原因的證據","avoid":"原因可能分散在兩句裡"},{"q":"老虎對驢子的態度怎麼變化？","opts":["害怕→觀察→越來越熟悉、敢靠近","熟悉→害怕→逃走","一直很害怕，不敢看","一開始就撲上去"],"ans":"A","steps":["先：「以為神」「甚恐」","再：「往來視之」，觀察","後：「益習其聲，又近出前後」→ 答 A"],"tests":"寓言表面","avoid":"按時間順序排出角色的變化"},{"q":"驢子「龐然大物」卻「無異能」，像現實中哪一種人？","opts":["個子高、很會打球的人","聲音大、很會唱歌的人","喜歡到處旅行的人","外表看起來很厲害，其實沒有真本事的人"],"ans":"D","steps":["證據一：「龐然大物也，以為神」→ 外表嚇人","證據二：「覺無異能者」→ 沒有特別本領","外表厲害、裡面沒本事 → 答 D"],"tests":"寓言的比喻","avoid":"把角色的外表和真本事分開看"}]},{"label":"第五篇","title":"井底之蛙","text":["井鼃不可以語於海者，拘於虛也；夏蟲不可以語於冰者，篤於時也；曲士不可以語於道者，束於教也。"],"cite":"《莊子．秋水》（節選）","notes":"鼃：同「蛙」　拘：限制　虛：同「墟」，住的地方　篤：固守、受限制　曲士：見識淺的人　束：拘束","trans":"井裡的青蛙，沒辦法和牠談論大海，因為牠被住的地方限制了；夏天的蟲，沒辦法和牠談論冰，因為牠受季節時間的限制；見識淺的人，沒辦法和他談論大道理，因為他被所受的教育限制住了。","qs":[{"q":"「不可以語於海」的「語」是什麼意思？","opts":["語言","談論，告訴","成語","自言自語"],"ans":"B","steps":["代回「不能和牠談論大海」→ 通","後面兩句「語於冰」「語於道」也是談論","語在這裡是動作 → 答 B"],"tests":"字義：語＝談論","avoid":"語後面接「於」，通常是動作"},{"q":"為什麼「夏蟲不可以語於冰」？","opts":["夏蟲很笨聽不懂","冰太冷，蟲會凍死","夏蟲只活在夏天，受時間限制，沒見過冰","夏蟲不喜歡冰"],"ans":"C","steps":["證據：「篤於時也」","受季節時間的限制","只活在夏天，看不到冰 → 答 C"],"tests":"找原因的證據","avoid":"每一句後半就是原因"},{"q":"三句話共同說明什麼？","opts":["見識會被環境、時間、所受的教育限制","青蛙住在井裡最安全","冬天比夏天好","讀書沒有用"],"ans":"A","steps":["拘於虛（地方）、篤於時（時間）、束於教（教育）","三句都在說「被限制」","D 是誤解「束於教」→ 答 A"],"tests":"找共同道理","avoid":"句型重複時，找相同的部分"},{"q":"「井底之蛙」比喻哪一種人？","opts":["住在鄉下的人","喜歡游泳的人","很會跳的人","見識狹小，以為自己看到的就是全部的人"],"ans":"D","steps":["表面：青蛙住在井裡，看不到大海","像誰：只看到眼前一小塊的人","道理：不要被眼前的範圍限制 → 答 D"],"tests":"寓言的比喻","avoid":"先想角色缺少什麼，再對應到人"}]}]},{"no":"週末關卡","title":"鷸蚌相爭","skill":"五步全用（綜合）","steps":["❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標","❹ 一字多義：代回去試　❺ 寓言三問找道理","完成後錄一支 60 秒「古文翻譯官」短片"],"parts":[{"label":"第一篇","title":"鷸蚌相爭","text":["蚌方出曝，而鷸啄其肉，蚌合而拑其喙。鷸曰：「今日不雨，明日不雨，即有死蚌。」蚌亦謂鷸曰：「今日不出，明日不出，即有死鷸。」兩者不肯相舍，漁者得而并禽之。"],"cite":"《戰國策．燕策》","notes":"蚌：有兩片硬殼的貝類　方：正在　曝：曬太陽　鷸：長嘴的水鳥　拑：夾住　喙：鳥嘴　即：就　舍：放開　并：一起　禽：同「擒」，抓","trans":"蚌正從水裡出來曬太陽，鷸鳥就去啄牠的肉，蚌把殼合起來夾住鷸鳥的嘴。鷸鳥說：「今天不下雨，明天不下雨，就會有一隻死蚌。」蚌也對鷸鳥說：「今天不放你出去，明天不放你出去，就會有一隻死鷸鳥。」兩個都不肯放開對方，漁夫走過來把牠們一起抓走了。","qs":[{"q":"「蚌合而拑其喙」的「其」指誰？","opts":["蚌","鷸","漁夫","作者"],"ans":"B","steps":["前一句：鷸啄蚌的肉","蚌合起殼，夾住誰的嘴？","喙是鳥嘴 → 其＝鷸"],"tests":"代詞「其」指誰","avoid":"「其」＝他的，往前找最近的人或動物"},{"q":"「而鷸啄其肉」的「而」是什麼意思？","opts":["然後、就","但是","因為","如果"],"ans":"A","steps":["蚌出來曬太陽 → 鷸就去啄","前後是接著發生的事，不是相反","所以「而」＝然後、就"],"tests":"虛詞「而」的順接","avoid":"換成「然後」「但是」各讀一次"},{"q":"「漁者得而并禽之」說明了什麼道理？","opts":["漁夫很努力","雙方爭執不讓，結果讓第三者得利","鳥比蚌聰明","天氣會影響捕魚"],"ans":"B","steps":["表面：鷸和蚌都不放開","結果：漁夫一次抓兩個","道理：兩方相爭，第三方得利（鷸蚌相爭，漁翁得利）"],"tests":"寓言三問","avoid":"看最後的結果，誰得到好處"},{"q":"「兩者不肯相舍」的「兩者」指誰？","opts":["漁夫和鷸","蚌和漁夫","天和雨","鷸和蚌"],"ans":"D","steps":["前面說話的是鷸和蚌","互相夾住、不肯放開的也是牠們","漁夫是後來才出現的 → 答 D"],"tests":"補主詞","avoid":"往前找正在吵架的兩方"}]},{"label":"第二篇","title":"歧路亡羊","text":["楊子之鄰人亡羊，既率其黨，又請楊子之豎追之。楊子曰：「嘻！亡一羊，何追者之眾？」鄰人曰：「多歧路。」既反，問：「獲羊乎？」曰：「亡之矣。」曰：「奚亡之？」曰：「歧路之中又有歧焉，吾不知所之，所以反也。」"],"cite":"《列子．說符》（節選）","notes":"楊子：楊朱，戰國時的思想家　率：帶領　黨：親友　豎：童僕　嘻：唉　歧路：岔路　反：同「返」，回來　獲：找到　奚：為什麼","trans":"楊子的鄰居丟了一隻羊，已經帶著親友去找，又來請楊子的童僕一起去追。楊子說：「唉！丟了一隻羊，為什麼要這麼多人去追？」鄰居說：「岔路很多。」回來以後，楊子問：「找到羊了嗎？」鄰居說：「還是丟了。」楊子問：「為什麼會丟了呢？」鄰居說：「岔路之中又有岔路，我們不知道羊往哪裡去了，所以只好回來。」","qs":[{"q":"「楊子之鄰人亡羊」的「亡」是什麼意思？","opts":["死亡","沒有","丟失","逃亡的人"],"ans":"C","steps":["代回「鄰居死了羊」→ 不合，後面在追羊","代回「鄰居丟了羊」→ 通","杞人憂天的「亡」是沒有，這裡不同 → 答 C"],"tests":"一字多義：亡","avoid":"同一個字，在每篇都要重新代回"},{"q":"「吾不知所之」的「之」是什麼意思？","opts":["往，去","他","的","這個"],"ans":"A","steps":["前文：岔路之中又有岔路","代回「不知道羊往哪裡去」→ 通","之放在「所」後面當動作 → 答 A"],"tests":"一字多義：之","avoid":"之可以是他、的、往，都試試"},{"q":"為什麼追羊的人那麼多？","opts":["羊跑得很快","岔路很多","鄰居很有錢","楊子要大家去"],"ans":"B","steps":["楊子問：「何追者之眾？」","鄰人回答：「多歧路。」","岔路多，要分頭找 → 答 B"],"tests":"找人物的理由","avoid":"問句後面緊接的回答就是證據"},{"q":"這個故事想告訴我們什麼？","opts":["追羊一定要找很多人","羊很難養","不要隨便幫鄰居","岔路太多會迷失方向，做事要掌握正確方向"],"ans":"D","steps":["表面：岔路又有岔路，羊找不到","像誰：方向太多、不知道往哪走的人","道理：要掌握方向，不然會迷失 → 答 D"],"tests":"寓言三問","avoid":"看最後的結果：為什麼失敗"}]},{"label":"第三篇","title":"畫荻教子","text":["歐陽修字永叔，廬陵人。四歲而孤，母鄭，守節自誓，親誨之學。家貧，至以荻畫地學書。幼敏悟過人，讀書輒成誦。"],"cite":"《宋史．歐陽修傳》（節選）","notes":"廬陵：今江西吉安　守節自誓：發誓不再嫁　誨：教導　荻：像蘆葦的草　敏悟：聰明、理解力強","trans":"歐陽修，字永叔，廬陵人。四歲時父親就過世了，母親鄭氏發誓不再嫁，親自教他讀書。家裡很窮，甚至用荻草在地上寫字來學習。歐陽修從小就聰明過人，書讀過就能背下來。","qs":[{"q":"「四歲而孤」的「孤」是什麼意思？","opts":["孤單","父親過世","孤兒院","一個人住"],"ans":"B","steps":["後文只寫「母鄭」親自教他，沒有提到父親","古文「孤」指小時候失去父親","代回「四歲時父親過世」→ 通 → 答 B"],"tests":"古今異義：孤","avoid":"古文的孤，常指幼年喪父"},{"q":"「至以荻畫地學書」的「書」是什麼意思？","opts":["書本","信","寫字","書法家"],"ans":"C","steps":["「畫地學書」：在地上畫著學","在地上學的是寫字","郢書燕說「夜書」也是寫字 → 答 C"],"tests":"一字多義：書","avoid":"書前面有動作時，常是寫字"},{"q":"可以推知歐陽修為什麼「以荻畫地學書」？","opts":["家裡窮，買不起紙筆","荻草寫起來比較漂亮","老師規定要這樣寫","他比較喜歡畫畫"],"ans":"A","steps":["證據：前一句「家貧」","「至」＝甚至，窮到要用荻草在地上寫","B、C、D 文中都沒說 → 答 A"],"tests":"從證據推原因","avoid":"原因常在前一句"},{"q":"「讀書輒成誦」的意思是？","opts":["讀書總是很慢","讀書時一定大聲唸","讀書要唸經","書一讀就能背誦"],"ans":"D","steps":["輒＝就；成誦＝能背出來","前一句「幼敏悟過人」：很聰明","聰明，所以一讀就會背 → 答 D"],"tests":"句意理解","avoid":"用前一句的形容來確認句意"}]},{"label":"第四篇","title":"孟母斷織","text":["孟子之少也，既學而歸，孟母方績，問曰：「學何所至矣？」孟子曰：「自若也。」孟母以刀斷其織。孟子懼而問其故，孟母曰：「子之廢學，若吾斷斯織也。……」","孟子懼，旦夕勤學不息，師事子思，遂成天下之名儒。"],"cite":"《列女傳．母儀．鄒孟軻母》（節選）","notes":"既：已經　方：正在　績：把麻搓成線，這裡指織布　自若：和原來一樣　斯：這　旦夕：早晚　師事：拜……為老師　子思：孔子的孫子　名儒：有名的學者","trans":"孟子小時候，有一次放學回家，孟母正在織布，問他：「學習學到哪裡了？」孟子說：「跟以前一樣。」孟母就用刀把織好的布割斷。孟子害怕地問她原因，孟母說：「你荒廢學業，就像我割斷這塊布一樣。……」孟子很害怕，從此早晚勤奮讀書不停止，拜子思為老師，終於成為天下有名的學者。","qs":[{"q":"「孟子懼而問其故」的「故」是什麼意思？","opts":["所以","故意","原因","從前"],"ans":"C","steps":["代回「孟子害怕地問她原因」→ 通","後面孟母就解釋為什麼斷織","不死之藥「臣故食之」的故是所以，這裡不同 → 答 C"],"tests":"一字多義：故","avoid":"「問其故」的故，就是原因"},{"q":"「若吾斷斯織也」的「若」是什麼意思？","opts":["好像","你","如果","若干"],"ans":"A","steps":["代回「就像我割斷這塊布」→ 通","孟母在拿斷布比喻廢學","杞人憂天「若屈伸呼吸」的若是你，這裡不同 → 答 A"],"tests":"一字多義：若","avoid":"比喻句裡的若，常是「好像」"},{"q":"孟母割斷布，想讓孟子明白什麼？","opts":["布不值錢","讀書半途而廢，就像布被割斷，前功盡棄","媽媽很生氣要處罰他","織布很辛苦"],"ans":"B","steps":["證據：「子之廢學，若吾斷斯織也」","斷布＝廢學，比喻","結果孟子「旦夕勤學不息」，他懂了 → 答 B"],"tests":"比喻和道理","avoid":"先找比喻句，再找人物的反應"},{"q":"「遂成天下之名儒」的「遂」是什麼意思？","opts":["順利","遂願","立刻","終於"],"ans":"D","steps":["前面：「旦夕勤學不息，師事子思」","長時間努力，最後成為名儒","不是「立刻」，是努力後的結果 → 答 D"],"tests":"虛詞：遂","avoid":"遂常接在努力之後，表示結果"}]},{"label":"第五篇","title":"曾參殺人","text":["昔者曾子處費，費人有與曾子同名族者而殺人。人告曾子母曰：「曾參殺人。」曾子之母曰：「吾子不殺人。」織自若。有頃焉，人又曰：「曾參殺人。」其母尚織自若也。頃之，一人又告之曰：「曾參殺人。」其母懼，投杼踰牆而走。"],"cite":"《戰國策．秦策二》（節選）","notes":"曾子：曾參，孔子的學生　處：住　費：地名　名族：姓名　織自若：照常織布　有頃：過了一會兒　杼：織布的梭子　投：丟下　踰：翻過","trans":"從前曾子住在費地，費地有個和曾子同名同姓的人殺了人。有人告訴曾子的母親說：「曾參殺人了。」曾子的母親說：「我的兒子不會殺人。」照樣織布。過了一會兒，又有人說：「曾參殺人了。」她還是照常織布。又過了一會兒，又有一個人來告訴她：「曾參殺人了。」曾子的母親害怕了，丟下梭子，翻牆逃走了。","qs":[{"q":"真正殺人的是誰？","opts":["曾子","曾子的母親","和曾子同名同姓的費地人","來報信的人"],"ans":"C","steps":["證據：「費人有與曾子同名族者而殺人」","殺人的是同名的另一個人","A 是傳言弄錯的對象 → 答 C"],"tests":"補主詞","avoid":"主詞要回到原句找，不能聽傳言"},{"q":"「其母尚織自若也」的「尚」是什麼意思？","opts":["崇尚","高尚","還，仍然","時尚"],"ans":"C","steps":["前面第一次聽到時「織自若」","第二次聽到，她「尚」織自若","代回「還是照常織布」→ 通 → 答 C"],"tests":"虛詞：尚＝還","avoid":"和前一次比，就知道是「還」"},{"q":"曾子的母親最後為什麼逃走？","opts":["第三個人也這樣說，她開始相信了","她親眼看到曾子殺人","布已經織完了","官差來抓她"],"ans":"A","steps":["第一、二次：照常織布，不信","第三次：「其母懼，投杼踰牆而走」","聽了三次就信了；B、C、D 文中沒說 → 答 A"],"tests":"從證據推原因","avoid":"比較前後的反應有什麼不同"},{"q":"這個故事和本週哪一個成語的道理最像？","opts":["狐假虎威","鷸蚌相爭","自相矛盾","三人成虎"],"ans":"D","steps":["本篇：說的人多了，連母親都信了謠言","三人成虎：三個人說，就信市集有老虎","道理都是謠言重複就讓人相信 → 答 D"],"tests":"寓言道理對照","avoid":"先說出道理，再找道理一樣的"}]}]}],"teach":[{"intro":"這一組學會考最常出的新題型：兩篇文章放在一起比較。","items":[{"t":"什麼是「互文對讀」？","d":["把兩篇文章放在一起讀，比較它們哪裡一樣、哪裡不一樣。","國中會考常出這種題目，有時一篇文言、一篇白話。"],"ex":"就像比賽前比較兩隊球員的數據：誰得分多、誰籃板多。"},{"t":"比較表怎麼畫？","d":["畫四格：甲說什麼｜乙說什麼｜相同｜不同。","先在甲、乙各寫一句話，再把意思一樣的連線。"]},{"t":"題目怎麼對應？","d":["問「兩篇都」「共同」→ 看有連線的（相同）。","問「只有甲」「甲有乙沒有」→ 看沒連線的（不同）。"]}],"demo":["材料：甲「學而時習之」；乙「教練要我們每天投一百球」","甲「學而時習之」＝學了常常複習","乙「每天投一百球」＝反覆練習","兩句意思一樣 → 在比較表上連線"]},{"intro":"這一組學「一個字有好幾個意思」，會考很愛考。","items":[{"t":"什麼是「一字多義」？","d":["一個字在不同句子裡，意思不一樣。","例：「打」——打球、打電話、打毛衣，意思都不同。"],"ex":"就像「傳」：傳球、傳話、傳說，看後面接什麼。"},{"t":"「亡」的意思整理","d":["失去：「終亡其酒」（畫蛇添足）","沒有：「身亡所寄」（本組）","逃跑：之後會在塞翁失馬遇到","死亡：現代最常用的意思"]},{"t":"怎麼判斷是哪一個？","d":["把每個意思都代回去讀，通的才是答案。這就是第 1 週學的「選項代回去」。"]}],"demo":["「身亡所寄」的「亡」","代「死亡」不通；代「失去」→ 失去所寄，怪怪的","代「沒有」→ 沒有地方安身 → 通"]},{"intro":"這一組學「推論」：文章沒有直接寫，但可以從證據推出來。","items":[{"t":"什麼是「推論」？","d":["用文章裡寫的事實，推出文章沒直接說的結論。"],"ex":"就像偵探看到地上有濕腳印，推出「剛才有人從外面進來」。"},{"t":"推論和腦補有什麼不同？","d":["推論：有證據，一定推得出來。","腦補：自己想的，文章沒有證據。","會考的錯誤選項，很多就是「聽起來合理，但文章沒說」。"]},{"t":"什麼是「雙重否定」？","d":["兩個否定字放在一起，意思變成肯定。","「無不陷」＝沒有不能刺穿的＝全部都刺得穿。"]}],"demo":["「於物無不陷也」","無＝沒有，不＝不能 → 沒有東西不能刺穿","＝什麼東西都刺得穿"]},{"intro":"文章變長了。這一組學一個讀長文不會亂的方法：每段寫一句話。","items":[{"t":"什麼是「段落重點」？","d":["每一段最想告訴你的那一件事。","通常在段落第一句，或在「但是」「所以」後面。"],"ex":"就像看比賽精華：每一節挑一個最關鍵的球。"},{"t":"重點和例子怎麼分？","d":["重點：作者的主張。","例子：用來支持主張的事情，例如「有人熬夜後上課昏昏沉沉」。","比喻：用熟悉的東西幫你懂，例如「把球收進球籃」。"]},{"t":"全文大意怎麼來？","d":["把每段的一句話連起來，就是全文大意，也就是摘要。"]}],"demo":["材料（〈睡覺也在讀書〉第一段）：「考試前一晚，很多人會熬夜讀書，覺得多讀一小時就多記一點。但是，許多研究發現，睡覺並不是在浪費時間。人睡著的時候，大腦仍在工作，會把白天學到的東西重新整理、存放好。」","找到「但是」→ 後面說睡覺時大腦會整理","在旁邊寫這段重點：睡覺時大腦在整理學過的東西"]},{"intro":"這一組學讀寓言，很多成語都是從寓言來的。","items":[{"t":"什麼是「寓言」？","d":["用動物或小故事來講道理的文章。","守株待兔、刻舟求劍、畫蛇添足都是寓言，後來變成成語。"],"ex":"就像教練放一段失誤的影片，讓全隊學到一個道理。"},{"t":"寓言三問","d":["① 故事表面發生什麼事？","② 故事裡的角色，像現實中的哪種人？","③ 作者想告訴我們什麼道理？"]},{"t":"寓言和成語","d":["寓言的道理，常常就是那個成語的意思。","讀懂寓言，等於多會一個成語，作文也用得上。"]}],"demo":["守株待兔　表面：農夫等兔子","像誰：想不努力就有收穫的人","道理：不能把一次運氣當成每次都會發生"]},{"intro":"週末關卡把這週學的全部合在一起用，再學一個新詞：同「某字」。","items":[{"t":"這週學了哪些招？","d":["互文對讀、一字多義、推論、段落重點、寓言三問，加上第 1 週的偵查五步。"]},{"t":"什麼是「同某字」？","d":["古人有時借用另一個字來寫，注釋會寫「同某」。","「禽，同擒」→ 意思是抓。「說，同悅」→ 意思是高興。","看到注釋寫「同」，就用後面那個字的意思讀。"],"ex":"就像隊友的綽號，叫法不同，指的是同一個人。"}],"demo":["「漁者得而并禽之」","注釋：禽，同「擒」","漁夫把牠們一起抓走"]}],"daily":[{"words":[["說","高興（同悅）","不亦說乎"],["慍","生氣","人不知而不慍"]],"line":"學而時習之，不亦說乎？"},{"words":[["亡","沒有","身亡所寄"],["曉","使人明白","家喻戶曉"]],"line":"天，積氣耳，亡處亡氣。"},{"words":[["莫","沒有","莫名其妙"],["或","有人","或曰"]],"line":"吾盾之堅，莫能陷也。"},{"words":[["弗","不","弗能應"],["譽","誇讚","毀譽參半"]],"line":"以子之矛，陷子之盾，何如？"},{"words":[["畏","怕","後生可畏"],["然","對的","不以為然"]],"line":"虎不知獸畏己而走也。"},null],"quiz":{"words":[["說","高興（同悅）","不亦說乎"],["慍","生氣","人不知而不慍"],["亡","沒有","身亡所寄"],["曉","使人明白","因往曉之"],["莫","沒有","莫能陷也"],["或","有人","或曰：「以子之矛……」"],["弗","不","其人弗能應也"],["譽","誇讚","譽之曰"],["畏","怕","虎不知獸畏己而走也"],["然","對的","虎以為然"]],"lines":[["學而時習之，","不亦說乎？"],["天，積氣耳，","亡處亡氣。"],["吾盾之堅，","莫能陷也。"],["以子之矛，","陷子之盾，何如？"],["虎不知獸畏己而走也，","以為畏狐也。"]],"parts":[{"label":"第一篇","title":"揠苗助長","text":["宋人有閔其苗之不長而揠之者，芒芒然歸，謂其人曰：「今日病矣！予助苗長矣！」其子趨而往視之，苗則槁矣。"],"cite":"《孟子．公孫丑上》","notes":"閔：擔心　揠：拔　芒芒然：疲倦的樣子　其人：他家裡的人　予：我　趨：快走　槁：枯乾","trans":"宋國有個人擔心他的禾苗長不高，就把禾苗一棵棵往上拔，然後疲倦地回到家，對家裡的人說：「今天累壞了！我幫助禾苗長高了！」他的兒子趕快跑去看，禾苗都已經枯死了。","qs":[{"q":"「今日病矣」的「病」是什麼意思？","opts":["生病","疲累","錯誤","擔心"],"ans":"B","steps":["前面「芒芒然歸」：疲倦地回家","代回「今天好累啊」→ 通","古今異義：現在的病是生病"],"tests":"古今異義：病","avoid":"看到「病」，先想想「累」"},{"q":"「其子趨而往視之」的「之」指什麼？","opts":["宋人","禾苗","家人","天空"],"ans":"B","steps":["兒子聽到「助苗長」","趕快去看的是苗","後面「苗則槁矣」也證明是去看苗"],"tests":"代詞「之」指什麼","avoid":"「之」往前找被看的東西"},{"q":"這個故事告訴我們什麼？","opts":["種田要早起","違反事物生長的規律、急著求成，反而壞事","要多幫助別人","禾苗很容易枯"],"ans":"B","steps":["表面：拔苗想讓它長快","結果：苗都枯了","道理：急於求成反而壞事（揠苗助長）"],"tests":"寓言的道理","avoid":"先看結果，再說道理"},{"q":"宋人為什麼要把禾苗往上拔？","opts":["擔心苗長不高，想幫它長快一點","想把苗拔回家種","苗長得太密了","兒子叫他這樣做"],"ans":"A","steps":["證據：「閔其苗之不長而揠之」","閔＝擔心，擔心苗長不高","後文他也說「予助苗長矣」→ 答 A"],"tests":"找原因的證據","avoid":"原因常和動作寫在同一句"},{"q":"「謂其人曰」是誰在對家人說話？","opts":["宋人的兒子","禾苗","鄰居","那個拔苗的宋人"],"ans":"D","steps":["前一句：拔苗的宋人「芒芒然歸」","回到家，對家人說話的就是他","兒子是後面才出現的 → 答 D"],"tests":"補主詞","avoid":"沒寫主詞，就往前一句找"}]},{"label":"第二篇","title":"苛政猛於虎","text":["孔子過泰山側，有婦人哭於墓者而哀。夫子式而聽之，使子路問之，曰：「子之哭也，壹似重有憂者。」而曰：「然。昔者吾舅死於虎，吾夫又死焉，今吾子又死焉。」夫子曰：「何為不去也？」曰：「無苛政。」夫子曰：「小子識之，苛政猛於虎也。」"],"cite":"《禮記．檀弓下》","notes":"側：旁邊　夫子：指孔子　式：同「軾」，扶著車前的橫木，表示敬意　子路：孔子的學生　壹：實在　重：一再、好幾層　舅：丈夫的父親　焉：在這裡　苛政：殘酷的政令、繁重的賦稅　小子：你們這些學生　識：同「誌」，記住","trans":"孔子經過泰山旁邊，有個婦人在墓前哭得很悲傷。孔子扶著車前的橫木聽她哭，派子路去問她說：「你這樣哭，實在像是有好幾重傷心事的樣子。」婦人就說：「是的。從前我的公公被老虎咬死，我的丈夫也被老虎咬死，現在我的兒子又被老虎咬死了。」孔子說：「為什麼不離開這裡呢？」婦人說：「這裡沒有殘酷的政令。」孔子說：「學生們要記住，殘酷的政令比老虎還要兇猛啊！」","qs":[{"q":"「何為不去也」的「去」是什麼意思？","opts":["前往","距離","離開","去年"],"ans":"C","steps":["代回「為什麼不離開這裡呢」→ 通","婦人回答的是留下來的理由","兩小兒辯日「去人近」的去是距離，這裡不同 → 答 C"],"tests":"一字多義：去","avoid":"同一個字，每篇都要重新代回"},{"q":"「然。昔者吾舅死於虎」的「然」是什麼意思？","opts":["是的，對","但是","這樣地","燃燒"],"ans":"A","steps":["子路說她像有好幾重傷心事","婦人先回答「然」，再說家人都被虎咬死","是在承認子路說對了 → 答 A"],"tests":"一字多義：然","avoid":"回答問話開頭的然，是「是的」"},{"q":"婦人的家人都被老虎咬死，她卻不搬走，原因是？","opts":["她捨不得離開墓地","這裡沒有苛政","她不怕老虎","孔子叫她留下"],"ans":"B","steps":["孔子問：「何為不去也？」","婦人答：「無苛政。」","A、C、D 文中都沒說 → 答 B"],"tests":"找人物的理由","avoid":"問句後面的回答就是證據"},{"q":"孔子說「苛政猛於虎」，是從哪個事實推出來的？","opts":["老虎很兇猛","子路很怕老虎","泰山附近很危險","婦人寧願冒著被虎咬的危險，也不願搬到有苛政的地方"],"ans":"D","steps":["事實一：三代人都被老虎咬死","事實二：她還是不走，因為這裡「無苛政」","兩個事實放一起：苛政比老虎更可怕 → 答 D"],"tests":"兩個事實推結論","avoid":"推論要把兩個事實合起來"},{"q":"「子之哭也」的「子」指誰？","opts":["孔子","子路","婦人","婦人的兒子"],"ans":"C","steps":["這句是子路去問婦人時說的話","子＝你，指被問的人","被問的是正在哭的婦人 → 答 C"],"tests":"代詞「子」指誰","avoid":"子當「你」時，指聽話的那個人"}]}]},"cap":{"no":"會考實戰","title":"第 2 週會考實戰","skill":"會考解題技法：成語與詞語運用","steps":["❶ 拆字：把成語每個字的意思講出來","❷ 查真義：想想它真正的意思，小心望文生義","❸ 看對象：這個詞能用在人、事還是東西身上","❹ 看褒貶：句子需要稱讚還是批評","❺ 謙敬詞：謙詞說自己，敬詞說別人；家大舍小令外人"],"demo":{"q":"示範題：【111 年會考第 15 題】下列文句中的成語，何者使用最恰當？①這艘郵輪車水馬龍，可搭載數千名遊客　②他個性害羞，遇到陌生人時總是別開生面　③他為了得到好成績而因噎廢食，每晚都認真讀書　④這裡曾有許多珍藏，如今僅剩吉光片羽，令人唏噓","a":["→ 拆字：車水馬龍＝車像流水、馬像長龍；別開生面＝另外打開新的局面；因噎廢食＝吃東西噎到就不吃飯；吉光片羽＝神獸吉光的一小片毛","→ 查真義：別開生面不是「把臉別開」，是創造新風格，②是望文生義","→ 看對象：車水馬龍形容街道熱鬧，不是郵輪載客多，①對象錯了","→ 看褒貶：因噎廢食是批評人因小挫折放棄該做的事，③每晚認真讀書是好事，用反了","→ 吉光片羽＝留下來的少量珍貴東西，用在「僅剩」的珍藏上剛好","答：④"]},"teach":{"intro":"會考的成語題不是考你背多少成語，而是考你會不會把成語用對地方：意思對、對象對、褒貶對。","items":[{"t":"什麼是「望文生義」？","d":["只看字面就猜意思，結果猜錯，就叫望文生義","例：「汗牛充棟」不是教室充滿汗臭，是書多到拉車的牛流汗、堆滿整間屋子"],"ex":"就像聽到「火鍋」以為是著火的鍋子，其實是好吃的料理，字面和真正意思不一樣"},{"t":"什麼是「使用對象」？","d":["有些成語只能用在人，有些只能用在地方或東西","例：「不可救藥」只用在人；「車水馬龍」用在熱鬧的街道，不能用在郵輪載客"],"ex":"「蓋火鍋」是籃球場上的用語，拿去形容吃火鍋就怪怪的，詞語也有自己的球場"},{"t":"什麼是「褒貶」？","d":["褒是稱讚，貶是批評；句子要稱讚，就不能放批評的成語","例：「前倨後恭」是先傲慢後巴結，是批評，不能說謙和有禮的人"],"ex":"柴犬乖乖坐好要說「好棒」，咬壞拖鞋才說「壞狗狗」，說反了牠會搞不清楚"},{"t":"什麼是「謙詞」和「敬詞」？","d":["謙詞用在自己和家人，把自己說小一點；敬詞用在別人，把對方說大一點","口訣「家大舍小令外人」：比我大的家人用家（家父、家姐），比我小的用舍（舍弟），別人的家人用令（令尊）"],"ex":"隊友投進球，你說「你超強」是敬詞；別人誇你，你說「運氣好啦」是謙詞"}],"demo":["① 拆：每個成語先把字面講出來","② 查：別開生面不是把臉別開，車水馬龍是形容街道","③ 比：因噎廢食是批評，不能用在認真讀書；只剩吉光片羽用得對"]},"parts":[{"label":"第一篇","title":"111 年會考 第 6、17 題（單題）","text":[],"cite":"111 年國中教育會考國文科 第 6、17 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列體育新聞的說明何者⟦錯誤⟧？","opts":["東道主法國隊屈居第二：法國是主辦國","我國九局下逆轉，一分氣走韓國：我國轉輸為贏","波多黎各選手爆冷門奪金：各界看好波多黎各選手奪金","我國女將輕取哥倫比亞，晉級八強：我國女將大勝哥倫比亞"],"ans":"C","steps":["先圈題幹：問的是「錯誤」，要找說明講錯的那一個","拆字面再想真正意思：「冷門」是大家不看好的，「爆冷門」就是出乎大家意料地贏了","說明卻寫「各界看好」，意思剛好相反；東道主＝主人、逆轉＝轉輸為贏、輕取＝輕鬆贏，都對，所以選爆冷門那一個"],"tests":"詞語真正意思","avoid":"爆冷門＝大家沒想到，不是被看好"},{"q":"下列文句，何者文意通暢、用詞最為恰當？","opts":["此文件攸關計畫的成敗，你千萬要小心遞送","在遇到困難時，他反而不屈不撓，堅持妥協","他明明做錯事情還推給別人，真是死不賴帳","疫情蔓延的時候，我們更要一起對抗意志力"],"ans":"A","steps":["每句都把詞語代回去讀：「攸關」＝關係到，文件關係到計畫成敗，要小心送，通順","「不屈不撓」是不放棄，後面卻接「堅持妥協」（讓步），前後打架；推卸責任應該是「死不認帳」；要對抗的是疫情，意志力是要「堅定」的","只有第一句通順，選「攸關」那一句"],"tests":"詞語搭配","avoid":"詞語代回整句，看前後有沒有矛盾"}]},{"label":"第二篇","title":"110 年會考 第 12、15、21、24 題（單題）","text":[],"cite":"110 年國中教育會考國文科 第 12、15、21、24 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"「樹型直挺高壯的，無一不被畫上記號，陸續走向腰斬的命運。唯獨畸形虛弱的劣木，有的彎曲不直，有的枝枒過多，有的菌蟲蛀洞，有的矮小窄細，幸運地逃過一劫，殘喘至今，成了旅客心中敬畏的神木。」這段文字所要表達的意旨，與下列何者最接近？","opts":["前事不忘，後事之師","無用之用，是為大用","一沙一世界，一花一天堂","出淤泥而不染，濯清漣而不妖"],"ans":"B","steps":["先抓重點：好木材都被砍了，沒用的「劣木」反而活下來，變成人人敬畏的神木","每個選項拆字面：「無用之用，是為大用」＝看起來沒用的，反而有大用處，正好對上","其他是記取教訓、小東西藏大道理、身處壞環境不被汙染，都和「沒用反而有用」無關"],"tests":"語句意旨對應","avoid":"先用一句話說出原文重點再比對"},{"q":"下列文句「」中的詞語，何者使用最恰當？","opts":["既然每個人選都很優秀，不如「兩害相權取其輕」","窮困之際竟幸運中了頭獎，真是有如「雨後春筍」","他把這些事混為一談，其實根本是「風馬牛不相及」","比賽中就算占上風也要保持謹慎，以免「轉悲為喜」"],"ans":"C","steps":["拆字面：「兩害相權取其輕」是兩個都不好，挑傷害小的；人選都很優秀，不是「害」，用錯","「雨後春筍」形容東西一下子冒出很多，不是好運；占上風要小心的是「轉勝為敗」，「轉悲為喜」是好事，不必「以免」","「風馬牛不相及」＝彼此毫無關係，這些事根本無關卻被混為一談，用得對"],"tests":"成語本義","avoid":"先拆字面，再看句子情境合不合"},{"q":"下列文句，何者詞語使用最恰當？","opts":["他為人謙和有禮，總是前倨後恭","曾幾何時，家鄉景物已完全改變","他一進車廂，就先入為主搶了靠窗座位","體育課後教室變得汗牛充棟，又臭又悶"],"ans":"B","steps":["小心望文生義：「先入為主」不是先進去的人當主人，而是先聽到的說法占了心裡；「汗牛充棟」不是汗味，是書多到牛拉車都流汗、堆滿屋子","「前倨後恭」＝先傲慢後恭敬，是貶義，不能形容謙和有禮的人","「曾幾何時」＝才過了沒多久，家鄉沒多久就全變了，用得對"],"tests":"望文生義陷阱","avoid":"字面好像對時，查查成語真正的典故"},{"q":"「讀書若是□□□□，便把活潑的讀書心性束縛了。窮研細究，把通篇文章分析得支離破碎，結果往往化甘旨為嚼蠟，脫離了意境，『甚解』卻變成撿了芝麻丟西瓜，因小失大。」根據文意脈絡，空格處填入下列何者最恰當？","opts":["茫然不解","一知半解","不求甚解","逐字求解"],"ans":"D","steps":["先找線索：空格後面說「窮研細究，把通篇文章分析得支離破碎」，是太過仔細、一個字一個字挖","「不求甚解」看到「甚解」很像陷阱，但它的意思是不去深究，剛好相反；「茫然不解」「一知半解」是讀不懂，也不是太仔細","太仔細、一字一字分析，就是「逐字求解」"],"tests":"成語填空看線索","avoid":"別看到熟悉的字就選，回原文找證據"}]},{"label":"第三篇","title":"111 年會考 第 12、19 題（單題）","text":[],"cite":"111 年國中教育會考國文科 第 12、19 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列選項「」中的字，何組讀音相同？","opts":["悲傷哽「咽」／食不下「咽」","悶不「吭」聲／引「吭」高歌","語帶「禪」機／「禪」讓政治","「撒」謊成習／恃寵「撒」嬌"],"ans":"D","steps":["破音字看意思：哽咽是哭到說不出話（ㄧㄝˋ），食不下咽是吞不下去（ㄧㄢˋ），讀音不同","「悶不吭聲」是不出聲（ㄎㄥ），「引吭高歌」的吭是喉嚨（ㄏㄤˊ）；「禪機」是佛理（ㄔㄢˊ），「禪讓」是讓位（ㄕㄢˋ）","撒謊、撒嬌的撒都是「放出來」的意思，都唸ㄙㄚ，讀音相同"],"tests":"成語中的破音字","avoid":"破音字先想意思，再決定讀音"},{"q":"下列詞語「」中的注音寫成國字後，何者兩兩相同？","opts":["杞人「ㄧㄡ」天／養尊處「ㄧㄡ」","「ㄅㄢ」駁陸離／「ㄅㄢ」斕奪目","自相「ㄇㄠˊ」盾／「ㄇㄠˊ」塞頓開","細嚼「ㄇㄢˋ」嚥／「ㄇㄢˋ」不經心"],"ans":"B","steps":["拆成語的字面意思選字：杞人「憂」天是擔心；養尊處「優」是優渥的生活","自相「矛」盾是兵器矛；「茅」塞頓開是像茅草堵住忽然打開；細嚼「慢」嚥是慢慢；「漫」不經心是隨便","「斑」駁陸離、「斑」斕奪目都是顏色雜錯的斑紋，兩個字相同"],"tests":"成語用字","avoid":"寫字前先想這個字在成語裡的意思"}]},{"label":"第四篇","title":"111 年會考 第 14 題（單題）","text":[],"cite":"111 年國中教育會考國文科 第 14 題（國家教育研究院心測中心）","notes":"","trans":"修養品德當作弓，矯正思想當作箭，確立道義當作箭靶，心定了以後再射，一射一定射中。","qs":[{"q":"「修身以為弓，矯思以為矢，立義以為的，定而後發，發必中矣。」句中「矯」字的意義，與下列何者最接近？","opts":["「矯」世勵俗","「矯」若遊龍","「矯」捷身手","「矯」託天命"],"ans":"A","steps":["先組詞代回原句：「矯思」組成「矯正思想」，和「修身」「立義」都是讓自己變好的事，通順","成語拆字：矯世勵俗＝矯正世風、勉勵風俗，也是「矯正」；矯若遊龍、矯捷身手是強健靈活；矯託天命是假借名義","意思一樣的是「矯世勵俗」"],"tests":"成語拆字比字義","avoid":"組詞代回原句，再拆成語比一比"}]},{"label":"第五篇","title":"110 年會考 第 11 題（單題）","text":[],"cite":"110 年國中教育會考國文科 第 11 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列文句「」中的稱謂，何者使用最恰當？","opts":["謝謝您的蒞臨，「貴校」蓬蓽生輝","「小女」的于歸之宴，請您務必賞光","「家弟」近期要搬家，忙得不可開交","為了準備求職面試，「舍姐」緊張不已"],"ans":"B","steps":["先分謙詞、敬詞：對自己家人用謙詞，對別人用敬詞。口訣「家大舍小令外人」：比我大的用家，比我小的用舍","「蓬蓽生輝」是說自己簡陋的地方因你來而發光，要說「敝校」不是「貴校」；弟弟比我小要說「舍弟」；姐姐比我大要說「家姐」","「小女」是謙稱自己的女兒，于歸是出嫁，請客人來喝喜酒，用得對"],"tests":"謙詞敬詞稱謂","avoid":"記口訣：家大舍小令外人"}]},{"label":"第六篇","title":"111 年會考 第 2 題（單題）","text":[],"cite":"111 年國中教育會考國文科 第 2 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"黃醫師的眼科診所開業，親友們登門慶賀。君翰帶來一方寫著「杏林之光」的匾額，聊表心意。思涵見狀馬上說：「如果寫『近悅遠來』更好。」偉同則說：「可是，我覺得『眾望所歸』更恰當。」最後嘉恩才說：「其實，『桃李芬芳』才是最合適的選擇。」\n根據這段對話，誰的做法或說法最恰當？","opts":["君翰","思涵","偉同","嘉恩"],"ans":"A","steps":["題辭先看對象：這次是「眼科診所開業」，要找送醫生的話","拆字面：「杏林」是醫界的代稱，「杏林之光」稱讚醫生；「近悅遠來」送商店，「眾望所歸」送當選的人，「桃李芬芳」送老師","所以帶「杏林之光」來的君翰最恰當"],"tests":"題辭使用對象","avoid":"題辭先想送給哪一行"}]},{"label":"第七篇","title":"112 年會考 第 9 題（單題）","text":[],"table":[["單位","題辭"],["美滿家具店","版築有功"],["幸福大飯店","貴客盈門"],["健康醫院","仁心仁術"],["快樂國小","桃李滿門"]],"cite":"112 年國中教育會考國文科 第 9 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"小平欲致贈匾額祝賀下列四個單位，匾額上所使用的題辭何者⟦不恰當⟧？","opts":["美滿家具店／版築有功","幸福大飯店／貴客盈門","健康醫院／仁心仁術","快樂國小／桃李滿門"],"ans":"A","steps":["先圈題幹：問「不恰當」，要找配錯的那一組","拆字面：「版築」是古代夾板築土牆，蓋房子的方法，「版築有功」是送建築業、營造廠的","家具店不是蓋房子；飯店客人多、醫院仁心、學校學生多，都配得上，所以選家具店那一組"],"tests":"題辭使用對象","avoid":"拆開題辭的字，想它屬於哪一行"}]},{"label":"第八篇","title":"111 年會考 第 8、10、23 題（單題）","text":[],"cite":"111 年國中教育會考國文科 第 8、10、23 題（國家教育研究院心測中心）","notes":"願以境內累矣：希望勞煩您協助國事　笥：放物品的竹器","trans":"第 8 題：陸公曾經在市場遇到一塊好硯臺，價錢還沒談好。回到住處後，派門人去，用一兩金子買回來。門人拿著硯臺回來，陸公很驚訝它不像原來那塊。門人堅持說就是那塊。陸公說：「先前看這硯臺有鴝鵒眼，現在怎麼沒有了？」門人回答：「我嫌它有點凸起，路上遇到石匠，叫他磨平了。」陸公非常惋惜。　第 10 題：名聲不可以靠僥倖得到。天下的事，本來就有外表相似、裡面其實不是那樣的。靠著外表相似偷來名聲，不是不能騙人一時，但以後別人照著那個外表去找真本事，真相就會露出來，沒有不立刻失敗的。　第 23 題：莊子在濮水邊釣魚，楚王派兩位大夫先去拜訪，說：「希望勞煩您協助國事！」莊子拿著釣竿頭也不回，說：「我聽說楚國有一隻神龜，死了已經三千年，楚王用布包著、放在竹器裡，收藏在廟堂上。這隻龜，是寧願死了留下骨頭被人尊貴呢，還是寧願活著在泥巴裡拖著尾巴爬呢？」兩位大夫說：「寧願活著在泥巴裡拖著尾巴。」莊子說：「你們走吧！我也要在泥巴裡拖著尾巴。」","qs":[{"q":"陸公嘗於市遇一佳硯，議價未定。既還邸，使門人往，以一金易歸。門人持硯歸，公訝其不類。門人堅證其是。公曰：「向觀硯有鴝鵒眼，今何無之？」答曰：「吾嫌其微凸，路遇石工，令磨而平之。」公大惋惜。\n下列關於故事中人物的敘述，何者最恰當？","opts":["門人買錯硯臺卻不知道","陸公惋惜是因石工技藝不佳","門人請人磨平硯眼是自作聰明","陸公對門人購硯的價格感到驚訝"],"ans":"C","steps":["找證據：門人「嫌其微凸」，自己作主叫石匠磨平，硯臺最珍貴的鴝鵒眼就沒了，陸公「大惋惜」","成語拆字：「自作聰明」＝自以為聰明，擅自去做，結果壞了事，正好是門人的行為","門人沒買錯；陸公可惜的是硯眼沒了，不是石工技術差；驚訝的是樣子不像，不是價錢，所以選自作聰明"],"tests":"成語形容人物","avoid":"成語要對上人物做的事和結果"},{"q":"「名不可以倖取也。天下之事，固有外似而中實不然者。倖其似而竊其名，非不可以欺一時，然他日人即其似而求其真，則情現實吐，無不立敗。」下列何者最能與這段文字的意旨相呼應？","opts":["因其貌不揚被小看，沒想到靠著精湛演技成為影帝","不勞而獲的錢財，因為來得容易，往往被輕易揮霍","以作弊手段考上名校，最後卻因適應不良而中輟學業","當不切實際的夢想碰到冷酷的現實，也只能化為泡影"],"ans":"C","steps":["先抓重點：名聲不能靠僥倖偷來，一時騙得過，真正被檢驗時就會失敗","對照選項要有兩件事：先用假的方法拿到名，後來露出真本事不夠而失敗","作弊考上名校（偷來的名）、後來跟不上而中輟（失敗），兩件事都對上"],"tests":"語句意旨對應","avoid":"選項要同時對上原文的前因和後果"},{"q":"莊子釣於濮水，楚王使大夫二人往先焉，曰：「願以境內累矣！」莊子持竿不顧，曰：「吾聞楚有神龜，死已三千歲矣，王巾笥而藏之廟堂之上。此龜者，寧其死為留骨而貴乎，寧其生而曳尾於塗中乎？」二大夫曰：「寧生而曳尾塗中。」莊子曰：「往矣！吾將曳尾於塗中。」\n根據這段文字，下列何者與莊子的想法最接近？","opts":["人死留名，虎死留皮","不慕榮利，唯願逍遙","神龜雖壽，猶有竟時","寧鳴而死，不默而生"],"ans":"B","steps":["找證據：楚王請莊子當官，莊子「持竿不顧」，還說寧願像烏龜活著在泥巴裡拖尾巴","拆字面：死後被供在廟堂＝榮華富貴；活著在泥巴裡＝自由自在。莊子選後者，就是不羨慕名利、只想逍遙","人死留名、寧鳴而死都是看重死後的名聲；神龜雖壽是說壽命有盡頭，都不對"],"tests":"成語語句呼應","avoid":"把比喻翻成白話，再對成語"}]},{"label":"第九篇","title":"112 年會考 第 30～31 題（題組）","text":["寒假期間的圖書館，呈現一種難得的閒逸姿態。這一棟半圓形的八層樓建築，環壁皆書，中間留下跟應用坪數相等的半圓形空間。從五樓俯望，偌大的建築顯得十分空洞。陰冷盤踞了多餘的空間，恍如進入一座潔淨，但森冷的納骨塔。整齊有序的書本，宛如一個個編號的骨灰罈，罈子裡都裝載著作者的魂。也許讀書的心都冬眠去了，這些思考宇宙大道，辯解生命本質的沉重書魂，都顯得有些黯然。","我通過文字開啟深邃寬廣的知識世界，同時釋放囚在罈子裡的書魂。我們的交談安靜而無聲。這種滅音的交談沒有負擔，對方的想法不盡完善，就在架上搜尋互為補強的觀點，讓不同意見的寄魂去辯駁。年輕的書魂總是按捺不住脾氣，氣勢凌厲且偏激；老書魂則不動如山，總能敗部復活，在逆境裡扭轉乾坤。讀書比看戲更令人著迷，難怪有不少讀者活著的時候就心甘情願把自己埋進納骨塔，想來精彩的書還真有勾魂攝魄的魅力。","——改寫自鍾怡雯〈藏魂〉"],"cite":"112 年國中教育會考國文科 第 30～31 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"文中「活著的時候就心甘情願把自己埋進納骨塔」的涵義，與下列何者最接近？","opts":["獲得精神食糧，沉浸書堆","倡導終身學習，推廣閱讀","喪失生命熱情，心如死灰","甘心隱姓埋名，不慕榮利"],"ans":"A","steps":["別望文生義：「埋進納骨塔」不是真的死掉，前文早就把圖書館比成納骨塔、書比成骨灰罈","所以「把自己埋進納骨塔」＝把自己埋進圖書館的書堆裡；後面又說書有「勾魂攝魄的魅力」，是開心地沉迷","「心如死灰」是照字面誤會；「隱姓埋名」也是把「埋」看成字面，答案是沉浸書堆"],"tests":"比喻的真正涵義","avoid":"先找前文把什麼比成什麼"},{"q":"關於本文的寫作手法，下列敘述何者最恰當？","opts":["藉由宏偉的建築，對比個人的渺小","以不同年齡層的閱讀習慣，凸顯世代差異","將靜態的閱讀比擬為交談，產生動態的效果","視線推移自室內延伸至室外，強調知識的寬廣"],"ans":"C","steps":["找證據：第二段說「我們的交談安靜而無聲」，把讀書寫成跟書魂說話，還讓書魂「辯駁」「發脾氣」","讀書本來是安靜不動的，寫成交談、吵架，就有了動態的感覺","「年輕的書魂」「老書魂」說的是書，不是讀者的年齡；全文都在館內，沒有寫到室外，所以選比擬為交談"],"tests":"寫作手法","avoid":"年輕、老是在說誰，要看清主詞"}]}]}},{"week":3,"groups":[{"no":"第 1 組","title":"王戎識李","skill":"古今異義：古今意思不一樣","steps":["❶ 看到很熟的字，先停一下：古代也是這個意思嗎？","❷ 用現代意思代回去讀，覺得怪怪的就是警訊","❸ 換成古代意思（走＝跑、去＝離開、子＝你或果實）再讀一次","❹ 用前後文確認：讀得通、合情理才是答案"],"demo":{"q":"「諸兒競走取之」的「走」是什麼意思？","a":["→ 用現代的「走路」代回：小孩們比賽走路去摘？怪怪的","→ 用古代的「跑」代回：小孩們搶著跑去摘李子 → 通","答：跑"]},"parts":[{"label":"第一篇","title":"王戎識李","text":["王戎七歲，嘗與諸小兒遊。看道邊李樹多子折枝，諸兒競走取之，唯戎不動。人問之，答曰：「樹在道邊而多子，此必苦李。」取之，信然。"],"cite":"《世說新語．雅量》","notes":"王戎：晉朝人　嘗：曾經　諸：許多　遊：玩耍　折枝：把樹枝壓彎、壓斷　競：搶著　唯：只有","trans":"王戎七歲的時候，曾經和許多小孩一起玩。看見路邊的李樹結了很多果實，把樹枝都壓彎了，小孩們都搶著跑去摘，只有王戎不動。有人問他為什麼，他回答：「樹長在路邊，卻還結了這麼多果實，這一定是苦的李子。」摘來一嚐，果然是這樣。","qs":[{"q":"「看道邊李樹多子折枝」的「子」是什麼意思？","opts":["果實","兒子","你","小孩"],"ans":"A","steps":["找證據：「李樹多子折枝」，主角是李樹","樹不會有兒子；多到把樹枝壓彎的，是果實","古今異義：子在這裡＝果實"],"tests":"古今異義：子","avoid":"「子」先看前面是人還是樹"},{"q":"「諸兒競走取之」的「走」是什麼意思？","opts":["走路","離開","走漏","跑"],"ans":"D","steps":["代回現代的「走路」：比賽走路去摘？不合常理","代回古代的「跑」：搶著跑去摘 → 通","「競」是搶著，搶著當然是用跑的"],"tests":"古今異義：走","avoid":"看到「走」，先換成「跑」讀讀看"},{"q":"「取之，信然」的「信」是什麼意思？","opts":["書信","果然","相信","誠實"],"ans":"B","steps":["前面王戎說「此必苦李」","「取之」摘來一嚐，接著「信然」","結果和王戎說的一樣 → 信＝果然"],"tests":"古今異義：信","avoid":"「信然」就讀成「果然如此」"},{"q":"王戎怎麼知道那是苦李？","opts":["他以前嚐過這棵樹的李子","他看出李子的顏色是綠的","其他小孩先告訴他的","路邊的樹人人摘得到，卻還結滿果實，表示沒人想摘"],"ans":"D","steps":["找王戎說的話：「樹在道邊而多子」","在路邊，誰經過都能摘，卻還有這麼多果實","沒人要摘 → 一定不好吃"],"tests":"從證據推論","avoid":"答案要從人物說的話裡找"}]},{"label":"第二篇","title":"鍾毓鍾會","text":["鍾毓、鍾會少有令譽。年十三，魏文帝聞之，語其父鍾繇曰：「可令二子來。」於是敕見。毓面有汗，帝曰：「卿面何以汗？」毓對曰：「戰戰惶惶，汗出如漿。」復問會：「卿何以不汗？」對曰：「戰戰慄慄，汗不敢出。」"],"cite":"《世說新語．言語》","notes":"鍾毓、鍾會：兄弟兩人　譽：名聲　語：告訴　敕見：皇帝下令召見　卿：你（皇帝稱臣子）　惶惶：害怕　漿：湯水　慄慄：發抖","trans":"鍾毓、鍾會兄弟年少時就有好名聲。十三歲時，魏文帝聽說了，告訴他們的父親鍾繇說：「可以叫你的兩個兒子來見我。」於是下令召見。鍾毓臉上有汗，文帝問：「你臉上為什麼出汗？」鍾毓回答：「我又緊張又害怕，汗像湯水一樣流出來。」文帝又問鍾會：「你為什麼不出汗？」鍾會回答：「我緊張害怕得發抖，汗都不敢流出來。」","qs":[{"q":"「少有令譽」的「令譽」是什麼意思？","opts":["皇帝的命令","很少的稱讚","好名聲","讓人羨慕的獎品"],"ans":"C","steps":["譽＝名聲（注釋）","皇帝聽說後還想見他們，可見名聲很好","令在這裡＝美好，不是現代的「命令」"],"tests":"古今異義：令","avoid":"「令」放在名詞前，常是美好"},{"q":"「少有令譽」的「少」是什麼意思？","opts":["很少","缺少","少數","年少的時候"],"ans":"D","steps":["代回「很少」：很少有好名聲？那皇帝怎麼會想見","後面接著說「年十三」，講的是年紀","少（ㄕㄠˋ）＝年少"],"tests":"古今異義：少","avoid":"「少」後面講年紀，就是年少"},{"q":"「可令二子來」的「二子」是指誰？","opts":["鍾毓和鍾會兄弟","魏文帝的兩個兒子","兩個學生","隨便兩個小孩"],"ans":"A","steps":["這句話是對「其父鍾繇」說的","對父親說「二子」→ 他的兩個兒子","就是開頭的鍾毓、鍾會"],"tests":"古今異義：子＝兒子","avoid":"先看說話的對象是誰"},{"q":"鍾會說「汗不敢出」，最能看出他什麼特點？","opts":["一點也不害怕皇帝","反應很快，能順著問題巧妙回答","身體不容易流汗","不想回答皇帝"],"ans":"B","steps":["皇帝問：你為什麼不出汗","鍾會說「戰戰慄慄」，表示他也在發抖、也害怕","把不流汗說成怕到汗不敢出，回答得很巧妙"],"tests":"推論人物特點","avoid":"人物說的話就是證據"}]},{"label":"第三篇","title":"人琴俱亡","text":["王子猷、子敬俱病篤，而子敬先亡。子猷問左右：「何以都不聞消息？此已喪矣。」語時了不悲。便索輿來奔喪，都不哭。子敬素好琴，便徑入坐靈床上，取子敬琴彈，弦既不調，擲地云：「子敬，子敬，人琴俱亡！」因慟絕良久。"],"cite":"《世說新語．傷逝》（節選）","notes":"王子猷、子敬：王徽之、王獻之兄弟，子敬是弟弟　何以：為什麼　了：完全　索：要　輿：轎子　徑：直接　靈床：停放死者的床　調：音調和諧　慟絕：哭得昏過去　良久：很久","trans":"王子猷、王子敬兄弟都病得很重，子敬先過世了。子猷問身邊的人：「為什麼一點都沒聽到子敬的音訊？他一定已經死了。」說話時完全不顯得悲傷。他就叫人備轎去奔喪，一路都沒有哭。子敬向來喜歡彈琴，子猷便直接走進去坐在靈床上，拿子敬的琴來彈，弦怎麼調都不和諧，他把琴摔到地上說：「子敬啊子敬，你人和琴都不在了！」接著哭得昏了過去，很久才醒來。","qs":[{"q":"「王子猷、子敬俱病篤」是什麼意思？","opts":["兩人都有一點小毛病","兩人都很擔心對方","兩人都病得很重","只有子敬生了重病"],"ans":"C","steps":["「俱」＝都，像「面面俱到」的俱：兩個人都","「篤」形容程度很深，「病篤」就是病得很重","後面「子敬先亡」，可見不是小毛病，兩人都病重"],"tests":"古今異義：病","avoid":"古文的「病」比現在嚴重"},{"q":"「子猷問左右」的「左右」指什麼？","opts":["左邊和右邊","大約、差不多","左右兩隻手","身邊的僕人"],"ans":"D","steps":["「問」的對象一定是人","方向和手都不能被問","古代「左右」常指身邊服侍的人"],"tests":"古今異義：左右","avoid":"「問左右」就是問身邊的人"},{"q":"「子敬素好琴」的「素」是什麼意思？","opts":["向來","白色的","吃素","樸素"],"ans":"A","steps":["代回「白色的」：子敬白色喜歡琴？不通","代回「向來」：子敬向來喜歡琴 → 通","所以子猷才拿他的琴來彈"],"tests":"古今異義：素","avoid":"素放在動作前，常是向來"},{"q":"子猷一開始「了不悲」，後來卻「慟絕良久」，轉變的原因是？","opts":["別人告訴他子敬已經死了","彈子敬的琴卻彈不成調，想到人和琴都不在了","他覺得奔喪太累","他的病變得更重"],"ans":"B","steps":["找轉變前發生的事：「弦既不調，擲地云」","他說出「人琴俱亡」，接著「因慟絕良久」","「因」＝於是，前面彈琴這件事就是原因"],"tests":"找轉變的原因","avoid":"找「因」前面發生的事"}]},{"label":"第四篇","title":"周處除三害","text":["周處年少時，兇強俠氣，為鄉里所患。又義興水中有蛟，山中有白額虎，並皆暴犯百姓。義興人謂為「三橫」，而處尤劇。或說處殺虎斬蛟，實冀三橫唯餘其一。"],"cite":"《世說新語．自新》（節選）","notes":"周處：晉朝人　兇強：兇暴強橫　俠氣：好勇鬥狠　義興：地名　蛟：傳說中像龍的動物　白額虎：額頭有白毛的老虎　暴犯：侵害　三橫：三大禍害　尤劇：最嚴重　或：有人　實：其實　冀：希望","trans":"周處年輕的時候，兇暴強橫、好勇鬥狠，被家鄉的人當成禍害。另外，義興的河裡有蛟，山裡有額頭長白毛的老虎，都在侵害百姓，義興人把牠們和周處合稱「三橫」，而周處最嚴重。有人勸周處去殺老虎、斬蛟，其實是希望三橫只剩下一個。","qs":[{"q":"「為鄉里所患」的「患」是什麼意思？","opts":["生病","當成禍害、擔心","病人","患難的朋友"],"ans":"B","steps":["前面：周處「兇強俠氣」，很兇","兇的人會讓家鄉的人擔心、害怕","「為……所患」＝被……當成禍害"],"tests":"古今異義：患","avoid":"「為……所」是被動，先找誰被誰"},{"q":"「或說處殺虎斬蛟」的「說」是什麼意思？","opts":["高興","講故事","解釋","勸"],"ans":"D","steps":["代回「高興」：有人高興周處殺虎？不通","代回「勸」：有人勸周處去殺虎斬蛟 → 通","說（ㄕㄨㄟˋ）＝勸說"],"tests":"古今異義：說","avoid":"說＋人＋做事，常是勸人"},{"q":"「三橫」指的是哪三個？","opts":["蛟、白額虎和周處","三隻老虎","蛟、老虎和義興人","三條河裡的蛟"],"ans":"A","steps":["前面列出：水中有蛟、山中有白額虎","「而處尤劇」：周處是三橫裡最嚴重的","所以三橫＝蛟、虎、周處"],"tests":"找代稱指誰","avoid":"「尤」表示他也在同一群裡"},{"q":"勸周處的人「實冀三橫唯餘其一」，真正的想法是？","opts":["真心佩服周處的力氣","讓周處和蛟、虎去拚，三害最後只剩一個","希望周處成為英雄","想替周處報仇"],"ans":"B","steps":["實＝其實（注釋），後面才是真心話","冀＝希望，唯餘其一＝只剩其中一個","周處也是三橫之一，所以不是真心誇他"],"tests":"推論真正用意","avoid":"看到「實」，後面才是真心話"}]},{"label":"第五篇","title":"孔融被收","text":["孔融被收，中外惶怖。時融兒大者九歲，小者八歲。二兒故琢釘戲，了無遽容。融謂使者曰：「冀罪止於身，二兒可得全不？」兒徐進曰：「大人豈見覆巢之下，復有完卵乎？」尋亦收至。"],"cite":"《世說新語．言語》","notes":"孔融：東漢人，就是讓梨的孔融　中外：朝廷內外　惶怖：驚慌害怕　琢釘戲：一種小孩玩的遊戲　了：完全　遽：驚慌　使者：來抓人的官員　冀：希望　全：保全　不：同「否」　豈：難道　覆：翻倒","trans":"孔融被逮捕，朝廷內外都很驚慌。當時孔融的兒子，大的九歲，小的八歲，兩個孩子仍舊在玩琢釘遊戲，完全沒有驚慌的樣子。孔融對來抓人的官員說：「希望罪只到我一個人為止，兩個孩子能不能保全？」孩子慢慢走上前說：「父親難道見過翻倒的鳥巢下，還有完整的蛋嗎？」不久，抓孩子的人也來了。","qs":[{"q":"「孔融被收」的「收」是什麼意思？","opts":["收到禮物","收拾東西","逮捕","收入"],"ans":"C","steps":["後面「中外惶怖」：大家都很害怕","孔融還求官員保全兒子，可見他被定了罪","收在這裡＝逮捕"],"tests":"古今異義：收","avoid":"看後面大家的反應來判斷"},{"q":"「兒徐進曰」的「徐」是什麼意思？","opts":["姓徐的","很快地","慢慢地","偷偷地"],"ans":"C","steps":["前面說兩個孩子「了無遽容」：完全不慌","不慌張的人，走路是慢慢的","徐＝慢慢地"],"tests":"古今異義：徐","avoid":"用人物當時的心情來判斷"},{"q":"「大人豈見覆巢之下」的「大人」指誰？","opts":["孔融","來抓人的官員","所有成年人","皇帝"],"ans":"A","steps":["這句是「兒」說的，前面孔融剛說完話","兒子回應父親 →「大人」是稱呼父親","古代子女稱父母為大人，和現在不同"],"tests":"稱謂：大人＝父親","avoid":"先找說話的人和對象"},{"q":"「尋亦收至」的「尋」是什麼意思？","opts":["尋找","尋常","不久","追問"],"ans":"C","steps":["代回「尋找」：尋找也收到？不通","代回「不久」：不久抓孩子的人也到了 → 通","正好應驗了「覆巢之下」那句話"],"tests":"古今異義：尋","avoid":"句首的「尋」常是不久"}]}]},{"no":"第 2 組","title":"詠雪","skill":"對話題：找出是誰說的","steps":["❶ 圈出每個「曰」「云」「問」，往前找說話的人","❷ 「曰」前面沒有人名？看上一句是誰問，這句通常是被問的人答","❸ 稱謂換算：兄子＝哥哥的兒子；卿、子、汝、爾＝你；吾、臣、妾＝我","❹ 看引號：「」裡面才是人物說的話，外面是作者的敘述"],"demo":{"q":"「撒鹽空中差可擬」是誰說的？","a":["→ 找「曰」前面：「兄子胡兒曰」","→ 稱謂換算：兄子＝謝太傅哥哥的兒子，名叫胡兒","答：謝太傅的姪子胡兒"]},"parts":[{"label":"第一篇","title":"詠雪","text":["謝太傅寒雪日內集，與兒女講論文義。俄而雪驟，公欣然曰：「白雪紛紛何所似？」兄子胡兒曰：「撒鹽空中差可擬。」兄女曰：「未若柳絮因風起。」公大笑樂。即公大兄無奕女，左將軍王凝之妻也。"],"cite":"《世說新語．言語》","notes":"謝太傅：謝安　內集：家人聚會　講論文義：討論文章的意思　驟：急、大　欣然：高興的樣子　何所似：像什麼　差可擬：差不多可以相比　柳絮：柳樹帶白毛的種子，會隨風飄　因：順著　無奕：謝安的大哥謝奕","trans":"一個寒冷的下雪天，謝太傅把家人聚在一起，和子姪們討論文章。不久雪下得又急又大，謝太傅高興地問：「這紛紛飄落的白雪像什麼呢？」他哥哥的兒子胡兒說：「把鹽撒在空中，差不多可以相比。」他哥哥的女兒說：「不如比作柳絮順著風飛起來。」謝太傅高興得大笑。這個女孩就是謝太傅大哥謝無奕的女兒，左將軍王凝之的妻子。","qs":[{"q":"「公欣然曰」的「公」指誰？","opts":["胡兒","謝太傅","王凝之","無奕"],"ans":"B","steps":["往前找：文章開頭的主角是「謝太傅」","「公」是對長輩、有地位的人的尊稱","後面「公大兄無奕」也證明公＝謝太傅"],"tests":"稱謂：公指誰","avoid":"「公」往前找最有地位的人"},{"q":"「未若柳絮因風起」是誰說的？","opts":["謝太傅的女兒","胡兒","王凝之","謝太傅大哥的女兒"],"ans":"D","steps":["找「曰」前面：「兄女曰」","稱謂換算：兄女＝謝太傅哥哥的女兒","最後一句也說她是「公大兄無奕女」"],"tests":"稱謂換算","avoid":"「兄女」是哥哥的女兒，不是女兒"},{"q":"「俄而雪驟」的「俄而」是什麼意思？","opts":["突然停止","不久","很久以後","一會兒又停了"],"ans":"B","steps":["前面：家人聚在一起討論文章","接著雪下大了，謝太傅才出題","代回「不久雪下大了」→ 通"],"tests":"時間詞：俄而","avoid":"俄而＝不久，背起來"},{"q":"「白雪紛紛何所似？」是誰問、問誰？","opts":["胡兒問謝太傅","謝太傅問子姪們","兄女問胡兒","王凝之問謝太傅"],"ans":"B","steps":["找「曰」前面：「公欣然曰」→ 謝太傅問的","問的對象：前面「與兒女講論文義」","古代「兒女」指子姪輩，所以是問子姪們"],"tests":"找說話者和對象","avoid":"問句要找誰問、問誰"}]},{"label":"第二篇","title":"雪夜訪戴","text":["王子猷居山陰，夜大雪，眠覺，開室，命酌酒。四望皎然，因起彷徨，詠左思〈招隱〉詩。忽憶戴安道，時戴在剡，即便夜乘小船就之。經宿方至，造門不前而返。人問其故，王曰：「吾本乘興而行，興盡而返，何必見戴？」"],"cite":"《世說新語．任誕》","notes":"王子猷：王徽之　山陰：地名　覺：醒來　酌：倒酒　皎然：潔白明亮　彷徨：走來走去　左思〈招隱〉詩：晉朝左思寫的詩　戴安道：戴逵，王子猷的朋友　剡：地名　就：到……那裡　經宿：過了一夜　造：到　興：興致","trans":"王子猷住在山陰，一天夜裡下大雪，他睡醒了，打開房門，叫人倒酒，四處望去一片潔白明亮。於是起身走來走去，吟誦左思的〈招隱〉詩。忽然想起戴安道，當時戴安道在剡縣，他就連夜坐小船去找他。過了一夜才到，到了門口卻不進去，轉身就回來了。有人問他原因，王子猷說：「我本來是趁著興致去的，興致沒了就回來，何必一定要見到戴安道呢？」","qs":[{"q":"「吾本乘興而行」的「吾」指誰？","opts":["王子猷","戴安道","問問題的人","左思"],"ans":"A","steps":["找「曰」前面：「王曰」→ 王子猷說的","「吾」＝我，指說話的人自己","所以吾＝王子猷"],"tests":"稱謂：吾＝我","avoid":"「吾」就是「曰」前面那個人"},{"q":"「人問其故」，是問哪件事的原因？","opts":["王子猷半夜叫人倒酒","戴安道住在剡縣","王子猷吟誦詩","王子猷到了門口卻不進去就回來"],"ans":"D","steps":["往前一句：「造門不前而返」","別人問的就是這件奇怪的事","王子猷答「興盡而返」，也是在說為什麼回來"],"tests":"代詞「其」指什麼","avoid":"「其故」往前一句找"},{"q":"「即便夜乘小船就之」的「之」指誰？","opts":["王子猷","左思","山陰的人","戴安道"],"ans":"D","steps":["前一句「忽憶戴安道，時戴在剡」","就＝到……那裡，連夜坐船去找剛想起的人","之＝戴安道"],"tests":"代詞「之」指誰","avoid":"「之」往前找剛提到的人"},{"q":"下列哪一句「不是」王子猷說的話，而是作者的敘述？","opts":["吾本乘興而行","時戴在剡","興盡而返","何必見戴"],"ans":"B","steps":["看引號：「」裡才是王子猷說的話","「吾本乘興而行……何必見戴」都在引號裡","「時戴在剡」在引號外，是作者交代背景"],"tests":"分說話和敘述","avoid":"引號外面是作者在說"}]},{"label":"第三篇","title":"石崇王愷爭豪","text":["石崇與王愷爭豪，並窮綺麗以飾輿服。武帝，愷之甥也，每助愷。嘗以一珊瑚樹高二尺許賜愷，枝柯扶疏，世罕其比。愷以示崇；崇視訖，以鐵如意擊之，應手而碎。愷既惋惜，又以為疾己之寶，聲色甚厲。崇曰：「不足恨，今還卿。」"],"cite":"《世說新語．汰侈》（節選）","notes":"爭豪：比誰更有錢、更奢華　窮：用盡　綺麗：華美的東西　輿服：車子和衣服　許：左右　枝柯扶疏：枝條繁茂　罕：少　訖：完畢　如意：一種器物　應手：隨手　惋惜：心疼　疾：嫉妒　厲：嚴厲　恨：遺憾","trans":"石崇和王愷比賽誰更奢華，都用盡華美的東西裝飾車子和衣服。晉武帝是王愷的外甥，常常幫助王愷。他曾把一棵高二尺左右的珊瑚樹賞給王愷，枝條繁茂，世上很少有能比得上的。王愷拿給石崇看；石崇看完，用鐵如意敲它，珊瑚樹隨手就碎了。王愷既心疼，又認為石崇是嫉妒自己的寶物，說話的聲音和臉色都很嚴厲。石崇說：「不值得遺憾，我現在就還給你。」","qs":[{"q":"「不足恨，今還卿」是誰對誰說的？","opts":["王愷對石崇","武帝對王愷","石崇對武帝","石崇對王愷"],"ans":"D","steps":["找「曰」前面：「崇曰」→ 石崇說的","前一句王愷「聲色甚厲」，正在生石崇的氣","石崇回應王愷，卿＝你＝王愷"],"tests":"找說話者和對象","avoid":"「卿」是你，找他正在回應誰"},{"q":"「武帝，愷之甥也」，王愷和武帝是什麼關係？","opts":["王愷是武帝的外甥","王愷是武帝的舅舅","兩人是兄弟","王愷是武帝的父親"],"ans":"B","steps":["「甲，乙之甥也」＝甲是乙的外甥","所以武帝是王愷的外甥","反過來，王愷就是武帝的舅舅"],"tests":"稱謂換算","avoid":"親戚關係要換個方向想一次"},{"q":"「又以為疾己之寶」的「己」指誰？","opts":["王愷","石崇","武帝","珊瑚樹"],"ans":"A","steps":["這句的主詞是前面的「愷」","王愷認為石崇嫉妒「自己的」寶物","己＝王愷自己"],"tests":"代詞「己」指誰","avoid":"「己」就是這句的主詞自己"},{"q":"從石崇說「不足恨，今還卿」的口氣，可以推知什麼？","opts":["他很後悔打碎珊瑚樹","他想向武帝道歉","他自信拿得出同樣好、甚至更好的珊瑚樹","他不知道珊瑚樹很珍貴"],"ans":"C","steps":["「不足恨」：不值得遺憾，口氣很輕鬆","「今還卿」：馬上就能還你","打碎寶物還這麼輕鬆，表示他有更多、更好的"],"tests":"從對話推論","avoid":"口氣也是證據"}]},{"label":"第四篇","title":"木猶如此","text":["桓公北征經金城，見前為琅邪時種柳，皆已十圍，慨然曰：「木猶如此，人何以堪！」攀枝執條，泫然流淚。"],"cite":"《世說新語．言語》","notes":"桓公：桓溫，東晉大將　征：出兵打仗　金城：地名　為琅邪：擔任琅邪的地方官　圍：兩手合抱的粗細　慨然：感慨的樣子　猶：尚且　堪：承受　條：細枝　泫然：流淚的樣子","trans":"桓溫向北出兵，經過金城，看見從前擔任琅邪地方官時種的柳樹，都已經有十圍那麼粗了，感慨地說：「樹木尚且變化這麼大，人又怎麼承受得了歲月的流逝！」他攀著樹枝、握著柳條，流下了眼淚。","qs":[{"q":"「木猶如此，人何以堪」是誰說的？","opts":["種柳的農夫","琅邪的百姓","桓公","作者"],"ans":"C","steps":["「慨然曰」前面沒有寫人名","往前找這一句的主角：「桓公北征經金城，見……」","主詞一路都是桓公 → 是桓公說的"],"tests":"補出說話的人","avoid":"「曰」前沒人名，往前找主詞"},{"q":"「見前為琅邪時種柳」，柳樹是誰種的？","opts":["桓公自己","金城的人","琅邪的百姓","桓公的部下"],"ans":"A","steps":["「前為琅邪時」：從前當琅邪地方官的時候","這句的主詞還是桓公","所以是桓公自己以前種的"],"tests":"補主詞","avoid":"句子沒換人，主詞就沒換"},{"q":"「木猶如此」的「如此」指什麼？","opts":["柳樹被砍掉了","柳樹已經枯死","柳樹已經長到十圍粗","柳樹排得很整齊"],"ans":"C","steps":["往前找：「皆已十圍」","柳樹長得這麼粗，表示過了很多年","如此＝長到十圍粗這件事"],"tests":"代詞「如此」指什麼","avoid":"「如此」往前一句找"},{"q":"桓公「泫然流淚」，最主要是因為？","opts":["打仗打輸了","捨不得砍掉柳樹","柳樹長得不好","感嘆時光流逝，人也跟著老了"],"ans":"D","steps":["他說的話是「人何以堪」：人怎麼承受得了","樹都長這麼粗了，代表過了很久","人也跟著變老 → 感嘆時光"],"tests":"從對話找心情","avoid":"人物說的話就是流淚的理由"}]},{"label":"第五篇","title":"長安何如日遠","text":["晉明帝數歲，坐元帝膝上。有人從長安來，元帝問洛下消息，潸然流涕。明帝問何以致泣，具以東渡意告之。因問明帝：「汝意謂長安何如日遠？」答曰：「日遠。不聞人從日邊來，居然可知。」元帝異之。","明日集群臣宴會，告以此意，更重問之。乃答曰：「日近。」元帝失色曰：「爾何故異昨日之言邪？」答曰：「舉目見日，不見長安。」"],"cite":"《世說新語．夙惠》","notes":"晉明帝：東晉的皇帝，元帝的兒子　元帝：晉元帝　洛下：洛陽，晉朝的舊都　潸然：流淚的樣子　具：完整地　東渡：晉朝被迫往東南遷移的事　何如：比起來怎麼樣　居然：顯然　失色：臉色大變","trans":"晉明帝才幾歲時，坐在父親元帝的膝上。有人從長安來，元帝問起洛陽的消息，難過得流下眼淚。明帝問父親為什麼哭，元帝就把被迫東遷的經過完整地告訴他。接著問明帝：「你認為長安和太陽比起來，哪一個遠？」明帝回答：「太陽遠。沒聽說有人從太陽那邊來，顯然可以知道。」元帝覺得他很不簡單。第二天召集群臣宴會，元帝把這件事告訴大家，又再問明帝一次。明帝卻回答：「太陽近。」元帝臉色大變說：「你為什麼和昨天說的不一樣呢？」明帝回答：「抬起頭就看得見太陽，卻看不見長安。」","qs":[{"q":"「明帝問何以致泣」，哭的人是誰？","opts":["元帝","明帝","從長安來的人","群臣"],"ans":"A","steps":["往前一句：「元帝問洛下消息，潸然流涕」","流淚的是元帝","明帝問的就是父親為什麼哭"],"tests":"補出動作的人","avoid":"「泣」往前找流淚的人"},{"q":"「汝意謂長安何如日遠？」是誰問誰？","opts":["明帝問元帝","群臣問明帝","元帝問明帝","元帝問群臣"],"ans":"C","steps":["「因問明帝」：問的對象是明帝","前面說明東渡經過的是元帝，接著問的還是元帝","汝＝你＝明帝"],"tests":"找說話者和對象","avoid":"「問＋人」，那個人就是聽的人"},{"q":"第二天「乃答曰：『日近。』」是誰回答的？","opts":["明帝","元帝","群臣中的一個人","從長安來的人"],"ans":"A","steps":["「答曰」前面沒有人名","上一句「更重問之」：元帝又問明帝一次","被問的人回答 → 明帝"],"tests":"補出說話的人","avoid":"「答曰」找上一句被問的人"},{"q":"明帝說「舉目見日，不見長安」，意思最接近？","opts":["長安天氣不好，看不到太陽","他不想再回長安","太陽抬頭看得見，長安卻看不見，好像比太陽還遠","太陽太亮，看不清楚長安"],"ans":"C","steps":["舉目＝抬頭","抬頭就看得到太陽 → 太陽近","長安看不見 → 比太陽還遠"],"tests":"看懂人物的話","avoid":"照字面一個詞一個詞翻"}]}]},{"no":"第 3 組","title":"塞翁失馬","skill":"因果連鎖：畫事件鏈","steps":["❶ 把事情照順序寫成一格一格：事件1 → 事件2 → 事件3","❷ 每一格標好事（＋）或壞事（－）：「弔」是壞事、「賀」是好事","❸ 找連接詞：以……之故、是以、於是、果，前面是原因，後面是結果","❹ 問「為什麼」→ 往前一格找；問「結果」→ 往後一格找"],"demo":{"q":"塞翁的兒子為什麼能在戰爭中保住性命？","a":["→ 畫事件鏈：好騎 → 墮而折其髀（－）→ 胡人大入塞 → 父子相保（＋）","→ 找連接詞：「此獨以跛之故」，以……之故＝因為","答：因為他摔斷腿、腳跛了"]},"parts":[{"label":"第一篇","title":"塞翁失馬","text":["近塞上之人有善術者，馬無故亡而入胡。人皆弔之，其父曰：「此何遽不為福乎？」居數月，其馬將胡駿馬而歸。人皆賀之，其父曰：「此何遽不能為禍乎？」","家富良馬，其子好騎，墮而折其髀。人皆弔之，其父曰：「此何遽不為福乎？」居一年，胡人大入塞，丁壯者引弦而戰，近塞之人，死者十九。此獨以跛之故，父子相保。"],"cite":"《淮南子．人間訓》","notes":"塞：邊界　善術：精通術數　胡：北方的外族　何遽：怎麼就　駿馬：好馬　富：多　墮：掉下來　髀：大腿骨　丁壯者：成年男子　引弦：拉弓　十九：十分之九　跛：腳瘸","trans":"靠近邊塞的地方，有一個精通術數的人，他家的馬無緣無故逃到胡人那裡去了。大家都來安慰他，他的父親說：「這怎麼就不會是福氣呢？」過了幾個月，那匹馬帶著胡人的好馬回來了。大家都來恭喜他，他的父親說：「這怎麼就不會是禍事呢？」家裡好馬多了，他的兒子喜歡騎馬，從馬上摔下來，摔斷了大腿骨。大家都來安慰他，他的父親說：「這怎麼就不會是福氣呢？」過了一年，胡人大舉攻進邊塞，成年男子都拿起弓箭作戰，邊塞附近的人，十個有九個戰死。只有這一家因為腳跛的緣故，父子都保全了性命。","qs":[{"q":"第一次「人皆弔之」，說明當時發生了什麼事？","opts":["壞事：馬逃到胡人那裡去了","好事：馬帶回胡人的好馬","有人過世，要辦喪事","大家來恭喜他"],"ans":"A","steps":["弔＝慰問，有壞事才需要慰問","往前一格：「馬無故亡而入胡」","馬跑掉了 → 壞事（－）"],"tests":"看「弔」判斷好壞","avoid":"弔是壞事，賀是好事"},{"q":"下列事件鏈，哪一個順序正確？","opts":["馬逃走 → 兒子摔斷腿 → 帶回胡馬 → 胡人入侵","帶回胡馬 → 馬逃走 → 胡人入侵 → 兒子摔斷腿","馬逃走 → 帶回胡馬 → 胡人入侵 → 兒子摔斷腿","馬逃走 → 帶回胡馬 → 兒子摔斷腿 → 胡人入侵"],"ans":"D","steps":["用時間詞切格：「居數月」「居一年」","馬亡 →「居數月」馬歸 →「家富良馬」兒子才騎馬摔傷","「居一年」胡人入塞，放在最後"],"tests":"排出事件鏈","avoid":"用「居……」把事件切成格子"},{"q":"「其馬將胡駿馬而歸」的「將」是什麼意思？","opts":["將要","將軍","拿來比較","帶領"],"ans":"D","steps":["代回「將要」：馬將要胡人好馬回來？不通","代回「帶領」：馬帶著胡人的好馬回來 → 通","這一格是好事（＋），所以後面才有「人皆賀之」"],"tests":"字義：將＝帶","avoid":"每個意思都代回去讀一次"},{"q":"兒子摔斷腿這件事，最後帶來什麼結果？","opts":["家裡的好馬都賣掉了","他不用上戰場，父子都保住性命","胡人不敢入侵","他從此學會騎馬"],"ans":"B","steps":["找連接詞：「此獨以跛之故，父子相保」","以……之故＝因為……的緣故","跛（－）連到父子相保（＋）：壞事變成好事"],"tests":"找最後的結果","avoid":"問結果，往鏈子後面找"}]},{"label":"第二篇","title":"曲突徙薪","text":["客有過主人者，見其竈直突，傍有積薪。客謂主人：「更為曲突，遠徙其薪；不者，且有火患。」主人嘿然不應。俄而家果失火，鄰里共救之，幸而得息。於是殺牛置酒，謝其鄰人，灼爛者在於上行，餘各以功次坐，而不錄言曲突者。"],"cite":"《漢書．霍光傳》（節選）","notes":"過：拜訪　竈：爐灶　突：煙囪　傍：旁邊　薪：柴　更：改　徙：搬　不者：不這樣的話　且：將要　嘿然：不說話的樣子　息：熄滅　謝：感謝　灼爛者：被燒傷的人　上行：上座　以功次坐：按功勞大小排座位　錄：邀請","trans":"有個客人拜訪主人，看見他家爐灶的煙囪是直的，旁邊還堆著柴。客人對主人說：「把煙囪改成彎的，把柴搬遠一點；不這樣的話，將會發生火災。」主人不說話，沒有理會。不久，家裡果然失火，鄰居們一起來救火，幸好把火撲滅了。於是主人殺牛擺酒，感謝鄰居，被燒傷的人坐上座，其他人按功勞大小排座位，卻沒有請那個建議把煙囪改彎的客人。","qs":[{"q":"客人說「且有火患」，他認為會失火的原因是？","opts":["煙囪是直的，旁邊又堆著柴","主人常常不小心玩火","鄰居家先失火","爐灶太小"],"ans":"A","steps":["往前找客人看到的事：「其竈直突，傍有積薪」","所以他建議「更為曲突，遠徙其薪」","原因：煙囪直、柴又堆在旁邊"],"tests":"往前找原因","avoid":"問原因，往前一格找"},{"q":"「俄而家果失火」的「果」說明了什麼？","opts":["主人早就準備好救火","失火是誰都想不到的意外","客人的提醒應驗了","鄰居故意放火"],"ans":"C","steps":["果＝果然，表示和之前說的一樣","往前找：客人說過「且有火患」","主人不聽 → 失火，事件鏈連起來了"],"tests":"連接詞「果」","avoid":"「果」要往前找誰說過"},{"q":"下列哪一個事件鏈最完整正確？","opts":["客人提醒 → 主人不理 → 失火 → 鄰居救火 → 宴請鄰居","客人提醒 → 主人改了煙囪 → 失火 → 鄰居救火","主人不理 → 鄰居救火 → 失火 → 宴請客人","失火 → 客人提醒 → 主人不理 → 宴請鄰居"],"ans":"A","steps":["照順序切格：謂主人 → 嘿然不應 → 果失火 → 共救之 → 殺牛置酒","「嘿然不應」表示根本沒改煙囪","最後宴請的是鄰人，不是客人"],"tests":"排出事件鏈","avoid":"每一格都要對到原文一句"},{"q":"「而不錄言曲突者」，作者想讓讀者想到什麼？","opts":["客人不喜歡吃牛肉","真正事先提醒、能防止災禍的人，反而被忘記了","被燒傷的人功勞最小","鄰居救火救得不夠快"],"ans":"B","steps":["「而」在這裡是轉折：宴請大家，卻沒請客人","如果早聽客人的話，根本不會失火","提醒的人功勞最大，卻被忘了"],"tests":"推論作者用意","avoid":"想想如果早聽話會怎樣"}]},{"label":"第三篇","title":"脣亡齒寒","text":["晉侯復假道於虞以伐虢。宮之奇諫曰：「虢，虞之表也。虢亡，虞必從之。晉不可啟，寇不可翫。一之謂甚，其可再乎？諺所謂『輔車相依，脣亡齒寒』者，其虞、虢之謂也。」"],"cite":"《左傳．僖公五年》（節選）","notes":"晉侯：晉國國君　復：又　假道：借路　虞、虢：兩個相鄰的小國　宮之奇：虞國的大臣　諫：勸告國君　表：外圍屏障　啟：打開，引申為助長野心　寇：入侵的軍隊　翫：輕忽　甚：過分　諺：俗話　輔：臉頰　車：牙床","trans":"晉國國君又向虞國借路去攻打虢國。宮之奇勸虞國國君說：「虢國是虞國的外圍屏障。虢國滅亡了，虞國一定跟著滅亡。晉國的野心不能助長，外來的軍隊不能輕忽。借路一次已經很過分了，難道還能借第二次嗎？俗話說『臉頰和牙床互相依靠，嘴唇沒了，牙齒就會受寒』，說的就是虞國和虢國的關係啊。」","qs":[{"q":"宮之奇認為「虞必從之」，原因是什麼？","opts":["虞國和晉國是好朋友","虞國比虢國強大","虢國是虞國的屏障，虢國亡了虞國就失去保護","虢國會出兵攻打虞國"],"ans":"C","steps":["往前一格找原因：「虢，虞之表也」","表＝外圍屏障（注釋）","屏障沒了 → 虞國跟著滅亡"],"tests":"往前找原因","avoid":"原因常在結果的前一句"},{"q":"「虢亡，虞必從之」的「從之」是什麼意思？","opts":["跟從虢國的國君","聽從晉國的命令","跟著滅亡","跟著去打仗"],"ans":"C","steps":["前面講「虢亡」","「從之」＝跟著它","跟著虢國一樣 → 跟著滅亡"],"tests":"看懂結果句","avoid":"「從之」要對前面的動作"},{"q":"「脣亡齒寒」中，「脣」和「齒」分別比喻誰？","opts":["脣比喻虞國，齒比喻虢國","脣比喻晉國，齒比喻虞國","脣比喻宮之奇，齒比喻國君","脣比喻虢國，齒比喻虞國"],"ans":"D","steps":["鏈子：脣先亡 → 齒受寒","文中：虢先亡 → 虞跟著遭殃","所以脣＝虢，齒＝虞"],"tests":"比喻的因果對應","avoid":"先倒的對先倒的，後倒的對後倒的"},{"q":"「晉侯復假道於虞」的「復」透露了什麼？","opts":["晉國要把路還給虞國","晉國之前已經向虞國借過一次路","晉國是第一次來借路","虞國已經拒絕過晉國"],"ans":"B","steps":["復＝又（注釋）","宮之奇也說「一之謂甚，其可再乎」","一次已經過分 → 表示之前借過一次"],"tests":"從字詞推前情","avoid":"「復」「再」表示之前發生過"}]},{"label":"第四篇","title":"螳螂捕蟬","text":["園中有樹，其上有蟬，蟬高居悲鳴飲露，不知螳螂在其後也；螳螂委身曲附欲取蟬，而不知黃雀在其傍也；黃雀延頸欲啄螳螂，而不知彈丸在其下也。此三者皆務欲得其前利，而不顧其後之有患也。"],"cite":"《說苑．正諫》（節選）","notes":"高居：停在高處　悲鳴：鳴叫　委身曲附：彎著身子貼近　傍：旁邊　延頸：伸長脖子　彈丸：彈弓射出的小丸子　務：一心一意　顧：顧慮","trans":"園子裡有一棵樹，樹上有一隻蟬，蟬停在高處鳴叫、喝露水，不知道螳螂就在牠後面；螳螂彎著身子貼近，想要抓蟬，卻不知道黃雀就在牠旁邊；黃雀伸長脖子想啄螳螂，卻不知道彈弓的彈丸就在牠下面。這三者都一心想得到眼前的好處，卻沒有顧慮到後面的禍患。","qs":[{"q":"下列哪一個「誰想抓誰」的鏈子是正確的？","opts":["螳螂想抓蟬，黃雀想啄螳螂，彈丸在黃雀下面","蟬想吃螳螂，螳螂想吃黃雀，彈丸在蟬下面","黃雀想啄蟬，螳螂想抓黃雀，彈丸在螳螂下面","螳螂想抓黃雀，黃雀想啄蟬，彈丸在蟬下面"],"ans":"A","steps":["一格一格找：「螳螂……欲取蟬」","「黃雀延頸欲啄螳螂」","「彈丸在其下」：這句的主詞是黃雀"],"tests":"排出事件鏈","avoid":"每一格都找「欲」後面的對象"},{"q":"「而不知黃雀在其傍也」的「其」指誰？","opts":["蟬","黃雀","樹","螳螂"],"ans":"D","steps":["這一句的主詞是前面的「螳螂」","螳螂想抓蟬，卻不知道黃雀在「牠」旁邊","其＝螳螂"],"tests":"代詞「其」指誰","avoid":"「其」往前找這句的主角"},{"q":"三者都遇到危險，共同的原因是什麼？","opts":["只想得到眼前的好處，沒注意背後的危險","牠們都太弱小","園子裡沒有地方可以躲","牠們都不會飛"],"ans":"A","steps":["找作者的總結：「此三者皆務欲得其前利」","「而不顧其後之有患也」","原因：只看前面的利，不顧後面的患"],"tests":"找共同原因","avoid":"總結句常在最後"},{"q":"這則故事最適合用來提醒哪一種人？","opts":["做事太慢的人","不愛運動的人","只顧眼前利益、不管後果的人","太愛幫助別人的人"],"ans":"C","steps":["結論在最後一句：「務欲得其前利，而不顧其後之有患」","對應到人：只想眼前好處的人","成語「螳螂捕蟬，黃雀在後」就是這個意思"],"tests":"寓言的道理","avoid":"道理從最後的總結句找"}]},{"label":"第五篇","title":"魯侯養鳥","text":["昔者海鳥止於魯郊，魯侯御而觴之於廟，奏九韶以為樂，具太牢以為善。鳥乃眩視憂悲，不敢食一臠，不敢飲一杯，三日而死。此以己養養鳥也，非以鳥養養鳥也。"],"cite":"《莊子．至樂》（節選）","notes":"止：停留　魯郊：魯國都城的郊外　魯侯：魯國的國君　御：迎接　觴：請喝酒　廟：宗廟，祭祀祖先的地方　九韶：古代最隆重的音樂　太牢：牛、羊、豬三種牲畜，最隆重的宴席　善：同「膳」，飯菜　眩視：眼花，看不清楚　臠：切成小塊的肉","trans":"從前有一隻海鳥停在魯國都城的郊外，魯國國君把牠迎進宗廟，請牠喝酒，演奏最隆重的〈九韶〉音樂給牠聽，準備牛、羊、豬當作牠的飯菜。海鳥卻嚇得眼花、憂愁悲傷，一小塊肉也不敢吃，一杯酒也不敢喝，三天就死了。這是用養自己的方法來養鳥，不是用養鳥的方法來養鳥啊。","qs":[{"q":"海鳥「三日而死」，最直接的原因是什麼？","opts":["魯侯把牠關起來，不給牠吃東西","牠嚇得憂愁悲傷，不敢吃也不敢喝","牠年紀太大，本來就快死了","魯國的天氣太冷"],"ans":"B","steps":["往前一格找原因：「鳥乃眩視憂悲，不敢食一臠，不敢飲一杯」","三天不吃不喝 → 「三日而死」","魯侯準備了「太牢」，不是不給吃；年紀、天氣文中都沒說"],"tests":"往前找直接原因","avoid":"問「為什麼」，先看結果前一句"},{"q":"下列哪一個事件鏈，順序正確？","opts":["魯侯奏樂備宴 → 海鳥停在魯郊 → 海鳥不吃不喝 → 三天後死了","海鳥停在魯郊 → 海鳥不吃不喝 → 魯侯奏樂備宴 → 三天後死了","海鳥不吃不喝 → 海鳥停在魯郊 → 魯侯奏樂備宴 → 三天後死了","海鳥停在魯郊 → 魯侯奏樂備宴 → 海鳥不吃不喝 → 三天後死了"],"ans":"D","steps":["照原文切格：「止於魯郊」→「御而觴之於廟，奏九韶……具太牢」","「鳥乃眩視憂悲，不敢食……」→「三日而死」","「乃」＝於是，表示鳥害怕是在魯侯招待之後"],"tests":"排出事件鏈","avoid":"每一格都要對到原文一句"},{"q":"依照文章最後的說法，海鳥死掉的根本原因是什麼？","opts":["海鳥本來就不喜歡魯國","魯侯故意要害死海鳥","魯侯用對待人的方式對待鳥，沒有照鳥的需要","宗廟裡的人太多太吵"],"ans":"C","steps":["找作者的總結：「此以己養養鳥也，非以鳥養養鳥也」","以己養＝用養自己的方法；以鳥養＝用養鳥的方法","喝酒、聽音樂、吃大餐是人喜歡的，不是鳥需要的；魯侯是好意，不是故意害鳥"],"tests":"找根本原因","avoid":"直接原因看前一格，根本原因看總結"},{"q":"這個故事最適合提醒我們什麼？","opts":["請客一定要準備很多菜","對別人好，要用對方需要的方式，不是只用自己喜歡的方式","海鳥不能養，看到要趕快放走","國君做的事都是對的"],"ans":"B","steps":["表面：魯侯很用心招待，海鳥卻死了","總結句說他是「以己養養鳥」","道理：好意也要用對方法；「一定」「都是」是絕對字"],"tests":"故事的道理","avoid":"道理從最後的總結句找"}]}]},{"no":"第 4 組","title":"《論語》三人行＋比賽影片","skill":"互文對讀二：找對應句、畫線連起來","steps":["❶ 把甲文拆成幾個小句，每句旁邊寫白話","❷ 在乙文裡找意思一樣的句子，用線連起來","❸ 連不起來的句子，就是「只有甲」或「只有乙」","❹ 題目問「對應」→ 看連線；問「不同」→ 看沒連到的"],"demo":{"q":"甲文「擇其善者而從之」，對應乙文哪一句？","a":["先看材料：甲「擇其善者而從之」＝選別人好的地方跟著學","乙：「看到隊友漂亮的傳球，我就記下來，下次照著做」","兩句都在說看到好的就學 → 畫線連起來"]},"parts":[{"label":"第一篇","title":"三人行，必有我師焉","text":["甲　子曰：「三人行，必有我師焉：擇其善者而從之，其不善者而改之。」","乙　每次比賽結束，教練都會放影片給我們看。看到隊友漂亮的傳球，我就記下來，下次照著做；看到自己或別人失誤，就提醒自己別再犯同樣的錯。教練說，球場上的每一個人，都是你的老師。"],"cite":"甲：《論語．述而》　乙：練習用自編短文","notes":"行：走路，這裡指一起相處　焉：在其中　善：優點","trans":"甲：孔子說：「幾個人一起走，其中一定有可以當我老師的人：選擇他們的優點跟著學習，看到他們的缺點，就反省改正自己。」","qs":[{"q":"甲文「其不善者而改之」，在乙文中對應哪一句？","opts":["看到自己或別人失誤，就提醒自己別再犯同樣的錯","看到隊友漂亮的傳球，我就記下來","教練都會放影片給我們看","下次照著做"],"ans":"A","steps":["甲：看到不好的地方，就改正自己","到乙文找「不好」的事：「失誤」","連線：不善 → 失誤；改之 → 別再犯"],"tests":"找對應句","avoid":"先找意思相同的關鍵詞"},{"q":"甲文「三人行，必有我師焉」，和乙文哪一句意思最接近？","opts":["每次比賽結束，教練都會放影片","看到隊友漂亮的傳球","球場上的每一個人，都是你的老師","下次照著做"],"ans":"C","steps":["甲：一群人裡一定有我的老師","乙文出現「老師」的句子：教練說的最後一句","兩句都說身邊的人都能當老師 → 連線"],"tests":"找對應句","avoid":"抓關鍵字「師」去乙文找"},{"q":"「擇其善者而從之」的「從」是什麼意思？","opts":["從來","服從命令","從前","跟隨學習"],"ans":"D","steps":["擇＝選擇，選了好的地方然後……","乙文對應句：「下次照著做」","照著做＝跟著學，所以從＝跟隨學習"],"tests":"用對應句解字","avoid":"看不懂的字，去乙文找對應句"},{"q":"下列哪一個說法，甲、乙兩篇都有？","opts":["一定要看影片才能進步","只有教練才能當老師","只要學別人的優點，失誤不用管","別人的缺點也能拿來提醒自己"],"ans":"D","steps":["甲：「其不善者而改之」","乙：看到失誤就提醒自己","兩邊連得上線 → 兩篇都有"],"tests":"找兩篇相同點","avoid":"兩篇都有＝兩邊都連得到線"}]},{"label":"第二篇","title":"歲寒知松柏","text":["甲　子曰：「歲寒，然後知松柏之後彫也。」","乙　上學期聯賽，我們隊第三節落後二十分，看台上的同學一個一個離開，有幾個隊員也垂頭喪氣。只有阿凱一直喊：「還沒結束！」跑回防守、搶籃板，一球都不放棄。那場我們還是輸了，可是從那天起，大家都知道，最難的時候，靠得住的人是誰。"],"cite":"甲：《論語．子罕》　乙：練習用自編短文","notes":"歲寒：一年中最冷的時候　松柏：兩種冬天也不落葉的樹　彫：同「凋」，葉子掉落","trans":"甲：孔子說：「到了一年中最冷的時候，才知道松樹和柏樹是最後凋零的。」","qs":[{"q":"甲文「歲寒」，在乙文中對應的是？","opts":["上學期聯賽開始前","阿凱跑回防守","第三節落後二十分","大家都知道靠得住的人是誰"],"ans":"C","steps":["甲：歲寒＝最冷、最難熬的時候","乙文最困難的時刻：「第三節落後二十分」","兩句都是「最難的時候」→ 連線"],"tests":"找對應句","avoid":"先想甲文那個詞代表什麼情況"},{"q":"乙文中的阿凱，對應甲文的哪一個詞？","opts":["歲寒","松柏","然後","彫"],"ans":"B","steps":["甲：天冷時別的樹都落葉，只有松柏撐住","乙：別人離開、垂頭喪氣，只有阿凱不放棄","連線：阿凱 → 不凋的松柏"],"tests":"比喻的對應","avoid":"找兩篇裡「只有它撐住」的那個"},{"q":"「然後知松柏之後彫也」的「然後」最接近什麼意思？","opts":["然而","突然","這樣以後才","於是忘記"],"ans":"C","steps":["然＝這樣，後＝以後","代回：天冷了，這樣以後才知道松柏最後凋零 → 通","乙文也一樣：「從那天起，大家都知道」"],"tests":"字義：然後","avoid":"把詞拆開來一個字一個字讀"},{"q":"下列哪一項是乙文有、甲文沒有的？","opts":["困難的時候，才看得出誰靠得住","比賽最後還是輸了","別人放棄時，有人還撐著","最難熬的時刻"],"ans":"B","steps":["甲只講：天冷才看出松柏不凋","「輸了」只在乙文出現，甲文連不到線","其他三項甲文都能連上"],"tests":"找兩篇不同點","avoid":"沒有連線的那一句就是不同"}]},{"label":"第三篇","title":"德不孤，必有鄰","text":["甲　子曰：「德不孤，必有鄰。」","乙　小翔剛轉學來時，沒有人認識他。可是每次練完球，他都留下來，把散在場上的球一顆一顆撿回球籃，還會幫學弟綁鞋帶。過了一個月，大家開始搶著跟他同一組，連最害羞的學弟，都會主動找他說話。"],"cite":"甲：《論語．里仁》　乙：練習用自編短文","notes":"德：品德好的人","trans":"甲：孔子說：「品德好的人不會孤單，一定會有志同道合的人來親近他。」","qs":[{"q":"甲文的「德」，在乙文中對應的是？","opts":["把球撿回球籃、幫學弟綁鞋帶","剛轉學來","大家搶著跟他同一組","最害羞的學弟"],"ans":"A","steps":["甲：德＝好的品德","乙文裡小翔做的好事：撿球、幫學弟綁鞋帶","連線：好品德 → 這些行為"],"tests":"找對應句","avoid":"抽象的詞，對到具體的行為"},{"q":"甲文「必有鄰」，對應乙文哪一句？","opts":["沒有人認識他","他都留下來撿球","大家開始搶著跟他同一組","過了一個月"],"ans":"C","steps":["甲：一定有人來親近他","乙：大家搶著跟他同組、學弟主動找他說話","連線：必有鄰 → 大家親近他"],"tests":"找對應句","avoid":"先寫白話，再找意思一樣的"},{"q":"乙文「剛轉學來時，沒有人認識他」，最接近甲文的哪一個字？","opts":["德","孤","鄰","必"],"ans":"B","steps":["沒人認識他 → 很孤單","甲文的「孤」就是孤單","甲說「德不孤」，乙的結局也是不再孤單"],"tests":"找對應字","avoid":"把乙的句子濃縮成一個字"},{"q":"兩篇共同想表達的是？","opts":["有好品德的人，終究會有人願意親近","轉學生一定交不到朋友","撿球是最重要的品德","只要一個月就一定能交到朋友"],"ans":"A","steps":["甲：德不孤，必有鄰","乙：小翔做好事 → 大家親近他","「一定」是絕對字；把例子當成道理也不對"],"tests":"找兩篇相同點","avoid":"道理要兩篇都連得上"}]},{"label":"第四篇","title":"過而不改，是謂過矣","text":["甲　子曰：「過而不改，是謂過矣。」","乙　阿哲運球時，總習慣低頭看球，常常被對手抄走。教練提醒他好幾次，他都說：「下次再注意。」結果整個學期，同樣的失誤一直出現。後來他把比賽影片看了一遍，每天練抬頭運球二十分鐘，兩個月後，被抄球的次數少了很多。"],"cite":"甲：《論語．衛靈公》　乙：練習用自編短文","notes":"是：這　謂：叫做","trans":"甲：孔子說：「犯了錯卻不改正，這才叫做真正的錯誤。」","qs":[{"q":"「過而不改，是謂過矣」的兩個「過」，是什麼意思？","opts":["都是「經過」","前一個是「經過」，後一個是「錯誤」","前一個是「超過」，後一個是「錯誤」","都是「錯誤」"],"ans":"D","steps":["代回「經過」：經過了卻不改？不通","代回「錯誤」：犯了錯不改，這才叫做錯 → 通","後一個「過」也是錯誤，是更嚴重的錯"],"tests":"字義：過","avoid":"兩個字都代回去讀讀看"},{"q":"乙文哪一段最符合甲文的「過而不改」？","opts":["他每天練抬頭運球二十分鐘","兩個月後被抄球的次數少了很多","他把比賽影片看了一遍","教練提醒好幾次，同樣的失誤卻一直出現"],"ans":"D","steps":["甲：犯錯卻不改","乙：嘴上說下次再注意，失誤卻一直出現","連線：過而不改 → 整個學期同樣的失誤"],"tests":"找對應句","avoid":"先找「犯錯」，再看有沒有「改」"},{"q":"阿哲後來每天練抬頭運球，和甲文的關係是？","opts":["完全符合甲文說的「過而不改」","他做到了「改」，就不再是孔子說的「過矣」","和甲文沒有關係","證明甲文說錯了"],"ans":"B","steps":["甲文的關鍵字是「改」","乙文後半：看影片、每天練 → 這就是「改」","有改，就不是「是謂過矣」"],"tests":"對讀後半段","avoid":"看關鍵字有沒有被做到"},{"q":"下列哪一項是乙文有、甲文沒有的？","opts":["犯錯不改才是真錯","有人一再犯同樣的錯","改正錯誤的具體方法","錯誤需要改正"],"ans":"C","steps":["甲只有一句道理，沒說怎麼改","乙寫了看影片、每天練二十分鐘","具體方法只在乙文 → 甲文連不到線"],"tests":"找兩篇不同點","avoid":"甲講道理，乙常常多了做法"}]},{"label":"第五篇","title":"知者樂水，仁者樂山","text":["甲　子曰：「知者樂水，仁者樂山；知者動，仁者靜；知者樂，仁者壽。」","乙　我有兩個好朋友。小宇腦筋轉得快，最喜歡到河邊看水流，一下子想到新戰術，一下子又想去玩別的，整天開開心心。阿傑做事很穩，喜歡跟爸爸去爬山，坐在山頂上可以安安靜靜看一整個下午，他說這樣心裡很踏實。"],"cite":"甲：《論語．雍也》　乙：練習用自編短文","notes":"知：同「智」，聰明　仁：有仁德　壽：長壽","trans":"甲：孔子說：「聰明的人喜愛水，仁德的人喜愛山；聰明的人好動，仁德的人好靜；聰明的人快樂，仁德的人長壽。」","qs":[{"q":"乙文的小宇，對應甲文的哪一種人？","opts":["知者","仁者","壽者","靜者"],"ans":"A","steps":["乙：小宇腦筋快、愛看水流、好動","甲：「知者樂水」「知者動」","連線：小宇 → 知者"],"tests":"人物的對應","avoid":"把人物特點一個一個連線"},{"q":"「知者樂水」的「樂」是什麼意思？","opts":["快樂","喜愛","音樂","娛樂"],"ans":"B","steps":["「樂」後面接著「水」：樂＋東西","對應乙文：小宇「最喜歡到河邊看水流」","所以樂（ㄧㄠˋ）＝喜愛；「知者樂」的樂才是快樂"],"tests":"一字多音：樂","avoid":"樂後面接東西，就是喜愛"},{"q":"乙文「坐在山頂上可以安安靜靜看一整個下午」，對應甲文哪一句？","opts":["知者動","知者樂","知者樂水","仁者靜"],"ans":"D","steps":["乙：阿傑安安靜靜","甲：「仁者靜」","連線：安靜 → 仁者靜"],"tests":"找對應句","avoid":"抓同一個字「靜」去連"},{"q":"甲文中，哪一句在乙文裡連不到線？","opts":["仁者壽","知者樂水","仁者樂山","知者動"],"ans":"A","steps":["一句一句連：樂水 → 小宇看水流；樂山 → 阿傑爬山；動 → 小宇好動","「知者樂」→ 整天開開心心","「仁者壽」：乙文沒寫到阿傑長壽 → 連不到線"],"tests":"找兩篇不同點","avoid":"全部連完，剩下的就是答案"}]}]},{"no":"第 5 組","title":"四週投籃紀錄","skill":"圖文對讀：圖表＋文字一起看","steps":["❶ 先看標題和單位：在記錄什麼？單位是什麼？","❷ 找出最高、最低、變化最大的地方","❸ 讀文字：找時間點或原因（從第幾週開始、因為什麼）","❹ 把文字對到圖表：文字說的事，在圖上哪裡看得到？","❺ 推論只能說「可能」，不能說「一定」"],"demo":{"q":"教練的話，對應圖表的哪一段？","a":["先看材料：圖表「第1週 8 球、第2週 10 球、第3週 13 球、第4週 15 球」；教練說「從第三週開始，大家每天寫下自己哪幾球沒進、為什麼」","新做法從第3週開始 → 看第2週到第3週：10 → 13，多 3 球，是四週裡增加最多的一次","答：對應第2週到第3週的進步"]},"parts":[{"label":"第一篇","title":"某隊員四週投籃練習紀錄（每週測 20 球，練習用數據）","text":["教練的話：「從第三週開始，大家每天練完都花五分鐘，寫下自己哪幾球沒進、為什麼。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["週次","投進球數（球）"],"per":1,"unit":"球","data":[["第1週",8],["第2週",10],["第3週",13],["第4週",15]],"qs":[{"q":"哪兩週之間，投進球數增加最多？","opts":["第1週到第2週","第3週到第4週","每週增加的一樣多","第2週到第3週"],"ans":"D","steps":["算每週相差：8→10 多2，10→13 多3，13→15 多2","第2週到第3週多3球，最多","每週不一樣，所以不是一樣多"],"tests":"找變化最大處","avoid":"相鄰兩格相減再比較"},{"q":"教練說的新做法從哪一週開始？對照圖表，那一週投進幾球？","opts":["第1週，8球","第2週，10球","第3週，13球","第4週，15球"],"ans":"C","steps":["文字：「從第三週開始」","圖表：第3週投進13球","文字的時間點要對到圖上同一格"],"tests":"文字對到圖表","avoid":"先找時間點，再去圖上找"},{"q":"第4週投進15球，那一週的命中率是多少？","opts":["60%","75%","80%","85%"],"ans":"B","steps":["標題說每週測20球","第4週投進15球","15 ÷ 20 ＝ 0.75 ＝ 75%"],"tests":"算比率","avoid":"命中率＝投進÷投的總數"},{"q":"根據圖表和教練的話，下列哪個推論最合理？","opts":["開始寫下沒進的原因後，進球數仍持續增加，這個做法可能有幫助","寫下原因一定能讓每個人都進步","第5週一定會投進17球","前兩週他完全沒有進步"],"ans":"A","steps":["文字：第3週開始寫原因","圖：第3、4週是13球、15球，仍在增加","只能說「可能」；「一定」「完全沒進步」都和證據不合"],"tests":"圖文推論","avoid":"推論只能說「可能」"}]},{"label":"第二篇","title":"六年甲班一週借書本數","text":["圖書股長說：「星期三開始，我把新到的漫畫版歷史書，放在教室門口的書架上。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","借書本數（本）"],"per":1,"unit":"本","data":[["星期一",4],["星期二",5],["星期三",11],["星期四",12],["星期五",10]],"qs":[{"q":"這一週借書最多的是星期幾？","opts":["星期一","星期三","星期四","星期五"],"ans":"C","steps":["看圖找最高的一格","星期四12本最多","星期三11本是第二多"],"tests":"找最高點","avoid":"最高和第二高要分清楚"},{"q":"這一週裡，哪一天比前一天增加最多？","opts":["星期二","星期三","星期四","星期五"],"ans":"B","steps":["算相差：週一到週二多1本，週二到週三多6本，週三到週四多1本","週四到週五還少了2本","週三增加最多，正好是文字說放新書的那天"],"tests":"找變化最大處","avoid":"先算差，再對文字的時間點"},{"q":"星期三到星期五，三天一共借出幾本？","opts":["23本","30本","33本","35本"],"ans":"C","steps":["圖：週三11本、週四12本、週五10本","11＋12＋10＝33","題目只問三天，不要加到週一、週二"],"tests":"讀圖算總和","avoid":"先圈出題目要的那幾格"},{"q":"下列哪個說法，有圖表和文字的證據？","opts":["全班同學都喜歡漫畫版歷史書","星期五變少，是因為大家不喜歡新書了","放新書之後的三天，每天借書數都比週一、週二多","放新書之後，借書數每天都在增加"],"ans":"C","steps":["圖：週三起11、12、10本，都比週一4本、週二5本多","週五比週四少，所以「每天都在增加」不對","「全班都喜歡」和週五變少的原因，圖文都沒說"],"tests":"圖文推論","avoid":"圖文沒寫的原因不能自己補"}]},{"label":"第三篇","title":"校隊一次練球的時間分配","text":["教練說：「上一場比賽，我們投籃命中率最差，所以這次練習，投籃要練最久。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["項目","時間（分鐘）"],"per":1,"unit":"分鐘","data":[["熱身",15],["運球",20],["投籃",30],["戰術",25],["緩和",10]],"qs":[{"q":"這一次練球總共多久？","opts":["95分鐘","100分鐘","105分鐘","110分鐘"],"ans":"B","steps":["把五項加起來：15＋20＋30＋25＋10","＝100","單位是分鐘"],"tests":"讀圖算總和","avoid":"每一項都要加到，不要漏"},{"q":"教練的話，對應圖表中的哪一個地方？","opts":["投籃30分鐘，是所有項目中最久的","熱身15分鐘","戰術25分鐘，是最久的","緩和10分鐘，是最短的"],"ans":"A","steps":["文字：「投籃要練最久」","圖：投籃30分鐘，比戰術25分鐘還多","文字說的事，正好對到圖上最高的那一格"],"tests":"文字對到圖表","avoid":"先找文字的關鍵詞，再找圖"},{"q":"熱身和緩和加起來，和運球比起來怎麼樣？","opts":["少5分鐘","多5分鐘","多10分鐘","一樣多"],"ans":"B","steps":["熱身15＋緩和10＝25分鐘","運球20分鐘","25－20＝5，多5分鐘"],"tests":"讀圖比大小","avoid":"先加起來，再相減"},{"q":"根據文字和圖表，教練安排時間的依據是什麼？","opts":["上一場比賽哪一項表現最差","隊員最喜歡哪一項","哪一項最容易練","學校規定的時間"],"ans":"A","steps":["找文字裡的「所以」：前面是原因","原因：「上一場比賽，我們投籃命中率最差」","所以投籃排最久 → 依據是上一場最弱的項目"],"tests":"找文字裡的原因","avoid":"「所以」前面就是原因"}]},{"label":"第四篇","title":"柴犬「小豆」一週散步時間","text":["主人的筆記：「這週有兩天下雨，那兩天只在家門口的走廊走一走。週末不用上班，就帶牠去河濱公園。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","散步時間（分鐘）"],"per":1,"unit":"分鐘","data":[["星期一",40],["星期二",45],["星期三",15],["星期四",40],["星期五",20],["星期六",60],["星期日",60]],"qs":[{"q":"根據圖表和筆記，最可能下雨的是哪兩天？","opts":["星期六和星期日","星期一和星期四","星期二和星期三","星期三和星期五"],"ans":"D","steps":["文字：下雨的兩天只在走廊走一走 → 時間會很短","圖：最短的兩天是星期三15分鐘、星期五20分鐘","週六、週日最長，是去河濱公園"],"tests":"文字對到圖表","avoid":"文字的線索，去圖上找最高或最低"},{"q":"散步最久的是哪幾天？原因是什麼？","opts":["星期六和星期日，因為主人不用上班，帶牠去河濱公園","星期二，因為那天天氣最好","星期一和星期四，因為小豆比較有精神","星期六和星期日，因為天氣比較涼"],"ans":"A","steps":["圖：週六、週日都是60分鐘，最久","文字：「週末不用上班，就帶牠去河濱公園」","天氣好、天氣涼、有精神，筆記都沒寫"],"tests":"圖找事實，文找原因","avoid":"原因要在文字裡找得到"},{"q":"這一週散步最久的一天，是最短那天的幾倍？","opts":["2倍","3倍","4倍","5倍"],"ans":"C","steps":["最久：60分鐘（週六、週日）","最短：15分鐘（週三）","60 ÷ 15 ＝ 4"],"tests":"讀圖算倍數","avoid":"最大÷最小＝幾倍"},{"q":"下列哪一個說法，「不能」從圖表和筆記得知？","opts":["小豆星期二散步45分鐘","這週有兩天下雨","週末散步的時間比平日長","小豆最喜歡去河濱公園"],"ans":"D","steps":["45分鐘、兩天下雨、週末比較長：圖表或筆記都看得到","「最喜歡」是小豆的心情","圖表只有時間，筆記也沒寫牠喜歡什麼"],"tests":"分辨有沒有證據","avoid":"心情和喜好，圖表看不出來"}]},{"label":"第五篇","title":"六年甲班最喜歡的運動（全班 30 人，每人投一票）","text":["班會紀錄：「運動會的班際比賽，報名票數最多的兩個項目。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["運動項目","人數（人）"],"per":1,"unit":"人","data":[["籃球",12],["躲避球",8],["羽球",6],["跑步",3],["其他",1]],"qs":[{"q":"依照班會紀錄，班上要報名哪兩項？","opts":["籃球和躲避球","籃球和羽球","躲避球和羽球","籃球和跑步"],"ans":"A","steps":["文字：「報名票數最多的兩個項目」","圖：籃球12人最多，躲避球8人第二","所以報名籃球和躲避球"],"tests":"文字對到圖表","avoid":"看清楚文字要第幾名"},{"q":"喜歡籃球的人，占全班的幾分之幾？","opts":["五分之一","四分之一","三分之一","五分之二"],"ans":"D","steps":["標題：全班30人","圖：籃球12人","12 ÷ 30 ＝ 12/30 ＝ 五分之二"],"tests":"算比例","avoid":"全班人數在標題裡找"},{"q":"喜歡籃球的人數，是喜歡羽球的幾倍？","opts":["1.5倍","2倍","3倍","4倍"],"ans":"B","steps":["籃球12人，羽球6人","12 ÷ 6 ＝ 2","所以是2倍"],"tests":"讀圖算倍數","avoid":"誰是誰的幾倍，誰就放前面除"},{"q":"小美說：「跑步只有3人喜歡，所以全班都不喜歡跑步。」這句話錯在哪裡？","opts":["跑步其實有12人喜歡","圖表裡沒有跑步這一項","班會決定要報名跑步","還是有3人喜歡，不能說「全班都」"],"ans":"D","steps":["圖：跑步3人","有3人喜歡 → 不是「全班都不喜歡」","「全班都」是絕對字，和數據不合"],"tests":"找出錯誤推論","avoid":"看到「都」，用數據檢查一次"}]}]},{"no":"週末關卡","title":"葉公好龍","skill":"五步全用＋古今異義","steps":["❶ 先看題幹：問誰、問字，還是問道理","❷ 圈人物、補主詞；對話題找「曰」前面的人","❸ 古今異義：熟悉的字先換古代意思試（寫、走、去、子）","❹ 因果連鎖：把事件一格一格排好","❺ 寓言三問找道理，完成後錄一支 60 秒「古文翻譯官」短片"],"demo":{"q":"「葉公見之，棄而還走」的「走」是什麼意思？","a":["→ 古今異義：看到「走」，先換成「跑」","→ 代回：葉公看到真龍，丟下東西轉身就跑 → 通","答：跑（逃跑）"]},"parts":[{"label":"第一篇","title":"葉公好龍","text":["葉公子高好龍，鉤以寫龍，鑿以寫龍，屋室雕文以寫龍。於是天龍聞而下之，窺頭於牖，施尾於堂。葉公見之，棄而還走，失其魂魄，五色無主。是葉公非好龍也，好夫似龍而非龍者也。"],"cite":"《新序．雜事》","notes":"葉公子高：葉公，名叫子高　好：喜愛　鉤：衣帶上的鉤子　鑿：古代的一種器物　雕文：雕刻的花紋　窺：探頭看　施：拖、伸　堂：廳堂　還：轉身　五色無主：臉色變來變去，失去主張　夫：那些","trans":"葉公子高喜愛龍，衣帶鉤上畫著龍，器物上畫著龍，房屋裡雕刻的花紋也是龍。於是天上的真龍聽說了，就下凡到他家，從窗戶探頭進來，尾巴拖在廳堂上。葉公看見了，丟下東西轉身就逃，嚇得失魂落魄，臉色變來變去，不知如何是好。由此可見，葉公並不是真的喜愛龍，他喜愛的只是那些像龍卻不是龍的東西。","qs":[{"q":"「鉤以寫龍」的「寫」是什麼意思？","opts":["寫字","寫信","畫","抄寫"],"ans":"C","steps":["代回「寫字」：在衣帶鉤上寫龍字？怪怪的","後面「屋室雕文以寫龍」：雕刻花紋，是在畫圖案","寫＝畫，是古今異義"],"tests":"古今異義：寫","avoid":"「寫」後面接圖案，就是畫"},{"q":"「窺頭於牖，施尾於堂」，做這兩個動作的是誰？","opts":["葉公","天龍","葉公的僕人","畫上的龍"],"ans":"B","steps":["補主詞：往前一句「天龍聞而下之」","探頭、拖尾巴的是下凡的天龍","畫上的龍不會動"],"tests":"補主詞","avoid":"沒有主詞就往前一句找"},{"q":"下列哪一個事件鏈是正確的？","opts":["葉公到處畫龍 → 天龍聽說後下凡 → 葉公嚇得逃跑","天龍下凡 → 葉公開始畫龍 → 葉公逃跑","葉公逃跑 → 天龍下凡 → 葉公畫龍","葉公畫龍 → 葉公逃跑 → 天龍下凡"],"ans":"A","steps":["第一格：「好龍，鉤以寫龍……」","「於是天龍聞而下之」：於是＝因此，前面是原因","「葉公見之，棄而還走」放最後"],"tests":"排出事件鏈","avoid":"「於是」前面是因，後面是果"},{"q":"「葉公好龍」比喻哪一種人？","opts":["很會畫畫的人","勇敢面對困難的人","喜歡收集東西的人","嘴上說喜歡，真正遇到卻害怕逃避的人"],"ans":"D","steps":["表面：愛畫龍，真龍來了卻逃跑","作者結論：「好夫似龍而非龍者也」","像現實中只是表面喜歡、名不副實的人"],"tests":"寓言三問","avoid":"道理在作者最後的結論"}]},{"label":"第二篇","title":"一齊人傅之，眾楚人咻之","text":["有楚大夫於此，欲其子之齊語也，則使齊人傅諸？使楚人傅諸？曰：「使齊人傅之。」曰：「一齊人傅之，眾楚人咻之，雖日撻而求其齊也，不可得矣；引而置之莊嶽之間數年，雖日撻而求其楚，亦不可得矣。」"],"cite":"《孟子．滕文公下》（節選，孟子和宋國大臣戴不勝的對話，第一句是孟子的提問）","notes":"楚、齊：兩個國家，說的話不一樣　大夫：官員　諸：之乎，他……呢　咻：吵鬧　撻：用鞭子打　求：要求　莊嶽：齊國都城裡熱鬧的街市","trans":"孟子說：「有一位楚國大夫在這裡，想要他的兒子學說齊國話，那麼是找齊國人來教他呢？還是找楚國人來教他呢？」戴不勝說：「找齊國人來教他。」孟子說：「一個齊國人教他，卻有許多楚國人在旁邊吵鬧，就算每天用鞭子打他，要他說齊國話，也做不到；如果把他帶到齊國熱鬧的街市住上幾年，就算每天用鞭子打他，要他說楚國話，也做不到了。」","qs":[{"q":"「使齊人傅之」的「傅」是什麼意思？","opts":["師傅","傳送","附和","教導"],"ans":"D","steps":["前面說目的：「欲其子之齊語」，要兒子學齊國話","要學話 → 就要找人來教","傅＝教導；現代的「師傅」是名詞，這裡是動作"],"tests":"古今異義：傅","avoid":"看句子的目的來判斷動作"},{"q":"「曰：『使齊人傅之。』」是誰說的？","opts":["孟子","楚大夫","楚大夫的兒子","戴不勝"],"ans":"D","steps":["出處說明：第一句是孟子的提問","「曰」前面沒有人名，緊接在問題後面 → 是回答的人","和孟子對話的是戴不勝"],"tests":"對話題：找說話者","avoid":"問完下一句，通常換另一個人答"},{"q":"為什麼「雖日撻而求其齊也，不可得矣」？","opts":["齊國話太難學","老師教得不好","一個人教，卻有許多楚國人在旁邊吵","孩子不肯被打"],"ans":"C","steps":["往前一格：「一齊人傅之，眾楚人咻之」","一個人教，很多人吵 → 環境不對","所以就算天天打也學不會"],"tests":"往前找原因","avoid":"問為什麼，往前一格找"},{"q":"這段話想說明什麼道理？","opts":["學語言一定要被打才學得會","環境對學習的影響很大","楚國話比齊國話好聽","只要有一個好老師就足夠了"],"ans":"B","steps":["在楚國人中間：學不會齊國話","在齊國街市住幾年：連楚國話都說不出來","差別在環境 → 環境影響很大"],"tests":"比較兩種情況","avoid":"比較兩個結果，找出差在哪"}]},{"label":"第三篇","title":"梟將東徙","text":["梟逢鳩，鳩曰：「子將安之？」梟曰：「我將東徙。」鳩曰：「何故？」梟曰：「鄉人皆惡我鳴，以故東徙。」鳩曰：「子能更鳴，可矣；不能更鳴，東徙猶惡子之聲。」"],"cite":"《說苑．談叢》","notes":"梟：貓頭鷹一類的鳥　逢：遇見　鳩：斑鳩　徙：搬家　鄉人：這裡的人　鳴：叫聲　以故：因此","trans":"貓頭鷹遇到斑鳩，斑鳩問：「你要到哪裡去？」貓頭鷹說：「我要搬到東邊去。」斑鳩問：「為什麼？」貓頭鷹說：「這裡的人都討厭我的叫聲，所以我要搬到東邊。」斑鳩說：「你如果能改變叫聲，就可以了；如果不能改變叫聲，就算搬到東邊，那裡的人還是會討厭你的聲音。」","qs":[{"q":"「子將安之」是誰說的？「子」指誰？","opts":["梟說的，子指鳩","鳩說的，子指鳩的兒子","鳩說的，子指梟","梟說的，子指梟自己"],"ans":"C","steps":["找「曰」前面：「鳩曰」→ 鳩說的","子＝你（古今異義，不是兒子）","鳩對梟說話 → 你＝梟"],"tests":"對話題＋古今異義","avoid":"「子」先想成「你」"},{"q":"「鄉人皆惡我鳴」的「惡」是什麼意思？","opts":["兇惡","惡劣","討厭","噁心"],"ans":"C","steps":["代回「兇惡」：大家都兇惡我的叫聲？不通","代回「討厭」：大家都討厭我的叫聲 → 通","惡（ㄨˋ）＝討厭"],"tests":"一字多義：惡","avoid":"惡後面接東西，常是討厭"},{"q":"「子能更鳴」的「更」是什麼意思？","opts":["更加","再一次","夜晚的時辰","改變"],"ans":"D","steps":["鳩的建議要針對問題：大家討厭你的「鳴」","解決方法是把叫聲換掉","更（ㄍㄥ）＝改變，和「更正」的更一樣"],"tests":"一字多義：更","avoid":"建議要對準問題來讀"},{"q":"這則故事的道理是什麼？","opts":["搬家可以解決所有問題","問題出在自己，就要改變自己，換地方沒有用","斑鳩比貓頭鷹聰明","貓頭鷹應該永遠不要叫"],"ans":"B","steps":["表面：梟因為叫聲被討厭，想搬家","鳩說：不改叫聲，搬了還是被討厭","道理：要從自己改起"],"tests":"寓言三問","avoid":"誰說出解答，道理就在他的話裡"}]},{"label":"第四篇","title":"孫叔敖埋蛇","text":["孫叔敖為嬰兒之時，出遊，見兩頭蛇，殺而埋之。歸而泣，其母問其故，叔敖對曰：「聞見兩頭之蛇者死，嚮者吾見之，恐去母而死也。」其母曰：「蛇今安在？」曰：「恐他人又見，殺而埋之矣。」其母曰：「吾聞有陰德者，天報以福，汝不死也。」"],"cite":"《新序．雜事》（節選）","notes":"孫叔敖：春秋時楚國人，後來當了宰相　泣：哭　嚮者：剛才　安在：在哪裡　陰德：暗中做的好事　報：回報","trans":"孫叔敖還是小孩的時候，出去玩，看見一條兩頭蛇，就把牠打死埋了。回家後哭了起來，他母親問他原因，孫叔敖回答：「我聽說看見兩頭蛇的人會死，剛才我看見了，怕要離開母親死去了。」母親說：「蛇現在在哪裡？」他說：「我怕別人又看見，已經把牠打死埋起來了。」母親說：「我聽說暗中做好事的人，上天會用福氣回報他，你不會死的。」","qs":[{"q":"「孫叔敖為嬰兒之時」的「嬰兒」指什麼？","opts":["剛出生的寶寶","女孩子","還不會走路的人","年紀小的孩子"],"ans":"D","steps":["後面他能「出遊」、「殺而埋之」、回答母親","剛出生的寶寶做不到這些","古代「嬰兒」可以指年紀小的孩子"],"tests":"古今異義：嬰兒","avoid":"用人物做得到的事來判斷"},{"q":"「恐去母而死也」的「去」是什麼意思？","opts":["前往","離開","去除","過去"],"ans":"B","steps":["代回「前往」：怕前往母親那裡死掉？不通","代回「離開」：怕離開母親死去 → 通","古今異義：去＝離開"],"tests":"古今異義：去","avoid":"看到「去」，先換成「離開」"},{"q":"「曰：『恐他人又見，殺而埋之矣。』」是誰說的？","opts":["孫叔敖","母親","其他人","作者"],"ans":"A","steps":["上一句是母親問：「蛇今安在？」","「曰」前面沒有人名 → 是被問的人回答","所以是孫叔敖說的"],"tests":"對話題：找說話者","avoid":"「曰」前沒人名，看上一句誰問"},{"q":"母親說「汝不死也」，理由是什麼？","opts":["他怕別人受害而殺蛇埋蛇，是暗中做好事","兩頭蛇的傳說是假的","蛇已經埋起來，看不到了","他哭得很傷心"],"ans":"A","steps":["找母親的話：「吾聞有陰德者，天報以福」","孫叔敖的陰德：「恐他人又見，殺而埋之」","因為做了好事 → 母親說他不會死"],"tests":"找人物的理由","avoid":"理由要從說話的人那一句找"}]},{"label":"第五篇","title":"晏子之御","text":["晏子為齊相，出，其御之妻從門閒而闚其夫。其夫為相御，擁大蓋，策駟馬，意氣揚揚，甚自得也。既而歸，其妻請去。夫問其故。","妻曰：「晏子長不滿六尺，身相齊國，名顯諸侯。今者妾觀其出，志念深矣，常有以自下者。今子長八尺，乃為人僕御，然子之意自以為足，妾是以求去也。」"],"cite":"《史記．管晏列傳》（節選）","notes":"晏子：齊國宰相晏嬰　相：宰相　御：駕車的人　門閒：門縫　闚：偷看　擁大蓋：撐著大車篷　策：用鞭子趕　駟馬：四匹馬　自得：得意　既而：不久　尺：古代的尺比現在短　顯：顯揚　志念：思慮　自下：謙虛　妾：古代女子謙稱自己　自以為足：自以為很了不起　是以：因此","trans":"晏子當齊國宰相，有一次出門，他車夫的妻子從門縫偷看她的丈夫。她丈夫替宰相駕車，撐著大車篷，揮鞭趕著四匹馬，神氣十足，非常得意。不久車夫回家，妻子要求離開他。丈夫問她原因。妻子說：「晏子身高不到六尺，卻當上齊國宰相，名聲傳遍各國。今天我看他出門，思慮深遠，常常表現出謙虛的樣子。現在你身高八尺，只是替人駕車，卻自以為很了不起，我因此要求離開。」","qs":[{"q":"「其妻請去」的「去」是什麼意思？","opts":["離開","前往宰相家","去除","過去"],"ans":"A","steps":["後面妻子說「妾是以求去也」","她不滿丈夫的態度，要離開他","去＝離開，古今異義"],"tests":"古今異義：去","avoid":"去＝離開，這週背熟"},{"q":"「今子長八尺」的「子」指誰？","opts":["車夫","晏子","妻子的兒子","齊國國君"],"ans":"A","steps":["這是「妻曰」裡的話，妻子在對丈夫說話","子＝你，不是兒子","你＝她的丈夫，也就是車夫"],"tests":"古今異義：子＝你","avoid":"對話裡的「子」，先想成「你」"},{"q":"妻子要離開的原因是什麼？","opts":["丈夫身高太矮","晏子對她不好","丈夫只是駕車，卻自以為了不起，不如晏子謙虛","丈夫賺的錢太少"],"ans":"C","steps":["找「是以」前面的原因：「然子之意自以為足」","對比晏子：「常有以自下者」","矮的是晏子不是丈夫；錢的事文中沒說"],"tests":"因果：找原因","avoid":"「是以」前面就是原因"},{"q":"下列哪一個對照最正確？","opts":["晏子身高八尺，車夫不滿六尺","晏子個子矮卻謙虛，車夫個子高卻自滿","晏子和車夫都很得意","車夫比晏子更有名"],"ans":"B","steps":["晏子：長不滿六尺，常有以自下","車夫：長八尺，自以為足","兩人正好相反"],"tests":"人物對比","avoid":"把兩人的特點各列一行比較"}]}]}],"teach":[{"intro":"這一組深入學「古今異義」：同一個字，古代和現代的意思不一樣。","items":[{"t":"什麼是「古今異義」？","d":["一個字或詞，古代的意思和現在不同，用現代意思去讀就會讀錯。","例：「諸兒競走取之」，用現代的「走路」讀很怪，古代的「走」是跑。"],"ex":"就像「火鍋」：在餐桌上是吃的，在籃球場上是蓋人家火鍋，同一個詞換個地方，意思就變了。"},{"t":"常見古今異義整理（一）","d":["走：古＝跑（諸兒競走取之）；今＝走路","去：古＝離開（恐去母而死）；今＝前往","子：古＝你、兒子、果實（多子折枝）；今多指小孩","信：古＝果然、誠實、相信（取之，信然）；今多指書信"]},{"t":"常見古今異義整理（二）","d":["病：古＝病得重、很疲累（今日病矣）；今＝一般的生病","寫：古＝畫（鉤以寫龍）；今＝寫字","妻子：古＝妻子和兒女兩種人（率妻子邑人來此絕境）；今＝太太一個人"]},{"t":"怎麼抓出古今異義？","d":["讀到很熟的字，句子卻怪怪的，就是警訊。","換成古代意思再讀一次，讀得通、合情理才是答案。"]}],"demo":["「取之，信然」","代現代的「書信」：摘下來，書信是這樣？不通","代古代的「果然」：摘來一嚐，果然如此 → 通"]},{"intro":"這一組學對話題：一段文章裡好幾個人在說話，要分清楚每句話是誰說的。","items":[{"t":"「曰」前面就是說話的人","d":["「公欣然曰」→ 謝太傅說的；「兄子胡兒曰」→ 胡兒說的。","「曰」前面沒有人名時，看上一句：上一句是誰問，這一句通常是被問的人回答。"],"ex":"就像比賽轉播：主播說完換球評，一來一往輪流說。"},{"t":"稱謂換算表","d":["你：子、汝、爾、卿、若","我：吾、余、予、臣（對君王）、妾（女子）","親屬：兄子＝哥哥的兒子、兄女＝哥哥的女兒、大人＝父母、甲是乙之甥＝甲是乙的外甥"]},{"t":"引號是好幫手","d":["「」裡面是人物說的話，外面是作者的敘述。","例：「時戴在剡」在引號外面，是作者交代的背景。"]}],"demo":["「未若柳絮因風起」是誰說的？","找「曰」前面：「兄女曰」","換算：兄女＝謝太傅哥哥的女兒，也就是文末的「無奕女」"]},{"intro":"這一組學把事情一格一格排成事件鏈，看懂誰造成了誰。","items":[{"t":"什麼是「因果連鎖」？","d":["一件事造成下一件事，下一件又造成再下一件，像骨牌一樣倒下去。","塞翁失馬：馬跑了 → 帶回胡馬 → 兒子摔斷腿 → 不用上戰場。"],"ex":"就像一次抄截：抄到球 → 快攻 → 上籃得分 → 對手叫暫停。"},{"t":"看「弔」「賀」判斷好壞","d":["弔＝慰問：發生壞事，大家來安慰。","賀＝祝賀：發生好事，大家來恭喜。","塞翁失馬裡，好壞一直翻轉，這就是故事的重點。"]},{"t":"因果連接詞","d":["說原因：因、以……之故、何故","說結果：於是、是以、以故、果（果然，表示說過的事成真）"]}],"demo":["材料（〈曲突徙薪〉）：「客謂主人：『更為曲突，遠徙其薪；不者，且有火患。』主人嘿然不應。俄而家果失火。」","客人提醒 → 主人不理（嘿然不應）→ 果失火","「果」把提醒和失火連起來：客人說過的事真的發生了"]},{"intro":"第 2 週學過兩篇比一比；這一組練得更細：一句一句找對應，畫線連起來。","items":[{"t":"什麼是「對應句」？","d":["兩篇文章裡，意思一樣、只是說法不同的句子。","甲「擇其善者而從之」↔ 乙「看到隊友漂亮的傳球，我就記下來，下次照著做」。"],"ex":"就像戰術板上的箭頭：把每個隊員連到他該跑的位置。"},{"t":"畫線三步","d":["① 甲文拆成小句，每句寫白話。","② 在乙文找意思一樣的句子。","③ 畫線；沒有線的，就是「只有甲」或「只有乙」。"]},{"t":"小心「一字兩音」","d":["「知者樂水」的樂唸ㄧㄠˋ，是喜愛；「知者樂」的樂唸ㄌㄜˋ，是快樂。","樂後面接東西（水、山）是喜愛；放在最後沒接東西，是快樂。"]}],"demo":["材料：甲「三人行，必有我師焉」；乙「教練說，球場上的每一個人，都是你的老師。」","甲「必有我師焉」＝一定有可以當我老師的人","乙「每一個人，都是你的老師」","兩句都說身邊的人能當老師 → 畫線連起來"]},{"intro":"這一組學把圖表和一段文字放在一起看，找出它們對上的地方。","items":[{"t":"什麼是「圖文對讀」？","d":["題目給一張圖表，再給一段文字，答案要兩邊一起看才找得到。","圖表給數字，文字給原因或時間點。"],"ex":"就像看比賽數據表，再聽教練賽後訪問：數據說發生了什麼，教練說為什麼。"},{"t":"對讀四步","d":["① 看標題和單位。","② 找最高、最低、變化最大。","③ 在文字裡找時間點或原因。","④ 把文字對到圖上的那一格。"]},{"t":"推論要小心","d":["圖文只能推出「可能」，不能說「一定」。","圖表沒有的東西（心情、喜好、沒寫的原因），不能自己補。"]}],"demo":["材料：圖表「第1週 8 球、第2週 10 球、第3週 13 球、第4週 15 球」；文字「從第三週開始」寫下沒進的原因","圖：第2週10球 → 第3週13球，多3球","對上了：新做法開始那週，進步最多"]},{"intro":"週末關卡把這週的招式全部合起來用，再做一次古今異義大複習。","items":[{"t":"這週學了哪些招？","d":["古今異義、對話題、因果連鎖、互文對讀二、圖文對讀，加上前兩週的偵查五步。"]},{"t":"古今異義再複習","d":["寫＝畫（鉤以寫龍）","走＝跑（棄而還走）","去＝離開（恐去母而死、其妻請去）","子＝你（子將安之、今子長八尺）"],"ex":"就像同一個隊友在不同戰術裡打不同位置，先看他現在站在哪裡。"},{"t":"一篇文章怎麼用五步？","d":["先看題幹 → 圈人物、補主詞 → 古今異義代回 → 排事件鏈 → 寓言三問找道理。"]}],"demo":["「葉公見之，棄而還走」","補主詞：葉公看見天龍","走＝跑 → 嚇得轉身就逃"]}],"daily":[{"words":[["子","果實","多子折枝"],["信","果然","信然"]],"line":"樹在道邊而多子，此必苦李。"},{"words":[["俄而","不久","俄而雪驟"],["未若","不如","未若柳絮因風起"]],"line":"未若柳絮因風起。"},{"words":[["弔","慰問","人皆弔之"],["居","過了","居數月"]],"line":"此何遽不為福乎？"},{"words":[["擇","選擇","擇善固執"],["從","跟隨學習","從善如流"]],"line":"三人行，必有我師焉。"},{"words":[["寫","畫","鉤以寫龍"],["牖","窗戶","窺頭於牖"]],"line":"是葉公非好龍也。"},null],"quiz":{"words":[["子","果實","看道邊李樹多子折枝"],["信","果然","取之，信然"],["俄而","不久","俄而雪驟"],["未若","不如","未若柳絮因風起"],["弔","慰問","人皆弔之"],["居","過了","居數月"],["擇","選擇","擇其善者而從之"],["從","跟隨學習","擇其善者而從之"],["寫","畫","鉤以寫龍"],["牖","窗戶","窺頭於牖"]],"lines":[["樹在道邊而多子，","此必苦李。"],["未若柳絮","因風起。"],["此何遽","不為福乎？"],["三人行，","必有我師焉。"],["是葉公","非好龍也。"]],"parts":[{"title":"楊布打狗","text":["楊朱之弟曰布。衣素衣而出，天雨，解素衣，衣緇衣而反。其狗不知，迎而吠之。楊布怒，將撲之。楊朱曰：「子無撲矣！子亦猶是也。嚮者使汝狗白而往，黑而來，豈能無怪哉？」"],"cite":"《列子．說符》","notes":"楊朱：戰國時的思想家　素：白色　緇：黑色　反：同「返」，回來　吠：狗叫　撲：打　猶：如同　嚮者：剛才　使：假如","trans":"楊朱的弟弟叫楊布，穿著白色的衣服出門。天下起雨，他脫下白衣，換穿黑衣回家。他的狗認不出他，迎上前對他叫。楊布很生氣，要打牠。楊朱說：「你不要打牠！你也會像牠一樣啊。假如剛才你的狗出去時是白的，回來時變成黑的，你難道能不覺得奇怪嗎？」","qs":[{"q":"「衣素衣而出」的第一個「衣」是什麼意思？","opts":["衣服","穿","白色","脫下"],"ans":"B","steps":["第一個「衣」後面接著「素衣」（白衣服），所以它是動作","代回：穿著白衣服出門 → 通","名詞當動詞：衣＝穿"],"tests":"詞性變化：衣","avoid":"名詞後面又接名詞，前面常是動作"},{"q":"「天雨」的「雨」是什麼意思？","opts":["雨水","下雨","雨傘","雨季"],"ans":"B","steps":["「天雨」：天怎麼了？要一個動作","後面「解素衣」，因為衣服淋濕了","雨＝下雨，當動詞"],"tests":"詞性變化：雨","avoid":"主詞後面的字，常是動作"},{"q":"「迎而吠之」的「之」指誰？","opts":["狗","楊朱","黑衣服","楊布"],"ans":"D","steps":["這句的主詞是「其狗」","狗認不出換了黑衣的主人，對著他叫","之＝楊布"],"tests":"代詞「之」指誰","avoid":"「之」是被做動作的人"},{"q":"「子無撲矣」是誰對誰說的？","opts":["楊布對楊朱","楊布對狗","楊朱對楊布","楊朱對狗"],"ans":"C","steps":["找「曰」前面：「楊朱曰」","前一句是楊布要打狗","子＝你，楊朱在勸弟弟楊布"],"tests":"對話題：找說話者","avoid":"先找「曰」，再看在回應誰"},{"q":"楊朱想告訴楊布什麼道理？","opts":["狗很笨，不必理牠","白衣服比黑衣服好看","外表變了別人認不出來很正常，不該隨便怪別人","下雨天不要出門"],"ans
