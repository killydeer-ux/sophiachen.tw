漁翁得利）"],"tests":"寓言三問","avoid":"看最後的結果，誰得到好處"},{"q":"「兩者不肯相舍」的「兩者」指誰？","opts":["漁夫和鷸","蚌和漁夫","天和雨","鷸和蚌"],"ans":"D","steps":["前面說話的是鷸和蚌","互相夾住、不肯放開的也是牠們","漁夫是後來才出現的 → 答 D"],"tests":"補主詞","avoid":"往前找正在吵架的兩方"}]},{"label":"第二篇","title":"歧路亡羊","text":["楊子之鄰人亡羊，既率其黨，又請楊子之豎追之。楊子曰：「嘻！亡一羊，何追者之眾？」鄰人曰：「多歧路。」既反，問：「獲羊乎？」曰：「亡之矣。」曰：「奚亡之？」曰：「歧路之中又有歧焉，吾不知所之，所以反也。」"],"cite":"《列子．說符》（節選）","notes":"楊子：楊朱，戰國時的思想家　率：帶領　黨：親友　豎：童僕　嘻：唉　歧路：岔路　反：同「返」，回來　獲：找到　奚：為什麼","trans":"楊子的鄰居丟了一隻羊，已經帶著親友去找，又來請楊子的童僕一起去追。楊子說：「唉！丟了一隻羊，為什麼要這麼多人去追？」鄰居說：「岔路很多。」回來以後，楊子問：「找到羊了嗎？」鄰居說：「還是丟了。」楊子問：「為什麼會丟了呢？」鄰居說：「岔路之中又有岔路，我們不知道羊往哪裡去了，所以只好回來。」","qs":[{"q":"「楊子之鄰人亡羊」的「亡」是什麼意思？","opts":["死亡","沒有","丟失","逃亡的人"],"ans":"C","steps":["代回「鄰居死了羊」→ 不合，後面在追羊","代回「鄰居丟了羊」→ 通","杞人憂天的「亡」是沒有，這裡不同 → 答 C"],"tests":"一字多義：亡","avoid":"同一個字，在每篇都要重新代回"},{"q":"「吾不知所之」的「之」是什麼意思？","opts":["往，去","他","的","這個"],"ans":"A","steps":["前文：岔路之中又有岔路","代回「不知道羊往哪裡去」→ 通","之放在「所」後面當動作 → 答 A"],"tests":"一字多義：之","avoid":"之可以是他、的、往，都試試"},{"q":"為什麼追羊的人那麼多？","opts":["羊跑得很快","岔路很多","鄰居很有錢","楊子要大家去"],"ans":"B","steps":["楊子問：「何追者之眾？」","鄰人回答：「多歧路。」","岔路多，要分頭找 → 答 B"],"tests":"找人物的理由","avoid":"問句後面緊接的回答就是證據"},{"q":"這個故事想告訴我們什麼？","opts":["追羊一定要找很多人","羊很難養","不要隨便幫鄰居","岔路太多會迷失方向，做事要掌握正確方向"],"ans":"D","steps":["表面：岔路又有岔路，羊找不到","像誰：方向太多、不知道往哪走的人","道理：要掌握方向，不然會迷失 → 答 D"],"tests":"寓言三問","avoid":"看最後的結果：為什麼失敗"}]},{"label":"第三篇","title":"畫荻教子","text":["歐陽修字永叔，廬陵人。四歲而孤，母鄭，守節自誓，親誨之學。家貧，至以荻畫地學書。幼敏悟過人，讀書輒成誦。"],"cite":"《宋史．歐陽修傳》（節選）","notes":"廬陵：今江西吉安　守節自誓：發誓不再嫁　誨：教導　荻：像蘆葦的草　敏悟：聰明、理解力強","trans":"歐陽修，字永叔，廬陵人。四歲時父親就過世了，母親鄭氏發誓不再嫁，親自教他讀書。家裡很窮，甚至用荻草在地上寫字來學習。歐陽修從小就聰明過人，書讀過就能背下來。","qs":[{"q":"「四歲而孤」的「孤」是什麼意思？","opts":["孤單","父親過世","孤兒院","一個人住"],"ans":"B","steps":["後文只寫「母鄭」親自教他，沒有提到父親","古文「孤」指小時候失去父親","代回「四歲時父親過世」→ 通 → 答 B"],"tests":"古今異義：孤","avoid":"古文的孤，常指幼年喪父"},{"q":"「至以荻畫地學書」的「書」是什麼意思？","opts":["書本","信","寫字","書法家"],"ans":"C","steps":["「畫地學書」：在地上畫著學","在地上學的是寫字","郢書燕說「夜書」也是寫字 → 答 C"],"tests":"一字多義：書","avoid":"書前面有動作時，常是寫字"},{"q":"可以推知歐陽修為什麼「以荻畫地學書」？","opts":["家裡窮，買不起紙筆","荻草寫起來比較漂亮","老師規定要這樣寫","他比較喜歡畫畫"],"ans":"A","steps":["證據：前一句「家貧」","「至」＝甚至，窮到要用荻草在地上寫","B、C、D 文中都沒說 → 答 A"],"tests":"從證據推原因","avoid":"原因常在前一句"},{"q":"「讀書輒成誦」的意思是？","opts":["讀書總是很慢","讀書時一定大聲唸","讀書要唸經","書一讀就能背誦"],"ans":"D","steps":["輒＝就；成誦＝能背出來","前一句「幼敏悟過人」：很聰明","聰明，所以一讀就會背 → 答 D"],"tests":"句意理解","avoid":"用前一句的形容來確認句意"}]},{"label":"第四篇","title":"孟母斷織","text":["孟子之少也，既學而歸，孟母方績，問曰：「學何所至矣？」孟子曰：「自若也。」孟母以刀斷其織。孟子懼而問其故，孟母曰：「子之廢學，若吾斷斯織也。……」","孟子懼，旦夕勤學不息，師事子思，遂成天下之名儒。"],"cite":"《列女傳．母儀．鄒孟軻母》（節選）","notes":"既：已經　方：正在　績：把麻搓成線，這裡指織布　自若：和原來一樣　斯：這　旦夕：早晚　師事：拜……為老師　子思：孔子的孫子　名儒：有名的學者","trans":"孟子小時候，有一次放學回家，孟母正在織布，問他：「學習學到哪裡了？」孟子說：「跟以前一樣。」孟母就用刀把織好的布割斷。孟子害怕地問她原因，孟母說：「你荒廢學業，就像我割斷這塊布一樣。……」孟子很害怕，從此早晚勤奮讀書不停止，拜子思為老師，終於成為天下有名的學者。","qs":[{"q":"「孟子懼而問其故」的「故」是什麼意思？","opts":["所以","故意","原因","從前"],"ans":"C","steps":["代回「孟子害怕地問她原因」→ 通","後面孟母就解釋為什麼斷織","不死之藥「臣故食之」的故是所以，這裡不同 → 答 C"],"tests":"一字多義：故","avoid":"「問其故」的故，就是原因"},{"q":"「若吾斷斯織也」的「若」是什麼意思？","opts":["好像","你","如果","若干"],"ans":"A","steps":["代回「就像我割斷這塊布」→ 通","孟母在拿斷布比喻廢學","杞人憂天「若屈伸呼吸」的若是你，這裡不同 → 答 A"],"tests":"一字多義：若","avoid":"比喻句裡的若，常是「好像」"},{"q":"孟母割斷布，想讓孟子明白什麼？","opts":["布不值錢","讀書半途而廢，就像布被割斷，前功盡棄","媽媽很生氣要處罰他","織布很辛苦"],"ans":"B","steps":["證據：「子之廢學，若吾斷斯織也」","斷布＝廢學，比喻","結果孟子「旦夕勤學不息」，他懂了 → 答 B"],"tests":"比喻和道理","avoid":"先找比喻句，再找人物的反應"},{"q":"「遂成天下之名儒」的「遂」是什麼意思？","opts":["順利","遂願","立刻","終於"],"ans":"D","steps":["前面：「旦夕勤學不息，師事子思」","長時間努力，最後成為名儒","不是「立刻」，是努力後的結果 → 答 D"],"tests":"虛詞：遂","avoid":"遂常接在努力之後，表示結果"}]},{"label":"第五篇","title":"曾參殺人","text":["昔者曾子處費，費人有與曾子同名族者而殺人。人告曾子母曰：「曾參殺人。」曾子之母曰：「吾子不殺人。」織自若。有頃焉，人又曰：「曾參殺人。」其母尚織自若也。頃之，一人又告之曰：「曾參殺人。」其母懼，投杼踰牆而走。"],"cite":"《戰國策．秦策二》（節選）","notes":"曾子：曾參，孔子的學生　處：住　費：地名　名族：姓名　織自若：照常織布　有頃：過了一會兒　杼：織布的梭子　投：丟下　踰：翻過","trans":"從前曾子住在費地，費地有個和曾子同名同姓的人殺了人。有人告訴曾子的母親說：「曾參殺人了。」曾子的母親說：「我的兒子不會殺人。」照樣織布。過了一會兒，又有人說：「曾參殺人了。」她還是照常織布。又過了一會兒，又有一個人來告訴她：「曾參殺人了。」曾子的母親害怕了，丟下梭子，翻牆逃走了。","qs":[{"q":"真正殺人的是誰？","opts":["曾子","曾子的母親","和曾子同名同姓的費地人","來報信的人"],"ans":"C","steps":["證據：「費人有與曾子同名族者而殺人」","殺人的是同名的另一個人","A 是傳言弄錯的對象 → 答 C"],"tests":"補主詞","avoid":"主詞要回到原句找，不能聽傳言"},{"q":"「其母尚織自若也」的「尚」是什麼意思？","opts":["崇尚","高尚","還，仍然","時尚"],"ans":"C","steps":["前面第一次聽到時「織自若」","第二次聽到，她「尚」織自若","代回「還是照常織布」→ 通 → 答 C"],"tests":"虛詞：尚＝還","avoid":"和前一次比，就知道是「還」"},{"q":"曾子的母親最後為什麼逃走？","opts":["第三個人也這樣說，她開始相信了","她親眼看到曾子殺人","布已經織完了","官差來抓她"],"ans":"A","steps":["第一、二次：照常織布，不信","第三次：「其母懼，投杼踰牆而走」","聽了三次就信了；B、C、D 文中沒說 → 答 A"],"tests":"從證據推原因","avoid":"比較前後的反應有什麼不同"},{"q":"這個故事和本週哪一個成語的道理最像？","opts":["狐假虎威","鷸蚌相爭","自相矛盾","三人成虎"],"ans":"D","steps":["本篇：說的人多了，連母親都信了謠言","三人成虎：三個人說，就信市集有老虎","道理都是謠言重複就讓人相信 → 答 D"],"tests":"寓言道理對照","avoid":"先說出道理，再找道理一樣的"}]}]}],"teach":[{"intro":"這一組學會考最常出的新題型：兩篇文章放在一起比較。","items":[{"t":"什麼是「互文對讀」？","d":["把兩篇文章放在一起讀，比較它們哪裡一樣、哪裡不一樣。","國中會考常出這種題目，有時一篇文言、一篇白話。"],"ex":"就像比賽前比較兩隊球員的數據：誰得分多、誰籃板多。"},{"t":"比較表怎麼畫？","d":["畫四格：甲說什麼｜乙說什麼｜相同｜不同。","先在甲、乙各寫一句話，再把意思一樣的連線。"]},{"t":"題目怎麼對應？","d":["問「兩篇都」「共同」→ 看有連線的（相同）。","問「只有甲」「甲有乙沒有」→ 看沒連線的（不同）。"]}],"demo":["甲「學而時習之」＝學了常常複習","乙「每天投一百球」＝反覆練習","兩句意思一樣 → 在比較表上連線"]},{"intro":"這一組學「一個字有好幾個意思」，會考很愛考。","items":[{"t":"什麼是「一字多義」？","d":["一個字在不同句子裡，意思不一樣。","例：「打」——打球、打電話、打毛衣，意思都不同。"],"ex":"就像「傳」：傳球、傳話、傳說，看後面接什麼。"},{"t":"「亡」的意思整理","d":["失去：「終亡其酒」（畫蛇添足）","沒有：「身亡所寄」（本組）","逃跑：之後會在塞翁失馬遇到","死亡：現代最常用的意思"]},{"t":"怎麼判斷是哪一個？","d":["把每個意思都代回去讀，通的才是答案。這就是第 1 週學的「選項代回去」。"]}],"demo":["「身亡所寄」的「亡」","代「死亡」不通；代「失去」→ 失去所寄，怪怪的","代「沒有」→ 沒有地方安身 → 通"]},{"intro":"這一組學「推論」：文章沒有直接寫，但可以從證據推出來。","items":[{"t":"什麼是「推論」？","d":["用文章裡寫的事實，推出文章沒直接說的結論。"],"ex":"就像偵探看到地上有濕腳印，推出「剛才有人從外面進來」。"},{"t":"推論和腦補有什麼不同？","d":["推論：有證據，一定推得出來。","腦補：自己想的，文章沒有證據。","會考的錯誤選項，很多就是「聽起來合理，但文章沒說」。"]},{"t":"什麼是「雙重否定」？","d":["兩個否定字放在一起，意思變成肯定。","「無不陷」＝沒有不能刺穿的＝全部都刺得穿。"]}],"demo":["「於物無不陷也」","無＝沒有，不＝不能 → 沒有東西不能刺穿","＝什麼東西都刺得穿"]},{"intro":"文章變長了。這一組學一個讀長文不會亂的方法：每段寫一句話。","items":[{"t":"什麼是「段落重點」？","d":["每一段最想告訴你的那一件事。","通常在段落第一句，或在「但是」「所以」後面。"],"ex":"就像看比賽精華：每一節挑一個最關鍵的球。"},{"t":"重點和例子怎麼分？","d":["重點：作者的主張。","例子：用來支持主張的事情，例如「有人熬夜後上課昏昏沉沉」。","比喻：用熟悉的東西幫你懂，例如「把球收進球籃」。"]},{"t":"全文大意怎麼來？","d":["把每段的一句話連起來，就是全文大意，也就是摘要。"]}],"demo":["讀完第一段，停下來","找到「但是」→ 後面說睡覺時大腦會整理","在旁邊寫：睡覺時大腦在整理學過的東西"]},{"intro":"這一組學讀寓言，很多成語都是從寓言來的。","items":[{"t":"什麼是「寓言」？","d":["用動物或小故事來講道理的文章。","守株待兔、刻舟求劍、畫蛇添足都是寓言，後來變成成語。"],"ex":"就像教練放一段失誤的影片，讓全隊學到一個道理。"},{"t":"寓言三問","d":["① 故事表面發生什麼事？","② 故事裡的角色，像現實中的哪種人？","③ 作者想告訴我們什麼道理？"]},{"t":"寓言和成語","d":["寓言的道理，常常就是那個成語的意思。","讀懂寓言，等於多會一個成語，作文也用得上。"]}],"demo":["守株待兔　表面：農夫等兔子","像誰：想不努力就有收穫的人","道理：不能把一次運氣當成每次都會發生"]},{"intro":"週末關卡把這週學的全部合在一起用，再學一個新詞：同「某字」。","items":[{"t":"這週學了哪些招？","d":["互文對讀、一字多義、推論、段落重點、寓言三問，加上第 1 週的偵查五步。"]},{"t":"什麼是「同某字」？","d":["古人有時借用另一個字來寫，注釋會寫「同某」。","「禽，同擒」→ 意思是抓。「說，同悅」→ 意思是高興。","看到注釋寫「同」，就用後面那個字的意思讀。"],"ex":"就像隊友的綽號，叫法不同，指的是同一個人。"}],"demo":["「漁者得而并禽之」","注釋：禽，同「擒」","漁夫把牠們一起抓走"]}],"daily":[{"words":[["說","高興（同悅）","不亦說乎"],["慍","生氣","人不知而不慍"]],"line":"學而時習之，不亦說乎？"},{"words":[["亡","沒有","身亡所寄"],["曉","使人明白","家喻戶曉"]],"line":"天，積氣耳，亡處亡氣。"},{"words":[["莫","沒有","莫名其妙"],["或","有人","或曰"]],"line":"吾盾之堅，莫能陷也。"},{"words":[["弗","不","弗能應"],["譽","誇讚","毀譽參半"]],"line":"以子之矛，陷子之盾，何如？"},{"words":[["畏","怕","後生可畏"],["然","對的","不以為然"]],"line":"虎不知獸畏己而走也。"},null],"quiz":{"words":[["說","高興（同悅）","不亦說乎"],["慍","生氣","人不知而不慍"],["亡","沒有","身亡所寄"],["曉","使人明白","因往曉之"],["莫","沒有","莫能陷也"],["或","有人","或曰：「以子之矛……」"],["弗","不","其人弗能應也"],["譽","誇讚","譽之曰"],["畏","怕","虎不知獸畏己而走也"],["然","對的","虎以為然"]],"lines":[["學而時習之，","不亦說乎？"],["天，積氣耳，","亡處亡氣。"],["吾盾之堅，","莫能陷也。"],["以子之矛，","陷子之盾，何如？"],["虎不知獸畏己而走也，","以為畏狐也。"]],"parts":[{"label":"第一篇","title":"揠苗助長","text":["宋人有閔其苗之不長而揠之者，芒芒然歸，謂其人曰：「今日病矣！予助苗長矣！」其子趨而往視之，苗則槁矣。"],"cite":"《孟子．公孫丑上》","notes":"閔：擔心　揠：拔　芒芒然：疲倦的樣子　其人：他家裡的人　予：我　趨：快走　槁：枯乾","trans":"宋國有個人擔心他的禾苗長不高，就把禾苗一棵棵往上拔，然後疲倦地回到家，對家裡的人說：「今天累壞了！我幫助禾苗長高了！」他的兒子趕快跑去看，禾苗都已經枯死了。","qs":[{"q":"「今日病矣」的「病」是什麼意思？","opts":["生病","疲累","錯誤","擔心"],"ans":"B","steps":["前面「芒芒然歸」：疲倦地回家","代回「今天好累啊」→ 通","古今異義：現在的病是生病"],"tests":"古今異義：病","avoid":"看到「病」，先想想「累」"},{"q":"「其子趨而往視之」的「之」指什麼？","opts":["宋人","禾苗","家人","天空"],"ans":"B","steps":["兒子聽到「助苗長」","趕快去看的是苗","後面「苗則槁矣」也證明是去看苗"],"tests":"代詞「之」指什麼","avoid":"「之」往前找被看的東西"},{"q":"這個故事告訴我們什麼？","opts":["種田要早起","違反事物生長的規律、急著求成，反而壞事","要多幫助別人","禾苗很容易枯"],"ans":"B","steps":["表面：拔苗想讓它長快","結果：苗都枯了","道理：急於求成反而壞事（揠苗助長）"],"tests":"寓言的道理","avoid":"先看結果，再說道理"},{"q":"宋人為什麼要把禾苗往上拔？","opts":["擔心苗長不高，想幫它長快一點","想把苗拔回家種","苗長得太密了","兒子叫他這樣做"],"ans":"A","steps":["證據：「閔其苗之不長而揠之」","閔＝擔心，擔心苗長不高","後文他也說「予助苗長矣」→ 答 A"],"tests":"找原因的證據","avoid":"原因常和動作寫在同一句"},{"q":"「謂其人曰」是誰在對家人說話？","opts":["宋人的兒子","禾苗","鄰居","那個拔苗的宋人"],"ans":"D","steps":["前一句：拔苗的宋人「芒芒然歸」","回到家，對家人說話的就是他","兒子是後面才出現的 → 答 D"],"tests":"補主詞","avoid":"沒寫主詞，就往前一句找"}]},{"label":"第二篇","title":"苛政猛於虎","text":["孔子過泰山側，有婦人哭於墓者而哀。夫子式而聽之，使子路問之，曰：「子之哭也，壹似重有憂者。」而曰：「然。昔者吾舅死於虎，吾夫又死焉，今吾子又死焉。」夫子曰：「何為不去也？」曰：「無苛政。」夫子曰：「小子識之，苛政猛於虎也。」"],"cite":"《禮記．檀弓下》","notes":"側：旁邊　夫子：指孔子　式：同「軾」，扶著車前的橫木，表示敬意　子路：孔子的學生　壹：實在　重：一再、好幾層　舅：丈夫的父親　焉：在這裡　苛政：殘酷的政令、繁重的賦稅　小子：你們這些學生　識：同「誌」，記住","trans":"孔子經過泰山旁邊，有個婦人在墓前哭得很悲傷。孔子扶著車前的橫木聽她哭，派子路去問她說：「你這樣哭，實在像是有好幾重傷心事的樣子。」婦人就說：「是的。從前我的公公被老虎咬死，我的丈夫也被老虎咬死，現在我的兒子又被老虎咬死了。」孔子說：「為什麼不離開這裡呢？」婦人說：「這裡沒有殘酷的政令。」孔子說：「學生們要記住，殘酷的政令比老虎還要兇猛啊！」","qs":[{"q":"「何為不去也」的「去」是什麼意思？","opts":["前往","距離","離開","去年"],"ans":"C","steps":["代回「為什麼不離開這裡呢」→ 通","婦人回答的是留下來的理由","兩小兒辯日「去人近」的去是距離，這裡不同 → 答 C"],"tests":"一字多義：去","avoid":"同一個字，每篇都要重新代回"},{"q":"「然。昔者吾舅死於虎」的「然」是什麼意思？","opts":["是的，對","但是","這樣地","燃燒"],"ans":"A","steps":["子路說她像有好幾重傷心事","婦人先回答「然」，再說家人都被虎咬死","是在承認子路說對了 → 答 A"],"tests":"一字多義：然","avoid":"回答問話開頭的然，是「是的」"},{"q":"婦人的家人都被老虎咬死，她卻不搬走，原因是？","opts":["她捨不得離開墓地","這裡沒有苛政","她不怕老虎","孔子叫她留下"],"ans":"B","steps":["孔子問：「何為不去也？」","婦人答：「無苛政。」","A、C、D 文中都沒說 → 答 B"],"tests":"找人物的理由","avoid":"問句後面的回答就是證據"},{"q":"孔子說「苛政猛於虎」，是從哪個事實推出來的？","opts":["老虎很兇猛","子路很怕老虎","泰山附近很危險","婦人寧願冒著被虎咬的危險，也不願搬到有苛政的地方"],"ans":"D","steps":["事實一：三代人都被老虎咬死","事實二：她還是不走，因為這裡「無苛政」","兩個事實放一起：苛政比老虎更可怕 → 答 D"],"tests":"兩個事實推結論","avoid":"推論要把兩個事實合起來"},{"q":"「子之哭也」的「子」指誰？","opts":["孔子","子路","婦人","婦人的兒子"],"ans":"C","steps":["這句是子路去問婦人時說的話","子＝你，指被問的人","被問的是正在哭的婦人 → 答 C"],"tests":"代詞「子」指誰","avoid":"子當「你」時，指聽話的那個人"}]}]}},{"week":3,"groups":[{"no":"第 1 組","title":"王戎識李","skill":"古今異義：古今意思不一樣","steps":["❶ 看到很熟的字，先停一下：古代也是這個意思嗎？","❷ 用現代意思代回去讀，覺得怪怪的就是警訊","❸ 換成古代意思（走＝跑、去＝離開、子＝你或果實）再讀一次","❹ 用前後文確認：讀得通、合情理才是答案"],"demo":{"q":"「諸兒競走取之」的「走」是什麼意思？","a":["→ 用現代的「走路」代回：小孩們比賽走路去摘？怪怪的","→ 用古代的「跑」代回：小孩們搶著跑去摘李子 → 通","答：跑"]},"parts":[{"label":"第一篇","title":"王戎識李","text":["王戎七歲，嘗與諸小兒遊。看道邊李樹多子折枝，諸兒競走取之，唯戎不動。人問之，答曰：「樹在道邊而多子，此必苦李。」取之，信然。"],"cite":"《世說新語．雅量》","notes":"王戎：晉朝人　嘗：曾經　諸：許多　遊：玩耍　折枝：把樹枝壓彎、壓斷　競：搶著　唯：只有","trans":"王戎七歲的時候，曾經和許多小孩一起玩。看見路邊的李樹結了很多果實，把樹枝都壓彎了，小孩們都搶著跑去摘，只有王戎不動。有人問他為什麼，他回答：「樹長在路邊，卻還結了這麼多果實，這一定是苦的李子。」摘來一嚐，果然是這樣。","qs":[{"q":"「看道邊李樹多子折枝」的「子」是什麼意思？","opts":["果實","兒子","你","小孩"],"ans":"A","steps":["找證據：「李樹多子折枝」，主角是李樹","樹不會有兒子；多到把樹枝壓彎的，是果實","古今異義：子在這裡＝果實"],"tests":"古今異義：子","avoid":"「子」先看前面是人還是樹"},{"q":"「諸兒競走取之」的「走」是什麼意思？","opts":["走路","離開","走漏","跑"],"ans":"D","steps":["代回現代的「走路」：比賽走路去摘？不合常理","代回古代的「跑」：搶著跑去摘 → 通","「競」是搶著，搶著當然是用跑的"],"tests":"古今異義：走","avoid":"看到「走」，先換成「跑」讀讀看"},{"q":"「取之，信然」的「信」是什麼意思？","opts":["書信","果然","相信","誠實"],"ans":"B","steps":["前面王戎說「此必苦李」","「取之」摘來一嚐，接著「信然」","結果和王戎說的一樣 → 信＝果然"],"tests":"古今異義：信","avoid":"「信然」就讀成「果然如此」"},{"q":"王戎怎麼知道那是苦李？","opts":["他以前嚐過這棵樹的李子","他看出李子的顏色是綠的","其他小孩先告訴他的","路邊的樹人人摘得到，卻還結滿果實，表示沒人想摘"],"ans":"D","steps":["找王戎說的話：「樹在道邊而多子」","在路邊，誰經過都能摘，卻還有這麼多果實","沒人要摘 → 一定不好吃"],"tests":"從證據推論","avoid":"答案要從人物說的話裡找"}]},{"label":"第二篇","title":"鍾毓鍾會","text":["鍾毓、鍾會少有令譽。年十三，魏文帝聞之，語其父鍾繇曰：「可令二子來。」於是敕見。毓面有汗，帝曰：「卿面何以汗？」毓對曰：「戰戰惶惶，汗出如漿。」復問會：「卿何以不汗？」對曰：「戰戰慄慄，汗不敢出。」"],"cite":"《世說新語．言語》","notes":"鍾毓、鍾會：兄弟兩人　譽：名聲　語：告訴　敕見：皇帝下令召見　卿：你（皇帝稱臣子）　惶惶：害怕　漿：湯水　慄慄：發抖","trans":"鍾毓、鍾會兄弟年少時就有好名聲。十三歲時，魏文帝聽說了，告訴他們的父親鍾繇說：「可以叫你的兩個兒子來見我。」於是下令召見。鍾毓臉上有汗，文帝問：「你臉上為什麼出汗？」鍾毓回答：「我又緊張又害怕，汗像湯水一樣流出來。」文帝又問鍾會：「你為什麼不出汗？」鍾會回答：「我緊張害怕得發抖，汗都不敢流出來。」","qs":[{"q":"「少有令譽」的「令譽」是什麼意思？","opts":["皇帝的命令","很少的稱讚","好名聲","讓人羨慕的獎品"],"ans":"C","steps":["譽＝名聲（注釋）","皇帝聽說後還想見他們，可見名聲很好","令在這裡＝美好，不是現代的「命令」"],"tests":"古今異義：令","avoid":"「令」放在名詞前，常是美好"},{"q":"「少有令譽」的「少」是什麼意思？","opts":["很少","缺少","少數","年少的時候"],"ans":"D","steps":["代回「很少」：很少有好名聲？那皇帝怎麼會想見","後面接著說「年十三」，講的是年紀","少（ㄕㄠˋ）＝年少"],"tests":"古今異義：少","avoid":"「少」後面講年紀，就是年少"},{"q":"「可令二子來」的「二子」是指誰？","opts":["鍾毓和鍾會兄弟","魏文帝的兩個兒子","兩個學生","隨便兩個小孩"],"ans":"A","steps":["這句話是對「其父鍾繇」說的","對父親說「二子」→ 他的兩個兒子","就是開頭的鍾毓、鍾會"],"tests":"古今異義：子＝兒子","avoid":"先看說話的對象是誰"},{"q":"鍾會說「汗不敢出」，最能看出他什麼特點？","opts":["一點也不害怕皇帝","反應很快，能順著問題巧妙回答","身體不容易流汗","不想回答皇帝"],"ans":"B","steps":["皇帝問：你為什麼不出汗","鍾會說「戰戰慄慄」，表示他也在發抖、也害怕","把不流汗說成怕到汗不敢出，回答得很巧妙"],"tests":"推論人物特點","avoid":"人物說的話就是證據"}]},{"label":"第三篇","title":"人琴俱亡","text":["王子猷、子敬俱病篤，而子敬先亡。子猷問左右：「何以都不聞消息？此已喪矣。」語時了不悲。便索輿來奔喪，都不哭。子敬素好琴，便徑入坐靈床上，取子敬琴彈，弦既不調，擲地云：「子敬，子敬，人琴俱亡！」因慟絕良久。"],"cite":"《世說新語．傷逝》（節選）","notes":"王子猷、子敬：王徽之、王獻之兄弟，子敬是弟弟　何以：為什麼　了：完全　索：要　輿：轎子　徑：直接　靈床：停放死者的床　調：音調和諧　慟絕：哭得昏過去　良久：很久","trans":"王子猷、王子敬兄弟都病得很重，子敬先過世了。子猷問身邊的人：「為什麼一點都沒聽到子敬的音訊？他一定已經死了。」說話時完全不顯得悲傷。他就叫人備轎去奔喪，一路都沒有哭。子敬向來喜歡彈琴，子猷便直接走進去坐在靈床上，拿子敬的琴來彈，弦怎麼調都不和諧，他把琴摔到地上說：「子敬啊子敬，你人和琴都不在了！」接著哭得昏了過去，很久才醒來。","qs":[{"q":"「王子猷、子敬俱病篤」是什麼意思？","opts":["兩人都有一點小毛病","兩人都很擔心對方","兩人都病得很重","只有子敬生了重病"],"ans":"C","steps":["「俱」＝都，像「面面俱到」的俱：兩個人都","「篤」形容程度很深，「病篤」就是病得很重","後面「子敬先亡」，可見不是小毛病，兩人都病重"],"tests":"古今異義：病","avoid":"古文的「病」比現在嚴重"},{"q":"「子猷問左右」的「左右」指什麼？","opts":["左邊和右邊","大約、差不多","左右兩隻手","身邊的僕人"],"ans":"D","steps":["「問」的對象一定是人","方向和手都不能被問","古代「左右」常指身邊服侍的人"],"tests":"古今異義：左右","avoid":"「問左右」就是問身邊的人"},{"q":"「子敬素好琴」的「素」是什麼意思？","opts":["向來","白色的","吃素","樸素"],"ans":"A","steps":["代回「白色的」：子敬白色喜歡琴？不通","代回「向來」：子敬向來喜歡琴 → 通","所以子猷才拿他的琴來彈"],"tests":"古今異義：素","avoid":"素放在動作前，常是向來"},{"q":"子猷一開始「了不悲」，後來卻「慟絕良久」，轉變的原因是？","opts":["別人告訴他子敬已經死了","彈子敬的琴卻彈不成調，想到人和琴都不在了","他覺得奔喪太累","他的病變得更重"],"ans":"B","steps":["找轉變前發生的事：「弦既不調，擲地云」","他說出「人琴俱亡」，接著「因慟絕良久」","「因」＝於是，前面彈琴這件事就是原因"],"tests":"找轉變的原因","avoid":"找「因」前面發生的事"}]},{"label":"第四篇","title":"周處除三害","text":["周處年少時，兇強俠氣，為鄉里所患。又義興水中有蛟，山中有白額虎，並皆暴犯百姓。義興人謂為「三橫」，而處尤劇。或說處殺虎斬蛟，實冀三橫唯餘其一。"],"cite":"《世說新語．自新》（節選）","notes":"周處：晉朝人　兇強：兇暴強橫　俠氣：好勇鬥狠　義興：地名　蛟：傳說中像龍的動物　白額虎：額頭有白毛的老虎　暴犯：侵害　三橫：三大禍害　尤劇：最嚴重　或：有人　實：其實　冀：希望","trans":"周處年輕的時候，兇暴強橫、好勇鬥狠，被家鄉的人當成禍害。另外，義興的河裡有蛟，山裡有額頭長白毛的老虎，都在侵害百姓，義興人把牠們和周處合稱「三橫」，而周處最嚴重。有人勸周處去殺老虎、斬蛟，其實是希望三橫只剩下一個。","qs":[{"q":"「為鄉里所患」的「患」是什麼意思？","opts":["生病","當成禍害、擔心","病人","患難的朋友"],"ans":"B","steps":["前面：周處「兇強俠氣」，很兇","兇的人會讓家鄉的人擔心、害怕","「為……所患」＝被……當成禍害"],"tests":"古今異義：患","avoid":"「為……所」是被動，先找誰被誰"},{"q":"「或說處殺虎斬蛟」的「說」是什麼意思？","opts":["高興","講故事","解釋","勸"],"ans":"D","steps":["代回「高興」：有人高興周處殺虎？不通","代回「勸」：有人勸周處去殺虎斬蛟 → 通","說（ㄕㄨㄟˋ）＝勸說"],"tests":"古今異義：說","avoid":"說＋人＋做事，常是勸人"},{"q":"「三橫」指的是哪三個？","opts":["蛟、白額虎和周處","三隻老虎","蛟、老虎和義興人","三條河裡的蛟"],"ans":"A","steps":["前面列出：水中有蛟、山中有白額虎","「而處尤劇」：周處是三橫裡最嚴重的","所以三橫＝蛟、虎、周處"],"tests":"找代稱指誰","avoid":"「尤」表示他也在同一群裡"},{"q":"勸周處的人「實冀三橫唯餘其一」，真正的想法是？","opts":["真心佩服周處的力氣","讓周處和蛟、虎去拚，三害最後只剩一個","希望周處成為英雄","想替周處報仇"],"ans":"B","steps":["實＝其實（注釋），後面才是真心話","冀＝希望，唯餘其一＝只剩其中一個","周處也是三橫之一，所以不是真心誇他"],"tests":"推論真正用意","avoid":"看到「實」，後面才是真心話"}]},{"label":"第五篇","title":"孔融被收","text":["孔融被收，中外惶怖。時融兒大者九歲，小者八歲。二兒故琢釘戲，了無遽容。融謂使者曰：「冀罪止於身，二兒可得全不？」兒徐進曰：「大人豈見覆巢之下，復有完卵乎？」尋亦收至。"],"cite":"《世說新語．言語》","notes":"孔融：東漢人，就是讓梨的孔融　中外：朝廷內外　惶怖：驚慌害怕　琢釘戲：一種小孩玩的遊戲　了：完全　遽：驚慌　使者：來抓人的官員　冀：希望　全：保全　不：同「否」　豈：難道　覆：翻倒","trans":"孔融被逮捕，朝廷內外都很驚慌。當時孔融的兒子，大的九歲，小的八歲，兩個孩子仍舊在玩琢釘遊戲，完全沒有驚慌的樣子。孔融對來抓人的官員說：「希望罪只到我一個人為止，兩個孩子能不能保全？」孩子慢慢走上前說：「父親難道見過翻倒的鳥巢下，還有完整的蛋嗎？」不久，抓孩子的人也來了。","qs":[{"q":"「孔融被收」的「收」是什麼意思？","opts":["收到禮物","收拾東西","逮捕","收入"],"ans":"C","steps":["後面「中外惶怖」：大家都很害怕","孔融還求官員保全兒子，可見他被定了罪","收在這裡＝逮捕"],"tests":"古今異義：收","avoid":"看後面大家的反應來判斷"},{"q":"「兒徐進曰」的「徐」是什麼意思？","opts":["姓徐的","很快地","慢慢地","偷偷地"],"ans":"C","steps":["前面說兩個孩子「了無遽容」：完全不慌","不慌張的人，走路是慢慢的","徐＝慢慢地"],"tests":"古今異義：徐","avoid":"用人物當時的心情來判斷"},{"q":"「大人豈見覆巢之下」的「大人」指誰？","opts":["孔融","來抓人的官員","所有成年人","皇帝"],"ans":"A","steps":["這句是「兒」說的，前面孔融剛說完話","兒子回應父親 →「大人」是稱呼父親","古代子女稱父母為大人，和現在不同"],"tests":"稱謂：大人＝父親","avoid":"先找說話的人和對象"},{"q":"「尋亦收至」的「尋」是什麼意思？","opts":["尋找","尋常","不久","追問"],"ans":"C","steps":["代回「尋找」：尋找也收到？不通","代回「不久」：不久抓孩子的人也到了 → 通","正好應驗了「覆巢之下」那句話"],"tests":"古今異義：尋","avoid":"句首的「尋」常是不久"}]}]},{"no":"第 2 組","title":"詠雪","skill":"對話題：找出是誰說的","steps":["❶ 圈出每個「曰」「云」「問」，往前找說話的人","❷ 「曰」前面沒有人名？看上一句是誰問，這句通常是被問的人答","❸ 稱謂換算：兄子＝哥哥的兒子；卿、子、汝、爾＝你；吾、臣、妾＝我","❹ 看引號：「」裡面才是人物說的話，外面是作者的敘述"],"demo":{"q":"「撒鹽空中差可擬」是誰說的？","a":["→ 找「曰」前面：「兄子胡兒曰」","→ 稱謂換算：兄子＝謝太傅哥哥的兒子，名叫胡兒","答：謝太傅的姪子胡兒"]},"parts":[{"label":"第一篇","title":"詠雪","text":["謝太傅寒雪日內集，與兒女講論文義。俄而雪驟，公欣然曰：「白雪紛紛何所似？」兄子胡兒曰：「撒鹽空中差可擬。」兄女曰：「未若柳絮因風起。」公大笑樂。即公大兄無奕女，左將軍王凝之妻也。"],"cite":"《世說新語．言語》","notes":"謝太傅：謝安　內集：家人聚會　講論文義：討論文章的意思　驟：急、大　欣然：高興的樣子　何所似：像什麼　差可擬：差不多可以相比　柳絮：柳樹帶白毛的種子，會隨風飄　因：順著　無奕：謝安的大哥謝奕","trans":"一個寒冷的下雪天，謝太傅把家人聚在一起，和子姪們討論文章。不久雪下得又急又大，謝太傅高興地問：「這紛紛飄落的白雪像什麼呢？」他哥哥的兒子胡兒說：「把鹽撒在空中，差不多可以相比。」他哥哥的女兒說：「不如比作柳絮順著風飛起來。」謝太傅高興得大笑。這個女孩就是謝太傅大哥謝無奕的女兒，左將軍王凝之的妻子。","qs":[{"q":"「公欣然曰」的「公」指誰？","opts":["胡兒","謝太傅","王凝之","無奕"],"ans":"B","steps":["往前找：文章開頭的主角是「謝太傅」","「公」是對長輩、有地位的人的尊稱","後面「公大兄無奕」也證明公＝謝太傅"],"tests":"稱謂：公指誰","avoid":"「公」往前找最有地位的人"},{"q":"「未若柳絮因風起」是誰說的？","opts":["謝太傅的女兒","胡兒","王凝之","謝太傅大哥的女兒"],"ans":"D","steps":["找「曰」前面：「兄女曰」","稱謂換算：兄女＝謝太傅哥哥的女兒","最後一句也說她是「公大兄無奕女」"],"tests":"稱謂換算","avoid":"「兄女」是哥哥的女兒，不是女兒"},{"q":"「俄而雪驟」的「俄而」是什麼意思？","opts":["突然停止","不久","很久以後","一會兒又停了"],"ans":"B","steps":["前面：家人聚在一起討論文章","接著雪下大了，謝太傅才出題","代回「不久雪下大了」→ 通"],"tests":"時間詞：俄而","avoid":"俄而＝不久，背起來"},{"q":"「白雪紛紛何所似？」是誰問、問誰？","opts":["胡兒問謝太傅","謝太傅問子姪們","兄女問胡兒","王凝之問謝太傅"],"ans":"B","steps":["找「曰」前面：「公欣然曰」→ 謝太傅問的","問的對象：前面「與兒女講論文義」","古代「兒女」指子姪輩，所以是問子姪們"],"tests":"找說話者和對象","avoid":"問句要找誰問、問誰"}]},{"label":"第二篇","title":"雪夜訪戴","text":["王子猷居山陰，夜大雪，眠覺，開室，命酌酒。四望皎然，因起彷徨，詠左思〈招隱〉詩。忽憶戴安道，時戴在剡，即便夜乘小船就之。經宿方至，造門不前而返。人問其故，王曰：「吾本乘興而行，興盡而返，何必見戴？」"],"cite":"《世說新語．任誕》","notes":"王子猷：王徽之　山陰：地名　覺：醒來　酌：倒酒　皎然：潔白明亮　彷徨：走來走去　左思〈招隱〉詩：晉朝左思寫的詩　戴安道：戴逵，王子猷的朋友　剡：地名　就：到……那裡　經宿：過了一夜　造：到　興：興致","trans":"王子猷住在山陰，一天夜裡下大雪，他睡醒了，打開房門，叫人倒酒，四處望去一片潔白明亮。於是起身走來走去，吟誦左思的〈招隱〉詩。忽然想起戴安道，當時戴安道在剡縣，他就連夜坐小船去找他。過了一夜才到，到了門口卻不進去，轉身就回來了。有人問他原因，王子猷說：「我本來是趁著興致去的，興致沒了就回來，何必一定要見到戴安道呢？」","qs":[{"q":"「吾本乘興而行」的「吾」指誰？","opts":["王子猷","戴安道","問問題的人","左思"],"ans":"A","steps":["找「曰」前面：「王曰」→ 王子猷說的","「吾」＝我，指說話的人自己","所以吾＝王子猷"],"tests":"稱謂：吾＝我","avoid":"「吾」就是「曰」前面那個人"},{"q":"「人問其故」，是問哪件事的原因？","opts":["王子猷半夜叫人倒酒","戴安道住在剡縣","王子猷吟誦詩","王子猷到了門口卻不進去就回來"],"ans":"D","steps":["往前一句：「造門不前而返」","別人問的就是這件奇怪的事","王子猷答「興盡而返」，也是在說為什麼回來"],"tests":"代詞「其」指什麼","avoid":"「其故」往前一句找"},{"q":"「即便夜乘小船就之」的「之」指誰？","opts":["王子猷","左思","山陰的人","戴安道"],"ans":"D","steps":["前一句「忽憶戴安道，時戴在剡」","就＝到……那裡，連夜坐船去找剛想起的人","之＝戴安道"],"tests":"代詞「之」指誰","avoid":"「之」往前找剛提到的人"},{"q":"下列哪一句「不是」王子猷說的話，而是作者的敘述？","opts":["吾本乘興而行","時戴在剡","興盡而返","何必見戴"],"ans":"B","steps":["看引號：「」裡才是王子猷說的話","「吾本乘興而行……何必見戴」都在引號裡","「時戴在剡」在引號外，是作者交代背景"],"tests":"分說話和敘述","avoid":"引號外面是作者在說"}]},{"label":"第三篇","title":"石崇王愷爭豪","text":["石崇與王愷爭豪，並窮綺麗以飾輿服。武帝，愷之甥也，每助愷。嘗以一珊瑚樹高二尺許賜愷，枝柯扶疏，世罕其比。愷以示崇；崇視訖，以鐵如意擊之，應手而碎。愷既惋惜，又以為疾己之寶，聲色甚厲。崇曰：「不足恨，今還卿。」"],"cite":"《世說新語．汰侈》（節選）","notes":"爭豪：比誰更有錢、更奢華　窮：用盡　綺麗：華美的東西　輿服：車子和衣服　許：左右　枝柯扶疏：枝條繁茂　罕：少　訖：完畢　如意：一種器物　應手：隨手　惋惜：心疼　疾：嫉妒　厲：嚴厲　恨：遺憾","trans":"石崇和王愷比賽誰更奢華，都用盡華美的東西裝飾車子和衣服。晉武帝是王愷的外甥，常常幫助王愷。他曾把一棵高二尺左右的珊瑚樹賞給王愷，枝條繁茂，世上很少有能比得上的。王愷拿給石崇看；石崇看完，用鐵如意敲它，珊瑚樹隨手就碎了。王愷既心疼，又認為石崇是嫉妒自己的寶物，說話的聲音和臉色都很嚴厲。石崇說：「不值得遺憾，我現在就還給你。」","qs":[{"q":"「不足恨，今還卿」是誰對誰說的？","opts":["王愷對石崇","武帝對王愷","石崇對武帝","石崇對王愷"],"ans":"D","steps":["找「曰」前面：「崇曰」→ 石崇說的","前一句王愷「聲色甚厲」，正在生石崇的氣","石崇回應王愷，卿＝你＝王愷"],"tests":"找說話者和對象","avoid":"「卿」是你，找他正在回應誰"},{"q":"「武帝，愷之甥也」，王愷和武帝是什麼關係？","opts":["王愷是武帝的外甥","王愷是武帝的舅舅","兩人是兄弟","王愷是武帝的父親"],"ans":"B","steps":["「甲，乙之甥也」＝甲是乙的外甥","所以武帝是王愷的外甥","反過來，王愷就是武帝的舅舅"],"tests":"稱謂換算","avoid":"親戚關係要換個方向想一次"},{"q":"「又以為疾己之寶」的「己」指誰？","opts":["王愷","石崇","武帝","珊瑚樹"],"ans":"A","steps":["這句的主詞是前面的「愷」","王愷認為石崇嫉妒「自己的」寶物","己＝王愷自己"],"tests":"代詞「己」指誰","avoid":"「己」就是這句的主詞自己"},{"q":"從石崇說「不足恨，今還卿」的口氣，可以推知什麼？","opts":["他很後悔打碎珊瑚樹","他想向武帝道歉","他自信拿得出同樣好、甚至更好的珊瑚樹","他不知道珊瑚樹很珍貴"],"ans":"C","steps":["「不足恨」：不值得遺憾，口氣很輕鬆","「今還卿」：馬上就能還你","打碎寶物還這麼輕鬆，表示他有更多、更好的"],"tests":"從對話推論","avoid":"口氣也是證據"}]},{"label":"第四篇","title":"木猶如此","text":["桓公北征經金城，見前為琅邪時種柳，皆已十圍，慨然曰：「木猶如此，人何以堪！」攀枝執條，泫然流淚。"],"cite":"《世說新語．言語》","notes":"桓公：桓溫，東晉大將　征：出兵打仗　金城：地名　為琅邪：擔任琅邪的地方官　圍：兩手合抱的粗細　慨然：感慨的樣子　猶：尚且　堪：承受　條：細枝　泫然：流淚的樣子","trans":"桓溫向北出兵，經過金城，看見從前擔任琅邪地方官時種的柳樹，都已經有十圍那麼粗了，感慨地說：「樹木尚且變化這麼大，人又怎麼承受得了歲月的流逝！」他攀著樹枝、握著柳條，流下了眼淚。","qs":[{"q":"「木猶如此，人何以堪」是誰說的？","opts":["種柳的農夫","琅邪的百姓","桓公","作者"],"ans":"C","steps":["「慨然曰」前面沒有寫人名","往前找這一句的主角：「桓公北征經金城，見……」","主詞一路都是桓公 → 是桓公說的"],"tests":"補出說話的人","avoid":"「曰」前沒人名，往前找主詞"},{"q":"「見前為琅邪時種柳」，柳樹是誰種的？","opts":["桓公自己","金城的人","琅邪的百姓","桓公的部下"],"ans":"A","steps":["「前為琅邪時」：從前當琅邪地方官的時候","這句的主詞還是桓公","所以是桓公自己以前種的"],"tests":"補主詞","avoid":"句子沒換人，主詞就沒換"},{"q":"「木猶如此」的「如此」指什麼？","opts":["柳樹被砍掉了","柳樹已經枯死","柳樹已經長到十圍粗","柳樹排得很整齊"],"ans":"C","steps":["往前找：「皆已十圍」","柳樹長得這麼粗，表示過了很多年","如此＝長到十圍粗這件事"],"tests":"代詞「如此」指什麼","avoid":"「如此」往前一句找"},{"q":"桓公「泫然流淚」，最主要是因為？","opts":["打仗打輸了","捨不得砍掉柳樹","柳樹長得不好","感嘆時光流逝，人也跟著老了"],"ans":"D","steps":["他說的話是「人何以堪」：人怎麼承受得了","樹都長這麼粗了，代表過了很久","人也跟著變老 → 感嘆時光"],"tests":"從對話找心情","avoid":"人物說的話就是流淚的理由"}]},{"label":"第五篇","title":"長安何如日遠","text":["晉明帝數歲，坐元帝膝上。有人從長安來，元帝問洛下消息，潸然流涕。明帝問何以致泣，具以東渡意告之。因問明帝：「汝意謂長安何如日遠？」答曰：「日遠。不聞人從日邊來，居然可知。」元帝異之。","明日集群臣宴會，告以此意，更重問之。乃答曰：「日近。」元帝失色曰：「爾何故異昨日之言邪？」答曰：「舉目見日，不見長安。」"],"cite":"《世說新語．夙惠》","notes":"晉明帝：東晉的皇帝，元帝的兒子　元帝：晉元帝　洛下：洛陽，晉朝的舊都　潸然：流淚的樣子　具：完整地　東渡：晉朝被迫往東南遷移的事　何如：比起來怎麼樣　居然：顯然　失色：臉色大變","trans":"晉明帝才幾歲時，坐在父親元帝的膝上。有人從長安來，元帝問起洛陽的消息，難過得流下眼淚。明帝問父親為什麼哭，元帝就把被迫東遷的經過完整地告訴他。接著問明帝：「你認為長安和太陽比起來，哪一個遠？」明帝回答：「太陽遠。沒聽說有人從太陽那邊來，顯然可以知道。」元帝覺得他很不簡單。第二天召集群臣宴會，元帝把這件事告訴大家，又再問明帝一次。明帝卻回答：「太陽近。」元帝臉色大變說：「你為什麼和昨天說的不一樣呢？」明帝回答：「抬起頭就看得見太陽，卻看不見長安。」","qs":[{"q":"「明帝問何以致泣」，哭的人是誰？","opts":["元帝","明帝","從長安來的人","群臣"],"ans":"A","steps":["往前一句：「元帝問洛下消息，潸然流涕」","流淚的是元帝","明帝問的就是父親為什麼哭"],"tests":"補出動作的人","avoid":"「泣」往前找流淚的人"},{"q":"「汝意謂長安何如日遠？」是誰問誰？","opts":["明帝問元帝","群臣問明帝","元帝問明帝","元帝問群臣"],"ans":"C","steps":["「因問明帝」：問的對象是明帝","前面說明東渡經過的是元帝，接著問的還是元帝","汝＝你＝明帝"],"tests":"找說話者和對象","avoid":"「問＋人」，那個人就是聽的人"},{"q":"第二天「乃答曰：『日近。』」是誰回答的？","opts":["明帝","元帝","群臣中的一個人","從長安來的人"],"ans":"A","steps":["「答曰」前面沒有人名","上一句「更重問之」：元帝又問明帝一次","被問的人回答 → 明帝"],"tests":"補出說話的人","avoid":"「答曰」找上一句被問的人"},{"q":"明帝說「舉目見日，不見長安」，意思最接近？","opts":["長安天氣不好，看不到太陽","他不想再回長安","太陽抬頭看得見，長安卻看不見，好像比太陽還遠","太陽太亮，看不清楚長安"],"ans":"C","steps":["舉目＝抬頭","抬頭就看得到太陽 → 太陽近","長安看不見 → 比太陽還遠"],"tests":"看懂人物的話","avoid":"照字面一個詞一個詞翻"}]}]},{"no":"第 3 組","title":"塞翁失馬","skill":"因果連鎖：畫事件鏈","steps":["❶ 把事情照順序寫成一格一格：事件1 → 事件2 → 事件3","❷ 每一格標好事（＋）或壞事（－）：「弔」是壞事、「賀」是好事","❸ 找連接詞：以……之故、是以、於是、果，前面是原因，後面是結果","❹ 問「為什麼」→ 往前一格找；問「結果」→ 往後一格找"],"demo":{"q":"塞翁的兒子為什麼能在戰爭中保住性命？","a":["→ 畫事件鏈：好騎 → 墮而折其髀（－）→ 胡人大入塞 → 父子相保（＋）","→ 找連接詞：「此獨以跛之故」，以……之故＝因為","答：因為他摔斷腿、腳跛了"]},"parts":[{"label":"第一篇","title":"塞翁失馬","text":["近塞上之人有善術者，馬無故亡而入胡。人皆弔之，其父曰：「此何遽不為福乎？」居數月，其馬將胡駿馬而歸。人皆賀之，其父曰：「此何遽不能為禍乎？」","家富良馬，其子好騎，墮而折其髀。人皆弔之，其父曰：「此何遽不為福乎？」居一年，胡人大入塞，丁壯者引弦而戰，近塞之人，死者十九。此獨以跛之故，父子相保。"],"cite":"《淮南子．人間訓》","notes":"塞：邊界　善術：精通術數　胡：北方的外族　何遽：怎麼就　駿馬：好馬　富：多　墮：掉下來　髀：大腿骨　丁壯者：成年男子　引弦：拉弓　十九：十分之九　跛：腳瘸","trans":"靠近邊塞的地方，有一個精通術數的人，他家的馬無緣無故逃到胡人那裡去了。大家都來安慰他，他的父親說：「這怎麼就不會是福氣呢？」過了幾個月，那匹馬帶著胡人的好馬回來了。大家都來恭喜他，他的父親說：「這怎麼就不會是禍事呢？」家裡好馬多了，他的兒子喜歡騎馬，從馬上摔下來，摔斷了大腿骨。大家都來安慰他，他的父親說：「這怎麼就不會是福氣呢？」過了一年，胡人大舉攻進邊塞，成年男子都拿起弓箭作戰，邊塞附近的人，十個有九個戰死。只有這一家因為腳跛的緣故，父子都保全了性命。","qs":[{"q":"第一次「人皆弔之」，說明當時發生了什麼事？","opts":["壞事：馬逃到胡人那裡去了","好事：馬帶回胡人的好馬","有人過世，要辦喪事","大家來恭喜他"],"ans":"A","steps":["弔＝慰問，有壞事才需要慰問","往前一格：「馬無故亡而入胡」","馬跑掉了 → 壞事（－）"],"tests":"看「弔」判斷好壞","avoid":"弔是壞事，賀是好事"},{"q":"下列事件鏈，哪一個順序正確？","opts":["馬逃走 → 兒子摔斷腿 → 帶回胡馬 → 胡人入侵","帶回胡馬 → 馬逃走 → 胡人入侵 → 兒子摔斷腿","馬逃走 → 帶回胡馬 → 胡人入侵 → 兒子摔斷腿","馬逃走 → 帶回胡馬 → 兒子摔斷腿 → 胡人入侵"],"ans":"D","steps":["用時間詞切格：「居數月」「居一年」","馬亡 →「居數月」馬歸 →「家富良馬」兒子才騎馬摔傷","「居一年」胡人入塞，放在最後"],"tests":"排出事件鏈","avoid":"用「居……」把事件切成格子"},{"q":"「其馬將胡駿馬而歸」的「將」是什麼意思？","opts":["將要","將軍","拿來比較","帶領"],"ans":"D","steps":["代回「將要」：馬將要胡人好馬回來？不通","代回「帶領」：馬帶著胡人的好馬回來 → 通","這一格是好事（＋），所以後面才有「人皆賀之」"],"tests":"字義：將＝帶","avoid":"每個意思都代回去讀一次"},{"q":"兒子摔斷腿這件事，最後帶來什麼結果？","opts":["家裡的好馬都賣掉了","他不用上戰場，父子都保住性命","胡人不敢入侵","他從此學會騎馬"],"ans":"B","steps":["找連接詞：「此獨以跛之故，父子相保」","以……之故＝因為……的緣故","跛（－）連到父子相保（＋）：壞事變成好事"],"tests":"找最後的結果","avoid":"問結果，往鏈子後面找"}]},{"label":"第二篇","title":"曲突徙薪","text":["客有過主人者，見其竈直突，傍有積薪。客謂主人：「更為曲突，遠徙其薪；不者，且有火患。」主人嘿然不應。俄而家果失火，鄰里共救之，幸而得息。於是殺牛置酒，謝其鄰人，灼爛者在於上行，餘各以功次坐，而不錄言曲突者。"],"cite":"《漢書．霍光傳》（節選）","notes":"過：拜訪　竈：爐灶　突：煙囪　傍：旁邊　薪：柴　更：改　徙：搬　不者：不這樣的話　且：將要　嘿然：不說話的樣子　息：熄滅　謝：感謝　灼爛者：被燒傷的人　上行：上座　以功次坐：按功勞大小排座位　錄：邀請","trans":"有個客人拜訪主人，看見他家爐灶的煙囪是直的，旁邊還堆著柴。客人對主人說：「把煙囪改成彎的，把柴搬遠一點；不這樣的話，將會發生火災。」主人不說話，沒有理會。不久，家裡果然失火，鄰居們一起來救火，幸好把火撲滅了。於是主人殺牛擺酒，感謝鄰居，被燒傷的人坐上座，其他人按功勞大小排座位，卻沒有請那個建議把煙囪改彎的客人。","qs":[{"q":"客人說「且有火患」，他認為會失火的原因是？","opts":["煙囪是直的，旁邊又堆著柴","主人常常不小心玩火","鄰居家先失火","爐灶太小"],"ans":"A","steps":["往前找客人看到的事：「其竈直突，傍有積薪」","所以他建議「更為曲突，遠徙其薪」","原因：煙囪直、柴又堆在旁邊"],"tests":"往前找原因","avoid":"問原因，往前一格找"},{"q":"「俄而家果失火」的「果」說明了什麼？","opts":["主人早就準備好救火","失火是誰都想不到的意外","客人的提醒應驗了","鄰居故意放火"],"ans":"C","steps":["果＝果然，表示和之前說的一樣","往前找：客人說過「且有火患」","主人不聽 → 失火，事件鏈連起來了"],"tests":"連接詞「果」","avoid":"「果」要往前找誰說過"},{"q":"下列哪一個事件鏈最完整正確？","opts":["客人提醒 → 主人不理 → 失火 → 鄰居救火 → 宴請鄰居","客人提醒 → 主人改了煙囪 → 失火 → 鄰居救火","主人不理 → 鄰居救火 → 失火 → 宴請客人","失火 → 客人提醒 → 主人不理 → 宴請鄰居"],"ans":"A","steps":["照順序切格：謂主人 → 嘿然不應 → 果失火 → 共救之 → 殺牛置酒","「嘿然不應」表示根本沒改煙囪","最後宴請的是鄰人，不是客人"],"tests":"排出事件鏈","avoid":"每一格都要對到原文一句"},{"q":"「而不錄言曲突者」，作者想讓讀者想到什麼？","opts":["客人不喜歡吃牛肉","真正事先提醒、能防止災禍的人，反而被忘記了","被燒傷的人功勞最小","鄰居救火救得不夠快"],"ans":"B","steps":["「而」在這裡是轉折：宴請大家，卻沒請客人","如果早聽客人的話，根本不會失火","提醒的人功勞最大，卻被忘了"],"tests":"推論作者用意","avoid":"想想如果早聽話會怎樣"}]},{"label":"第三篇","title":"脣亡齒寒","text":["晉侯復假道於虞以伐虢。宮之奇諫曰：「虢，虞之表也。虢亡，虞必從之。晉不可啟，寇不可翫。一之謂甚，其可再乎？諺所謂『輔車相依，脣亡齒寒』者，其虞、虢之謂也。」"],"cite":"《左傳．僖公五年》（節選）","notes":"晉侯：晉國國君　復：又　假道：借路　虞、虢：兩個相鄰的小國　宮之奇：虞國的大臣　諫：勸告國君　表：外圍屏障　啟：打開，引申為助長野心　寇：入侵的軍隊　翫：輕忽　甚：過分　諺：俗話　輔：臉頰　車：牙床","trans":"晉國國君又向虞國借路去攻打虢國。宮之奇勸虞國國君說：「虢國是虞國的外圍屏障。虢國滅亡了，虞國一定跟著滅亡。晉國的野心不能助長，外來的軍隊不能輕忽。借路一次已經很過分了，難道還能借第二次嗎？俗話說『臉頰和牙床互相依靠，嘴唇沒了，牙齒就會受寒』，說的就是虞國和虢國的關係啊。」","qs":[{"q":"宮之奇認為「虞必從之」，原因是什麼？","opts":["虞國和晉國是好朋友","虞國比虢國強大","虢國是虞國的屏障，虢國亡了虞國就失去保護","虢國會出兵攻打虞國"],"ans":"C","steps":["往前一格找原因：「虢，虞之表也」","表＝外圍屏障（注釋）","屏障沒了 → 虞國跟著滅亡"],"tests":"往前找原因","avoid":"原因常在結果的前一句"},{"q":"「虢亡，虞必從之」的「從之」是什麼意思？","opts":["跟從虢國的國君","聽從晉國的命令","跟著滅亡","跟著去打仗"],"ans":"C","steps":["前面講「虢亡」","「從之」＝跟著它","跟著虢國一樣 → 跟著滅亡"],"tests":"看懂結果句","avoid":"「從之」要對前面的動作"},{"q":"「脣亡齒寒」中，「脣」和「齒」分別比喻誰？","opts":["脣比喻虞國，齒比喻虢國","脣比喻晉國，齒比喻虞國","脣比喻宮之奇，齒比喻國君","脣比喻虢國，齒比喻虞國"],"ans":"D","steps":["鏈子：脣先亡 → 齒受寒","文中：虢先亡 → 虞跟著遭殃","所以脣＝虢，齒＝虞"],"tests":"比喻的因果對應","avoid":"先倒的對先倒的，後倒的對後倒的"},{"q":"「晉侯復假道於虞」的「復」透露了什麼？","opts":["晉國要把路還給虞國","晉國之前已經向虞國借過一次路","晉國是第一次來借路","虞國已經拒絕過晉國"],"ans":"B","steps":["復＝又（注釋）","宮之奇也說「一之謂甚，其可再乎」","一次已經過分 → 表示之前借過一次"],"tests":"從字詞推前情","avoid":"「復」「再」表示之前發生過"}]},{"label":"第四篇","title":"螳螂捕蟬","text":["園中有樹，其上有蟬，蟬高居悲鳴飲露，不知螳螂在其後也；螳螂委身曲附欲取蟬，而不知黃雀在其傍也；黃雀延頸欲啄螳螂，而不知彈丸在其下也。此三者皆務欲得其前利，而不顧其後之有患也。"],"cite":"《說苑．正諫》（節選）","notes":"高居：停在高處　悲鳴：鳴叫　委身曲附：彎著身子貼近　傍：旁邊　延頸：伸長脖子　彈丸：彈弓射出的小丸子　務：一心一意　顧：顧慮","trans":"園子裡有一棵樹，樹上有一隻蟬，蟬停在高處鳴叫、喝露水，不知道螳螂就在牠後面；螳螂彎著身子貼近，想要抓蟬，卻不知道黃雀就在牠旁邊；黃雀伸長脖子想啄螳螂，卻不知道彈弓的彈丸就在牠下面。這三者都一心想得到眼前的好處，卻沒有顧慮到後面的禍患。","qs":[{"q":"下列哪一個「誰想抓誰」的鏈子是正確的？","opts":["螳螂想抓蟬，黃雀想啄螳螂，彈丸在黃雀下面","蟬想吃螳螂，螳螂想吃黃雀，彈丸在蟬下面","黃雀想啄蟬，螳螂想抓黃雀，彈丸在螳螂下面","螳螂想抓黃雀，黃雀想啄蟬，彈丸在蟬下面"],"ans":"A","steps":["一格一格找：「螳螂……欲取蟬」","「黃雀延頸欲啄螳螂」","「彈丸在其下」：這句的主詞是黃雀"],"tests":"排出事件鏈","avoid":"每一格都找「欲」後面的對象"},{"q":"「而不知黃雀在其傍也」的「其」指誰？","opts":["蟬","黃雀","樹","螳螂"],"ans":"D","steps":["這一句的主詞是前面的「螳螂」","螳螂想抓蟬，卻不知道黃雀在「牠」旁邊","其＝螳螂"],"tests":"代詞「其」指誰","avoid":"「其」往前找這句的主角"},{"q":"三者都遇到危險，共同的原因是什麼？","opts":["只想得到眼前的好處，沒注意背後的危險","牠們都太弱小","園子裡沒有地方可以躲","牠們都不會飛"],"ans":"A","steps":["找作者的總結：「此三者皆務欲得其前利」","「而不顧其後之有患也」","原因：只看前面的利，不顧後面的患"],"tests":"找共同原因","avoid":"總結句常在最後"},{"q":"這則故事最適合用來提醒哪一種人？","opts":["做事太慢的人","不愛運動的人","只顧眼前利益、不管後果的人","太愛幫助別人的人"],"ans":"C","steps":["結論在最後一句：「務欲得其前利，而不顧其後之有患」","對應到人：只想眼前好處的人","成語「螳螂捕蟬，黃雀在後」就是這個意思"],"tests":"寓言的道理","avoid":"道理從最後的總結句找"}]},{"label":"第五篇","title":"魯侯養鳥","text":["昔者海鳥止於魯郊，魯侯御而觴之於廟，奏九韶以為樂，具太牢以為善。鳥乃眩視憂悲，不敢食一臠，不敢飲一杯，三日而死。此以己養養鳥也，非以鳥養養鳥也。"],"cite":"《莊子．至樂》（節選）","notes":"止：停留　魯郊：魯國都城的郊外　魯侯：魯國的國君　御：迎接　觴：請喝酒　廟：宗廟，祭祀祖先的地方　九韶：古代最隆重的音樂　太牢：牛、羊、豬三種牲畜，最隆重的宴席　善：同「膳」，飯菜　眩視：眼花，看不清楚　臠：切成小塊的肉","trans":"從前有一隻海鳥停在魯國都城的郊外，魯國國君把牠迎進宗廟，請牠喝酒，演奏最隆重的〈九韶〉音樂給牠聽，準備牛、羊、豬當作牠的飯菜。海鳥卻嚇得眼花、憂愁悲傷，一小塊肉也不敢吃，一杯酒也不敢喝，三天就死了。這是用養自己的方法來養鳥，不是用養鳥的方法來養鳥啊。","qs":[{"q":"海鳥「三日而死」，最直接的原因是什麼？","opts":["魯侯把牠關起來，不給牠吃東西","牠嚇得憂愁悲傷，不敢吃也不敢喝","牠年紀太大，本來就快死了","魯國的天氣太冷"],"ans":"B","steps":["往前一格找原因：「鳥乃眩視憂悲，不敢食一臠，不敢飲一杯」","三天不吃不喝 → 「三日而死」","魯侯準備了「太牢」，不是不給吃；年紀、天氣文中都沒說"],"tests":"往前找直接原因","avoid":"問「為什麼」，先看結果前一句"},{"q":"下列哪一個事件鏈，順序正確？","opts":["魯侯奏樂備宴 → 海鳥停在魯郊 → 海鳥不吃不喝 → 三天後死了","海鳥停在魯郊 → 海鳥不吃不喝 → 魯侯奏樂備宴 → 三天後死了","海鳥不吃不喝 → 海鳥停在魯郊 → 魯侯奏樂備宴 → 三天後死了","海鳥停在魯郊 → 魯侯奏樂備宴 → 海鳥不吃不喝 → 三天後死了"],"ans":"D","steps":["照原文切格：「止於魯郊」→「御而觴之於廟，奏九韶……具太牢」","「鳥乃眩視憂悲，不敢食……」→「三日而死」","「乃」＝於是，表示鳥害怕是在魯侯招待之後"],"tests":"排出事件鏈","avoid":"每一格都要對到原文一句"},{"q":"依照文章最後的說法，海鳥死掉的根本原因是什麼？","opts":["海鳥本來就不喜歡魯國","魯侯故意要害死海鳥","魯侯用對待人的方式對待鳥，沒有照鳥的需要","宗廟裡的人太多太吵"],"ans":"C","steps":["找作者的總結：「此以己養養鳥也，非以鳥養養鳥也」","以己養＝用養自己的方法；以鳥養＝用養鳥的方法","喝酒、聽音樂、吃大餐是人喜歡的，不是鳥需要的；魯侯是好意，不是故意害鳥"],"tests":"找根本原因","avoid":"直接原因看前一格，根本原因看總結"},{"q":"這個故事最適合提醒我們什麼？","opts":["請客一定要準備很多菜","對別人好，要用對方需要的方式，不是只用自己喜歡的方式","海鳥不能養，看到要趕快放走","國君做的事都是對的"],"ans":"B","steps":["表面：魯侯很用心招待，海鳥卻死了","總結句說他是「以己養養鳥」","道理：好意也要用對方法；「一定」「都是」是絕對字"],"tests":"故事的道理","avoid":"道理從最後的總結句找"}]}]},{"no":"第 4 組","title":"《論語》三人行＋比賽影片","skill":"互文對讀二：找對應句、畫線連起來","steps":["❶ 把甲文拆成幾個小句，每句旁邊寫白話","❷ 在乙文裡找意思一樣的句子，用線連起來","❸ 連不起來的句子，就是「只有甲」或「只有乙」","❹ 題目問「對應」→ 看連線；問「不同」→ 看沒連到的"],"demo":{"q":"甲文「擇其善者而從之」，對應乙文哪一句？","a":["→ 甲：選別人好的地方跟著學","→ 乙：「看到隊友漂亮的傳球，我就記下來，下次照著做」","答：兩句都在說看到好的就學 → 畫線連起來"]},"parts":[{"label":"第一篇","title":"三人行，必有我師焉","text":["甲　子曰：「三人行，必有我師焉：擇其善者而從之，其不善者而改之。」","乙　每次比賽結束，教練都會放影片給我們看。看到隊友漂亮的傳球，我就記下來，下次照著做；看到自己或別人失誤，就提醒自己別再犯同樣的錯。教練說，球場上的每一個人，都是你的老師。"],"cite":"甲：《論語．述而》　乙：練習用自編短文","notes":"行：走路，這裡指一起相處　焉：在其中　善：優點","trans":"甲：孔子說：「幾個人一起走，其中一定有可以當我老師的人：選擇他們的優點跟著學習，看到他們的缺點，就反省改正自己。」","qs":[{"q":"甲文「其不善者而改之」，在乙文中對應哪一句？","opts":["看到自己或別人失誤，就提醒自己別再犯同樣的錯","看到隊友漂亮的傳球，我就記下來","教練都會放影片給我們看","下次照著做"],"ans":"A","steps":["甲：看到不好的地方，就改正自己","到乙文找「不好」的事：「失誤」","連線：不善 → 失誤；改之 → 別再犯"],"tests":"找對應句","avoid":"先找意思相同的關鍵詞"},{"q":"甲文「三人行，必有我師焉」，和乙文哪一句意思最接近？","opts":["每次比賽結束，教練都會放影片","看到隊友漂亮的傳球","球場上的每一個人，都是你的老師","下次照著做"],"ans":"C","steps":["甲：一群人裡一定有我的老師","乙文出現「老師」的句子：教練說的最後一句","兩句都說身邊的人都能當老師 → 連線"],"tests":"找對應句","avoid":"抓關鍵字「師」去乙文找"},{"q":"「擇其善者而從之」的「從」是什麼意思？","opts":["從來","服從命令","從前","跟隨學習"],"ans":"D","steps":["擇＝選擇，選了好的地方然後……","乙文對應句：「下次照著做」","照著做＝跟著學，所以從＝跟隨學習"],"tests":"用對應句解字","avoid":"看不懂的字，去乙文找對應句"},{"q":"下列哪一個說法，甲、乙兩篇都有？","opts":["一定要看影片才能進步","只有教練才能當老師","只要學別人的優點，失誤不用管","別人的缺點也能拿來提醒自己"],"ans":"D","steps":["甲：「其不善者而改之」","乙：看到失誤就提醒自己","兩邊連得上線 → 兩篇都有"],"tests":"找兩篇相同點","avoid":"兩篇都有＝兩邊都連得到線"}]},{"label":"第二篇","title":"歲寒知松柏","text":["甲　子曰：「歲寒，然後知松柏之後彫也。」","乙　上學期聯賽，我們隊第三節落後二十分，看台上的同學一個一個離開，有幾個隊員也垂頭喪氣。只有阿凱一直喊：「還沒結束！」跑回防守、搶籃板，一球都不放棄。那場我們還是輸了，可是從那天起，大家都知道，最難的時候，靠得住的人是誰。"],"cite":"甲：《論語．子罕》　乙：練習用自編短文","notes":"歲寒：一年中最冷的時候　松柏：兩種冬天也不落葉的樹　彫：同「凋」，葉子掉落","trans":"甲：孔子說：「到了一年中最冷的時候，才知道松樹和柏樹是最後凋零的。」","qs":[{"q":"甲文「歲寒」，在乙文中對應的是？","opts":["上學期聯賽開始前","阿凱跑回防守","第三節落後二十分","大家都知道靠得住的人是誰"],"ans":"C","steps":["甲：歲寒＝最冷、最難熬的時候","乙文最困難的時刻：「第三節落後二十分」","兩句都是「最難的時候」→ 連線"],"tests":"找對應句","avoid":"先想甲文那個詞代表什麼情況"},{"q":"乙文中的阿凱，對應甲文的哪一個詞？","opts":["歲寒","松柏","然後","彫"],"ans":"B","steps":["甲：天冷時別的樹都落葉，只有松柏撐住","乙：別人離開、垂頭喪氣，只有阿凱不放棄","連線：阿凱 → 不凋的松柏"],"tests":"比喻的對應","avoid":"找兩篇裡「只有它撐住」的那個"},{"q":"「然後知松柏之後彫也」的「然後」最接近什麼意思？","opts":["然而","突然","這樣以後才","於是忘記"],"ans":"C","steps":["然＝這樣，後＝以後","代回：天冷了，這樣以後才知道松柏最後凋零 → 通","乙文也一樣：「從那天起，大家都知道」"],"tests":"字義：然後","avoid":"把詞拆開來一個字一個字讀"},{"q":"下列哪一項是乙文有、甲文沒有的？","opts":["困難的時候，才看得出誰靠得住","比賽最後還是輸了","別人放棄時，有人還撐著","最難熬的時刻"],"ans":"B","steps":["甲只講：天冷才看出松柏不凋","「輸了」只在乙文出現，甲文連不到線","其他三項甲文都能連上"],"tests":"找兩篇不同點","avoid":"沒有連線的那一句就是不同"}]},{"label":"第三篇","title":"德不孤，必有鄰","text":["甲　子曰：「德不孤，必有鄰。」","乙　小翔剛轉學來時，沒有人認識他。可是每次練完球，他都留下來，把散在場上的球一顆一顆撿回球籃，還會幫學弟綁鞋帶。過了一個月，大家開始搶著跟他同一組，連最害羞的學弟，都會主動找他說話。"],"cite":"甲：《論語．里仁》　乙：練習用自編短文","notes":"德：品德好的人","trans":"甲：孔子說：「品德好的人不會孤單，一定會有志同道合的人來親近他。」","qs":[{"q":"甲文的「德」，在乙文中對應的是？","opts":["把球撿回球籃、幫學弟綁鞋帶","剛轉學來","大家搶著跟他同一組","最害羞的學弟"],"ans":"A","steps":["甲：德＝好的品德","乙文裡小翔做的好事：撿球、幫學弟綁鞋帶","連線：好品德 → 這些行為"],"tests":"找對應句","avoid":"抽象的詞，對到具體的行為"},{"q":"甲文「必有鄰」，對應乙文哪一句？","opts":["沒有人認識他","他都留下來撿球","大家開始搶著跟他同一組","過了一個月"],"ans":"C","steps":["甲：一定有人來親近他","乙：大家搶著跟他同組、學弟主動找他說話","連線：必有鄰 → 大家親近他"],"tests":"找對應句","avoid":"先寫白話，再找意思一樣的"},{"q":"乙文「剛轉學來時，沒有人認識他」，最接近甲文的哪一個字？","opts":["德","孤","鄰","必"],"ans":"B","steps":["沒人認識他 → 很孤單","甲文的「孤」就是孤單","甲說「德不孤」，乙的結局也是不再孤單"],"tests":"找對應字","avoid":"把乙的句子濃縮成一個字"},{"q":"兩篇共同想表達的是？","opts":["有好品德的人，終究會有人願意親近","轉學生一定交不到朋友","撿球是最重要的品德","只要一個月就一定能交到朋友"],"ans":"A","steps":["甲：德不孤，必有鄰","乙：小翔做好事 → 大家親近他","「一定」是絕對字；把例子當成道理也不對"],"tests":"找兩篇相同點","avoid":"道理要兩篇都連得上"}]},{"label":"第四篇","title":"過而不改，是謂過矣","text":["甲　子曰：「過而不改，是謂過矣。」","乙　阿哲運球時，總習慣低頭看球，常常被對手抄走。教練提醒他好幾次，他都說：「下次再注意。」結果整個學期，同樣的失誤一直出現。後來他把比賽影片看了一遍，每天練抬頭運球二十分鐘，兩個月後，被抄球的次數少了很多。"],"cite":"甲：《論語．衛靈公》　乙：練習用自編短文","notes":"是：這　謂：叫做","trans":"甲：孔子說：「犯了錯卻不改正，這才叫做真正的錯誤。」","qs":[{"q":"「過而不改，是謂過矣」的兩個「過」，是什麼意思？","opts":["都是「經過」","前一個是「經過」，後一個是「錯誤」","前一個是「超過」，後一個是「錯誤」","都是「錯誤」"],"ans":"D","steps":["代回「經過」：經過了卻不改？不通","代回「錯誤」：犯了錯不改，這才叫做錯 → 通","後一個「過」也是錯誤，是更嚴重的錯"],"tests":"字義：過","avoid":"兩個字都代回去讀讀看"},{"q":"乙文哪一段最符合甲文的「過而不改」？","opts":["他每天練抬頭運球二十分鐘","兩個月後被抄球的次數少了很多","他把比賽影片看了一遍","教練提醒好幾次，同樣的失誤卻一直出現"],"ans":"D","steps":["甲：犯錯卻不改","乙：嘴上說下次再注意，失誤卻一直出現","連線：過而不改 → 整個學期同樣的失誤"],"tests":"找對應句","avoid":"先找「犯錯」，再看有沒有「改」"},{"q":"阿哲後來每天練抬頭運球，和甲文的關係是？","opts":["完全符合甲文說的「過而不改」","他做到了「改」，就不再是孔子說的「過矣」","和甲文沒有關係","證明甲文說錯了"],"ans":"B","steps":["甲文的關鍵字是「改」","乙文後半：看影片、每天練 → 這就是「改」","有改，就不是「是謂過矣」"],"tests":"對讀後半段","avoid":"看關鍵字有沒有被做到"},{"q":"下列哪一項是乙文有、甲文沒有的？","opts":["犯錯不改才是真錯","有人一再犯同樣的錯","改正錯誤的具體方法","錯誤需要改正"],"ans":"C","steps":["甲只有一句道理，沒說怎麼改","乙寫了看影片、每天練二十分鐘","具體方法只在乙文 → 甲文連不到線"],"tests":"找兩篇不同點","avoid":"甲講道理，乙常常多了做法"}]},{"label":"第五篇","title":"知者樂水，仁者樂山","text":["甲　子曰：「知者樂水，仁者樂山；知者動，仁者靜；知者樂，仁者壽。」","乙　我有兩個好朋友。小宇腦筋轉得快，最喜歡到河邊看水流，一下子想到新戰術，一下子又想去玩別的，整天開開心心。阿傑做事很穩，喜歡跟爸爸去爬山，坐在山頂上可以安安靜靜看一整個下午，他說這樣心裡很踏實。"],"cite":"甲：《論語．雍也》　乙：練習用自編短文","notes":"知：同「智」，聰明　仁：有仁德　壽：長壽","trans":"甲：孔子說：「聰明的人喜愛水，仁德的人喜愛山；聰明的人好動，仁德的人好靜；聰明的人快樂，仁德的人長壽。」","qs":[{"q":"乙文的小宇，對應甲文的哪一種人？","opts":["知者","仁者","壽者","靜者"],"ans":"A","steps":["乙：小宇腦筋快、愛看水流、好動","甲：「知者樂水」「知者動」","連線：小宇 → 知者"],"tests":"人物的對應","avoid":"把人物特點一個一個連線"},{"q":"「知者樂水」的「樂」是什麼意思？","opts":["快樂","喜愛","音樂","娛樂"],"ans":"B","steps":["「樂」後面接著「水」：樂＋東西","對應乙文：小宇「最喜歡到河邊看水流」","所以樂（ㄧㄠˋ）＝喜愛；「知者樂」的樂才是快樂"],"tests":"一字多音：樂","avoid":"樂後面接東西，就是喜愛"},{"q":"乙文「坐在山頂上可以安安靜靜看一整個下午」，對應甲文哪一句？","opts":["知者動","知者樂","知者樂水","仁者靜"],"ans":"D","steps":["乙：阿傑安安靜靜","甲：「仁者靜」","連線：安靜 → 仁者靜"],"tests":"找對應句","avoid":"抓同一個字「靜」去連"},{"q":"甲文中，哪一句在乙文裡連不到線？","opts":["仁者壽","知者樂水","仁者樂山","知者動"],"ans":"A","steps":["一句一句連：樂水 → 小宇看水流；樂山 → 阿傑爬山；動 → 小宇好動","「知者樂」→ 整天開開心心","「仁者壽」：乙文沒寫到阿傑長壽 → 連不到線"],"tests":"找兩篇不同點","avoid":"全部連完，剩下的就是答案"}]}]},{"no":"第 5 組","title":"四週投籃紀錄","skill":"圖文對讀：圖表＋文字一起看","steps":["❶ 先看標題和單位：在記錄什麼？單位是什麼？","❷ 找出最高、最低、變化最大的地方","❸ 讀文字：找時間點或原因（從第幾週開始、因為什麼）","❹ 把文字對到圖表：文字說的事，在圖上哪裡看得到？","❺ 推論只能說「可能」，不能說「一定」"],"demo":{"q":"教練的話，對應圖表的哪一段？","a":["→ 文字：「從第三週開始」每天寫下沒進的原因","→ 圖表：第2週10球 → 第3週13球，多3球，是四週裡增加最多的一次","答：對應第2週到第3週的進步"]},"parts":[{"label":"第一篇","title":"某隊員四週投籃練習紀錄（每週測 20 球，練習用數據）","text":["教練的話：「從第三週開始，大家每天練完都花五分鐘，寫下自己哪幾球沒進、為什麼。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["週次","投進球數（球）"],"per":1,"unit":"球","data":[["第1週",8],["第2週",10],["第3週",13],["第4週",15]],"qs":[{"q":"哪兩週之間，投進球數增加最多？","opts":["第1週到第2週","第3週到第4週","每週增加的一樣多","第2週到第3週"],"ans":"D","steps":["算每週相差：8→10 多2，10→13 多3，13→15 多2","第2週到第3週多3球，最多","每週不一樣，所以不是一樣多"],"tests":"找變化最大處","avoid":"相鄰兩格相減再比較"},{"q":"教練說的新做法從哪一週開始？對照圖表，那一週投進幾球？","opts":["第1週，8球","第2週，10球","第3週，13球","第4週，15球"],"ans":"C","steps":["文字：「從第三週開始」","圖表：第3週投進13球","文字的時間點要對到圖上同一格"],"tests":"文字對到圖表","avoid":"先找時間點，再去圖上找"},{"q":"第4週投進15球，那一週的命中率是多少？","opts":["60%","75%","80%","85%"],"ans":"B","steps":["標題說每週測20球","第4週投進15球","15 ÷ 20 ＝ 0.75 ＝ 75%"],"tests":"算比率","avoid":"命中率＝投進÷投的總數"},{"q":"根據圖表和教練的話，下列哪個推論最合理？","opts":["開始寫下沒進的原因後，進球數仍持續增加，這個做法可能有幫助","寫下原因一定能讓每個人都進步","第5週一定會投進17球","前兩週他完全沒有進步"],"ans":"A","steps":["文字：第3週開始寫原因","圖：第3、4週是13球、15球，仍在增加","只能說「可能」；「一定」「完全沒進步」都和證據不合"],"tests":"圖文推論","avoid":"推論只能說「可能」"}]},{"label":"第二篇","title":"六年甲班一週借書本數","text":["圖書股長說：「星期三開始，我把新到的漫畫版歷史書，放在教室門口的書架上。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","借書本數（本）"],"per":1,"unit":"本","data":[["星期一",4],["星期二",5],["星期三",11],["星期四",12],["星期五",10]],"qs":[{"q":"這一週借書最多的是星期幾？","opts":["星期一","星期三","星期四","星期五"],"ans":"C","steps":["看圖找最高的一格","星期四12本最多","星期三11本是第二多"],"tests":"找最高點","avoid":"最高和第二高要分清楚"},{"q":"這一週裡，哪一天比前一天增加最多？","opts":["星期二","星期三","星期四","星期五"],"ans":"B","steps":["算相差：週一到週二多1本，週二到週三多6本，週三到週四多1本","週四到週五還少了2本","週三增加最多，正好是文字說放新書的那天"],"tests":"找變化最大處","avoid":"先算差，再對文字的時間點"},{"q":"星期三到星期五，三天一共借出幾本？","opts":["23本","30本","33本","35本"],"ans":"C","steps":["圖：週三11本、週四12本、週五10本","11＋12＋10＝33","題目只問三天，不要加到週一、週二"],"tests":"讀圖算總和","avoid":"先圈出題目要的那幾格"},{"q":"下列哪個說法，有圖表和文字的證據？","opts":["全班同學都喜歡漫畫版歷史書","星期五變少，是因為大家不喜歡新書了","放新書之後的三天，每天借書數都比週一、週二多","放新書之後，借書數每天都在增加"],"ans":"C","steps":["圖：週三起11、12、10本，都比週一4本、週二5本多","週五比週四少，所以「每天都在增加」不對","「全班都喜歡」和週五變少的原因，圖文都沒說"],"tests":"圖文推論","avoid":"圖文沒寫的原因不能自己補"}]},{"label":"第三篇","title":"校隊一次練球的時間分配","text":["教練說：「上一場比賽，我們投籃命中率最差，所以這次練習，投籃要練最久。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["項目","時間（分鐘）"],"per":1,"unit":"分鐘","data":[["熱身",15],["運球",20],["投籃",30],["戰術",25],["緩和",10]],"qs":[{"q":"這一次練球總共多久？","opts":["95分鐘","100分鐘","105分鐘","110分鐘"],"ans":"B","steps":["把五項加起來：15＋20＋30＋25＋10","＝100","單位是分鐘"],"tests":"讀圖算總和","avoid":"每一項都要加到，不要漏"},{"q":"教練的話，對應圖表中的哪一個地方？","opts":["投籃30分鐘，是所有項目中最久的","熱身15分鐘","戰術25分鐘，是最久的","緩和10分鐘，是最短的"],"ans":"A","steps":["文字：「投籃要練最久」","圖：投籃30分鐘，比戰術25分鐘還多","文字說的事，正好對到圖上最高的那一格"],"tests":"文字對到圖表","avoid":"先找文字的關鍵詞，再找圖"},{"q":"熱身和緩和加起來，和運球比起來怎麼樣？","opts":["少5分鐘","多5分鐘","多10分鐘","一樣多"],"ans":"B","steps":["熱身15＋緩和10＝25分鐘","運球20分鐘","25－20＝5，多5分鐘"],"tests":"讀圖比大小","avoid":"先加起來，再相減"},{"q":"根據文字和圖表，教練安排時間的依據是什麼？","opts":["上一場比賽哪一項表現最差","隊員最喜歡哪一項","哪一項最容易練","學校規定的時間"],"ans":"A","steps":["找文字裡的「所以」：前面是原因","原因：「上一場比賽，我們投籃命中率最差」","所以投籃排最久 → 依據是上一場最弱的項目"],"tests":"找文字裡的原因","avoid":"「所以」前面就是原因"}]},{"label":"第四篇","title":"柴犬「小豆」一週散步時間","text":["主人的筆記：「這週有兩天下雨，那兩天只在家門口的走廊走一走。週末不用上班，就帶牠去河濱公園。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","散步時間（分鐘）"],"per":1,"unit":"分鐘","data":[["星期一",40],["星期二",45],["星期三",15],["星期四",40],["星期五",20],["星期六",60],["星期日",60]],"qs":[{"q":"根據圖表和筆記，最可能下雨的是哪兩天？","opts":["星期六和星期日","星期一和星期四","星期二和星期三","星期三和星期五"],"ans":"D","steps":["文字：下雨的兩天只在走廊走一走 → 時間會很短","圖：最短的兩天是星期三15分鐘、星期五20分鐘","週六、週日最長，是去河濱公園"],"tests":"文字對到圖表","avoid":"文字的線索，去圖上找最高或最低"},{"q":"散步最久的是哪幾天？原因是什麼？","opts":["星期六和星期日，因為主人不用上班，帶牠去河濱公園","星期二，因為那天天氣最好","星期一和星期四，因為小豆比較有精神","星期六和星期日，因為天氣比較涼"],"ans":"A","steps":["圖：週六、週日都是60分鐘，最久","文字：「週末不用上班，就帶牠去河濱公園」","天氣好、天氣涼、有精神，筆記都沒寫"],"tests":"圖找事實，文找原因","avoid":"原因要在文字裡找得到"},{"q":"這一週散步最久的一天，是最短那天的幾倍？","opts":["2倍","3倍","4倍","5倍"],"ans":"C","steps":["最久：60分鐘（週六、週日）","最短：15分鐘（週三）","60 ÷ 15 ＝ 4"],"tests":"讀圖算倍數","avoid":"最大÷最小＝幾倍"},{"q":"下列哪一個說法，「不能」從圖表和筆記得知？","opts":["小豆星期二散步45分鐘","這週有兩天下雨","週末散步的時間比平日長","小豆最喜歡去河濱公園"],"ans":"D","steps":["45分鐘、兩天下雨、週末比較長：圖表或筆記都看得到","「最喜歡」是小豆的心情","圖表只有時間，筆記也沒寫牠喜歡什麼"],"tests":"分辨有沒有證據","avoid":"心情和喜好，圖表看不出來"}]},{"label":"第五篇","title":"六年甲班最喜歡的運動（全班 30 人，每人投一票）","text":["班會紀錄：「運動會的班際比賽，報名票數最多的兩個項目。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["運動項目","人數（人）"],"per":1,"unit":"人","data":[["籃球",12],["躲避球",8],["羽球",6],["跑步",3],["其他",1]],"qs":[{"q":"依照班會紀錄，班上要報名哪兩項？","opts":["籃球和躲避球","籃球和羽球","躲避球和羽球","籃球和跑步"],"ans":"A","steps":["文字：「報名票數最多的兩個項目」","圖：籃球12人最多，躲避球8人第二","所以報名籃球和躲避球"],"tests":"文字對到圖表","avoid":"看清楚文字要第幾名"},{"q":"喜歡籃球的人，占全班的幾分之幾？","opts":["五分之一","四分之一","三分之一","五分之二"],"ans":"D","steps":["標題：全班30人","圖：籃球12人","12 ÷ 30 ＝ 12/30 ＝ 五分之二"],"tests":"算比例","avoid":"全班人數在標題裡找"},{"q":"喜歡籃球的人數，是喜歡羽球的幾倍？","opts":["1.5倍","2倍","3倍","4倍"],"ans":"B","steps":["籃球12人，羽球6人","12 ÷ 6 ＝ 2","所以是2倍"],"tests":"讀圖算倍數","avoid":"誰是誰的幾倍，誰就放前面除"},{"q":"小美說：「跑步只有3人喜歡，所以全班都不喜歡跑步。」這句話錯在哪裡？","opts":["跑步其實有12人喜歡","圖表裡沒有跑步這一項","班會決定要報名跑步","還是有3人喜歡，不能說「全班都」"],"ans":"D","steps":["圖：跑步3人","有3人喜歡 → 不是「全班都不喜歡」","「全班都」是絕對字，和數據不合"],"tests":"找出錯誤推論","avoid":"看到「都」，用數據檢查一次"}]}]},{"no":"週末關卡","title":"葉公好龍","skill":"五步全用＋古今異義","steps":["❶ 先看題幹：問誰、問字，還是問道理","❷ 圈人物、補主詞；對話題找「曰」前面的人","❸ 古今異義：熟悉的字先換古代意思試（寫、走、去、子）","❹ 因果連鎖：把事件一格一格排好","❺ 寓言三問找道理，完成後錄一支 60 秒「古文翻譯官」短片"],"demo":{"q":"「葉公見之，棄而還走」的「走」是什麼意思？","a":["→ 古今異義：看到「走」，先換成「跑」","→ 代回：葉公看到真龍，丟下東西轉身就跑 → 通","答：跑（逃跑）"]},"parts":[{"label":"第一篇","title":"葉公好龍","text":["葉公子高好龍，鉤以寫龍，鑿以寫龍，屋室雕文以寫龍。於是天龍聞而下之，窺頭於牖，施尾於堂。葉公見之，棄而還走，失其魂魄，五色無主。是葉公非好龍也，好夫似龍而非龍者也。"],"cite":"《新序．雜事》","notes":"葉公子高：葉公，名叫子高　好：喜愛　鉤：衣帶上的鉤子　鑿：古代的一種器物　雕文：雕刻的花紋　窺：探頭看　施：拖、伸　堂：廳堂　還：轉身　五色無主：臉色變來變去，失去主張　夫：那些","trans":"葉公子高喜愛龍，衣帶鉤上畫著龍，器物上畫著龍，房屋裡雕刻的花紋也是龍。於是天上的真龍聽說了，就下凡到他家，從窗戶探頭進來，尾巴拖在廳堂上。葉公看見了，丟下東西轉身就逃，嚇得失魂落魄，臉色變來變去，不知如何是好。由此可見，葉公並不是真的喜愛龍，他喜愛的只是那些像龍卻不是龍的東西。","qs":[{"q":"「鉤以寫龍」的「寫」是什麼意思？","opts":["寫字","寫信","畫","抄寫"],"ans":"C","steps":["代回「寫字」：在衣帶鉤上寫龍字？怪怪的","後面「屋室雕文以寫龍」：雕刻花紋，是在畫圖案","寫＝畫，是古今異義"],"tests":"古今異義：寫","avoid":"「寫」後面接圖案，就是畫"},{"q":"「窺頭於牖，施尾於堂」，做這兩個動作的是誰？","opts":["葉公","天龍","葉公的僕人","畫上的龍"],"ans":"B","steps":["補主詞：往前一句「天龍聞而下之」","探頭、拖尾巴的是下凡的天龍","畫上的龍不會動"],"tests":"補主詞","avoid":"沒有主詞就往前一句找"},{"q":"下列哪一個事件鏈是正確的？","opts":["葉公到處畫龍 → 天龍聽說後下凡 → 葉公嚇得逃跑","天龍下凡 → 葉公開始畫龍 → 葉公逃跑","葉公逃跑 → 天龍下凡 → 葉公畫龍","葉公畫龍 → 葉公逃跑 → 天龍下凡"],"ans":"A","steps":["第一格：「好龍，鉤以寫龍……」","「於是天龍聞而下之」：於是＝因此，前面是原因","「葉公見之，棄而還走」放最後"],"tests":"排出事件鏈","avoid":"「於是」前面是因，後面是果"},{"q":"「葉公好龍」比喻哪一種人？","opts":["很會畫畫的人","勇敢面對困難的人","喜歡收集東西的人","嘴上說喜歡，真正遇到卻害怕逃避的人"],"ans":"D","steps":["表面：愛畫龍，真龍來了卻逃跑","作者結論：「好夫似龍而非龍者也」","像現實中只是表面喜歡、名不副實的人"],"tests":"寓言三問","avoid":"道理在作者最後的結論"}]},{"label":"第二篇","title":"一齊人傅之，眾楚人咻之","text":["有楚大夫於此，欲其子之齊語也，則使齊人傅諸？使楚人傅諸？曰：「使齊人傅之。」曰：「一齊人傅之，眾楚人咻之，雖日撻而求其齊也，不可得矣；引而置之莊嶽之間數年，雖日撻而求其楚，亦不可得矣。」"],"cite":"《孟子．滕文公下》（節選，孟子和宋國大臣戴不勝的對話，第一句是孟子的提問）","notes":"楚、齊：兩個國家，說的話不一樣　大夫：官員　諸：之乎，他……呢　咻：吵鬧　撻：用鞭子打　求：要求　莊嶽：齊國都城裡熱鬧的街市","trans":"孟子說：「有一位楚國大夫在這裡，想要他的兒子學說齊國話，那麼是找齊國人來教他呢？還是找楚國人來教他呢？」戴不勝說：「找齊國人來教他。」孟子說：「一個齊國人教他，卻有許多楚國人在旁邊吵鬧，就算每天用鞭子打他，要他說齊國話，也做不到；如果把他帶到齊國熱鬧的街市住上幾年，就算每天用鞭子打他，要他說楚國話，也做不到了。」","qs":[{"q":"「使齊人傅之」的「傅」是什麼意思？","opts":["師傅","傳送","附和","教導"],"ans":"D","steps":["前面說目的：「欲其子之齊語」，要兒子學齊國話","要學話 → 就要找人來教","傅＝教導；現代的「師傅」是名詞，這裡是動作"],"tests":"古今異義：傅","avoid":"看句子的目的來判斷動作"},{"q":"「曰：『使齊人傅之。』」是誰說的？","opts":["孟子","楚大夫","楚大夫的兒子","戴不勝"],"ans":"D","steps":["出處說明：第一句是孟子的提問","「曰」前面沒有人名，緊接在問題後面 → 是回答的人","和孟子對話的是戴不勝"],"tests":"對話題：找說話者","avoid":"問完下一句，通常換另一個人答"},{"q":"為什麼「雖日撻而求其齊也，不可得矣」？","opts":["齊國話太難學","老師教得不好","一個人教，卻有許多楚國人在旁邊吵","孩子不肯被打"],"ans":"C","steps":["往前一格：「一齊人傅之，眾楚人咻之」","一個人教，很多人吵 → 環境不對","所以就算天天打也學不會"],"tests":"往前找原因","avoid":"問為什麼，往前一格找"},{"q":"這段話想說明什麼道理？","opts":["學語言一定要被打才學得會","環境對學習的影響很大","楚國話比齊國話好聽","只要有一個好老師就足夠了"],"ans":"B","steps":["在楚國人中間：學不會齊國話","在齊國街市住幾年：連楚國話都說不出來","差別在環境 → 環境影響很大"],"tests":"比較兩種情況","avoid":"比較兩個結果，找出差在哪"}]},{"label":"第三篇","title":"梟將東徙","text":["梟逢鳩，鳩曰：「子將安之？」梟曰：「我將東徙。」鳩曰：「何故？」梟曰：「鄉人皆惡我鳴，以故東徙。」鳩曰：「子能更鳴，可矣；不能更鳴，東徙猶惡子之聲。」"],"cite":"《說苑．談叢》","notes":"梟：貓頭鷹一類的鳥　逢：遇見　鳩：斑鳩　徙：搬家　鄉人：這裡的人　鳴：叫聲　以故：因此","trans":"貓頭鷹遇到斑鳩，斑鳩問：「你要到哪裡去？」貓頭鷹說：「我要搬到東邊去。」斑鳩問：「為什麼？」貓頭鷹說：「這裡的人都討厭我的叫聲，所以我要搬到東邊。」斑鳩說：「你如果能改變叫聲，就可以了；如果不能改變叫聲，就算搬到東邊，那裡的人還是會討厭你的聲音。」","qs":[{"q":"「子將安之」是誰說的？「子」指誰？","opts":["梟說的，子指鳩","鳩說的，子指鳩的兒子","鳩說的，子指梟","梟說的，子指梟自己"],"ans":"C","steps":["找「曰」前面：「鳩曰」→ 鳩說的","子＝你（古今異義，不是兒子）","鳩對梟說話 → 你＝梟"],"tests":"對話題＋古今異義","avoid":"「子」先想成「你」"},{"q":"「鄉人皆惡我鳴」的「惡」是什麼意思？","opts":["兇惡","惡劣","討厭","噁心"],"ans":"C","steps":["代回「兇惡」：大家都兇惡我的叫聲？不通","代回「討厭」：大家都討厭我的叫聲 → 通","惡（ㄨˋ）＝討厭"],"tests":"一字多義：惡","avoid":"惡後面接東西，常是討厭"},{"q":"「子能更鳴」的「更」是什麼意思？","opts":["更加","再一次","夜晚的時辰","改變"],"ans":"D","steps":["鳩的建議要針對問題：大家討厭你的「鳴」","解決方法是把叫聲換掉","更（ㄍㄥ）＝改變，和「更正」的更一樣"],"tests":"一字多義：更","avoid":"建議要對準問題來讀"},{"q":"這則故事的道理是什麼？","opts":["搬家可以解決所有問題","問題出在自己，就要改變自己，換地方沒有用","斑鳩比貓頭鷹聰明","貓頭鷹應該永遠不要叫"],"ans":"B","steps":["表面：梟因為叫聲被討厭，想搬家","鳩說：不改叫聲，搬了還是被討厭","道理：要從自己改起"],"tests":"寓言三問","avoid":"誰說出解答，道理就在他的話裡"}]},{"label":"第四篇","title":"孫叔敖埋蛇","text":["孫叔敖為嬰兒之時，出遊，見兩頭蛇，殺而埋之。歸而泣，其母問其故，叔敖對曰：「聞見兩頭之蛇者死，嚮者吾見之，恐去母而死也。」其母曰：「蛇今安在？」曰：「恐他人又見，殺而埋之矣。」其母曰：「吾聞有陰德者，天報以福，汝不死也。」"],"cite":"《新序．雜事》（節選）","notes":"孫叔敖：春秋時楚國人，後來當了宰相　泣：哭　嚮者：剛才　安在：在哪裡　陰德：暗中做的好事　報：回報","trans":"孫叔敖還是小孩的時候，出去玩，看見一條兩頭蛇，就把牠打死埋了。回家後哭了起來，他母親問他原因，孫叔敖回答：「我聽說看見兩頭蛇的人會死，剛才我看見了，怕要離開母親死去了。」母親說：「蛇現在在哪裡？」他說：「我怕別人又看見，已經把牠打死埋起來了。」母親說：「我聽說暗中做好事的人，上天會用福氣回報他，你不會死的。」","qs":[{"q":"「孫叔敖為嬰兒之時」的「嬰兒」指什麼？","opts":["剛出生的寶寶","女孩子","還不會走路的人","年紀小的孩子"],"ans":"D","steps":["後面他能「出遊」、「殺而埋之」、回答母親","剛出生的寶寶做不到這些","古代「嬰兒」可以指年紀小的孩子"],"tests":"古今異義：嬰兒","avoid":"用人物做得到的事來判斷"},{"q":"「恐去母而死也」的「去」是什麼意思？","opts":["前往","離開","去除","過去"],"ans":"B","steps":["代回「前往」：怕前往母親那裡死掉？不通","代回「離開」：怕離開母親死去 → 通","古今異義：去＝離開"],"tests":"古今異義：去","avoid":"看到「去」，先換成「離開」"},{"q":"「曰：『恐他人又見，殺而埋之矣。』」是誰說的？","opts":["孫叔敖","母親","其他人","作者"],"ans":"A","steps":["上一句是母親問：「蛇今安在？」","「曰」前面沒有人名 → 是被問的人回答","所以是孫叔敖說的"],"tests":"對話題：找說話者","avoid":"「曰」前沒人名，看上一句誰問"},{"q":"母親說「汝不死也」，理由是什麼？","opts":["他怕別人受害而殺蛇埋蛇，是暗中做好事","兩頭蛇的傳說是假的","蛇已經埋起來，看不到了","他哭得很傷心"],"ans":"A","steps":["找母親的話：「吾聞有陰德者，天報以福」","孫叔敖的陰德：「恐他人又見，殺而埋之」","因為做了好事 → 母親說他不會死"],"tests":"找人物的理由","avoid":"理由要從說話的人那一句找"}]},{"label":"第五篇","title":"晏子之御","text":["晏子為齊相，出，其御之妻從門閒而闚其夫。其夫為相御，擁大蓋，策駟馬，意氣揚揚，甚自得也。既而歸，其妻請去。夫問其故。","妻曰：「晏子長不滿六尺，身相齊國，名顯諸侯。今者妾觀其出，志念深矣，常有以自下者。今子長八尺，乃為人僕御，然子之意自以為足，妾是以求去也。」"],"cite":"《史記．管晏列傳》（節選）","notes":"晏子：齊國宰相晏嬰　相：宰相　御：駕車的人　門閒：門縫　闚：偷看　擁大蓋：撐著大車篷　策：用鞭子趕　駟馬：四匹馬　自得：得意　既而：不久　尺：古代的尺比現在短　顯：顯揚　志念：思慮　自下：謙虛　妾：古代女子謙稱自己　自以為足：自以為很了不起　是以：因此","trans":"晏子當齊國宰相，有一次出門，他車夫的妻子從門縫偷看她的丈夫。她丈夫替宰相駕車，撐著大車篷，揮鞭趕著四匹馬，神氣十足，非常得意。不久車夫回家，妻子要求離開他。丈夫問她原因。妻子說：「晏子身高不到六尺，卻當上齊國宰相，名聲傳遍各國。今天我看他出門，思慮深遠，常常表現出謙虛的樣子。現在你身高八尺，只是替人駕車，卻自以為很了不起，我因此要求離開。」","qs":[{"q":"「其妻請去」的「去」是什麼意思？","opts":["離開","前往宰相家","去除","過去"],"ans":"A","steps":["後面妻子說「妾是以求去也」","她不滿丈夫的態度，要離開他","去＝離開，古今異義"],"tests":"古今異義：去","avoid":"去＝離開，這週背熟"},{"q":"「今子長八尺」的「子」指誰？","opts":["車夫","晏子","妻子的兒子","齊國國君"],"ans":"A","steps":["這是「妻曰」裡的話，妻子在對丈夫說話","子＝你，不是兒子","你＝她的丈夫，也就是車夫"],"tests":"古今異義：子＝你","avoid":"對話裡的「子」，先想成「你」"},{"q":"妻子要離開的原因是什麼？","opts":["丈夫身高太矮","晏子對她不好","丈夫只是駕車，卻自以為了不起，不如晏子謙虛","丈夫賺的錢太少"],"ans":"C","steps":["找「是以」前面的原因：「然子之意自以為足」","對比晏子：「常有以自下者」","矮的是晏子不是丈夫；錢的事文中沒說"],"tests":"因果：找原因","avoid":"「是以」前面就是原因"},{"q":"下列哪一個對照最正確？","opts":["晏子身高八尺，車夫不滿六尺","晏子個子矮卻謙虛，車夫個子高卻自滿","晏子和車夫都很得意","車夫比晏子更有名"],"ans":"B","steps":["晏子：長不滿六尺，常有以自下","車夫：長八尺，自以為足","兩人正好相反"],"tests":"人物對比","avoid":"把兩人的特點各列一行比較"}]}]}],"teach":[{"intro":"這一組深入學「古今異義」：同一個字，古代和現代的意思不一樣。","items":[{"t":"什麼是「古今異義」？","d":["一個字或詞，古代的意思和現在不同，用現代意思去讀就會讀錯。","例：「諸兒競走取之」，用現代的「走路」讀很怪，古代的「走」是跑。"],"ex":"就像「火鍋」：在餐桌上是吃的，在籃球場上是蓋人家火鍋，同一個詞換個地方，意思就變了。"},{"t":"常見古今異義整理（一）","d":["走：古＝跑（諸兒競走取之）；今＝走路","去：古＝離開（恐去母而死）；今＝前往","子：古＝你、兒子、果實（多子折枝）；今多指小孩","信：古＝果然、誠實、相信（取之，信然）；今多指書信"]},{"t":"常見古今異義整理（二）","d":["病：古＝病得重、很疲累（今日病矣）；今＝一般的生病","寫：古＝畫（鉤以寫龍）；今＝寫字","妻子：古＝妻子和兒女兩種人（率妻子邑人來此絕境）；今＝太太一個人"]},{"t":"怎麼抓出古今異義？","d":["讀到很熟的字，句子卻怪怪的，就是警訊。","換成古代意思再讀一次，讀得通、合情理才是答案。"]}],"demo":["「取之，信然」","代現代的「書信」：摘下來，書信是這樣？不通","代古代的「果然」：摘來一嚐，果然如此 → 通"]},{"intro":"這一組學對話題：一段文章裡好幾個人在說話，要分清楚每句話是誰說的。","items":[{"t":"「曰」前面就是說話的人","d":["「公欣然曰」→ 謝太傅說的；「兄子胡兒曰」→ 胡兒說的。","「曰」前面沒有人名時，看上一句：上一句是誰問，這一句通常是被問的人回答。"],"ex":"就像比賽轉播：主播說完換球評，一來一往輪流說。"},{"t":"稱謂換算表","d":["你：子、汝、爾、卿、若","我：吾、余、予、臣（對君王）、妾（女子）","親屬：兄子＝哥哥的兒子、兄女＝哥哥的女兒、大人＝父母、甲是乙之甥＝甲是乙的外甥"]},{"t":"引號是好幫手","d":["「」裡面是人物說的話，外面是作者的敘述。","例：「時戴在剡」在引號外面，是作者交代的背景。"]}],"demo":["「未若柳絮因風起」是誰說的？","找「曰」前面：「兄女曰」","換算：兄女＝謝太傅哥哥的女兒，也就是文末的「無奕女」"]},{"intro":"這一組學把事情一格一格排成事件鏈，看懂誰造成了誰。","items":[{"t":"什麼是「因果連鎖」？","d":["一件事造成下一件事，下一件又造成再下一件，像骨牌一樣倒下去。","塞翁失馬：馬跑了 → 帶回胡馬 → 兒子摔斷腿 → 不用上戰場。"],"ex":"就像一次抄截：抄到球 → 快攻 → 上籃得分 → 對手叫暫停。"},{"t":"看「弔」「賀」判斷好壞","d":["弔＝慰問：發生壞事，大家來安慰。","賀＝祝賀：發生好事，大家來恭喜。","塞翁失馬裡，好壞一直翻轉，這就是故事的重點。"]},{"t":"因果連接詞","d":["說原因：因、以……之故、何故","說結果：於是、是以、以故、果（果然，表示說過的事成真）"]}],"demo":["曲突徙薪","客人提醒 → 主人不理（嘿然不應）→ 果失火","「果」把提醒和失火連起來：說過的事成真了"]},{"intro":"第 2 週學過兩篇比一比；這一組練得更細：一句一句找對應，畫線連起來。","items":[{"t":"什麼是「對應句」？","d":["兩篇文章裡，意思一樣、只是說法不同的句子。","甲「擇其善者而從之」↔ 乙「看到隊友漂亮的傳球，我就記下來，下次照著做」。"],"ex":"就像戰術板上的箭頭：把每個隊員連到他該跑的位置。"},{"t":"畫線三步","d":["① 甲文拆成小句，每句寫白話。","② 在乙文找意思一樣的句子。","③ 畫線；沒有線的，就是「只有甲」或「只有乙」。"]},{"t":"小心「一字兩音」","d":["「知者樂水」的樂唸ㄧㄠˋ，是喜愛；「知者樂」的樂唸ㄌㄜˋ，是快樂。","樂後面接東西（水、山）是喜愛；放在最後沒接東西，是快樂。"]}],"demo":["甲「必有我師焉」","乙「球場上的每一個人，都是你的老師」","兩句都說身邊的人能當老師 → 畫線連起來"]},{"intro":"這一組學把圖表和一段文字放在一起看，找出它們對上的地方。","items":[{"t":"什麼是「圖文對讀」？","d":["題目給一張圖表，再給一段文字，答案要兩邊一起看才找得到。","圖表給數字，文字給原因或時間點。"],"ex":"就像看比賽數據表，再聽教練賽後訪問：數據說發生了什麼，教練說為什麼。"},{"t":"對讀四步","d":["① 看標題和單位。","② 找最高、最低、變化最大。","③ 在文字裡找時間點或原因。","④ 把文字對到圖上的那一格。"]},{"t":"推論要小心","d":["圖文只能推出「可能」，不能說「一定」。","圖表沒有的東西（心情、喜好、沒寫的原因），不能自己補。"]}],"demo":["文字：「從第三週開始」寫下沒進的原因","圖：第2週10球 → 第3週13球，多3球","對上了：新做法開始那週，進步最多"]},{"intro":"週末關卡把這週的招式全部合起來用，再做一次古今異義大複習。","items":[{"t":"這週學了哪些招？","d":["古今異義、對話題、因果連鎖、互文對讀二、圖文對讀，加上前兩週的偵查五步。"]},{"t":"古今異義再複習","d":["寫＝畫（鉤以寫龍）","走＝跑（棄而還走）","去＝離開（恐去母而死、其妻請去）","子＝你（子將安之、今子長八尺）"],"ex":"就像同一個隊友在不同戰術裡打不同位置，先看他現在站在哪裡。"},{"t":"一篇文章怎麼用五步？","d":["先看題幹 → 圈人物、補主詞 → 古今異義代回 → 排事件鏈 → 寓言三問找道理。"]}],"demo":["「葉公見之，棄而還走」","補主詞：葉公看見天龍","走＝跑 → 嚇得轉身就逃"]}],"daily":[{"words":[["子","果實","多子折枝"],["信","果然","信然"]],"line":"樹在道邊而多子，此必苦李。"},{"words":[["俄而","不久","俄而雪驟"],["未若","不如","未若柳絮因風起"]],"line":"未若柳絮因風起。"},{"words":[["弔","慰問","人皆弔之"],["居","過了","居數月"]],"line":"此何遽不為福乎？"},{"words":[["擇","選擇","擇善固執"],["從","跟隨學習","從善如流"]],"line":"三人行，必有我師焉。"},{"words":[["寫","畫","鉤以寫龍"],["牖","窗戶","窺頭於牖"]],"line":"是葉公非好龍也。"},null],"quiz":{"words":[["子","果實","看道邊李樹多子折枝"],["信","果然","取之，信然"],["俄而","不久","俄而雪驟"],["未若","不如","未若柳絮因風起"],["弔","慰問","人皆弔之"],["居","過了","居數月"],["擇","選擇","擇其善者而從之"],["從","跟隨學習","擇其善者而從之"],["寫","畫","鉤以寫龍"],["牖","窗戶","窺頭於牖"]],"lines":[["樹在道邊而多子，","此必苦李。"],["未若柳絮","因風起。"],["此何遽","不為福乎？"],["三人行，","必有我師焉。"],["是葉公","非好龍也。"]],"parts":[{"title":"楊布打狗","text":["楊朱之弟曰布。衣素衣而出，天雨，解素衣，衣緇衣而反。其狗不知，迎而吠之。楊布怒，將撲之。楊朱曰：「子無撲矣！子亦猶是也。嚮者使汝狗白而往，黑而來，豈能無怪哉？」"],"cite":"《列子．說符》","notes":"楊朱：戰國時的思想家　素：白色　緇：黑色　反：同「返」，回來　吠：狗叫　撲：打　猶：如同　嚮者：剛才　使：假如","trans":"楊朱的弟弟叫楊布，穿著白色的衣服出門。天下起雨，他脫下白衣，換穿黑衣回家。他的狗認不出他，迎上前對他叫。楊布很生氣，要打牠。楊朱說：「你不要打牠！你也會像牠一樣啊。假如剛才你的狗出去時是白的，回來時變成黑的，你難道能不覺得奇怪嗎？」","qs":[{"q":"「衣素衣而出」的第一個「衣」是什麼意思？","opts":["衣服","穿","白色","脫下"],"ans":"B","steps":["第一個「衣」後面接著「素衣」（白衣服），所以它是動作","代回：穿著白衣服出門 → 通","名詞當動詞：衣＝穿"],"tests":"詞性變化：衣","avoid":"名詞後面又接名詞，前面常是動作"},{"q":"「天雨」的「雨」是什麼意思？","opts":["雨水","下雨","雨傘","雨季"],"ans":"B","steps":["「天雨」：天怎麼了？要一個動作","後面「解素衣」，因為衣服淋濕了","雨＝下雨，當動詞"],"tests":"詞性變化：雨","avoid":"主詞後面的字，常是動作"},{"q":"「迎而吠之」的「之」指誰？","opts":["狗","楊朱","黑衣服","楊布"],"ans":"D","steps":["這句的主詞是「其狗」","狗認不出換了黑衣的主人，對著他叫","之＝楊布"],"tests":"代詞「之」指誰","avoid":"「之」是被做動作的人"},{"q":"「子無撲矣」是誰對誰說的？","opts":["楊布對楊朱","楊布對狗","楊朱對楊布","楊朱對狗"],"ans":"C","steps":["找「曰」前面：「楊朱曰」","前一句是楊布要打狗","子＝你，楊朱在勸弟弟楊布"],"tests":"對話題：找說話者","avoid":"先找「曰」，再看在回應誰"},{"q":"楊朱想告訴楊布什麼道理？","opts":["狗很笨，不必理牠","白衣服比黑衣服好看","外表變了別人認不出來很正常，不該隨便怪別人","下雨天不要出門"],"ans":"C","steps":["楊朱說「子亦猶是也」：你也會一樣","狗出去是白的、回來變黑的，你也會覺得奇怪","道理：先換個角度想，不要隨便怪別人"],"tests":"故事的道理","avoid":"道理在最後勸人的那段話"}]},{"title":"炳燭之明","text":["晉平公問於師曠曰：「吾年七十欲學，恐已暮矣。」師曠曰：「何不炳燭乎？」平公曰：「安有為人臣而戲其君乎？」師曠曰：「盲臣安敢戲其君乎？臣聞之，少而好學，如日出之陽；壯而好學，如日中之光；老而好學，如炳燭之明。炳燭之明，孰與昧行乎？」平公曰：「善哉！」"],"cite":"《說苑．建本》","notes":"晉平公：晉國國君　師曠：晉國的樂師，眼睛看不見　暮：晚　炳燭：點燃蠟燭　安：哪裡、怎麼　戲：開玩笑　壯：壯年　孰與：和……比起來哪一個好　昧行：在黑暗中走路","trans":"晉平公問師曠說：「我今年七十歲了，想要學習，恐怕已經太晚了。」師曠說：「為什麼不點起蠟燭呢？」平公說：「哪有做臣子的拿國君開玩笑的呢？」師曠說：「我這個瞎眼的臣子怎麼敢拿國君開玩笑呢？我聽說，年少時愛好學習，就像早上的太陽；壯年時愛好學習，就像中午的陽光；年老時愛好學習，就像點燃蠟燭的光亮。點著蠟燭的光亮，和在黑暗中走路比起來，哪一個好呢？」平公說：「說得好啊！」","qs":[{"q":"「安有為人臣而戲其君乎」是誰說的？","opts":["晉平公","師曠","作者","其他大臣"],"ans":"A","steps":["找「曰」前面：「平公曰」","他以為師曠說點蠟燭是在開玩笑","所以是晉平公說的"],"tests":"對話題：找說話者","avoid":"「曰」前面就是說話的人"},{"q":"「盲臣安敢戲其君乎」的「盲臣」指誰？","opts":["晉平公","師曠","其他看不見的人","一位老人"],"ans":"B","steps":["這句在「師曠曰」後面","臣＝說話的人在國君面前謙稱自己","師曠眼睛看不見（注釋），盲臣＝師曠自己"],"tests":"稱謂換算","avoid":"「臣」是對國君說的「我」"},{"q":"「少而好學」的「少」是什麼意思？","opts":["很少","缺少","少數人","年少的時候"],"ans":"D","steps":["後面接著「壯而好學」「老而好學」","少、壯、老是三個年紀","少＝年少"],"tests":"古今異義：少","avoid":"和「壯」「老」排在一起就是年紀"},{"q":"師曠用「炳燭之明」比喻什麼？","opts":["年老時學習","年少時學習","壯年時學習","國君的光芒"],"ans":"A","steps":["找對應：「老而好學，如炳燭之明」","日出 → 少，日中 → 壯，炳燭 → 老","所以炳燭＝年老時學習"],"tests":"看懂比喻","avoid":"比喻一組一組對好"},{"q":"師曠想說服平公的道理是什麼？","opts":["老了才學雖然比不上年輕時，總比不學好","老人學習沒有用","晚上讀書要點蠟燭","年輕人不必急著學習"],"ans":"A","steps":["關鍵句：「炳燭之明，孰與昧行乎？」","點蠟燭雖然不如太陽亮，總比在黑暗中走路好","道理：老了學習仍然有用"],"tests":"人物的主張","avoid":"最後一個問句常是重點"}]}]}},{"week":4,"groups":[{"no":"第 1 組","title":"濫竽充數","skill":"補主詞＋虛詞＋推論","steps":["❶ 看到動作先問：「誰做的？」往前找最近的人","❷ 圈出虛詞「而、故、乃、之」，當作路標","❸ 把兩、三句證據放在一起，推出文章沒直說的事","❹ 選項要有證據，不能是自己腦補"],"demo":{"q":"「南郭處士請為王吹竽」的「為」是什麼意思？","a":["→ 代「成為」：請求成為王吹竽？讀不通","→ 代「替」：請求替大王吹竽 → 通","答：替"]},"parts":[{"label":"第一篇","title":"濫竽充數","text":["齊宣王使人吹竽，必三百人。南郭處士請為王吹竽，宣王說之，廩食以數百人。宣王死，湣王立，好一一聽之，處士逃。"],"cite":"《韓非子．內儲說上》","notes":"竽：一種吹奏樂器　處士：沒有做官的讀書人　廩食：用官府的糧食供養　湣王：宣王的兒子　立：即位","trans":"齊宣王派人吹竽，一定要三百人一起吹。南郭處士請求替宣王吹竽，宣王很高興，用供養幾百人的糧食來供養他們。宣王死後，湣王即位，喜歡一個一個地聽人吹奏，南郭處士就逃走了。","qs":[{"q":"「宣王說之」的「之」指的是誰？","opts":["南郭處士","吹竽的三百人","湣王","齊國百姓"],"ans":"A","steps":["前一句：「南郭處士請為王吹竽」","宣王高興的，是提出請求的那個人","所以「之」＝南郭處士"],"tests":"代詞「之」指誰","avoid":"「之」是他，往前找最近的人"},{"q":"「好一一聽之」，喜歡一個一個聽的人是誰？","opts":["宣王","南郭處士","湣王","三百個樂手"],"ans":"C","steps":["往前找：「宣王死，湣王立」","宣王已經死了，接著做事的是新國君","所以喜歡一一聽的是湣王"],"tests":"補主詞","avoid":"主詞省略時，往前找最近的人"},{"q":"「齊宣王使人吹竽」的「使」是什麼意思？","opts":["使用","派、讓","使者","假使"],"ans":"B","steps":["代回「齊宣王派人吹竽」→ 通","「使用人吹竽」「假使人吹竽」都讀不通","所以「使」＝派、讓"],"tests":"字義：使","avoid":"把每個意思代回去讀一次"},{"q":"南郭處士為什麼在湣王即位後逃走？","opts":["湣王不喜歡聽竽","他想到別的國家做官","宣王死了他太傷心","他其實不會吹竽，一個一個吹就會被發現"],"ans":"D","steps":["證據一：宣王時三百人一起吹，他混在裡面","證據二：湣王改成一一聽，他馬上逃","兩個證據合起來：單獨吹會露餡，所以他其實不會吹"],"tests":"推論：兩證據合推","avoid":"把前後兩個情況放一起比"}]},{"label":"第二篇","title":"齊人有好獵者","text":["齊人有好獵者，曠日持久而不得獸，入則媿其家室，出則媿其知友州里。惟其所以不得之故，則狗惡也。欲得良狗，則家貧無以。於是還疾耕，疾耕則家富，家富則有以求良狗，狗良則數得獸矣，田獵之獲常過人矣。"],"cite":"《呂氏春秋．貴當》（節選）","notes":"曠日持久：花很長的時間　媿：同「愧」，慚愧　家室：家人　知友州里：朋友鄉親　惟：思考　惡：不好　無以：沒有辦法　疾：努力　數：屢次","trans":"齊國有個喜歡打獵的人，花了很長時間卻打不到野獸，在家對家人感到慚愧，出門對朋友鄉親感到慚愧。他想了想打不到的原因，是狗不好。想要得到好狗，家裡卻窮得沒辦法。於是他回去努力耕田，努力耕田家裡就富有，家裡富有就有能力求得好狗，狗好了就常常打到野獸，打獵的收穫常常超過別人。","qs":[{"q":"「齊人有好獵者」的「好」是什麼意思？","opts":["好的","很","容易","喜歡"],"ans":"D","steps":["代回「齊國有個喜歡打獵的人」→ 通","和本週「好一一聽之」的好一樣","所以「好」＝喜歡"],"tests":"字義：好","avoid":"「好」放在動作前面，常是喜歡"},{"q":"「曠日持久而不得獸」的「而」是什麼意思？","opts":["然後","卻","而且","因為"],"ans":"B","steps":["前面：花了很長時間打獵","後面：打不到野獸，和期待相反","前後相反 →「而」＝卻"],"tests":"虛詞「而」轉折","avoid":"前後相反時，「而」讀成「卻」"},{"q":"他想了想，認為自己打不到獵物的原因是什麼？","opts":["狗不好","自己不夠努力","天氣不好","家人不支持"],"ans":"A","steps":["找證據：「惟其所以不得之故，則狗惡也」","注釋：惡＝不好","所以他認為是狗不好"],"tests":"找原因的證據句","avoid":"「所以……之故」後面就是原因"},{"q":"他最後能常常打到獵物，關鍵是什麼？","opts":["換了打獵的地方","朋友送他一隻好狗","先努力耕田變富，才有能力求得好狗","他每天練習射箭"],"ans":"C","steps":["一連串證據：疾耕 → 家富 → 有以求良狗 → 數得獸","文中沒有提到換地方、朋友送狗、練射箭","所以關鍵是先耕田變富"],"tests":"推論：因果連鎖","avoid":"順著「則」一個接一個找下去"}]},{"label":"第三篇","title":"扁鵲見蔡桓公","text":["扁鵲見蔡桓公，立有間，扁鵲曰：「君有疾在腠理，不治將恐深。」桓侯曰：「寡人無疾。」扁鵲出，桓侯曰：「醫之好治不病以為功。」"],"cite":"《韓非子．喻老》（節選）","notes":"扁鵲：古代名醫　立有間：站了一會兒　腠理：皮膚表面　寡人：國君自稱","trans":"扁鵲進見蔡桓公，站了一會兒，扁鵲說：「您的皮膚表面有病，不治療恐怕會加深。」桓侯說：「我沒有病。」扁鵲離開後，桓侯說：「醫生就喜歡醫治沒有病的人，來當作自己的功勞。」","qs":[{"q":"「君有疾在腠理」的「君」指的是誰？","opts":["扁鵲自己","旁邊的大臣","蔡桓公","其他醫生"],"ans":"C","steps":["這句是扁鵲對著蔡桓公說的話","下一句回答「寡人無疾」的是桓侯","所以「君」＝蔡桓公"],"tests":"人稱：君指誰","avoid":"看說話的人在對誰說"},{"q":"「醫之好治不病以為功」的「好」是什麼意思？","opts":["喜歡","很好","完成","方便"],"ans":"A","steps":["代回「醫生喜歡醫治沒病的人」→ 通","「很好醫治」「完成醫治」都讀不通","所以「好」＝喜歡"],"tests":"字義：好","avoid":"「好」在動作前，先代「喜歡」"},{"q":"桓侯說「醫之好治不病以為功」，表示他心裡怎麼想？","opts":["感謝扁鵲提醒","害怕自己病得很重","想請扁鵲留下來","認為扁鵲想搶功勞，不相信自己有病"],"ans":"D","steps":["證據一：他先說「寡人無疾」","證據二：扁鵲一走，他就說醫生愛治沒病的人來當功勞","合起來：他不信自己有病，還懷疑扁鵲"],"tests":"推論人物心理","avoid":"看人物前後兩句話怎麼說"},{"q":"扁鵲說「不治將恐深」，意思是什麼？","opts":["病已經治不好了","現在不治，病恐怕會變嚴重","病在骨頭裡很深","只要休息就會好"],"ans":"B","steps":["前一句：病在皮膚表面（腠理）","「將」＝將要，「深」＝加深","所以是：現在不治，以後會變嚴重"],"tests":"句意理解","avoid":"注意「將」是還沒發生的事"}]},{"label":"第四篇","title":"楚王好細腰","text":["昔者楚靈王好士細要，故靈王之臣皆以一飯為節，脅息然後帶，扶牆然後起。比期年，朝有黧黑之色。"],"cite":"《墨子．兼愛中》（節選）","notes":"士：臣子　要：同「腰」　節：限度　脅息：屏住呼吸　帶：繫上腰帶　比：等到　期年：一整年　朝：朝廷　黧黑：臉色又黑又黃","trans":"從前楚靈王喜歡臣子腰細，所以靈王的臣子都只吃一餐飯來限制自己，屏住呼吸後才繫上腰帶，扶著牆壁才站得起來。過了一年，朝廷上的大臣都臉色黑黃。","qs":[{"q":"「故靈王之臣皆以一飯為節」的「故」是什麼意思？","opts":["舊的","所以","故意","朋友"],"ans":"B","steps":["前面：楚靈王喜歡腰細的臣子（原因）","後面：臣子只吃一餐（結果）","原因接結果 →「故」＝所以"],"tests":"虛詞「故」","avoid":"「故」前是原因，後是結果"},{"q":"「扶牆然後起」，是誰要扶著牆才站得起來？","opts":["楚靈王","宮女","百姓","靈王的臣子"],"ans":"D","steps":["往前找：「靈王之臣皆以一飯為節，脅息然後帶」","後面一連串動作的主詞都沒換","所以扶牆的是靈王的臣子"],"tests":"補主詞","avoid":"主詞沒換時，一路沿用前面的人"},{"q":"臣子們為什麼一天只吃一餐？","opts":["國家缺糧食","生病吃不下","想讓腰變細，討好楚靈王","靈王下令不准吃"],"ans":"C","steps":["證據：「楚靈王好士細要，故……以一飯為節」","文中只說靈王「喜歡」，沒說「下令」","所以是為了腰細討好靈王"],"tests":"找原因的證據","avoid":"「好」是喜歡，不是命令"},{"q":"這段文字想說明什麼？","opts":["上位者的喜好，會讓下面的人跟著做，甚至傷害自己","少吃飯對身體好","楚國人天生都很瘦","楚靈王很關心臣子健康"],"ans":"A","steps":["證據一：靈王喜歡細腰，臣子就節食","證據二：一年後臣子臉色黑黃、站不穩","推出：上面的喜好影響下面，還傷了身體"],"tests":"推論主旨","avoid":"看開頭的原因和最後的結果"}]},{"label":"第五篇","title":"老馬識途","text":["管仲、隰朋從於桓公而伐孤竹，春往冬反，迷惑失道。管仲曰：「老馬之智可用也。」乃放老馬而隨之，遂得道。行山中無水，隰朋曰：「蟻冬居山之陽，夏居山之陰，蟻壤一寸而仞有水。」乃掘地，遂得水。"],"cite":"《韓非子．說林上》（節選）","notes":"管仲、隰朋：齊國大臣　桓公：齊桓公　孤竹：古國名　反：同「返」　遂：終於　陽：山的南面　陰：山的北面　蟻壤：螞蟻窩堆起的土　仞：古代長度單位","trans":"管仲、隰朋跟隨齊桓公去攻打孤竹國，春天出發，冬天回來，迷了路。管仲說：「老馬的智慧可以利用。」於是放開老馬，跟在牠後面走，終於找到了路。走到山裡沒有水，隰朋說：「螞蟻冬天住在山的南面，夏天住在山的北面，螞蟻窩的土堆高一寸，往下挖一仞深就有水。」於是挖地，終於找到了水。","qs":[{"q":"「乃放老馬而隨之」的「之」指的是什麼？","opts":["老馬","管仲","桓公","道路"],"ans":"A","steps":["同一句前面：「放老馬」","放開老馬，再跟在誰後面？","所以「之」＝老馬"],"tests":"代詞「之」指誰","avoid":"「之」常指同一句前面的東西"},{"q":"「乃放老馬而隨之」的「乃」是什麼意思？","opts":["你","卻","於是、就","竟然"],"ans":"C","steps":["前面：管仲說老馬的智慧可以用","後面：接著就放老馬，是順著做下去","所以「乃」＝於是、就"],"tests":"虛詞「乃」","avoid":"前後順著發生，「乃」讀成「於是」"},{"q":"「蟻冬居山之陽……」這段話是誰說的？","opts":["管仲","隰朋","桓公","孤竹國人"],"ans":"B","steps":["找說話的標記：「隰朋曰」","管仲說的是老馬那一句","所以是隰朋"],"tests":"找說話的人","avoid":"先找「某某曰」"},{"q":"這個故事最想稱讚什麼？","opts":["馬比人聰明","打仗一定會迷路","螞蟻會幫人挖井","遇到困難時，懂得向有經驗的事物學習"],"ans":"D","steps":["證據一：迷路時，靠老馬認路","證據二：沒水時，靠螞蟻的習性找水","兩件事合起來：善用身邊事物的經驗"],"tests":"推論主旨","avoid":"把兩件事的共同點找出來"}]}]},{"no":"第 2 組","title":"買櫝還珠","skill":"一字多義＋古今異義＋選項代回","steps":["❶ 先想這個字你學過哪幾個意思","❷ 現代意思代回去怪怪的 → 想古代意思（古今異義）","❸ 每個選項都代回原句讀一次，通的才選","❹ 用前後文再確認一次"],"demo":{"q":"「薰以桂椒」是什麼意思？","a":["→ 以＝用","→ 倒過來讀：用桂、椒來薰（匣子）","答：用桂、椒的香氣熏匣子"]},"parts":[{"label":"第一篇","title":"買櫝還珠","text":["楚人有賣其珠於鄭者，為木蘭之櫝，薰以桂椒，綴以珠玉，飾以玫瑰，輯以翡翠。鄭人買其櫝而還其珠。此可謂善賣櫝矣，未可謂善鬻珠也。"],"cite":"《韓非子．外儲說左上》","notes":"鄭：國名　木蘭：一種香木　薰：用香料熏　桂椒：兩種香料　綴：點綴　輯：連綴　翡翠：翠鳥的羽毛　櫝：木匣子","trans":"有個楚國人到鄭國賣珍珠，用木蘭做了一個匣子，用桂、椒的香氣熏它，用珠玉點綴它，用美玉裝飾它，用翠鳥的羽毛連綴它。鄭國人買下他的匣子，卻把珍珠還給他。這可以說是很會賣匣子，卻不能說是很會賣珍珠啊。","qs":[{"q":"「飾以玫瑰」的「玫瑰」是什麼？","opts":["一種花","紅色的布","香料","美玉"],"ans":"D","steps":["前後都是貴重材料：珠玉、翡翠","古代「玫瑰」指美玉，和現在的花不同","所以「玫瑰」＝美玉"],"tests":"古今異義：玫瑰","avoid":"現代意思怪怪的，就想古代意思"},{"q":"「鄭人買其櫝而還其珠」的「而」是什麼意思？","opts":["因為","卻","而且","如果"],"ans":"B","steps":["買珍珠本來該留下珍珠","鄭人買了匣子，卻把珍珠還回去，和常理相反","前後相反 →「而」＝卻"],"tests":"虛詞「而」轉折","avoid":"前後相反時，「而」讀成「卻」"},{"q":"「未可謂善鬻珠也」的「善」是什麼意思？","opts":["擅長、很會","善良","喜歡","好的東西"],"ans":"A","steps":["代回「不能說他擅長賣珍珠」→ 通","「不能說他善良賣珍珠」讀不通","所以「善」＝擅長"],"tests":"一字多義：善","avoid":"「善」放在動作前，常是很會"},{"q":"作者對這個楚國人的評語，最接近哪一個？","opts":["他是賣珍珠的高手","鄭國人不懂得欣賞匣子","包裝做得太花俏，反而讓人只看見匣子","珍珠根本不值錢"],"ans":"C","steps":["證據：「此可謂善賣櫝矣，未可謂善鬻珠也」","代回：他很會賣匣子，不算很會賣珍珠","原因是匣子裝飾太多，搶走珍珠的風采"],"tests":"選項代回找評語","avoid":"每個選項都回原句比對"}]},{"label":"第二篇","title":"畫鬼最易","text":["客有為齊王畫者，齊王問曰：「畫孰最難者？」曰：「犬馬最難。」「孰易者？」曰：「鬼魅最易。夫犬馬，人所知也，旦暮罄於前，不可類之，故難。鬼魅，無形者，不罄於前，故易之也。」"],"cite":"《韓非子．外儲說左上》","notes":"客：門客　孰：什麼　鬼魅：鬼怪　夫：發語詞　旦暮：早晚　罄於前：出現在眼前　無形：沒有形體","trans":"有個替齊王畫畫的門客，齊王問他：「畫什麼最難？」他說：「狗和馬最難。」「畫什麼最容易？」他說：「鬼怪最容易。狗和馬是大家都知道的，早晚都出現在眼前，不容易畫得像，所以難。鬼怪沒有形體，不會出現在眼前，所以容易畫。」","qs":[{"q":"「客有為齊王畫者」的「為」是什麼意思？","opts":["成為","因為","替、幫","是"],"ans":"C","steps":["代回「有個替齊王畫畫的門客」→ 通","「成為齊王畫」「因為齊王畫」都讀不通","所以「為」＝替"],"tests":"一字多義：為","avoid":"「為＋人＋動作」，常是替某人做"},{"q":"「不可類之」的「類」是什麼意思？","opts":["像、畫得像","種類","分類","人類"],"ans":"A","steps":["前面：狗和馬大家天天看到","代回「不容易畫得像」→ 通","現代「類」多是種類，這裡是「像」"],"tests":"古今異義：類","avoid":"名詞意思不通，就試試動詞"},{"q":"「故難」「故易之也」的「故」是什麼意思？","opts":["舊的","故意","朋友","所以"],"ans":"D","steps":["前面說原因：大家都看過／沒人看過","後面說結果：難／容易","原因接結果 →「故」＝所以"],"tests":"一字多義：故","avoid":"「故」前是原因，後是結果"},{"q":"畫家認為鬼怪最容易畫，原因是什麼？","opts":["大家都怕鬼，不敢細看","鬼怪沒有形體、沒人見過，畫成什麼樣都無法比對","鬼怪的顏色比較少","齊王比較喜歡鬼怪畫"],"ans":"B","steps":["證據：「鬼魅，無形者，不罄於前」","代回：沒有形體、不出現在眼前","沒人見過，就沒人能說畫得不像"],"tests":"選項代回找原因","avoid":"原因要從「故」前面找"}]},{"label":"第三篇","title":"愚公移山","text":["太形、王屋二山，方七百里，高萬仞，本在冀州之南，河陽之北。北山愚公者，年且九十，面山而居。懲山北之塞，出入之迂也，聚室而謀曰：「吾與汝畢力平險，指通豫南，達於漢陰，可乎？」雜然相許。"],"cite":"《列子．湯問》（節選開頭）","notes":"太形、王屋：兩座山名，太形就是太行山　仞：古代長度單位　冀州：古地名　河陽：黃河北岸　懲：苦於　塞：阻塞　迂：繞遠路　畢力：用盡全力　豫南：豫州南部　漢陰：漢水南岸　雜然：紛紛　許：贊同","trans":"太行、王屋兩座山，方圓七百里，高一萬仞，本來在冀州的南邊、黃河北岸的北邊。北山有個叫愚公的人，年紀將近九十歲，面對著山居住。他苦於山北面的阻塞，進出都要繞遠路，就召集全家人來商量說：「我和你們用盡全力剷平險峻的大山，讓道路直通豫州南部，到達漢水南岸，好嗎？」大家紛紛表示贊同。","qs":[{"q":"「年且九十」的「且」是什麼意思？","opts":["而且","將近","暫且","並且"],"ans":"B","steps":["「且」放在數字前面","代回「年紀將近九十歲」→ 通","「而且九十」「暫且九十」都讀不通"],"tests":"一字多義：且","avoid":"「且」在數字前，常是將近"},{"q":"「面山而居」的「面」是什麼意思？","opts":["臉孔","表面","見面","面對、朝著"],"ans":"D","steps":["代回「面對著山居住」→ 通","「臉孔山而居」讀不通","這裡「面」當動作用"],"tests":"詞性：名詞當動詞","avoid":"後面接東西時，試試當動作讀"},{"q":"「聚室而謀」的「室」是什麼意思？","opts":["房間","教室","全家人","屋頂"],"ans":"C","steps":["後面愚公說「吾與汝」，是在對人說話","代回「召集全家人來商量」→ 通","古代「室」常指家人，和現在的房間不同"],"tests":"古今異義：室","avoid":"能「商量」的一定是人"},{"q":"「方七百里」的「方」，最適合代入哪個意思？","opts":["方圓、面積","方法","正在","地方"],"ans":"A","steps":["後面接「七百里」，是在講大小","代回「方圓七百里」→ 通","「方法七百里」「正在七百里」都不通"],"tests":"選項代回：方","avoid":"後面接數量，就是在講大小"}]},{"label":"第四篇","title":"精衛填海","text":["又北二百里，曰發鳩之山，其上多柘木。有鳥焉，其狀如烏，文首，白喙，赤足，名曰精衛，其鳴自詨。是炎帝之少女，名曰女娃。女娃游於東海，溺而不返，故為精衛，常銜西山之木石，以堙於東海。"],"cite":"《山海經．北山經》（節選）","notes":"柘木：一種樹　狀：樣子　烏：烏鴉　喙：鳥嘴　其鳴自詨：叫聲像在喊自己的名字　炎帝：傳說中的古代帝王　溺：淹沒　銜：用嘴叼著","trans":"再往北二百里，有座山叫發鳩山，山上有很多柘樹。山裡有一種鳥，樣子像烏鴉，頭上有花紋，白色的嘴，紅色的腳，名叫精衛，牠的叫聲像在呼喊自己的名字。牠是炎帝的小女兒，名叫女娃。女娃到東海游玩，淹沒在海裡沒有回來，所以變成了精衛鳥，常常叼著西山的樹枝和石頭，用來填塞東海。","qs":[{"q":"「文首」的「文」是什麼意思？","opts":["花紋","文章","文字","文雅"],"ans":"A","steps":["前後在描寫鳥的樣子：白喙、赤足","代回「頭上有花紋」→ 通","「文」古代常同「紋」"],"tests":"一字多義：文","avoid":"描寫外表時，「文」多是花紋"},{"q":"「是炎帝之少女」的「少女」是什麼意思？","opts":["年輕的女孩","宮女","小女兒","少數的女兒"],"ans":"C","steps":["前面「炎帝之」，說的是和炎帝的關係","代回「炎帝的小女兒」→ 通","古代「少女」指排行最小的女兒，和現在不同"],"tests":"古今異義：少女","avoid":"看到「某人之」，想到親屬關係"},{"q":"「故為精衛」的「故」是什麼意思？","opts":["舊的","所以","故意","朋友"],"ans":"B","steps":["前面：女娃淹沒在東海沒回來（原因）","後面：變成精衛（結果）","原因接結果 →「故」＝所以"],"tests":"一字多義：故","avoid":"「故」前是原因，後是結果"},{"q":"「常銜西山之木石，以堙於東海」，代回後哪個說法正確？","opts":["精衛住在西山，偶爾去東海","精衛想把西山搬走","精衛叼石頭來蓋鳥巢","精衛常叼西山的樹枝石頭，用來填東海"],"ans":"D","steps":["篇名是「精衛填海」，可知「堙」＝填；「以」＝用來","代回：叼西山的木石，用來填塞東海","其他選項文中都沒有證據"],"tests":"選項代回句意","avoid":"每個字的意思都要對得上"}]},{"label":"第五篇","title":"夸父逐日","text":["夸父與日逐走，入日。渴，欲得飲，飲於河、渭；河、渭不足，北飲大澤。未至，道渴而死。棄其杖，化為鄧林。"],"cite":"《山海經．海外北經》","notes":"夸父：神話中的巨人　入日：追到太陽落下的地方　渭：渭水　大澤：大湖　杖：手杖　鄧林：桃林","trans":"夸父和太陽賽跑，追到了太陽落下的地方。他口渴，想要喝水，就到黃河、渭水喝水；黃河、渭水的水不夠，又往北去喝大湖的水。還沒走到，就在半路上渴死了。他丟下的手杖，變成了一片桃林。","qs":[{"q":"「夸父與日逐走」的「走」是什麼意思？","opts":["走路","離開","走漏","跑"],"ans":"D","steps":["和太陽「逐」＝追趕、比賽","追太陽一定是用跑的","古代「走」＝跑（兔走觸株）"],"tests":"古今異義：走","avoid":"看到「走」，先想「跑」"},{"q":"「飲於河、渭」的「河」指的是什麼？","opts":["所有的河流","黃河","小溪","護城河"],"ans":"B","steps":["「河」和「渭」並列，渭是一條特定的河","古代單說「河」，專指黃河","所以「河」＝黃河"],"tests":"古今異義：河","avoid":"古文單一個「河」，多半是黃河"},{"q":"「道渴而死」的「道」是什麼意思？","opts":["在路上、半路","道理","說","方法"],"ans":"A","steps":["前一句「未至」：還沒走到大澤","代回「在半路上渴死」→ 通","「道理渴死」「說渴死」都讀不通"],"tests":"一字多義：道","avoid":"前面說還沒到，「道」就是路上"},{"q":"夸父為什麼要「北飲大澤」？","opts":["大澤的水比較甜","他想到北方追太陽","黃河、渭水的水不夠他喝","有人勸他去"],"ans":"C","steps":["找前一句：「河、渭不足」","不夠喝，才往北找大湖","其他選項文中都沒有"],"tests":"找原因的證據","avoid":"原因常常就在前一句"}]}]},{"no":"第 3 組","title":"柴犬好養嗎","skill":"白話找證據＋段落重點＋絕對字","steps":["❶ 每段讀完，用一句話寫下重點","❷ 選項的每個字都回文章找證據","❸ 圈出絕對字：都、一定、永遠、從來、完全、所有","❹ 文章沒說那麼滿，有絕對字的選項就排除"],"demo":{"q":"〈柴犬好養嗎〉第三段的重點是什麼？","a":["→ 第一句：「還有一個讓主人忙碌的地方：換毛」","→ 後面又補上：每天都要散步","答：換毛和散步，讓養柴犬的人很忙"]},"parts":[{"label":"第一篇","title":"柴犬好養嗎","text":["柴犬是來自日本的犬種，有一身蓬鬆的毛、捲在背上的尾巴，還有一張看起來像在微笑的臉，因此在網路上非常受歡迎。很多人看到柴犬的照片，就想馬上養一隻。","不過，柴犬可愛的外表下，藏著很有主見的個性。牠們很聰明，卻不一定願意乖乖聽話；如果主人一直大聲罵牠，牠可能會變得更不配合。比較好的方法是用零食和稱讚當獎勵，每次只練一個小動作，有耐心地慢慢教。","柴犬還有一個讓主人忙碌的地方：換毛。柴犬的毛有兩層，每年會大量換毛一到兩次，換毛的那段時間，家裡到處都是毛，主人幾乎要天天梳毛、打掃。再加上柴犬精力旺盛，每天都需要帶出門散步。所以，想養柴犬之前，先問問自己：有沒有時間陪牠、教牠、幫牠打掃？"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段的重點是什麼？","opts":["柴犬很聰明","罵柴犬完全沒有用","柴犬很有主見，要用獎勵耐心地教","柴犬很愛吃零食"],"ans":"C","steps":["第二段第一句：柴犬「很有主見的個性」","後面接著說方法：用零食和稱讚，慢慢教","「很聰明」只是其中一個小地方"],"tests":"段落重點","avoid":"重點要包含整段，不是只有一句"},{"q":"根據文章，下列哪個說法有證據？","opts":["柴犬每年會大量換毛一到兩次","柴犬一年到頭天天大量掉毛","柴犬不需要每天散步","所有柴犬都不聽話"],"ans":"A","steps":["第三段：「每年會大量換毛一到兩次」","文中說每天都要散步，和「不需要」相反","「所有」「天天大量」都是文章沒說的"],"tests":"白話找證據","avoid":"選項要能在文中找到同一句"},{"q":"下列哪個說法最符合文章？","opts":["只要給零食，柴犬一定學會所有動作","柴犬從來不聽主人的話","每個人看到柴犬照片都想養","主人一直大聲罵，柴犬可能變得更不配合"],"ans":"D","steps":["第二段：「一直大聲罵牠，牠可能會變得更不配合」","其他選項有「一定」「從來」「每個人」等絕對字","文中只說「不一定」「很多人」，沒說那麼滿"],"tests":"排除絕對字","avoid":"看到「一定、從來、每個」先畫圈"},{"q":"把三段的重點連起來，全文想說什麼？","opts":["柴犬是全世界最好養的狗","柴犬很可愛，但要花時間教、陪、打掃，養前要想清楚","柴犬不適合任何家庭","柴犬在網路上很受歡迎"],"ans":"B","steps":["第一段：外表可愛；第二段：要耐心教；第三段：換毛、散步很花時間","最後「所以」：養之前先問自己有沒有時間","「最好養」「不適合任何家庭」都是絕對字"],"tests":"全文主旨","avoid":"每段一句話，連起來就是主旨"}]},{"label":"第二篇","title":"章魚的三顆心臟","text":["章魚是海洋裡的聰明動物，牠的身體構造也很特別：一隻章魚有三顆心臟。兩顆比較小的心臟，負責把血液送到鰓，讓血液吸收氧氣；另一顆比較大的心臟，再把帶著氧氣的血液送到全身。","章魚的血液也和人不一樣。人的血液是紅色的，章魚的血液卻是藍色的，因為牠用來運送氧氣的物質裡含有銅，而人的血液裡運送氧氣的物質含有鐵。","章魚還很會躲藏。牠可以在很短的時間內改變皮膚的顏色，讓自己和身邊的岩石、海草看起來差不多，躲過敵人的眼睛。科學家認為，章魚是非常聰明的無脊椎動物。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的重點是什麼？","opts":["章魚住在海洋裡","章魚有三顆心臟，而且各有分工","章魚很聰明","鰓會吸收氧氣"],"ans":"B","steps":["第一段冒號後面：「一隻章魚有三顆心臟」","接著說兩小一大，各自負責送血","其他選項只是段落裡的小細節"],"tests":"段落重點","avoid":"冒號後面常常就是重點"},{"q":"章魚的血液為什麼是藍色的？","opts":["牠住在藍色的海裡","牠吃藍色的食物","牠有三顆心臟","運送氧氣的物質含有銅"],"ans":"D","steps":["找「因為」：「因為牠用來運送氧氣的物質裡含有銅」","三顆心臟是第一段，和血的顏色無關","海和食物文中都沒提到"],"tests":"找原因的證據","avoid":"看到「為什麼」就找「因為」"},{"q":"下列哪個說法最符合文章？","opts":["章魚的三顆心臟一樣大","所有動物的血都是紅色的","章魚能改變皮膚顏色來躲敵人","章魚永遠不會被敵人發現"],"ans":"C","steps":["第三段：「改變皮膚的顏色……躲過敵人的眼睛」","第一段說兩小一大，不是一樣大","「所有」「永遠」是絕對字，文章沒說"],"tests":"排除絕對字","avoid":"絕對字的選項，要找到一樣滿的證據"},{"q":"第三段主要在說什麼？","opts":["章魚很會躲藏，能快速改變膚色","章魚很會游泳","章魚的血是藍色的","岩石和海草的顏色"],"ans":"A","steps":["第三段第一句：「章魚還很會躲藏」","後面說怎麼躲：改變皮膚顏色","藍色血是第二段的內容"],"tests":"段落重點","avoid":"不要把別段的內容當成這段重點"}]},{"label":"第三篇","title":"蜜蜂的舞蹈","text":["蜜蜂找到花蜜之後，回到蜂巢，主要是用「跳舞」來告訴同伴花在哪裡。","如果花離蜂巢很近，蜜蜂會跳「圓圈舞」，在原地繞著小圈子轉，意思是：花就在附近，出去找找看。如果花離得比較遠，牠會跳「搖擺舞」，一邊走直線一邊搖動身體，再繞回來重複。直線的方向，可以告訴同伴花在哪個方向；搖擺的時間越長，通常表示花越遠。","蜜蜂的舞蹈，是奧地利科學家弗里希研究發現的，他後來也因為研究動物行為，得到了諾貝爾獎。小小的蜜蜂，原來有一套自己的「語言」。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段主要在說什麼？","opts":["蜜蜂用不同的舞，告訴同伴花的遠近和方向","蜜蜂喜歡轉圈圈","花通常離蜂巢很近","搖擺舞比圓圈舞好看"],"ans":"A","steps":["第二段用「如果近……如果遠……」介紹兩種舞","兩種舞都在傳達花的位置","好不好看、喜不喜歡，文中都沒說"],"tests":"段落重點","avoid":"有「如果……如果……」就把兩邊合起來"},{"q":"蜜蜂跳「圓圈舞」，是在告訴同伴什麼？","opts":["花在很遠的地方","附近有敵人","花就在附近","快要下雨了"],"ans":"C","steps":["第二段：「花離蜂巢很近，蜜蜂會跳圓圈舞」","「意思是：花就在附近」","敵人、下雨文中沒提到"],"tests":"白話找證據","avoid":"找「意思是」後面那句"},{"q":"根據文章，下列哪個說法有證據？","opts":["搖擺舞一定比圓圈舞難學","搖擺的時間越長，通常表示花越遠","所有昆蟲都會跳舞","弗里希每年都得諾貝爾獎"],"ans":"B","steps":["第二段最後：「搖擺的時間越長，通常表示花越遠」","「一定」「所有」「每年」都是絕對字","文章沒有這些證據"],"tests":"排除絕對字","avoid":"原文有「通常」，選項卻說「一定」就錯"},{"q":"下列哪個說法「超過」文章的證據？","opts":["蜜蜂主要用跳舞傳遞花蜜的消息","弗里希研究動物行為，得過諾貝爾獎","直線的方向可以告訴同伴花在哪個方向","蜜蜂每次都能百分之百找到花"],"ans":"D","steps":["前三個選項在第一、二、三段都找得到","「每次」「百分之百」是絕對字","文中沒說蜜蜂一定找得到"],"tests":"找出絕對字","avoid":"問「超過證據」，就找最滿的那句"}]},{"label":"第四篇","title":"月亮的圓缺","text":["抬頭看月亮，有時是圓圓的滿月，有時只剩細細的一彎。其實，月亮本身並不會發光，我們看到的月光，是它反射的太陽光。","月亮繞著地球轉，大約一個月繞一圈。月亮總是有一半被太陽照亮，但它走到不同位置時，我們從地球上看到被照亮的部分有多有少，於是看起來就有圓有缺。","所以，月亮並不是真的變大變小，只是我們看它的角度改變了。農曆每個月十五前後，常常可以看到又圓又亮的滿月。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第一段的重點是什麼？","opts":["月亮有時很細","太陽比月亮大","晚上要常常看天空","月亮不會自己發光，月光是反射的太陽光"],"ans":"D","steps":["第一段的「其實」後面：月亮本身不會發光","接著說月光是反射的太陽光","太陽比月亮大，文中沒說"],"tests":"段落重點","avoid":"「其實」「但是」後面常是重點"},{"q":"月亮看起來有圓有缺，原因是什麼？","opts":["月亮真的會變大變小","我們從地球看到被照亮的部分有多有少","雲把月亮遮住了","太陽有時候不照月亮"],"ans":"B","steps":["第二段：「看到被照亮的部分有多有少，於是看起來就有圓有缺」","第三段：月亮並不是真的變大變小","雲文中沒提到"],"tests":"找原因的證據","avoid":"「於是」前面就是原因"},{"q":"根據文章，下列哪個說法正確？","opts":["農曆十五前後常常看到滿月","月亮每天都是滿月","月亮一年才繞地球一圈","月亮有時會自己發光"],"ans":"A","steps":["第三段：「農曆每個月十五前後，常常可以看到……滿月」","第二段：大約一個月繞一圈，不是一年","第一段：月亮本身不會發光"],"tests":"白話找證據","avoid":"數字和時間要回文章對一對"},{"q":"下列哪個說法最符合文章？","opts":["月亮在每個位置看起來都一樣","只有滿月時，太陽才照到月亮","月亮總是有一半被太陽照亮","月光完全是月亮自己發出的"],"ans":"C","steps":["第二段：「月亮總是有一半被太陽照亮」","「每個位置都一樣」和「有圓有缺」相反","「只有」「完全」是絕對字，也和第一、二段相反"],"tests":"排除絕對字","avoid":"絕對字選項，常和文章相反"}]},{"label":"第五篇","title":"獨一無二的指紋","text":["每個人的手指上，都有一圈一圈的細紋，叫做指紋。指紋在寶寶還在媽媽肚子裡時就已經形成，長大以後，手指雖然變大了，紋路的樣子卻大致不會改變。","更神奇的是，世界上幾乎找不到兩個指紋一模一樣的人，就連長得非常像的同卵雙胞胎，指紋也不相同。","因為指紋很難相同，又不太會改變，所以常被用來辨認一個人。警察會在現場採集指紋，找出破案的線索；很多手機也能用指紋解鎖，只有事先設定好的手指才能打開。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"第二段主要在說什麼？","opts":["雙胞胎長得很像","指紋是一圈一圈的","指紋幾乎人人不同，連同卵雙胞胎也不一樣","手指長大會變大"],"ans":"C","steps":["第二段：「幾乎找不到兩個指紋一模一樣的人」","「就連……同卵雙胞胎，指紋也不相同」是加強","雙胞胎長得像只是用來比較"],"tests":"段落重點","avoid":"「就連」後面是加強重點的例子"},{"q":"指紋為什麼能用來辨認一個人？","opts":["指紋很難相同，又不太會改變","指紋很容易拍照","每支手機都需要指紋","指紋長大後會改變"],"ans":"A","steps":["第三段：「因為指紋很難相同，又不太會改變，所以常被用來辨認一個人」","原因就在「因為」和「所以」中間","「長大後會改變」和第一段相反"],"tests":"找原因的證據","avoid":"「因為……所以……」一起找"},{"q":"下列哪個說法最符合文章？","opts":["指紋是出生後才慢慢長出來的","長大後指紋的樣子會完全改變","全世界每個人的指紋都已經比對過","指紋在出生前就已經形成"],"ans":"D","steps":["第一段：「在媽媽肚子裡時就已經形成」","第一段：紋路「大致不會改變」，不是完全改變","文中沒說全世界都比對過"],"tests":"白話找證據","avoid":"「完全」「每個人」要特別小心"},{"q":"第三段主要在說什麼？","opts":["手機很方便","指紋的用途：用來辨認一個人","警察怎麼破案","指紋怎麼形成"],"ans":"B","steps":["第三段第一句：指紋「常被用來辨認一個人」","警察、手機都是用途的例子","指紋怎麼形成是第一段"],"tests":"段落重點","avoid":"例子是支持重點的，不是重點本身"}]}]},{"no":"第 4 組","title":"學而不思則罔＋練投籃","skill":"互文對讀：兩篇比一比","steps":["❶ 甲、乙各用一句話說出在講什麼","❷ 畫比較表：甲說什麼｜乙說什麼","❸ 先找相同，再找不同","❹ 問「兩篇都」看相同，問「只有甲」看不同"],"demo":{"q":"用一句話說出乙文在講什麼。","a":["→ 找乙文的結論：「最好的方法是：……」","→ 投完一輪想一想，再上場投","答：練習和思考要輪流做"]},"parts":[{"label":"第一篇","title":"學而不思則罔","text":["甲　子曰：「學而不思則罔，思而不學則殆。」","乙　練投籃時，如果只是一直投，不去想為什麼沒進，投一千球也只是重複錯誤的動作。可是如果只坐在場邊看影片、研究姿勢，卻從來不下場練，也永遠投不準。最好的方法是：投完一輪，想一想哪裡要調整，再上場投。"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"則：就","trans":"甲：孔子說：「只學習卻不思考，就會迷惘而沒有收穫；只思考卻不學習，就會疑惑而危險。」","qs":[{"q":"「學而不思則罔」的「罔」是什麼意思？","opts":["網子","迷惘、沒有收穫","忘記","高興"],"ans":"B","steps":["代回「只學不想，就會迷惘」→ 通","「就會網子」「就會高興」都不通","所以「罔」＝迷惘、沒有收穫"],"tests":"字義：罔","avoid":"把每個意思代回去讀"},{"q":"乙文「只是一直投，不去想為什麼沒進」，對應甲文哪一句？","opts":["思而不學則殆","溫故而知新","不亦說乎","學而不思則罔"],"ans":"D","steps":["一直投＝一直學（練）","不去想＝不思","所以對應「學而不思」"],"tests":"甲乙句子對應","avoid":"把乙的句子翻成「學」「思」"},{"q":"乙文「只坐在場邊看影片、研究姿勢，卻從來不下場練」，像甲文說的哪種情況？","opts":["學而不思","學而時習之","思而不學","溫故知新"],"ans":"C","steps":["研究姿勢＝思考","從來不下場練＝不學（不練）","所以是「思而不學」"],"tests":"甲乙句子對應","avoid":"先分清楚哪個是想、哪個是練"},{"q":"甲、乙兩篇共同的看法是什麼？","opts":["學（練）和思考要互相配合，缺一不可","投球越多越好","思考比練習重要","看影片完全沒有用"],"ans":"A","steps":["甲：只學不想不行，只想不學也不行","乙：投完想一想，再上場投","兩篇都講要配合；「完全沒用」乙沒說"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"}]},{"label":"第二篇","title":"溫故而知新","text":["甲　子曰：「溫故而知新，可以為師矣。」","乙　每場比賽後，教練都會帶我們重看上一場的錄影。有一次重看時，我突然發現：對手每次換防都慢半拍，那正是我們切入的好機會。同一段影片看過好幾次，每一次卻都能看出新的東西。後來學弟問我怎麼找到對手的弱點，我就把這個方法教給他。"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"溫：複習","trans":"甲：孔子說：「複習學過的東西，能從中得到新的體會，就可以當老師了。」","qs":[{"q":"「溫故而知新」的「故」是什麼意思？","opts":["舊的、學過的","所以","故意","事故"],"ans":"A","steps":["「故」和後面的「新」相對","代回「複習舊的，知道新的」→ 通","所以「故」＝舊的、學過的"],"tests":"一字多義：故","avoid":"找和它相對的字來幫忙"},{"q":"乙文中哪件事最符合「溫故而知新」？","opts":["每場比賽都要贏","學弟來問問題","重看舊錄影，發現對手換防慢半拍","教練很嚴格"],"ans":"C","steps":["溫故＝重看上一場的錄影","知新＝發現對手換防慢半拍","兩個部分都對得上"],"tests":"甲乙句子對應","avoid":"甲的每個部分都要在乙找到"},{"q":"乙文「我就把這個方法教給他」，對應甲文哪一句？","opts":["溫故","可以為師矣","知新","學而不思"],"ans":"B","steps":["教學弟＝當別人的老師","甲：「可以為師矣」","所以對應「可以為師」"],"tests":"甲乙句子對應","avoid":"找乙文的動作，對甲文的關鍵詞"},{"q":"關於甲、乙兩篇，下列敘述何者正確？","opts":["甲、乙都說要多看比賽錄影","乙認為舊影片看一次就夠了","甲說只要複習就能當老師，不用有新收穫","甲講道理，乙用看比賽錄影的經驗說明同一個道理"],"ans":"D","steps":["甲沒有提到錄影，只講道理","乙說同一段影片看好幾次都有新發現","甲是「溫故而知新」，兩者都要"],"tests":"找兩篇異同","avoid":"「都」要兩篇都有才算"}]},{"label":"第三篇","title":"默而識之","text":["甲　子曰：「默而識之，學而不厭，誨人不倦，何有於我哉？」","乙　我們隊上的阿哲學長是控球後衛。他練球時話不多，教練講過的戰術，他都默默記在筆記本上，練了三年從不喊累。學弟們有不懂的跑位，他一遍又一遍地講，講到大家都會為止，從來沒有不耐煩。"],"cite":"甲：《論語．述而》　乙：練習用自編短文","notes":"默：不出聲　厭：滿足　何有於我哉：這些我做到了哪一樣呢","trans":"甲：孔子說：「默默地把學到的記在心裡，努力學習而不滿足，教導別人而不疲倦，這些我做到了哪一樣呢？」","qs":[{"q":"「默而識之」的「識」是什麼意思？","opts":["認識","知識","見識","記住"],"ans":"D","steps":["前面「默」＝不出聲","代回「默默地記住它」→ 通","「默默地知識它」讀不通"],"tests":"一字多義：識","avoid":"名詞讀不通，就當動作讀"},{"q":"「誨人不倦」的「誨」是什麼意思？","opts":["後悔","教導","責罵","幫助"],"ans":"B","steps":["成語「誨人不倦」：教導別人不疲倦","代回「教導別人不覺得累」→ 通","「後悔別人」讀不通"],"tests":"字義：誨","avoid":"用學過的成語反推字義"},{"q":"乙文「學弟們有不懂的跑位，他一遍又一遍地講」，對應甲文哪一句？","opts":["誨人不倦","默而識之","學而不厭","何有於我哉"],"ans":"A","steps":["一遍又一遍地講＝教導別人","從來沒有不耐煩＝不倦","所以對應「誨人不倦」"],"tests":"甲乙句子對應","avoid":"找「教別人」的那一句"},{"q":"乙文「教練講過的戰術，他都默默記在筆記本上」，對應甲文哪一句？","opts":["誨人不倦","學而時習之","默而識之","有朋自遠方來"],"ans":"C","steps":["默默＝默","記在筆記本上＝識（記住）","所以對應「默而識之」"],"tests":"甲乙句子對應","avoid":"抓住相同的關鍵字「默」"}]},{"label":"第四篇","title":"逝者如斯夫","text":["甲　子在川上曰：「逝者如斯夫！不舍晝夜。」","乙　暑假剛開始時，我覺得兩個月好長，每天睡到中午、打電動。沒想到一眨眼就開學了，計畫要練的運球、要讀的三本書，一樣都沒完成。看著月曆，我才發現時間就像投出去的球，出手了就收不回來。"],"cite":"甲：《論語．子罕》　乙：練習用自編短文","notes":"川：河流　逝者：消逝的時光　夫：句尾語氣詞，表示感嘆","trans":"甲：孔子站在河邊說：「消逝的時光就像這河水一樣啊！日夜不停地流去。」","qs":[{"q":"「逝者如斯夫」的「斯」是什麼意思？","opts":["斯文","他","這、這河水","死亡"],"ans":"C","steps":["孔子站在河邊（川上）說話","代回「消逝的時光就像這河水」→ 通","所以「斯」＝這"],"tests":"字義：斯","avoid":"看說話的地方，找「這」指什麼"},{"q":"「不舍晝夜」的「舍」是什麼意思？","opts":["停止","房舍","宿舍","捨得"],"ans":"A","steps":["代回「日夜不停止」→ 通","「不房舍晝夜」讀不通","第 1 週「太丘舍去」的舍是丟下，這裡是停止"],"tests":"一字多義：舍","avoid":"同一個字，換句子就要重新代回"},{"q":"甲、乙兩篇共同的看法是什麼？","opts":["暑假太長了","河水流得很急","打電動不好","時間不停流逝，一去不回，要珍惜"],"ans":"D","steps":["甲：時光像河水，日夜不停流走","乙：時間像投出去的球，收不回來","兩篇都在說時間一去不回"],"tests":"找兩篇相同點","avoid":"先各寫一句話，再比相同"},{"q":"甲、乙兩篇分別用什麼來比喻時間？","opts":["乙：月曆；甲：河岸","乙：投出去的球；甲：流動的河水","乙：運球；甲：晝夜","乙：暑假；甲：川上"],"ans":"B","steps":["甲：「逝者如斯」，斯＝這河水","乙：「時間就像投出去的球」","「就像」後面就是比喻"],"tests":"找兩篇的比喻","avoid":"比喻找「如」「像」後面"}]},{"label":"第五篇","title":"君子坦蕩蕩","text":["甲　子曰：「君子坦蕩蕩，小人長戚戚。」","乙　上週比賽，阿凱不小心踩線，裁判判他出界。他大方地舉手承認，下一球繼續拚。另一隊有個球員偷偷拉人衣服，雖然沒被裁判看見，整場卻一直東張西望，怕被抓到，表現也越打越差。"],"cite":"甲：《論語．述而》　乙：練習用自編短文","notes":"坦蕩蕩：心胸寬廣、坦然　戚戚：憂愁不安","trans":"甲：孔子說：「品德好的人心胸寬廣、坦然自在；品德不好的人常常憂愁不安。」","qs":[{"q":"「小人長戚戚」的「小人」是什麼意思？","opts":["小孩子","品德不好的人","身材矮小的人","年紀小的弟弟"],"ans":"B","steps":["「小人」和前面的「君子」相對","君子是品德好的人","所以小人＝品德不好的人，不是小孩"],"tests":"古今異義：小人","avoid":"找相對的詞來推意思"},{"q":"「小人長戚戚」的「長」是什麼意思？","opts":["長大","很長","首領","常常、總是"],"ans":"D","steps":["代回「小人常常憂愁不安」→ 通","「小人長大憂愁」意思不對","所以「長」＝常常"],"tests":"一字多義：長","avoid":"多種意思時，一個一個代回"},{"q":"乙文中，哪一個人最像甲文說的「小人」？","opts":["阿凱","裁判","偷拉衣服、一直怕被抓到的球員","教練"],"ans":"C","steps":["甲：小人常常憂愁不安（戚戚）","乙：偷拉衣服的球員「一直東張西望，怕被抓到」","阿凱大方承認，比較像君子"],"tests":"甲乙人物對應","avoid":"看誰的心情是「不安」"},{"q":"甲、乙兩篇共同想說明什麼？","opts":["光明正大就坦然，做虧心事就常常不安","比賽一定要贏","裁判常常看不見犯規","承認錯誤就會輸球"],"ans":"A","steps":["甲：君子坦蕩、小人戚戚","乙：阿凱坦然繼續拚，犯規的人一直怕被抓","兩篇都在比較坦然和不安"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"}]}]},{"no":"第 5 組","title":"一週每日課外閱讀時間","skill":"圖表五步驟＋圖文對讀","chart":true,"steps":["❶ 標題：這張圖在講什麼","❷ 單位：人、分、分鐘、本、下","❸ 趨勢：哪裡多、哪裡少","❹ 最大值、最小值，需要時算總和","❺ 文字說法逐句回圖找數字，找不到就是「沒有證據」"],"demo":{"q":"第一張表裡，週一的 15 分鐘要畫幾格■？","a":["→ 看說明：每格■代表 5 分鐘","→ 15÷5＝3","答：3 格"]},"parts":[{"label":"第一篇","title":"某同學一週每日課外閱讀時間","text":["小凱在日記裡寫：「這週我每天都有讀課外書，週四讀最久，因為那天沒有籃球練習。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","閱讀時間（分鐘）"],"per":5,"unit":"分鐘","data":[["週一",15],["週二",20],["週三",10],["週四",25],["週五",20]],"qs":[{"q":"哪一天的閱讀時間最多？","opts":["週四","週二","週五","週一"],"ans":"A","steps":["五天：15、20、10、25、20","最大是 25","對應週四"],"tests":"找最大值","avoid":"先把每天的數字寫出來再比"},{"q":"五天總共讀了多少分鐘？","opts":["80 分鐘","85 分鐘","90 分鐘","100 分鐘"],"ans":"C","steps":["15＋20＋10＋25＋20","＝90","檢查：35＋35＋20＝90"],"tests":"圖表加總","avoid":"加完再用另一種順序檢查"},{"q":"根據圖表，哪個說法有證據？","opts":["小凱每天都讀超過 15 分鐘","週末讀得最久","週二和週五讀的時間一樣","讀越久成績越好"],"ans":"C","steps":["週二 20、週五 20，一樣 → 有證據","週三只有 10 分鐘，不是每天超過 15","圖裡沒有週末和成績的資料"],"tests":"圖表推論範圍","avoid":"圖上沒有的資料，再合理也不能選"},{"q":"日記說「週四讀最久，因為那天沒有籃球練習」，圖表能證明什麼？","opts":["兩件事都能從圖表證明","週四最久可以證明；「沒有練球」這個原因看不出來","兩件事都不能證明","只有原因能證明"],"ans":"B","steps":["圖表：週四 25 分鐘最多 → 能證明","圖表只有時間，沒有練球的資料","所以原因無法從圖表證明"],"tests":"圖文對讀","avoid":"文字裡的「因為」要另外找證據"}]},{"label":"第二篇","title":"校隊五場比賽全隊得分","text":["校刊報導：「校隊這學期越打越好，五場比賽的得分一場比一場高。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["場次","全隊得分（分）"],"per":5,"unit":"分","data":[["第一場",40],["第二場",35],["第三場",50],["第四場",45],["第五場",55]],"qs":[{"q":"得分最少的是哪一場？","opts":["第一場","第三場","第四場","第二場"],"ans":"D","steps":["五場：40、35、50、45、55","最小是 35","對應第二場"],"tests":"找最小值","avoid":"先把每場的數字寫出來再比"},{"q":"第五場比第一場多得幾分？","opts":["5 分","10 分","15 分","20 分"],"ans":"C","steps":["第五場 55 分，第一場 40 分","55－40＝15","檢查：40＋15＝55"],"tests":"圖表相減","avoid":"相減後用加法檢查一次"},{"q":"報導說「一場比一場高」，和圖表相符嗎？","opts":["相符，每一場都比前一場高","不相符，第五場是最低的","圖表沒有得分資料，無法判斷","不相符，第二場、第四場都比前一場低"],"ans":"D","steps":["第二場 35 比第一場 40 低","第四場 45 比第三場 50 低","所以不是一場比一場高；第五場 55 反而最高"],"tests":"圖文對讀","avoid":"「一場比一場」要每一場都檢查"},{"q":"五場比賽平均每場得幾分？","opts":["40 分","45 分","50 分","55 分"],"ans":"B","steps":["總分：40＋35＋50＋45＋55＝225","225÷5＝45","檢查：45×5＝225"],"tests":"圖表平均","avoid":"平均＝總和÷場數"}]},{"label":"第三篇","title":"全班最喜歡的狗狗投票","text":["班長在聯絡簿寫：「全班 28 人都投了票，柴犬的票數超過全班的一半。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["狗狗品種","票數（人）"],"per":1,"unit":"人","data":[["柴犬",9],["黃金獵犬",7],["柯基",5],["貴賓犬",4],["哈士奇",3]],"qs":[{"q":"票數最少的是哪一種狗？","opts":["柯基","哈士奇","貴賓犬","黃金獵犬"],"ans":"B","steps":["五種：9、7、5、4、3","最小是 3","對應哈士奇"],"tests":"找最小值","avoid":"先把每一種的數字寫出來"},{"q":"柴犬比黃金獵犬多幾票？","opts":["1 票","2 票","3 票","4 票"],"ans":"B","steps":["柴犬 9 票，黃金獵犬 7 票","9－7＝2","檢查：7＋2＝9"],"tests":"圖表相減","avoid":"相減後用加法檢查一次"},{"q":"班長說「柴犬的票數超過全班的一半」，對嗎？","opts":["不對：全班一半是 14 票，柴犬只有 9 票","對，因為柴犬票數最多","不對，柴犬票數最少","圖表看不出柴犬的票數"],"ans":"A","steps":["全班：9＋7＋5＋4＋3＝28，一半是 14","柴犬 9 票，比 14 少","「最多」不等於「超過一半」"],"tests":"圖文對讀","avoid":"「超過一半」要先算出一半是多少"},{"q":"根據圖表，哪個說法有證據？","opts":["全班都喜歡柴犬","柴犬是最好養的狗","投柯基和貴賓犬的人加起來，和柴犬一樣多","喜歡哈士奇的人明年會變多"],"ans":"C","steps":["柯基 5＋貴賓犬 4＝9","柴犬也是 9 → 有證據","「全班都」是絕對字；好不好養、明年都不在圖裡"],"tests":"圖表推論範圍","avoid":"每個選項都要回圖算一算"}]},{"label":"第四篇","title":"小安一週每日一分鐘跳繩次數","text":["小安說：「我的跳繩次數每天都在進步。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","一分鐘跳繩（下）"],"per":10,"unit":"下","data":[["週一",60],["週二",80],["週三",80],["週四",100],["週五",120]],"qs":[{"q":"小安哪一天跳得最多？","opts":["週二","週三","週五","週四"],"ans":"C","steps":["五天：60、80、80、100、120","最大是 120","對應週五"],"tests":"找最大值","avoid":"先把每天的數字寫出來"},{"q":"週五比週一多跳幾下？","opts":["40 下","60 下","80 下","120 下"],"ans":"B","steps":["週五 120 下，週一 60 下","120－60＝60","檢查：60＋60＝120"],"tests":"圖表相減","avoid":"相減後用加法檢查一次"},{"q":"小安說「每天都在進步」，圖表支持嗎？","opts":["不完全支持：週三和週二一樣都是 80 下","支持，每天都比前一天多","不支持，次數越來越少","圖表沒有次數，看不出來"],"ans":"A","steps":["週二 80、週三 80，沒有變多","其他天都比前一天多","所以「每天」進步不成立"],"tests":"圖文對讀","avoid":"看到「每天」，要一天一天檢查"},{"q":"這五天的整體趨勢是什麼？","opts":["越來越少","每天都一樣","先多後少","大致越來越多"],"ans":"D","steps":["從 60 開始，最後到 120","中間只有一天持平，沒有變少","整體是越來越多"],"tests":"看趨勢","avoid":"看頭尾，再看中間有沒有下降"}]},{"label":"第五篇","title":"班級圖書角一個月借閱本數","text":["圖書股長的報告：「這個月共借出 50 本書，科普書是借出第二多的種類。借出最少的是歷史書，下個月我們要多買一些歷史書。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["書的種類","借閱數量（本）"],"per":2,"unit":"本","data":[["漫畫",16],["科普",12],["小說",10],["運動",8],["歷史",4]],"qs":[{"q":"這張表的數字單位是什麼？","opts":["人","本","次","元"],"ans":"B","steps":["看表頭：「借閱數量（本）」","單位寫在括號裡","所以是本"],"tests":"看單位","avoid":"單位常藏在表頭的括號裡"},{"q":"漫畫的借閱本數是歷史的幾倍？","opts":["2 倍","4 倍","3 倍","12 倍"],"ans":"B","steps":["漫畫 16 本，歷史 4 本","16÷4＝4","檢查：4×4＝16"],"tests":"圖表倍數","avoid":"倍數用除法，再用乘法檢查"},{"q":"報告中哪一句「無法」從圖表證明？","opts":["這個月共借出 50 本書","科普書是借出第二多的種類","借出最少的是歷史書","下個月要多買一些歷史書"],"ans":"D","steps":["16＋12＋10＋8＋4＝50，能證明","科普 12 第二多、歷史 4 最少，能證明","下個月要買書是計畫，圖表沒有這個資料"],"tests":"圖文對讀","avoid":"計畫和想法，圖表證明不了"},{"q":"漫畫和科普加起來，比其他三種加起來多幾本？","opts":["2 本","4 本","6 本","8 本"],"ans":"C","steps":["漫畫＋科普：16＋12＝28","其他三種：10＋8＋4＝22","28－22＝6"],"tests":"圖表計算","avoid":"分兩堆加，再相減"}]}]},{"no":"週末關卡","title":"齊人攫金","skill":"小六上總複習（全部招式）","steps":["❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標","❹ 一字多義、古今異義：代回去試　❺ 推論和寓言三問找道理","完成後錄一支 60 秒「古文翻譯官」短片"],"demo":{"q":"「人皆在焉」的「焉」是什麼意思？","a":["→ 「焉」在句尾，常常等於「在那裡」","→ 代回：人都在那裡 → 通","答：在那裡"]},"parts":[{"label":"第一篇","title":"齊人攫金","text":["昔齊人有欲金者，清旦衣冠而之市，適鬻金者之所，因攫其金而去。吏捕得之，問曰：「人皆在焉，子攫人之金何？」對曰：「取金之時，不見人，徒見金。」"],"cite":"《列子．說符》","notes":"清旦：清晨　適：到　所：地方　因：於是、趁機　攫：搶　吏：官員　子：你","trans":"從前齊國有個想要金子的人，清晨穿好衣服、戴好帽子，到市場去，走到賣金子的人那裡，就搶了他的金子離開。官吏抓到他，問他說：「人都在那裡，你為什麼搶別人的金子？」他回答說：「拿金子的時候，我沒看見人，只看見金子。」","qs":[{"q":"「衣冠而之市」的「之」是什麼意思？","opts":["的","他","往、到","這"],"ans":"C","steps":["「之」後面接地方「市」","代回「到市場去」→ 通","「之」在地方前面，常是往"],"tests":"一字多義：之","avoid":"「之＋地方」就讀成「往」"},{"q":"「衣冠而之市」的「衣冠」在這裡是什麼意思？","opts":["穿好衣服、戴好帽子","衣服和帽子","賣衣服的店","有禮貌的人"],"ans":"A","steps":["「衣冠『而』之市」，而連接兩個動作","後面「之市」是動作，前面也要是動作","所以衣冠＝穿衣戴帽（名詞當動詞）"],"tests":"詞性：名詞當動詞","avoid":"「而」兩邊常常都是動作"},{"q":"「因攫其金而去」的「去」是什麼意思？","opts":["離開","前往","除去","過去"],"ans":"A","steps":["搶了金子之後的動作","代回「搶了金子就離開」→ 通","和「太丘舍去」的去一樣＝離開"],"tests":"古今異義：去","avoid":"文言的「去」先想「離開」"},{"q":"這個故事想告訴我們什麼？","opts":["齊國的市場很熱鬧","官吏辦案很快","太貪心的人，眼裡只看見想要的東西，看不見其他","金子很容易被偷"],"ans":"C","steps":["表面：大白天在市場搶金子","他說：「不見人，徒見金」","道理：被貪心蒙住眼睛，看不見後果"],"tests":"寓言主旨","avoid":"抓住人物最後說的那句話"}]},{"label":"第二篇","title":"庖丁解牛","text":["庖丁為文惠君解牛，手之所觸，肩之所倚，足之所履，膝之所踦，砉然嚮然，奏刀騞然，莫不中音。合於桑林之舞，乃中經首之會。"],"cite":"《莊子．養生主》（節選開頭）","notes":"庖丁：名叫丁的廚師　文惠君：梁惠王　倚：靠　履：踩　踦：抵住　砉然、嚮然：皮骨分離的聲音　奏刀：進刀　騞然：進刀的聲音　桑林：古代樂舞名　經首：古代樂曲名　會：節奏","trans":"名叫丁的廚師替文惠君宰牛，手接觸的地方、肩膀靠著的地方、腳踩著的地方、膝蓋抵住的地方，都發出皮骨分離的聲音，進刀時嘩嘩作響，沒有一個聲音不合乎音律。既合於〈桑林〉舞樂的節拍，又合於〈經首〉樂曲的節奏。","qs":[{"q":"「庖丁為文惠君解牛」的「為」是什麼意思？","opts":["成為","替","因為","是"]
