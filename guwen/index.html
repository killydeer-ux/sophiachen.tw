<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古文偵探">
</head>
<body>
<title>古文偵探任務</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@500;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* 版面：球場戰術板。頂部記分板，下面是一張張任務卡；作答區像戰術手冊，文言原文用襯線字。 */
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --ink:#13233A; --muted:#5A6B80; --line:#C9D3DE;
  --court:#2C6A9A; --ball:#E0702A; --ballSoft:#FCE9DC; --paper:#FFF9EF; --sea:#BFE3F2; --sea2:#8CC8E6; --seaHi:rgba(255,255,255,.55); --seaLine:#FFFFFF; --seaInk:#0B4A6F; --foam:rgba(255,255,255,.75); --sand:#F1D9A6; --grass:#4FA35F; --rock:#7C8EA3; --boss:#B23A3A; --okBg:#ECFDF5; --okInk:#065F46; --okLine:#6EE7B7; --noteBg:#FFF1D6; --noteInk:#9A3412; --track:rgba(19,35,58,.12); --accent2:#C2410C;
  --ok:#1E7A46; --okSoft:#E2F3E8; --bad:#B23A3A; --badSoft:#F9E3E3;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-text:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"Chakra Petch","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1724; --panel:#182334; --ink:#E6EDF5; --muted:#9AAABD; --line:#2D3B50;
  --court:#6FA8D6; --ball:#F08A48; --ballSoft:#3A2618; --paper:#1F2A3B; --sea:#0E3550; --sea2:#0A2438; --seaHi:rgba(111,168,214,.18); --seaLine:#6FA8D6; --seaInk:#BFE3F2; --foam:rgba(191,227,242,.25); --sand:#C9AE77; --grass:#3C8A4C; --rock:#5B6C80; --boss:#C14848; --okBg:#0F2E25; --okInk:#A7F3D0; --okLine:#2F7A5F; --noteBg:#3A2A12; --noteInk:#FCD9A8; --track:rgba(230,237,245,.18); --accent2:#FDBA74;
  --ok:#5CC98A; --okSoft:#163325; --bad:#F07C7C; --badSoft:#3A1C1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1724; --panel:#182334; --ink:#E6EDF5; --muted:#9AAABD; --line:#2D3B50;
  --court:#6FA8D6; --ball:#F08A48; --ballSoft:#3A2618; --paper:#1F2A3B; --sea:#0E3550; --sea2:#0A2438; --seaHi:rgba(111,168,214,.18); --seaLine:#6FA8D6; --seaInk:#BFE3F2; --foam:rgba(191,227,242,.25); --sand:#C9AE77; --grass:#3C8A4C; --rock:#5B6C80; --boss:#C14848; --okBg:#0F2E25; --okInk:#A7F3D0; --okLine:#2F7A5F; --noteBg:#3A2A12; --noteInk:#FCD9A8; --track:rgba(230,237,245,.18); --accent2:#FDBA74;
  --ok:#5CC98A; --okSoft:#163325; --bad:#F07C7C; --badSoft:#3A1C1F; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.board{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.board h1{font-family:var(--f-display);font-weight:900;font-size:1.35rem;margin:0;letter-spacing:.04em}
.board .who{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.9rem}.board .who > *{white-space:nowrap}
.board .who button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font-size:.85rem}
.score{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 14px;white-space:nowrap;font-weight:700}
.tab[aria-selected="true"]{border-color:var(--court);color:var(--court)}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.goal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.goal .chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-family:var(--f-num);font-weight:700}
.goal .chip[aria-pressed="true"]{border-color:var(--ball);background:var(--ballSoft);color:var(--ball)}


/* 偵探裝備（科技風） */
.gear{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#0B1220,#111B2E);border:1px solid #1E3A5F;color:#E5F2FF}
.gear h3{color:#67E8F9;letter-spacing:.06em}.gear .muted{color:#94A3B8}
.gear-fig{width:130px;height:130px;flex:0 0 auto;border-radius:16px;background:radial-gradient(circle at 50% 40%,#13243D,#070C16);border:1px solid #22D3EE55;box-shadow:inset 0 0 24px #22D3EE22}
.gear-fig .avatar{width:100%;height:100%}
.gear-list{flex:1 1 220px;min-width:0}.gear-list h3{margin:0 0 2px}
.gear-list ul{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 10px}
.gear-list li{display:flex;align-items:center;gap:6px;font-size:.86rem;flex-wrap:wrap}
.gear-list li.off{opacity:.55}
.gear-list .dot{width:10px;height:10px;transform:rotate(45deg);flex:0 0 auto}
.gear-list .rar{font-size:.72rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 4px}
/* 任務星圖（科技風，深淺模式都固定深色面板） */
.sea{position:relative;border-radius:16px;overflow:hidden;border:1px solid #1E3A5F;background:
  linear-gradient(#22D3EE10 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#22D3EE10 1px,transparent 1px) 0 0/24px 24px,
  radial-gradient(circle at 80% 10%,#1D4ED855,transparent 45%),radial-gradient(circle at 10% 90%,#7C3AED40,transparent 45%),#070C16}
.sea-title{position:absolute;left:14px;top:10px;font-weight:900;font-size:.9rem;color:#67E8F9;letter-spacing:.08em}
.route{position:absolute;inset:0;width:100%;height:100%}
.route polyline{fill:none;stroke:#22D3EE;stroke-opacity:.55;stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.isle{position:absolute;transform:translate(-50%,-30px);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:156px;color:#E5F2FF}
.isle .land{position:relative;width:60px;height:60px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:linear-gradient(160deg,#1E3A5F,#0B1220);display:grid;place-items:center}
.isle .land::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:#0B1220}
.isle .num{position:relative;font-family:var(--f-num);font-weight:700;font-size:1.15rem;color:#67E8F9;text-shadow:0 0 8px #22D3EE}
.isle .chk{position:absolute;right:6px;bottom:4px;font-size:.8rem;font-weight:900;color:#4ADE80;text-shadow:0 0 6px #22C55E}
.isle .lk{position:absolute;right:6px;bottom:4px;font-size:.62rem;font-weight:900;color:#94A3B8}
.isle .lab{background:#0B1220E6;border:1px solid #1E3A5F;border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.3;max-width:156px;min-width:120px}
.isle .lab b{font-size:.85rem;color:#E5F2FF;letter-spacing:.04em}.isle .lab span{font-size:.72rem;color:#94A3B8;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isle .lab em{font-style:normal;font-size:.72rem;font-weight:700;color:#67E8F9}
.isle .bar{display:block;width:100%;height:4px;background:#1E293B;border-radius:2px;margin-top:3px;overflow:hidden}.isle .bar i{display:block;height:100%;background:linear-gradient(90deg,#22D3EE,#4ADE80)}
.isle.done .land{background:linear-gradient(160deg,#22C55E,#065F46)}.isle.done .num{color:#BBF7D0;text-shadow:0 0 8px #22C55E}.isle.done .lab em{color:#4ADE80}
.isle.locked .land{filter:grayscale(1);opacity:.45}.isle.locked .lab{opacity:.6}.isle.locked .lab em{color:#94A3B8}
.isle.cur .land{background:linear-gradient(160deg,#F59E0B,#B45309);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 10px #F59E0B)}}
.isle.cap .land{background:linear-gradient(160deg,#A855F7,#4C1D95)}
.isle.quiz .land{width:72px;height:72px;background:linear-gradient(160deg,#EF4444,#7F1D1D)}.isle.quiz .num{color:#FECACA;text-shadow:0 0 8px #EF4444}
.isle .boat{position:absolute;left:calc(50% + 34px);top:2px;width:46px;height:46px}
.isle .boat svg{width:100%;height:100%}
.isle .here{position:absolute;left:calc(50% - 30px);top:-18px;font-size:.66rem;font-weight:900;color:#0B1220;background:#F59E0B;border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion: reduce){.route polyline,.isle.cur .land{animation:none}}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mission{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mission:hover{border-color:var(--court)}
.mission .no{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.mission .t{font-weight:700}
.mission .s{font-size:.85rem;color:var(--muted)}
.mission .st{margin-top:6px;font-size:.85rem;font-weight:700}
.mission.done{border-color:var(--ok)} .mission.done .st{color:var(--ok)}
.mission.quiz{border:2px solid var(--ball)}
.st .shiba{width:1.6em;height:1.6em;margin-right:4px}
.stamp{display:inline-block;width:1.3em;height:1.3em;border-radius:50%;background:var(--ball);color:#fff;font-size:.75rem;line-height:1.3em;text-align:center;margin-right:4px}
h2{font-family:var(--f-display);font-size:1.25rem;margin:0 0 6px;text-wrap:balance}
h3{font-size:1.02rem;margin:0 0 6px;color:var(--court)}
.back{align-self:flex-start;background:transparent;border:none;color:var(--court);font-weight:700;padding:0}
details.teach{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.teach summary{font-weight:700;cursor:pointer}
.teach .item{margin:10px 0}
.teach .item b{color:var(--court)}
.teach .ex{color:var(--ball);font-size:.92rem}
.card{border-left:4px solid var(--court);padding:6px 12px;background:var(--panel)}
.passage{display:flex;flex-direction:column;gap:10px}
.text{font-family:var(--f-text);font-size:1.12rem;line-height:1.9;background:var(--paper);border-radius:10px;padding:12px 14px}
.cite{font-size:.8rem;color:var(--muted);text-align:right}
.notes{font-size:.88rem;color:var(--muted)}
.nt{display:inline;vertical-align:baseline;font:inherit;color:var(--noteInk);background:var(--noteBg);border:0;border-bottom:2px dotted #d97706;border-radius:3px;padding:0 1px;margin:0;cursor:pointer;line-height:inherit}
.ntip{position:absolute;z-index:80;max-width:220px;background:#1f2937;color:#fff;font-size:.9rem;padding:6px 10px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.notes .nk{color:var(--noteInk);font-weight:700}

.chart{overflow-x:auto}
.chart table{border-collapse:collapse;width:100%;font-size:.92rem}
.chart td,.chart th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:12px;background:var(--court);border-radius:3px;vertical-align:middle}
.q{border-top:1px dashed var(--line);padding-top:10px}
.q .qt{font-weight:700;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--court);background:color-mix(in srgb,var(--court) 12%,var(--panel))}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default}
.why{margin-top:8px;background:var(--badSoft);border-radius:10px;padding:8px 12px;font-size:.92rem}
.why.okc{background:var(--okSoft)}
.why ol{margin:4px 0;padding-left:1.3em}
input.fill{font:inherit;width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel)}
input.fill.right{border-color:var(--ok)} input.fill.wrong{border-color:var(--bad)}
.actions{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:10px 20px;font-weight:900;background:var(--ball);color:#fff;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.btn.alt{background:var(--court)}
.result{border:2px solid var(--ball);background:var(--ballSoft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--f-num);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.memo{background:var(--badSoft);border-radius:12px;padding:10px 14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.players{display:flex;flex-wrap:wrap;gap:8px}
.players button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
.shiba{display:inline-block;vertical-align:middle;line-height:0}.shiba svg{width:100%;height:100%}
.stamps{display:flex;gap:4px;margin-top:6px}.stamps .shiba{width:30px;height:30px}.stamps{width:100%}.stamps .off{opacity:.3;filter:grayscale(1) brightness(1.6)}
.bigstamp{width:120px;height:120px;margin:6px auto 0}
@media (prefers-reduced-motion:no-preference){.bigstamp{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}}
@keyframes stampin{0%{transform:scale(2.2) rotate(-18deg);opacity:0}60%{transform:scale(.92) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.fx{position:fixed;pointer-events:none;z-index:99;left:0;top:0}
.fx-ring{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid rgba(214,69,47,.55);animation:fxring .6s ease-out forwards}
.fx-petal{width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:9px 0 9px 0;background:#f4a7b0;animation:fxpetal .9s ease-out forwards}
@keyframes fxring{to{transform:scale(4);opacity:0}}
@keyframes fxpetal{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
.replay{position:fixed;inset:0;z-index:90;background:rgba(14,22,38,.97);backdrop-filter:blur(4px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;cursor:pointer}
.replay .rp-title{font-size:.95rem;opacity:.8;letter-spacing:.1em}
.replay .rp-combo{font-family:var(--f-display);font-weight:900;font-size:2.6rem;min-height:3.2rem;color:#ffb347;text-shadow:0 2px 0 #c2410c}
.replay .rp-score{font-size:1.1rem}
.replay .rp-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
.replay .rp-dots i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:block}
.replay .rp-dots i.in{background:#e8913a;border-color:#ffd08a;box-shadow:0 0 10px #ffb347}
.replay .rp-dots i.out{background:#475569;border-color:#64748b}
.replay .rp-skip{font-size:.8rem;opacity:.6}
@media (prefers-reduced-motion:no-preference){.replay .rp-combo.bump{animation:bump .25s ease-out}.replay .rp-dots i.in{animation:bump .25s ease-out}}
@keyframes bump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.mini{display:inline-flex;gap:2px;vertical-align:middle}.mini i{width:9px;height:9px;border-radius:50%;background:var(--track);display:block}.mini i.on{background:#e8913a}
.paidtag{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.85rem}.paidtag.on{background:var(--okBg);border-color:var(--okLine);color:var(--okInk);font-weight:700}
.claim{background:var(--okBg);color:var(--okInk);border:1px solid var(--okLine);border-radius:12px;padding:10px 14px;margin:0 0 10px}.claim b{font-size:1.5rem;color:var(--okInk)}.claim .small{color:var(--okInk);opacity:.9}
.wall .wsum{font-size:1.05rem;margin:2px 0 10px}.wall .wsum b{font-size:1.5rem;color:var(--accent2)}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.wlab{width:4.2em;font-weight:700}.wicons{display:flex;gap:4px;flex-wrap:wrap}
.ws{width:40px;height:40px;padding:0;border:0;background:none;cursor:pointer;line-height:0}.ws svg{width:100%;height:100%}.ws.off{opacity:.22;filter:grayscale(1);cursor:default}
@media (prefers-reduced-motion:no-preference){.ws:not(.off):hover{transform:scale(1.12) rotate(-6deg)}}
.medal{display:inline-flex;flex-direction:column;align-items:center;font-size:.7rem;line-height:1.1}.medal svg{width:34px;height:40px}
.money th,.money td{white-space:nowrap;padding:6px 8px}
.prog{background:var(--paper,#fff7ee);border-radius:12px;padding:12px 14px;margin:6px 0 10px}.prog-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.prog-head b{font-size:1.6rem;color:var(--accent2)}
.prog-bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;margin:8px 0 6px}.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#e8913a);border-radius:999px}
.subjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.subj{min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.subj b{color:var(--court)}
.rep-in{font:inherit;width:100%;box-sizing:border-box;min-width:0;border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel);color:var(--ink)}
.why-chips{display:flex;flex-wrap:wrap;gap:4px}.why-chips .chip{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:.8rem;padding:2px 8px}
.focus .chip{min-width:2.4em}
.daybar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.schoolbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--court)}
.setcard{border-left:4px solid var(--ball)}
.pts{background:var(--paper);border-radius:10px;padding:10px 14px;margin:6px 0}
.pts li{margin:2px 0}
.rep-view{font-size:.9rem;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.rep-view table{border-collapse:collapse;width:100%}.rep-view td,.rep-view th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.upl{display:flex;flex-direction:column;gap:8px}.upl .row select{flex:1;min-width:0}
.upl label.pick{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.upl input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.uplog{font-size:.88rem}.uplog div{padding:2px 0}
.pick.off{opacity:.45}
.tab.off{opacity:.5}
.mute{background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font:inherit;color:inherit;cursor:pointer}
</style>

<script>
const DATA = [{"week":1,"groups":[{"no":"第 1 組","title":"守株待兔","skill":"先看題幹＋圈人物補主詞","steps":["❶ 先讀題目：這次要找什麼？（字義？人物？原因？）","❷ 讀原文時，每一句旁邊寫上「誰」","❸ 文言常把主詞省掉：往前一句，找最近出現的人或動物"],"demo":{"q":"「折頸而死」是誰折斷脖子？","a":["題目問「誰」→ 要找主詞","這句沒有主詞，往前一句：「兔走觸株」","答：兔子"]},"parts":[{"label":"第一篇","title":"守株待兔","text":["宋人有耕者，田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔。兔不可復得，而身為宋國笑。"],"cite":"《韓非子．五蠹》","notes":"株：樹樁　走：跑　釋：放下　耒：翻土的農具　冀：希望　身：自己","trans":"宋國有個種田的人，田裡有一截樹樁。一隻兔子跑過來撞到樹樁，折斷脖子死了。他就放下農具守在樹樁旁，希望再撿到兔子。兔子當然不可能再得到，他自己反而被宋國人笑話。","qs":[{"q":"「因釋其耒而守株」是誰放下農具？","opts":["兔子","耕田的宋國人","宋國所有的人","作者韓非"],"ans":"B","steps":["題目問「誰」放下農具 → 找主詞","往前找：第一句「宋人有耕者」，整段講的都是這個耕田的人","兔子已經死了，不可能放下農具"],"tests":"補出被省略的主詞","avoid":"每句旁邊先寫「誰」，往前找最近出現的人"},{"q":"「兔不可復得」是什麼意思？","opts":["兔子再也不可能被他得到","兔子不可以再吃","兔子不能再跑","他不想再抓兔子"],"ans":"A","steps":["「復」：前一句「冀復得兔」也出現，意思是「再」","「得」＝得到","連起來：兔子不可能再得到"],"tests":"用上下文推字義","avoid":"同一個字在文中出現兩次，兩處一起看"},{"q":"「而身為宋國笑」，被笑的是誰？為什麼？","opts":["兔子，因為撞到樹","宋國人，因為田種得好","耕田的人，因為放下工作只等兔子","韓非，因為故事太好笑"],"ans":"C","steps":["注釋：「身」＝自己，指耕田的人","被笑的原因往前找：「釋其耒而守株」放下工作守樹樁","選項 C 兩部分都有證據"],"tests":"人物＋作者態度","avoid":"問「為什麼」就回文中找行為，不用自己猜的"},{"q":"這個故事想提醒我們什麼？","opts":["種田要選好地方","兔子跑太快很危險","樹樁要趕快挖掉","不努力、只想等好運再來，不會有收穫"],"ans":"D","steps":["找結局句：「兔不可復得，而身為宋國笑」","他放下農具只等兔子，兔子沒再來，還被嘲笑","A、B、C 文中都沒講到 → D"],"tests":"抓寓言主旨","avoid":"寓言看結局：主角的下場就是作者的提醒"}]},{"label":"第二篇","title":"司馬光擊甕","text":["光生七歲，凜然如成人，聞講《左氏春秋》，愛之，退為家人講，即了其大指。……群兒戲於庭，一兒登甕，足跌沒水中，眾皆棄去，光持石擊甕破之，水迸，兒得活。"],"cite":"《宋史．司馬光傳》（節選）","notes":"凜然：莊重的樣子　左氏春秋：即《左傳》，一部歷史書　了：明白　大指：大意　甕：大陶缸　跌：失足滑倒　迸：噴出","trans":"司馬光七歲時，就莊重得像大人一樣。他聽人講《左氏春秋》，非常喜愛，回家後講給家人聽，就能說出書的大意。……一群小孩在庭院裡玩，一個小孩爬上大缸，失足掉進水裡，其他小孩都丟下他跑了。司馬光拿石頭砸缸，把缸打破，水噴了出來，那個小孩得救了。","qs":[{"q":"「愛之，退為家人講」是誰回家講給家人聽？","opts":["講《左氏春秋》的老師","司馬光","司馬光的家人","一群小孩"],"ans":"B","steps":["這句沒寫主詞 → 往前找最近出現的人","第一句「光生七歲……聞講《左氏春秋》」，聽講的是光","聽完喜愛、回家講給家人聽的，都是司馬光"],"tests":"補省略的主詞","avoid":"一連串動作沒換人，主詞就沿用前面的"},{"q":"「足跌沒水中」是誰掉進水裡？","opts":["司馬光","全部的小孩","爬上甕的那個小孩","在庭院看守的大人"],"ans":"C","steps":["往前一句：「一兒登甕」","爬上缸、腳滑、掉進水裡，都是同一個小孩","文中沒有大人；司馬光後來是去救人的"],"tests":"補省略的主詞","avoid":"找最近出現的人，再檢查動作接不接得上"},{"q":"「眾皆棄去」的「去」是什麼意思？","opts":["前往","去除","過去","離開"],"ans":"D","steps":["代回「大家都丟下他前往」→ 前往哪裡？不通","代回「大家都丟下他離開」→ 通","後面只剩司馬光救人，其他人確實都離開了"],"tests":"古今異義：去＝離開","avoid":"現代意思代回去怪，就換古代意思"},{"q":"這段文字主要表現司馬光的哪兩個特點？","opts":["愛讀書，遇到危險又冷靜機智","力氣很大，喜歡打破東西","愛玩，常常在庭院玩","膽小，看到危險就逃走"],"ans":"A","steps":["前半：聽講就喜愛，還能講給家人聽 → 愛讀書","後半：別人都跑了，「光持石擊甕破之」→ 冷靜機智","B 只看到砸缸的動作；D 是其他小孩"],"tests":"從行為看人物特點","avoid":"人物特點要從他做的事找，前後都要看"}]},{"label":"第三篇","title":"楊氏之子","text":["梁國楊氏子九歲，甚聰惠。孔君平詣其父，父不在，乃呼兒出。為設果，果有楊梅。孔指以示兒曰：「此是君家果。」兒應聲答曰：「未聞孔雀是夫子家禽。」"],"cite":"《世說新語．言語》","notes":"惠：同「慧」　孔君平：人名　詣：拜訪　設：擺出　應聲：隨著聲音，馬上","trans":"梁國有一戶姓楊的人家，家裡的孩子九歲，非常聰明。孔君平來拜訪孩子的父親，父親不在家，於是叫孩子出來。孩子擺出水果招待他，水果中有楊梅。孔君平指著楊梅給孩子看，說：「這是你家的果子。」孩子馬上回答：「沒聽說過孔雀是您家的鳥。」","qs":[{"q":"「父不在」的「父」是誰的父親？","opts":["孔君平的父親","梁國國君","楊家孩子的父親","孔子"],"ans":"C","steps":["往前找：「孔君平詣其父」，「其」指前面的楊氏子","孔君平是來拜訪楊家孩子的父親","所以「父不在」是孩子的父親不在家"],"tests":"代詞與主詞","avoid":"看到「其」，往前找最近出現的人"},{"q":"「此是君家果」的「君」指的是誰？","opts":["孔君平","楊家的孩子","孩子的父親","梁國國君"],"ans":"B","steps":["說這句話的是孔君平：「孔指以示兒曰」","他是對著孩子說的 → 君＝你，指楊家孩子","楊梅姓「楊」，孔君平開玩笑說是「你家的果子」"],"tests":"找說話對象","avoid":"「君」「子」是「你」，看話是對誰說的"},{"q":"「未聞孔雀是夫子家禽」，孩子的意思是？","opts":["我很喜歡孔雀","孔雀是我家養的","夫子家有很多鳥","沒聽說過孔雀是您家的鳥"],"ans":"D","steps":["「未聞」＝沒有聽說","「夫子」指說話的對象孔君平","孩子用孔雀的「孔」回敬孔君平說的「楊」梅 → D"],"tests":"補出「夫子」是誰","avoid":"先確定每個稱呼指誰，句意就清楚"},{"q":"這篇故事主要表現楊家孩子的什麼特點？","opts":["反應快、說話機智又有禮貌","喜歡吃水果","很會煮飯招待客人","不喜歡孔君平"],"ans":"A","steps":["第一句就說「甚聰惠」","「應聲答曰」：馬上回答，反應快","用「未聞」委婉回敬，沒有罵人 → 機智有禮"],"tests":"人物特點","avoid":"文章開頭的評語常常就是答案"}]},{"label":"第四篇","title":"管寧割席","text":["管寧、華歆共園中鋤菜，見地有片金，管揮鋤與瓦石不異，華捉而擲去之。又嘗同席讀書，有乘軒冕過門者，寧讀如故，歆廢書出看。寧割席分坐，曰：「子非吾友也。」"],"cite":"《世說新語．德行》","notes":"鋤：用鋤頭翻土　捉：拿起　軒冕：大官坐的車和戴的帽子，指大官　廢：放下　席：坐墊","trans":"管寧和華歆一起在園子裡鋤地種菜，看到地上有一塊金子，管寧照樣揮著鋤頭，把它看得和瓦片石頭沒有兩樣；華歆卻撿起來，然後才丟掉。他們又曾經坐在同一張蓆子上讀書，有坐著華麗車子、戴著官帽的大官從門口經過，管寧像原來一樣讀書，華歆卻放下書跑出去看。管寧就把蓆子割開，分開坐，說：「你不是我的朋友。」","qs":[{"q":"「捉而擲去之」是誰把金子撿起來又丟掉？","opts":["管寧","乘車經過的人","華歆","種菜的農夫"],"ans":"C","steps":["這句前面寫「華」，指華歆","「管揮鋤與瓦石不異」是管寧，他根本沒撿","撿起來再丟掉的是華歆"],"tests":"辨認動作的主詞","avoid":"人名只寫一個字時，要對回全名"},{"q":"「廢書出看」是誰放下書出去看？","opts":["管寧","坐車的大官","兩個人一起","華歆"],"ans":"D","steps":["前一句「寧讀如故」：管寧照樣讀書","這句前面寫「歆」，就是華歆","所以不是兩個人一起，只有華歆出去看"],"tests":"辨認動作的主詞","avoid":"兩人對比時，每句旁邊標上是誰"},{"q":"「寧讀如故」是什麼意思？","opts":["管寧像原來一樣繼續讀書","管寧寧可讀書","管寧讀以前的書","管寧讀得很慢"],"ans":"A","steps":["「寧」是管寧的名字，不是「寧可」","「如故」＝像原來一樣（成語「依然如故」）","代回：管寧像原來一樣讀書 → 通"],"tests":"主詞＋字義","avoid":"先想這個字是不是人名"},{"q":"管寧為什麼要割席分坐？","opts":["座位太小坐不下","華歆把書弄壞了","他覺得華歆看重錢財、羨慕富貴，和自己志向不同","華歆搶了他的金子"],"ans":"C","steps":["兩件事：華歆撿金子、華歆放下書去看大官","管寧說「子非吾友也」→ 不想當朋友","原因是華歆的心思放在金錢和富貴上 → C；D 錯，金子被丟掉了"],"tests":"找人物行為的原因","avoid":"原因要從前面發生的事找"}]},{"label":"第五篇","title":"執竿入城","text":["魯有執長竿入城門者，初豎執之，不可入，橫執之，亦不可入，計無所出。俄有老父至，曰：「吾非聖人，但見事多矣，何不以鋸中截而入？」遂依而截之。"],"cite":"《笑林》","notes":"竿：長竹竿　計：辦法　俄：一會兒　老父：老人　但：只是","trans":"魯國有個拿著長竹竿要進城門的人，一開始豎著拿，進不去；橫著拿，也進不去，想不出辦法。一會兒有個老人來了，說：「我不是聖人，只是見過的事情多了，為什麼不用鋸子從中間截斷再進去呢？」那人就照著做，把竹竿鋸斷了。","qs":[{"q":"「計無所出」是誰想不出辦法？","opts":["守城門的人","老人","聖人","拿竹竿的魯國人"],"ans":"D","steps":["往前找：「魯有執長竿入城門者」","豎著拿、橫著拿都進不去的，都是他","文中沒有守門的人；老人是後來才出現"],"tests":"補省略的主詞","avoid":"老人還沒出現前，主角只有一個人"},{"q":"「吾非聖人，但見事多矣」是誰說的？","opts":["老人","拿竹竿的人","聖人","魯國國君"],"ans":"A","steps":["前一句「俄有老父至，曰」","「曰」前面的人是老父","所以說話的是老人；他說自己「不是聖人」，C 錯"],"tests":"找說話的人","avoid":"看「曰」前面最近的人"},{"q":"「遂依而截之」是誰把竹竿鋸斷？","opts":["老人","聖人","拿竹竿的魯國人","守城門的人"],"ans":"C","steps":["「依」＝照著做，照著老人的話做","聽建議的是拿竹竿的人","竹竿是他的，鋸斷竹竿的也是他"],"tests":"主詞換人了","avoid":"說話的人換了，動作的人也可能換"},{"q":"老人說「何不以鋸中截而入」，是什麼建議？","opts":["把城門鋸開","用鋸子把竹竿從中間鋸斷再拿進去","把竹竿丟掉","請聖人來幫忙"],"ans":"B","steps":["「以鋸」＝用鋸子；「中截」＝從中間截斷","「而入」＝然後進城","後面「遂依而截之」截的是竹竿 → B"],"tests":"理解句意","avoid":"一個詞一個詞翻，再接起來"}]}]},{"no":"第 2 組","title":"刻舟求劍","skill":"虛詞當路標＋五招猜字義","steps":["❶ 虛詞是路標：「而」＝然後／但是（看前後同方向還是相反）","　　「故」＝所以　「乃」＝才、於是　「之」＝的、他","❷ 不認得的字，五招由易到難：①組詞 ②不通就看目的換招驗證 ③看部首 ④比對稱句 ⑤想成語","　　每一招最後都要代回原句讀讀看"],"demo":{"q":"「衡乃與其傭作而不求償」的「償」是什麼意思？","a":["第 1 招組詞：賠償、補償、報償","代回：匡衡幫人做工，卻不要求報酬 → 通","第 3 招驗證：人部加「賞」，和給錢、回報有關","答：報酬"]},"parts":[{"label":"第一篇","title":"刻舟求劍","text":["楚人有涉江者，其劍自舟中墜於水，遽契其舟，曰：「是吾劍之所從墜。」舟止，從其所契者入水求之。舟已行矣，而劍不行，求劍若此，不亦惑乎？"],"cite":"《呂氏春秋．察今》","notes":"涉：渡過　遽：急忙　契：用刀刻　是：這裡　惑：糊塗","trans":"楚國有個渡江的人，他的劍從船上掉進水裡，他急忙在船邊刻了記號，說：「這裡是我的劍掉下去的地方。」船停了，他從刻記號的地方下水找劍。船已經走了，劍卻沒有跟著走，像這樣找劍，不是很糊塗嗎？","qs":[{"q":"「舟已行矣，而劍不行」的「而」是什麼意思？","opts":["然後","但是","因為","如果"],"ans":"B","steps":["「舟已行」：船走了","「劍不行」：劍沒走","前後意思相反 → 「而」＝但是"],"tests":"虛詞「而」的轉折用法","avoid":"看「而」前後是同方向還是相反"},{"q":"「其劍自舟中墜於水」的「墜」是什麼意思？","opts":["掉落","追趕","漂浮","沉思"],"ans":"A","steps":["注釋沒有「墜」→ 第 1 招組詞：墜落、墜機","代回：劍從船上墜落到水裡 → 通","再驗證：成語「搖搖欲墜」也是快要掉下來"],"tests":"組詞法猜字義","avoid":"先組詞，代回去讀得通再選"},{"q":"作者認為這個楚國人錯在哪裡？","opts":["不會游泳","劍太重","情況已經改變，卻還用原來的方法","沒有請別人幫忙"],"ans":"C","steps":["船會動，劍不會動","他還照著船上的記號找劍","作者用「不亦惑乎」說他糊塗 → 情況變了，方法沒變"],"tests":"抓主旨","avoid":"文末「不亦……乎」通常就是作者的看法"},{"q":"「從其所契者入水求之」的「之」指什麼？","opts":["船","江水","刻的記號","掉下去的劍"],"ans":"D","steps":["「之」可以當「它」，指前面說過的東西","「入水求之」：下水去找它","他要找的是掉進水裡的劍 → D"],"tests":"虛詞「之」指代","avoid":"看到「之」，往前找它代替的東西"}]},{"label":"第二篇","title":"掩耳盜鈴","text":["范氏之亡也，百姓有得鐘者，欲負而走，則鐘大不可負；以椎毀之，鐘況然有音。恐人聞之而奪己也，遽揜其耳。惡人聞之，可也；惡己自聞之，悖矣。"],"cite":"《呂氏春秋．自知》（節選）","notes":"范氏：晉國的貴族范家　負：背　椎：槌子　況然：鐘發出的聲音　揜：同「掩」，遮住　悖：荒謬","trans":"范氏滅亡的時候，有個百姓撿到一口鐘，想背著它跑，可是鐘太大背不動；他就用槌子把鐘敲碎，鐘發出「況況」的響聲。他怕別人聽到聲音來搶鐘，急忙摀住自己的耳朵。怕別人聽到，還說得過去；怕自己聽到，就太荒謬了。","qs":[{"q":"「欲負而走」的「走」是什麼意思？","opts":["慢慢走路","走漏消息","跑","走過去看"],"ans":"C","steps":["組詞「走路」→ 代回「想背著鐘走路」，但選項有「跑」，要再驗證","看目的：他怕被發現，想背了就趕快離開 → 跑","成語驗證：「奔走相告」走＝跑；代回「想背著鐘逃跑」→ 通"],"tests":"古今異義：組詞後換招驗證","avoid":"古文的「走」常常是跑，組詞「走路」會騙人"},{"q":"「恐人聞之而奪己也」的「而」是什麼意思？","opts":["然後、就","但是","如果","所以"],"ans":"A","steps":["前：別人聽到聲音","後：來搶自己的鐘","先聽到、接著搶，前後同方向 → 然後"],"tests":"虛詞「而」的承接","avoid":"「而」前後同方向＝然後"},{"q":"「惡己自聞之」的「惡」是什麼意思？","opts":["壞人","討厭、怕","兇惡","醜陋"],"ans":"B","steps":["組詞：厭惡、可惡 → 代回「討厭（怕）自己聽到聲音」→ 通","「壞人」「兇惡」代回都不通","再驗證：成語「好逸惡勞」，惡＝討厭"],"tests":"組詞法＋一字多音","avoid":"一個字有好幾個讀音，組詞要選讀得通的那個"},{"q":"作者說「悖矣」，認為這個人哪裡荒謬？","opts":["不該把鐘敲碎","鐘太大了","偷東西會被抓","以為摀住自己的耳朵，別人就聽不到"],"ans":"D","steps":["前半：「惡人聞之，可也」怕別人聽到還說得過去","後半：「惡己自聞之，悖矣」摀自己的耳朵才荒謬","成語「掩耳盜鈴」：自己騙自己 → D"],"tests":"抓作者看法","avoid":"文末的評語就是作者的看法"}]},{"label":"第三篇","title":"囊螢夜讀","text":["胤恭勤不倦，博學多通。家貧不常得油，夏月則練囊盛數十螢火以照書，以夜繼日焉。"],"cite":"《晉書．車胤傳》（節選）","notes":"胤：車胤，晉朝人　恭勤：恭敬勤奮　練囊：白色絹布做的袋子　盛：裝","trans":"車胤恭敬勤奮、不知疲倦，學問廣博又通達。家裡窮，常常沒有燈油，夏天就用白絹做的袋子裝幾十隻螢火蟲來照著書本，用晚上接續白天地讀書。","qs":[{"q":"「恭勤不倦」的「倦」是什麼意思？","opts":["疲累","捲起來","倒下","圈起來"],"ans":"A","steps":["第 1 招組詞：疲倦、厭倦","代回：恭敬勤奮，不覺得疲倦 → 通","第 3 招看部首：倦是人部，和「捲」「圈」是不同的字"],"tests":"組詞法猜字義","avoid":"字長得像不代表意思一樣，看清楚部首"},{"q":"「夏月則練囊盛數十螢火」的「則」是什麼意思？","opts":["規則","但是","就、便","好像"],"ans":"C","steps":["前：家裡窮，常常沒有燈油","後：夏天就用袋子裝螢火蟲照書","前面是困難，後面是辦法 → 則＝就"],"tests":"虛詞「則」","avoid":"「則」常接在條件後面，翻成「就」"},{"q":"「以夜繼日」是什麼意思？","opts":["晚上睡覺、白天讀書","用晚上接著白天，日夜不停地讀書","只在白天讀書","每天晚上看螢火蟲"],"ans":"B","steps":["長得像成語的句子，用第 5 招：「夜以繼日」＝晚上接著白天，不停做事","代回：用晚上接續白天，一直讀書","前面「以照書」也證明晚上在讀書 → B"],"tests":"第 5 招：借成語讀句意","avoid":"長得像成語的句子，直接借成語的意思"},{"q":"根據本文，車胤用螢火蟲照書的原因是？","opts":["螢火蟲比油燈亮","他喜歡抓螢火蟲","夏天太熱不能點燈","家裡窮，常常沒有燈油"],"ans":"D","steps":["找原因句：「家貧不常得油」","「則」後面才是辦法：用螢火蟲照書","A、B、C 文中都沒寫"],"tests":"找原因","avoid":"「則」前面常是原因或條件"}]},{"label":"第四篇","title":"鑿壁偷光","text":["匡衡字稚圭，勤學而無燭。鄰舍有燭而不逮，衡乃穿壁引其光，以書映光而讀之。邑人大姓文不識，家富多書，衡乃與其傭作而不求償。主人怪問衡，衡曰：「願得主人書遍讀之。」主人感歎，資給以書，遂成大學。"],"cite":"《西京雜記》","notes":"匡衡：漢朝人　逮：到達　邑人：同鄉的人　大姓：大戶人家　文不識：人名　傭作：做工　資給：借給、資助　大學：大學問家","trans":"匡衡，字稚圭，勤奮讀書卻沒有蠟燭。鄰居家有蠟燭，但光照不到他家，匡衡就在牆上鑿個洞，把光引過來，讓書映著光來讀。同鄉有個大戶人家叫文不識，家裡有錢、書很多，匡衡就去他家做工，卻不要工錢。主人覺得奇怪，問他原因，匡衡說：「希望能讀遍主人家的書。」主人很感動，就把書借給他讀，匡衡後來成了大學問家。","qs":[{"q":"「勤學而無燭」的「而」是什麼意思？","opts":["然後","但是","所以","因為"],"ans":"B","steps":["前：很勤勞讀書","後：沒有蠟燭","讀書需要燈，卻沒有，前後相反 → 但是"],"tests":"虛詞「而」的轉折","avoid":"看「而」前後是同方向還是相反"},{"q":"「衡乃穿壁引其光」的「乃」是什麼意思？","opts":["是","你的","於是、就","竟然"],"ans":"C","steps":["前：鄰居的燭光照不到","後：匡衡就在牆上鑿洞引光","前面是困難，後面是想出的辦法 → 於是"],"tests":"虛詞「乃」","avoid":"「乃」後面常是接著做的事"},{"q":"「衡乃與其傭作而不求償」的「償」是什麼意思？","opts":["工錢、報酬","品嘗","道歉","賞賜的官位"],"ans":"A","steps":["第 1 招組詞：賠償、補償、報償","代回：幫他做工卻不要求報酬 → 通","第 3 招驗證：人部加「賞」，和給錢回報有關；後面他只要「主人書」，證明不要錢"],"tests":"組詞法＋看部首驗證","avoid":"組詞後一定要代回原句檢查"},{"q":"匡衡去文不識家做工，真正想要的是什麼？","opts":["賺錢買蠟燭","住進大房子","當主人家的僕人","讀遍主人家的書"],"ans":"D","steps":["找匡衡說的話：「願得主人書遍讀之」","前面說他「不求償」，所以不是要錢","→ D"],"tests":"找人物的目的","avoid":"問人物想要什麼，就找他說的話"}]},{"label":"第五篇","title":"學弈","text":["弈秋，通國之善弈者也。使弈秋誨二人弈，其一人專心致志，惟弈秋之為聽；一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之。雖與之俱學，弗若之矣。為是其智弗若與？曰：非然也。"],"cite":"《孟子．告子上》（節選）","notes":"弈：下棋　通國：全國　鴻鵠：天鵝　援：拉　繳：繫著絲繩的箭　俱：一起","trans":"弈秋是全國最會下棋的人。讓弈秋教兩個人下棋，其中一人專心一志，只聽弈秋講解；另一人雖然也在聽，心裡卻一直以為有天鵝要飛來，想拉弓搭箭去射牠。雖然和前一個人一起學，成績卻比不上他。是因為他的聰明才智比不上前一個人嗎？回答是：不是這樣的。","qs":[{"q":"「使弈秋誨二人弈」的「誨」是什麼意思？","opts":["後悔","教導","下棋","比賽"],"ans":"B","steps":["第 1 招組詞：教誨","代回：讓弈秋教導兩個人下棋 → 通","第 3 招看部首：言部和說話、教人有關；「後悔」是忄部的「悔」，字不一樣"],"tests":"組詞法＋看部首","avoid":"部首不同，意思就不同，要看清楚"},{"q":"「一人雖聽之」的「雖」是什麼意思？","opts":["雖然","因為","所以","於是"],"ans":"A","steps":["前：這個人也在聽","後：心裡卻想著射天鵝","前後轉彎 → 雖然……卻"],"tests":"虛詞「雖」","avoid":"「雖」後面常接轉彎的句子"},{"q":"「弗若之矣」是誰比不上誰？","opts":["弈秋比不上兩個學生","專心的人比不上分心的人","兩個人下得一樣好","分心的人比不上專心的人"],"ans":"D","steps":["「弗若」＝不如；「之」指前面另一個人","這句接在想射天鵝的人後面，主詞是他","分心的人比不上專心的人 → D"],"tests":"虛詞「之」指代","avoid":"「之」代替誰，往前找另一個人"},{"q":"作者認為兩人學習結果不同的原因是？","opts":["專心程度不同，不是聰明才智不同","分心的人比較笨","老師偏心","天鵝真的飛來打擾"],"ans":"A","steps":["作者問「為是其智弗若與」：是因為他不夠聰明嗎？","回答「非然也」：不是這樣","前面寫一人專心、一人分心 → 差別在專心 → A"],"tests":"抓主旨","avoid":"自問自答的句子，答的部分就是重點"}]}]},{"no":"第 3 組","title":"畫蛇添足","skill":"選項代回去讀","steps":["❶ 把四個選項的意思，一個一個放回原句","❷ 讀起來通順、和前後文不矛盾的才留下","❸ 剩兩個時，回文章找哪一個有證據"],"demo":{"q":"「蛇固無足」的「固」是什麼意思？（堅固／本來／固執）","a":["代回「蛇堅固沒有腳」→ 不通","代回「蛇本來就沒有腳」→ 通，而且符合常識","答：本來"]},"parts":[{"label":"第一篇","title":"畫蛇添足","text":["楚有祠者，賜其舍人卮酒。舍人相謂曰：「數人飲之不足，一人飲之有餘。請畫地為蛇，先成者飲酒。」一人蛇先成，引酒且飲之，乃左手持卮，右手畫蛇，曰：「吾能為之足。」未成，一人之蛇成，奪其卮曰：「蛇固無足，子安能為之足？」遂飲其酒。為蛇足者，終亡其酒。"],"cite":"《戰國策．齊策》","notes":"祠：祭祀　舍人：門客　卮：古代酒器　引：拿過來　子：你","trans":"楚國有個祭祀的人，賞給門客們一壺酒。門客們商量：「幾個人喝不夠，一個人喝有剩。我們在地上畫蛇，先畫好的人喝酒。」有一個人先畫好了，拿過酒準備喝，就左手拿酒器、右手繼續畫，說：「我還能幫蛇畫腳。」腳還沒畫完，另一個人的蛇畫好了，搶過酒器說：「蛇本來就沒有腳，你怎麼能幫它畫腳？」就把酒喝了。幫蛇畫腳的人，最後失去了他的酒。","qs":[{"q":"「子安能為之足」的「安」是什麼意思？","opts":["安全","怎麼","安靜","放置"],"ans":"B","steps":["代回：「你安全能幫它畫腳」→ 不通","代回：「你怎麼能幫它畫腳」→ 通，而且是在責問","「安靜」「放置」代回也不通"],"tests":"選項代回法判斷字義","avoid":"四個都代回去讀一次，不要看到熟悉的意思就選"},{"q":"「終亡其酒」的「亡」是什麼意思？","opts":["死亡","逃走","失去","滅亡"],"ans":"C","steps":["代回：「最後死了他的酒」「最後逃走他的酒」→ 不通","代回：「最後失去了他的酒」→ 通，酒被別人喝掉了","也可以想成語「亡羊補牢」：亡＝丟失"],"tests":"一字多義：亡不一定是死","avoid":"常見意思代回去不通，就換另一個意思"},{"q":"「遂飲其酒」是誰喝了酒？","opts":["第一個畫完蛇的人","第二個畫完蛇的人","祭祀的主人","所有門客"],"ans":"B","steps":["往前找：「一人之蛇成，奪其卮曰……」","搶酒器、說話、喝酒，中間沒有換人","所以喝酒的是第二個畫完蛇的人"],"tests":"連續動作的主詞","avoid":"一連串動作沒換主詞，主詞就是同一個人"},{"q":"「引酒且飲之」的「且」是什麼意思？","opts":["而且","暫且","並且","將要"],"ans":"D","steps":["代回「拿過酒而且喝」「拿過酒暫且喝」→ 讀起來怪","代回「拿過酒將要喝」→ 通，他還沒喝就去畫腳","後面酒被搶走，證明他「還沒喝」→ 將要"],"tests":"選項代回判斷虛詞","avoid":"四個都代回，再用後文檢查"}]},{"label":"第二篇","title":"智子疑鄰","text":["宋有富人，天雨牆壞。其子曰：「不築，必將有盜。」其鄰人之父亦云。暮而果大亡其財，其家甚智其子，而疑鄰人之父。"],"cite":"《韓非子．說難》（節選）","notes":"雨：下雨　築：修補　云：說","trans":"宋國有個富人，下雨把牆淋壞了。他的兒子說：「不修好，一定會有小偷。」鄰居家的老人也這樣說。晚上果然丟了很多財物，這家人認為兒子很聰明，卻懷疑是鄰居老人偷的。","qs":[{"q":"「暮而果大亡其財」的「亡」是什麼意思？","opts":["丟失","逃亡","死去","忘記"],"ans":"A","steps":["代回「晚上果然大大死去財物」→ 不通","代回「晚上果然丟失很多財物」→ 通","前面說「必將有盜」，被偷就是丟失"],"tests":"選項代回判斷字義","avoid":"四個都代回，配合前文檢查"},{"q":"「其家甚智其子」的「智」是什麼意思？","opts":["智慧","認為……聰明","讓……變聰明","聰明的人"],"ans":"B","steps":["代回「家人讓兒子變聰明」→ 家人做不到，不合理","代回「家人認為兒子很聰明」→ 通，兒子的預言成真","後面「疑鄰人之父」是相反的態度，對照著讀"],"tests":"選項代回判斷字義","avoid":"形容詞當動詞用，常是「認為……」"},{"q":"「暮而果大亡其財」的「果」是什麼意思？","opts":["水果","結果","果然","果斷"],"ans":"C","steps":["代回「晚上水果……」不通","代回「晚上果然被偷」→ 通，前面說過「必將有盜」","預言的事真的發生 → 果然"],"tests":"選項代回判斷字義","avoid":"前文的預言＋後文成真＝果然"},{"q":"富人一家為什麼懷疑鄰居老人？","opts":["老人說的話和兒子不同","有人看到老人晚上來過","老人家裡很窮","同樣的話，只因為是外人說的就被懷疑"],"ans":"D","steps":["「其鄰人之父亦云」：老人說的話和兒子一樣","A 和文意相反；B、C 文中沒有","同樣的話，對兒子稱讚、對老人懷疑 → D"],"tests":"抓主旨","avoid":"「亦」＝也，表示兩人說的一樣"}]},{"label":"第三篇","title":"朝三暮四","text":["狙公賦芧，曰：「朝三而暮四。」眾狙皆怒。曰：「然則朝四而暮三。」眾狙皆悅。名實未虧而喜怒為用，亦因是也。"],"cite":"《莊子．齊物論》（節選）","notes":"狙：獼猴　狙公：養猴子的人　芧：橡實，猴子的食物　因：順著","trans":"養猴子的人分橡實給猴子，說：「早上三顆，晚上四顆。」猴子們都很生氣。他又說：「那麼早上四顆，晚上三顆。」猴子們都很高興。名稱和實際數量都沒有減少，猴子卻因此一會兒生氣、一會兒高興，這也只是順著猴子的心理罷了。","qs":[{"q":"「狙公賦芧」的「賦」是什麼意思？","opts":["寫詩","分給","稅金","天生的"],"ans":"B","steps":["代回「養猴人寫詩橡實」→ 不通","代回「養猴人分給猴子橡實」→ 通","後面說早上幾顆、晚上幾顆，就是在分食物"],"tests":"選項代回判斷字義","avoid":"代回後再看後文有沒有證據"},{"q":"「然則朝四而暮三」的「然則」是什麼意思？","opts":["然而","雖然","那麼","竟然"],"ans":"C","steps":["代回「然而早上四顆」→ 前面沒有相反的意思，不順","代回「那麼早上四顆、晚上三顆」→ 通，是換個說法","猴子生氣後，養猴人提出新辦法 → 那麼"],"tests":"選項代回判斷虛詞","avoid":"虛詞也能代回，看前後怎麼接"},{"q":"「朝三而暮四」的「朝」是什麼意思？","opts":["早上","朝代","面向","朝廷"],"ans":"A","steps":["和後面的「暮」（傍晚）相對","代回：早上三顆、傍晚四顆 → 通","「朝代、朝廷、面向」代回都不通"],"tests":"選項代回判斷字義","avoid":"找和它相對的字，一起看"},{"q":"「名實未虧而喜怒為用」說的是？","opts":["猴子吃到的變多了","養猴人很生氣","猴子變聰明了","總數沒有變少，猴子的喜怒卻跟著改變"],"ans":"D","steps":["三加四、四加三都是七顆","「未虧」＝沒有減少","數量沒變，猴子卻一怒一喜 → D"],"tests":"理解句意","avoid":"自己算一算，用證據排除選項"}]},{"label":"第四篇","title":"對牛彈琴","text":["公明儀為牛彈清角之操，伏食如故。非牛不聞，不合其耳矣。轉為蚊虻之聲，孤犢之鳴，即掉尾奮耳，蹀躞而聽。"],"cite":"《弘明集．牟子理惑論》（節選）","notes":"公明儀：古代音樂家　清角之操：一種高雅的琴曲　蚊虻：蚊子和牛虻　犢：小牛　掉：搖動　蹀躞：小步走動","trans":"公明儀為牛彈奏一首高雅的琴曲，牛照樣趴著吃草。不是牛沒聽見，是這曲子不適合牠的耳朵。他改彈像蚊子、牛虻飛的嗡嗡聲，和小牛找媽媽的叫聲，牛就搖著尾巴、豎起耳朵，小步走來走去地聽。","qs":[{"q":"「伏食如故」的意思是？","opts":["牛趴著，像原來一樣吃草","牛吃得比原來多","牛跑去找老朋友","牛害怕得趴下"],"ans":"A","steps":["「如故」想成語「依然如故」，故＝原來的樣子","代回：牛趴著吃草，和原來一樣 → 通","後面說「不合其耳」，牛沒反應，符合"],"tests":"選項代回判斷句意","avoid":"代回後用下一句檢查"},{"q":"「不合其耳矣」的「合」是什麼意思？","opts":["合起來","適合","合唱","全部"],"ans":"B","steps":["代回「不合起來牠的耳朵」→ 不通","代回「不適合牠的耳朵」→ 通","前一句「非牛不聞」：牛不是沒聽到，是不喜歡"],"tests":"選項代回判斷字義","avoid":"一個字的常見意思不通，就換一個"},{"q":"「轉為蚊虻之聲」的「轉」是什麼意思？","opts":["旋轉","轉交","改成","轉身"],"ans":"C","steps":["代回「旋轉成蚊子的聲音」→ 不通","代回「改成彈蚊子的聲音」→ 通","前面彈高雅曲子沒用，所以換別的"],"tests":"選項代回判斷字義","avoid":"想想前一件事沒用，後面才要「改」"},{"q":"這篇故事告訴我們什麼？","opts":["牛的耳朵聽不見","彈琴一定要彈得很大聲","小牛最喜歡聽音樂","說話做事要看對象，用對方能接受的方式"],"ans":"D","steps":["「非牛不聞」→ A 錯","換成牛熟悉的聲音，牛就專心聽","可見要配合對象 → D；B 有絕對字「一定」"],"tests":"抓主旨","avoid":"比較故事前後的不同，就是道理"}]},{"label":"第五篇","title":"曾子殺彘","text":["曾子之妻之市，其子隨之而泣。其母曰：「女還，顧反為女殺彘。」妻適市來，曾子欲捕彘殺之。妻止之曰：「特與嬰兒戲耳。」曾子曰：「嬰兒非與戲也。……今子欺之，是教子欺也。……」遂烹彘也。"],"cite":"《韓非子．外儲說左上》（節選）","notes":"彘：豬　女：同「汝」，你　顧反：等我回來　特：只是　嬰兒：小孩","trans":"曾子的妻子要去市場，兒子跟在後面哭。母親說：「你回去，等我回來替你殺豬。」妻子從市場回來，曾子就要抓豬來殺。妻子阻止他說：「只是和小孩開玩笑罷了。」曾子說：「小孩是不能和他開玩笑的。……現在你欺騙他，就是教孩子騙人。……」於是殺了豬煮給孩子吃。","qs":[{"q":"「曾子之妻之市」的第二個「之」是什麼意思？","opts":["的","他","前往","這個"],"ans":"C","steps":["代回「曾子的妻子的市場」→ 不通","代回「曾子的妻子前往市場」→ 通","後面「妻適市來」從市場回來，證明她去了市場"],"tests":"選項代回判斷虛詞","avoid":"同一句出現兩個「之」，要分開判斷"},{"q":"「其子隨之而泣」的「之」指誰？","opts":["曾子的妻子","曾子","市場","豬"],"ans":"A","steps":["代回「兒子跟著曾子哭」→ 可是要出門的是妻子","代回「兒子跟著媽媽哭」→ 通","後面「其母曰」也證明孩子跟著的是母親"],"tests":"選項代回找指代","avoid":"代回後，用下一句檢查"},{"q":"「特與嬰兒戲耳」的「戲」是什麼意思？","opts":["演戲","開玩笑、逗著玩","看戲","比賽"],"ans":"B","steps":["代回「只是和小孩演戲」→ 怪","代回「只是和小孩開玩笑罷了」→ 通","她的意思是殺豬只是哄孩子的話，不是真的"],"tests":"選項代回判斷字義","avoid":"注意說話的人想表達什麼"},{"q":"曾子堅持殺豬，理由是？","opts":["家裡本來就要殺豬過節","孩子吵著要吃肉","妻子答應了鄰居","父母騙孩子，等於教孩子騙人"],"ans":"D","steps":["找曾子的話：「今子欺之，是教子欺也」","騙孩子就等於教孩子騙人，所以一定要說到做到 → D","A、B、C 文中都沒有"],"tests":"找人物的理由","avoid":"問人物的理由，就找他說的話"}]}]},{"no":"第 4 組","title":"籃球的三秒規則","skill":"白話找證據四招","steps":["❶ 先讀題、再讀文：知道要找什麼再讀","❷ 轉折、總結詞後面是重點：但是、然而、其實、所以","❸ 絕對字警戒：選項有「都、一定、只、所有」先打問號","❹ 文中有證據才選：指得出第幾段哪一句"],"demo":{"q":"限制區在球場的哪裡？","a":["先看材料：「在籃球場上，籃框前方有一塊顏色不同的長方形區域，叫做『限制區』。」","題目問「哪裡」→ 在材料裡找「位置」的字：籃框前方","用手指指得出這一句，就是證據句","答：籃框前方"]},"parts":[{"label":"第一篇","title":"籃球的三秒規則","text":["在籃球場上，籃框前方有一塊顏色不同的長方形區域，叫做「限制區」，也有人叫它「禁區」。規則規定：進攻的一方，球員不能在這塊區域裡連續停留超過三秒，否則就是「三秒違例」，球權要交給對手。","很多人第一次聽到會覺得奇怪：站在籃框旁邊最容易得分，為什麼不能一直站？其實，正是因為那裡最容易得分，才需要限制。如果長得高的球員可以一直守在籃下，比賽就會變成「誰最高誰贏」，其他球員的跑位、傳球都變得不重要。","所以，三秒規則表面上是在限制球員，實際上是逼大家多移動、多傳球，讓比賽更公平，也更好看。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"這篇文章最適合的一句話摘要是？","opts":["限制區是一塊顏色不同的區域","三秒規則限制進攻球員站位，目的是讓比賽更公平好看","長得高的球員一定會贏","傳球比投籃重要"],"ans":"B","steps":["摘要＝說了什麼＋為什麼","第一段講規則內容，第三段講目的，B 兩者都有","A 只是第一段的細節；C 有絕對字「一定」；D 文中沒有比較"],"tests":"統整全文寫摘要","avoid":"摘要要涵蓋頭和尾，只講一段的是細節"},{"q":"根據本文，下列何者正確？","opts":["防守球員也不能在限制區停留超過三秒","三秒違例的話，球權要交給對手","所有長得高的球員都討厭這個規則","三秒規則讓比賽變成誰高誰贏"],"ans":"B","steps":["A：文中只寫「進攻的一方」，沒有講防守 → 沒證據","B：第一段「球權要交給對手」→ 有證據","C：絕對字「所有」，文中也沒說；D：和第二段意思相反"],"tests":"逐項找證據","avoid":"就算自己知道的球賽規則，文中沒寫就不能選"},{"q":"作者的結論寫在哪個詞後面？","opts":["也有人","否則","所以","如果"],"ans":"C","steps":["結論通常在總結詞後面","第三段開頭「所以」，後面說出規則真正的目的","A、B、D 後面接的都是細節或假設"],"tests":"用總結詞找重點","avoid":"看到「所以、可見、總之」就畫線"},{"q":"根據第二段，如果沒有三秒規則，可能會怎樣？","opts":["比賽會更公平","大家會更常傳球","防守球員容易受傷","比賽可能變成誰最高誰贏"],"ans":"D","steps":["第二段：「如果長得高的球員可以一直守在籃下，比賽就會變成『誰最高誰贏』」","A、B 是「有」規則時的好處，和題目相反；C 文中沒寫","→ D"],"tests":"找假設句的證據","avoid":"題目說「如果」，就回文中找「如果」"}]},{"label":"第二篇","title":"先看到閃電，再聽到雷聲","text":["下雷雨時，我們常常先看到天空一亮，過了幾秒，才聽到「轟隆」一聲。很多人以為，閃電和雷聲是先後發生的兩件事。其實，閃電和雷聲是同時產生的。","那為什麼聽起來有先後呢？因為光和聲音跑的速度差很多。光跑得非常快，閃電一發生，光幾乎馬上就到我們眼前；聲音就慢多了，要花一些時間才能傳過來。這就像一場賽跑：光是飛毛腿，聲音是慢慢走的烏龜，兩個同時起跑，光一下子就到終點，聲音卻還在半路上。","此外，看到閃電以後，數一數過了多久才聽到雷聲，還能大概知道閃電離我們多遠：隔的時間越長，閃電越遠；隔的時間越短，閃電越近。所以，下次打雷時不妨數一數，當個小小氣象觀察員。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"作者把光和聲音比喻成什麼？","opts":["閃電和雷雨","飛毛腿和烏龜","氣象員和觀眾","天空和地面"],"ans":"B","steps":["看到「就像」就畫線，回第二段找","第二段：「這就像一場賽跑：光是飛毛腿，聲音是慢慢走的烏龜」","→ B"],"tests":"找比喻","avoid":"看到「像、好比」就畫線"},{"q":"根據本文，下列哪一項「不是」文中說的？","opts":["光跑得非常快","聲音要花一些時間才能傳過來","隔的時間越短，閃電越近","閃電一定比雷聲早發生"],"ans":"D","steps":["A、B：第二段有；C：第三段有","D：有絕對字「一定」，而且第一段說兩者「是同時產生的」","→ D"],"tests":"逐項找證據","avoid":"題目有「不」，先圈起來再作答"},{"q":"第一段作者真正想說的是哪一句？","opts":["下雷雨時，常常先看到天空一亮","很多人以為閃電和雷聲是先後發生的","閃電和雷聲是同時產生的","過了幾秒才聽到轟隆一聲"],"ans":"C","steps":["轉折詞「其實」後面是作者真正想說的","第一段：「其實，閃電和雷聲是同時產生的」","B 是作者要反駁的想法；A、D 是細節 → C"],"tests":"用轉折詞找重點","avoid":"「其實」後面那句先畫線"},{"q":"第三段開頭的「此外」，表示這一段要做什麼？","opts":["補充另一個和閃電、雷聲有關的知識","反對第二段的說法","舉一個失敗的例子","說明光一秒跑多遠"],"ans":"A","steps":["「此外」＝除了前面說的，還有","第三段講用雷聲隔多久，判斷閃電遠近，是另一個新知識","不是反對；D 文中沒有寫數字 → A"],"tests":"連接詞的作用","avoid":"「此外、而且」是補充，不是轉彎"}]},{"label":"第三篇","title":"狗狗在讀報紙","text":["帶狗散步時，你可能發現牠走幾步就停下來，低頭聞電線桿、聞草地，怎麼拉都不肯走。很多人以為狗狗只是貪玩，但其實，牠正在「讀報紙」。","狗的嗅覺比人類靈敏得多。其他狗留下的氣味，就像一則一則的訊息，可能告訴牠：誰來過這裡、大概多久以前經過。狗狗用鼻子收集這些消息，就像我們看新聞一樣。","所以，散步時不妨多給狗狗一點時間聞一聞。對牠來說，這不只是走路，也是在認識附近的世界。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"作者說狗狗在「讀報紙」，指的是什麼？","opts":["狗狗喜歡咬報紙","狗狗用鼻子聞氣味，收集訊息","狗狗看得懂字","狗狗在找食物"],"ans":"B","steps":["第一段：「但其實，牠正在『讀報紙』」","第二段解釋：氣味像訊息，「狗狗用鼻子收集這些消息」","→ B"],"tests":"找引號詞的意思","avoid":"加引號的詞，答案常在下一段"},{"q":"根據本文，下列何者正確？","opts":["狗的嗅覺比人類靈敏得多","狗狗散步停下來，都是因為貪玩","所有的狗都不喜歡散步","狗狗只靠眼睛認識世界"],"ans":"A","steps":["A：第二段第一句有證據","B：有絕對字「都」，而且作者說「其實」不是貪玩","C 文中沒有；D 和全文相反"],"tests":"逐項找證據","avoid":"絕對字的選項先打問號"},{"q":"作者在第三段給讀者什麼建議？","opts":["散步時拉著狗快點走","不要讓狗狗聞電線桿","散步時多給狗狗一點時間聞一聞","每天帶狗去看新聞"],"ans":"C","steps":["總結詞「所以」後面是建議","第三段：「散步時不妨多給狗狗一點時間聞一聞」","→ C"],"tests":"用總結詞找重點","avoid":"看到「所以」就畫線"},{"q":"第一段的「但其實」前後，作者怎麼安排？","opts":["前面講原因，後面講結果","前後說的是同一個意思","前面講狗，後面講人","前面是一般人的誤會，後面是真正的答案"],"ans":"D","steps":["「但其實」前：「很多人以為狗狗只是貪玩」","後：「牠正在讀報紙」","轉折詞前是誤會，後是作者要說的 → D"],"tests":"轉折詞前後關係","avoid":"轉折詞後面才是作者的意思"}]},{"label":"第四篇","title":"籃球是怎麼發明的","text":["籃球是在一八九一年發明的。當時在美國的一所學校裡，正值冬天，天氣太冷，學生不能到戶外運動，待在室內又覺得無聊，學校就請體育老師奈史密斯想一種可以在室內玩的球類遊戲。","奈史密斯想：如果目標放在高處，球員就不能只靠蠻力把球砸進去，而要練習準度。於是他把兩個裝桃子的籃子釘在體育館的欄杆上，當作球框。","不過，早期的籃子是有底的，每次進球，都要有人爬梯子把球拿出來，比賽常常被打斷。後來，人們把籃子的底拿掉，才慢慢變成今天看到的籃框和籃網。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"奈史密斯為什麼要發明籃球？","opts":["冬天太冷，學生需要能在室內玩的球類遊戲","他想當職業球員","學校要參加比賽","他家裡有很多桃子籃"],"ans":"A","steps":["第一段：「天氣太冷，學生不能到戶外運動……想一種可以在室內玩的球類遊戲」","B、C、D 文中都沒有","→ A"],"tests":"找原因的證據","avoid":"問「為什麼」，先找文中的原因句"},{"q":"奈史密斯把目標放在高處，是為了什麼？","opts":["讓高的人比較占便宜","讓球員練習準度，不能只靠蠻力","讓觀眾看得比較清楚","因為地上沒有位置"],"ans":"B","steps":["第二段：「如果目標放在高處，球員就不能只靠蠻力……而要練習準度」","A、C、D 文中都沒有","→ B"],"tests":"找目的的證據","avoid":"指得出證據句才選"},{"q":"第三段「不過」後面主要在說什麼？","opts":["籃子是用桃子做的","比賽從來不會中斷","早期的籃子有底，進球後要爬梯子拿球","籃網是奈史密斯一個人發明的"],"ans":"C","steps":["轉折詞「不過」後面是重點","第三段：「早期的籃子是有底的……爬梯子把球拿出來」","B 和文意相反；D 文中說是「後來人們」改的 → C"],"tests":"用轉折詞找重點","avoid":"「不過」後面那句先畫線"},{"q":"根據本文，下列何者「沒有」證據？","opts":["籃球是在一八九一年發明的","最早的球框是裝桃子的籃子","早期進球後，比賽常被打斷","奈史密斯發明籃球後就成了有錢人"],"ans":"D","steps":["A：第一段；B：第二段；C：第三段","D：文中完全沒提到","→ D"],"tests":"逐項找證據","avoid":"每個選項都要指出第幾段"}]},{"label":"第五篇","title":"彩虹出現的祕密","text":["雨剛停、太陽又出來的時候，天空有時會出現彩虹。彩虹是怎麼來的呢？","陽光看起來是白色的，其實是由許多種顏色的光混在一起。當陽光照進空中的小水滴，光會彎折、反射，不同顏色的光彎折的程度不一樣，就被分開來，排成紅、橙、黃、綠、藍、靛、紫的彩色光帶。","想看到彩虹，有兩個小祕訣：第一，要背對太陽，面向有水滴的天空；第二，太陽不能太高，所以彩虹常出現在早上或傍晚太陽比較低的時候。下次雨後放晴，不妨轉身找找看。"],"cite":"練習用自編短文","notes":"","trans":"","qs":[{"q":"根據本文，陽光其實是？","opts":["只有白色一種顏色","黃色加上白色","雨水反射的顏色","由許多種顏色的光混在一起"],"ans":"D","steps":["第二段：「陽光看起來是白色的，其實是由許多種顏色的光混在一起」","轉折詞「其實」後面才是真相","A 只是「看起來」的樣子 → D"],"tests":"用轉折詞找證據","avoid":"「看起來」和「其實」要分清楚"},{"q":"陽光進了水滴，為什麼會分成不同顏色？","opts":["不同顏色的光彎折程度不一樣","水滴本身有顏色","雲把顏色染上去","太陽的顏色會變"],"ans":"A","steps":["第二段：「不同顏色的光彎折的程度不一樣，就被分開來」","B、C、D 文中沒有","→ A"],"tests":"找原因的證據","avoid":"原因句常有「就、因此」"},{"q":"想看到彩虹，應該怎麼站？","opts":["面向太陽","背對太陽，面向有水滴的天空","站在屋子裡","躺在地上"],"ans":"B","steps":["第三段第一個祕訣：「要背對太陽，面向有水滴的天空」","A 和文中相反","→ B"],"tests":"找方法的證據","avoid":"「祕訣」後面就是答案"},{"q":"根據第三段，彩虹常在什麼時候出現？","opts":["中午太陽最高的時候","半夜","早上或傍晚太陽比較低的時候","只有夏天"],"ans":"C","steps":["總結詞「所以」後面：「彩虹常出現在早上或傍晚太陽比較低的時候」","A 和文意相反；D 有絕對字「只有」，文中也沒寫季節","→ C"],"tests":"用總結詞找重點","avoid":"「所以」後面的句子要畫線"}]}]},{"no":"第 5 組","title":"一週課外閱讀時間","skill":"圖表題五步驟","steps":["❶ 標題：這張圖在講什麼","❷ 單位：數字是人、小時、還是百分比","❸ 趨勢：哪裡多、哪裡少","❹ 最大值、最小值","❺ 最後才看選項，每個選項都回圖找數字"],"demo":{"q":"這張表的數字單位是什麼？","a":["先看材料：表格兩欄是「每週閱讀時間｜人數（人）」，例如「1～2 小時｜12」","看表頭括號：「人數（人）」","答：人（12 就是 12 個人）"]},"parts":[{"label":"第一篇","title":"一週課外閱讀時間","text":["老師調查全班 30 位同學，一週在課外讀書的時間，整理成下表。"],"cite":"某班 30 人一週課外閱讀時間（練習用數據，非真實調查）","notes":"","trans":"","chartHead":["每週閱讀時間","人數（人）"],"per":1,"unit":"人","data":[["0 小時",3],["1～2 小時",12],["3～4 小時",9],["5 小時以上",6]],"qs":[{"q":"人數最多的是哪一組？","opts":["0 小時","1～2 小時","3～4 小時","5 小時以上"],"ans":"B","steps":["四組人數：3、12、9、6","最大是 12","對應「1～2 小時」"],"tests":"找最大值","avoid":"先把每組數字寫出來再比較"},{"q":"每週讀 3 小時以上的人，占全班多少？","opts":["不到三分之一","剛好一半","超過一半","全班都是"],"ans":"B","steps":["3 小時以上＝3～4 小時 9 人＋5 小時以上 6 人＝15 人","全班＝3＋12＋9＋6＝30 人","15÷30＝1/2，剛好一半（檢查：15×2＝30）"],"tests":"圖表數字計算","avoid":"「以上」要把後面每一組都加進來"},{"q":"根據圖表，下列哪個說法有證據？","opts":["這班同學都不喜歡讀書","讀 5 小時以上的人，比完全沒讀的人多","讀越久的人國文成績越好","明年大家的閱讀時間會增加"],"ans":"B","steps":["B：5 小時以上 6 人，0 小時 3 人，6 比 3 多 → 有證據","A：絕對字「都」，而且 27 人有讀","C、D：圖裡沒有成績、也沒有明年的資料"],"tests":"圖表推論的範圍","avoid":"圖上沒有的資料，選項再合理也不能選"},{"q":"讀「1～2 小時」的人數，是讀「0 小時」的幾倍？","opts":["2 倍","3 倍","6 倍","4 倍"],"ans":"D","steps":["1～2 小時 12 人，0 小時 3 人","12÷3＝4","檢查：3×4＝12 → 4 倍"],"tests":"圖表數字倍數","avoid":"算倍數用除法，再用乘法檢查"}]},{"label":"第二篇","title":"全班最喜歡的水果","text":["某班 30 位同學，每人選一種自己最喜歡的水果，結果整理成下表。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["水果","人數（人）"],"per":1,"unit":"人","data":[["西瓜",10],["芒果",8],["葡萄",6],["香蕉",4],["其他",2]],"qs":[{"q":"喜歡西瓜的人比喜歡芒果的人多幾人？","opts":["2 人","1 人","3 人","8 人"],"ans":"A","steps":["西瓜 10 人，芒果 8 人","10－8＝2","→ 2 人"],"tests":"圖表數字相減","avoid":"先把兩個數字寫出來再算"},{"q":"喜歡葡萄和香蕉的人加起來，和哪一項一樣多？","opts":["芒果","其他","沒有一樣多的","西瓜"],"ans":"D","steps":["葡萄 6＋香蕉 4＝10","表中 10 人的是西瓜","→ D"],"tests":"圖表數字相加","avoid":"算完回表格找相同的數字"},{"q":"喜歡西瓜的人，占全班多少？","opts":["剛好三分之一","不到四分之一","剛好一半","超過一半"],"ans":"A","steps":["全班 30 人：三分之一是 10 人，一半是 15 人","西瓜剛好 10 人（檢查：10×3＝30）","→ 剛好三分之一"],"tests":"比例判斷","avoid":"先算出三分之一、一半是幾人再比"},{"q":"根據圖表，哪個說法有證據？","opts":["全班都很愛吃水果","喜歡香蕉的人最少","喜歡葡萄的人比喜歡香蕉的人多","喜歡西瓜的同學身體最健康"],"ans":"C","steps":["C：葡萄 6 人，香蕉 4 人，6 比 4 多 → 有證據","A：絕對字「都」，表只問「最喜歡哪一種」；B：最少的是「其他」2 人","D：表中沒有健康的資料"],"tests":"圖表推論的範圍","avoid":"圖上沒有的資料，不能拿來推論"}]},{"label":"第三篇","title":"校園一天的氣溫變化","text":["自然課時，同學在操場用溫度計，記錄某一天五個時間的氣溫。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["時間","氣溫（度）"],"per":5,"unit":"度","data":[["上午 8 點",20],["上午 10 點",24],["中午 12 點",29],["下午 2 點",31],["下午 4 點",26]],"qs":[{"q":"氣溫最高的是哪一個時間？","opts":["上午 8 點","上午 10 點","下午 4 點","下午 2 點"],"ans":"D","steps":["五個時間的氣溫：20、24、29、31、26","最大是 31","→ 下午 2 點"],"tests":"找最大值","avoid":"先把每個數字寫出來再比較"},{"q":"最高溫和最低溫差幾度？","opts":["9 度","10 度","11 度","12 度"],"ans":"C","steps":["最高：下午 2 點 31 度；最低：上午 8 點 20 度","31－20＝11","→ 11 度"],"tests":"最大值減最小值","avoid":"先找最高和最低，再相減"},{"q":"這五個時間的平均氣溫是幾度？","opts":["26 度","25 度","27 度","31 度"],"ans":"A","steps":["總和：20＋24＋29＋31＋26＝130","平均＝130÷5＝26","檢查：26×5＝130"],"tests":"計算平均","avoid":"平均＝總和÷個數，再用乘法檢查"},{"q":"根據圖表，下列哪個說法有證據？","opts":["這一天沒有下雨","有兩個時間的氣溫超過 26 度","氣溫一直越來越高","下午 4 點有同學中暑"],"ans":"B","steps":["超過 26 度的：中午 12 點 29 度、下午 2 點 31 度，共兩個 → 有證據","A、D：表中只有氣溫，沒有天氣和身體的資料","C：下午 4 點 26 度比下午 2 點低，不是一路上升"],"tests":"圖表推論的範圍","avoid":"「超過」不包含剛好等於的那一個"}]},{"label":"第四篇","title":"柴犬一週吃的零食","text":["阿哲記錄家裡的柴犬，從週一到週六每天吃了幾塊零食。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","零食（塊）"],"per":1,"unit":"塊","data":[["週一",3],["週二",2],["週三",4],["週四",2],["週五",3],["週六",6]],"qs":[{"q":"吃最多零食的是哪一天？","opts":["週三","週五","週六","週一"],"ans":"C","steps":["六天：3、2、4、2、3、6","最大是 6","→ 週六"],"tests":"找最大值","avoid":"先把每天的數字寫出來"},{"q":"哪兩天吃的一樣多，而且是最少的？","opts":["週一和週五","週三和週六","週二和週四","週一和週三"],"ans":"C","steps":["最少是 2 塊：週二、週四","週一和週五也一樣（3 塊），但不是最少","→ C"],"tests":"找最小值","avoid":"題目有兩個條件，兩個都要符合"},{"q":"週六吃的零食是週二的幾倍？","opts":["2 倍","4 倍","6 倍","3 倍"],"ans":"D","steps":["週六 6 塊，週二 2 塊","6÷2＝3","檢查：2×3＝6 → 3 倍"],"tests":"圖表數字倍數","avoid":"算倍數用除法，再用乘法檢查"},{"q":"這六天一共吃了幾塊零食？","opts":["20 塊","18 塊","16 塊","24 塊"],"ans":"A","steps":["先算週一到週五：3＋2＋4＋2＋3＝14","再加週六 6：14＋6＝20","→ 20 塊"],"tests":"圖表數字加總","avoid":"數字多時分兩段加，比較不會錯"}]},{"label":"第五篇","title":"資源回收週各類回收數量","text":["學校舉辦資源回收週，環保小組統計全校收到各類回收物的件數。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["回收物","數量（件）"],"per":5,"unit":"件","data":[["寶特瓶",60],["紙類",50],["鐵鋁罐",45],["玻璃瓶",25],["廢電池",20]],"qs":[{"q":"回收數量最少的是哪一類？","opts":["玻璃瓶","鐵鋁罐","廢電池","紙類"],"ans":"C","steps":["五類：60、50、45、25、20","最小是 20","→ 廢電池"],"tests":"找最小值","avoid":"先把每類數字寫出來再比較"},{"q":"寶特瓶的數量是廢電池的幾倍？","opts":["2 倍","3 倍","4 倍","40 倍"],"ans":"B","steps":["寶特瓶 60 件，廢電池 20 件","60÷20＝3","D 的 40 是相減的結果，不是倍數 → B"],"tests":"圖表數字倍數","avoid":"「幾倍」用除法，「多幾件」才用減法"},{"q":"紙類和鐵鋁罐加起來，比寶特瓶多幾件？","opts":["35 件","25 件","45 件","95 件"],"ans":"A","steps":["紙類 50＋鐵鋁罐 45＝95","95－60＝35","D 的 95 只是加起來的數，還沒減 → A"],"tests":"圖表數字計算","avoid":"題目有兩個步驟，兩步都要做完"},{"q":"根據圖表，哪個說法「不能」從圖中得知？","opts":["寶特瓶收到的最多","玻璃瓶比廢電池多 5 件","紙類的數量是廢電池的 2.5 倍","回收最多的班級會得到獎狀"],"ans":"D","steps":["A：寶特瓶 60 最多，有證據；B：25－20＝5，有證據","C：50÷20＝2.5，有證據","D：圖中沒有班級和獎狀的資料 → 不能得知"],"tests":"圖表推論的範圍","avoid":"選項說到圖上沒有的東西，就不能選"}]}]},{"no":"週末關卡","title":"陳太丘與友期","skill":"五步全用（綜合）","steps":["❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標","❹ 五招猜字義（先組詞）　❺ 選項代回去讀","完成後錄一支 60 秒「古文翻譯官」短片（見下一頁）"],"parts":[{"label":"第一篇","title":"陳太丘與友期","text":["陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之。元方入門不顧。"],"cite":"《世說新語．方正》","notes":"期：約定　日中：中午　舍：丟下　乃：才　尊君：您的父親　不：同「否」　委：丟下　家君：我的父親　引：拉　顧：回頭看","trans":"陳太丘和朋友約好一起出門，約在中午。過了中午朋友還沒到，太丘就不等他先走了，太丘走後朋友才到。元方當時七歲，在門外玩。客人問元方：「你父親在嗎？」元方答：「等您很久您都沒來，已經走了。」朋友就生氣地說：「真不是人！和別人約好一起走，卻丟下別人自己走了。」元方說：「您和我父親約在中午，中午沒到，就是不守信用；對著兒子罵他父親，就是沒有禮貌。」朋友覺得慚愧，下車去拉元方。元方走進家門，頭也不回。","qs":[{"q":"「太丘舍去」的「去」是什麼意思？","opts":["前往","離開","過去","去除"],"ans":"B","steps":["代回「太丘丟下朋友前往」→ 前往哪裡？讀不通","代回「太丘丟下朋友離開」→ 通","古今不同：現在「去」是前往，文言常是離開"],"tests":"古今異義","avoid":"現代意思代回去怪怪的，就想文言的意思"},{"q":"「去後乃至」是誰到了？","opts":["陳太丘","元方","陳太丘的朋友","客人的兒子"],"ans":"C","steps":["太丘已經離開了，不會是他","元方在門外玩，本來就在家","後面「客問元方」的客，就是遲到的朋友"],"tests":"補省略的主詞","avoid":"用刪去法：把不可能的人先刪掉"},{"q":"元方認為父親的朋友錯在哪裡？","opts":["遲到又不道歉","不守信用，又當著兒子的面罵父親","沒有下車","年紀比他大"],"ans":"B","steps":["找元方說的話：「日中不至，則是無信」","「對子罵父，則是無禮」","兩點都對應選項 B"],"tests":"找人物的理由","avoid":"問人物的想法，就去找那個人說的話"},{"q":"「待君久不至，已去」是誰等了很久才離開？","opts":["元方","客人","元方的母親","陳太丘"],"ans":"D","steps":["這是元方回答客人的話，「君」指客人","客人問的是「尊君在不」，元方答的是父親的情況","等很久又離開的是元方的父親陳太丘 → D"],"tests":"補省略的主詞","avoid":"對話裡的主詞，看問句問的是誰"}]},{"label":"第二篇","title":"徐孺子賞月","text":["徐孺子年九歲，嘗月下戲，人語之曰：「若令月中無物，當極明邪？」徐曰：「不然。譬如人眼中有瞳子，無此必不明。」"],"cite":"《世說新語．言語》","notes":"徐孺子：東漢人　語：告訴　若令：假如　瞳子：瞳孔","trans":"徐孺子九歲時，曾經在月光下玩，有人對他說：「如果月亮裡沒有東西，會不會更明亮呢？」徐孺子說：「不是這樣。就像人的眼睛裡有瞳孔，沒有它，眼睛一定不明亮。」","qs":[{"q":"「嘗月下戲」的「嘗」是什麼意思？","opts":["品嘗","曾經","嘗試","常常"],"ans":"B","steps":["代回「品嘗在月下玩」→ 不通","代回「曾經在月光下玩」→ 通","「常常」是「常」字，不要被字音騙"],"tests":"選項代回判斷字義","avoid":"字音一樣不代表意思一樣"},{"q":"「人語之曰」的「之」指誰？","opts":["月亮","說話的人","徐孺子","瞳子"],"ans":"C","steps":["前一句的主角是徐孺子","有人對「他」說話 → 之＝他","後面「徐曰」回答，證明對象是徐孺子"],"tests":"代詞指代＋補主詞","avoid":"看後面是誰回答"},{"q":"「不然」是什麼意思？","opts":["不是這樣","不燃燒","不必","不好"],"ans":"A","steps":["代回「不燃燒」→ 不通","代回「不是這樣」→ 通，後面接著提出自己的理由","「然」＝這樣（成語「不以為然」）"],"tests":"組詞法＋成語驗證","avoid":"「然」常常是「這樣、對的」"},{"q":"徐孺子用什麼來比喻月亮裡的東西？","opts":["月亮","太陽","星星","眼睛裡的瞳孔"],"ans":"D","steps":["「譬如」後面是比喻","「人眼中有瞳子，無此必不明」","月中的東西就像瞳孔 → D"],"tests":"找比喻","avoid":"看到「譬如」，後面就是比喻"}]},{"label":"第三篇","title":"小時了了","text":["孔文舉年十歲，隨父到洛。……元禮及賓客莫不奇之。太中大夫陳韙後至，人以其語語之，韙曰：「小時了了，大未必佳。」文舉曰：「想君小時，必當了了。」韙大踧踖。"],"cite":"《世說新語．言語》（節選）","notes":"孔文舉：孔融　洛：洛陽　中間省略的部分：孔文舉用一番巧妙的話，說自己和名士李元禮是世交　元禮：李元禮，當時的名士　陳韙：人名　了了：聰明　踧踖：侷促不安","trans":"孔文舉十歲時，跟著父親到洛陽。……（他一番巧妙的回答，讓）李元禮和賓客們沒有一個不覺得他很不簡單。太中大夫陳韙後來才到，有人把孔文舉的話告訴他，陳韙說：「小時候聰明，長大了不一定好。」孔文舉說：「想必您小時候，一定很聰明吧。」陳韙聽了非常侷促不安。","qs":[{"q":"「元禮及賓客莫不奇之」是什麼意思？","opts":["元禮和賓客沒有一個不覺得他很特別","元禮和賓客都不喜歡他","元禮和賓客覺得事情很奇怪","元禮和賓客不認識他"],"ans":"A","steps":["「莫不」＝沒有不，就是全都","「奇」＝認為……很特別（成語「嘖嘖稱奇」）","代回：大家都覺得孔文舉很不簡單 → A"],"tests":"虛詞＋成語驗證","avoid":"「莫不」是雙重否定，等於「都」"},{"q":"「人以其語語之」，是把誰的話告訴誰？","opts":["把陳韙的話告訴孔文舉","把孔文舉的話告訴陳韙","把元禮的話告訴孔文舉","把孔文舉的話告訴他父親"],"ans":"B","steps":["前面讓大家驚奇的話是孔文舉說的 →「其語」","陳韙「後至」，沒聽到，所以有人轉告「之」＝陳韙","→ B"],"tests":"補主詞與指代","avoid":"「其」「之」都要往前找人"},{"q":"「想君小時，必當了了」的「君」指誰？","opts":["李元禮","孔文舉的父親","賓客","陳韙"],"ans":"D","steps":["說話的是孔文舉，他在回應陳韙","「君」＝您，指對話的人","→ 陳韙"],"tests":"找說話對象","avoid":"「君」是「您」，看話是對誰說的"},{"q":"陳韙聽完為什麼「大踧踖」？","opts":["他忽然生病了","他遲到被主人罵","孔文舉話中暗示：陳韙小時聰明，長大卻不怎樣","他忘了帶禮物"],"ans":"C","steps":["陳韙說：小時聰明，長大未必好","孔文舉回：您小時候一定很聰明","照陳韙自己的道理，等於說他現在不好 → 很難堪 → C"],"tests":"推論人物反應","avoid":"把兩人的話放在一起看"}]},{"label":"第四篇","title":"荀巨伯遠看友人疾","text":["荀巨伯遠看友人疾，值胡賊攻郡。友人語巨伯曰：「吾今死矣，子可去！」巨伯曰：「遠來相視，子令吾去，敗義以求生，豈荀巨伯所行邪？」賊既至，謂巨伯曰：「大軍至，一郡盡空，汝何男子，而敢獨止？」巨伯曰：「友人有疾，不忍委之，寧以我身代友人命。」賊相謂曰：「我輩無義之人，而入有義之國！」遂班軍而還，一郡並獲全。"],"cite":"《世說新語．德行》","notes":"疾：病　值：剛好遇到　胡賊：外族的軍隊　郡：城　敗義：破壞道義　委：丟下　班軍：調回軍隊　獲全：得到保全","trans":"荀巨伯到遠方探望生病的朋友，剛好遇到胡人軍隊攻城。朋友對巨伯說：「我現在快死了，你可以離開！」巨伯說：「我遠道來看你，你卻叫我離開，破壞道義來求活命，難道是我荀巨伯會做的事嗎？」賊兵到了以後，對巨伯說：「大軍一到，整座城的人都跑光了，你是什麼人，竟敢一個人留下來？」巨伯說：「朋友生病，我不忍心丟下他，情願用我的性命換朋友的性命。」賊兵們互相說：「我們這些不講道義的人，卻闖進了講道義的地方！」於是撤軍回去，整座城都保全了。","qs":[{"q":"「子可去」的「子」指誰？","opts":["友人","荀巨伯","胡賊","友人的兒子"],"ans":"B","steps":["說話的是生病的友人","「友人語巨伯曰」→ 對巨伯說","子＝你，指荀巨伯；D 錯在把「子」當成兒子"],"tests":"找說話對象","avoid":"古文的「子」常是「你」，不是兒子"},{"q":"「汝何男子，而敢獨止」是誰問誰？","opts":["胡賊問荀巨伯","荀巨伯問胡賊","友人問荀巨伯","胡賊問友人"],"ans":"A","steps":["前一句「賊既至，謂巨伯曰」","說話的是賊，對象是巨伯","→ A"],"tests":"補主詞","avoid":"看「曰」前面寫誰對誰說"},{"q":"「寧以我身代友人命」的「寧」是什麼意思？","opts":["安寧","難道","寧靜","寧可、情願"],"ans":"D","steps":["代回「安寧用我的身體……」→ 不通","代回「難道用我的命……」也不通，這句不是問句","代回「情願用我的命換朋友的命」→ 通"],"tests":"選項代回判斷字義","avoid":"看句子是不是問句，再決定意思"},{"q":"胡賊最後為什麼退兵？","opts":["城裡沒有東西可搶","被大軍打敗","被荀巨伯的義氣打動，覺得自己慚愧","友人的病好了"],"ans":"C","steps":["賊說：「我輩無義之人，而入有義之國」","因為看到巨伯的義氣，自覺慚愧","接著「遂班軍而還」→ C"],"tests":"找事情的原因","avoid":"「遂」前面就是原因"}]},{"label":"第五篇","title":"華歆王朗俱乘船避難","text":["華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。朗曰：「幸尚寬，何為不可？」後賊追至，王欲舍所攜人。歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄邪？」遂攜拯如初。世以此定華、王之優劣。"],"cite":"《世說新語．德行》","notes":"俱：一起　依附：搭船同行　輒：就　難：感到為難　幸：幸好　尚寬：還寬敞　納：接受　自託：把自己託付給人　拯：救助　舍：同「捨」，丟下　優劣：好壞","trans":"華歆和王朗一起搭船逃難，有一個人想搭船同行，華歆就感到為難。王朗說：「幸好船還寬敞，為什麼不行？」後來賊兵追來了，王朗想丟下那個帶上船的人。華歆說：「我當初之所以猶豫，正是因為這個啊。既然已經接受他的託付，難道可以因為情況危急就丟下他嗎？」於是像當初一樣帶著他、救助他。世人就用這件事判斷華歆和王朗的好壞。","qs":[{"q":"「王欲舍所攜人」是誰想丟下那個人？","opts":["華歆","王朗","追來的賊","被帶上船的人"],"ans":"B","steps":["「王」指王朗","一開始說「何為不可」答應載人的，也是王朗","賊追來時想丟下人的，就是王朗"],"tests":"補主詞","avoid":"人名只寫一個字，要對回全名"},{"q":"「寧可以急相棄邪」的「寧」是什麼意思？","opts":["寧可、情願","安寧","難道","寧靜"],"ans":"C","steps":["這句結尾有「邪」，是問句","代回「難道可以因為情況危急就丟下他嗎？」→ 通","「寧可」代回變成「寧可丟下他」，和華歆的態度相反"],"tests":"一字多義＋選項代回","avoid":"句尾有「邪、乎」，「寧」常是「難道」"},{"q":"「遂攜拯如初」的「如初」是什麼意思？","opts":["像當初一樣","第一次","剛開始時很害怕","如果一開始"],"ans":"A","steps":["想成語「和好如初」：像原來一樣","代回：於是像當初一樣帶著、救助他 → 通","→ A"],"tests":"第 5 招：成語驗證字義","avoid":"組詞不夠時，再用成語幫忙"},{"q":"世人從這件事看出誰比較好？為什麼？","opts":["王朗，因為他一開始就答應幫忙","兩人一樣好","華歆，因為他從頭到尾都不想幫人","華歆，因為答應前謹慎，答應後就負責到底"],"ans":"D","steps":["華歆一開始「難之」，因為怕危急時顧不了：「本所以疑，正為此耳」","答應後危急時也不肯丟下：「遂攜拯如初」","王朗先答應後想丟下 → 華歆較好 → D；C 錯在他最後有幫"],"tests":"比較人物＋主旨","avoid":"比較兩人前後的做法變化"}]}],"demo":{"q":"「客問元方」的「客」是誰？","a":["往前找：太丘走了以後，「去後乃至」的是約好的朋友","到了門口、問元方話的，就是這位朋友","答：陳太丘的朋友"]}}],"teach":[{"intro":"這一組學兩件事：看懂題目在問什麼，還有找出句子裡「是誰」在做事。","items":[{"t":"什麼是「題幹」？","d":["題目裡問問題的那一句，就叫題幹。","例：「『因釋其耒而守株』是誰放下農具？」這整句就是題幹，它告訴你：這題要找「誰」。"],"ex":"先看題幹，就像比賽前先知道要守哪一個人，才不會亂跑。"},{"t":"什麼是「主詞」？","d":["一句話裡「做動作的那個人或東西」。","例：「玗樊投籃」——投籃的是玗樊，玗樊就是主詞。「兔子撞樹」——撞樹的是兔子，兔子就是主詞。"]},{"t":"文言文為什麼常常沒有主詞？","d":["古人把字刻在竹片上，很費工夫，所以前面講過的人，後面就省略不寫。"],"ex":"就像你在球場對隊友喊「傳！」不用說「你把球傳給我」，大家都知道是誰。"},{"t":"怎麼把主詞補回來？","d":["往前一句找，最近出現的人或動物，通常就是主詞。","找到後，直接用鉛筆寫在那句旁邊，讀的時候就不會搞混。"]}],"demo":["原文：「兔走觸株，折頸而死」","「折頸而死」沒有寫誰 → 往前一句看到「兔」","在旁邊寫上「兔」→ 兔子折斷脖子死了"]},{"intro":"這一組學兩個讀懂字義的工具：虛詞告訴你句子怎麼接，五招幫你猜出不認識的字。","items":[{"t":"什麼是「虛詞」？","d":["本身不代表人、東西或動作的字，像「而、故、乃、之」。","它們的工作是告訴你：前後兩句怎麼連在一起。"],"ex":"就像教練的戰術手勢：手勢不是球員，但它告訴大家球要往哪裡跑。"},{"t":"「而」怎麼判斷？","d":["把「而」分別換成「然後」和「但是」，各讀一次，哪個通就是哪個。","前後同方向 → 然後：「學而時習之」＝學了，然後常常複習。","前後相反 → 但是：「舟已行，而劍不行」＝船走了，但是劍沒走。"]},{"t":"其他常見虛詞","d":["故＝所以（後面是結果）　乃＝才、於是　之＝的、他、它"]},{"t":"不認識的字：五招由易到難","d":["一招不通就換下一招，每一招最後都要把意思代回原句讀讀看。"],"ex":"就像投籃：上籃不進就換跳投，但每一球都要看有沒有進。"},{"t":"第 1 招　組詞法（先試）","d":["把字套成現代常用的兩字詞，一個一個代回原句，看哪個讀得通。","「其劍自舟中墜於水」→ 墜落 → 劍從船上掉落到水裡，通 ✔","「恭勤不倦」→ 疲倦 → 認真勤快，不覺得疲累，通 ✔","「使弈秋誨二人弈」→ 教誨 → 讓弈秋教導兩個人下棋，通 ✔"]},{"t":"第 2 招　組詞不通，換招再驗證","d":["什麼時候用：組詞代回去讀不順、不合理，或好幾個選項好像都通。","① 確認組詞真的不通：代回去讀，不順或不合理，就是「古今意思不一樣」的字。","② 看他在做什麼、為什麼：找出人物、動作、目的，目的會告訴你答案的方向。","③ 換別的方法驗證：看部首、想成語、比對稱句，至少兩種方法指向同一個答案。","④ 代回原句再讀一次，通了才是答案。","示範「欲負而走」的「走」：組詞「走路」→ 代回「想背著鐘走路」，但選項有「跑」，要驗證。","看目的：他撿到別人家的鐘，怕被發現，「想要」背了就趕快離開；後面「鐘大不可負」說明鐘太重背不動，所以才把鐘敲碎。","成語驗證：「奔走相告」「走馬看花」的走都是跑 → 代回「想背著鐘逃跑」，通 ✔","要記住：走（跑）、去（離開）、湯（熱水）、兵（武器）這類古今意思不同的字最常考，組詞法最容易被騙，一定要用第 2 招驗證。"]},{"t":"第 3 招　看部首","d":["部首常常透露意思的方向：扌和手的動作有關、氵和水有關、目和看有關、忄和心情有關、言和說話有關。","「誨」是言部，和說話、教人有關；「償」是人部加「賞」，和給錢回報有關。","部首不能直接定答案，但可以先刪掉不可能的選項。"]},{"t":"第 4 招　比對稱句","d":["文言文常有兩句對仗，同一個位置的字，意思相近或相反。","「溫故而知新」：故對新 → 故＝舊的。"]},{"t":"第 5 招　想成語（備用）","d":["前四招都不行，再想一個有這個字的成語，把成語裡的意思帶回來。","「求」→ 緣木求魚＝爬到樹上找魚 → 求＝尋找。","成語會跟著閱讀慢慢累積，不會的話不用急。"]}],"demo":["原文：「衡乃與其傭作而不求償」","第 1 招組詞：賠償、補償、報償 → 代回：匡衡幫人做工，卻不要求報酬，讀得通","第 3 招驗證：人部加「賞」，和給錢、回報有關 → 償＝報酬"]},{"intro":"這一組學做選擇題最好用的方法：把選項放回句子裡試試看。","items":[{"t":"什麼是「選項代回去」？","d":["把選項的解釋，放進原來的句子，取代那個字，從頭讀一遍。"],"ex":"就像買球鞋要每雙都試穿，合腳的才買，不是看起來好看就買。"},{"t":"為什麼要代回去？","d":["一個字常常有好幾個意思，錯的選項通常也是那個字「真的有」的意思。","例：「亡」可以是死亡、逃走、失去，三個都對，但放進「終亡其酒」只有「失去」說得通。","所以只看選項本身會被騙，一定要放回句子。"]},{"t":"怎樣算「讀得通」？","d":["① 句子讀得懂　② 和前後故事不衝突　③ 符合常識（例：蛇本來就沒有腳）"]}],"demo":["題目：「蛇固無足」的「固」？（堅固／本來／固執）","代回：「蛇堅固沒有腳」不通；「蛇固執沒有腳」不通","「蛇本來就沒有腳」通 → 答：本來"]},{"intro":"這一組換成白話文章，學會「每個答案都要從文章裡找到證明」。","items":[{"t":"什麼是「證據句」？","d":["文章裡能證明答案是對的那一句。選答案前，要能用手指指出來：在第幾段、哪一句。"],"ex":"就像裁判要看到犯規才能吹哨，不能用猜的。"},{"t":"什麼是「轉折詞」和「總結詞」？","d":["轉折詞：但是、然而、其實、不過。前面先講一件事，後面要轉彎，作者真正想說的通常在轉彎之後。","總結詞：所以、因此、可見、總之。後面接的是作者的結論。","看到這些詞，就在後面那句畫線。"]},{"t":"什麼是「絕對字」？","d":["說得很滿、沒有例外的字：都、一定、只、所有、完全、從不。","真實世界很少「全部都這樣」，所以選項出現這些字要特別小心，一定要回文章確認。","注意：不是有絕對字就一定錯，文章真的這樣寫就是對的。"]},{"t":"什麼是「摘要」？","d":["用一句話說出整篇在講什麼：講了什麼事＋為什麼。","只講到其中一段的，是「細節」，不是摘要。"]}],"demo":["材料（〈籃球的三秒規則〉第一段開頭）：「在籃球場上，籃框前方有一塊顏色不同的長方形區域，叫做『限制區』。」","題目：限制區在球場的哪裡？","題目問「哪裡」→ 在材料裡找位置：「籃框前方」","找得到證據句 → 答：籃框前方"]},{"intro":"會考常出圖表題，自然、社會也會考。這一組學看圖表的固定順序。","items":[{"t":"標題和單位","d":["標題：這張圖在講什麼。","單位：數字的身分，是「人」、「小時」還是「%」。單位看錯，整題就錯。"],"ex":"就像記分板：要先知道哪一欄是得分、哪一欄是犯規，才看得懂數字。"},{"t":"趨勢、最大值、最小值","d":["趨勢：哪裡多、哪裡少，是越來越多還是越來越少。","最大值、最小值：最高和最低的那一格，很多題目直接考這個。"]},{"t":"「以上」「以下」包含哪些？","d":["「3 小時以上」＝ 3～4 小時這一組，加上 5 小時以上這一組，兩組都要算進去。"]},{"t":"圖上沒有的，不能推","d":["圖只有「人數」，就不能說「成績比較好」或「明年會增加」，因為圖裡沒有這些資料。"]}],"demo":["材料：老師調查全班 30 人一週課外閱讀時間。表頭：「每週閱讀時間｜人數（人）」，第一列「0 小時｜3」","題目：這張表的數字單位是什麼？","看表頭括號：「人數（人）」→ 答：人（3 就是 3 個人）"]},{"intro":"週末關卡把前面學的全部合在一起用，另外再學一個新觀念：古今異義。","items":[{"t":"偵查五步是什麼？","d":["就是第 1～3 組學過的招式，按順序用：","❶ 先看題幹　❷ 圈人物、補主詞　❸ 虛詞當路標　❹ 五招猜字義（先組詞）　❺ 選項代回去讀"]},{"t":"什麼是「古今異義」？","d":["同一個字，古代和現在的意思不一樣。","「去」：現在是「前往」（去學校），古代常是「離開」。","「走」：現在是「走路」，古代是「跑」。"],"ex":"就像「鬥牛」：現在是三對三打籃球，原本是指牛和牛打架，同一個詞意思變了。"},{"t":"怎麼發現是古今異義？","d":["用現在的意思放回去，讀起來怪怪的 → 就換古代的意思再讀一次。"]}],"demo":["原文：「太丘舍去」","用現在的意思：「太丘丟下朋友前往」→ 前往哪裡？怪怪的","換古代意思「離開」→ 太丘丟下朋友離開了 → 通"]}],"daily":[{"words":[["走","跑","奔走相告"],["冀","希望","冀望"]],"line":"兔不可復得，而身為宋國笑。"},{"words":[["求","尋找","緣木求魚"],["遽","急忙","遽然"]],"line":"舟已行矣，而劍不行。"},{"words":[["固","本來","固有"],["亡","失去","亡羊補牢"]],"line":"蛇固無足，子安能為之足？"},{"words":[["安","怎麼","子安能為之足"],["遂","於是、就","遂飲其酒"]],"line":"為蛇足者，終亡其酒。"},{"words":[["期","約定","不期而遇"],["顧","回頭看","義無反顧"]],"line":"日中不至，則是無信。"},null],"quiz":{"words":[["走","跑","兔走觸株"],["冀","希望","冀復得兔"],["求","尋找","從其所契者入水求之"],["遽","急忙","遽契其舟"],["固","本來","蛇固無足"],["亡","失去","終亡其酒"],["安","怎麼","子安能為之足"],["遂","於是、就","遂飲其酒"],["期","約定","陳太丘與友期行"],["顧","回頭看","元方入門不顧"]],"lines":[["兔不可復得，","而身為宋國笑。"],["舟已行矣，","而劍不行。"],["蛇固無足，","子安能為之足？"],["為蛇足者，","終亡其酒。"],["日中不至，","則是無信。"]],"parts":[{"label":"第一篇","title":"鄭人買履","text":["鄭人有且置履者，先自度其足，而置之其坐。至之市，而忘操之。已得履，乃曰：「吾忘持度。」反歸取之。及反，市罷，遂不得履。人曰：「何不試之以足？」曰：「寧信度，無自信也。」"],"cite":"《韓非子．外儲說左上》","notes":"且：將要　履：鞋子　度：（動詞）量；（名詞）量好的尺碼　坐：同「座」　操、持：拿　反：同「返」　市罷：市場收攤","trans":"鄭國有個想要買鞋的人，先自己量好腳的尺寸，把量好的尺碼放在座位上。到了市場，卻忘了帶尺碼。他已經挑好鞋子，才說：「我忘了帶尺碼。」就回家去拿。等他回到市場，市場已經收攤，結果沒買到鞋。有人問他：「為什麼不用自己的腳試穿呢？」他說：「我寧可相信量好的尺碼，也不相信自己的腳。」","qs":[{"q":"「反歸取之」是誰回家去拿？","opts":["賣鞋的人","想買鞋的鄭國人","市場的人","問他話的人"],"ans":"B","steps":["往前找：「已得履，乃曰……」都是想買鞋的人","中間沒有換人","所以回家的是想買鞋的鄭國人"],"tests":"補省略的主詞","avoid":"一連串動作沒換人，主詞就沿用前面的"},{"q":"「遂不得履」的「遂」是什麼意思？","opts":["於是、結果","順利","跟隨","完成"],"ans":"A","steps":["本週背過：遂＝於是、就","代回：「市場收攤了，結果沒買到鞋」→ 通","「順利沒買到鞋」不通"],"tests":"本週字義：遂","avoid":"背過的字，先用背過的意思代回"},{"q":"這個鄭國人錯在哪裡？","opts":["忘記帶錢","只相信量好的尺碼，不相信自己的腳","走太慢","不喜歡新鞋"],"ans":"B","steps":["找他自己說的話：「寧信度，無自信也」","寧可相信尺碼，也不相信自己","腳就在身上，卻還回家拿尺碼 → B"],"tests":"找人物的理由","avoid":"問人物的想法，就去找那個人說的話"},{"q":"「且置履」和「置之其坐」的兩個「置」，意思分別是？","opts":["都是放置","都是購買","前一個是購買，後一個是放置","前一個是放置，後一個是購買"],"ans":"C","steps":["代回「將要購買鞋子」→ 通，題目說他想買鞋","代回「把它放在座位上」→ 通，「之」是量好的尺碼","兩個「置」意思不同 → C"],"tests":"一字多義","avoid":"同一個字出現兩次，要分開代回"},{"q":"「何不試之以足」的「之」指什麼？","opts":["市場","尺碼","腳","鞋子"],"ans":"D","steps":["問話的人建議他「用腳試一試」","要試的東西是鞋子 → 之＝鞋","C「足」是用來試的工具，不是被試的東西"],"tests":"虛詞「之」指代","avoid":"「之」代替的是被做動作的東西"}]},{"label":"第二篇","title":"不恥下問","text":["子貢問曰：「孔文子何以謂之文也？」子曰：「敏而好學，不恥下問，是以謂之文也。」"],"cite":"《論語．公冶長》","notes":"子貢：孔子的學生　孔文子：衛國的大夫　何以：為什麼　文：一種美好的稱號","trans":"子貢問：「孔文子為什麼被稱為『文』呢？」孔子說：「他聰明又喜歡學習，不覺得向不如自己的人請教是丟臉的事，所以稱他為『文』。」","qs":[{"q":"「子曰」的「子」指誰？","opts":["子貢","孔文子","孔子","孔文子的兒子"],"ans":"C","steps":["《論語》裡單說「子曰」，指的是孔子","子貢是發問的人，不會自問自答","→ 孔子"],"tests":"補出說話的人","avoid":"問答題要分清楚誰問、誰答"},{"q":"「敏而好學」的「敏」是什麼意思？","opts":["敏感","聰明、反應快","過敏","生氣"],"ans":"B","steps":["想詞語「機敏」：聰明、反應快","代回：聰明又喜歡學習 → 通","「敏感、過敏」代回不通"],"tests":"組詞法猜字義","avoid":"想一個常用詞，再代回原句"},{"q":"「敏而好學」的「而」是什麼意思？","opts":["而且、又","但是","如果","所以"],"ans":"A","steps":["前：聰明","後：喜歡學習","兩個都是優點，同方向 → 而且"],"tests":"虛詞「而」","avoid":"「而」前後同方向，就不是「但是」"},{"q":"「不恥下問」是什麼意思？","opts":["不好意思開口問問題","不要在台下問問題","認為問問題很丟臉","不覺得向不如自己的人請教是丟臉的事"],"ans":"D","steps":["「恥」＝認為……丟臉（詞語「可恥」）","「下問」＝向地位或學問比自己低的人請教","代回 → D；C 和「不恥」意思相反"],"tests":"成語句意","avoid":"把成語拆成兩半，各自翻譯再接起來"},{"q":"孔文子為什麼被稱為「文」？","opts":["他很會寫文章","聰明好學，又不怕向別人請教","他是孔子的老師","子貢很喜歡他"],"ans":"B","steps":["找孔子的回答：「敏而好學，不恥下問，是以謂之文也」","「是以」＝所以，前面就是原因","→ B；A 是今天「文」的意思，文中沒有"],"tests":"找原因","avoid":"「是以、故」前面就是原因"}]}]},"cap":{"no":"會考實戰","title":"第 1 週會考實戰","skill":"會考解題技法：認識會考＋字音字形、錯別字","steps":["❶ 會考國文共 42 題，全部四選一，分單題和題組，先看題目問「正確」還是「錯誤」","❷ 形近字：看部首，部首會告訴你這個字跟什麼有關","❸ 音近字：把字放回整個詞語，想詞語的意思，意思不通就是錯字","❹ 破音字：先看這個字在句子裡當動詞還是名詞，意思不同，讀音也不同"],"demo":{"q":"示範題：【113 年會考第 8 題】下列文句「」中的字，何者讀音正確？（甲）在賣場集滿點數就可「兌」換商品：ㄩㄝˋ（乙）一望無「垠」的海面上漂流著幾艘小船：ㄍㄣ（丙）這場音樂會的門票開賣不久就售「罄」：ㄑㄧㄥˋ（丁）櫃檯上的花瓶插了一束紫色的「桔」梗花：ㄓㄜˊ","a":["→ 先看題目最後一句：問「讀音正確」，要找唯一對的那一個","→ 別被聲旁騙：兌換念ㄉㄨㄟˋ，不是悅的ㄩㄝˋ；無垠念ㄧㄣˊ，不是根的ㄍㄣ；桔梗念ㄐㄧㄝˊ，不是哲的ㄓㄜˊ","→ 售罄＝賣光了，罄念ㄑㄧㄥˋ，注音正確","答：這場音樂會的門票開賣不久就售「罄」：ㄑㄧㄥˋ"]},"teach":{"intro":"第一次正式見會考：先認識它長什麼樣，再學最好拿分的字音字形題。","items":[{"t":"什麼是「會考國文」？","d":["國中三年級考的國中教育會考，國文 42 題、考 70 分鐘，每題都是四選一，答錯不倒扣。","前面是「單題」（一段話考一題），後面是「題組」（一篇文章考兩、三題）。題目有時問「正確」，有時問「錯誤、最不可能」，一定要先看清楚。"],"ex":"像籃球比賽有規則：上場前先知道一節幾分鐘、怎麼算分，才不會犯規。"},{"t":"什麼是「形近字」？","d":["長得很像、只差一個部首的字，例如「竣」和「峻」、「藩」和「蕃」。","看部首判斷：部首通常說出意思，「氵」跟水有關，「扌」跟手有關，「忄」跟心情有關。"],"ex":"像柴犬和秋田犬長得很像，但看耳朵、體型就分得出來，部首就是字的耳朵。"},{"t":"什麼是「音近字」？","d":["讀音一樣或很像、意思不同的字，例如「趕盡殺絕」常被寫成「趕進殺絕」。","把字放回整個詞語，問自己「這個字在這裡是什麼意思」：盡是全部，進是往前，殺光是全部，所以用盡。"],"ex":"像隊上兩個同學名字念起來一樣，要看是誰在做什麼才知道叫的是哪一個。"},{"t":"什麼是「破音字」？","d":["同一個字有兩個以上的讀音，讀音不同，意思也不同。例如「落」平常念ㄌㄨㄛˋ，在「丟三落四」念ㄌㄚˋ。","看這個字在句子裡的意思和詞性：當動詞、名詞，讀音可能不一樣，先把意思想清楚再決定念法。"],"ex":"像「投」籃和「投」票都是投，但動作完全不同；破音字是連聲音都換掉了。"}],"demo":["①先看題目最後一句：問「讀音正確」，只有一個是對的","②一個一個把詞念出來：兌換、無垠、售罄、桔梗，別只念半邊","③兌、垠、桔都被聲旁騙了，只有「罄」念ㄑㄧㄥˋ是對的"]},"parts":[{"label":"第一篇","title":"113 年會考 第 2、6、16 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 2、6、16 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列文句，何者用字完全正確？","opts":["那張字畫的真跡被竊後，至今不知所衷","他只知言襲前人作法，完全不懂得變通","你去失誤招領處詢問，也許能找回錢包","樹欲靜而風不止，為人子女盡孝要及時"],"ans":"D","steps":["用「音近字代回詞語」：把每個可疑的字放回整個詞，想想這個詞原本的意思。","「不知所衷」應是「不知所終」（不知道最後到哪裡去）；「言襲」應是「沿襲」（照著舊的做）；「失誤招領」應是「失物招領」（撿到的東西）。","只剩「樹欲靜而風不止」完全正確，所以選它。"],"tests":"音近字辨別","avoid":"同音字放回詞語想意思"},{"q":"下列詞語中的「落」字，何者與「月落星沉」的「落」字意義相同？","opts":["下「落」不明","草木疏「落」","丟三「落」四","水「落」石出"],"ans":"D","steps":["用「組詞代回」：「月落星沉」的落是「往下降、沉下去」。","下落不明的落是「去處」；草木疏落的落是「稀少零散」；丟三落四的落念ㄌㄚˋ，是「遺漏、忘了帶」（破音字，意思也跟著變）。","水落石出是「水位下降，石頭露出來」，也是往下降，所以選它。"],"tests":"一字多義","avoid":"每個落都組詞代回再比"},{"q":"下列文句中的詞語，何者使用最恰當？","opts":["飲食應注重營養均衡，五穀不分才健康","這房子經歷風災依然堅固，真是不愧屋漏","使用儀器以蠡測海後，他終於得到準確數據","對於行將就木之人，世間的一切已無須牽掛"],"ans":"D","steps":["用「拆字面意思」：五穀不分＝分不清農作物，是說人不懂農事，不是飲食均衡。","不愧屋漏＝一個人獨處暗室也不做虧心事，是說品德，不是房子堅固；以蠡測海＝用瓢量大海，比喻見識淺，不可能得到準確數據。","行將就木＝快要進棺材，指年老將死的人，句子用得對，所以選它。"],"tests":"成語望文生義","avoid":"成語先查本義別照字面猜"}]},{"label":"第二篇","title":"114 年會考 第 14、16 題（單題）","text":[],"cite":"114 年國中教育會考國文科 第 14、16 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列文句「」中的字，何者讀音正確？","opts":["有些玩笑話沒拿捏好分寸，就可能變成「揶」揄：ㄧㄝˊ","這家賣場備有各種「晾」晒工具，提供消費者選購：ㄐㄧㄥ","這齣音樂劇結合不同族群的元素，打破文化的「藩」籬：ㄆㄢ","原以為勝券在握，卻因一時疏忽，竟從雲端「栽」了下來：ㄘㄞˊ"],"ans":"A","steps":["用「別只看半邊」：形聲字的聲旁常會騙人，要一個一個念出完整的詞。","晾晒的晾念ㄌㄧㄤˋ，不是京的ㄐㄧㄥ；藩籬的藩念ㄈㄢˊ，不是番的ㄆㄢ；栽跟頭的栽念ㄗㄞ，不是才的ㄘㄞˊ。","揶揄（開玩笑地嘲弄）念ㄧㄝˊ ㄩˊ，注音正確，所以選它。"],"tests":"字音辨識","avoid":"有邊讀邊要小心再查一次"},{"q":"下列文句，何者用字完全正確？","opts":["所謂有志竟成，努力必能得到回報","得饒人處且饒人，你何必趕進殺絕","想到他的處境，我情不自盡地落淚","眼不見為靜，把雜物塞進櫃子就好"],"ans":"A","steps":["用「音近字代回詞語」：把每個成語的字拆開想意思。","「趕進殺絕」應是「趕盡殺絕」（全部殺光）；「情不自盡」應是「情不自禁」（禁＝忍住）；「眼不見為靜」應是「眼不見為淨」（淨＝乾淨）。","「有志竟成」（有志向終究會成功）用字正確，所以選它。"],"tests":"成語錯別字","avoid":"同音字代回成語想字義"}]},{"label":"第三篇","title":"114 年會考 第 13、19 題（單題）","text":[],"cite":"114 年國中教育會考國文科 第 13、19 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"下列文句中的語詞，何者使用最恰當？","opts":["他奮力救人的義舉，淪為一段佳話","我如此盡心，既然得到這樣的待遇","此建案已延宕多時，如今終於竣工","那件事能夠完成，不愧有你的幫忙"],"ans":"C","steps":["用「看褒貶與語氣」：淪為是往壞處掉，不能接佳話，應說「傳為佳話」。","「既然」要接「就」，這裡想表達意外，應用「竟然」；「不愧」是稱讚名副其實，這裡應說「多虧有你的幫忙」。","延宕＝拖延，竣工＝工程完成，前後意思通順，所以選它。"],"tests":"詞語運用","avoid":"先看詞語是好是壞再代回"},{"q":"下列文句中的詞語，何者使用最恰當？","opts":["這部電影的戰爭場面逼真，其慘烈不可名狀","他表面上雖然毫不在乎，但心裡卻不以為意","他的心情不言而喻，大家都不知他是喜是怒","長官對此事不置可否，讓下屬有明確的方向"],"ans":"A","steps":["用「看前後有沒有打架」：不以為意＝不放在心上，跟「表面毫不在乎，但心裡卻…」前後意思一樣，轉折說不通。","不言而喻＝不用說就明白，卻接「大家都不知」；不置可否＝不說好也不說不好，卻接「有明確的方向」，都前後矛盾。","不可名狀＝無法用言語形容，用來說戰爭場面慘烈很恰當，所以選它。"],"tests":"成語運用","avoid":"成語代回看前後是否矛盾"}]},{"label":"第四篇","title":"113 年會考 第 17、19 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 17、19 題（國家教育研究院心測中心）","notes":"","trans":"第 17 題：求學的人想要達到聖賢的境界，就像射箭的人想要射中靶心。不把聖賢當作目標而去求學，就是不立靶心就射箭的人。第 19 題：蝸牛因為留下黏液而被找到，蟬因為叫聲而被黏捕，螢火蟲因為發光而被抓住。所以愛惜自己的人，不看重顯赫的名聲。","qs":[{"q":"下列選項中的文字，旨在強調求學必須先立定志向。依據文意判斷，何者斷句最恰當？","opts":["夫學者之欲至於聖賢猶射者，之求中夫正鵠也。不以聖賢為準的而學者是，不立正鵠而射者也。","夫學者之欲至於聖賢，猶射者之求中夫正鵠也。不以聖賢為準的而學者，是不立正鵠而射者也。","夫學者之欲，至於聖賢猶射者之求中。夫正鵠也，不以聖賢為準的，而學者是不立正鵠而射者也。","夫學者之欲至，於聖賢猶射者之求。中夫正鵠也不以聖賢為準，的而學者是不，立正鵠而射者也。"],"ans":"B","steps":["用「找對稱句」：「學者之欲至於聖賢」對上「射者之求中夫正鵠」，學者對射者，聖賢對正鵠（靶心）。","「猶」是「好像」，要放在兩半句中間，前面斷開；「是」是「這就是」，要放在後半句開頭。","只有第二個選項照這樣斷，兩句都通順，所以選它。"],"tests":"文言斷句","avoid":"先找兩兩相對的句子再斷"},{"q":"「蝸以涎見覓，蟬以聲見黏，螢以光見獲。故愛身者，不貴赫赫之名。」這句話的涵義與下列何者最接近？","opts":["人過留名，雁過留聲","所榮者善行，所恥者惡名","名不可簡而成，譽不可巧而立","樹大招風風損樹，人為名高傷喪身"],"ans":"D","steps":["用「代回白話」：蝸牛因黏液、蟬因叫聲、螢火蟲因亮光，反而被人找到、抓走。","結論是「愛身者，不貴赫赫之名」：愛惜自己就不要追求太大的名聲，因為太顯眼會招來傷害。","「樹大招風、名高傷身」講的正是太顯眼會受傷，所以選它；其他三個都在講要留名或怎麼得到好名聲。"],"tests":"文言文意理解","avoid":"先翻成白話再找同意思"}]},{"label":"第五篇","title":"114 年會考 第 10、18、20 題（單題）","text":[],"cite":"114 年國中教育會考國文科 第 10、18、20 題（國家教育研究院心測中心）","notes":"","trans":"第 10 題：蜜蜂造的蜜，出自山崖、土洞的占十分之八，人家養蜂取蜜的占十分之二。北方乾燥，土洞裡的蜜大多出在這裡；南方低溼，所以有山崖的蜜而沒有土洞的蜜。西北占了天下的一半，大概可以和甘蔗汁比個高下。第 18 題：朋友搬家雖然靠近城郭，小路卻通進桑麻田裡。最近才在籬笆邊種了菊花，到了秋天還沒開花。敲門沒有狗叫，想離開前去問西邊的鄰居。鄰居回答他上山去了，每天回來都已經太陽西斜。第 20 題：太祖為了某事責備丞相李善長，劉基說：「善長是有功的老臣，能調和各位將領。」太祖說：「他好幾次想害你，你竟然替他說話？我要讓你當丞相了。」劉基磕頭說：「這就像換柱子，必須用大木頭。如果把小木頭綁在一起當柱子，很快就會倒塌。」","qs":[{"q":"「蜂造之蜜出山崖、土穴者十居其八，而人家招蜂造釀而割取者，十居其二也。北方乾燥，土穴所釀多出於此。南方卑溼，故有崖蜜而無穴蜜。西北半天下，蓋與蔗漿分勝云。」根據本文，下列推論何者最恰當？","opts":["穴蜜多產於乾燥之處","崖蜜多為人工養育而來","卑溼之地沒有天然的蜂造之蜜","西北蜂蜜產量是東南蔗漿的一半"],"ans":"A","steps":["用「回原文找證據」：原文說「北方乾燥，土穴所釀多出於此」，土洞裡的蜜大多出在乾燥的北方。","崖蜜是山崖上天然的，人工養的只占十分之二；南方低溼「有崖蜜」，不是沒有天然蜜；「西北半天下」是說西北占天下一半，不是蔗漿的一半。","只有「穴蜜多產於乾燥之處」有證據，所以選它。"],"tests":"文言推論","avoid":"每個選項都要對到原句"},{"q":"皎然〈尋陸鴻漸不遇〉：「移家雖帶郭，野徑入桑麻。近種籬邊菊，秋來未著花。扣門無犬吠，欲去問西家。報道山中去，歸來每日斜。」根據本詩，作者此次訪友之行曾看見下列何者？","opts":["荒蕪的農地","盛開的菊花","歸來的鴻漸","鴻漸的鄰居"],"ans":"D","steps":["先看題目：題目是〈尋陸鴻漸不遇〉，「不遇」就是沒見到朋友，所以「歸來的鴻漸」先刪掉。","「秋來未著花」是菊花還沒開；「野徑入桑麻」是種著桑麻的田，不是荒蕪。","「欲去問西家。報道山中去」是去問西邊鄰居，鄰居回答他上山了，代表作者見到了鄰居，所以選它。"],"tests":"詩句細節","avoid":"題目的不遇也是線索"},{"q":"太祖以事責丞相李善長，劉基言：「善長勛舊，能調和諸將。」太祖曰：「是數欲害汝，汝竟為之言耶？吾將相汝矣。」基頓首曰：「是如易柱，須得大木。若束小木為之，且立覆。」\n關於文中人物的敘述，下列何者最恰當？","opts":["太祖因多次陷害劉基而心存愧疚","太祖想以李善長替代劉基為丞相","劉基認為李善長調和諸將就像束小木","劉基認為李善長比自己適合擔任丞相"],"ans":"D","steps":["用「補主詞」：「是數欲害汝」的「是」指李善長，是李善長多次想害劉基，不是太祖；「吾將相汝矣」是太祖要讓劉基當丞相。","劉基說換丞相像換柱子，「須得大木」，大木指李善長這樣的老臣；「束小木」是說換上分量不夠的人（劉基也把自己算在裡面），撐不起來，很快就倒。","所以劉基認為李善長比自己適合當丞相，選它。"],"tests":"人物關係與比喻","avoid":"先補主詞再看比喻指誰"}]},{"label":"第六篇","title":"113 年會考 第 15、23 題（單題）","text":[],"cite":"113 年國中教育會考國文科 第 15、23 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"「溝通包含了三要素：內容、語調、非語言行為。若某人說話時的語調、手勢、表情，和他所說的內容不一致或情境模糊時，人們比較容易受到語調和非語言行為的影響。」下列情境，何者最符合這段文字的內容？","opts":["說話用字過度簡潔，會讓人覺得沒有禮貌","同樣的內容，由嚴肅的老師說出來比較具有說服力","朋友收到禮物時臭著臉說「謝謝」，會覺得他其實並不開心","聽廣播時，因看不到主持人的表情、手勢，無法判斷內容的真實性"],"ans":"C","steps":["先圈關鍵：條件是「內容」和「表情、語調」不一致，結果是人們比較相信表情、語調。","找符合的情境：嘴巴說「謝謝」（內容），臉卻是臭的（表情），兩個不一致。","大家會相信臭臉，覺得他不開心，正好符合，所以選它；其他選項都沒有內容與表情不一致的情況。"],"tests":"條件對應情境","avoid":"先找出條件再配情境"},{"q":"目前因鰲鼓溼地水位升高，使黑面琵鷺棲息處距離賞鳥亭長達300多公尺。往年低水位時，會浮出大片沙洲，黑面琵鷺棲息在賞鳥亭前約50公尺處。今年若要觀賞牠們，務必攜帶高倍望遠鏡。\n賞鳥期從11月1日到明年2月18日，期間逢假日8時至16時將實施管制，進入溼地的車輛從原本可自由進出南、北閘門，改為北閘門進，南閘門出。\n根據本文，下列關於鰲鼓溼地賞鳥的敘述，何者最恰當？","opts":["水位越低時，越需要使用高倍望遠鏡觀察","黑面琵鷺的棲地會隨著賞鳥亭的位置改變","賞鳥期間進入溼地的車輛全天候均須管制","非假日到溼地賞鳥，車輛可從南閘門進入"],"ans":"D","steps":["用「逐字核對」：管制只在「假日8時至16時」，不是全天候。","水位「升高」鳥才離得遠，要望遠鏡，不是水位越低；鳥是因水位改變位置，不是因賞鳥亭。","非假日不管制，車輛照原本「可自由進出南、北閘門」，所以可從南閘門進，選它。"],"tests":"公告條件核對","avoid":"時間條件與例外逐字看"}]},{"label":"第七篇","title":"114 年會考 第 2、11 題（單題）","text":[],"cite":"114 年國中教育會考國文科 第 2、11 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"「清代驗屍跟現代不同，驗屍一定是在『屍所』，即屍體所在之處，可能是案發現場，也可能是陳屍處。清代的程序非常強調在屍所驗屍，禁止將屍體帶到他處檢驗。同時十分強調涉案人、關係人和家屬必須在場，一般大眾也可以圍觀。目的在於使驗屍過程中，關於屍傷屍狀的觀察都能夠『公同一干人眾，質對明白』。」若要拍攝清代刑案電視劇，下列情節何者最符合本文的敘述？","opts":["將屍體從案發現場帶至衙門驗屍","官府開始驗屍時，家屬必須到場","驗屍時將一干閒雜人等驅離現場","家屬要求確認結果，被斷然拒絕"],"ans":"B","steps":["用「回原文找證據」：原文說「涉案人、關係人和家屬必須在場」。","「禁止將屍體帶到他處」所以不能帶去衙門；「一般大眾也可以圍觀」所以不會趕人；目的是大家「質對明白」，所以不會拒絕家屬確認。","只有「家屬必須到場」完全符合，選它。"],"tests":"細節核對","avoid":"選項和原文要逐句對"},{"q":"「旅行回來，一篇遊記常要寫上許久，有的終究沒寫成。有時不知怎麼濃縮剪裁，最後只是一片凌亂的札記和草稿。那些沒寫出來的，只好留待時間去處理了。⟦時間如果不是個偉大的作者，起碼是個傑出的編輯。⟧也許它最後會告訴我：不寫也罷！」根據文意脈絡，關於畫線處文句的解讀，下列何者最恰當？","opts":["真正優秀的作品，經得起時間的考驗","要寫出一篇好遊記，作者比編輯更重要","成為傑出的編輯，需要時間與經驗的累積","經過時間的沉澱，自然能釐清值得寫的是什麼"],"ans":"D","steps":["看前後文：作者不知道怎麼「濃縮剪裁」，只好「留待時間去處理」。","編輯的工作就是挑選、刪減；把時間比成編輯，就是時間會幫他挑出值得寫的，後面還說「不寫也罷」，代表有些可以刪掉。","所以意思是時間沉澱後，自然知道該寫什麼，選它。"],"tests":"比喻句解讀","avoid":"比喻要配前後文一起看"}]},{"label":"第八篇","title":"114 年會考 第 32～33 題（題組）","text":["這個社會非常擔心沒有錢，所以實體化成一個一個「別人」，來問我們現在到底賺多少錢，將來能賺多少錢。問這些問題的人未必心裡有個數，知道多少錢叫做足夠。他們並不關切生活品質、工作熱忱、自我實現、健康狀態、人生信念，這些無形價值能不能在金錢天秤上等價換算，一心只想問出個金額，好與其他四處蒐羅而來的金額比大小。巨大的金額令他們心生羨嫉，微薄的金額則引發他們的焦慮，並且順手潑溼我們對未來的樂觀盼想。賺錢需要付出的代價從來都不便宜，要把「夠」放在哪個金額上，或許很難決定，但是⟦出賣自我、夢想、健康、幸福、信念，到了「夠」的時候，沒有人能不說夠。⟧","——江鵝《俗女養成記》"],"cite":"114 年國中教育會考國文科 第 32、33 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，那些人不停追問他人到底賺多少錢，其原因⟦最不可能⟧是下列何者？","opts":["對貧窮的恐懼","對未來想像的單一","重視良好的生活品質","認為工作的意義只在金錢"],"ans":"C","steps":["先圈題目的「最不可能」：要找原文沒有、甚至相反的那一個。","原文說「他們並不關切生活品質、工作熱忱…」，一心只想問金額，所以他們不重視生活品質。","怕沒錢、只想著金額、把工作看成只為錢，原文都有證據；「重視良好的生活品質」剛好相反，選它。"],"tests":"反向題找證據","avoid":"先圈最不可能再刪有證據的"},{"q":"根據文意脈絡，畫線處文句的涵義，與下列何者最接近？","opts":["充分的實現自我","不再與他人比較","賺取足夠的金錢","犧牲已到達極限"],"ans":"D","steps":["看畫線句前一句：「賺錢需要付出的代價從來都不便宜」，重點是代價。","畫線句說把自我、夢想、健康、幸福、信念都賣掉（付出代價），到了「夠」的時候，就是再也賣不下去了。","所以「夠」指的是犧牲到了極限，不是錢賺夠了，選它。"],"tests":"句意理解","avoid":"同一個字要看前後文的意思"}]}]}},{"week":2,"groups":[{"no":"第 1 組","title":"《論語》學而＋校隊練球","skill":"互文對讀：兩篇比一比","steps":["❶ 先各用一句話說出甲、乙在講什麼","❷ 畫比較表：甲說什麼｜乙說什麼","❸ 先找相同，再找不同","❹ 題目問「兩篇都」→ 看相同；問「只有甲」→ 看不同"],"demo":{"q":"甲文的「有朋自遠方來」，在乙文中對應哪件事？","a":["先看材料：甲「有朋自遠方來，不亦樂乎？」＝有朋友來一起，很快樂","乙：「現在我最喜歡週末和隊友一起加練……比自己練有趣多了」","兩句都在說「和朋友一起很快樂」","答：和隊友一起加練"]},"parts":[{"label":"第一篇","title":"《論語》學而＋校隊練球","text":["甲　子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」","乙　我剛進校隊時，教練要我們每天投一百球。一開始覺得好無聊，可是一個月後，比賽最後幾秒我投進關鍵球，那一刻才懂：原來反覆練習會變成真正的本事。現在我最喜歡週末和隊友一起加練，邊練邊互相挑錯，比自己練有趣多了。"],"cite":"甲：《論語．學而》　乙：練習用自編短文","notes":"時習：時常複習　慍：生氣　君子：品德好的人","trans":"甲：孔子說：「學了以後時常複習，不是很高興嗎？有朋友從遠方來，不是很快樂嗎？別人不了解我，我也不生氣，不就是君子嗎？」","qs":[{"q":"「不亦說乎」的「說」是什麼意思？","opts":["說話","高興","解說","勸說"],"ans":"B","steps":["說，同「悅」，是高興的意思","代回：學了常常複習，不是很高興嗎？→ 通","「說話」代回不通"],"tests":"通假字：說＝悅","avoid":"背過的字，先用背過的意思代回"},{"q":"甲、乙兩篇共同的看法是？","opts":["反覆練習會帶來快樂或收穫","一定要和朋友一起練","別人不了解也不要生氣","教練最重要"],"ans":"A","steps":["甲：學了時常複習，很高興","乙：反覆練習變成真本事","兩篇都講練習的好處 → A；C 只有甲講"],"tests":"找兩篇的相同點","avoid":"「共同」要兩篇都找得到證據"},{"q":"甲文有提到、乙文沒有提到的是？","opts":["學習要常常複習","和同伴一起很快樂","別人不了解自己也不生氣","練習一開始很無聊"],"ans":"C","steps":["A：兩篇都有","B：兩篇都有（有朋、隊友）","C：只有甲「人不知而不慍」；D 只有乙"],"tests":"找兩篇的不同點","avoid":"比較表上，沒有連線的那一格就是不同"},{"q":"乙文「和隊友一起加練……比自己練有趣多了」，最接近甲文哪一句？","opts":["學而時習之","人不知而不慍","不亦君子乎","有朋自遠方來，不亦樂乎"],"ans":"D","steps":["乙這句的重點：和同伴一起練，很快樂","甲講「有同伴很快樂」的是「有朋自遠方來，不亦樂乎」","A 講複習，B、C 講不生氣、當君子 → 答 D"],"tests":"找甲乙對應句","avoid":"先抓乙句重點，再去甲找同義句"}]},{"label":"第二篇","title":"吾日三省吾身＋睡前回想","text":["甲　曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」","乙　每天睡前，我會花三分鐘回想今天的練習。幫隊友傳球時，有沒有用心看他的位置？答應學弟放學陪他練罰球，有沒有做到？教練教的新戰術，回家有沒有再練一次？有一次我發現自己答應了學弟卻忘記了，第二天馬上去跟他道歉，還補陪他練了半小時。"],"cite":"甲：《論語．學而》　乙：練習用自編短文","notes":"曾子：孔子的學生　省：反省、檢查　謀：出主意、辦事　忠：盡心盡力　傳：老師傳授的學問","trans":"甲：曾子說：「我每天多次反省自己：替別人辦事有沒有盡心盡力？和朋友來往有沒有守信用？老師傳授的學問有沒有複習？」","qs":[{"q":"「吾日三省吾身」的「日」是什麼意思？","opts":["太陽","白天","每天","日子"],"ans":"C","steps":["代回「我太陽反省自己」→ 不通","代回「我每天反省自己」→ 通","乙文「每天睡前」也對應 → 答 C"],"tests":"字義：日＝每天","avoid":"「日」放在動作前面，常是每天"},{"q":"乙文「答應學弟……有沒有做到？」對應甲文哪一問？","opts":["為人謀而不忠乎","與朋友交而不信乎","傳不習乎","吾日三省吾身"],"ans":"B","steps":["乙：答應的事有沒有做到＝有沒有守信用","甲「與朋友交而不信乎」問的就是守不守信","所以對應 B"],"tests":"找甲乙對應句","avoid":"先說出乙句重點詞，再到甲找同義"},{"q":"甲、乙兩篇共同的做法是？","opts":["每天反省自己做得好不好","只檢查讀書的事","一定要請別人幫忙檢查","做錯了就不再練球"],"ans":"A","steps":["甲「吾日三省吾身」：每天反省","乙「每天睡前……回想」：每天反省","B 兩篇都還檢查待人；C 文中沒說；D 相反 → 答 A"],"tests":"找兩篇相同點","avoid":"「共同」要兩篇都找得到證據"},{"q":"乙文比甲文多寫了哪一件事？","opts":["反省有沒有複習","反省答應的事有沒有做到","發現錯誤後，馬上道歉並補救","反省幫別人做事是否用心"],"ans":"C","steps":["A、B、D：甲文三問都有","乙文「第二天馬上去跟他道歉，還補陪他練」","甲只問、沒寫怎麼改正 → 答 C"],"tests":"找乙多出的部分","avoid":"問「只有乙」，就找甲沒有的那格"}]},{"label":"第三篇","title":"見賢思齊＋隊上的控球後衛","text":["甲　子曰：「見賢思齊焉，見不賢而內自省也。」","乙　隊上的阿哲是控球後衛，傳球又快又準。我每天都偷偷觀察他怎麼看隊友的位置，練習時也照著學。另一個隊友常常輸球就摔球、怪別人，大家都不想跟他同一組。看到他，我就提醒自己：輸球的時候，我有沒有也把錯推給別人？"],"cite":"甲：《論語．里仁》　乙：練習用自編短文","notes":"賢：有才德的人　焉：句尾語氣詞　內：在心裡","trans":"甲：孔子說：「看見有才德的人，就想要向他看齊；看見沒有才德的人，就在心裡反省自己有沒有同樣的缺點。」","qs":[{"q":"「見賢思齊焉」的「齊」是什麼意思？","opts":["整齊","齊國","一起","看齊，和他一樣好"],"ans":"D","steps":["代回「看見賢人就想整齊」→ 不通","代回「想要和他一樣好」→ 通","乙文「照著學」也是在看齊 → 答 D"],"tests":"字義：齊＝看齊","avoid":"每個意思都代回去讀讀看"},{"q":"乙文中哪件事對應「見不賢而內自省」？","opts":["觀察阿哲怎麼傳球","練習時照著阿哲學","看到隊友摔球，提醒自己有沒有犯同樣的錯","大家不想跟摔球的隊友同一組"],"ans":"C","steps":["「見不賢」＝看到不好的人；「內自省」＝在心裡反省自己","乙：「看到他，我就提醒自己……」","D 是別人的反應，不是反省 → 答 C"],"tests":"找甲乙對應句","avoid":"對應要兩半都對上，不能只對一半"},{"q":"甲、乙兩篇共同的看法是？","opts":["好的人和不好的人，都能讓自己學到東西","只要跟厲害的人同隊就會變強","不好的人要趕出球隊","控球後衛最重要"],"ans":"A","steps":["甲：見賢→學他；見不賢→反省自己","乙：學阿哲；看到摔球的隊友→反省","B 是腦補，C、D 文中沒說 → 答 A"],"tests":"找兩篇相同點","avoid":"選項要兩篇都有證據"},{"q":"乙文中的阿哲，在甲文裡屬於哪一種人？","opts":["不賢","賢","小人","遠方來的朋友"],"ans":"B","steps":["乙：阿哲「傳球又快又準」，值得學","甲：值得看齊的是「賢」","所以阿哲是「賢」→ 答 B"],"tests":"把乙的人物對到甲","avoid":"先問：這個人值得學，還是要引以為戒"}]},{"label":"第四篇","title":"己所不欲＋下課打全場","text":["甲　子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」","乙　下課打全場時，我最討厭被人故意推倒。有一次搶籃板，我差點也伸手推對方，突然想起自己被推倒時膝蓋流血的痛，就把手收回來，改用正當的卡位。比賽結束後，對方跑來說：「你防得很乾淨。」我這才發現：不希望別人怎麼對我，我就先不要那樣對別人。"],"cite":"甲：《論語．衛靈公》　乙：練習用自編短文","notes":"子貢：孔子的學生　一言：一個字　終身：一輩子　其：大概　恕：替別人著想","trans":"甲：子貢問：「有沒有一個字，可以讓人一輩子照著去做呢？」孔子說：「大概就是『恕』吧！自己不想要的，就不要加在別人身上。」","qs":[{"q":"「己所不欲」的「欲」是什麼意思？","opts":["想要","討厭","已經","做"],"ans":"A","steps":["代回「自己不想要的」→ 通","乙文「不希望別人怎麼對我」也對應","「討厭」代回變成「自己不討厭的」，意思相反 → 答 A"],"tests":"字義：欲＝想要","avoid":"代回後要和上下文意思一致"},{"q":"「勿施於人」的「勿」是什麼意思？","opts":["沒有","不要","東西","一定"],"ans":"B","steps":["代回「不要加在別人身上」→ 通，是勸告","「沒有」代回變成描述，不是勸人","乙文「就先不要那樣對別人」→ 答 B"],"tests":"字義：勿＝不要","avoid":"勸人的句子，勿常是「不要」"},{"q":"乙文中「我」把手收回來，是因為？","opts":["怕被教練罵","想起自己被推倒的痛，不想讓對方也受傷","對方比較高","裁判正在看"],"ans":"B","steps":["乙：「突然想起自己被推倒時膝蓋流血的痛，就把手收回來」","這正是甲文「己所不欲，勿施於人」","A、C、D 文中都沒寫 → 答 B"],"tests":"找原因並對應甲","avoid":"原因要在文中找到句子"},{"q":"甲、乙兩篇都在說明哪一個道理？","opts":["比賽一定要贏","別人對我不好，我也可以對他不好","只有子貢懂這個道理","自己不喜歡的事，不要對別人做"],"ans":"D","steps":["甲：「己所不欲，勿施於人」","乙：「不希望別人怎麼對我，我就先不要那樣對別人」","B 相反；A、C 文中沒說 → 答 D"],"tests":"找兩篇共同主旨","avoid":"主旨要兩篇都講到才算"}]},{"label":"第五篇","title":"知之為知之＋數學課舉手","text":["甲　子曰：「由！誨女知之乎！知之為知之，不知為不知，是知也。」","乙　數學課上，老師講了一題我不懂的題目。我很想假裝懂，因為旁邊的同學都在點頭。最後我還是舉手說：「老師，這一步我看不懂。」沒想到老師說好幾個人都卡在這裡，又講了一次。下課後，剛才點頭的同學偷偷跟我說：「其實我也不懂，謝謝你先問。」"],"cite":"甲：《論語．為政》　乙：練習用自編短文","notes":"由：孔子的學生子路的名字　誨：教導　女：同「汝」，你","trans":"甲：孔子說：「由啊！我教你怎樣才算真正知道吧！知道就說知道，不知道就說不知道，這才是真正的聰明。」","qs":[{"q":"「是知也」的「是」是什麼意思？","opts":["是的","這，這樣","正確","是非"],"ans":"B","steps":["代回「這樣才是真正的聰明」→ 通","文言的「是」常常當「這」用","「是的」放在句首，後面接「知也」不通 → 答 B"],"tests":"字義：是＝這","avoid":"句首的「是」，先試試「這」"},{"q":"乙文中「我」舉手說看不懂，最符合甲文哪一句？","opts":["誨女知之乎","知之為知之","不知為不知","由"],"ans":"C","steps":["乙：「這一步我看不懂」＝承認自己不知道","甲：「不知為不知」＝不知道就說不知道","B 是知道的情況 → 答 C"],"tests":"找甲乙對應句","avoid":"先判斷是「知道」還是「不知道」"},{"q":"根據兩篇，下列推論何者正確？","opts":["誠實說出自己不懂，才能真正學會","點頭的同學都聽懂了","不懂時假裝懂比較不丟臉","孔子的學生都很笨"],"ans":"A","steps":["甲：不知為不知，才是真聰明","乙：舉手→老師再講一次→學會；同學也說謝謝","B 錯（同學其實不懂），C 相反，D 文中沒說 → 答 A"],"tests":"根據兩篇推論","avoid":"推論要兩篇都撐得住"},{"q":"乙文「旁邊的同學都在點頭」，和結尾哪一句形成對比？","opts":["老師說好幾個人都卡在這裡","我很想假裝懂","老師又講了一次","「其實我也不懂，謝謝你先問。」"],"ans":"D","steps":["開頭：同學點頭，看起來像懂","結尾：同學說「其實我也不懂」","看起來懂、其實不懂，形成對比 → 答 D"],"tests":"找前後對比","avoid":"對比就是前後說法相反"}]}]},{"no":"第 2 組","title":"杞人憂天","skill":"一字多義：同一個字換意思","steps":["❶ 先想這個字你學過的意思（可能不只一個）","❷ 一個一個代回去，不通就換下一個","❸ 用前後文確認：它在講東西、動作，還是「沒有」"],"demo":{"q":"「身亡所寄」的「亡」是什麼意思？","a":["代「死亡」→ 身體死了所寄？不通","代「沒有」→ 自己沒有地方可以安身 → 通","答：沒有"]},"parts":[{"label":"第一篇","title":"杞人憂天","text":["杞國有人，憂天地崩墜，身亡所寄，廢寢食者。又有憂彼之所憂者，因往曉之，曰：「天，積氣耳，亡處亡氣。若屈伸呼吸，終日在天中行止，奈何憂崩墜乎？」"],"cite":"《列子．天瑞》（節選）","notes":"崩墜：塌下來　寄：安身　廢：停止　曉：使他明白　積氣：堆積的空氣　耳：罷了　若：你　行止：活動　奈何：為什麼","trans":"杞國有一個人，擔心天會塌、地會陷，自己沒有地方安身，擔心得吃不下、睡不著。又有一個人為他的擔心而擔心，就去開導他，說：「天不過是堆積的空氣罷了，沒有一個地方沒有空氣。你彎腰伸身、呼氣吸氣，整天都在天裡面活動，為什麼要擔心它塌下來呢？」","qs":[{"q":"「亡處亡氣」的「亡」是什麼意思？","opts":["失去","逃走","沒有","死亡"],"ans":"C","steps":["同一篇前面「身亡所寄」的亡＝沒有","代回：沒有一處沒有空氣 → 通","也符合前一句「天，積氣耳」"],"tests":"一字多義：亡＝無","avoid":"同一篇出現兩次的字，意思常常一樣"},{"q":"「因往曉之」的「之」指的是誰？","opts":["天","那個擔心天塌的杞國人","空氣","作者"],"ans":"B","steps":["之＝他（第 1 週高頻字）","去開導的是第二個人","被開導的是擔心天塌的杞國人"],"tests":"代詞「之」指誰","avoid":"「之」是他時，往前找被做動作的人"},{"q":"開導的人用什麼理由讓杞國人放心？","opts":["天很高，不會掉下來","天只是空氣，我們整天都在裡面活動","天塌了可以搬家","擔心也沒有用"],"ans":"B","steps":["找開導的人說的話：「天，積氣耳」","「終日在天中行止」","D 聽起來有道理，但文中沒說"],"tests":"找人物的理由","avoid":"合理不等於有證據"},{"q":"「又有憂彼之所憂者」是什麼意思？","opts":["又有人很憂傷","又有人讓杞人擔心","又有人覺得杞人很可憐","又有人為杞人的擔心而擔心"],"ans":"D","steps":["彼＝那個人，指前面的杞人","「彼之所憂」＝杞人所擔心的事","前一個「憂」＝擔心 → 為杞人的擔心而擔心 → 答 D"],"tests":"同字不同位置","avoid":"一句裡同一個字出現兩次，分開代回"}]},{"label":"第二篇","title":"兩小兒辯日","text":["孔子東遊，見兩小兒辯鬥，問其故。一兒曰：「我以日始出時去人近，而日中時遠也。」一兒以日初出遠，而日中時近也。一兒曰：「日初出大如車蓋，及日中則如盤盂，此不為遠者小而近者大乎？」一兒曰：「日初出滄滄涼涼，及其日中如探湯，此不為近者熱而遠者涼乎？」孔子不能決也。兩小兒笑曰：「孰為汝多知乎？」"],"cite":"《列子．湯問》","notes":"辯鬥：爭論　故：原因　以：認為　車蓋：古代車上圓形的篷子　盤盂：盤子和碗　滄滄涼涼：涼涼的樣子　探湯：把手伸進熱水　決：判斷　孰：誰　汝：你","trans":"孔子到東方遊歷，看見兩個小孩在爭論，就問他們原因。一個小孩說：「我認為太陽剛出來時離人近，中午時離人遠。」另一個小孩認為太陽剛出來時遠，中午時近。一個小孩說：「太陽剛出來時大得像車篷，到了中午就只像盤子、碗那麼大，這不是遠的小、近的大嗎？」另一個小孩說：「太陽剛出來時涼涼的，到了中午熱得像把手伸進熱水，這不是近的熱、遠的涼嗎？」孔子不能判斷誰對。兩個小孩笑著說：「誰說你知道得很多呢？」","qs":[{"q":"「日始出時去人近」的「去」是什麼意思？","opts":["離開","前往","距離","除去"],"ans":"C","steps":["代回「離開人很近」→ 怪","代回「距離人很近」→ 通","後文一直在比遠近 → 答 C"],"tests":"一字多義：去","avoid":"看到「去」，想一想離開、距離"},{"q":"「而日中時遠也」的「日中」是什麼意思？","opts":["中午","太陽的中心","每天","白天裡"],"ans":"A","steps":["和「日始出」（早上）對比","後文「及其日中如探湯」很熱 → 是中午","「日」單用是太陽，「日中」是中午 → 答 A"],"tests":"一字多義：日","avoid":"同一個字加別的字，意思會變"},{"q":"「孰為汝多知乎」的「為」是什麼意思？","opts":["說，認為","做","為了","成為"],"ans":"A","steps":["代回「誰說你知道得很多呢」→ 通","代回「誰做你知道很多」→ 不通","小孩在笑孔子答不出來 → 答 A"],"tests":"一字多義：為","avoid":"為有很多意思，一個一個代回"},{"q":"主張「早上太陽比較近」的小孩，用什麼當證據？","opts":["太陽早上比較涼","中午比較熱","孔子同意他","太陽早上看起來比較大"],"ans":"D","steps":["證據句：「日初出大如車蓋……此不為遠者小而近者大乎」","看起來大＝近 → 支持早上近","A、B 是另一個小孩的證據；C 孔子沒判斷 → 答 D"],"tests":"找人物的證據","avoid":"先確認哪個證據支持哪個主張"}]},{"label":"第三篇","title":"曹沖稱象","text":["時孫權曾致巨象，太祖欲知其斤重，訪之羣下，咸莫能出其理。沖曰：「置象大船之上，而刻其水痕所至，稱物以載之，則校可知矣。」太祖大悅，即施行焉。"],"cite":"《三國志．魏書．鄧哀王沖傳》（節選）","notes":"孫權：吳國的君主　太祖：曹操　沖：曹沖，曹操的兒子　斤重：重量　訪：詢問　羣下：手下的人　咸：都　置：放　水痕：水的痕跡　校：比較","trans":"那時孫權曾經送來一頭大象，曹操想知道牠有多重，問遍手下的人，都沒有人能想出方法。曹沖說：「把大象放到大船上，在水痕到達的地方刻上記號，再秤其他東西裝上船（裝到同樣的記號），比較一下就知道了。」曹操非常高興，馬上照這個方法去做。","qs":[{"q":"「孫權曾致巨象」的「致」是什麼意思？","opts":["導致","細緻","到達","送來"],"ans":"D","steps":["代回「孫權曾經導致大象」→ 不通","代回「孫權曾經送來大象」→ 通","後文曹操想秤這頭象 → 答 D"],"tests":"一字多義：致","avoid":"代回後，句子要說得通"},{"q":"「咸莫能出其理」的「理」是什麼意思？","opts":["方法，道理","整理","理睬","管理"],"ans":"A","steps":["代回「都沒有人能想出方法」→ 通","下文曹沖馬上說出秤象的方法","所以理＝方法 → 答 A"],"tests":"一字多義：理","avoid":"用下一句來確認字義"},{"q":"「刻其水痕所至」的「其」指什麼？","opts":["大象","曹操","孫權","大船"],"ans":"D","steps":["前一句：「置象大船之上」","水痕是留在船身上的","所以「其」＝船 → 答 D"],"tests":"代詞「其」指誰","avoid":"其＝他的，往前找最近的東西"},{"q":"「咸莫能出其理」的「莫」，和下列哪一個「莫」意思相同？","opts":["請莫喧嘩（不要）","莫名其妙（沒有人能說出）","莫要擔心（不要）","天色已莫（同暮，傍晚）"],"ans":"B","steps":["本篇：「咸莫能出其理」＝都沒有人能","莫名其妙＝沒有人能說出其中的奧妙","A、C 是不要，D 是傍晚 → 答 B"],"tests":"一字多義：莫","avoid":"把兩句都翻出來再比較"}]},{"label":"第四篇","title":"魯人徙越","text":["魯人身善織屨，妻善織縞，而欲徙於越。或謂之曰：「子必窮矣。」魯人曰：「何也？」曰：「屨為履之也，而越人跣行；縞為冠之也，而越人被髮。以子之所長，游於不用之國，欲使無窮，其可得乎？」"],"cite":"《韓非子．說林上》（節選）","notes":"屨：用麻或草編的鞋　縞：白色的絹，可做帽子　徙：搬家　窮：生活困窘　履：穿　跣：光著腳　冠：戴帽子　被髮：披散頭髮　游：前往","trans":"魯國有個人自己很會編鞋子，妻子很會織白絹，他們想搬到越國去。有人對他說：「你一定會
