為」代回：太太因為弄壞新褲子 → 前後顛倒，讀不通","代回「於是」：太太聽完，於是弄壞新褲子 → 通","所以「因」＝於是"],"tests":"虛詞：因","avoid":"「因」在動作前面，常是「於是」"},{"q":"這個故事在笑太太什麼？","opts":["做褲子的手藝太差","不聽丈夫的話","只照字面去做，不懂丈夫真正的意思","太浪費布料"],"ans":"C","steps":["丈夫說「象吾故袴」，是要照舊褲子的樣式做","太太卻把新褲子弄壞，連破舊也照做","可笑的是只看字面、不懂意思"],"tests":"寓言主旨","avoid":"想想人物哪裡做得不合理"}]},{"label":"第四篇","title":"三年刻一葉","text":["宋人有為其君以象為楮葉者，三年而成。豐殺莖柯，毫芒繁澤，亂之楮葉之中而不可別也。此人遂以功食祿於宋邦。列子聞之曰：「使天地三年而成一葉，則物之有葉者寡矣。」"],"cite":"《韓非子．喻老》（節選）","notes":"楮：一種樹　豐殺：寬窄厚薄　莖柯：葉柄和枝條　毫芒：葉上的細毛　繁澤：繁密又有光澤　亂之：把它混在　食祿：領取俸祿　宋邦：宋國　列子：戰國時的思想家","trans":"宋國有個人替他的國君用象牙雕刻楮樹葉，花了三年才完成。葉子的寬窄厚薄、葉柄枝條、細毛和光澤都做得很逼真，把它混在真的楮樹葉中，分辨不出來。這個人因此憑著功勞在宋國領取俸祿。列子聽說後說：「假如天地要三年才長成一片葉子，那麼有葉子的植物就很少了。」","qs":[{"q":"「以象為楮葉」的「象」是什麼意思？","opts":["像","大象這種動物","形象","象牙"],"ans":"D","steps":["「以……為……」＝用……做成……，「象」是材料","代回：用象牙做成楮葉 → 通；用「像」當材料讀不通","上一篇「象吾故袴」是像，這裡是象牙"],"tests":"一字多義：象","avoid":"「以」後面常是材料或工具"},{"q":"「而不可別也」的「別」是什麼意思？","opts":["離別","分辨","另外","不要"],"ans":"B","steps":["組詞「分別、辨別」，代回：混在真葉子裡分辨不出來 → 通","驗證：前面寫葉子做得很逼真，所以才分不出來","所以「別」＝分辨"],"tests":"字義：別","avoid":"組詞代回，再看前文的原因"},{"q":"「使天地三年而成一葉」的「使」是什麼意思？","opts":["假如","派","讓","使者"],"ans":"A","steps":["組詞「假使」，代回：假如天地三年才長一片葉子 → 通","驗證：後面「則……寡矣」＝那麼就會很少，是「如果……那麼……」的句子","所以「使」＝假如"],"tests":"一字多義：使","avoid":"看到「使……則……」，想到假如"},{"q":"列子說這句話，想表達什麼？","opts":["宋人的手藝很差","天地也要三年才長出葉子","應該多種楮樹","雕得再像，三年才一片，比不上自然生長，不值得這樣做"],"ans":"D","steps":["事實：宋人花三年才雕好一片葉子","列子假設：如果天地也三年才長一片，葉子就很少了","推論：靠人力費時做假葉子，比不上自然，不值得"],"tests":"推論：言外之意","avoid":"假設句常在說「這樣不行」"}]},{"label":"第五篇","title":"漱石枕流","text":["孫子荊年少時欲隱，語王武子「當枕石漱流」，誤曰「漱石枕流」。王曰：「流可枕，石可漱乎？」孫曰：「所以枕流，欲洗其耳；所以漱石，欲礪其齒。」"],"cite":"《世說新語．排調》","notes":"孫子荊：孫楚，西晉人　隱：隱居　王武子：王濟，孫楚的朋友　當：應當　漱：漱口　流：溪水　礪：磨","trans":"孫楚年輕時想去隱居，告訴王濟「應當枕著石頭睡、用溪水漱口」，卻說錯成「用石頭漱口、枕著溪水睡」。王濟說：「溪水可以當枕頭，石頭可以漱口嗎？」孫楚說：「枕著溪水的原因，是想洗乾淨耳朵；用石頭漱口的原因，是想磨利牙齒。」","qs":[{"q":"「當枕石漱流」的「枕」是什麼意思？","opts":["把頭靠在……上面睡","枕頭","鐵軌的枕木","睡不著"],"ans":"A","steps":["組詞「枕頭」代回：枕頭石頭 → 讀不通","「枕」後面接著「石」，名詞當動作讀 → 把頭靠在石頭上","再比對稱句：和「漱流」並排，「漱」是動作，「枕」也是動作"],"tests":"詞類活用：枕","avoid":"名詞後接東西，當動作讀"},{"q":"「語王武子」的「語」是什麼意思？","opts":["語言","成語","告訴","說話的聲音"],"ans":"C","steps":["組詞「語言」代回：語言王武子 → 讀不通","換招：後面接「王武子」是一個人，又接著說出內容 → 對人說話","所以「語」＝告訴"],"tests":"字義：語","avoid":"後面接人，常是「告訴」"},{"q":"「所以枕流，欲洗其耳」的「所以」是什麼意思？","opts":["因此","……的原因","所有","所在的地方"],"ans":"B","steps":["代回今天的「因此」：因此枕流 → 前面沒有原因，讀不通","驗證：王濟問「流可枕乎」，孫楚是在說理由 → 枕流的原因，是想洗耳朵","所以「所以」＝……的原因（古今異義）"],"tests":"古今異義：所以","avoid":"古今異義要看人物的目的"},{"q":"從孫楚的回答，可以看出他是怎樣的人？","opts":["很誠實，馬上承認說錯","很愛乾淨，每天洗耳朵","反應快，能把說錯的話機智地圓回來","牙齒不好，需要磨牙"],"ans":"C","steps":["證據一：他說錯了「漱石枕流」","證據二：被問時他不認錯，馬上編出洗耳、磨牙的理由","合起來：他機智、反應快"],"tests":"人物形象","avoid":"看人物被問倒時怎麼回答"}]}]},{"no":"第 3 組","title":"千金買骨","skill":"推論＋因果＋寓言道理","steps":["❶ 圈出因果路標：故、則、於是、因、所以","❷ 把事情排成「因為……→所以……→結果……」的連鎖","❸ 推論：兩個證據合起來，推出文章沒直說的事","❹ 寓言三問：發生什麼事？結果怎樣？作者想勸我們什麼？","❺ 選項要有證據才選，再合理也不能腦補"],"demo":{"q":"「死馬且買之五百金，況生馬乎？」是什麼意思？","a":["先看材料：涓人對國君說「死馬且買之五百金，況生馬乎？」","→ 路標：「且」＝尚且，「況」＝何況，前輕後重","→ 死馬都肯花五百金買，何況是活馬","答：連死馬都肯花大錢，活馬一定出更高的價"]},"parts":[{"label":"第一篇","title":"千金買骨","text":["古之君人，有以千金求千里馬者，三年不能得。涓人言於君曰：「請求之。」君遣之。三月得千里馬，馬已死，買其首五百金，反以報君。君大怒曰：「所求者生馬，安事死馬而捐五百金？」涓人對曰：「死馬且買之五百金，況生馬乎？天下必以王為能市馬，馬今至矣。」於是不能期年，千里之馬至者三。"],"cite":"《戰國策．燕策一》（節選）","notes":"君人：國君　涓人：國君身邊的侍從　遣：派　反：同「返」，回來　安事：哪裡用得著　捐：丟掉、白花　且：尚且　況：何況　期年：一整年","trans":"古代有一位國君，想用千金買一匹千里馬，三年都買不到。宮中的侍從對國君說：「請讓我去找。」國君就派他去。三個月後找到了千里馬，但馬已經死了，他用五百金買下馬頭，回來向國君報告。國君非常生氣地說：「我要的是活馬，哪裡用得著買死馬，還白花五百金？」侍從回答：「死馬尚且肯花五百金買，何況活馬呢？天下人一定會認為大王真的肯花錢買馬，千里馬很快就會來了。」於是不到一年，就有三匹千里馬送來。","qs":[{"q":"「買其首五百金」的「首」是什麼意思？","opts":["頭","第一","首先","一首詩"],"ans":"A","steps":["組詞「首領、首先」代回：買第一？讀不通","換招：前面說「馬已死」，買的是死馬身上的東西；國君又罵他買「死馬」","代回「買馬的頭」→ 通，所以「首」＝頭"],"tests":"字義：首","avoid":"組詞不通，就看人物在做什麼"},{"q":"國君為什麼大怒？","opts":["侍從找了三年都沒找到","侍從把錢弄丟了","千里馬太貴了","他要的是活馬，侍從卻花五百金買死馬的頭"],"ans":"D","steps":["證據：「所求者生馬，安事死馬而捐五百金？」","因：花大錢買的是死馬","果：國君覺得白白浪費，所以生氣"],"tests":"因果：找原因","avoid":"人物生氣的話，就是原因"},{"q":"侍從說「天下必以王為能市馬」，他想讓天下人知道什麼？","opts":["大王是真心肯花高價買好馬的","大王很喜歡死馬","大王的錢花不完","大王不懂得挑馬"],"ans":"A","steps":["證據一：死馬都肯出五百金","證據二：天下人會認為大王「能市馬」，肯出錢買馬","合起來：消息傳出去，有好馬的人就會主動送來"],"tests":"推論：人物用意","avoid":"想想這件事傳出去，別人會怎麼想"},{"q":"這個故事告訴我們什麼道理？","opts":["想得到人才或好東西，要先讓人看見你的誠意","買東西一定要買最貴的","死的東西比活的有價值","做事要靠運氣"],"ans":"A","steps":["過程：先花五百金買馬頭，表現誠意","結果：「不能期年，千里之馬至者三」","道理：先表現誠意，好的人和東西才會自己來"],"tests":"寓言道理","avoid":"從「結果」回推作者想說的話"}]},{"label":"第二篇","title":"海上漚鳥","text":["海上之人有好漚鳥者，每旦之海上，從漚鳥游，漚鳥之至者百住而不止。其父曰：「吾聞漚鳥皆從汝游，汝取來，吾玩之。」明日之海上，漚鳥舞而不下也。"],"cite":"《列子．黃帝》（節選）","notes":"漚鳥：海鷗　旦：早晨　從：跟隨　百住而不止：形容飛來的海鷗非常多　汝：你　玩：玩賞","trans":"海邊有個喜歡海鷗的人，每天早上到海邊，跟著海鷗一起玩，飛來的海鷗非常多。他的父親說：「我聽說海鷗都跟著你玩，你抓幾隻來，讓我玩玩。」第二天他到了海邊，海鷗只在空中飛舞，卻不肯飛下來了。","qs":[{"q":"「每旦之海上」的「之」是什麼意思？","opts":["的","到、往","他","牠們"],"ans":"B","steps":["「之」後面接著地方「海上」","代回：每天早上到海邊 → 通","所以「之」＝往、到"],"tests":"虛詞：之","avoid":"「之」後面是地方，就是「往」"},{"q":"父親說「汝取來，吾玩之」，是要兒子做什麼？","opts":["帶他去海邊看海鷗","不要再去找海鷗玩","替海鷗拍照","抓幾隻海鷗回來給他玩"],"ans":"D","steps":["「汝取來」＝你拿過來","要拿的是「漚鳥皆從汝游」的海鷗","所以是要兒子抓海鷗回來"],"tests":"句意理解","avoid":"把省略的東西補回去"},{"q":"第二天海鷗為什麼「舞而不下」？","opts":["那天天氣不好","海鷗已經吃飽了","他心裡想抓海鷗，海鷗察覺了就不敢靠近","他沒有帶食物去"],"ans":"C","steps":["證據一：以前每天去，海鷗都飛來陪他","證據二：父親叫他抓海鷗，第二天海鷗就不下來","合起來：唯一改變的是他存了抓鳥的心"],"tests":"推論：前後比較","avoid":"比一比前後，找出改變的地方"},{"q":"這個故事想告訴我們什麼？","opts":["海鷗是很聰明的鳥","心裡存著壞念頭，別人也會察覺而遠離","要聽父親的話","早上去海邊比較好"],"ans":"B","steps":["前：真心和海鷗玩，海鷗都來","後：想抓海鷗，海鷗都不下來","道理：真心才能親近，存壞心別人會遠離"],"tests":"寓言道理","avoid":"寓言要從動物說到人"}]},{"label":"第三篇","title":"鄰父枯梧","text":["人有枯梧樹者，其鄰父言枯梧之樹不祥，其鄰人遽而伐之。鄰人父因請以為薪。其人乃不悅，曰：「鄰人之父徒欲為薪，而教吾伐之也。與我鄰，若此其險，豈可哉？」"],"cite":"《列子．說符》","notes":"枯：枯死　梧：梧桐樹　鄰父：鄰居老人　不祥：不吉利　遽：急忙　伐：砍　薪：柴火　險：陰險","trans":"有個人家裡有一棵枯死的梧桐樹，他的鄰居老人說枯死的梧桐樹不吉利，這個人就急忙把樹砍了。鄰居老人於是請求拿這棵樹去當柴火。這個人就不高興了，說：「鄰居老人只是想要柴火，才教我把樹砍掉。跟我做鄰居，竟然這麼陰險，怎麼可以呢？」","qs":[{"q":"「其鄰人遽而伐之」的「其鄰人」指的是誰？","opts":["鄰居老人","鄰居老人的兒子","家裡有枯梧樹的那個人","路過的人"],"ans":"C","steps":["「其」指前面的「鄰父」；鄰父的鄰居，就是有樹的人","驗證：砍自己家的樹，當然是樹的主人","所以「其鄰人」＝有枯梧樹的人"],"tests":"補主詞：代詞","avoid":"「其」先找它指的人，再往下推"},{"q":"「徒欲為薪」的「徒」是什麼意思？","opts":["徒弟","走路","空手","只是"],"ans":"D","steps":["組詞「徒弟、徒手」代回：徒弟想要柴火、空手想要柴火 → 讀不通","換招看說話者的意思：他認為老人說樹不吉利，其實只是想要木柴","所以「徒」＝只是（「家徒四壁」的徒也是這個意思）"],"tests":"字義：徒","avoid":"組詞代回，再看說話者的意思"},{"q":"事情發生的先後順序，哪一個正確？","opts":["主人砍樹 → 老人說樹不吉利 → 主人不高興 → 老人要木柴","老人要木柴 → 老人說樹不吉利 → 主人砍樹 → 主人不高興","老人說樹不吉利 → 主人砍樹 → 老人要木柴 → 主人不高興","主人不高興 → 老人要木柴 → 主人砍樹 → 老人說樹不吉利"],"ans":"C","steps":["路標「遽而」：聽了話就急忙砍樹","路標「因」：砍了以後，老人於是要木柴","路標「乃」：主人這才不高興"],"tests":"因果連鎖：順序","avoid":"順著「而、因、乃」排先後"},{"q":"那個人為什麼不高興？","opts":["他懷疑老人說樹不吉利，是為了自己想要木柴","他捨不得那棵梧桐樹","老人沒有幫忙砍樹","老人說他家不吉利"],"ans":"A","steps":["證據一：老人先說樹不吉利，等樹砍了就來要木柴","證據二：他說「徒欲為薪，而教吾伐之」","合起來：他認為老人別有用心"],"tests":"推論：人物心理","avoid":"人物生氣的話，藏著他的想法"}]},{"label":"第四篇","title":"宋人得遺契","text":["宋人有遊於道，得人遺契者，歸而藏之，密數其齒。告鄰人曰：「吾富可待矣。」"],"cite":"《列子．說符》","notes":"遊：走、閒逛　契：古代的契約或借據，上面刻有齒痕當記號　齒：契上刻的齒痕　待：等待","trans":"宋國有個人在路上閒逛，撿到別人遺失的契約，回家把它藏起來，偷偷地數契上刻的齒痕。他告訴鄰居說：「我發財的日子就快到了。」","qs":[{"q":"「得人遺契」的「遺」是什麼意思？","opts":["遺傳","遺憾","遺失、掉了","留給後人"],"ans":"C","steps":["組詞「遺失」，代回：撿到別人遺失的契約 → 通","驗證：「得」是撿到，東西是別人「掉」的","所以「遺」＝遺失"],"tests":"字義：遺","avoid":"組詞代回，再看前面的動作"},{"q":"「密數其齒」的「密」是什麼意思？","opts":["很密集","親密","偷偷地","祕密的文件"],"ans":"C","steps":["組詞「祕密」，代回：偷偷地數齒痕 → 通","驗證：他先「歸而藏之」，把契約藏起來，不想讓人知道","所以「密」＝偷偷地"],"tests":"字義：密","avoid":"用前一個動作驗證"},{"q":"他說「吾富可待矣」，是因為他以為什麼？","opts":["鄰居會借他錢","撿到的契約能讓他發大財","他快要找到工作","他的齒痕數得很準"],"ans":"B","steps":["證據一：他把撿來的契約藏好，偷偷數上面的齒痕","證據二：數完就說自己快發財了","合起來：他以為這張契約能讓他拿到錢"],"tests":"推論：人物想法","avoid":"把人物的動作和話連起來"},{"q":"這個故事在諷刺什麼？","opts":["想靠撿來、不屬於自己的東西發財，是不切實際的空想","撿到東西要好好藏起來","數學要學好才能數清楚","有事要先告訴鄰居"],"ans":"A","steps":["契約是別人的，上面的錢不會歸他","他卻已經在等著發財","諷刺：不勞而獲的白日夢"],"tests":"寓言道理","avoid":"想想人物的想法哪裡不合理"}]},{"label":"第五篇","title":"荊人遺弓","text":["荊人有遺弓者，而不肯索，曰：「荊人遺之，荊人得之，又何索焉？」孔子聞之曰：「去其『荊』而可矣。」老聃聞之曰：「去其『人』而可矣。」故老聃則至公矣。"],"cite":"《呂氏春秋．貴公》（節選）","notes":"荊：楚國　遺：遺失　老聃：老子　至：最　公：公正無私","trans":"楚國有個人丟了弓，卻不肯去找，說：「楚國人丟了它，楚國人會撿到它，又何必去找呢？」孔子聽了說：「把『楚國』去掉就可以了。」老子聽了說：「把『人』去掉就可以了。」所以老子是最公正無私的。","qs":[{"q":"「而不肯索」的「索」是什麼意思？","opts":["繩子","索取","乾脆","尋找"],"ans":"D","steps":["組詞「搜索」，代回：丟了弓卻不肯去找 → 通","驗證：後面「又何索焉」＝又何必找呢","所以「索」＝尋找"],"tests":"字義：索","avoid":"前後同一個字，互相驗證"},{"q":"「去其『荊』而可矣」的「去」是什麼意思？","opts":["前往","過去","離開家","去掉"],"ans":"D","steps":["代回今天的「前往」：前往楚國就可以了 → 不合孔子的意思","驗證：去掉「荊」字，話就變成「人遺之，人得之」","所以「去」＝去掉（古今異義）"],"tests":"古今異義：去","avoid":"「去」後面接東西，常是去掉"},{"q":"孔子去掉「荊」字，意思變成什麼？","opts":["只有楚國人可以撿","不管哪一國的人撿到都一樣","弓應該送給孔子","丟弓的人應該去找"],"ans":"B","steps":["原句：「荊人遺之，荊人得之」只想到楚國人","去掉「荊」：人遺之，人得之","推論：不分國家，是人撿到就好"],"tests":"推論：去字之後","avoid":"把字拿掉，再讀一次句子"},{"q":"作者為什麼說老聃「至公」？","opts":["他比孔子年紀大","他連「人」也去掉，不分誰得到，心胸最寬廣","他幫忙找到了弓","他不喜歡楚國人"],"ans":"B","steps":["楚人：只想到楚國人；孔子：想到所有人","老聃去掉「人」：遺之、得之，連人和萬物都不分","範圍一個比一個大，所以老聃最公"],"tests":"推論：層層比較","avoid":"把三個人的說法排成由小到大"}]}]},{"no":"第 4 組","title":"詠柳","skill":"詩歌找畫面＋修辭（譬喻、對偶、誇飾、擬人）","steps":["❶ 先找景物：詩裡看到什麼、聽到什麼、聞到什麼","❷ 圈出修辭：有「似、如」或把甲說成乙是譬喻；字數詞性對得整齊是對偶；說得很誇張是誇飾；把東西當人寫是擬人","❸ 找心情字：淚、驚、恨、獨、何時……","❹ 最後一句常是詩人真正想說的話"],"demo":{"q":"「二月春風似剪刀」用了什麼修辭？","a":["先看材料：「不知細葉誰裁出，二月春風似剪刀。」","→ 有「似」字：把春風說成剪刀，春風把柳葉「剪」得細細的","答：譬喻（把春風比成剪刀）"]},"parts":[{"label":"第一篇","title":"詠柳","text":["碧玉妝成一樹高，萬條垂下綠絲絛。","不知細葉誰裁出，二月春風似剪刀。"],"cite":"賀知章〈詠柳〉（唐詩）","notes":"碧玉：青綠色的玉　妝：打扮　絲絛：絲帶　裁：剪","trans":"高高的柳樹像用碧玉打扮而成，垂下千萬條柳枝，好像綠色的絲帶。不知道這細細的柳葉是誰剪出來的？原來二月的春風，就像一把剪刀。","qs":[{"q":"「萬條垂下綠絲絛」，詩人把什麼比成綠色的絲帶？","opts":["垂下來的柳條","春風","柳樹的葉子","碧玉"],"ans":"A","steps":["詩題是〈詠柳〉，寫的是柳樹","「萬條垂下」：一條一條垂下來的是柳枝","所以是把柳條比成綠絲帶"],"tests":"修辭：譬喻","avoid":"先找「被比的」，再找「比成的」"},{"q":"「不知細葉誰裁出」的下一句接著做什麼？","opts":["再問一個新問題","改寫別的花","自己回答：是二月春風剪出來的","說明柳樹有多高"],"ans":"C","steps":["上一句問「誰裁出」","下一句「二月春風似剪刀」正好回答","先問後答，讓讀者更有印象"],"tests":"寫法：先問後答","avoid":"問句後面常常馬上有答案"},{"q":"這首詩寫的是哪一個季節的景色？","opts":["夏天","春天","秋天","冬天"],"ans":"B","steps":["證據一：「二月春風」","證據二：「細葉」剛長出來，柳條一片翠綠","所以是春天"],"tests":"找畫面：季節","avoid":"找時間詞和景物一起判斷"},{"q":"詩人對柳樹的感情是什麼？","opts":["讚美、喜愛","討厭","害怕","傷心"],"ans":"A","steps":["用碧玉、絲帶這些美麗的東西來比柳樹","還驚喜地問細葉是誰剪的","所以是讚美、喜愛"],"tests":"找心情","avoid":"用來比的東西美，感情就是喜愛"}]},{"label":"第二篇","title":"絕句（兩個黃鸝鳴翠柳）","text":["兩個黃鸝鳴翠柳，一行白鷺上青天。","窗含西嶺千秋雪，門泊東吳萬里船。"],"cite":"杜甫〈絕句〉（唐詩）","notes":"黃鸝：一種黃色的鳥　白鷺：一種白色的水鳥　西嶺：西邊的山嶺　千秋雪：終年不化的積雪　泊：停靠　東吳：長江下游一帶，離這裡很遠","trans":"兩隻黃鸝在翠綠的柳樹上鳴叫，一行白鷺飛上蔚藍的天空。從窗戶望出去，像含著西邊山嶺上終年不化的積雪；門前停泊著從遙遠東吳開來的船。","qs":[{"q":"「兩個黃鸝鳴翠柳，一行白鷺上青天」用了什麼修辭？","opts":["誇飾","擬人","對偶","設問"],"ans":"C","steps":["兩句字數一樣：七字對七字","詞性相對：兩個↔一行，黃鸝↔白鷺，鳴↔上，翠柳↔青天","所以是對偶"],"tests":"修辭：對偶","avoid":"上下句一個字一個字對看看"},{"q":"前兩句出現了哪些顏色？","opts":["紅、白、黑、綠","黃、紅、白、藍","只有白色","黃、翠、白、青"],"ans":"D","steps":["黃鸝的「黃」、翠柳的「翠」","白鷺的「白」、青天的「青」","共四種顏色，畫面很鮮豔"],"tests":"找畫面：顏色","avoid":"把有顏色的字一個一個圈出來"},{"q":"「窗含西嶺千秋雪」是什麼意思？","opts":["窗戶上結了一層雪","雪從山上飄進窗戶","從窗戶看出去，遠山的雪景好像被窗框住了","窗戶裡放著一塊冰"],"ans":"C","steps":["「含」＝含在嘴裡，這裡是窗戶「框住」景色","西嶺在遠方，雪不會跑進窗戶","所以是從窗口望出去，看到遠山的雪"],"tests":"句意：找畫面","avoid":"想像自己站在詩人的位置看"},{"q":"從鳥叫、白鷺飛上青天的畫面，可以感受到詩人怎樣的心情？","opts":["輕鬆愉快","悲傷害怕","生氣不滿","孤單寂寞"],"ans":"A","steps":["畫面一：黃鸝在柳樹上歡快地叫","畫面二：白鷺成行飛上天空，顏色明亮","明亮熱鬧的景色，透露出輕鬆愉快的心情"],"tests":"找心情","avoid":"景色明亮熱鬧，心情多半愉快"}]},{"label":"第三篇","title":"春望","text":["國破山河在，城春草木深。","感時花濺淚，恨別鳥驚心。","烽火連三月，家書抵萬金。","白頭搔更短，渾欲不勝簪。"],"cite":"杜甫〈春望〉（唐詩）","notes":"國破：國都被攻破　感時：感傷時局　恨別：痛恨離別　烽火：戰火　家書：家人寄來的信　搔：抓　渾：簡直　不勝簪：插不住髮簪","trans":"國都被攻破，只剩山河依舊；春天的城裡，草木長得又高又密。感傷時局，看到花也忍不住流淚；痛恨離別，聽到鳥叫也心驚。戰火連綿不斷，一封家信比萬兩黃金還珍貴。白頭髮越抓越稀少，簡直連髮簪都插不住了。","qs":[{"q":"「家書抵萬金」用了什麼修辭？","opts":["誇飾","對偶","擬人","設問"],"ans":"A","steps":["一封信不可能真的值萬兩黃金","故意說得很誇張，強調家信非常珍貴","所以是誇飾"],"tests":"修辭：誇飾","avoid":"不可能是真的，多半是誇飾"},{"q":"「城春草木深」的「草木深」，顯出城裡怎樣的景象？","opts":["花園很漂亮，大家都去賞花","樹林很茂盛，適合散步","沒有人整理，草木長得又高又密，很荒涼","春天來了，城裡很熱鬧"],"ans":"C","steps":["前一句：「國破」，國都被攻破","人都逃走了，沒有人整理，草木才會長得那麼深","所以是荒涼的景象"],"tests":"找畫面：推論","avoid":"景色要和前一句的事件連起來看"},{"q":"從「家書抵萬金」可以推知什麼？","opts":["詩人很有錢","戰亂中和家人很難通信，詩人非常掛念家人","寄信要花很多錢","家人寄了很多黃金給他"],"ans":"B","steps":["前半句：「烽火連三月」，戰爭一直沒停","戰亂中信很難寄到，所以一封家信特別珍貴","推出：他和家人斷了消息，很想念家人"],"tests":"推論：言外之意","avoid":"誇飾的背後，藏著真正的心情"},{"q":"整首詩的心情是什麼？","opts":["歡喜迎接春天","生氣鄰居吵鬧","為國家擔憂，又思念家人","平靜地欣賞風景"],"ans":"C","steps":["心情字：「感時」「恨別」「濺淚」「驚心」","前面寫國家殘破，後面寫想念家書、愁到白頭","所以是憂國又思家"],"tests":"全詩主旨：心情","avoid":"把心情字全部圈出來"}]},{"label":"第四篇","title":"梅花","text":["牆角數枝梅，凌寒獨自開。","遙知不是雪，為有暗香來。"],"cite":"王安石〈梅花〉（宋詩）","notes":"數枝：幾枝　遙：遠遠地　暗香：淡淡的香氣","trans":"牆角有幾枝梅花，冒著寒冷獨自開放。遠遠地就知道那不是雪，因為有淡淡的香氣飄過來。","qs":[{"q":"「凌寒獨自開」的「凌」是什麼意思？","opts":["凌亂","欺負","很高","冒著、頂著"],"ans":"D","steps":["組詞「凌亂」代回：凌亂的寒冷中開花 → 不通順","換招：梅花在冬天開，是頂著寒冷開花","所以「凌」＝冒著"],"tests":"字義：凌","avoid":"組詞不通，就看景物的處境"},{"q":"「為有暗香來」的「為」是什麼意思？","opts":["成為","做","替","因為"],"ans":"D","steps":["代回：因為有淡淡香氣飄來 → 通","驗證：前一句「遙知不是雪」是結果，這句是原因","所以「為」＝因為"],"tests":"一字多義：為","avoid":"前面是結果，後面就是原因"},{"q":"詩人遠遠地怎麼知道白白的花不是雪？","opts":["看到花瓣的形狀","聞到淡淡的香氣","摸到花是暖的","聽別人說的"],"ans":"B","steps":["證據：「遙知不是雪，為有暗香來」","雪沒有香味，梅花有","所以是靠香氣分辨"],"tests":"找證據：因果","avoid":"「為」後面就是原因"},{"q":"詩人寫梅花「凌寒獨自開」，是在讚美怎樣的品格？","opts":["喜歡熱鬧，和大家在一起","環境再艱難，也能堅持自己","怕冷，所以躲在牆角","只想讓別人看見自己"],"ans":"B","steps":["梅花在寒冷中開放，而且是「獨自」","不怕冷、不靠別人，還散發香氣","藉梅花讚美在困難中堅持的人"],"tests":"託物言志","avoid":"寫物的詩，常在說人的品格"}]},{"label":"第五篇","title":"泊船瓜洲","text":["京口瓜洲一水間，鍾山只隔數重山。","春風又綠江南岸，明月何時照我還。"],"cite":"王安石〈泊船瓜洲〉（宋詩）","notes":"泊船：停船　京口：地名，在長江南岸　瓜洲：地名，在長江北岸　一水間：隔著一條江　鍾山：山名，詩人的家在那附近　數重：幾層","trans":"京口和瓜洲只隔著一條長江，鍾山也只隔著幾座山。春風又一次吹綠了長江南岸，明月什麼時候才能照著我回家呢？","qs":[{"q":"「春風又綠江南岸」的「綠」是什麼意思？","opts":["使……變綠","綠色的","綠油油的樣子","綠燈"],"ans":"A","steps":["「綠」後面接著「江南岸」，形容詞當動作讀","代回：春風又吹綠了江南岸 → 通","所以「綠」＝使……變綠（形容詞當動詞）"],"tests":"詞類活用：綠","avoid":"形容詞後接地方，當動作讀"},{"q":"「一水間」「只隔數重山」寫出了什麼？","opts":["長江很寬很危險","鍾山非常高","詩人住在船上","詩人離家其實不遠"],"ans":"D","steps":["「一水間」：只隔一條江","「只隔數重山」：只隔幾座山，用了「只」字","所以是說離家很近"],"tests":"找畫面：距離","avoid":"「只」字透露詩人的感覺"},{"q":"「春風又綠」的「又」字，透露出什麼？","opts":["春風今天吹了兩次","春天又來了一次，詩人離家已經很久","江南岸的草又枯了","詩人又搬家了"],"ans":"B","steps":["「又」＝再一次","春天再一次來到，表示時間又過了一年","推出：詩人離開家已經很久了"],"tests":"推論：一字細讀","avoid":"小小的「又」字，藏著時間"},{"q":"最後一句「明月何時照我還」表達了什麼心情？","opts":["喜歡看月亮","害怕晚上坐船","不想回家","想念家鄉，盼望早日回家"],"ans":"D","steps":["「何時」：什麼時候才能","「照我還」：照著我回家","家近卻回不去，所以盼望回家，是思鄉"],"tests":"找心情","avoid":"最後一句常是詩人真正想說的"}]}]},{"no":"第 5 組","title":"一學期的罰球練習","skill":"圖文對讀＋段落重點","chart":true,"steps":["❶ 先讀文字：每一段找一句重點","❷ 再看圖表：標題、單位、最大值、最小值","❸ 文字說的每一句，回圖表找數字對證","❹ 圖表沒有的資料（例如原因、心情），再合理也是「沒有證據」","❺ 把每段重點連起來，就是全文主旨"],"demo":{"q":"文章說小宇期末的命中球數「接近開學時的兩倍」，圖表能證明嗎？","a":["先看材料：表格「九月 8 球、十月 10 球、十一月 12 球、十二月 15 球」","→ 開學（九月）8 球，兩倍是 8×2＝16 球","→ 十二月 15 球，比 16 少 1 球，確實「接近」兩倍","答：能證明"]},"parts":[{"label":"第一篇","title":"一學期的罰球練習","text":["開學時，小宇在校隊的罰球測驗中，二十球只投進八球，他很不服氣。教練告訴他：「罰球不是靠運氣，是靠每天一樣的動作。」於是小宇決定，每天練球結束後多留下來，再投二十球罰球。","剛開始，他常常投到手痠，球還是一直打框彈出來。後來他發現，每次出手前先拍球三下、深呼吸，再盯著籃框投，動作就穩多了。他把每個月測驗的結果記在筆記本上，看到數字慢慢變多，練習就更有動力。","到了十二月，小宇的命中球數已經接近開學時的兩倍。他說：「進步不是一下子發生的，而是每天多做一點點。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["月份","罰球命中（球，每次測 20 球）"],"per":1,"unit":"球","data":[["九月",8],["十月",10],["十一月",12],["十二月",15]],"qs":[{"q":"第二段的重點是什麼？","opts":["小宇常常投到手痠","小宇每次出手前都拍球三下","小宇的筆記本很漂亮","小宇找到穩定的出手動作，並記錄自己的進步"],"ans":"D","steps":["第二段先說遇到困難：手痠、一直投不進","接著說找到方法：拍球三下、深呼吸，並記錄結果","重點要包含整段，不是只挑其中一句"],"tests":"段落重點","avoid":"重點要包含整段，不是只有一句"},{"q":"哪一個月比上一個月進步最多？","opts":["十二月","十月","十一月","九月"],"ans":"A","steps":["十月 10－8＝2；十一月 12－10＝2","十二月 15－12＝3","3 最多 → 十二月"],"tests":"圖表：算差距","avoid":"每兩個月相減，再比大小"},{"q":"下列哪一個說法，只靠圖表就能證明？","opts":["小宇每天都多投二十球","拍球三下讓小宇投得更準","小宇每個月的命中球數都比上個月多","教練很滿意小宇的表現"],"ans":"C","steps":["圖表：8、10、12、15，一路變多 → 有證據","每天多投、拍球三下的方法，是文字說的，圖表看不出來","教練滿不滿意，文字和圖表都沒有"],"tests":"圖文對讀","avoid":"圖表只能證明數字"},{"q":"把三段的重點連起來，全文想說什麼？","opts":["罰球只要靠運氣","教練很嚴格","進步靠的是每天持續練習一點點","小宇天生就很會投籃"],"ans":"C","steps":["第一段：下定決心每天多練","第二段：找到方法並記錄；第三段：「每天多做一點點」","連起來：持續的練習帶來進步"],"tests":"全文主旨","avoid":"每段一句話，連起來就是主旨"}]},{"label":"第二篇","title":"一週午餐剩菜紀錄","text":["六年甲班的環保小組發現，每天午餐後，回收桶裡都有不少剩菜。為了知道浪費有多嚴重，他們連續一週，用同樣大小的便當盒來量全班的剩菜，記錄裝滿了幾盒。","結果顯示，有一天的剩菜特別多。小組成員小芸猜：「是不是那天的菜比較不受歡迎？」不過，她也提醒大家，這只是猜測，還需要再問問同學。","班會時，大家討論出兩個辦法：第一，打菜時先說自己吃得完的份量，不夠再添；第二，把剩菜量貼在公布欄上，讓大家每天都看得到。全班約定下個月再記錄一次，看看有沒有變少。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","剩菜量（盒）"],"per":1,"unit":"盒","data":[["週一",6],["週二",4],["週三",9],["週四",3],["週五",5]],"qs":[{"q":"文章說「有一天的剩菜特別多」，是哪一天？","opts":["週三","週一","週五","週二"],"ans":"A","steps":["五天：6、4、9、3、5","最大是 9","對應週三"],"tests":"圖文對讀：找最大值","avoid":"文字沒說的數字，回圖表找"},{"q":"這一週全班總共剩下幾盒菜？","opts":["27 盒","25 盒","26 盒","30 盒"],"ans":"A","steps":["6＋4＋9＋3＋5","＝27","換順序檢查：（6＋4）＋（9＋5）＋3＝10＋14＋3＝27"],"tests":"圖表加總","avoid":"加完再用另一種順序檢查"},{"q":"小芸猜那天的菜比較不受歡迎，圖表能證明嗎？","opts":["能，因為那天剩菜最多","不能，圖表只有剩菜量，沒有菜色和同學喜好的資料","能，因為小芸是環保小組","不能，因為那天沒有午餐"],"ans":"B","steps":["圖表只能證明：週三剩 9 盒最多","「菜不受歡迎」是原因，圖表沒有菜色資料","文中小芸自己也說「這只是猜測」"],"tests":"圖文對讀：原因","avoid":"「為什麼」要另外找證據"},{"q":"第三段的重點是什麼？","opts":["全班討論出減少剩菜的辦法，並約定再記錄","打菜時要說自己的份量","公布欄上貼了很多東西","下個月要換新的便當盒"],"ans":"A","steps":["第三段先說「討論出兩個辦法」","最後說「下個月再記錄一次」","重點要包含辦法和約定"],"tests":"段落重點","avoid":"看段落第一句和最後一句"}]},{"label":"第三篇","title":"運動會各項目報名人數","text":["學校運動會快到了，六年級共有一百二十位同學，每個人都要選一個項目報名，而且只能選一個。體育股長把報名結果整理成下表。","從表中可以看出，大隊接力最熱門。股長說，很多同學喜歡大隊接力，是因為全班一起跑、一起加油，最有團結的感覺。拔河的人數排第二，同學們說，拔河靠的是大家同時用力，不一定是力氣最大的人贏。","報名最少的是跳高。老師鼓勵大家：「不管參加哪一項，認真準備、為隊友加油，就是運動會最重要的事。」"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["項目","報名人數（人）"],"per":5,"unit":"人","data":[["大隊接力",40],["拔河",35],["趣味競賽",25],["跳遠",15],["跳高",5]],"qs":[{"q":"表中的人數加起來是多少？和文章說的六年級人數相符嗎？","opts":["115 人，不相符","120 人，相符","120 人，不相符","125 人，相符"],"ans":"B","steps":["40＋35＋25＋15＋5＝120","文章說「一百二十位同學」，每人只選一項","所以加起來剛好 120 人，相符"],"tests":"圖文對讀：核對總數","avoid":"文字的數字也要回圖表核對"},{"q":"報名大隊接力的人數，是報名跳高的幾倍？","opts":["5 倍","8 倍","6 倍","35 倍"],"ans":"B","steps":["大隊接力 40 人，跳高 5 人","40÷5＝8","所以是 8 倍"],"tests":"圖表：算倍數","avoid":"倍數用除法"},{"q":"「大隊接力最熱門，是因為最有團結的感覺」，這句話哪一部分有圖表證據？","opts":["兩部分都有圖表證據","兩部分都沒有證據","只有「因為團結」有證據","「最熱門」有證據；「因為團結」是股長的說法，圖表看不出來"],"ans":"D","steps":["圖表：大隊接力 40 人最多 → 「最熱門」有證據","圖表只有人數，沒有同學選擇的理由","原因要從文字找，不能說是圖表證明的"],"tests":"圖文對讀：原因","avoid":"圖表只能證明「多少」"},{"q":"第二段主要在說什麼？","opts":["拔河一定是力氣大的人贏","體育股長很會整理表格","跳高報名的人最少","最熱門的兩個項目，以及同學喜歡它們的原因"],"ans":"D","steps":["第二段前半：大隊接力最熱門的原因","後半：拔河排第二，以及同學的看法","「跳高最少」是第三段的內容"],"tests":"段落重點","avoid":"注意每段管的範圍"}]},{"label":"第四篇","title":"寒假想讀的書","text":["寒假前，老師請全班三十位同學，每人選一類寒假最想讀的書，結果整理成下表。","老師看了表格說：「選漫畫的人最多，我一點也不意外。」她提醒大家，漫畫也有很多好作品，例如用漫畫說歷史故事、介紹科學知識的書。不過，她也希望大家寒假至少讀一本文字比較多的書，練習自己在腦中想像畫面。","班長提議，開學後辦一場「好書交換會」，每個人帶一本讀完的書來介紹，再和同學交換。這樣一本書可以被很多人讀到，大家也能認識自己平常不會選的書。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["書的種類","人數（人）"],"per":1,"unit":"人","data":[["漫畫",12],["科普",7],["小說",6],["歷史故事",3],["其他",2]],"qs":[{"q":"選漫畫的人，佔全班的幾分之幾？","opts":["三分之一","二分之一","五分之二","十分之三"],"ans":"C","steps":["漫畫 12 人，全班 30 人","12／30，上下同除以 6 → 2／5","所以是五分之二"],"tests":"圖表：算分數","avoid":"先寫成分數，再約分"},{"q":"選科普和小說的人加起來，和選漫畫的人比，結果是什麼？","opts":["一樣多","漫畫多 1 人","科普加小說多 1 人","漫畫多 5 人"],"ans":"C","steps":["科普 7＋小說 6＝13","漫畫 12","13－12＝1，科普加小說多 1 人"],"tests":"圖表：比較","avoid":"先算好一邊，再和另一邊比"},{"q":"第二段的重點是什麼？","opts":["老師不喜歡漫畫","漫畫都在講歷史","選漫畫的人最多","老師認為漫畫也有好書，但希望大家也讀文字多的書"],"ans":"D","steps":["第二段先說漫畫也有好作品","接著「不過」：希望至少讀一本文字多的書","「不過」後面常是老師真正的提醒"],"tests":"段落重點","avoid":"「不過」後面常是重點"},{"q":"下列哪一個說法有證據？","opts":["每個同學寒假都會讀漫畫","選歷史故事的人比選小說的人少","好書交換會已經辦過了","選科普的同學成績比較好"],"ans":"B","steps":["圖表：歷史故事 3 人，小說 6 人 → 有證據","每人只選一類，不能說「每個同學都讀漫畫」；交換會是開學後才要辦","成績的資料，文字和圖表都沒有"],"tests":"找證據＋絕對字","avoid":"看到「每個」先畫圈"}]},{"label":"第五篇","title":"籃球場一週使用人數","text":["學校的室外籃球場很受歡迎。為了安排各班輪流使用的時間，體育組在一週內，每天統計中午到籃球場打球的人數。","統計結果顯示，人數每天不太一樣。體育老師推測，週三中午人特別少，可能和那天下雨有關；而週五人最多，也許是因為隔天就放假，大家想多打一會兒。不過老師強調，這些都只是推測。","根據這份統計，體育組決定在人最多的日子，把球場分成兩半，讓兩個班級同時使用，並請高年級學長姐幫忙維持秩序。"],"cite":"練習用數據，非真實調查","notes":"","trans":"","chartHead":["星期","使用人數（人）"],"per":5,"unit":"人","data":[["週一",20],["週二",35],["週三",10],["週四",30],["週五",40]],"qs":[{"q":"體育組會在哪一天把球場分成兩半？","opts":["週二","週五","週四","週一"],"ans":"B","steps":["第三段：在「人最多的日子」分成兩半","圖表：週五 40 人最多","所以是週五"],"tests":"圖文對讀","avoid":"文字說「最多」，回圖表找是哪天"},{"q":"人數最多的一天比最少的一天多幾人？","opts":["20 人","25 人","40 人","30 人"],"ans":"D","steps":["最多：週五 40 人","最少：週三 10 人","40－10＝30"],"tests":"圖表：最大減最小","avoid":"先找出最大值和最小值"},{"q":"「週三人少是因為下雨」，這個說法的根據是什麼？","opts":["只是老師的推測，圖表只能證明週三人最少","圖表證明週三下雨","圖表證明下雨天沒人打球","體育組正式公布的原因"],"ans":"A","steps":["圖表：週三 10 人最少 → 只能證明人少","第二段：老師說「可能」「這些都只是推測」","圖表沒有天氣資料"],"tests":"圖文對讀：推測","avoid":"「可能、也許」是推測，不是證據"},{"q":"把三段連起來，全文主要在說什麼？","opts":["週三一定會下雨","籃球場太小需要重蓋","體育組統計球場使用人數，並依結果安排使用方式","高年級學生最愛打籃球"],"ans":"C","steps":["第一段：為了安排時間而統計","第二段：人數的變化和推測；第三段：依結果做決定","連起來：統計 → 分析 → 安排"],"tests":"全文主旨","avoid":"找「為什麼做、做了什麼、結果」"}]}]},{"no":"週末關卡","title":"楊脩題門","skill":"小六上期末總關卡（第 1～8 週招式全用）","steps":["❶ 補主詞：每個動作都問「誰做的？」","❷ 字義五招：先組詞代回，再換一招驗證","❸ 虛詞路標：而、則、故、之、因","❹ 推論＋因果：兩個證據合起來，排出前因後果","❺ 主旨與道理：作者最後想告訴我們什麼"],"demo":{"q":"「始構榱桷」的「構」是什麼意思？","a":["先看材料：「時作相國門，始構榱桷，魏武自出看。」","→ 組詞「建構」，代回：剛開始建造屋椽 → 通","→ 驗證：前面「作相國門」正在蓋大門，後面「既竟」是蓋完了","答：建造"]},"parts":[{"label":"第一篇","title":"楊脩題門","text":["楊德祖為魏武主簿，時作相國門，始構榱桷，魏武自出看，使人題門作「活」字，便去。楊見，即令壞之。既竟，曰：「門中『活』，『闊』字。王正嫌門大也。」"],"cite":"《世說新語．捷悟》","notes":"楊德祖：楊脩，字德祖　魏武：曹操　主簿：管理文書的官　相國門：相國府的大門　榱桷：屋椽　題：寫　既竟：做完以後　王：指曹操","trans":"楊脩擔任曹操的主簿，當時正在建造相國府的大門，剛開始架上屋椽，曹操親自出來看，叫人在門上寫了一個「活」字，就走了。楊脩看到，馬上叫人把門拆掉。拆完以後，他說：「門裡面一個『活』，就是『闊』字。魏王正是嫌門太大了。」","qs":[{"q":"「使人題門作『活』字，便去」，寫完就走的是誰？","opts":["曹操","楊脩","工匠","寫字的人"],"ans":"A","steps":["前一句：「魏武自出看」，主詞是曹操","「使人題門」：曹操叫人寫字，接著「便去」主詞沒換","所以走的是曹操"],"tests":"補主詞","avoid":"「使人」的人，就是做下一個動作的人"},{"q":"「即令壞之」的「壞」是什麼意思？","opts":["壞人","生氣","拆掉","變舊"],"ans":"C","steps":["組詞「破壞」，代回：馬上叫人把門破壞（拆掉）→ 通","驗證：楊脩看出曹操嫌門太大，所以要拆掉重做","「壞」後面接「之」，當動作讀"],"tests":"詞類活用：壞","avoid":"形容詞後接「之」，當動作讀"},{"q":"楊脩怎麼知道曹操嫌門太大？","opts":["曹操親口告訴他","他量了門的大小","工匠跟他說的","「門」字裡面放一個「活」字，就是「闊」字"],"ans":"D","steps":["證據：曹操在門上寫「活」字","楊脩說：「門中『活』，『闊』字」","推論：闊＝寬大，所以是嫌門太寬"],"tests":"推論：字形謎","avoid":"把字拆開、合起來想一想"},{"q":"從這件事可以看出楊脩是怎樣的人？","opts":["做事很粗心","很怕曹操","喜歡拆房子","聰明機靈，能猜透曹操的心思"],"ans":"D","steps":["證據一：曹操只寫一個字，什麼也沒說就走了","證據二：楊脩馬上看懂，叫人拆門","合起來：他反應快、能猜中曹操的意思"],"tests":"人物形象","avoid":"別人看不懂的，他看懂了"}]},{"label":"第二篇","title":"一人一口酪","text":["人餉魏武一桮酪，魏武噉少許，蓋頭上題「合」字以示眾。眾莫能解。次至楊脩，脩便噉，曰：「公教人噉一口也，復何疑？」"],"cite":"《世說新語．捷悟》","notes":"魏武：曹操　桮：同「杯」　酪：用牛羊奶做成的食品　噉：吃　蓋頭：蓋子上面　示：給人看　次：依順序輪到　公：對曹操的尊稱　復：又","trans":"有人送給曹操一杯酪，曹操吃了一點，在蓋子上寫了一個「合」字，拿給大家看。大家都看不懂。依順序輪到楊脩，楊脩就吃了，說：「曹公是叫每個人吃一口啊，還有什麼好懷疑的呢？」","qs":[{"q":"「人餉魏武一桮酪」的「餉」是什麼意思？","opts":["送（食物）給人","吃掉","收到","做好"],"ans":"A","steps":["組詞「糧餉」，代回：有人送曹操一杯酪 → 通","驗證：送的是吃的東西，曹操接著才「噉少許」","這是「送吃的給人」，不是收到或吃掉"],"tests":"字義：餉","avoid":"學過的字，代回前面的例句"},{"q":"「眾莫能解」的「莫」是什麼意思？","opts":["不要","很大","沒有人","最後"],"ans":"C","steps":["代回：大家沒有人能理解 → 通","驗證：後面「次至楊脩」，大家都不懂，才輪到楊脩","所以「莫」＝沒有人"],"tests":"字義：莫","avoid":"後面有人解開，前面就是大家不懂"},{"q":"楊脩為什麼說「公教人噉一口」？","opts":["曹操只吃了一口","「合」字拆開是「人、一、口」","酪只剩一口","大家都想吃"],"ans":"B","steps":["證據：蓋子上寫的是「合」字","把「合」拆開：上面「人」，中間「一」，下面「口」","推出：人一口 → 每人吃一口"],"tests":"推論：字形謎","avoid":"把字拆開讀一讀"},{"q":"這篇和第一篇〈楊脩題門〉比一比，共同點是什麼？","opts":["曹操都用一個字出謎，楊脩都能從字形猜出意思","兩篇都在講蓋房子","兩篇的楊脩都猜錯了","兩篇都是曹操在送東西"],"ans":"A","steps":["第一篇：曹操寫「活」，楊脩看出是「闊」","第二篇：曹操寫「合」，楊脩看出是「人一口」","共同點：一字出謎，楊脩從字形破解"],"tests":"互文對讀","avoid":"兩篇放在一起找相同的地方"}]},{"label":"第三篇","title":"三豕渡河","text":["子夏之晉，過衛，有讀史記者曰：「晉師三豕涉河。」子夏曰：「非也，是己亥也。夫『己』與『三』相近，『豕』與『亥』相似。」至於晉而問之，則曰「晉師己亥涉河」也。"],"cite":"《呂氏春秋．察傳》（節選）","notes":"子夏：孔子的學生　晉、衛：春秋時的國名　史記：記載歷史的書（不是司馬遷的《史記》）　師：軍隊　豕：豬　涉：渡過　己亥：古人記日子的方法，代表某一天","trans":"子夏到晉國去，經過衛國，聽到有個讀史書的人說：「晉國軍隊和三隻豬渡過黃河。」子夏說：「不對，是『己亥』。『己』和『三』字形很接近，『豕』和『亥』字形很相似。」到了晉國一問，果然史書上寫的是「晉國軍隊在己亥這一天渡過黃河」。","qs":[{"q":"「子夏之晉」的「之」是什麼意思？","opts":["往、到","的","他","這個"],"ans":"A","steps":["「之」後面接著地方「晉」","代回：子夏到晉國去 → 通","驗證：下一句「過衛」，正在路上"],"tests":"虛詞：之","avoid":"「之」後面是地方，就是「往」"},{"q":"子夏為什麼說「非也」？","opts":["他不喜歡晉國","軍隊和三隻豬渡河說不通，他判斷是字抄錯了","他記得那天沒有渡河","讀書的人念得太小聲"],"ans":"B","steps":["證據一：「晉師三豕涉河」，史書記軍隊和三隻豬渡河，不合理","證據二：他說「己」像「三」、「豕」像「亥」","合起來：他推斷是字形相近而抄錯"],"tests":"推論：找不合理","avoid":"讀到不合理的地方，要停下來想"},{"q":"「至於晉而問之，則曰『晉師己亥涉河』也」證明了什麼？","opts":["衛國人讀得才對","子夏的判斷是對的","史書上真的有三隻豬","晉國的軍隊沒有渡河"],"ans":"B","steps":["子夏推斷原文是「己亥」","到晉國一問，果然是「己亥涉河」","所以證明子夏判斷正確"],"tests":"因果：驗證結果","avoid":"最後的結果，用來驗證前面的推論"},{"q":"這個故事告訴我們什麼？","opts":["古書都是錯的","豬不會渡河","出門旅行要經過衛國","讀到或聽到不合理的話，要用道理判斷，並去查證"],"ans":"D","steps":["衛國人照字讀，沒發現不合理","子夏用道理判斷，再到晉國查證","道理：不盲目相信，要判斷和查證"],"tests":"寓言道理","avoid":"比一比兩個人的做法"}]},{"label":"第四篇","title":"竭澤而漁","text":["竭澤而漁，豈不獲得？而明年無魚；焚藪而田，豈不獲得？而明年無獸。"],"cite":"《呂氏春秋．義賞》（節選）","notes":"澤：湖泊、池塘　焚：燒　藪：草木茂密的沼澤地　獲得：有收穫","trans":"把湖水弄乾來捕魚，難道會沒有收穫嗎？但是第二年就沒有魚了；把草澤燒光來打獵，難道會沒有收穫嗎？但是第二年就沒有野獸了。","qs":[{"q":"「竭澤而漁」的「竭」是什麼意思？","opts":["竭力保護","弄乾、用盡","填滿","清洗"],"ans":"B","steps":["組詞「枯竭」，代回：把湖水弄乾來捕魚 → 通","驗證：後面「明年無魚」，水乾了魚全被抓光","所以「竭」＝弄乾、用盡"],"tests":"字義：竭","avoid":"組詞代回，再看後果驗證"},{"q":"「焚藪而田」的「田」是什麼意思？","opts":["種田","田野","打獵","田地的數量"],"ans":"C","steps":["代回今天的「種田」：燒光草澤來種田？後面說「無獸」，對不上","比對稱句：「竭澤而漁」對「焚藪而田」，漁＝捕魚，田＝打獵","驗證：後面「明年無獸」，抓的是野獸 → 打獵"],"tests":"古今異義：田","avoid":"對稱句的位置，意思也成對"},{"q":"「而明年無魚」的「而」是什麼意思？","opts":["然後","而且","但是、卻","因為"],"ans":"C","steps":["前面：「豈不獲得」，當年有收穫","後面：明年沒有魚，和收穫相反","前後相反 →「而」＝但是"],"tests":"虛詞：而","avoid":"前後相反，「而」讀成「但是」"},{"q":"這段話告訴我們什麼道理？","opts":["捕魚比打獵容易","只顧眼前的好處，會失去長久的利益","明年一定會豐收","湖水越少魚越多"],"ans":"B","steps":["當年：一次抓光，收穫很多","後來：明年沒魚、沒獸","道理：只顧眼前，會斷了以後的路"],"tests":"推論：道理","avoid":"比一比「今年」和「明年」"}]},{"label":"第五篇","title":"看殺衛玠","text":["衛玠從豫章至下都，人久聞其名，觀者如堵牆。玠先有羸疾，體不堪勞，遂成病而死。時人謂看殺衛玠。"],"cite":"《世說新語．容止》","notes":"衛玠：西晉人，長得非常俊美　豫章：地名　下都：指京城建業　羸疾：身體虛弱的病　不堪：受不了　時人：當時的人","trans":"衛玠從豫章來到京城，大家早就聽說他的名聲，來看他的人多得像一道牆。衛玠本來就有身體虛弱的病，身體受不了勞累，於是生病死了。當時的人說衛玠是被大家看死的。","qs":[{"q":"「觀者如堵牆」用了什麼修辭？","opts":["譬喻，把圍觀的人群比成一道牆","對偶","擬人","設問"],"ans":"A","steps":["有「如」字：觀者「如」堵牆","把很多人擠在一起，比成一道牆","所以是譬喻，形容人非常多"],"tests":"修辭：譬喻","avoid":"看到「如、似、若」，先想譬喻"},{"q":"「玠先有羸疾」的「先」是什麼意思？","opts":["首先","祖先","本來、原先","走在前面"],"ans":"C","steps":["組詞「原先」，代回：衛玠本來就有虛弱的病 → 通","驗證：病是他來京城之前就有的，不是看完才有","所以「先」＝本來"],"tests":"一字多義：先","avoid":"看事情發生的先後驗證"},{"q":"衛玠的死，下列因果順序哪一個正確？","opts":["生病而死 → 很多人圍觀 → 名氣大 → 身體受不了","很多人圍觀 → 名氣大 → 生病而死 → 身體受不了","身體受不了 → 名氣大 → 很多人圍觀 → 生病而死","名氣大 → 很多人圍觀 → 身體受不了勞累 → 生病而死"],"ans":"D","steps":["「人久聞其名」→「觀者如堵牆」","「先有羸疾，體不堪勞」","路標「遂」：於是成病而死"],"tests":"因果連鎖","avoid":"順著「遂」找出最後的結果"},{"q":"「時人謂看殺衛玠」是什麼意思？","opts":["有人故意殺了衛玠","衛玠喜歡看別人","衛玠被看了一眼就死了","當時的人說，衛玠是被大家看死的，形容圍觀的人太多"],"ans":"D","steps":["「謂」＝說、稱為；「看殺」＝被看死","證據：他身體虛弱，被太多人圍觀而勞累致死","這是誇張的說法，不是真的有人殺他"],"tests":"推論：誇張說法","avoid":"誇張的話，要找出真正的意思"}]}]}],"teach":[{"intro":"期末第一關：補主詞＋人物形象，先弄清楚「誰做的」，再看「他是怎樣的人」。","items":[{"t":"補主詞怎麼補？","d":["文言常把主詞省掉，看到動作就問「誰做的？」，往前找最近的人；主詞沒換，就一路沿用。","「王戎七歲，嘗與諸小兒遊」→ 遊玩的是王戎；「人問之，答曰」→ 問的是別人，回答的換成王戎。"],"ex":"就像轉播員只說「切入、上籃」，你要知道是哪一位球員。"},{"t":"什麼是「人物形象」？","d":["就是人物的性格，要從他「說的話」和「做的事」找證據。","陳太丘和朋友約好中午出發，朋友「過中不至」→ 不守時；太丘「舍去」→ 不無限等人。"],"ex":"就像教練看你比賽時怎麼傳球、怎麼防守，就知道你是什麼樣的球員。"},{"t":"對比襯托","d":["作者寫別人怎樣，常是為了突顯主角。","「諸兒競走取之，唯戎不動」→ 用大家搶著摘李子，襯托王戎的冷靜。"],"ex":"全隊都慌了，只有控球後衛很冷靜，大家就更看得出他厲害。"}],"demo":["材料：「陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。」","補主詞：誰「不至」？約好的朋友；誰「舍去」？陳太丘；誰「乃至」？朋友","人物形象：過了中午才到 → 朋友不守時"]},{"intro":"期末第二關：字義五招總複習，一字多義、古今異義、詞類活用一次練。","items":[{"t":"五招由易到難","d":["① 組詞代回 → ② 看人物動作目的驗證 → ③ 看部首 → ④ 比對稱句 → ⑤ 想成語（備用）。","至少兩種方法指向同一個答案，才算確定。"],"ex":"就像判斷是不是犯規，要看兩個角度的重播。"},{"t":"一字多義","d":["同一個字，在不同句子意思可能不一樣，每次都要重新代回。","「卜子使其妻為袴」的為＝做；「欲以為子」的為＝當作。同一個「為」，意思不一樣。"],"ex":"就像「蓋」可以是鍋蓋，也可以是籃球場上的「火鍋」阻攻，要看前後。"},{"t":"古今異義＋詞類活用","d":["古今異義：同一個詞，古代和今天意思不同，例如「走」＝跑、第 1 組的「寧可」＝怎麼可以。","詞類活用：名詞、形容詞後面接著東西，常當動作讀，例如「魏武奇愛之」的奇＝覺得他奇特。"],"ex":"就像古文的「走」是跑，今天的「走」是慢慢走，同一個字意思變了。"}],"demo":["材料：「孫子荊年少時欲隱。」","「欲」：組詞「欲望」代回 → 年輕時欲望隱居，不通順；改成「想要」→ 年輕時想要隱居，通","驗證：後面他說「當枕石漱流」，正是在講隱居以後的生活 → 欲＝想要"]},{"intro":"期末第三關：推論＋因果＋寓言道理，把證據串起來，讀出作者沒直說的話。","items":[{"t":"因果連鎖","d":["圈出路標「故、則、於是、因、遂」，把事情排成一條鏈。","守株待兔：兔子撞樹死了 → 農夫因此放下農具守著樹 → 再也等不到兔子，被人笑。"],"ex":"就像抄截 → 快攻 → 上籃得分，一步接一步。"},{"t":"推論：證據＋證據＝結論","d":["把前後兩個情況放在一起比，找出改變的地方。","智子疑鄰：兒子和鄰居老人說了同一句話，主人只懷疑老人 → 推出主人看的是親疏，不是道理。"],"ex":"柴犬平常會跑來，你手上拿著指甲剪牠就躲，你推得出牠怕剪指甲。"},{"t":"寓言三問","d":["① 發生什麼事？② 結果怎樣？③ 作者想勸我們什麼？","守株待兔：撿到一次撞死的兔子 → 天天守樹卻再也等不到 → 不要靠僥倖，要靠努力。"]}],"demo":["材料：「宋人有耕田者，田中有株，兔走，觸株折頸而死，因釋其耒而守株，冀復得兔，兔不可復得，而身為宋國笑。」","因果：兔子撞樹死 →「因」放下農具守樹 → 兔子不再來 → 被宋國人笑","道理：不能把一次的好運當成常態，要靠自己努力"]},{"intro":"期末第四關：讀詩先找畫面，再圈修辭，最後找心情。","items":[{"t":"四種常見修辭","d":["譬喻：把甲說成乙（似、如、像）；對偶：上下句字數相同、詞性相對；誇飾：故意說得很誇張；擬人：把東西當人寫。","「疑是地上霜」把月光說成霜，是譬喻；「白日依山盡，黃河入海流」是對偶；「飛流直下三千尺」是誇飾。"],"ex":"就像形容隊友「快得像閃電」，是譬喻也帶一點誇飾。"},{"t":"詩裡的詞類活用","d":["形容詞後面接地方或東西，就當動作讀。","「紅了櫻桃，綠了芭蕉」→ 櫻桃變紅了、芭蕉變綠了，紅、綠都當動作讀。"]},{"t":"找心情","d":["圈出心情字：淚、驚、恨、獨、何時；也看景色是明亮還是荒涼。","〈靜夜思〉「舉頭望明月，低頭思故鄉」→ 有「思故鄉」，是思鄉。"],"ex":"比賽輸了，連球場的燈看起來都暗暗的——景色會跟著心情變。"}],"demo":["材料：「床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。」","畫面：床前的月光、白白的像霜、抬頭看月亮","修辭：「疑是地上霜」把月光說成霜 → 譬喻；心情：「思故鄉」→ 想念家鄉"]},{"intro":"期末第五關：文字和圖表一起讀，段落重點和數字證據都要抓到。","items":[{"t":"段落重點","d":["每段先看第一句和最後一句，再看「不過、所以、於是」後面的話。","重點要包含整段，不能只挑其中一句。"]},{"t":"圖文對讀","d":["文字說的每一句，回圖表找數字。數字對得上才算「有證據」。","「二月借書最多」圖表能證明；「因為二月放寒假」圖表沒有資料，只是猜測。"],"ex":"就像裁判看重播：看得到的才算數。"}],"demo":["材料：表格「一月 5 本、二月 8 本、三月 6 本」","題目：借書最多的月份比最少的月份多幾本？","最多二月 8，最少一月 5 → 8－5＝3 → 多 3 本"]},{"intro":"期末總關卡：第 1～8 週的招式全部上場，一篇文章用好幾招。","items":[{"t":"解題順序","d":["① 先補主詞 → ② 圈虛詞路標 → ③ 不懂的字用五招 → ④ 推論、因果 → ⑤ 最後想主旨或道理。","每一題都要能指著原文說出證據。"],"ex":"就像比賽前的戰術板：先看位置，再看路線，最後決定怎麼得分。"},{"t":"字形謎也是推論","d":["把字拆開或合起來想一想。","例如「日」和「月」合起來是「明」；「休」拆開是「人」靠著「木」。"]}],"demo":["材料：「學而時習之，不亦說乎？」","字義：「說」組詞「說話」代回 → 不亦說話乎，不通；換招看語氣，「不亦……乎」在說感受 → 說＝高興","虛詞：「而」前面是學，後面是複習，前後接著發生 →「而」＝然後","道理：學了按時複習，是快樂的事"]}],"daily":[{"words":[["期","約定","文侯與虞人期獵"],["餉","送（食物）給人","人餉魏武一桮酪"]],"line":"君問可，非問臣之讎也。"},{"words":[["故","舊的","象吾故袴"],["別","分辨","亂之楮葉之中而不可別也"]],"line":"我孰與城北徐公美？"},{"words":[["索","尋找","而不肯索"],["遺","遺失","得人遺契者"]],"line":"死馬且買之五百金，況生馬乎？"},{"words":[["凌","冒著","凌寒獨自開"],["抵","值得、相當","家書抵萬金"]],"line":"春風又綠江南岸，明月何時照我還。"},{"words":[["竭","弄乾、用盡","竭澤而漁"],["莫","沒有人","眾莫能解"]],"line":"竭澤而漁，豈不獲得？而明年無魚"},null],"quiz":{"words":[["期","約定","文侯與虞人期獵"],["餉","送（食物）給人","人餉魏武一桮酪"],["故","舊的","象吾故袴"],["別","分辨","亂之楮葉之中而不可別也"],["索","尋找","荊人有遺弓者，而不肯索"],["遺","遺失","得人遺契者"],["凌","冒著","凌寒獨自開"],["抵","值得、相當","家書抵萬金"],["竭","弄乾、用盡","竭澤而漁"],["莫","沒有人","眾莫能解"]],"lines":[["君問可，","非問臣之讎也。"],["我孰與","城北徐公美？"],["死馬且買之五百金，","況生馬乎？"],["春風又綠江南岸，","明月何時照我還。"],["竭澤而漁，豈不獲得？","而明年無魚"]],"parts":[{"label":"第一篇","title":"七步成詩","text":["文帝嘗令東阿王七步中作詩，不成者行大法。應聲便為詩曰：「煮豆持作羹，漉菽以為汁。萁在釜下然，豆在釜中泣。本自同根生，相煎何太急？」帝深有慚色。"],"cite":"《世說新語．文學》","notes":"文帝：魏文帝曹丕　東阿王：曹植，曹丕的弟弟　大法：死刑　應聲：話剛說完　羹：濃湯　漉：過濾　菽：豆子　萁：豆子的莖　釜：鍋子　然：同「燃」，燒　慚色：慚愧的神色","trans":"魏文帝曾經命令東阿王曹植在走七步路的時間內作出一首詩，作不出來就要處死。曹植話聲剛落就作了一首詩：「煮豆子來做濃湯，過濾豆子當作湯汁。豆莖在鍋子下面燃燒，豆子在鍋子裡哭泣。我們本來是從同一個根長出來的，為什麼要這麼急著互相煎熬？」文帝聽了，臉上露出很慚愧的神色。","qs":[{"q":"「應聲便為詩曰」，作詩的是誰？","opts":["魏文帝","東阿王曹植","旁邊的大臣","煮豆子的人"],"ans":"B","steps":["第一句：文帝「令東阿王七步中作詩」","被命令作詩的是東阿王，接著「應聲便為詩」","所以作詩的是曹植"],"tests":"補主詞","avoid":"被命令的人，就是去做的人"},{"q":"「豆在釜中泣」用了什麼修辭？","opts":["擬人，把豆子寫成會哭的人","對偶","誇飾","設問"],"ans":"A","steps":["豆子不會真的哭泣","「泣」是人的動作，用在豆子身上","所以是擬人"],"tests":"修辭：擬人","avoid":"東西做出人的動作，就是擬人"},{"q":"詩中燒火的「萁」和被煮的「豆」，分別比喻誰？","opts":["萁比喻曹丕，豆比喻曹植","萁比喻曹植，豆比喻曹丕","兩個都比喻曹丕","兩個都比喻百姓"],"ans":"A","steps":["證據一：「本自同根生」，萁和豆同一個根，就像親兄弟","證據二：萁在下面燒，豆在鍋裡受苦；逼人作詩的是文帝","合起來：萁＝逼迫人的曹丕，豆＝受苦的曹植"],"tests":"推論：譬喻","avoid":"找出誰在「燒」、誰在「被煮」"},{"q":"「相煎何太急」的「煎」，在詩裡比喻什麼？","opts":["一起做菜","互相幫忙","比賽誰比較快","互相逼迫、傷害"],"ans":"D","steps":["字面：萁燒火煎煮豆子","放回事件：哥哥用死刑逼弟弟七步作詩","所以「煎」比喻互相逼迫、傷害"],"tests":"字義：比喻義","avoid":"詩裡的字，要放回事件裡讀"},{"q":"文帝為什麼「深有慚色」？","opts":["曹植的詩寫得很差","他忘了要走七步","他聽懂詩裡說兄弟同根卻互相逼迫，覺得羞愧","豆子湯煮得不好吃"],"ans":"C","steps":["因：詩說「本自同根生，相煎何太急」","他就是那個逼迫弟弟的哥哥","果：聽懂了，所以覺得慚愧"],"tests":"因果：找原因","avoid":"人物的表情，要回前文找原因"}]},{"label":"第二篇","title":"列子學射","text":["列子學射，中矣，請於關尹子。尹子曰：「子知子之所以中者乎？」對曰：「弗知也。」關尹子曰：「未可。」退而習之三年，又以報關尹子。尹子曰：「子知子之所以中乎？」列子曰：「知之矣。」關尹子曰：「可矣，守而勿失也。」"],"cite":"《列子．說符》（節選）","notes":"列子：戰國時的思想家　關尹子：人名，列子請教的老師　子：你　弗：不　報：報告","trans":"列子學射箭，已經能射中目標了，就去向關尹子請教。關尹子說：「你知道你為什麼能射中嗎？」列子回答：「不知道。」關尹子說：「還不行。」列子回去又練習了三年，再去向關尹子報告。關尹子說：「你知道你為什麼能射中了嗎？」列子說：「知道了。」關尹子說：「可以了，要守住它，不要失去。」","qs":[{"q":"「列子學射，中矣」的「中」是什麼意思？","opts":["射中","中間","中國","中午"],"ans":"A","steps":["組詞「命中」，代回：列子學射箭，已經能射中了 → 通","驗證：後面問「子之所以中者」，問的就是為什麼射得中","所以「中」＝射中"],"tests":"字義：中","avoid":"組詞代回，再用後文驗證"},{"q":"「退而習之三年」，回去練習三年的是誰？","opts":["關尹子","列子","關尹子的學生","列子的父親"],"ans":"B","steps":["前一句：關尹子說「未可」","被說還不行的是列子，所以「退」的是列子","後面「又以報關尹子」，向老師報告的也是列子"],"tests":"補主詞","avoid":"被說的人，常是接著行動的人"},{"q":"「子知子之所以中者乎？」的「所以」是什麼意思？","opts":["因此","所有","可以","……的原因"],"ans":"D","steps":["代回今天的「因此」：你知道你因此射中嗎 → 讀不通","驗證：列子回答「弗知也」，問的是他知不知道射中的原因","所以「所以」＝……的原因（古今異義）"],"tests":"古今異義：所以","avoid":"「所以」放在動作前，常是原因"},{"q":"第一次關尹子說「未可」，原因是什麼？","opts":["列子根本射不中","列子雖然射中了，卻不知道自己為什麼射中","列子練習得太久","關尹子不喜歡列子"],"ans":"B","steps":["證據一：「中矣」，列子已經射得中","證據二：被問原因時，他答「弗知也」","合起來：關尹子認為只會做、不懂原因，還不行"],"tests":"推論：兩證據合推","avoid":"把「做得到」和「懂不懂」分開看"},{"q":"這個故事告訴我們什麼道理？","opts":["射箭一定要練三年","老師說的話不用聽","不只要做得到，還要明白為什麼做得到，並且守住它","只要射中就夠了"],"ans":"C","steps":["第一次：射得中但不知原因 → 未可","第二次：知道原因 → 可矣，還要「守而勿失」","道理：懂得原因才算真的學會，還要持續保持"],"tests":"寓言道理","avoid":"比一比前後兩次的差別"}]}]},"cap":{"no":"會考實戰","title":"第 8 週會考實戰","skill":"會考解題技法：期末總整理（主旨全集交集＋表格逐字核對＋補回省略主詞）","steps":["❶ 先看題目最後一句：問主旨、細節還是誰做的？問「正確」還是「不恰當、無法得知」？","❷ 主旨題：答案要蓋住全文（全集），每句話都要有證據（交集），不能說太多也不能太少","❸ 實用文本、表格：把選項拆成一小格一小格，回原文逐字核對","❹ 文言沒寫「誰」：往前找最近的人，再看這個動作誰做得到，把主詞補回去","❺ 每個選項都找證據，找不到證據的就刪掉"],"demo":{"q":"示範題：【114 年會考第 22 題】「安邑里巷口有賣餅者，吾每早過戶，未嘗不聞其歌。一日，召之與語，貧窘可憐。因與萬錢，令多其本，日取餅以償之。欣然持錢而去。後過其戶，則寂然不聞謳歌之聲。及呼乃至，謂曰：『爾何輟歌之遽乎？』曰：『本流既大，所謀益增，不暇唱曲矣。』」關於文中的「吾」與賣餅者，下列敘述何者最恰當？（甲）「吾」喜歡吃賣餅者的餅，日日光顧（乙）賣餅者生意資本擴增後，工作更繁忙（丙）「吾」喜歡賣餅者的歌聲，勸他以此招攬生意（丁）賣餅者經濟狀況改善之後，就不想再繼續賣餅","a":["→ 補主詞：「召之與語」「因與萬錢」是「吾」做的；「欣然持錢而去」「本流既大…」是賣餅者","→ 逐字核對：「本流既大，所謀益增，不暇唱曲矣」＝本錢變大、要忙的事變多，沒空唱歌","→ 刪去：「日取餅」是拿餅抵債，不是愛吃；沒勸他用歌聲招客；他也沒說不賣餅了","答：賣餅者生意資本擴增後，工作更繁忙"]},"teach":{"intro":"期末總複習：會考最常考的三件事，一次練齊——主旨抓全集與交集、表格逐字核對、文言補回主詞。","items":[{"t":"什麼是「全集與交集」？","d":["全集：正確的主旨要包住全文所有段落、所有例子，只講其中一段就是「太少」。","交集：選項裡的每一句話都要在文章裡找得到證據，文章沒說的就是「太多」。"],"ex":"像介紹柴犬：「柴犬是一種狗」太少，「柴犬是世界上最會打籃球的狗」太多，「柴犬是日本來的中型犬，個性獨立」才剛好。"},{"t":"什麼是「逐字核對」？","d":["實用文本、表格題，選項通常是把原文換句話說，或把兩欄對調。","把選項拆成一小塊一小塊（誰、什麼、多少、哪一欄），每一塊都回原文找到同一句才算對。"],"ex":"像對比賽記分表：誰得幾分、哪一節，一格一格對，記錯一格整場就算錯。"},{"t":"什麼是「省略主詞」？","d":["文言文常常不寫「誰」做這個動作，因為前面已經講過了。","補回方法：往前找最近出現的人，再看這個動作他做不做得到；一句裡有兩個動作時，主詞可能換人。"],"ex":"像籃球轉播：「抄球、快攻、上籃！」沒說是誰，但你看前一個鏡頭就知道是哪個球員。"},{"t":"什麼是「反向題」？","d":["題目問「不恰當」「最不可能」「無法得知」，要找的是錯的或沒證據的那一個。","先把這三個字圈起來，再每個選項找證據，有證據的刪掉，剩下的就是答案。"],"ex":"像點名：四個人裡三個有到，答案是那個沒到的人。"}],"demo":["①先看題目最後一句：問「吾」和賣餅者，是細節題","②補主詞：給錢的是「吾」，拿錢走、說沒空唱歌的是賣餅者","③逐字核對：本錢變大、事情變多、沒空唱歌，對上「工作更繁忙」，其他三個找不到證據就刪掉"]},"parts":[{"label":"第一篇","title":"114 年會考 第 9 題","text":[],"table":[["顧客的需求","店員的建議"],["不想喝含有茶葉的茶","可選菊花茶"],["想在沖泡時看到花瓣","可買蓮花茶"],["想送等級最高的花茶給客戶","可送玫瑰烏龍茶"],["想自製茉莉香片","可備乾燥茶葉和新鮮茉莉花"]],"cite":"114 年國中教育會考國文科 第 9 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"中式花茶依加工方式，可分為三種：第一種是成品內沒有花但香氣濃郁的茶，如茉莉花茶；第二種是成品內有花的茶，如玫瑰烏龍茶；第三種是純花茶，成品內沒有茶葉，如菊花茶、蓮花茶等。其中第一種等級最高，又稱「香片」。香片是將乾燥後的茶葉與新鮮的香花依比例混合，靜置陰涼處，等茶葉吸收花的香氣後將花篩除，再烘乾製成。\n根據本文，下列花茶店店員針對顧客需求所給的建議，何者⟦不恰當⟧？","opts":["不想喝含有茶葉的茶／可選菊花茶","想在沖泡時看到花瓣／可買蓮花茶","想送等級最高的花茶給客戶／可送玫瑰烏龍茶","想自製茉莉香片／可備乾燥茶葉和新鮮茉莉花"],"ans":"C","steps":["用「逐字核對」：題目問「不恰當」，把表格一列一列拿回原文比對。","原文說「其中第一種等級最高」，第一種的例子是茉莉花茶；玫瑰烏龍茶是第二種，不是等級最高的。","其他三列都對得上：菊花茶、蓮花茶沒有茶葉，成品裡就是花；香片要用乾燥茶葉加新鮮香花。所以答送玫瑰烏龍茶那一列。"],"tests":"表格與原文核對","avoid":"等級、類別要對回原句再選"}]},{"label":"第二篇","title":"107 年會考 第 40～41 題（題組）","text":["市場上真正重要、甚至可以救命的藥品其實正日漸稀少。一旦被藥廠認定不會帶來利潤的藥，馬上就會停止生產。有時候，藥廠決定停止生產重要藥品的原因，是想騰出生產線來製造其他更有利潤的藥物。","美國 食品藥物管理局規定：藥廠決定停產具有「醫療必要」的專賣藥品時，需要在六個月前提出。但這項規定卻形同具文，無人遵守。2001年就有很多重要藥品出現嚴重短缺，包括一些麻醉藥、治療蛇毒的抗蛇毒血清、早產兒用的類固醇、血友病的抗凝血藥、心臟衰竭用的注射藥，以及成人流感與肺炎疫苗。","短缺情況最嚴重的是小兒疫苗。在2000年時，白喉、破傷風、百日咳三合一的疫苗數量不足，美國 疾病管制局只好建議：嬰兒只需要接種標準五劑中的前三劑就好，並取消追加注射。疾管局還建議延期注射麻疹、腮腺炎和德國麻疹疫苗，以及天花疫苗的二次接種。2002年底，疫苗供應情況稍稍回穩，疾管局才又建議回歸原始的接種程序。這個問題一直無法徹底解決，原因是製造疫苗的藥廠越來越少，比起二十年前約十六家的榮景，現在只有區區四家在生產。","――改寫自瑪西亞．安卓《藥廠黑幕》"],"cite":"107 年國中教育會考國文科 第 40～41 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，藥廠生產藥物的原則為下列何者？","opts":["以民眾的需求為考量","以疾病的輕重為依據","以政府的規定為準則","以利潤的追求為優先"],"ans":"D","steps":["主旨題找全文重複出現的重點：「一旦被藥廠認定不會帶來利潤的藥，馬上就會停止生產」。","第二個證據：停產是為了「騰出生產線來製造其他更有利潤的藥物」；而政府規定「形同具文，無人遵守」，所以不是照規定。","兩處都指向「利潤」，答以利潤的追求為優先。"],"tests":"抓全文共同原則","avoid":"找重複出現的關鍵詞再選"},{"q":"根據本文，⟦無法⟧推知下列何者？","opts":["治療蛇毒的抗蛇毒血清利潤不夠高","利潤愈來愈低，所以藥廠越來越少","天花疫苗原本的標準接種次數不只一次","美國 疾管局建議延期注射是因為疫苗供應不足"],"ans":"B","steps":["反向題「無法推知」：四個選項各自回原文找證據，找不到的才是答案。","抗蛇毒血清短缺，而停產是因利潤不高，可推；天花疫苗有「二次接種」，可推；延期注射是因數量不足，可推。","原文只說藥廠從約十六家變成四家，沒說原因是「利潤愈來愈低」，這是選項自己多加的因果，所以選它。"],"tests":"無法推知題","avoid":"小心選項自己多加的「所以」"}]},{"label":"第三篇","title":"107 年會考 第 34～35 題（題組）","text":["最近仰光進入雨季，我看著路上行人的拖鞋，想到多年前初到緬甸工作時發生的事。","緬甸的正式服裝，無論男女，一定是長到腳踝的沙龍配上紅色呢絨面的牛皮拖鞋。既然穿拖鞋的時間這麼多，舒適度就很重要。但奇怪的是，緬甸人在我眼中好「沒常識」，總喜歡買小一號的拖鞋，感覺腳跟都露在外面，看了就覺得不舒服。","直到一個當地朋友解釋給我聽：「緬甸雨季長，要是拖鞋比腳長，每走一步就會將雨水濺起來，弄溼沙龍的下擺。」","原來「鞋子要比腳大一點點比較好」這種想法，完全不適用生活在一年有半年是雨季地方的人。如果用我們已知的想法看待緬甸人，自然覺得他們莫名其妙，又不是說小一點的鞋子用料就可以少一點、價格便宜一點，何必那麼委屈呢？","實際上，我問了其他東南亞國家的朋友，尤其是印尼人，也覺得鞋子長度不能超過腳丫子，是理所當然的「常識」。","從那一刻起，我學會了＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。","我在工作跟生活當中，每次聽到某些人鼻孔哼氣，說「這用腳底想也知道」，或是「那根本就是常識啊」，總是會為對方冒一陣冷汗，一個不知道自己認知的常識並非放諸四海皆準的人，恐怕才是最欠缺常識、被人當作笑話談論的那個。","去過世界越多地方，我越覺得自己常識不足。夏天在公眾運輸工具上，若有人坐在一個位置上很久剛起身，我們一定嫌熱不會想去坐。我去埃及唸書，卻發現即使旁邊還有空位，大家都會去搶別人剛剛坐過的座位，原來剛坐過的位置最涼爽，因為人的體溫只有攝氏37度，但外面的氣溫高達45度。這種埃及人一定都知道的「常識」，任何一個來自夏天不會超過37度國家的人，都絕對不會有。","我的眼睛朝著自己的腳望去，只看得到腳背，完全看不到腳下的拖鞋，「嗯，這雙大小剛剛好啊！」我在心裡跟自己說，起身走進雨中的仰光，滿心愉悅！","――改寫自褚士瑩〈大小剛好的鞋子〉"],"cite":"107 年國中教育會考國文科 第 34～35 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，下列敘述何者正確？","opts":["作者在仰光也會穿小一號的拖鞋","印尼人習慣穿比腳大一號的拖鞋","雨季時緬甸人喜歡穿小一號的沙龍","埃及人的正常體溫較其他國家的人高"],"ans":"A","steps":["用「逐字核對」：每個選項的人、物、原因都回原文對。","印尼人覺得鞋子「不能超過腳丫子」，不是大一號；緬甸人穿小一號的是拖鞋，不是沙龍；埃及是氣溫高達45度，不是體溫比較高。","最後一段作者往下看「完全看不到腳下的拖鞋」，還說「大小剛剛好」，表示他在仰光也穿小一號拖鞋，答第一個。"],"tests":"細節逐字核對","avoid":"人、物、原因要一一對準"},{"q":"畫線處為⟦本文主旨所在⟧，根據前後文意脈絡，填入下列何者最恰當？","opts":["不懂的事就應該問人，以免成為別人的笑柄","注重事物的本質，鞋子的實用與否比美觀更加重要","每個人的欣賞觀點不盡相同，那是和各人的性格有關","不要用自己的常識來判斷別人，並且尊重在地的生活智慧"],"ans":"D","steps":["主旨題用「全集」：全文的例子有緬甸拖鞋、印尼人、埃及座位，共同點是「別人的常識跟我不同，而且有道理」。","空格下一段說「不知道自己認知的常識並非放諸四海皆準的人」最欠缺常識，正好接「不要用自己的常識判斷別人」。","問人、實用比美觀、性格不同，都只碰到一小塊或文章沒說，範圍太小或離題，答最後一個。"],"tests":"主旨填空","avoid":"答案要蓋住全文所有例子"}]},{"label":"第四篇","title":"114 年會考 第 25～26 題（題組）","text":["高二的外孫跟我說了一顆蛤蜊的故事。","這蛤蜊竟然有名字，叫「明」。明是隻北極圓蛤，目前已知最長壽的多細胞動物，活了超過五百年，科學家推估其出生於明朝，於是命名「明」。孫子再三強調：「據說，北極海底，隱藏著比明更老的蛤蜊！」","我也講了另一種蛤蜊的故事給他聽。","在外孫這年紀時，我跟著母親上山下海做各種勞動討生活。那個年代，累得不得了時，抬頭一看，發現大家都辛苦，也就不會覺得自己特別苦。諸多體力活中，我最喜歡到海邊挖「公呆」。","牠們喜歡成群生活在淺灘，若有動物接近，會一起噴水警示。這樣做或許能嚇走水鳥，但正好讓人發現位置，勢眾又跑不快，是不是蛤蜊呆？所以被人叫做公「呆」。","公呆不只呆，還很懶，總是攤平在爛泥表面，只求有層薄土蓋得住殼就好，又動不動就噴水虛張聲勢，更容易被發現。撿拾公呆不須花太多力氣，唯一要注意的是，公呆殼很薄，文蛤閉殼後像石頭，碰撞也不太會破損，但公呆殼用兩根手指一捏就碎裂，所以耙開土的動作要小，輕輕翻開土後再慢慢撿就好。","「外婆，讓人這樣撿，很快會絕種！」講環保的一代不滿地抗議。","「你以為所有蛤蜊都像那隻明，能活五百年？公呆本就活不過一年，秋天一到，天氣一冷，沒被吃掉，牠們也成群成群死掉，全變成白殼骨。」","孫子說：「外婆，公呆不是因為懶惰而不潛得更深來保護自己，牠們實在是殼太薄，承受不了壓力，才會攤平在淺灘上！反正一輩子也沒多長，一起躺好晒晒太陽，還能趁活著時，享受一點溫暖和陪伴。要是像明一樣，活在冰冷的北極深海裡，公呆們應該是受不了的。」","果然在躺平年代裡，更容易理解躺平生物。","——改寫自毓秀〈公呆〉"],"cite":"114 年國中教育會考國文科 第 25～26 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"根據本文，下列關於公呆的敘述何者最恰當？","opts":["若移至深海生活，可以延長生命","噴水嚇阻敵人，反而暴露藏身處","閉殼後像石頭，碰撞也不易破損","群體死亡前，會一起躺平晒太陽"],"ans":"B","steps":["逐字核對：原文說公呆「會一起噴水警示」，「但正好讓人發現位置」。","閉殼像石頭的是「文蛤」，不是公呆；孫子說公呆受不了深海，沒說能延長生命；晒太陽是「趁活著時」，不是死亡前。","所以答噴水嚇阻敵人，反而暴露藏身處。"],"tests":"細節比對","avoid":"先確認主角是公呆還是文蛤"},{"q":"關於本文的寫作分析，下列何者最恰當？","opts":["以祖孫對話暗示不同世代價值觀的差異","以作者童年拾蛤經驗抒發對親人的懷念","藉北極圓蛤明彰顯生態永續發展的重要","藉公呆的形象比喻活到老學到老的態度"],"ans":"A","steps":["寫作分析也用「全集」：全文是外婆和孫子各講一種蛤蜊、你一句我一句地對話。","外婆說公呆又呆又懶，孫子卻說牠們是殼太薄、趁活著享受陪伴；結尾「在躺平年代裡，更容易理解躺平生物」，點出兩代想法不同。","懷念親人、生態永續、活到老學到老都只是小片段或沒提到，答祖孫對話暗示世代價值觀差異。"],"tests":"寫作手法與主旨","avoid":"看結尾句抓全文用意"}]},{"label":"第五篇","title":"114 年會考 第 36～37 題（題組）","text":["五代十國是指唐亡後至宋建國前，在各地分立興亡的諸國。當時北方有五個政權遞嬗的王朝，稱為「五代」。南方有十個並存的國家，稱為「十國」。以下短文是根據這樣的時代背景論述，請閱讀並回答36～37題：","南唐 後主 李煜跪在明德樓前，白衣素袍，向宋太祖 趙匡胤歸降時，內心肯定百感交集。他想過以後的歷史，怎麼寫他嗎？《舊五代史》直接把十國裡凡稱帝的都貶為「僭偽列傳」，南唐當然也逃不了。《新五代史》稍稍客氣，但也僅以「世家」定位。《舊五代史》南唐部分只寫到烈主 李昪、中主 李璟，並沒有後主 李煜。《新五代史》雖提及李後主，但入宋的部分不寫。","為何新、舊《五代史》如此定位？這就必須了解中國史家重視傳統王朝興替的「正統情結」。趙匡胤是借「陳橋兵變」、「黃袍加身」而當上皇帝，其政權正當性，乃繼承北方中原的政權更替。以此史觀來看，唐朝滅亡後在中原相繼更迭的北方政權：後梁、後唐、後晉、後漢、後周，便被視為正統，其他政權則被視為僭越。","然而紛亂的五代十國，主戰場就在北方中原。五代國祚最短的是後漢，三年多換了兩個君主。最長的是後梁，十七年四個皇帝。何況，五代王位之爭，經常是血腥暴力、骨肉相殘，朝廷難有建樹，更談不上人文建設、經濟民生。","「君王唯兵強馬壯者得之」，五代帝王幾乎沒幾位是有高度文化修養的。反倒是十國裡的南唐前後維持近四十年，只經歷三個皇帝，沒有繼承權的紛亂，政權相對穩定。且南唐三位國君都重視文教，珍藏圖書，蒐羅書畫，建立教坊，網羅畫師，一時之間南唐成了文化重鎮。宋朝雖然滅了南唐，可是汴京皇城裡的文化資產，有多少是來自南唐啊！","——改寫自蔡詩萍《李後主事件簿》"],"cite":"114 年國中教育會考國文科 第 36～37 題（國家教育研究院心測中心）","notes":"世家：紀傳體史書體例之一，諸侯王傳記的體例為「世家」，帝王則為「本紀」","trans":"","qs":[{"q":"關於文中新、舊《五代史》對南唐君主的記載，下列敘述何者最恰當？","opts":["《舊五代史》記錄李昪，是因為認同他的正統地位","新、舊《五代史》都不肯承認南唐君主的帝王身分","南唐君主在《舊五代史》的定位比在《新五代史》高","《新五代史》不承認北方政權，故未提及李後主入宋"],"ans":"B","steps":["逐字核對＋讀註解：《舊五代史》把稱帝的貶為「僭偽列傳」；《新五代史》只以「世家」定位。","註解說「世家」是諸侯王的體例，帝王才是「本紀」，所以兩本書都沒把南唐君主當帝王。","舊史是「貶」，不是認同正統，也不會比新史高；新史承認的正是北方政權。答都不肯承認帝王身分。"],"tests":"原文與註解核對","avoid":"註解也是證據，一定要讀"},{"q":"根據本文，下列何者最接近作者的觀點？","opts":["應該重視王朝興替的「正統情結」","北方政權相對穩定，有利於人文建設","肯定李氏三代重視文教，對文化的貢獻","趙匡胤借「陳橋兵變」稱帝，是為僭越"],"ans":"C","steps":["觀點題找作者的語氣：「然而」「反倒是」後面、句尾的「啊！」才是作者真正想說的。","作者稱讚南唐三位國君「都重視文教」，讓南唐「成了文化重鎮」。","正統情結是史家的看法；作者說北方是骨肉相殘；也沒說陳橋兵變是僭越。答肯定李氏三代對文化的貢獻。"],"tests":"作者觀點","avoid":"分清作者說的和別人說的"}]},{"label":"第六篇","title":"114 年會考 第 23 題","text":[],"table":[["","遠卒守塞","募民屯戍"],["駐地的久暫","久居","一歲而更"],["獲得的福利","室屋、田器","冬夏衣、廩食"],["對地勢的了解","熟習","不熟習"],["對胡人的心態","畏懼","不畏懼"]],"cite":"114 年國中教育會考國文科 第 23 題（國家教育研究院心測中心）","notes":"","trans":"","qs":[{"q":"「令遠方之卒守塞，一歲而更，不知胡人之能。不如選常居者家室田作，且以備之，以便為之高城深塹。先為室屋、具田器，乃募民免罪、拜爵，予冬夏衣、廩食，能自給而止。塞下之民，祿利不厚，不可使久居危難之地。胡人入驅而能止其所驅者，以其半予之。如是則邑里相救助，赴胡不避死，全親戚而利其財也。此與遠方之戍卒，不習地勢而心畏胡者，功相萬也。」關於文中「遠卒守塞」、「募民屯戍」的比較，下列何者最恰當？","opts":["駐地的久暫","獲得的福利","對地勢的了解","對胡人的心態"],"ans":"D","steps":["表格逐字核對：每一格都回原文找，先確認是「遠卒」那一欄還是「募民」那一欄。","原文說遠方戍卒「心畏胡」＝畏懼；募來的民「赴胡不避死」＝不畏懼，兩格都對上。","再看前三列：「一歲而更」說的是遠卒，募民才是久居；「室屋、田器」和「冬夏衣、廩食」都是給募民的，遠卒一樣也沒有；「不習地勢」說的是遠卒，募民才熟習。前三列都對不上，答對胡人的心態那一列。"],"tests":"表格比較文言","avoid":"每格確認屬左欄還是右欄"}]},{"label":"第七篇","title":"107 年會考 第 44～46 題（題組）","text":["朱梁時，青州有賈客泛海遇風，飄至一處，遠望有山川城郭。海師曰：「往昔遭風，未嘗至此。吾聞鬼國在是，莫非此耶？」頃之，舟至岸，因登岸，⟦向城而去⟧。其廬舍田畝，不殊中國。⟦見人皆揖之⟧，而人皆不見己。至城，有守門者，揖之，⟦亦不應⟧。入城，屋室人物甚殷，遂至王宮。正值大宴，群臣侍宴者數十，其器用絲竹陳設之類，多類中國。客因升殿，俯逼王座以窺之。俄而王有疾，左右扶還，亟召巫者視之。巫至，曰：「有陽地人至此，陽氣逼人，故王病。其人偶來爾，無心為祟，以飲食車馬謝遣之，可矣。」即具酒食，設座於別室，巫及其群臣皆來祀祝，客據案而食。俄有僕夫馭馬而至，客亦乘馬而歸，至岸登舟，國人竟不見己，⟦復遇便風得歸⟧。時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。","――改寫自《太平廣記．青州客》"],"cite":"107 年國中教育會考國文科 第 44～46 題（國家教育研究院心測中心）","notes":"","trans":"後梁的時候，青州有個商人出海遇到大風，被吹到一個地方，遠遠望見有山川和城牆。船夫說：「以前遇到大風，從來沒到過這裡。我聽說鬼國就在這一帶，莫非就是這裡嗎？」不久，船到了岸邊，商人就上岸，往城裡走去。那裡的房屋田地，和中國沒有不同。他看見人都向對方作揖，可是那些人都看不見他。到了城門，有守門的人，他向守門人作揖，守門人也沒回應。進了城，房屋和人口非常多，就一路走到王宮。正好遇上大宴會，陪國王宴飲的大臣有幾十位，他們用的器具、樂器、擺設，大多和中國相似。商人就走上大殿，靠近國王的座位偷看。不久國王生病了，左右侍從扶他回去，急忙找巫師來看。巫師來了說：「有陽間的人到這裡，陽氣逼人，所以大王生病。這個人是偶然來的，不是故意作怪，用飲食和車馬答謝、送他走就可以了。」於是準備酒菜，在另一間房設座位，巫師和群臣都來祭拜禱告，商人就靠著桌子吃起來。不久有僕人駕著馬來，商人也騎馬回去，到岸邊上船，那國的人始終看不見他，又遇到順風得以回家。當時賀德儉擔任青州節度使，和魏博節度使楊師厚是親戚，因此派這個商人出使魏地，商人把這件事告訴楊師厚。魏人范宣古親耳聽到這件事，再告訴了我。","qs":[{"q":"故事中⟦雙底線⟧處所省略的主詞，何者⟦不是⟧ 青州客？","opts":["向城而去","見人皆揖之","亦不應","復遇便風得歸"],"ans":"C","steps":["補主詞：往前找最近的人。原文是「至城，有守門者，揖之，亦不應」。","「揖之」是青州客向守門者作揖；「亦不應」是被作揖的守門者沒有回應，主詞換人了。","向城而去、見人皆揖之、復遇便風得歸，都是青州客在行動，答亦不應。"],"tests":"補回省略主詞","avoid":"一句兩個動作要分開補主詞"},{"q":"根據故事內容，下列敘述何者正確？","opts":["青州客登岸所見的房舍田畝，皆與中國不同","國王生病的原因是青州客接近王座窺探","巫師建議大肆祝祀並齋戒沐浴以接待青州客","青州客遠離時，王國中的人皆避而不見"],"ans":"B","steps":["逐字核對：「客因升殿，俯逼王座以窺之。俄而王有疾」，巫師說「陽氣逼人，故王病」。","「不殊中國」是沒有不同；巫師只說「以飲食車馬謝遣之」，沒有齋戒沐浴；國人是「不見己」＝看不到他，不是故意避開。","答國王生病是因為青州客接近王座窺探。"],"tests":"文言細節核對","avoid":"「不殊」是沒有不同，別看反"},{"q":"文末「時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。」這段文字的作用最可能是下列何者？","opts":["顯示作者的交遊廣闊","點出故事發生的地點","表明作者的身分、來歷","強調故事內容言而有據"],"ans":"D","steps":["看這段在全文的位置：故事講完了，最後交代「誰告訴誰」。","青州客告訴楊師厚，范宣古「親聞其事」，再告訴作者，一路都有人證。","目的是讓這個鬼國故事聽起來有根據，答言而有據。"],"tests":"段落作用","avoid":"結尾交代消息來源＝增加可信度"}]},{"label":"第八篇","title":"107 年會考 第 47～48 題（題組）","text":["有疑陶淵明詩篇篇有酒，吾觀其意不在酒，亦寄酒為跡者也。其文章不群，辭采精拔，跌宕昭彰，獨超眾類，抑揚爽朗，莫之與京。橫素波而傍流，干青雲而直上。語時事則指而可想，論懷抱則曠而且真。加以貞志不休，安道苦節，不以躬耕為恥，不以無財為病。自非大賢篤志，孰能如此乎？余愛嗜其文，不能釋手，尚想其德，恨不同時。","――改寫自蕭統〈陶淵明集序〉"],"cite":"107 年國中教育會考國文科 第 47～48 題（國家教育研究院心測中心）","notes":"莫之與「京」：齊等","trans":"有人懷疑陶淵明的詩每一篇都有酒，我看他的心思並不在酒，只是借酒來寄託心意罷了。他的文章與眾不同，文辭精采突出，起伏變化、鮮明耀眼，遠遠超過一般人，聲調高低、清朗通達，沒有人能和他相比。像白色的水波橫向奔流，又像直衝青雲而上。談到時事，指出的事讓人可以想見；說到心中抱負，曠達而且真誠。再加上他堅守志向從不停止，安於正道、堅守節操，不把親自耕田當作羞恥，不把沒有錢財當作憂慮。如果不是大賢人、意志堅定的人，誰能做到這樣呢？我非常喜愛他的文章，捨不得放下，常常想念他的品德，遺憾沒有和他生在同一個時代。","qs":[{"q":"根據本文，下列句意說明何者正確？","opts":["亦寄酒為跡者也――有酒之處必有陶淵明蹤跡","抑揚爽朗，莫之與京――文章起伏跌宕、清朗通達，無人能及","干青雲而直上――志向遠大，在仕途上也曾飛黃騰達","尚想其德，恨不同時――感嘆自己德行高潔卻生不逢時"],"ans":"B","steps":["先用註解代回：「京」＝齊等，「莫之與京」＝沒有人能和他相等，就是「無人能及」。","「寄酒為跡」是借酒寄託，不是哪裡有酒就有他；「干青雲」在形容文章氣勢，沒說做大官；「恨不同時」的主詞是作者，遺憾和陶淵明不同時代。","答抑揚爽朗、莫之與京那一句的說明。"],"tests":"文言句意","avoid":"先代註解，再補主詞檢查"},{"q":"根據本文，⟦無法⟧得知下列何者？","opts":["陶淵明詩多以酒為寫作題材","陶淵明詩文在當時獨樹一格","作者對陶淵明極為欣賞崇敬","後世文壇深受陶淵明的影響"],"ans":"D","steps":["反向題「無法得知」：每個選項回原文找證據。","「篇篇有酒」證明多寫酒；「獨超眾類」證明獨樹一格；「余愛嗜其文」「尚想其德」證明崇敬。","全文都沒提到「後世文壇」，找不到證據，答它。"],"tests":"無法得知題","avoid":"核對選項的時間和範圍"}]},{"label":"第九篇","title":"114 年會考 第 40～42 題（題組）","text":["日前令郎訪逮，出手筆並石月屏為贈，捧玩不勝愧喜。比來，數於都下朋從處見此屏，觀其天質圓瑩，非刻非繪，如秋高氣清，迥然在望，信乎天地之異氣、山澤之殊寶也。素心悅之，無從可得，豈意一旦不煩懇請，坐致握中。性本疏野，雅叶所欲，雖受文錦十純，白璧百雙，在光之愚，未為重賜。俗故忽忽，久不遑修謝，尤增悚懼。令郎注官甚便，想加慰喜，未期接侍，倍希珍厚。","——改寫自司馬光〈答薛虢州謝石月屏書〉"],"cite":"114 年國中教育會考國文科 第 40～42 題（國家教育研究院心測中心）","notes":"叶：音ㄒㄧㄝˊ，符合　純：計量單位，布帛一段為一純　注官：按照當時的官制授職","trans":"前幾天令郎來訪，拿出您的親筆信和石月屏送給我，我捧著賞玩，又慚愧又高興。近來，我好幾次在京城朋友那裡看到這種屏風，看它天生的質地圓潤晶瑩，不是雕刻也不是畫上去的，好像秋天天高氣爽，遠遠就能望見，真的是天地間奇特的靈氣、山川湖澤裡特殊的寶物。我一向心裡喜歡它，卻沒有辦法得到，哪裡想到有一天不必懇求，坐著就拿到手中。我生性粗疏隨意，這正好符合我的喜好，就算收到十段彩錦、一百對白玉，在我這個愚笨的人看來，也不算貴重的禮物。因為俗事匆忙，很久沒空寫信道謝，更加惶恐不安。令郎得到的官職很合適，想必您更加欣慰高興。不知道什麼時候能見面，請您多多保重。","qs":[{"q":"根據文意脈絡，下列「」中的詞語，何者替換後意義仍相同？","opts":["日前「令郎」訪逮：令尊","「比來」，數於都下朋從處見此屏：近來","豈意「一旦」不煩懇請：剎那","「俗故」忽忽：老友"],"ans":"B","steps":["先組詞代回：「比來」換成「近來」，讀成「近來，好幾次在京城朋友那裡看到這屏風」，通順。","令郎是對方的兒子，令尊是對方的父親；「一旦」是「有一天」，不是一眨眼；「俗故忽忽」後面接「久不遑修謝」，是俗事忙到沒空，不是老友。","答比來換成近來。"],"tests":"文言詞語替換","avoid":"換完整句讀一遍再選"},{"q":"關於文中的石月屏，下列敘述何者最恰當？","opts":["若不是薛虢州贈送石月屏，司馬光無從見其真貌","石月屏雖比文錦、白璧昂貴，但司馬光更重友情","司馬光初獲石月屏時雖心喜，當下仍堅守節操婉拒","石月屏自然生成，清氣可見，因此司馬光甚為喜愛"],"ans":"D","steps":["逐字核對：「天質圓瑩，非刻非繪，如秋高氣清」＝天生的、不是刻畫，看得到清朗之氣，接著說「素心悅之」。","他早在朋友那裡「數…見此屏」，不是沒見過；文中只說文錦、白璧在他看來也比不上，沒比價錢也沒說重友情；他收下了，沒有婉拒。","答自然生成、清氣可見，所以很喜愛。"],"tests":"文言細節核對","avoid":"選項多出的話要找得到證據"},{"q":"根據本文，下列何者最可能是司馬光收下石月屏後的反應？","opts":["欲登門回禮，惜薛公務繁忙，擬另擇日造訪","獲贈禮物，喜出望外，故寫信向薛表達謝意","受薛贈寶深感有愧，已經備好厚禮回贈致謝","為辨優劣，邀請好友來家中共同鑑賞石月屏"],"ans":"B","steps":["補主詞＋看題目：這整篇就是司馬光寫給薛虢州的回信，篇名是「答…謝石月屏書」。","「捧玩不勝愧喜」「豈意…坐致握中」是喜出望外；「久不遑修謝」說拖了很久才寫這封謝函。","全文沒說要登門、已備厚禮或邀友鑑賞，答喜出望外寫信道謝。"],"tests":"推論人物反應","avoid":"先看篇名就知道文章在做什麼"}]}]}}];

const SHIBA = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"> <circle cx="60" cy="60" r="56" fill="#fff7ee" stroke="#d6452f" stroke-width="5"/> <circle cx="60" cy="60" r="49" fill="none" stroke="#d6452f" stroke-width="1.5" stroke-dasharray="3 3"/> <path d="M30 46 L33 18 L52 34 Z" fill="#e8913a"/> <path d="M90 46 L87 18 L68 34 Z" fill="#e8913a"/> <path d="M35 40 L36 26 L46 34 Z" fill="#fbd9b4"/> <path d="M85 40 L84 26 L74 34 Z" fill="#fbd9b4"/> <ellipse cx="60" cy="60" rx="33" ry="29" fill="#e8913a"/> <path d="M60 52 C46 52 33 60 33 70 C33 82 46 88 60 88 C74 88 87 82 87 70 C87 60 74 52 60 52 Z" fill="#fffaf3"/> <ellipse cx="44" cy="47" rx="5" ry="3" fill="#fffaf3"/> <ellipse cx="76" cy="47" rx="5" ry="3" fill="#fffaf3"/> <ellipse cx="46" cy="58" rx="4" ry="4.6" fill="#3a2418"/> <ellipse cx="74" cy="58" rx="4" ry="4.6" fill="#3a2418"/> <circle cx="47.4" cy="56.4" r="1.4" fill="#fff"/> <circle cx="75.4" cy="56.4" r="1.4" fill="#fff"/> <ellipse cx="60" cy="66" rx="5" ry="3.6" fill="#3a2418"/> <path d="M60 69.5 V73 M60 73 C57 77 52 76 51 73 M60 73 C63 77 68 76 69 73" fill="none" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/> <path d="M56 76 C57 81 63 81 64 76 Z" fill="#f07b83"/> <ellipse cx="38" cy="69" rx="5" ry="3" fill="#f6a1a0" opacity=".7"/> <ellipse cx="82" cy="69" rx="5" ry="3" fill="#f6a1a0" opacity=".7"/> <text x="60" y="106" text-anchor="middle" font-family="Noto Serif TC, serif" font-weight="700" font-size="13" fill="#d6452f">全對</text> </svg>`;
function shiba(cls){ return `<span class="shiba ${cls||""}">${SHIBA}</span>`; }
let MUTE = false; try { MUTE = localStorage.getItem("gwdt_mute") === "1"; } catch (e) {}
function tone(f, t, d, type, vol, f2){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "triangle";
  o.frequency.setValueAtTime(f, AC.currentTime + t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + t + d);
  g.gain.setValueAtTime(vol || .16, AC.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t + d);
  o.connect(g).connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + d + .05); }
document.addEventListener("pointerdown", (e) => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const add = (cls, style) => { const d = document.createElement("div"); d.className = "fx " + cls; d.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;` + (style || ""); document.body.append(d); setTimeout(() => d.remove(), 1000); };
  add("fx-ring");
  for (let k = 0; k < 5; k++) { const a = Math.PI * 2 * k / 5 + Math.random() * .6, r = 26 + Math.random() * 22;
    add("fx-petal", `--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r + 14}px;--r:${Math.random() * 360}deg;background:${k % 2 ? "#f4a7b0" : "#f9d0a0"}`); }
}, { passive: true });

// 籃球音效：空心進網、打鐵、終場蜂鳴器、觀眾歡呼
function noiseBuf(d){ const n = AC.sampleRate * d, b = AC.createBuffer(1, n, AC.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1; return b; }
function swish(t0, vol){ const s = AC.createBufferSource(); s.buffer = noiseBuf(.35); const bp = AC.createBiquadFilter(), g = AC.createGain(); bp.type = "bandpass"; bp.Q.value = 1.2;
  const t = AC.currentTime + t0; bp.frequency.setValueAtTime(6000, t); bp.frequency.exponentialRampToValueAtTime(1200, t + .28);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .5, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + .32);
  s.connect(bp).connect(g).connect(AC.destination); s.start(t); s.stop(t + .36); }
function clank(t0){ [523, 1380, 2210].forEach((f, i) => tone(f, t0, .22 - i * .05, "square", .05 - i * .012)); tone(140, t0 + .12, .12, "sine", .18, 70); }
function buzzer(t0){ const t = AC.currentTime + t0, o = AC.createOscillator(), o2 = AC.createOscillator(), lp = AC.createBiquadFilter(), g = AC.createGain();
  o.type = "sawtooth"; o2.type = "sawtooth"; o.frequency.value = 190; o2.frequency.value = 196; lp.type = "lowpass"; lp.frequency.value = 1400;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.16, t + .02); g.gain.setValueAtTime(.16, t + .85); g.gain.exponentialRampToValueAtTime(.001, t + 1);
  o.connect(lp); o2.connect(lp); lp.connect(g).connect(AC.destination); o.start(t); o2.start(t); o.stop(t + 1.05); o2.stop(t + 1.05); }
function cheer(t0){ const t = AC.currentTime + t0, s = AC.createBufferSource(); s.buffer = noiseBuf(2.6); const bp = AC.createBiquadFilter(), g = AC.createGain();
  bp.type = "bandpass"; bp.frequency.value = 1300; bp.Q.value = .6; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.32, t + .5); g.gain.exponentialRampToValueAtTime(.001, t + 2.5);
  s.connect(bp).connect(g).connect(AC.destination); s.start(t); s.stop(t + 2.6);
  [0, .35, .9].forEach((d) => { tone(2400, t0 + .3 + d, .18, "sine", .05, 2900); }); }
function bell(t0){ // 上課鐘聲（西敏寺鐘聲前兩句）
  const N = { E4:329.6, Fs4:370, Gs4:415.3, B3:246.9 };
  [["Gs4",0],["Fs4",1],["E4",2],["B3",3],["E4",4.6],["Gs4",5.6],["Fs4",6.6],["E4",7.6]].forEach(([n, k]) => {
    const t = AC.currentTime + t0 + k * .55, f = N[n];
    [[1, .12], [2.76, .04], [5.4, .015], [.5, .05]].forEach(([h, v]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f * h;
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 2.3); }); }); }
function sfx(kind, t0){ if (MUTE) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
  t0 = t0 || 0; if (kind === "swish") swish(t0); else if (kind === "clank") clank(t0); else if (kind === "buzzer") buzzer(t0); else if (kind === "cheer") cheer(t0); else if (kind === "bell") bell(t0);
  else if (kind === "combo") [784, 988, 1175, 1568].forEach((f, i) => tone(f, t0 + i * .05, .12, "square", .04)); } catch (e) {} }
// 交卷後的投籃重播：一題一題揭曉，連對累積連擊
function replay(title, results, done){
  const total = results.length, ov = $(`<div class="replay" role="dialog" aria-label="成績揭曉"><div class="rp-title">${esc(title)}</div><div class="rp-combo" aria-live="polite"></div>
    <div class="rp-dots">${results.map(() => "<i></i>").join("")}</div><div class="rp-score">命中 0／${total}</div><div class="rp-skip">點一下跳過</div></div>`);
  document.body.append(ov);
  const dots = ov.querySelectorAll(".rp-dots i"), cb = ov.querySelector(".rp-combo"), sc = ov.querySelector(".rp-score");
  const words = { 3:"3 連對！", 5:"5 連對！手感發燙", 8:"8 連對！停不下來", 10:"10 連對！無人能擋", 15:"15 連對！傳奇射手", 20:"20 連對！完美球季" };
  let i = 0, hit = 0, combo = 0, best = 0, timer = null, finished = false;
  const finish = () => { if (finished) return; finished = true; clearInterval(timer);
    results.forEach((r, k) => dots[k].className = r ? "in" : "out"); hit = results.filter(Boolean).length; sc.textContent = `命中 ${hit}／${total}　最長連對 ${Math.max(best, combo)}`;
    const perfect = hit === total; cb.textContent = perfect ? "全中！" : hit / total >= .75 ? "好球！" : "再練一次！";
    sfx("buzzer"); if (perfect) sfx("cheer", .5);
    setTimeout(() => { ov.remove(); done && done(perfect); }, perfect ? 2600 : 1500); };
  ov.onclick = () => { if (!finished) { finish(); } else { ov.remove(); } };
  timer = setInterval(() => {
    if (i >= total) return finish();
    const r = results[i]; dots[i].className = r ? "in" : "out";
    if (r) { hit++; combo++; best = Math.max(best, combo); sfx("swish");
      if (words[combo]) { cb.textContent = words[combo]; cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump"); sfx("combo", .12); } }
    else { combo = 0; cb.textContent = ""; sfx("clank"); }
    sc.textContent = `命中 ${hit}／${total}`; i++;
  }, 260);
}

function beep(kind){
  if (MUTE) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    if (kind === "tap") return tone(880, 0, .07, "sine", .08);
    if (kind === "bark") { tone(620, 0, .12, "sawtooth", .07, 380); tone(700, .16, .14, "sawtooth", .07, 400); return; }
    if (kind === "stamp") { tone(160, 0, .18, "sine", .3, 60); [523,659,784,1047].forEach((f, i) => tone(f, .2 + i*.11, .3)); tone(1319, .66, .5, "sine", .12); setTimeout(() => beep("bark"), 1150); return; }
    if (kind === "win") { [523,659,784,1047,784,1047].forEach((f, i) => tone(f, i*.12, .32)); tone(1568, .75, .6, "sine", .12); setTimeout(() => beep("bark"), 1350); return; }
    if (kind === "ok") { [660,880,990].forEach((f, i) => tone(f, i*.12, .28)); return; }
    [392,330,262].forEach((f, i) => tone(f, i*.16, .3, "sine", .13));
  } catch (e) {}
}

function quizMoney(q){ return !q ? 0 : q.retake ? 25 : reward(q.first); }
function weekMoney(w){
  const st = wk(w), done = DATA[w-1].groups.filter((g, i) => st.groups[i] && st.groups[i].done).length + (DATA[w-1].cap && st.cap && st.cap.done ? 1 : 0);

// 選擇題：items = [{q, key}]；state.ans[key] = 選的字母
function mcqEl(q, k, state, no){
  const el = $(`<div class="q"><div class="qt">${no}. ${esc(q.q)}</div><div class="opts"></div></div>`);
  const graded = state.graded, chosen = state.ans[k], locked = !!state.locked[k];
  q.opts.forEach((o, i) => {
    const b = $(`<button class="opt" aria-pressed="${chosen === L[i]}">(${L[i]}) ${esc(o)}</button>`);
    if (locked) { b.disabled = true; if (L[i] === q.ans) b.classList.add("right"); else if (chosen === L[i]) b.classList.add("wrong"); }
    b.onclick = () => { if (locked) return; beep("tap"); state.ans[k] = L[i]; save(); el.querySelectorAll(".opt").forEach((x, j) => x.setAttribute("aria-pressed", j === i)); };
    el.querySelector(".opts").append(b);
  });
  if (graded && state.locked[k] && state.ans[k] !== q.ans) {
    el.append($(`<div class="why"><b>正確答案 (${q.ans})</b><ol>${(q.steps||[]).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>${q.avoid ? `<div>下次：${esc(q.avoid)}</div>` : ""}</div>`));
  }
  return el;
}

let G = null; // 目前作答狀態
function renderGroup(app){
  const {week:w, gi} = view, B = DATA[w-1], isCap = gi === "cap", g = isCap ? B.cap : B.groups[gi], st = wk(w);
  const recOf = () => isCap ? (st.cap = st.cap || {}) : (st.groups[gi] = st.groups[gi] || {}), rec0 = isCap ? (st.cap || {}) : (st.groups[gi] || {});
  const TOTAL = g.parts.reduce((s, p) => s + p.qs.length, 0);

  app.append(back);
  app.append($(`<div><h2>${esc(g.no)}｜${esc(g.skill)}</h2><div class="muted small">${isCap ? `歷屆會考原題 ${TOTAL} 題（每題標出年份與題號）。` : "5 篇 20 題。"}全部按完再交卷；錯的會告訴你為什麼，改到全對就能蓋章。</div></div>`));
  app.append(teachEl(isCap ? g.teach : B.teach[gi], rec0.first == null));

  const items = [];
  let n = 1;
  g.parts.forEach((p, pi) => { const sec = $(`<div class="panel passage"></div>`); sec.append(passageEl(p, pi+1));
    p.qs.forEach((q, qi) => { const k = `${pi}-${qi}`; items.push([q,k]); sec.append(mcqEl(q, k, G, n++)); }); app.append(sec); });
  const done = items.filter(([q,k]) => G.locked[k]).length;
  if (G.graded) {
    const right = items.filter(([q,k]) => G.ans[k] === q.ans).length;
    const r = $(`<div class="result pop"><div>這一輪</div><div class="big">${right}／${TOTAL}</div><div>${right === TOTAL ? `全對！蓋一枚柴犬章${rewarded() ? `，獎金 +${PER_GROUP} 元（本週已累積 ${weekMoney(w)} 元）` : ""}。` : "看完解析，按「錯的再做一次」，改到全對。"}</div>${right === TOTAL ? `<div class="bigstamp">${SHIBA}</div>` : ""}</div>`);
    app.append(r);
    if (right === TOTAL && !isCap && B.daily[gi]) { const m = B.daily[gi]; app.append($(`<div class="memo"><b>今日背誦目標（明天早上抽背）</b>${m.words.map((x) => `<div>□ ${esc(x[0])}＝${esc(x[1])}（${esc(x[2])}）</div>`).join("")}<div>□ 名句：${esc(m.line)}</div></div>`)); }
  }

  if (!G.graded) {
    const sub = $(`<button class="btn">交卷</button>`);
    sub.onclick = () => {
      const left = items.filter(([q,k]) => !G.ans[k]).length;
      if (left && !sub.dataset.warn) { sub.dataset.warn = 1; sub.textContent = `還有 ${left} 題沒選，再按一次交卷`; return; }
      items.forEach(([q,k]) => { G.locked[k] = true; });

      const right = items.filter(([q,k]) => G.ans[k] === q.ans).length;

      replay(`${g.no}｜交卷`, items.map(([q,k]) => G.ans[k] === q.ans), (p) => { if (p) { beep("stamp"); if (rewarded()) toast(`+${PER_GROUP} 元！本週已累積 ${weekMoney(w)} 元`); } });

    else { const home = $(`<button class="btn alt">回任務板</button>`); home.onclick = () => { G = null; view = {name:"home", week:w}; render(); }; act.append(home); }

const norm = (s) => String(s||"").replace(/[\s，。？！、；：「」『』,.?!;:]/g, "");
let Q = null;
function quizSet(w){
  const B = DATA[w-1], pool = [...new Set(DATA.filter((d) => d.week <= Math.max(w, 4)).flatMap((d) => d.quiz.words.map((x) => x[1])))];
  return B.quiz.words.map((x, i) => {
    const others = pool.filter((m) => m !== x[1]);
    const pick = []; for (let j = 0; pick.length < 3; j++) { const m = others[(i*7 + j*5 + w*3) % others.length]; if (!pick.includes(m)) pick.push(m); }
    const pos = (i + w) % 4, opts = [...pick]; opts.splice(pos, 0, x[1]);
    return {q:`「${x[0]}」在「${x[2]}」裡是什麼意思？`, opts, ans:L[pos], steps:[`「${x[0]}」＝${x[1]}`, `例句：${x[2]}`], avoid:"把它加進明天早上的抽背"};
  });
}
function renderQuiz(app){
  const w = view.week, B = DATA[w-1], st = wk(w);
  if (!Q || Q.id !== w) Q = (st.drafts && st.drafts.quiz) ? snap(st.drafts.quiz) : {id:w, ans:{}, locked:{}, fill:{}, graded:false, started:false};
  const back = $(`<button class="back">← 回任務板</button>`); back.onclick = () => { Q = null; view = {name:"home", week:w}; render(); };
  app.append(back);
  app.append($(`<div><h2>第 ${w} 週週考${quizName(w) ? "（" + quizName(w) + "）" : ""}</h2><div class="muted small">字義每題 3 分、名句每題 4 分、技巧題每題 5 分，共 100 分。第一次交卷的分數就是本週成績。</div></div>`));
  if (!Q.started && !st.quiz) {
    const s = $(`<div class="panel"><h3>開考前</h3><p>誠實作答，才找得到真正的弱點。不要翻講義、不要問別人。<br>${rewarded() ? `本週目標：<b>${st.goal ? st.goal + " 元" : "還沒設定"}</b>` : ""}</p><div class="actions" style="position:static"><button class="btn">開始考試</button></div></div>`);
    s.querySelector("button").onclick = () => { Q.started = true; render(); };
    app.append(s); return;
  }
  const W1 = quizSet(w), items = [];
  const s1 = $(`<div class="panel"><h3>一、字義（每題 3 分）</h3></div>`);
  W1.forEach((q, i) => { const k = `w${i}`; items.push([q,k,3]); s1.append(mcqEl(q, k, Q, i+1)); }); app.append(s1);
  const s2 = $(`<div class="panel"><h3>二、名句接寫（每題 4 分）：打出後半句</h3></div>`);
  B.quiz.lines.forEach(([a,b], i) => { const k = `l${i}`;
    const row = $(`<div class="q"><div class="qt">${i+1}. ${esc(a)}＿＿＿＿</div><input class="fill" id="fill-${w}-${i}" autocomplete="off" value="${esc(Q.fill[k] || "")}"></div>`);
    const inp = row.querySelector("input");
    if (Q.locked[k]) { const ok = norm(Q.fill[k]) === norm(b); inp.classList.add(ok ? "right" : "wrong"); inp.disabled = true; if (!ok) row.append($(`<div class="why">正確：${esc(a + b)}</div>`)); }
    inp.oninput = () => { Q.fill[k] = inp.value; save(); };
    s2.append(row); });
  app.append(s2);
  let n = 1; const s3h = $(`<div><h3>三、新篇章技巧題（每題 5 分）</h3></div>`); app.append(s3h);
  B.quiz.parts.forEach((p, pi) => { const sec = $(`<div class="panel passage"></div>`); sec.append(passageEl(p, pi+1));
    p.qs.forEach((q, qi) => { const k = `p${pi}-${qi}`; items.push([q,k,5]); sec.append(mcqEl(q, k, Q, n++)); }); app.append(sec); });
  const score = () => items.reduce((s,[q,k,pt]) => s + (Q.ans[k] === q.ans ? pt : 0), 0) + B.quiz.lines.reduce((s,[a,b],i) => s + (norm(Q.fill[`l${i}`]) === norm(b) ? 4 : 0), 0);
  const act = $(`<div class="actions"></div>`);
  if (Q.graded) {
    const now = score(), q = st.quiz;
    const all = B.groups.every((g, i) => st.groups[i] && st.groups[i].done);
    const total = weekMoney(w);
    app.append($(`<div class="result pop"><div>${esc(S.current)}｜第 ${w} 週週考</div><div class="big">${q.first} 分</div>
      <div>這一輪：${now} 分${q.retake ? "（重考過 80 分）" : ""}</div>
      ${rewarded() ? `<div>柴犬章 ${B.groups.filter((g, i) => st.groups[i] && st.groups[i].done).length} 枚 × 25 元＋週考 ${quizMoney(q)} 元＝<b>本週 ${total} 元</b></div>
      <div>本週目標 ${st.goal ? st.goal + " 元" : "未設定"}：${st.goal ? (total >= st.goal ? "達成！" : "還差 " + (st.goal - total) + " 元") : ""}</div>` : `<div>本週柴犬章 ${B.groups.filter((g, i) => st.groups[i] && st.groups[i].done).length}／6</div>`}
      <div class="small muted">截圖這張卡給媽媽看。</div></div>`));
    if (now < 100) { const again = $(`<button class="btn alt">錯的再考一次</button>`);
      again.onclick = () => { items.forEach(([qq,k]) => { if (Q.ans[k] !== qq.ans) { delete Q.ans[k]; Q.locked[k] = false; } });
        B.quiz.lines.forEach(([a,b],i) => { const k = `l${i}`; if (norm(Q.fill[k]) !== norm(b)) { Q.fill[k] = ""; Q.locked[k] = false; } }); Q.graded = false; save(); render(); }; act.append(again); }
  } else {
    const sub = $(`<button class="btn">交卷</button>`);
    sub.onclick = () => {
      items.forEach(([q,k]) => { Q.locked[k] = true; }); B.quiz.lines.forEach((x,i) => { Q.locked[`l${i}`] = true; });
      Q.graded = true; const sc = score();
      if (!st.quiz) st.quiz = {first:sc, reward:reward(sc), retake:false};
      else if (st.quiz.first < 80 && sc >= 80 && !st.quiz.retake) { st.quiz.retake = true; st.quiz.reward = 25; }
      save(); render();
      replay(`第 ${w} 週週考｜${sc} 分`, items.map(([qq,k]) => Q.ans[k] === qq.ans).concat(B.quiz.lines.map(([a,b],i) => norm(Q.fill[`l${i}`]) === norm(b))), (p) => { if (p) beep("win"); });
    };
    act.append(sub);
    const keep = $(`<button class="btn alt">暫存</button>`);
    keep.onclick = () => { save(); keep.textContent = "已暫存，下次進來會接著做"; setTimeout(() => { keep.textContent = "暫存"; }, 2500); };
    act.append(keep);
  }
  app.append(act);
}

const KINDS = ["課本內頁","課本目錄","評量錯題","習作錯題","考卷","聯絡簿","其他"];
const UPL = { subj:"", kind:"" };
function shrink(file){ return new Promise((ok, bad) => { const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const M = 1800, k = Math.min(1, M / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .82)); };
  img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("讀不到這張照片")); }; img.src = url; }); }
function uploadPanel(k, r){

    <div class="row"><select class="fill" id="u-subj"><option value="">① 先選科目</option>${SUBJS.concat("其他").map((x) => `<option ${UPL.subj === x ? "selected" : ""}>${x}</option>`).join("")}</select><select class="fill" id="u-kind"><option value="">② 再選種類</option>${KINDS.map((x) => `<option ${UPL.kind === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <p class="small muted" style="margin:0">一次只傳同一科、同一種的照片；換科目要重新選再傳。</p>
    <div><label class="btn alt pick">選照片或拍照<input type="file" id="u-file" accept="image/*" multiple></label></div>
    <div class="uplog" aria-live="polite"></div></div>`);
  const log = el.querySelector(".uplog"), inp = el.querySelector("#u-file"), ss = el.querySelector("#u-subj"), sk = el.querySelector("#u-kind"), pick = el.querySelector(".pick");
  const ready = () => { const ok = !!(ss.value && sk.value); inp.disabled = !ok; pick.classList.toggle("off", !ok); pick.setAttribute("aria-disabled", !ok); };
  ss.onchange = () => { UPL.subj = ss.value; ready(); }; sk.onchange = () => { UPL.kind = sk.value; ready(); };
  pick.addEventListener("click", (e) => { if (inp.disabled) { e.preventDefault(); toast("先選科目和種類，再選照片"); } });
  ready();
  inp.onchange = async () => { const files = Array.from(inp.files || []); if (!files.length) return;
    const subj = ss.value, kind = sk.value; let okN = 0;
    if (!subj || !kind) { toast("先選科目和種類，再選照片"); inp.value = ""; return; }
    inp.disabled = true;
    for (let i = 0; i < files.length; i++) { const line = $(`<div>第 ${i + 1}／${files.length} 張：上傳中…</div>`); log.append(line);
      try { const image = await shrink(files[i]);
        const res = await api({ action:"upload", name:S.current, pw:CLOUD.pw[S.current], image, day:k, subj, kind });
        if (res.ok) { okN++; line.textContent = `第 ${i + 1}／${files.length} 張：✓ 已上傳（${subj}・${kind}）`; }
        else line.textContent = `第 ${i + 1}／${files.length} 張：沒傳成功（${res.error || "請再試一次"}）`; }
      catch (e) { line.textContent = `第 ${i + 1}／${files.length} 張：沒傳成功，請確認網路再試一次`; } }
    inp.value = ""; ready();
    if (okN) { r.photos = (r.photos || 0) + okN; r.photoLog = (r.photoLog || []).concat({ subj, kind, n:okN, t:Date.now() }); save(); beep("ok"); toast(`上傳了 ${okN} 張照片！`); }
  };

}

  const total = items.length, right = () => items.filter(([q, k]) => SQ.ans[k] === q.ans).length;
  if (SQ.graded) app.append($(`<div class="result pop"><div>這一輪</div><div class="big">${right()}／${total}</div><div>${right() === total ? "全對！" : "看完解析，按「錯的再做一次」。"}</div></div>`));
  const act = $(`<div class="actions"></div>`);
  if (!SQ.graded) { const sub = $(`<button class="btn">交卷</button>`);
    sub.onclick = () => { const left = items.filter(([q, k]) => !SQ.ans[k]).length;
      if (left && !sub.dataset.warn) { sub.dataset.warn = 1; sub.textContent = `還有 ${left} 題沒選，再按一次交卷`; return; }
      items.forEach(([q, k]) => SQ.locked[k] = true); SQ.graded = true; const rt = right();
      if (rec.first == null) { rec.first = rt; rec.wrongFirst = items.filter(([q, k]) => SQ.ans[k] !== q.ans).map(([q, k], i) => k); rec.at = Date.now(); }
      if (rt === total) rec.done = true; keepDraft(); save(); render();
      replay(`${x.subj}｜交卷`, items.map(([q, k]) => SQ.ans[k] === q.ans), (p) => { if (p) beep("win"); }); };
    act.append(sub); }
  else if (right() < total) { const again = $(`<button class="btn alt">錯的再做一次</button>`);
    again.onclick = () => { items.forEach(([q, k]) => { if (SQ.ans[k] !== q.ans) { delete SQ.ans[k]; SQ.locked[k] = false; } }); SQ.graded = false; keepDraft(); save(); render(); }; act.append(again); }
  app.append(act);
}
// 家長總覽：最近 7 天的回報與五科練習成績
function parentSchoolEl(d){
  const s = (d && d.school) || {}, reps = s.reports || {}, sets = s.sets || {};
  const days = Object.keys(reps).sort().reverse().slice(0, 7);
  const el = $(`<details class="rep-view"><summary><b>五科讀書回報</b>（${days.length ? "最近 " + days.length + " 天" : "還沒有回報"}）</summary></details>`);
  days.forEach((k) => { const r = reps[k];
    const rows = SUBJS.map((sj) => { const o = (r.subj || {})[sj] || {}; return (o.at || o.did || o.wrong) ? `<tr><th>${sj}</th><td>${esc(o.at)}</td><td>${esc(o.did)}</td><td>${o.wrong !== "" && o.wrong != null ? esc(o.wrong) + " 題" : ""}${(o.why || []).length ? "｜" + esc(o.why.join("、")) : ""}</td></tr>` : ""; }).join("");
    el.append($(`<div style="margin:8px 0"><div><b>${dayName(k)}</b>　${r.sent ? "已交" : "填寫中"}　專心度 ${r.focus || "—"}／5</div>
      ${rows ? `<table><tr><th>科目</th><th>學校上到</th><th>回家寫</th><th>錯題</th></tr>${rows}</table>` : `<div class="small muted">五科都還沒填</div>`}
      ${r.photos ? `<div>照片：${r.photos} 張（${(r.photoLog || []).map((x) => esc(x.subj + x.kind + x.n + "張")).join("、")}）</div>` : ""}${r.learned ? `<div>學到：${esc(r.learned)}</div>` : ""}${r.stuck ? `<div>卡住：${esc(r.stuck)}</div>` : ""}${r.next ? `<div>明天：${esc(r.next)}</div>` : ""}</div>`)); });
  const done = SCHOOL.filter((x) => sets[x.id] && sets[x.id].first != null);
  if (done.length) el.append($(`<div style="margin-top:6px"><b>五科練習成績</b>${done.map((x) => `<div class="small">${esc(x.date)} ${esc(x.subj)}｜${esc(x.title)}：第一次 ${sets[x.id].first}／${x.qs.length}${sets[x.id].done ? "，已全對" : ""}</div>`).join("")}</div>`));
  return el;
}
render();
</script>
