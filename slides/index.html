<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零基礎做出你的電子名片｜Sophia Chen 講義</title>
<meta name="description" content="AI 基礎課第一堂講義：一段話做出電子名片、掛上 GitHub、自己的網址。">
<meta property="og:title" content="零基礎做出你的電子名片｜講義">
<meta property="og:image" content="https://sophiachen.tw/slides/img/slide-01.jpg">
<link rel="icon" href="../card/img/avatar.jpg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1C1B19;color:#F3EFE7;font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:1100px;margin:0 auto;padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:600;line-height:1.4}
  header h1 small{display:block;font-size:12px;color:#8A867E;font-weight:400;letter-spacing:1px;margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;background:#F3EFE7;color:#1C1B19;font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
  .btn.ghost{background:transparent;color:#F3EFE7;border:1px solid #5A5752}
  .stage{max-width:1100px;margin:8px auto 0;padding:0 20px;position:relative}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .nav{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;background:none;border:none}
  .nav.prev{left:0}.nav.next{right:0}
  .bar{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .count{font-size:14px;color:#B9B5AC;font-variant-numeric:tabular-nums}
  .ctrl{display:flex;gap:8px}
  .ctrl button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid #5A5752;background:transparent;color:#F3EFE7;font-size:18px;cursor:pointer}
  .ctrl button:disabled{opacity:.3;cursor:default}
  .strip{max-width:1100px;margin:18px auto 0;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .strip img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;opacity:.55;cursor:pointer;border:2px solid transparent}
  .strip img.on{opacity:1;border-color:#B5642B}
  footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;font-size:13px;color:#8A867E;line-height:1.7}
  footer a{color:#B9B5AC}
  @media (max-width:600px){header h1{font-size:15px}.strip{display:none}}
</style>
</head>
<body>
<header>
  <h1>零基礎做出你的電子名片<small>AI 基礎課 第一堂 ・ Sophia Chen</small></h1>
  <div style="display:flex;gap:8px">
    <a class="btn" href="lesson-01-digital-card.pdf" download="零基礎做出你的電子名片_講義.pdf">下載 PDF</a>
    <a class="btn ghost" href="../card/">回名片</a>
  </div>
</header>
<div class="stage">
  <div class="frame">
    <img id="slide" src="img/slide-01.jpg" alt="第 1 頁">
    <button class="nav prev" aria-label="上一頁" onclick="go(-1)"></button>
    <button class="nav next" aria-label="下一頁" onclick="go(1)"></button>
  </div>
</div>
<div class="bar">
  <span class="count"><span id="cur">1</span> / <span id="total">35</span></span>
  <div class="ctrl">
    <button id="bprev" onclick="go(-1)" aria-label="上一頁">‹</button>
    <button id="bnext" onclick="go(1)" aria-label="下一頁">›</button>
    <button onclick="fs()" aria-label="全螢幕">⛶</button>
  </div>
</div>
<div class="strip" id="strip"></div>
<footer>鍵盤 ← → 翻頁，點畫面左右也可以。講義可自由下載分享，轉載請註明 <a href="https://sophiachen.tw/card">sophiachen.tw</a>。</footer>
<script>
var N=35,i=0,img=document.getElementById('slide'),strip=document.getElementById('strip');
function src(k){return 'img/slide-'+String(k+1).padStart(2,'0')+'.jpg'}
for(var k=0;k<N;k++){var t=document.createElement('img');t.src=src(k);t.loading='lazy';t.alt='第 '+(k+1)+' 頁';t.onclick=(function(k){return function(){set(k)}})(k);strip.appendChild(t)}
function set(k){i=Math.max(0,Math.min(N-1,k));img.src=src(i);img.alt='第 '+(i+1)+' 頁';document.getElementById('cur').textContent=i+1;
  document.getElementById('bprev').disabled=i===0;document.getElementById('bnext').disabled=i===N-1;
  [].forEach.call(strip.children,function(c,j){c.className=j===i?'on':''});
  if(i+1<N){var p=new Image();p.src=src(i+1)}
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function go(d){set(i+d)}
function fs(){var f=document.querySelector('.frame');if(f.requestFullscreen)f.requestFullscreen();else if(f.webkitRequestFullscreen)f.webkitRequestFullscreen()}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
var x0=null;img.parentNode.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
img.parentNode.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(dx<0?1:-1);x0=null});
var h=parseInt(location.hash.slice(1));set(isNaN(h)?0:h-1);
</script>
</body>
</html>
